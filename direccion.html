<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dirección · Semana</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Instrument+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--papel:#F2F4F7;--tinta:#14181F;--tenue:#6B7684;--linea:#DCE1E7;
        --hueco:#fff;--ok:#0E7C5A;--mal:#C2263D;--med:#B07908}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);max-width:680px;
    margin-inline:auto;padding:0 0 50px;
    font:400 16px/1.5 "Instrument Sans",-apple-system,system-ui,sans-serif}
  .m{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  header{background:var(--tinta);color:#fff;padding:20px 16px 18px}
  h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em}
  .hsub{margin:3px 0 0;font-size:12.5px;color:#A7B2BE}
  .tabs{display:flex;gap:6px;padding:12px 16px 0}
  .tab{flex:1;border:1px solid var(--linea);background:var(--hueco);color:var(--tenue);
    border-radius:3px;padding:10px 0;font:700 13.5px inherit;cursor:pointer}
  .tab.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0}
  .chip{flex:0 0 auto;border:1px solid var(--linea);background:var(--hueco);
    color:var(--tenue);border-radius:99px;padding:6px 13px;font:600 12px inherit;cursor:pointer}
  .chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  main{padding:4px 16px}
  .rot{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);margin:24px 0 9px}
  .caja{background:var(--hueco);border:1px solid var(--linea);border-radius:4px;padding:15px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .k{background:var(--hueco);border:1px solid var(--linea);border-radius:4px;padding:13px 14px}
  .k b{display:block;font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:700;
    letter-spacing:-.03em;line-height:1.05}
  .k span{display:block;font-size:11px;color:var(--tenue);margin-top:5px;line-height:1.35}
  .k.w{grid-column:1/-1}
  .pista{height:9px;background:#EDF0F3;border-radius:99px;overflow:hidden;margin-top:9px;position:relative}
  .pista i{display:block;height:100%;border-radius:99px}
  .pista .marca{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta)}
  .alerta{display:flex;gap:11px;background:var(--hueco);border:1px solid var(--linea);
    border-left-width:3px;border-radius:4px;padding:12px 13px;margin-bottom:7px}
  .alerta.p1{border-left-color:var(--mal)} .alerta.p2{border-left-color:var(--med)}
  .alerta.p3{border-left-color:var(--tenue)}
  .ai{font-size:17px;line-height:1.2}
  .at{flex:1;min-width:0}
  .at b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
  .at span{font-size:12.5px;color:var(--tenue);line-height:1.45}
  .acc{background:var(--tinta);color:#fff;border-radius:4px;padding:15px}
  .acc ol{margin:0;padding-left:19px}
  .acc li{font-size:13.5px;line-height:1.55;margin-bottom:9px;color:#E6EAEF}
  .acc li:last-child{margin-bottom:0}
  .acc b{color:#fff}
  .emb{display:flex;flex-direction:column;gap:2px}
  .ef{background:var(--hueco);border:1px solid var(--linea);border-radius:3px;
    padding:11px 13px;display:flex;justify-content:space-between;align-items:baseline}
  .ef b{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:700}
  .ef span{font-size:12.5px;color:var(--tenue)}
  .conv{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11px;
    color:var(--tenue);padding:1px 0}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;color:var(--tenue);
    padding:8px 5px;text-align:right;border-bottom:1px solid var(--linea)}
  th:first-child{text-align:left}
  td{padding:9px 5px;border-bottom:1px solid var(--linea);text-align:right;
    font-variant-numeric:tabular-nums}
  td:first-child{text-align:left;font-weight:600}
  td small{display:block;font-weight:400;font-size:10.5px;color:var(--tenue)}
  tr:last-child td{border-bottom:none}
  .pun{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:700}
  .up{color:var(--ok)} .dn{color:var(--mal)} .pd{color:var(--med)}
  .nota{font-size:11.5px;color:var(--tenue);line-height:1.55;
    border-left:2px solid var(--linea);padding-left:11px;margin:18px 0 0}
  .estado{padding:44px 16px;color:var(--tenue);font-size:14.5px}
</style></head><body>

<header>
  <h1>Dirección</h1>
  <p class="hsub" id="hsub">Leyendo…</p>
</header>
<div id="nav"></div>
<main id="app"></main>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const arriba=(s)=>String(s||"").toUpperCase().trim();
const num=(n)=>Number(n)||0;
const eur=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
const pct=(n)=>n==null?"·":Math.round(n)+"%";
let D={}, vista="decision", fEquipo="";

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.mapValue!==undefined){const o={};for(const[k,x]of Object.entries(f.mapValue.fields||{}))o[k]=val(x);return o;}
  return null;
}
async function leer(col){
  const todo=[]; let tok=null, v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      if(d.createTime) o._creado=String(d.createTime).slice(0,10);
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      todo.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<40);
  return todo;
}
// dd/mm/aa y dd/mm/aaaa, que es como llegan las fechas del CRM
function fecha(v){
  if(!v) return null;
  const s=String(v);
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if(m){ const a=m[3].length===2?"20"+m[3]:m[3];
    return `${a}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return null;
}
const dias=(f)=>{ const d=fecha(f); if(!d) return null;
  const t=new Date(d+"T12:00:00"); return isNaN(t)?null:Math.round((Date.now()-t)/86400000); };

window.setVista=(v)=>{ vista=v; pintar(); };
window.setEq=(v)=>{ fEquipo=v; pintar(); };

function pintar(){
  const l=fEquipo?D.filas.filter(f=>f.equipo===fEquipo):D.filas;
  const equipos=[...new Set(D.filas.map(f=>f.equipo).filter(Boolean))].sort();
  document.getElementById("nav").innerHTML=`
    <div class="tabs">
      <button class="tab${vista==="decision"?" on":""}" onclick="setVista('decision')">Decidir</button>
      <button class="tab${vista==="detalle"?" on":""}" onclick="setVista('detalle')">Detalle</button>
    </div>
    <div class="chips">
      <button class="chip${fEquipo?"":" on"}" onclick="setEq('')">Todos</button>
      ${equipos.map(e=>`<button class="chip${fEquipo===e?" on":""}"
        onclick="setEq('${e}')">${e}</button>`).join("")}
    </div>`;
  document.getElementById("app").innerHTML =
    vista==="decision" ? decidir(l) : detalle(l);
}

// ── Pantalla 1: decidir ──────────────────────────────────────────
function decidir(l){
  const v=l.reduce((s,f)=>s+f.ventas,0);
  const o=l.reduce((s,f)=>s+f.objHasta,0);
  const oa=l.reduce((s,f)=>s+f.objAnual,0);
  const a=l.reduce((s,f)=>s+f.ant,0);
  const cump=o?v/o*100:null;
  // Proyeccion: lo que lleva, al ritmo de lo que lleva, hasta fin de año
  const proy=D.mesesHechos?v/D.mesesHechos*12:0;
  const salud=l.length?l.reduce((s,f)=>s+f.score,0)/l.length:0;
  const col=(x,b,r)=>x==null?"var(--tenue)":x>=b?"var(--ok)":x>=r?"var(--med)":"var(--mal)";

  const al=alertas(l);
  return `
<p class="rot">La semana en cinco cifras</p>
<div class="kpis">
  <div class="k w">
    <b style="color:${col(cump,95,80)}">${pct(cump)}</b>
    <span>del objetivo a estas alturas · ${eur(v)} sobre ${eur(o)}</span>
    <div class="pista">
      <i style="width:${Math.min(oa?v/oa*100:0,100)}%;background:${col(cump,95,80)}"></i>
      <span class="marca" style="left:${Math.min(oa?o/oa*100:0,99)}%"></span>
    </div>
  </div>
  <div class="k"><b class="${v>=a?"up":"dn"}">${a?(v>=a?"+":"")+Math.round((v-a)/a*100)+"%":"·"}</b>
    <span>frente a 2025<br>${eur(v-a)}</span></div>
  <div class="k"><b style="color:${col(salud,70,50)}">${Math.round(salud)}</b>
    <span>salud comercial<br>media de ${l.length} comerciales</span></div>
  <div class="k"><b class="${proy>=oa?"up":"dn"}">${eur(proy)}</b>
    <span>cierre proyectado<br>objetivo ${eur(oa)}</span></div>
  <div class="k"><b style="color:${col(D.retMedia,85,70)}">${pct(D.retMedia)}</b>
    <span>cartera que se conserva<br>${D.perdidos} clientes perdidos</span></div>
</div>

<p class="rot">Qué mirar primero</p>
${al.length?al.map(x=>`
  <div class="alerta p${x.p}">
    <span class="ai">${x.i}</span>
    <div class="at"><b>${x.t}</b><span>${x.d}</span></div>
  </div>`).join(""):'<div class="caja">Sin alertas.</div>'}

<p class="rot">Qué haría esta semana</p>
<div class="acc"><ol>${acciones(l).map(a=>`<li>${a}</li>`).join("")}</ol></div>

${(()=>{
  const sc=window.__SINCASAR__||[];
  if(!sc.length) return "";
  return `<p class="rot">Visitas que no encuentro a quién asignar</p>
  <div class="caja"><table>
    <tr><th>Viene como</th><th>Visitas</th></tr>
    ${sc.slice(0,12).map(([k,n])=>`<tr><td>${k}</td><td class="m">${n}</td></tr>`).join("")}
  </table>
  <p class="nota" style="margin-top:12px">Esos nombres no coinciden con ninguna
  clave de <b>pbi_resumen_agente</b> ni con ninguna ficha de usuario. Sus
  visitas no cuentan para nadie.</p></div>`;
})()}

<p class="nota">
  El objetivo a estas alturas suma los meses ya cerrados del presupuesto de
  cada comercial, no un prorrateo. La proyección extrapola el ritmo actual y
  no corrige estacionalidad: en un negocio con temporada alta al final del
  año, se queda corta.
</p>`;
}

// ── Alertas, ordenadas por lo que cuesta dinero ──────────────────
function alertas(l){
  const A=[];
  const graves=l.filter(f=>f.score<40).sort((a,b)=>b.ventas-a.ventas);
  if(graves.length) A.push({p:1,i:"🔻",t:`${graves.length} comercial${graves.length>1?"es":""} por debajo de 40 de salud`,
    d:graves.slice(0,4).map(f=>`${f.nombre} (${f.score})`).join(" · ')").replace(/'\)/g,"")});

  const fuga=D.clientesFuga.slice(0,5);
  if(fuga.length) A.push({p:1,i:"💸",t:`${D.clientesFuga.length} clientes perdidos de más de 5.000 €`,
    d:`Suman ${eur(D.fugaImporte)} que compraron en 2025 y este año no. Los mayores: `
      +fuga.map(c=>`${c.nombre} (${eur(c.ant)})`).join(" · ")});

  const sinVis=l.filter(f=>f.diasSinVisitar!=null&&f.diasSinVisitar>21)
    .sort((a,b)=>b.diasSinVisitar-a.diasSinVisitar);
  if(sinVis.length) A.push({p:2,i:"🗓️",t:`${sinVis.length} comerciales sin registrar visitas en 3 semanas`,
    d:sinVis.slice(0,4).map(f=>`${f.nombre} (${f.diasSinVisitar} d)`).join(" · ")});

  if(D.ofertasViejas.length) A.push({p:2,i:"📄",t:`${D.ofertasViejas.length} ofertas abiertas de más de 30 días`,
    d:`La más antigua lleva ${D.ofertaMasVieja} días. Cada semana que pasa baja la probabilidad de cierre.`});

  const conv=D.convMuestras;
  if(conv!=null&&conv<15) A.push({p:2,i:"📦",t:`Solo ${Math.round(conv)}% de las muestras acaba en pedido`,
    d:`${D.muAbiertas} muestras siguen abiertas sin resultado. El problema no es enviar, es cerrar.`});

  const caen=l.filter(f=>f.variacion!=null&&f.variacion<-15).sort((a,b)=>a.variacion-b.variacion);
  if(caen.length) A.push({p:3,i:"📉",t:`${caen.length} comerciales caen más de un 15% sobre 2025`,
    d:caen.slice(0,4).map(f=>`${f.nombre} (${Math.round(f.variacion)}%)`).join(" · ")});

  return A.sort((a,b)=>a.p-b.p);
}

function acciones(l){
  const R=[];
  const peor=l.slice().sort((a,b)=>a.score-b.score)[0];
  if(peor&&peor.score<50) R.push(`<b>Acompañar a ${peor.nombre}</b> esta semana. `
    +`Salud ${peor.score}: ${peor.porque}.`);
  if(D.clientesFuga.length) R.push(`<b>Recuperar los cinco clientes perdidos</b> de mayor facturación: `
    +`${eur(D.fugaImporte)} en juego, empezando por ${D.clientesFuga[0].nombre}.`);
  if(D.ofertasViejas.length) R.push(`<b>Revisar las ${D.ofertasViejas.length} ofertas</b> abiertas hace más `
    +`de 30 días. Cerrarlas o darlas por perdidas, pero no dejarlas.`);
  const sin=l.filter(f=>f.visitas===0);
  if(sin.length) R.push(`<b>${sin.length} comerciales no han registrado ninguna visita</b>: `
    +`${sin.slice(0,3).map(f=>f.nombre).join(", ")}. O no visitan, o no lo anotan; conviene saber cuál.`);
  const dorm=D.dormidos;
  if(dorm>0) R.push(`<b>${dorm} clientes llevan más de 60 días sin comprar</b> y compraron este año. `
    +`Es la lista más rentable de trabajar: ya conocen el producto.`);
  if(!R.length) R.push("Sin acciones urgentes. Buen momento para trabajar cartera dormida.");
  return R;
}

// ── Pantalla 2: detalle ──────────────────────────────────────────
function detalle(l){
  const e=D.embudo;
  const conv=(a,b)=>a&&b?`↓ ${Math.round(b/a*100)}%`:"↓ ·";
  return `
<p class="rot">Embudo comercial</p>
<div class="emb">
  <div class="ef"><span>Clientes en cartera</span><b>${e.clientes}</b></div>
  <div class="conv">${conv(e.clientes,e.visitados)}</div>
  <div class="ef"><span>Clientes visitados</span><b>${e.visitados}</b></div>
  <div class="conv">${conv(e.visitados,e.conMuestra)}</div>
  <div class="ef"><span>Con muestra enviada</span><b>${e.conMuestra}</b></div>
  <div class="conv">${conv(e.conMuestra,e.conOferta)}</div>
  <div class="ef"><span>Con oferta</span><b>${e.conOferta}</b></div>
  <div class="conv">${conv(e.conOferta,e.compran)}</div>
  <div class="ef"><span>Compran este año</span><b>${e.compran}</b></div>
</div>
<p class="nota" style="margin-top:10px">
  Cada fase cuenta clientes distintos, no acciones. Un cliente con tres
  muestras cuenta una vez. Las conversiones son entre fases consecutivas.
</p>

<p class="rot">Ranking · índice 0-100</p>
<div class="caja" style="padding:0 13px">
  <table>
    <tr><th>Comercial</th><th>Índice</th><th>Obj</th><th>vs 25</th><th>Retiene</th><th>Visitas</th></tr>
    ${l.slice().sort((a,b)=>b.score-a.score).map(f=>`
      <tr>
        <td>${f.nombre}<small>${f.equipo} · ${eur(f.ventas)}</small></td>
        <td class="pun" style="color:${f.score>=70?"var(--ok)":f.score>=50?"var(--med)":"var(--mal)"}">${f.score}</td>
        <td class="m">${pct(f.pctObj)}</td>
        <td class="m ${f.variacion>=0?"up":"dn"}">${f.variacion==null?"·":(f.variacion>=0?"+":"")+Math.round(f.variacion)+"%"}</td>
        <td class="m">${pct(f.pctRepite)}</td>
        <td class="m">${f.visitas||"·"}</td>
      </tr>`).join("")}
  </table>
</div>
<p class="nota" style="margin-top:10px">
  Índice: 35% cumplimiento de su objetivo · 25% retención de cartera ·
  15% variación sobre 2025 · 10% conversión de muestras ·
  10% conversión de ofertas · 5% clientes nuevos.
  <b>La actividad no puntúa</b>: un comercial de gran cuenta registra menos y
  vende más. Aparece como alerta, no como nota.
</p>

<p class="rot">Cartera · movimiento del año</p>
<div class="caja" style="padding:0 13px">
  <table>
    <tr><th>Comercial</th><th>Repite</th><th>Nuevos</th><th>Perdidos</th><th>Dormidos</th></tr>
    ${l.slice().sort((a,b)=>b.perdido-a.perdido).map(f=>`
      <tr>
        <td>${f.nombre}<small>${f.cartera} clientes</small></td>
        <td class="m">${f.repite||"·"}</td>
        <td class="m up">${f.nuevo||"·"}</td>
        <td class="m dn">${f.perdido||"·"}</td>
        <td class="m pd">${f.dormido||"·"}</td>
      </tr>`).join("")}
  </table>
</div>`;
}

(async()=>{
  try{
    const [res,cli,obj,est,mu,of,vis,portal,usuarios]=await Promise.all([
      leer("pbi_resumen_agente"), leer("pbi_ventas_cliente"), leer("pbi_objetivos"),
      leer("pbi_estacionalidad"), leer("muestras"), leer("ofertas"),
      leer("visitas"), leer("portal_users"), leer("usuarios"),
    ]);
    // Los perfiles creados despues del seed (WK5, WK8, IK3...) no traen
    // grupoAgente en su ficha, asi que hay que emparejarlos por nombre contra
    // el resumen. Sin acentos: "Agustín" y "AGUSTIN" son el mismo.
    const sinAc=(x)=>arriba(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^A-Z0-9]/g,"");
    const TRAD={};
    const porNombre={};
    for(const a of res){
      if(a._id==="_TOTAL") continue;
      porNombre[sinAc(a._id)]=arriba(a._id);
      if(a.agente) porNombre[sinAc(a.agente)]=arriba(a._id);
    }
    for(const f of [...portal,...usuarios]){
      // 1) lo que diga la ficha  2) su nombre contra el resumen
      const d = arriba(f.grupoAgente||f.catalogoVendedor)
        || porNombre[sinAc(f.nombre)] || "";
      if(!d) continue;
      for(const c of [f.crmId,f.username,f._id,f.id,f.nombre])
        if(c) TRAD[arriba(c)]=d;
    }
    // Y el propio nombre del comercial, por si la visita lo trae directo
    for(const [k,v] of Object.entries(porNombre)) if(!TRAD[k]) TRAD[k]=v;
    const ag=(o,...cs)=>{
      for(const c of cs){
        if(!o[c]) continue;
        const v=arriba(o[c]);
        return TRAD[v] || TRAD[sinAc(o[c])] || v;
      }
      return "";
    };

    const mesesHechos=new Date().getMonth();
    const po={}; for(const o of obj) po[arriba(o.agente||o._id)]=o;
    const pe={}; for(const e of est) pe[arriba(e.agente||e._id)]=e;

    // Cartera y clientes en fuga
    const cart={}, fuga=[]; let dormidos=0;
    for(const c of cli){
      if(c.intercompany||c.fusionadoEn) continue;
      const a=arriba(c.agente); if(!a) continue;
      const g=cart[a]=cart[a]||{total:0,repite:0,nuevo:0,perdido:0,dormido:0};
      const act=num(c.ventasAct), ant=num(c.ventasAntYTD);
      g.total++;
      if(act>0&&ant>0) g.repite++;
      else if(act>0) g.nuevo++;
      else if(ant>0){ g.perdido++; if(ant>=5000) fuga.push({nombre:c.nombre||c._id,ant,agente:a}); }
      else g.dormido++;
      // Compró este año pero lleva tiempo sin volver
      const d=dias(c.ultimaVenta);
      if(act>0&&d!=null&&d>60){ g.dormido++; dormidos++; }
    }
    fuga.sort((a,b)=>b.ant-a.ant);

    // Actividad y visitas por comercial, y por cliente para el embudo
    const ABIERTA=(o)=>{
      const e=String(o.estado||"").toLowerCase(), r=String(o.resultado||"").toLowerCase();
      return !["pedido","positivo","positiva","ok","aceptada","ko","negativo",
               "negativa","rechazada","cerrada","perdida"].includes(e||r);
    };
    const GANA=(o)=>["pedido","positivo","positiva","aceptada","ok"]
      .includes(String(o.estado||o.resultado||"").toLowerCase());

    const act={}, cliMu=new Set(), cliOf=new Set(), cliVis=new Set();
    let muOk=0, muTot=0, muAb=0, ofOk=0, ofTot=0;
    const ofertasViejas=[]; let ofertaMasVieja=0;

    for(const o of mu){
      const a=ag(o,"agente","autor","comercial"); if(a){ (act[a]=act[a]||{mu:0,of:0,vis:0,muOk:0,ofOk:0,ult:null}).mu++; }
      if(o.cliente) cliMu.add(arriba(o.cliente));
      muTot++; if(GANA(o)){ muOk++; if(a) act[a].muOk++; } else if(ABIERTA(o)) muAb++;
    }
    for(const o of of){
      const a=ag(o,"agente","autor","comercial"); if(a){ (act[a]=act[a]||{mu:0,of:0,vis:0,muOk:0,ofOk:0,ult:null}).of++; }
      if(o.cliente) cliOf.add(arriba(o.cliente));
      ofTot++; if(GANA(o)){ ofOk++; if(a) act[a].ofOk++; }
      else if(ABIERTA(o)){
        const d=dias(o.fecha||o.fechaCreacion||o._creado);
        if(d!=null&&d>30){ ofertasViejas.push(o); if(d>ofertaMasVieja) ofertaMasVieja=d; }
      }
    }
    const visSinCasar={};
    const clavesRes=new Set(res.map(x=>arriba(x._id)));
    for(const v of vis){
      const a=ag(v,"agente");
      if(!a||!clavesRes.has(a)){
        const bruto=arriba(v.agente)||"(vacío)";
        visSinCasar[bruto]=(visSinCasar[bruto]||0)+1;
        continue;
      }
      const g=act[a]=act[a]||{mu:0,of:0,vis:0,muOk:0,ofOk:0,ult:null};
      g.vis++;
      const f=fecha(v.fecha);
      if(f&&(!g.ult||f>g.ult)) g.ult=f;
      if(v.clienteId) cliVis.add(arriba(v.clienteId));
    }

    // Puntuación 0-100. Cada componente contra el propio comercial.
    const tramo=(v,bien,mal)=>v==null?null:Math.max(0,Math.min(100,(v-mal)/(bien-mal)*100));

    const filas=res.filter(a=>a._id!=="_TOTAL"&&num(a.ventasAct)>0).map(a=>{
      const k=arriba(a._id);
      const c=cart[k]||{total:0,repite:0,nuevo:0,perdido:0,dormido:0};
      const o=po[k]||{}, e=pe[k]||{}, ac=act[k]||{mu:0,of:0,vis:0,muOk:0,ofOk:0,ult:null};

      let hasta=0, hay=false;
      const anual=num(o.objAnual)||num(a.ventasAntFull);
      for(let m=1;m<=mesesHechos;m++) if(o["mes_"+m]!=null){ hasta+=num(o["mes_"+m]); hay=true; }
      if(!hay){ let p=0; for(let m=1;m<=mesesHechos;m++) p+=num(e["peso_"+m]);
        hasta = p ? anual*p : anual*(mesesHechos/12); }

      const ventas=num(a.ventasAct), ant=num(a.ventasAntYTD);
      const pctObj = hasta ? ventas/hasta*100 : null;
      const variacion = ant ? (ventas-ant)/ant*100 : null;
      const pctRepite = (c.repite+c.perdido) ? c.repite/(c.repite+c.perdido)*100 : null;
      const cMu = ac.mu ? ac.muOk/ac.mu*100 : null;
      const cOf = ac.of ? ac.ofOk/ac.of*100 : null;
      const pctNuevo = c.total ? c.nuevo/c.total*100 : null;

      const partes=[
        [tramo(pctObj,100,50),35], [tramo(pctRepite,90,50),25],
        [tramo(variacion,10,-25),15], [tramo(cMu,30,0),10],
        [tramo(cOf,40,0),10], [tramo(pctNuevo,15,0),5],
      ].filter(([v])=>v!=null);
      const peso=partes.reduce((s,[,w])=>s+w,0);
      const score=peso?Math.round(partes.reduce((s,[v,w])=>s+v*w,0)/peso):0;

      const p=[];
      if(pctObj!=null&&pctObj<80) p.push(`va al ${Math.round(pctObj)}% de su objetivo`);
      if(pctRepite!=null&&pctRepite<70) p.push(`ha perdido ${c.perdido} clientes`);
      if(variacion!=null&&variacion<-15) p.push(`cae ${Math.round(variacion)}% sobre 2025`);
      if(!p.length) p.push("sin alertas graves");

      return { id:a._id, nombre:a.agente||a._id, equipo:a.equipo||"",
        ventas, ant, objHasta:hasta, objAnual:anual, pctObj, variacion, pctRepite,
        cartera:c.total, repite:c.repite, nuevo:c.nuevo, perdido:c.perdido, dormido:c.dormido,
        visitas:ac.vis, diasSinVisitar: ac.ult?dias(ac.ult):null,
        score, porque:p.join(", ") };
    });

    const cartTot=filas.reduce((s,f)=>s+f.cartera,0);
    D={ filas, mesesHechos,
      retMedia: filas.length? filas.filter(f=>f.pctRepite!=null)
        .reduce((s,f)=>s+f.pctRepite,0)/Math.max(filas.filter(f=>f.pctRepite!=null).length,1) : null,
      perdidos: filas.reduce((s,f)=>s+f.perdido,0),
      clientesFuga: fuga, fugaImporte: fuga.reduce((s,c)=>s+c.ant,0),
      ofertasViejas, ofertaMasVieja, dormidos, visSinCasar,
      convMuestras: muTot?muOk/muTot*100:null, muAbiertas: muAb,
      embudo:{ clientes:cartTot, visitados:cliVis.size, conMuestra:cliMu.size,
               conOferta:cliOf.size, compran: filas.reduce((s,f)=>s+f.repite+f.nuevo,0) },
    };
    const sc=Object.entries(D.visSinCasar).sort((a,b)=>b[1]-a[1]);
    const perdidas=sc.reduce((s,[,n])=>s+n,0);
    document.getElementById("hsub").textContent=
      `${filas.length} comerciales · ${vis.length} visitas`
      + (perdidas?` · ${perdidas} sin asignar`:"");
    if(perdidas) window.__SINCASAR__=sc;
    pintar();
  }catch(e){
    document.getElementById("app").innerHTML=`<p class="estado">No se ha podido montar: ${e.message}</p>`;
  }
})();
</script></body></html>
