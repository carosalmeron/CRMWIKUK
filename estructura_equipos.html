<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estructura de equipos · Grupo Consolidado</title>
<style>
  :root{
    --tinta:#101A2C;      /* fondo profundo */
    --papel:#F7F8FA;
    --linea:#DFE3EA;
    --texto:#101A2C;
    --tenue:#6B7684;
    --wikuk:#1F9D55;
    --interkey:#C77B14;
    --francia:#2563A8;
    --portugal:#8A3D8F;
    --distrib:#4A5568;
    --alerta:#B4232A;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--papel);color:var(--texto);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--tinta);color:#fff;padding:22px 18px 20px;
  }
  h1{
    margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;
  }
  .sub{margin:5px 0 0;font-size:13px;color:#9AA6B8}
  main{padding:16px 14px 60px;max-width:840px;margin:0 auto}

  .estado{
    padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:14px;
    border:1px solid var(--linea);background:#fff;
  }
  .estado.error{border-color:#F0C2C4;background:#FDF3F3;color:var(--alerta)}
  .estado.ok{border-color:#BFE3CD;background:#F2FAF5;color:#166534}

  /* ── Árbol de la organización: el elemento central ── */
  .rama{
    background:#fff;border:1px solid var(--linea);border-radius:12px;
    margin-bottom:10px;overflow:hidden;
  }
  .rama-cab{
    display:flex;align-items:baseline;gap:10px;padding:13px 15px;
    border-left:4px solid var(--tenue);
  }
  .rama-cab.wikuk{border-left-color:var(--wikuk)}
  .rama-cab.interkey{border-left-color:var(--interkey)}
  .rama-cab.distribuidor{border-left-color:var(--distrib)}
  .rama-cab.francia{border-left-color:var(--francia)}
  .rama-nom{font-weight:800;font-size:15px;letter-spacing:.02em}
  .rama-meta{font-size:12px;color:var(--tenue);margin-left:auto;text-align:right}
  .rama-imp{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}

  .sub-rama{
    padding:9px 15px 9px 30px;border-top:1px solid var(--linea);
    display:flex;align-items:baseline;gap:8px;font-size:13px;
  }
  .punto{width:7px;height:7px;border-radius:50%;flex:none}
  .sub-nom{font-weight:700}
  .sub-meta{margin-left:auto;color:var(--tenue);font-variant-numeric:tabular-nums}

  details.detalle{border-top:1px solid var(--linea)}
  details.detalle summary{
    padding:9px 15px;font-size:12px;color:var(--tenue);cursor:pointer;
    list-style:none;
  }
  details.detalle summary::-webkit-details-marker{display:none}
  details.detalle summary::before{content:"▸ ";}
  details.detalle[open] summary::before{content:"▾ ";}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{
    text-align:left;font-weight:600;color:var(--tenue);font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;padding:6px 15px;
    border-top:1px solid var(--linea);
  }
  td{padding:7px 15px;border-top:1px solid #EFF1F5;font-variant-numeric:tabular-nums}
  td.n{text-align:right}
  .neg{color:var(--alerta)}
  .pos{color:#166534}

  h2{
    font-size:13px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--tenue);margin:26px 0 10px;font-weight:700;
  }

  .aviso{
    background:#FFF9EC;border:1px solid #F0DCA8;border-radius:10px;
    padding:12px 14px;font-size:13px;margin-bottom:14px;
  }

  select,input{
    font:inherit;font-size:12.5px;padding:5px 7px;border:1px solid var(--linea);
    border-radius:7px;background:#fff;color:var(--texto);max-width:130px;
  }
  button{
    font:inherit;font-weight:700;border:none;border-radius:10px;cursor:pointer;
    padding:13px 18px;background:var(--tinta);color:#fff;font-size:14px;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  button.sec{background:#fff;color:var(--texto);border:1px solid var(--linea)}
  button:focus-visible,select:focus-visible{outline:2px solid var(--francia);outline-offset:2px}
  .acciones{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  .vacio{padding:20px 15px;color:var(--tenue);font-size:13px;text-align:center}
  code{background:#EFF1F5;padding:1px 5px;border-radius:4px;font-size:12px}
  .log{
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--tinta);color:#C9D4E4;border-radius:10px;padding:12px 14px;
    margin-top:14px;white-space:pre-wrap;max-height:260px;overflow:auto;
  }
  @media (prefers-reduced-motion:no-preference){
    .rama{transition:box-shadow .18s ease}
  }
</style>
</head>
<body>

<header>
  <h1>Estructura de equipos</h1>
  <p class="sub">Compara los vendedores de Power BI con los usuarios del CRM y da de alta los que faltan.</p>
</header>

<main>
  <div id="estado" class="estado">Cargando datos…</div>

  <h2>Cómo quedaría</h2>
  <div id="arbol"></div>

  <h2>Vendedores sin usuario en el CRM</h2>
  <div id="faltantes"></div>

  <div id="log" class="log" hidden></div>
</main>

<script>
const PROY = "grupo-consolidado-crm";
const BASE = `https://firestore.googleapis.com/v1/projects/${PROY}/databases/(default)/documents`;
const CLAVE_INICIAL = "1234";

// Wikuk e Interkey vienen de Power BI (Agentes[GRUPONIVEL4]). Los comerciales
// franceses de Discob no traen ese campo, así que caen en Francia por defecto.
// Francia y Portugal cuelgan de Interkey, según lo acordado.
const EQUIPOS = {
  _EXCLUIR:     {nombre:"Sin incluir",      color:"var(--tenue)",    padre:null, oculta:true},
  WIKUK:        {nombre:"WIKUK",            color:"var(--wikuk)",    padre:null},
  INTERKEY:     {nombre:"INTERKEY",         color:"var(--interkey)", padre:null},
  FRANCIA:      {nombre:"FRANCIA (Discob)", color:"var(--francia)",  padre:null},
  DISTRIBUIDOR: {nombre:"DISTRIBUIDOR",     color:"var(--distrib)",  padre:null},
};

// Portugal deja de ser una rama: toda su venta se atribuye a Miguel, que es
// quien figura en Power BI como responsable del mercado, y queda en Interkey.
const PORTUGAL_EN = "MIGUEL";
const EQUIPO_DE_MIGUEL = "INTERKEY";


const $ = (id) => document.getElementById(id);
const eur = (n) => Math.round(n||0).toLocaleString("es-ES") + " €";
const val = (f) => {
  if(!f) return null;
  if(f.doubleValue!==undefined)  return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined)  return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  return null;
};
const norm = (s) => String(s||"").toUpperCase().trim()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

let AGENTES = [];    // los que vienen de Power BI
let USUARIOS = [];   // los que ya existen en el CRM
let FALTAN = [];     // los que hay que crear
let CRM_USUARIOS = [];  // usuarios del CRM, para poder reasignar a mano

function estado(msg, tipo){
  const e=$("estado");
  e.textContent=msg;
  e.className="estado"+(tipo?" "+tipo:"");
}
function log(msg){
  const l=$("log");
  l.hidden=false;
  l.textContent += msg + "\n";
  l.scrollTop = l.scrollHeight;
}

// Si una peticion no responde, mejor decirlo que dejar la pantalla colgada.
// Pasa al abrir el archivo desde la vista previa del movil en vez de la web.
function conLimite(promesa, ms, que){
  return Promise.race([
    promesa,
    new Promise((_,rechazar)=>setTimeout(
      ()=>rechazar(new Error(`${que}: sin respuesta en ${ms/1000} s`)), ms)),
  ]);
}

async function leerColeccion(nombre){
  const docs=[]; let token=null, vueltas=0;
  do{
    const url=`${BASE}/${nombre}?pageSize=300${token?`&pageToken=${token}`:""}`;
    const r=await conLimite(fetch(url), 15000, nombre);
    if(!r.ok) throw new Error(`${nombre}: HTTP ${r.status}`);
    const j=await r.json();
    for(const d of (j.documents||[])){
      const o={_id:d.name.split("/").pop()};
      for(const [k,v] of Object.entries(d.fields||{})) o[k]=val(v);
      docs.push(o);
    }
    token=j.nextPageToken||null;
  }while(token && ++vueltas<40);
  return docs;
}

// A qué equipo pertenece un agente de Power BI
function equipoDe(ag){
  // Distribuidor es una figura propia, no encaja en la division comercial:
  // se separa aunque Power BI lo tenga marcado como Wikuk o Interkey.
  if(norm(ag.tipo)==="DISTRIBUIDOR") return "DISTRIBUIDOR";
  const e=norm(ag.equipo);
  if(e==="WIKUK")    return "WIKUK";
  if(e.startsWith("INTERKEY")) return "INTERKEY";
  if(e==="PORTUGAL") return "_PORTUGAL";   // marca temporal, se fusiona
  return "FRANCIA";   // sin GRUPONIVEL4 = comerciales de Discob
}

async function cargar(){
  try{
    const [resumen, usuarios, portal] = await Promise.all([
      leerColeccion("pbi_resumen_agente"),
      leerColeccion("usuarios"),
      leerColeccion("portal_users").catch(()=>[]),
    ]);

    AGENTES = resumen
      .filter(a => a._id !== "_TOTAL")
      .filter(a => (a.ventasAct||0) > 0)
      .map(a => ({
        clave: norm(a._id),
        nombre: a.agente || a._id,
        equipo: equipoDe({equipo:a.equipo, tipo:a.tipo}),
        ventasAct: a.ventasAct||0,
        ventasAntYTD: a.ventasAntYTD||0,
        ventasMes: a.ventasMes||0,
        margen: a.margenPctAct,
        objetivo: a.objetivoMargen,
        variacion: a.variacionPct,
        clientes: a.clientes||0,
        tipo: a.tipo||"",
      }))
      .sort((a,b)=>b.ventasAct-a.ventasAct);

    // ── Consolidar Portugal en un unico comercial ──
    const portugueses = AGENTES.filter(a => a.equipo==="_PORTUGAL");
    let destino = AGENTES.find(a => a.clave===PORTUGAL_EN);
    if(portugueses.length){
      if(!destino){
        // Si Miguel no aparece con ventas propias, se crea la ficha destino
        destino = {clave:PORTUGAL_EN, nombre:PORTUGAL_EN, equipo:EQUIPO_DE_MIGUEL,
          ventasAct:0, ventasAntYTD:0, ventasMes:0, margen:null, objetivo:null,
          variacion:null, clientes:0, tipo:"Comercial", fusiona:[]};
        AGENTES.push(destino);
      }
      destino.equipo=EQUIPO_DE_MIGUEL;
      destino.fusiona = destino.fusiona || [];
      // Margen ponderado por venta: promediar sin ponderar falsearia el dato
      let baseM = (destino.margen!=null ? destino.margen*destino.ventasAct : 0);
      let baseV = (destino.margen!=null ? destino.ventasAct : 0);
      for(const p of portugueses){
        if(p===destino) continue;
        destino.ventasAct    += p.ventasAct;
        destino.ventasAntYTD += p.ventasAntYTD;
        destino.ventasMes    += p.ventasMes;
        destino.clientes     += p.clientes;
        if(p.margen!=null){ baseM += p.margen*p.ventasAct; baseV += p.ventasAct; }
        destino.fusiona.push(p.nombre);
        p.absorbido = true;
      }
      if(baseV) destino.margen = baseM/baseV;
      destino.variacion = destino.ventasAntYTD
        ? (destino.ventasAct-destino.ventasAntYTD)/destino.ventasAntYTD*100 : null;
      AGENTES = AGENTES.filter(a => !a.absorbido);
    }

    USUARIOS = usuarios;

    // Emparejar cada vendedor de Power BI con su usuario del CRM.
    // Se guarda cual es, no solo si existe, para poder corregirlo a mano.
    const porClave = new Map();
    for(const u of [...usuarios, ...portal]){
      for(const c of [u.grupoAgente,u.catalogoVendedor,u.username,u.user,u._id,u.id,u.nombre]){
        if(c && !porClave.has(norm(c))) porClave.set(norm(c), u);
      }
    }
    CRM_USUARIOS = usuarios.filter(u => u.rol==="agente" || u.rol==="crm_agente" || !u.rol);
    for(const a of AGENTES){
      const u = porClave.get(a.clave);
      a.creado = !!u;
      a.usuarioCRM = u ? (u._id||u.id) : null;
      a.usuarioNombre = u ? (u.nombre||u._id) : null;
    }
    FALTAN = AGENTES.filter(a => !a.creado && a.equipo!=="_EXCLUIR");

    const totalPBI = AGENTES.reduce((t,a)=>t+a.ventasAct,0);
    const enCRM = AGENTES.filter(a=>a.creado).reduce((t,a)=>t+a.ventasAct,0);
    estado(
      `${AGENTES.length} vendedores con ventas en Power BI · `+
      `${AGENTES.length-FALTAN.length} ya en el CRM · ${FALTAN.length} por crear. `+
      `El CRM cubre ${eur(enCRM)} de ${eur(totalPBI)} facturados en ${new Date().getFullYear()}.`,
      FALTAN.length ? "" : "ok"
    );

    pintarArbol();
    pintarFaltantes();
  }catch(e){
    const local = location.protocol !== "http:" && location.protocol !== "https:";
    estado(
      local
        ? "Esta página está abierta como archivo local y el móvil bloquea la conexión con Firestore. "+
          "Súbela al repositorio y ábrela desde crmwikuk.vercel.app/estructura_equipos.html"
        : "No se han podido leer los datos: "+e.message+
          ". Comprueba la conexión y que las reglas de Firestore permitan lectura.",
      "error");
  }
}

function pintarArbol(){
  const cont=$("arbol");
  cont.innerHTML="";

  const bloque=(raiz)=>{
    const hijos=Object.keys(EQUIPOS).filter(k=>EQUIPOS[k].padre===raiz);
    const propios=AGENTES.filter(a=>a.equipo===raiz);
    const todos=[...propios, ...hijos.flatMap(h=>AGENTES.filter(a=>a.equipo===h))];
    if(!todos.length) return "";

    const suma=(arr,c)=>arr.reduce((t,a)=>t+a[c],0);
    const vAct=suma(todos,"ventasAct"), vAnt=suma(todos,"ventasAntYTD");
    const varPct = vAnt ? ((vAct-vAnt)/vAnt*100) : null;
    const sinCrear=todos.filter(a=>!a.creado).length;

    let html=`<div class="rama">
      <div class="rama-cab ${raiz.toLowerCase()}">
        <span class="rama-nom">${EQUIPOS[raiz].nombre}</span>
        <span class="rama-meta">
          <span class="rama-imp">${eur(vAct)}</span><br>
          ${todos.length} vendedores${sinCrear?` · <strong>${sinCrear} sin usuario</strong>`:""}
          ${varPct!==null?` · <span class="${varPct<0?"neg":"pos"}">${varPct>0?"+":""}${varPct.toFixed(1)} %</span>`:""}
        </span>
      </div>`;

    for(const h of hijos){
      const ag=AGENTES.filter(a=>a.equipo===h);
      if(!ag.length) continue;
      html+=`<div class="sub-rama">
        <span class="punto" style="background:${EQUIPOS[h].color}"></span>
        <span class="sub-nom">${EQUIPOS[h].nombre}</span>
        <span class="sub-meta">${eur(suma(ag,"ventasAct"))} · ${ag.length} vend.</span>
      </div>`;
    }

    html+=`<details class="detalle"><summary>Ver los ${todos.length} vendedores</summary>
      <table><thead><tr>
        <th>Vendedor Power BI</th><th class="n">2026</th><th>Usuario del CRM</th><th>Rama</th>
      </tr></thead><tbody>`;
    for(const a of todos.sort((x,y)=>y.ventasAct-x.ventasAct)){
      const i=AGENTES.indexOf(a);
      html+=`<tr>
        <td><strong>${a.nombre}</strong><br>
          <span style="color:var(--tenue);font-size:11px">
            ${a.creado?"con usuario":"<span style='color:var(--alerta)'>sin usuario</span>"}
            ${a.margen!=null?" · "+a.margen.toFixed(1)+" % mg":""}
            ${a.fusiona&&a.fusiona.length?"<br>incluye "+a.fusiona.join(", "):""}
          </span></td>
        <td class="n">${eur(a.ventasAct)}<br>
          <span style="color:var(--tenue);font-size:11px" class="${a.variacion<0?"neg":"pos"}">
            ${a.variacion!=null?(a.variacion>0?"+":"")+a.variacion.toFixed(1)+" %":"—"}</span></td>
        <td><select data-u="${i}" onchange="reasignar(this)">
          <option value="">— Crear usuario nuevo —</option>
          ${CRM_USUARIOS.map(u=>{
            const uid=u._id||u.id;
            return `<option value="${uid}"${a.usuarioCRM===uid?" selected":""}>${u.nombre||uid}</option>`;
          }).join("")}
        </select>${a.reasignado?`<br><span style="color:var(--alerta);font-size:11px">sin guardar</span>`:""}</td>
        <td><select data-a="${i}" onchange="moverRama(this)">
          ${Object.keys(EQUIPOS).map(k=>
            `<option value="${k}"${a.equipo===k?" selected":""}>${EQUIPOS[k].nombre}</option>`).join("")}
          <option value="_EXCLUIR"${a.equipo==="_EXCLUIR"?" selected":""}>— No incluir —</option>
        </select></td>
      </tr>`;
    }
    html+=`</tbody></table></details></div>`;
    return html;
  };

  cont.innerHTML = Object.keys(EQUIPOS)
    .filter(k=>!EQUIPOS[k].oculta).map(bloque).join("")
    + bloque("_EXCLUIR");
  const huerfanos=AGENTES.filter(a=>!EQUIPOS[a.equipo]);
  if(huerfanos.length) cont.innerHTML+=`<div class="aviso">${huerfanos.length} vendedores sin equipo reconocible.</div>`;
}

function pintarFaltantes(){
  FALTAN = AGENTES.filter(a => !a.creado && a.equipo!=="_EXCLUIR");
  const cont=$("faltantes");
  if(!FALTAN.length){
    cont.innerHTML=`<div class="rama"><p class="vacio">Todos los vendedores con ventas tienen usuario en el CRM.</p></div>`;
    return;
  }

  const suma=FALTAN.reduce((t,a)=>t+a.ventasAct,0);
  let html=`<div class="aviso">
    Se van a crear <strong>${FALTAN.length} usuarios</strong> con la clave <code>${CLAVE_INICIAL}</code>.
    Entre todos facturan ${eur(suma)} este año, que ahora no se ven en el dashboard.
    Revisa el equipo de cada uno antes de continuar: puedes cambiarlo en la lista.
  </div>
  <div class="rama"><table><thead><tr>
    <th>Vendedor</th><th class="n">2026</th><th>Equipo</th><th>Usuario</th>
  </tr></thead><tbody>`;

  FALTAN.forEach((a,i)=>{
    html+=`<tr>
      <td><strong>${a.nombre}</strong><br>
        <span style="color:var(--tenue);font-size:11px">${a.tipo||"sin clasificar"} · ${a.clientes} clientes</span></td>
      <td class="n">${eur(a.ventasAct)}</td>
      <td><select data-i="${i}" onchange="cambiarEquipo(this)">
        ${Object.keys(EQUIPOS).map(k=>
          `<option value="${k}"${a.equipo===k?" selected":""}>${EQUIPOS[k].nombre}</option>`).join("")}
      </select></td>
      <td><code>${a.clave.toLowerCase()}</code></td>
    </tr>`;
  });

  html+=`</tbody></table></div>
  <div class="acciones">
    <button id="crear" onclick="crearUsuarios()">Crear ${FALTAN.length} usuarios</button>
    <button class="sec" id="guardar" onclick="guardarRamas()">Guardar asignaciones</button>
    <button class="sec" onclick="location.reload()">Recargar</button>
  </div>`;
  cont.innerHTML=html;
}

function reasignar(sel){
  const a=AGENTES[+sel.dataset.u];
  if(!a) return;
  const uid=sel.value||null;
  // Aviso si ese usuario ya esta enganchado a otro vendedor de Power BI:
  // dos vendedores apuntando al mismo usuario sumarian mal.
  const otro = uid && AGENTES.find(x=>x!==a && x.usuarioCRM===uid);
  if(otro && !confirm(
      `${otro.usuarioNombre} ya está asignado a ${otro.nombre}.\n`+
      `Si continúas, ${otro.nombre} se quedará sin usuario. ¿Seguir?`)){
    pintarArbol(); return;
  }
  if(otro){ otro.usuarioCRM=null; otro.usuarioNombre=null; otro.creado=false; otro.reasignado=true; }
  const u=CRM_USUARIOS.find(x=>(x._id||x.id)===uid);
  a.usuarioCRM=uid;
  a.usuarioNombre=u?(u.nombre||uid):null;
  a.creado=!!uid;
  a.reasignado=true;
  pintarArbol();
  pintarFaltantes();
}

function moverRama(sel){
  const a=AGENTES[+sel.dataset.a];
  if(!a) return;
  a.equipo=sel.value;
  if(a.creado) a.pendiente=true;   // hay que guardarlo en su ficha de usuario
  pintarArbol();
  pintarFaltantes();
}

function cambiarEquipo(sel){
  FALTAN[+sel.dataset.i].equipo = sel.value;
  pintarArbol();
}

function aFields(o){
  const f={};
  for(const [k,v] of Object.entries(o)){
    if(v===null||v===undefined) continue;
    if(typeof v==="number") f[k]={doubleValue:v};
    else if(typeof v==="boolean") f[k]={booleanValue:v};
    else f[k]={stringValue:String(v)};
  }
  return {fields:f};
}

// Los agentes que YA tienen usuario y se han movido de rama hay que
// actualizarlos en su ficha, no crearlos de nuevo.
async function guardarRamas(){
  const cambiados=AGENTES.filter(a=>(a.pendiente||a.reasignado) && a.usuarioCRM);
  if(!cambiados.length){ estado("No hay cambios pendientes de guardar."); return; }
  const btn=$("guardar"); if(btn){btn.disabled=true; btn.textContent="Guardando…";}
  log(`— Guardando ${cambiados.length} asignaciones —`);
  let ok=0;
  for(const a of cambiados){
    const uid=a.usuarioCRM;
    try{
      // Se guarda el equipo y, sobre todo, el grupoAgente: es el campo por el
      // que el CRM engancha las ventas de Power BI con cada usuario.
      const campos=["equipo","grupoAgente","catalogoVendedor"];
      const r=await fetch(
        `${BASE}/usuarios/${uid}?`+campos.map(c=>`updateMask.fieldPaths=${c}`).join("&"),{
        method:"PATCH", headers:{"Content-Type":"application/json"},
        body:JSON.stringify(aFields({
          equipo:a.equipo, grupoAgente:a.clave, catalogoVendedor:a.clave})),
      });
      if(!r.ok) throw new Error("HTTP "+r.status);
      a.pendiente=false; a.reasignado=false; ok++;
      log(`  ✓ ${a.nombre} → ${a.usuarioNombre} · ${EQUIPOS[a.equipo].nombre}`);
    }catch(e){ log(`  ✗ ${a.nombre}: ${e.message}`); }
  }
  if(btn){btn.disabled=false; btn.textContent="Guardar asignaciones";}
  estado(`${ok} asignaciones guardadas.`, ok?"ok":"error");
}

async function crearUsuarios(){
  const btn=$("crear");
  btn.disabled=true;
  btn.textContent="Creando…";
  log(`— Alta de ${FALTAN.length} usuarios —`);

  let ok=0, fallos=0;
  for(const a of FALTAN){
    const id=a.clave.toLowerCase();
    // El equipo del CRM solo entiende WIKUK e INTERKEY; Francia y Portugal
    // cuelgan de Interkey, así que sus vendedores se guardan como INTERKEY
    // y conservan su grupo real en el campo subequipo.
    const equipoCRM = a.equipo;   // ramas planas: WIKUK, INTERKEY, FRANCIA, DISTRIBUIDOR
    const usuario={
      id, nombre:a.nombre, rol:"agente",
      equipo:equipoCRM,
      user:id, username:id, grupoAgente:a.clave, catalogoVendedor:a.clave,
      email:"", activo:true, icon:"🧑‍💼",
      color: {WIKUK:"#1F9D55",INTERKEY:"#C77B14",FRANCIA:"#2563A8",DISTRIBUIDOR:"#4A5568"}[a.equipo]||"#6B7684",
      creadoDesde:"estructura_equipos",
      creadoEl:new Date().toISOString(),
    };
    try{
      let r=await fetch(`${BASE}/usuarios/${id}`,{
        method:"PATCH", headers:{"Content-Type":"application/json"},
        body:JSON.stringify(aFields(usuario)),
      });
      if(!r.ok) throw new Error(`usuarios ${r.status}`);

      r=await fetch(`${BASE}/portal_users/${id}`,{
        method:"PATCH", headers:{"Content-Type":"application/json"},
        body:JSON.stringify(aFields({
          username:id, password:CLAVE_INICIAL, nombre:a.nombre,
          equipo:equipoCRM, catalogoVendedor:a.clave, activo:true,
          creadoEl:new Date().toISOString(),
        })),
      });
      if(!r.ok) throw new Error(`portal_users ${r.status}`);

      ok++;
      log(`  ✓ ${a.nombre.padEnd(18)} ${id} · ${EQUIPOS[a.equipo].nombre}`);
    }catch(e){
      fallos++;
      log(`  ✗ ${a.nombre}: ${e.message}`);
    }
  }

  log(`— ${ok} creados, ${fallos} con error —`);
  btn.textContent = fallos ? `${ok} creados, ${fallos} fallaron` : `${ok} usuarios creados`;
  estado(
    fallos ? `Se han creado ${ok} usuarios y ${fallos} han fallado. Revisa el detalle de abajo.`
           : `Listo: ${ok} usuarios creados con la clave ${CLAVE_INICIAL}. Entra en el CRM y recarga el dashboard.`,
    fallos ? "error" : "ok"
  );
}

cargar();
</script>
