<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Traslados · SAP</title>
<style>
:root{--verde:#16A34A;--rojo:#DC2626;--muted:#475569;--line:#CBD5E1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:18px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;background:#F1F5F9;color:#0F172A}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0F172A;color:#fff;font-weight:800}
.top span{flex:1}.top button,.top select{font:inherit;font-size:15px;background:#1E293B;color:#fff;border:2px solid #475569;border-radius:10px;padding:6px 10px}
.w{max-width:820px;margin:0 auto;padding:14px}
.card{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:22px}.s{font-size:15px;color:var(--muted)}
.lin{border-top:1px solid #E2E8F0;padding:10px 0;margin-top:8px}
.lin .t{font-size:20px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:3px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:17px;font-weight:800}.chip.on{border-color:var(--verde);background:#DCFCE7}
input.u{width:120px;font-size:22px;padding:10px;border:3px solid var(--line);border-radius:12px;text-align:right}
.big{display:block;width:100%;border:0;border-radius:16px;padding:18px;font-size:22px;font-weight:900;margin-top:12px;background:var(--verde);color:#fff}
.big[disabled]{opacity:.5}
.ok{background:#DCFCE7;color:#166534;border-radius:14px;padding:12px;font-weight:800;margin-top:8px}.ko{background:#FEE2E2;color:#991B1B;border-radius:14px;padding:12px;font-weight:800;margin-top:8px}
.spin{text-align:center;padding:40px;color:var(--muted)}
.cfg input,.cfg select{width:100%;font-size:18px;padding:10px;border:3px solid var(--line);border-radius:12px;margin:4px 0 10px}
</style></head><body>
<div class="top"><span>🚚 Traslados por recibir</span><select id="fDest" onchange="DEST=this.value;try{localStorage.setItem('tras_dest',DEST)}catch(e){};cargar()"><option value="">Todos los almacenes</option></select><button onclick="cargar()">↻</button><button onclick="ajustes()">⚙️</button></div>
<div class="w" id="v"><div class="spin">Cargando…</div></div>
<script>/* pase SAP: lo da el portal al entrar */
(function(){
  // Pase de SAP: lo da el portal al entrar (usuario y contraseña del portal, una vez cada 30 días).
  // Aquí no se pide ninguna contraseña: si falta el pase, se explica y se ofrece salir y volver a entrar.
  var K='sap_pedido_key';
  function galleta(){ var m=/(?:^|;\s*)sap_pase=([^;]+)/.exec(document.cookie||''); return m?decodeURIComponent(m[1]):''; }
  function get(){ var t=''; try{ t=localStorage.getItem(K)||''; }catch(e){} return exp(t)>Date.now()?t:galleta(); }
  function exp(t){ var m=/^crm\.([A-Za-z0-9_-]+)\./.exec(t||''); if(!m) return 0; try{ return JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))).exp||0; }catch(e){ return 0; } }
  var abierto=false;
  function ventana(motivo){
    if(abierto) return; abierto=true;
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif');
    d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:380px;width:100%;padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.3)">'
      +'<div style="font-weight:800;font-size:18px">🔐 Falta el permiso de SAP</div>'
      +'<div style="font-size:14px;color:#334155;margin:8px 0 14px;line-height:1.45">'+(motivo||'Este aparato todavía no tiene permiso para SAP.')+'<br><br>Sal del portal y vuelve a entrar con tu usuario: el permiso se activa solo y dura 30 días.'+(function(){ var e=''; try{ e=localStorage.getItem('sap_pase_error')||''; }catch(x){} return e?'<div style="margin-top:10px;background:#FEE2E2;color:#991B1B;border-radius:8px;padding:8px;font-weight:700">Último intento: '+String(e).replace(/[<>&]/g,'')+'</div>':''; })()+'</div>'
      +'<button id="sp_out" style="width:100%;font-size:17px;font-weight:800;padding:12px;border:0;border-radius:10px;background:#0F172A;color:#fff">Salir y volver a entrar</button>'
      +'<button id="sp_x" style="width:100%;font-size:15px;font-weight:700;padding:10px;border:0;background:transparent;color:#64748B;margin-top:6px">Ahora no</button></div>';
    document.body.appendChild(d);
    document.getElementById('sp_x').onclick=function(){ d.remove(); abierto=false; };
    document.getElementById('sp_out').onclick=function(){
      try{ localStorage.removeItem(K); localStorage.removeItem('gc_portal_user'); }catch(e){}
      try{ if(window.top&&window.top.doLogout){ window.top.doLogout(); return; } }catch(e){}
      try{ window.top.location.href='/'; }catch(e){ location.href='/'; }
    };
  }
  // Intento automático: con la sesión del portal abierta en ESTE navegador (gc_portal_user), se lee la ficha del usuario
  // y se pide el pase sin preguntar nada. Así funciona en Safari, Chrome o cualquier navegador donde se haya entrado al portal.
  async function auto(){
    var pu=null; try{ pu=JSON.parse(localStorage.getItem('gc_portal_user')||'null'); if(!pu||!pu.id){ var sid=localStorage.getItem('sap_portal_id')||decodeURIComponent((/(?:^|;\s*)sap_portal_id=([^;]+)/.exec(document.cookie)||[])[1]||''); if(sid) pu={id:sid}; } }catch(e){}
    if(!pu||!pu.id) return 'no hay sesión del portal en este navegador';
    var h=pu.passHash||'';
    if(!h){ try{ var FB='https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents';
      for(var col of ['portal_users','usuarios']){ var r=await fetch(FB+'/'+col+'/'+encodeURIComponent(pu.id)); if(!r.ok) continue; var j=await r.json(); var f=(j.fields||{}).passHash; if(f&&f.stringValue){ h=f.stringValue; break; } } }catch(e){} }
    if(!h) return 'no encuentro la ficha del usuario '+pu.id;
    try{ var r2=await fetch('/api/sap-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:pu.id,passHash:h})});
      var j2=await r2.json().catch(function(){ return {ok:false,error:'HTTP '+r2.status}; });
      if(j2&&j2.ok&&j2.token){ try{ localStorage.setItem(K,j2.token); localStorage.removeItem('sap_pase_error'); }catch(e){} return ''; }
      return (j2&&j2.error)||'sin respuesta'; }catch(e){ return 'no se llega al servidor: '+e.message; } }
  var intentado=false;
  async function resolver(motivo){
    if(!intentado){ intentado=true; var err=await auto(); if(!err){ location.reload(); return; } try{ localStorage.setItem('sap_pase_error',err); }catch(e){} }
    ventana(motivo);
  }
  window.pedirPaseSap=resolver;
  var f0=window.fetch;
  window.fetch=function(u,o){ return f0.apply(this,arguments).then(function(r){ try{ if(r.status===401&&/\/api\/sap-(pedido|factura|produccion|traslado|planificacion)/.test(String(u&&u.url||u))) setTimeout(function(){ resolver(exp(get())?'El permiso guardado ya no vale.':''); },0); }catch(e){} return r; }); };
  if(!(exp(get())>Date.now())){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ resolver(); }); else resolver(); }
})();
</script>
<script>
const API="/api/sap-traslado";
let DB=(()=>{ try{ return localStorage.getItem("obr_db")||"U_CARO_99"; }catch(e){ return "U_CARO_99"; } })();
let KEY=(()=>{ try{ return localStorage.getItem("sap_pedido_key")||""; }catch(e){ return ""; } })();
let DEST=(()=>{ try{ return localStorage.getItem("tras_dest")||""; }catch(e){ return ""; } })();
let SOL=[], LOT={};
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const r3=(v)=>Math.round((Number(v)||0)*1000)/1000, n=(v)=>r3(v).toLocaleString("es-ES"), fx=(d)=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7):"";
async function api(url,opts){ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(DB),Object.assign({headers:{"Content-Type":"application/json","x-crm-key":KEY}},opts||{})); const j=await r.json().catch(()=>({ok:false,error:"sin respuesta"})); if(r.status===401) throw new Error("La clave no vale: ⚙️"); return j; }
window.ajustes=()=>{ document.getElementById("v").innerHTML='<div class="card cfg"><h3>⚙️ Ajustes</h3><div class="s">Clave</div><input id="cK" type="password" value="'+esc(KEY)+'"><div class="s">Base de SAP</div><select id="cD"><option value="U_CARO_99"'+(DB==="U_CARO_99"?" selected":"")+'>U_CARO_99 · PRUEBAS</option><option value="U_CARO_00"'+(DB==="U_CARO_00"?" selected":"")+'>U_CARO_00 · REAL</option></select><button class="big" onclick="guardar()">Guardar</button></div>'; };
window.guardar=()=>{ KEY=document.getElementById("cK").value.trim(); DB=document.getElementById("cD").value; try{ localStorage.setItem("sap_pedido_key",KEY); localStorage.setItem("obr_db",DB); }catch(e){} iniciar(); };
async function iniciar(){ try{ const j=await api(API+"?almacenes=1"); if(!j.ok) throw new Error(j.error); const S=document.getElementById("fDest"); S.innerHTML='<option value="">Todos los almacenes</option>'+(j.almacenes||[]).map(a=>'<option value="'+esc(a.codigo)+'"'+(a.codigo===DEST?' selected':'')+'>Recibe '+esc(a.codigo)+'</option>').join(""); cargar(); }
  catch(e){ document.getElementById("v").innerHTML='<div class="ko">'+esc(e.message)+'</div>'; } }
async function cargar(){ const V=document.getElementById("v"); V.innerHTML='<div class="spin">Buscando traslados…</div>';
  try{ const j=await api(API+"?solicitudes=1"+(DEST?"&destino="+encodeURIComponent(DEST):"")); if(!j.ok) throw new Error(j.error); SOL=j.solicitudes||[];
    // Para cada línea, lote propuesto: el del texto de la solicitud
    SOL.forEach(s=>s.lineas.forEach(l=>{ l.elegidos=l.lote?[{lote:l.lote,uds:l.uds}]:[]; l.recibe=l.uds; }));
    pintar(); }
  catch(e){ V.innerHTML='<div class="ko">'+esc(e.message)+'</div>'; } }
function pintar(){ const V=document.getElementById("v");
  if(!SOL.length){ V.innerHTML='<div class="card"><h3>✅ No hay nada pendiente de recibir</h3><div class="s">'+(DEST?'en '+esc(DEST):'')+(DB!=="U_CARO_00"?' · PRUEBAS':'')+'</div></div>'; return; }
  V.innerHTML=(DB!=="U_CARO_00"?'<div class="ko" style="background:#FEF3C7;color:#92400E">PRUEBAS: no cuenta de verdad</div>':'')+SOL.map((s,i)=>'<div class="card" id="sol'+i+'"><h3>'+esc(s.origen)+' → '+esc(s.destino)+'</h3><div class="s">Solicitud '+esc(s.num)+' · '+fx(s.fecha)+(s.comentario?' · '+esc(s.comentario):'')+'</div>'
    +s.lineas.map((l,k)=>'<div class="lin"><div class="t">'+esc(l.descripcion||l.articulo)+'</div><div class="s">'+esc(l.articulo)+' · pide <b>'+n(l.uds)+'</b></div>'
      +'<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span class="s">Recibo</span><input class="u" type="number" inputmode="decimal" value="'+esc(l.recibe)+'" oninput="SOL['+i+'].lineas['+k+'].recibe=Number(this.value)||0;ajLote('+i+','+k+')"></div>'
      +'<div class="s" style="margin-top:6px">Lote:</div><div class="chips" id="ch'+i+'_'+k+'">'+chipsH(i,k)+'</div></div>').join("")
    +'<button class="big" id="b'+i+'" onclick="confirmar('+i+')">✅ Recibido</button><div id="r'+i+'"></div></div>').join("");
  SOL.forEach((s,i)=>s.lineas.forEach((l,k)=>{ if(!LOT[l.articulo+"|"+s.origen]) cargarLotes(i,k); })); }
function chipsH(i,k){ const s=SOL[i], l=s.lineas[k], disp=LOT[l.articulo+"|"+s.origen]||[];
  const todos=[...new Set([...(l.elegidos||[]).map(x=>x.lote),...disp.map(x=>x.lote)])];
  return todos.length?todos.slice(0,10).map(lo=>{ const on=(l.elegidos||[]).find(x=>x.lote===lo); const d=disp.find(x=>x.lote===lo); return '<button class="chip'+(on?' on':'')+'" onclick="tog('+i+','+k+',\''+esc(lo).replace(/'/g,"")+'\')">'+esc(lo)+(d&&d.cantidad!=null?' · hay '+n(d.cantidad):'')+'</button>'; }).join(""):'<span class="s">Buscando lotes…</span>'; }
async function cargarLotes(i,k){ const s=SOL[i], l=s.lineas[k], key=l.articulo+"|"+s.origen; LOT[key]=LOT[key]||[];
  try{ const j=await api("/api/sap-traslado?lotes="+encodeURIComponent(l.articulo)+"&almacen="+encodeURIComponent(s.origen)); LOT[key]=(j.lotes||[]); }catch(e){}
  SOL.forEach((s2,i2)=>s2.lineas.forEach((l2,k2)=>{ if(l2.articulo+"|"+s2.origen===key){ const e=document.getElementById("ch"+i2+"_"+k2); if(e) e.innerHTML=chipsH(i2,k2); } })); }
window.tog=(i,k,lo)=>{ const l=SOL[i].lineas[k]; const j=l.elegidos.findIndex(x=>x.lote===lo); if(j>=0) l.elegidos.splice(j,1); else l.elegidos=[{lote:lo,uds:l.recibe}]; ajLote(i,k); document.getElementById("ch"+i+"_"+k).innerHTML=chipsH(i,k); };
window.ajLote=(i,k)=>{ const l=SOL[i].lineas[k]; if(l.elegidos.length===1) l.elegidos[0].uds=l.recibe; };
window.confirmar=async(i)=>{ const s=SOL[i]; const b=document.getElementById("b"+i), R=document.getElementById("r"+i);
  const L=s.lineas.filter(l=>l.recibe>0); if(!L.length){ R.innerHTML='<div class="ko">Pon cuánto recibes</div>'; return; }
  b.disabled=true; b.textContent="Guardando…";
  try{ const j=await api(API,{method:"POST",body:JSON.stringify({db:DB,accion:"confirmar",entry:s.entry,lineas:L.map(l=>({linea:l.linea,uds:l.recibe,lotes:l.elegidos}))})});
    if(j.ok){ R.innerHTML='<div class="ok">✅ '+esc(j.mensaje)+'</div>'; b.textContent="Hecho"; setTimeout(cargar,2500); }
    else { R.innerHTML='<div class="ko">'+esc(j.error||"error")+'</div>'; b.disabled=false; b.textContent="✅ Recibido"; } }
  catch(e){ R.innerHTML='<div class="ko">'+esc(e.message)+'</div>'; b.disabled=false; b.textContent="✅ Recibido"; } };
iniciar();
</script><script>(function(){ if(!/[?&]menu=1/.test(location.search)) return; var b=document.createElement('a'); b.href='produccion_menu.html'; b.textContent='← Producción'; b.setAttribute('style','display:block;background:#0F172A;color:#fff;font:700 14px system-ui,sans-serif;padding:9px 14px;text-decoration:none'); document.body.insertBefore(b,document.body.firstChild); })();</script>
</body></html>
