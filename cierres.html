<title>Cierre de la semana</title>
<!--
  (oct 2026) CIERRE DE LA SEMANA · puerta única
  Se entra desde el portal (index) y desde el botón «Cerrar semana» del CRM.
  Cada uno ve lo que le toca según su papel:
    comercial  → su cierre (jueves 23:59) y el acta de su comité
    jefe       → los comités del viernes con su equipo y su cierre (viernes 20:00)
    director   → cómo van los equipos y su cierre (sábado 9:00)
    ceo        → el resumen de todo y el cierre de la semana del grupo (sábado 13:00)
    admin      → Administración de clientes: revisión de cobros (viernes 14:00)
  Fase 1: las pantallas de cierre de cada uno son todavía las de siempre
  (cierre_semanal.html, objetivos_equipo.html, cobros.html) y se abren desde
  aquí. Lo nuevo es el flujo, los plazos, el comité con acta y los cierres de
  Administración y del CEO. Se guarda en la colección «cierres_flujo»:
    <año>_s<semana>_comite_<COMERCIAL> · <año>_s<semana>_admin · <año>_s<semana>_ceo
  Las acciones del comité para el comercial van a «objetivos_semana» (semana
  siguiente) y le salen en su parte en «Lo que te pidió tu jefe».
-->

<script>
// ══ Parámetros ════════════════════════════════════════════════════════
const Q=new URLSearchParams(location.search);
const U=(s)=>String(s||"").toUpperCase().trim();
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const ROL=(()=>{ const r=(Q.get("rol")||"comercial").toLowerCase();
  if(["jefe","crm_jefe"].includes(r)) return "jefe";
  if(["director","crm_director"].includes(r)) return "director";
  if(r==="ceo") return "ceo";
  if(["admin","administracion","adm"].includes(r)) return "admin";
  return "comercial"; })();
const AGENTE=U(Q.get("agente")), UID=(Q.get("uid")||"").trim(), EQUIPO=U(Q.get("equipo")), NOMBRE=(Q.get("nombre")||"").trim();
// Mientras se valida el sistema el CEO recibe copia de todas las actas. Para quitarlo: false
const CC_CEO_VALIDACION=true;
const EQUIPOS_NO_AGENTE=["WIKUK","INTERKEY","FRANCIA","DISTRIBUIDOR"];
const ROL_COM=["agente","crm_agente","comercial","vendedor"];
// Francia no entra en los cierres. Distribuidor puede cerrar, pero es opcional:
// no cuenta como pendiente, ni fuera de plazo, ni para que cierre el siguiente.
const FUERA=(eq)=>/FRANC/i.test(eq||""), OPCIONAL=(eq)=>/DISTRIB/i.test(eq||"");
const PAPEL_TXT={comercial:"Comercial",jefe:"Jefe de equipo",director:"Director comercial",ceo:"CEO",admin:"Administración de clientes"};

// ══ Semanas y plazos ══════════════════════════════════════════════════
function isoSem(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  const a=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return {anio:t.getUTCFullYear(),sem:Math.ceil((((t-a)/86400000)+1)/7)}; }
function lunes(anio,sem){ const e=new Date(anio,0,4), l=new Date(e);
  l.setDate(e.getDate()-((e.getDay()||7)-1)); l.setDate(l.getDate()+(sem-1)*7); l.setHours(0,0,0,0); return l; }
let W=(()=>{ const s=Number(Q.get("semana")), hoy=isoSem(new Date());
  return s?{anio:Number(Q.get("anio"))||hoy.anio,sem:s}:hoy; })();
// [día desde el lunes, hora, minuto, texto]
const PLAZO={com:[3,23,59,"jueves 23:59"],comite:[4,18,0,"viernes"],admin:[4,14,0,"viernes 14:00"],
             jefe:[4,20,0,"viernes 20:00"],director:[5,9,0,"sábado 9:00"],ceo:[5,13,0,"sábado 13:00"]};
const limite=(k)=>{ const p=PLAZO[k], d=lunes(W.anio,W.sem); d.setDate(d.getDate()+p[0]); d.setHours(p[1],p[2],0,0); return d; };
const pasado=(k)=>new Date()>limite(k);
const tarde=(k,iso)=>{ const t=Date.parse(iso||""); return !isNaN(t)&&t>limite(k).getTime(); };
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
const cuando=(iso)=>{ const d=new Date(iso||""); if(isNaN(d)) return "";
  return DIAS[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const semSig=()=>{ const l=lunes(W.anio,W.sem); l.setDate(l.getDate()+7); return isoSem(l); };
const idFlujo=(paso,quien)=>W.anio+"_s"+W.sem+"_"+paso+(quien?"_"+String(quien).replace(/[\/\s#?]/g,"_"):"");

// ══ Firestore ═════════════════════════════════════════════════════════
const FB=RC.FB;
async function consultaSemana(col){
  const r=await fetch(FB+":runQuery",{method:"POST",headers:{"Content-Type":"application/json"},cache:"no-store",
    body:JSON.stringify({structuredQuery:{from:[{collectionId:col}],
      where:{fieldFilter:{field:{fieldPath:"semana"},op:"EQUAL",value:{integerValue:String(W.sem)}}}}})});
  if(!r.ok) throw new Error(col+": HTTP "+r.status);
  return ((await r.json())||[]).filter(x=>x.document).map(x=>RC.desdeFB(x.document));
}
async function escribir(col,id,doc){
  const qs=Object.keys(doc).filter(k=>k!=="_id").map(k=>"updateMask.fieldPaths="+encodeURIComponent(k)).join("&");
  const r=await fetch(`${FB}/${col}/${encodeURIComponent(id)}?${qs}`,{method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({fields:RC.aFB(doc)})});
  if(!r.ok) throw new Error("No se ha guardado (HTTP "+r.status+")");
}
const deJSON=(s,def)=>{ if(s&&typeof s==="object") return s; try{ return JSON.parse(s||""); }catch(e){ return def; } };

// ══ Datos de la semana ════════════════════════════════════════════════
let D=null;   // {us, informes, flujo, coms, jefes, dirs, equipos, yo}
const rolDe=(f)=>String(f.rol||"").toLowerCase();
const clavesDe=(f)=>[f.grupoAgente,f.catalogoVendedor,f._id,f.id,f.username,f.crmId]
  .map(U).filter((c,i,a)=>c&&EQUIPOS_NO_AGENTE.indexOf(c)<0&&a.indexOf(c)===i);
const codDe=(f)=>[f.grupoAgente,f.catalogoVendedor].map(U).filter(c=>c&&EQUIPOS_NO_AGENTE.indexOf(c)<0)[0]||U(f._id);
const nombreDe=(f)=>f.nombre||f.username||f._id;
const iniciales=(n)=>String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();

// ── Lista de comerciales: copia fiel de cargarUsuarios() de objetivos_equipo.html ──
function listaComerciales(us,pu,res){
  const A=window.Agentes||{conocido:()=>false,id:x=>x,nombre:x=>x,equipo:()=>"",alias:()=>[]};
  const NO_PERSONA=/^(interc|clientsdirect|cataluna|cataluña|tienda|telefono|sinagente|_?total|campofrio|wikuk|interkey|francia|distribuidor)/i;
  const esCanal=(x)=>NO_PERSONA.test(String(x||"").replace(/[.\s_-]/g,""));
  const map={}, PU_IDS=new Set(pu.map(p=>p._id)), PORTAL_FIJOS=new Set(["wk1","wk2","wk3","ik1","ik2"]);
  const pareceCodigo=(n)=>!n||/^u_\d+$/i.test(n)||/^[a-z0-9_.]+$/.test(n);
  [...us,...pu].forEach(u=>{
    const rol=String(u.rol||"").toLowerCase();
    if(!ROL_COM.includes(rol)) return;
    if(u.activo===false||String(u.activo)==="false") return;
    const esCuenta=PU_IDS.has(u._id)||PORTAL_FIJOS.has(String(u._id||"").toLowerCase())||PORTAL_FIJOS.has(String(u.crmId||"").toLowerCase());
    const posibles=[u.id,u._id,u.crmId,u.grupoAgente,u.catalogoVendedor,u.username,u.nombre].filter(Boolean);
    let canon=null, ficha=null;
    for(const k of posibles){ if(A.conocido(k)){ canon=A.id(k); ficha=k; break; } }
    if(!canon){ canon=u.id||u._id||u.username; ficha=canon; }
    if(!canon) return;
    const cands=[u.nombre,A.nombre(ficha),u.username,canon].map(x=>String(x||"").trim()).filter(Boolean);
    const nombre=cands.find(n=>!pareceCodigo(n))||cands[0]||canon;
    if(esCanal(nombre)||esCanal(canon)||esCanal(u.catalogoVendedor)) return;
    if(!map[canon]) map[canon]={id:canon,nombre,equipo:U(A.equipo(ficha)||u.equipo||""),
      cod:U(u.grupoAgente||u.catalogoVendedor||canon),alias:A.alias(ficha),
      entrega:String(u.entregaParte||"").toLowerCase(),cuenta:esCuenta};
    else{ const m=map[canon];
      if(pareceCodigo(m.nombre)&&!pareceCodigo(nombre)) m.nombre=nombre;
      else if(nombre.length>m.nombre.length&&!pareceCodigo(nombre)) m.nombre=nombre;
      if(esCuenta) m.cuenta=true;
      if(!m.equipo&&u.equipo) m.equipo=U(u.equipo);
      if(!m.entrega&&u.entregaParte) m.entrega=String(u.entregaParte).toLowerCase(); }
  });
  const nomN=(x)=>String(x||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
  const porNom={};
  Object.values(map).forEach(u=>{ const k=nomN(u.nombre); if(!k) return; const m=porNom[k];
    if(!m){ porNom[k]=u; return; }
    const [base,otro]=(u.cuenta&&!m.cuenta)?[u,m]:[m,u];
    base.alias=[...new Set([...(base.alias||[]),...(otro.alias||[]),U(otro.id),U(otro.cod)])];
    base.cuenta=base.cuenta||otro.cuenta; base.entrega=base.entrega||otro.entrega; base.equipo=base.equipo||otro.equipo;
    if(pareceCodigo(base.nombre)&&!pareceCodigo(otro.nombre)) base.nombre=otro.nombre;
    porNom[k]=base; });
  let l=Object.values(porNom).filter(u=>!/^u_\d+$/i.test(u.nombre));
  const eqDe={}; (res||[]).forEach(r=>{ if(r.equipo) eqDe[U(r.agente||r._id)]=U(r.equipo); });
  l.forEach(u=>{ if(!u.equipo){ const k=[u.cod,u.id,...(u.alias||[])].map(U).find(x=>eqDe[x]); if(k) u.equipo=eqDe[k]; } });
  // Fuera quien no tiene que entregar parte («no entrega» o sin usuario en el portal)
  l=l.filter(u=>!(u.entrega==="no"||(u.entrega!=="si"&&!u.cuenta)));
  return l.sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
async function cargar(){
  const [us,pu,res,inf,flu]=await Promise.all([RC.leer("usuarios",10),RC.leer("portal_users",10),
    RC.leer("pbi_resumen_agente",10).catch(()=>[]),consultaSemana("informes"),consultaSemana("cierres_flujo").catch(()=>[]),
    (window.Agentes?Agentes.cargar():Promise.resolve())]);
  const porId={}; us.forEach(f=>porId[f._id]=f);
  const dup=(f)=>f.duplicadaDe&&f.duplicadaDe!==f._id&&porId[f.duplicadaDe]&&!porId[f.duplicadaDe].duplicadaDe;
  const activos=us.filter(f=>f.activo!==false&&String(f.activo)!=="false"&&!dup(f)&&String(f.entregaParte||"").toLowerCase()!=="no");
  // Informes de este año (el mismo número de semana de otro año no vale)
  const informes=inf.filter(d=>{ if(!d||d.estado==="borrador") return false;
    let y=Number(d.anio||d.ano)||0; if(!y){ const m=String(d.fechaEnvio||"").match(/(\d{4})/); y=m?Number(m[1]):0; }
    return !y||y===W.anio; });
  const flujo=flu.filter(d=>Number(d.anio)===W.anio);
  const informeDe=(f)=>{ const cl=clavesDe(f); return informes.find(d=>cl.includes(U(d.agente))||[f._id,f.id].includes(String(d.uid||""))); };
  const persona=(f,papel)=>({f,papel,id:f._id,cod:codDe(f),claves:clavesDe(f),nombre:nombreDe(f),equipo:U(f.equipo),inf:informeDe(f),opc:OPCIONAL(f.equipo)});
  // Comerciales: la MISMA lista que el cierre del director (objetivos_equipo.html,
  // cargarUsuarios): se unen las fichas de la misma persona, fuera canales e
  // intercompañía, y fuera quien tiene «no entrega parte» o no tiene usuario.
  const coms=listaComerciales(us,pu,res).filter(c=>!FUERA(c.equipo)).map(c=>{
    const cl=[...new Set([...(window.Agentes?Agentes.alias(c.id):[]),...(c.alias||[]),U(c.cod),U(c.id)].map(U).filter(Boolean))];
    return {f:c,papel:"comercial",id:c.id,cod:c.cod,claves:cl,nombre:c.nombre,equipo:c.equipo,opc:OPCIONAL(c.equipo),
      inf:informes.find(d=>cl.includes(U(d.agente))||cl.includes(U(d.uid)))};
  });
  const jefes=activos.filter(f=>!FUERA(f.equipo)).filter(f=>["jefe","crm_jefe"].includes(rolDe(f))&&!f.tipologia).map(f=>persona(f,"jefe"));
  const dirs=activos.filter(f=>["director","crm_director"].includes(rolDe(f))).map(f=>persona(f,"director"));
  // Comité y acta de cada comercial
  coms.forEach(p=>{ p.comite=flujo.find(x=>x.paso==="comite"&&p.claves.includes(U(x.agente)))||null;
    p.jefe=jefes.find(j=>j.equipo&&j.equipo===p.equipo)||null; });
  const equipos=[...new Set([...coms.map(p=>p.equipo),...jefes.map(j=>j.equipo)].filter(Boolean))].sort();
  const yoCl=[AGENTE,U(UID)].filter(Boolean);
  const yo=[...coms,...jefes,...dirs].find(p=>p.claves.some(c=>yoCl.includes(c)))||null;
  D={us,informes,flujo,coms,jefes,dirs,equipos,yo,
     admin:flujo.find(x=>x.paso==="admin")||null, ceo:flujo.find(x=>x.paso==="ceo")||null};
}

// ══ Flujo de la semana ════════════════════════════════════════════════
// El flujo nuevo (comités, Administración, CEO) empieza la semana 40 de 2026
const FLUJO_DESDE=202640;
const flujoNuevo=()=>W.anio*100+W.sem>=FLUJO_DESDE;
function pasos(){
  // Solo cuentan los obligatorios (Distribuidor es opcional)
  const OB=D.coms.filter(p=>!p.opc), JO=D.jefes.filter(j=>!j.opc), conJefe=OB.filter(p=>p.jefe);
  const opc=D.coms.filter(p=>p.opc);
  const L=[
    {k:"com",t:"Comerciales cierran su parte",tot:OB.length,hechos:OB.filter(p=>p.inf).length,
      faltan:OB.filter(p=>!p.inf).map(p=>p.nombre),
      det:opc.length?"Distribuidor (opcional): "+opc.filter(p=>p.inf).length+"/"+opc.length:""},
    {k:"comite",t:"Comités del viernes (jefe con cada comercial)",tot:conJefe.length,hechos:conJefe.filter(p=>p.comite).length,
      faltan:conJefe.filter(p=>!p.comite).map(p=>p.nombre)},
    {k:"admin",t:"Administración revisa los cobros",tot:1,hechos:D.admin?1:0,faltan:D.admin?[]:["Administración de clientes"],
      det:D.admin?"Cerrado "+cuando(D.admin.fecha)+(D.admin.porNombre?" · "+D.admin.porNombre:""):""},
    {k:"jefe",t:"Jefes de equipo cierran",tot:JO.length,hechos:JO.filter(p=>p.inf).length,
      faltan:JO.filter(p=>!p.inf).map(p=>p.nombre)},
    {k:"director",t:"Director comercial cierra",tot:D.dirs.length,hechos:D.dirs.filter(p=>p.inf).length,
      faltan:D.dirs.filter(p=>!p.inf).map(p=>p.nombre)},
    {k:"ceo",t:"CEO cierra la semana del grupo",tot:1,hechos:D.ceo?1:0,faltan:D.ceo?[]:["CEO"],
      det:D.ceo?"Cerrado "+cuando(D.ceo.fecha):""},
  ];
  // Antes del flujo nuevo no había comités, ni revisión de Administración, ni cierre del CEO
  if(!flujoNuevo()) for(let i=L.length-1;i>=0;i--) if(["comite","admin","ceo"].includes(L[i].k)) L.splice(i,1);
  // El jefe solo ve a su equipo en los pasos de comerciales y comités
  if(ROL==="jefe"){ const mios=D.coms.filter(p=>p.equipo===EQUIPO&&!p.opc), cj=mios.filter(p=>p.jefe);
    L.forEach(p=>{
      if(p.k==="com"){ p.t="Tu equipo cierra su parte"; p.tot=mios.length; p.hechos=mios.filter(x=>x.inf).length; p.faltan=mios.filter(x=>!x.inf).map(x=>x.nombre); p.det=""; }
      if(p.k==="comite"){ p.t="Tus comités del viernes"; p.tot=cj.length; p.hechos=cj.filter(x=>x.comite).length; p.faltan=cj.filter(x=>!x.comite).map(x=>x.nombre); } }); }
  L.forEach((p,i)=>{
    p.ok=p.tot>0&&p.hechos>=p.tot;
    p.vacio=!p.tot;
    p.mal=!p.ok&&!p.vacio&&pasado(p.k);
    p.cls=p.vacio?"c-fut":p.ok?"c-ok":p.mal?"c-mal":(i===0||L[i-1].ok||p.hechos)?"c-pend":"c-fut";
  });
  return L;
}
// Comercial y Administración: solo su propio camino, sin datos de otros
function tarjetaMiFlujo(){
  const yo=D.yo;
  const L=ROL==="admin"
    ?[{t:"Revisas los cobros y lo que dicen los comerciales",pl:PLAZO.admin[3],ok:!!D.admin,k:"admin"}]
    :[{t:"Cierras tu parte",pl:PLAZO.com[3],ok:!!(yo&&yo.inf),k:"com"},
      ...(flujoNuevo()?[{t:"Comité con tu jefe: revisáis tu parte",pl:"viernes",ok:!!(yo&&yo.comite),k:"comite"},
        {t:"Te llega el acta por correo",pl:"al cerrar el comité",ok:!!(yo&&yo.comite),k:"comite"},
        {t:"Las acciones nuevas te salen la semana que viene",pl:"semana "+semSig().sem,ok:!!(yo&&yo.comite),k:"comite"}]:[])];
  return `<div class="card"><p class="ct">Tu semana ${W.sem}</p>
    ${L.map((p,i)=>{ const mal=!p.ok&&pasado(p.k), cls=p.ok?"c-ok":mal?"c-mal":(i===0||L[i-1].ok)?"c-pend":"c-fut";
      return `<div class="paso"><div class="circ ${cls}">${p.ok?"✓":i+1}</div><div style="flex:1"><div class="pt">${esc(p.t)}</div>
        <div class="pd">${esc(p.pl)}${mal?' · <b style="color:#B91C1C">fuera de plazo</b>':""}</div></div></div>`; }).join("")}</div>`;
}
function tarjetaFlujo(){
  if(ROL==="comercial"||ROL==="admin") return tarjetaMiFlujo();
  const L=pasos(), todo=L.every(p=>p.ok||p.vacio);
  return `<div class="card"><p class="ct">Cómo va la semana ${W.sem}</p>
    <p class="cs">${todo?"✓ Todo cerrado":"El sábado a las 13:00 tiene que estar todo cerrado"}</p>
    ${L.map((p,i)=>`<div class="paso"><div class="circ ${p.cls}">${p.ok?"✓":i+1}</div>
      <div style="flex:1;min-width:0"><div class="pt">${esc(p.t)}</div>
        <div class="pd">${esc(PLAZO[p.k][3])}${p.det?" · "+esc(p.det):""}${p.mal?` · <b style="color:#B91C1C">fuera de plazo</b>`:""}</div>
        ${!p.ok&&p.faltan.length&&p.tot>1&&(p.hechos||pasado(p.k)||p.k==="com")?`<div class="pfal">Faltan: ${p.faltan.slice(0,8).map(esc).join(" · ")}${p.faltan.length>8?" y "+(p.faltan.length-8)+" más":""}</div>`:""}</div>
      ${p.tot>1?`<div class="cnt" style="color:${p.ok?"#15803D":p.mal?"#B91C1C":"#475569"}">${p.hechos}/${p.tot}</div>`:""}</div>`).join("")}</div>`;
}

// ══ Lo que te toca ════════════════════════════════════════════════════
function tarjetaYo(){
  const yo=D.yo;

    return `<div class="yo"><p class="ct">${inf?"✓ Tu semana está cerrada":"Te falta cerrar tu semana"}</p>
      <p>${inf?`<span class="ok">Cerrado ${esc(cuando(inf.fechaEnvio))}</span>${tarde("com",inf.fechaEnvio)?' · <span class="mal">fuera de plazo</span>':""}. El viernes lo revisas con tu jefe en el comité.`

      ${ac?`<p>📝 Comité hecho ${esc(cuando(ac.fecha))} con ${esc(ac.porNombre||"tu jefe")}.</p>`:""}
      ${inf?`<button class="env" onclick="verParte('${esc(yo.id)}')">Ver mi parte</button>`:`<button class="env" onclick="abrirMiCierre()">Cerrar mi semana</button>`}
      ${ac?`<button class="env sec" onclick="verActa('${esc(yo.id)}')">Ver el acta del comité</button>`:""}
      ${inf?`<button class="env sec" onclick="abrirMiCierre()">Volver a abrir mi cierre</button>`:""}</div>`;

    const inf=yo&&yo.inf;
    return `<div class="yo"><p class="ct">${inf?"✓ Tu cierre está hecho":pend.length?`Te faltan ${pend.length} comité${pend.length===1?"":"s"}`:"Comités hechos · te falta tu cierre"}</p>
      <p>${inf?`<span class="ok">Cerrado ${esc(cuando(inf.fechaEnvio))}</span>${tarde("jefe",inf.fechaEnvio)?' · <span class="mal">fuera de plazo</span>':""}.`
        :`Primero los comités del viernes con cada comercial; después tu cierre (<b>${PLAZO.jefe[3]}</b>).`}
        ${sinParte.length?`<br><span class="mal">Sin parte cerrado: ${sinParte.map(p=>esc(p.nombre)).join(" · ")}</span>`:""}</p>
      ${!inf&&pend.length?`<p style="color:#FCD34D">Puedes cerrar igual, pero lo que no pase por el comité llega sin revisar al director.</p>`:""}
      <button class="env" onclick="abrirMiCierre()">${inf?"Ver mi cierre":"Hacer mi cierre"}</button>
      <button class="env sec" onclick="abrirRecuperacion()">🚨 Comité de recuperación de clientes</button></div>`;
  }
  if(ROL==="director"){
    const jp=D.jefes.filter(j=>!j.inf&&!j.opc), inf=yo&&yo.inf;
    return `<div class="yo"><p class="ct">${inf?"✓ Tu cierre está hecho":jp.length?`Faltan ${jp.length} jefe${jp.length===1?"":"s"} por cerrar`:"Jefes cerrados · te toca a ti"}</p>
      <p>${inf?`<span class="ok">Cerrado ${esc(cuando(inf.fechaEnvio))}</span>.`:`Cierras cuando hayan cerrado los jefes. Plazo: <b>${PLAZO.director[3]}</b>.`}
        ${jp.length?`<br><span class="mal">Sin cerrar: ${jp.map(p=>esc(p.nombre)).join(" · ")}</span>`:""}</p>
      <button class="env" onclick="abrirMiCierre()">${inf?"Ver mi cierre":"Hacer mi cierre"}</button></div>`;
  }
  if(ROL==="ceo"){
    const dp=D.dirs.filter(d=>!d.inf);
    return `<div class="yo"><p class="ct">${D.ceo?"✓ Semana del grupo cerrada":dp.length?"Esperando al director":"Te toca cerrar la semana"}</p>
      <p>${D.ceo?`<span class="ok">Cerrada ${esc(cuando(D.ceo.fecha))}</span>${D.ceo.nota?" · "+esc(D.ceo.nota):""}`
        :`Revisa el resumen y lo que te suben. Plazo: <b>${PLAZO.ceo[3]}</b>.`}</p>
      <button class="env" onclick="abrirMiCierre()">Ver el resumen de la semana</button>

  }
  // Administración de clientes
  return `<div class="yo"><p class="ct">${D.admin?"✓ Revisión de cobros cerrada":"Revisión de cobros de la semana"}</p>
    <p>${D.admin?`<span class="ok">Cerrada ${esc(cuando(D.admin.fecha))}</span>${D.admin.nota?" · "+esc(D.admin.nota):""}`
      :`Revisa los cobros y lo que dicen los comerciales antes de que cierren los jefes. Plazo: <b>${PLAZO.admin[3]}</b>.`}</p>
    <button class="env" onclick="abrirCobros()">Revisar los cobros</button>
    ${D.admin?"":`<button class="env sec" onclick="cerrarAdmin()">✓ Cerrar la revisión de cobros</button>`}</div>`;

// ══ Equipo ════════════════════════════════════════════════════════════
function estadoCom(p){
  if(p.opc&&!p.inf) return `<span class="tag t-fut">Opcional</span>`;
  if(p.comite) return `<span class="tag t-ok">Comité ✓</span>`;
  if(p.inf) return `<span class="tag ${pasado("comite")?"t-mal":"t-pend"}">${p.inf.ausente?"Ausente":"Parte ✓ · sin comité"}</span>`;
  return `<span class="tag ${pasado("com")?"t-mal":"t-fut"}">Sin parte</span>`;
}
function filaCom(p,modo){
  const sub=p.inf?(p.inf.ausente?"Ausente":"Parte "+cuando(p.inf.fechaEnvio)+(tarde("com",p.inf.fechaEnvio)?" · fuera de plazo":""))
    :p.opc?"Opcional · sin parte":"Sin parte cerrado"+(pasado("com")?" · fuera de plazo":"");
  return `<div class="fila" onclick="${modo==="jefe"?`abrirComite('${esc(p.id)}')`:p.comite?`verActa('${esc(p.id)}')`:p.inf?`verParte('${esc(p.id)}')`:""}">
    <div class="av">${esc(iniciales(p.nombre))}</div>
    <div class="n"><b>${esc(p.nombre)}</b><small>${esc(sub)}${p.comite?" · comité "+esc(cuando(p.comite.fecha)):""}</small></div>
    ${estadoCom(p)}<span class="chev">›</span></div>`;
}
let ABIERTO=new Set();
window.togEq=(eq)=>{ ABIERTO.has(eq)?ABIERTO.delete(eq):ABIERTO.add(eq); pintar(); };

      ${mios.length?mios.map(p=>filaCom(p,"jefe")).join(""):`<p class="cs">No encuentro comerciales del equipo ${esc(EQUIPO||"—")}.</p>`}</div>`;

          <span class="tag ${pc===cs.length?"t-ok":op?"t-fut":"t-pend"}">Partes ${pc}/${cs.length}</span>
          ${j?`<span class="tag ${cc===cs.length?"t-ok":op?"t-fut":"t-pend"}">Comités ${cc}/${cs.length}</span>`:""}<span class="chev">${ab?"▾":"›"}</span></div>
          ${ab?`<div style="padding-bottom:6px">${cs.map(p=>filaCom(p,"ver")).join("")||'<p class="cs">Sin comerciales</p>'}</div>`:""}</div>`; }).join("")}</div>`;

// ── El parte de un comercial: el correo que se guardó al cerrar ──
const comPorId=(id)=>D.coms.find(p=>p.id===id);
function htmlParte(p,dest){
  const inf=p.inf;
  if(!inf) return `<p class="cs">${esc(p.nombre)} no ha cerrado su parte de la semana ${W.sem}.</p>`;
  if(inf.ausente) return `<p class="cs">Marcado como ausente esta semana${inf.motivo?": "+esc(inf.motivo):""}.</p>`;
  const html=inf.htmlEmailOrigen==="cierre"?inf.htmlEmail:null;
  if(html) return `<div class="parte"><iframe sandbox="allow-same-origin allow-popups" srcdoc="${esc(html)}" onload="try{this.style.height=(this.contentDocument.body.scrollHeight+30)+'px'}catch(e){}"></iframe></div>`;
  // Cierre antiguo sin correo guardado: se rehace con la misma pantalla (modo solo ver)
  setTimeout(()=>rehacerParte(p,dest),0);
  return `<p class="cs" id="rehaciendo">⏳ Montando el parte de ${esc(p.nombre)}…</p>`;
}
function rehacerParte(p,dest){
  const fr=document.createElement("iframe");
  fr.style.cssText="position:fixed;left:-9999px;top:0;width:600px;height:800px;border:0;visibility:hidden";
  let hecho=false;
  const fin=(html,err)=>{ if(hecho) return; hecho=true; window.removeEventListener("message",oir); try{fr.remove();}catch(e){}
    const el=document.getElementById(dest); if(!el) return;
    el.innerHTML=html?`<div class="parte"><iframe sandbox="allow-same-origin allow-popups" srcdoc="${esc(html)}" onload="try{this.style.height=(this.contentDocument.body.scrollHeight+30)+'px'}catch(e){}"></iframe></div>`
      :`<p class="cs">No se ha podido montar el parte (${esc(err||"sin respuesta")}).</p>`; };
  const oir=(e)=>{ const d=e.data||{}; if(d.type!=="CIERRE_HTML"||U(d.agente)!==U(p.inf.agente)||Number(d.semana)!==W.sem) return; fin(d.html,d.error); };
  window.addEventListener("message",oir); setTimeout(()=>fin(null,"tiempo agotado"),45000);
  fr.src="cierre_semanal.html?agente="+encodeURIComponent(p.inf.agente)+"&semana="+W.sem+"&solover=1";
  document.body.appendChild(fr);
}
window.verParte=(id)=>{ const p=comPorId(id)||(D.yo&&D.yo.id===id?D.yo:null); if(!p) return;
  abrirCapa("Parte de "+p.nombre+" · semana "+W.sem,`<div class="in"><div id="parteBox">${htmlParte(p,"parteBox")}</div></div>`); };

    <p class="ct">📝 Acta del comité · ${esc(p.nombre)}</p>
    ${p.inf?"":`<div class="nota am">Todavía no ha cerrado su parte. El comité se hace sobre el parte cerrado: pídele que cierre antes.</div>`}
    <span class="lbl">Cómo queda su semana</span>

    ${AC.decision==="sube"?`<textarea placeholder="Qué sube al director y por qué" oninput="AC.nota=this.value;guardarBorrador()">${esc(AC.nota)}</textarea>`:""}

    <span class="lbl">💬 Comentarios (le llegan en el acta)</span>
    ${AC.coms.map((c,i)=>`<div class="li"><span>💬</span><span>${esc(c)}</span><button class="x" onclick="acQuita('coms',${i})" aria-label="Quitar">×</button></div>`).join("")}
    <div style="display:flex;gap:6px"><input class="c" id="nCom" placeholder="Escribe un comentario sobre algo de su parte"><button class="btn" onclick="acCom()">Añadir</button></div>

    <span class="lbl">➕ Acciones nuevas</span>
    ${AC.accs.map((a,i)=>`<div class="li"><span>➕</span><span><b>${esc(a.que)}</b><br><small style="color:#64748B">${esc(a.quien)}${a.cuando?" · para el "+esc(a.cuando.split("-").reverse().join("/")):""}</small></span><button class="x" onclick="acQuita('accs',${i})" aria-label="Quitar">×</button></div>`).join("")}
    <div class="campos">
      <div class="full"><input class="c" id="nQue" placeholder="Qué hay que hacer (cliente, oferta, cobro…)"></div>
      <div><select class="c" id="nQuien">${QUIEN.map(q=>`<option>${q}</option>`).join("")}</select></div>
      <div><input class="c" id="nCuando" type="date" value="${fecha}"></div>
    </div>
    <button class="btn" style="margin-top:6px" onclick="acAcc()">Añadir acción</button>
    <div class="nota az">Las acciones del comercial (o de los dos) le salen en su parte de la semana ${semSig().sem} en «Lo que te pidió tu jefe», y tiene que decir si las ha hecho.</div>
    <div class="nota am" style="background:#F8FAFC;color:#475569">📧 Al cerrar, el acta llega por correo a <b>${esc(p.nombre)}</b> con copia a ti, al director comercial${CC_CEO_VALIDACION?" y al CEO (mientras validamos)":""}.</div>
    <button class="btn prim" style="width:100%;margin-top:10px;padding:12px" id="btnActa" ${AC.decision&&p.inf?"":"disabled"} onclick="cerrarComite()">
      ${!p.inf?"Falta su parte cerrado":!AC.decision?"Elige cómo queda su semana":"✓ Cerrar el comité y enviar el acta"}</button>
  </div>`;
}
window.acDec=(k)=>{ AC.decision=AC.decision===k?"":k; guardarBorrador(); pintarActa(); };
window.acCom=()=>{ const el=document.getElementById("nCom"), v=el.value.trim(); if(v.length<3) return; AC.coms.push(v); guardarBorrador(); pintarActa(); };
window.acAcc=()=>{ const q=document.getElementById("nQue").value.trim(); if(q.length<4){ alert("Escribe qué hay que hacer"); return; }
  AC.accs.push({que:q,quien:document.getElementById("nQuien").value,cuando:document.getElementById("nCuando").value}); guardarBorrador(); pintarActa(); };
window.acQuita=(k,i)=>{ AC[k].splice(i,1); guardarBorrador(); pintarActa(); };

function htmlActa(p,a,d){
  const decT=(DECISION[a.decision]||[""])[0];
  return `<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:580px;margin:0 auto;color:#14181F">
    <div style="background:#14181F;color:#fff;padding:16px 20px;border-radius:12px 12px 0 0">
      <div style="font-size:11px;letter-spacing:.08em;opacity:.7;text-transform:uppercase">Acta del comité · semana ${W.sem}</div>
      <div style="font-size:19px;font-weight:800;margin-top:2px">${esc(p.nombre)}</div></div>
    <div style="border:1px solid #DCE1E7;border-top:none;border-radius:0 0 12px 12px;padding:18px 20px">
      <p style="margin:0 0 10px;font-size:14px">Hola ${esc(String(p.nombre).split(" ")[0])}, este es el resumen de lo que hemos acordado hoy con <b>${esc(a.porNombre)}</b>:</p>
      <div style="font-size:14px;font-weight:700;margin-bottom:6px">${esc(decT)}</div>
      ${a.nota?`<div style="font-size:13px;color:#6D28D9;margin-bottom:8px">📤 ${esc(a.nota)}</div>`:""}
      ${a.accs.length?`<div style="font-size:12px;font-weight:800;color:#6B7684;text-transform:uppercase;margin:12px 0 4px">➕ Acciones nuevas</div>
        ${a.accs.map(x=>`<div style="border-left:3px solid #2563EB;padding:4px 10px;margin:5px 0;font-size:13.5px"><b>${esc(x.que)}</b><br><span style="color:#6B7684;font-size:12px">${esc(x.quien)}${x.cuando?" · para el "+esc(x.cuando.split("-").reverse().join("/")):""}</span></div>`).join("")}`:""}
      ${a.coms.length?`<div style="font-size:12px;font-weight:800;color:#6B7684;text-transform:uppercase;margin:12px 0 4px">💬 Comentarios</div>
        ${a.coms.map(c=>`<div style="background:#F7F9FB;border-radius:8px;padding:7px 10px;margin:5px 0;font-size:13.5px">${esc(c)}</div>`).join("")}`:""}
      <div style="font-size:12px;color:#8A94A0;margin-top:14px">Las acciones que son tuyas te salen en tu parte de la semana ${semSig().sem}, en «Lo que te pidió tu jefe».
        ${d&&d.copias.length?`<br>Copia a: ${d.copias.map(x=>esc(x.nombre)+" ("+x.papel+")").join(", ")}.`:""}</div>
      <a href="https://crmwikuk.vercel.app/" style="display:inline-block;margin-top:14px;background:#14181F;color:#fff;text-decoration:none;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:700">Abrir el portal</a>
    </div></div>`;
}
window.cerrarComite=async()=>{
  const p=comPorId(AC.id); if(!p||!AC.decision||!p.inf) return;
  const b=document.getElementById("btnActa"); b.disabled=true; b.textContent="Guardando…";
  const ahora=new Date().toISOString(), porNombre=NOMBRE||AGENTE;
  const a=Object.assign({},AC,{porNombre});
  try{
    // 1. Las acciones del comercial, a su semana siguiente
    const sig=semSig();
    for(const [i,x] of a.accs.entries()){
      if(!["Comercial","Los dos"].includes(x.quien)) continue;
      const oid="obj_"+p.cod+"_"+sig.anio+"_s"+sig.sem+"_comite"+Date.now()+"_"+i;
      await escribir("objetivos_semana",oid,{id:oid,agente:p.cod,semana:sig.sem,anio:sig.anio,
        texto:x.que+(x.quien==="Los dos"?" (con tu jefe)":"")+(x.cuando?" · para el "+x.cuando.split("-").reverse().join("/"):""),
        tipo:"general",origen:"jefe",claveOrigen:"comite:"+W.sem+":"+p.cod+"|instr",refNombre:"Comité semana "+W.sem,
        creadoPor:UID||AGENTE,creadoPorNombre:porNombre,equipo:p.equipo,fechaCreacion:ahora});
    }
    // 2. El correo: comercial, con copia al jefe, al director y (en validación) al CEO
    let d=null;
    try{ d=await RC.destinatarios(p.cod,""); if(!CC_CEO_VALIDACION) d.copias=d.copias.filter(x=>x.papel!=="CEO"); }catch(e){ d=null; }
    const to=d?[...d.para,...d.copias].map(x=>x.email):[];
    let enviado=false;
    if(to.length){ try{ const r=await fetch("/api/send-email",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({to,subject:`📝 Acta del comité · ${p.nombre} · semana ${W.sem}`,html:htmlActa(p,a,d)})}); enviado=r.ok; }catch(e){} }
    // 3. El acta, en el flujo de la semana
    await escribir("cierres_flujo",idFlujo("comite",p.cod),{anio:W.anio,semana:W.sem,paso:"comite",agente:p.cod,agenteNombre:p.nombre,
      equipo:p.equipo,por:UID||AGENTE,porNombre,fecha:ahora,decision:a.decision,nota:a.nota||"",
      comentarios:a.coms,acciones:a.accs,enviadoA:d?[...d.para,...d.copias]:[],correoEnviado:enviado});
    try{ localStorage.removeItem(claveBorrador(p.id)); }catch(e){}
    AC=null;
    alert(enviado?"Acta enviada a "+(d.para.map(x=>x.nombre).join(", ")||"(el comercial no tiene email)")+(d.copias.length?" · copia a "+d.copias.map(x=>x.nombre).join(", "):"")+"."
      :"Comité guardado. El correo no se ha podido enviar"+(to.length?"":": no encuentro emails")+"; el acta queda en el portal.");
    cerrarCapa();
  }catch(e){ b.disabled=false; b.textContent="✓ Cerrar el comité y enviar el acta"; alert(e.message); }
};
window.verActa=(id)=>{
  const p=comPorId(id)||(D.yo&&D.yo.id===id?D.yo:null); if(!p||!p.comite) return;
  const c=p.comite, a={decision:c.decision,nota:c.nota,porNombre:c.porNombre||"",coms:deJSON(c.comentarios,[]),accs:deJSON(c.acciones,[])};
  const env=deJSON(c.enviadoA,[]);
  abrirCapa("Acta · "+p.nombre,`<div class="in">
    <p class="cs">Comité del ${esc(cuando(c.fecha))} con ${esc(c.porNombre||"")}${env.length?" · enviada a "+env.map(x=>esc(x.nombre)).join(", "):""}</p>
    <div class="parte"><iframe sandbox="allow-same-origin allow-popups" srcdoc="${esc(htmlActa(p,a,null))}" onload="try{this.style.height=(this.contentDocument.body.scrollHeight+30)+'px'}catch(e){}"></iframe></div>
    <p class="ct" style="margin-top:16px">Su parte</p><div id="parteBox">${htmlParte(p,"parteBox")}</div></div>`);
};

// ══ Cierres de Administración y del CEO ═══════════════════════════════
async function cerrarPaso(paso,txt){
  const nota=prompt(txt+"\n\nAlgo que quieras dejar anotado (opcional):","");
  if(nota===null) return;
  try{ await escribir("cierres_flujo",idFlujo(paso),{anio:W.anio,semana:W.sem,paso,por:UID||AGENTE,porNombre:NOMBRE||AGENTE,
    fecha:new Date().toISOString(),nota:nota.trim()}); await recargar(); }
  catch(e){ alert(e.message); }
}
window.cerrarAdmin=()=>cerrarPaso("admin","Cerrar la revisión de cobros de la semana "+W.sem+".");
window.cerrarCEO=()=>{
  const dp=D.dirs.filter(d=>!d.inf);
  if(dp.length&&!confirm("El director todavía no ha cerrado. ¿Cerrar igualmente?")) return;
  cerrarPaso("ceo","Cerrar la semana "+W.sem+" del grupo.");
};

// Desde el CRM se llega con ?vuelve=: botón para volver (con el historial, que es instantáneo)
(()=>{ const v=Q.get("vuelve"); if(!v) return; const a=document.getElementById("volver"); a.style.display="inline-block"; a.href=v;
  a.onclick=(e)=>{ e.preventDefault(); if(history.length>1) history.back(); else location.href=v; }; })();
recargar();
</script>
