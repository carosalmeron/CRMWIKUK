<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos planificados · Grupo Consolidado</title>
<style>
  :root{--tinta:#0E1626;--papel:#F6F7F9;--blanco:#fff;--linea:#E2E6EC;
        --texto:#0E1626;--tenue:#69737F;--hoy:#B4232A;--pronto:#8A5A00;--ok:#12794A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--texto);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  header{background:var(--tinta);color:#fff;padding:18px 18px 20px}
  /* Zona de toque holgada: en movil una flecha pequena se falla siempre */
  .volver{display:inline-flex;align-items:center;gap:8px;color:#C6D0DC;
    text-decoration:none;font-size:15px;font-weight:600;margin-bottom:12px;
    padding:9px 14px 9px 10px;border-radius:11px;background:rgba(255,255,255,.09);
    min-height:44px}
  .volver:active{background:rgba(255,255,255,.18)}
  .volver .f{font-size:22px;line-height:1}
  h1{margin:0;font-size:20px;font-weight:800}
  .sub{margin:4px 0 0;font-size:13px;color:#93A1B5}
  main{padding:14px 14px 60px;max-width:760px;margin:0 auto}

  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{flex:1;padding:11px;border-radius:10px;font:inherit;font-size:13px;
    font-weight:700;border:1.5px solid var(--linea);background:#fff;color:var(--tenue);
    cursor:pointer}
  .tabs button[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}

  .resumen{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .bloque{flex:1 1 100%;background:var(--blanco);
    border:1px solid var(--linea);border-radius:13px;padding:14px 16px}
  /* Se distingue con un filete lateral, no invirtiendo el color: en pantalla
     pequena dos bloques de fondo opuesto compiten entre si. */
  .bloque.destacado{border-left:4px solid var(--tinta)}
  .bloque.destacado .et{color:var(--texto)}
  .et{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--tenue);margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .par{display:flex;gap:22px}
  .par>div{min-width:0}
  .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;line-height:1.15}
  .e{font-size:10px;color:var(--tenue);text-transform:uppercase;
    letter-spacing:.05em;font-weight:700;margin-top:2px}
  .pie2{font-size:11px;color:var(--tenue);margin-top:9px;
    padding-top:8px;border-top:1px solid var(--linea)}
  .prox{margin:0 0 14px;font-size:12.5px;color:var(--tenue)}
  .prox b{color:var(--texto)}

  /* Cada bloque es una fecha de salida: eso es lo que se viene a mirar */
  .grupo{background:var(--blanco);border:1px solid var(--linea);border-radius:13px;
    margin-bottom:11px;overflow:hidden}
  .cab{display:flex;align-items:baseline;gap:10px;padding:12px 15px;
    border-left:4px solid var(--linea);background:#FBFCFD}
  .cab.urge{border-left-color:var(--hoy)}
  .cab.pronto{border-left-color:var(--pronto)}
  .cab .f{font-weight:800;font-size:15px}
  .cab .c{font-size:11.5px;color:var(--tenue)}
  .cab .imp{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
  .linea{display:grid;grid-template-columns:1fr auto;gap:2px 11px;
    padding:10px 15px;border-top:1px solid #EFF2F5;font-size:13.5px;
    align-items:start}
  /* Los articulos van en su propia fila a todo el ancho: si quedaran dentro
     de la columna izquierda, sus precios acabarian antes que el importe. */
  .linea > .arts{grid-column:1 / -1}
  .linea .nom{font-weight:600}
  .linea .det{font-size:11.5px;color:var(--tenue);margin-top:1px}
  .linea .der{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;
    flex:none;white-space:nowrap}
  /* Filtros: agente e intercompania */
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .filtros select{flex:1;min-width:150px;font:inherit;font-size:13px;padding:10px 11px;
    border:1.5px solid var(--linea);border-radius:10px;background:#fff;color:var(--texto)}
  .chip{font:inherit;font-size:12.5px;font-weight:700;padding:9px 13px;border-radius:10px;
    border:1.5px solid var(--linea);background:#fff;color:var(--tenue);cursor:pointer}
  .chip[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}

  .cab{cursor:pointer;user-select:none}
  .cab .flecha{margin-left:10px;color:#94A3B0;font-size:15px;transition:transform .18s}
  .cab[aria-expanded=true] .flecha{transform:rotate(90deg)}
  .linea{cursor:pointer}
  .linea:active{background:#F4F7FA}
  .detalle{background:#F7F9FB;border-top:1px solid #E6EBF0;padding:2px 0}
  .art{display:flex;gap:12px;padding:13px 15px 13px 24px;font-size:14.5px;
    border-top:1px solid #E9EEF3;align-items:flex-start}
  .art:first-child{border-top:none}
  /* Articulos de un pedido agrupado dentro del diario */
  /* UNA sola rejilla para todos los articulos, no una por fila: asi las tres
     columnas comparten ancho y los numeros quedan alineados entre si. */
  .arts{margin-top:6px;border-left:2px solid #DDE5EC;padding-left:9px;
    display:grid;grid-template-columns:1fr auto auto;gap:0 12px;
    align-items:baseline;font-variant-numeric:tabular-nums}
  /* Descripcion en UNA linea con puntos suspensivos: partirla en dos rompe
     la lectura vertical de las cifras. El nombre completo va en el title. */
  .arts .n{color:var(--tenue);min-width:0;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;font-size:12.5px;padding:4px 0}
  .arts .u,.arts .p{font-weight:700;color:var(--tenue);font-size:11.5px;
    text-align:right;white-space:nowrap;padding:4px 0}
  /* Cabecera de cada pedido dentro de un cliente: agrupa sus lineas */
  .pedcab{display:flex;gap:10px;align-items:baseline;justify-content:space-between;
    padding:9px 15px 7px 20px;background:#EDF2F7;border-top:1px solid #DDE5EC;
    font-variant-numeric:tabular-nums}
  .pedcab b{font-size:13px;font-weight:800}
  .pedcab > b{white-space:nowrap;flex:none}
  .pedcab span{display:block;font-size:11.5px;color:var(--tenue);margin-top:2px}
  .detalle > .pedcab:first-child{border-top:none}
  .pedcab + .art{border-top:none}
  .art .c{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .art .s{font-size:12.5px;color:var(--tenue);margin-top:3px;line-height:1.45}
  .art .d{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;
    flex:none;white-space:nowrap}
  .art .d b{font-size:16px;font-weight:800}
  .art .u{font-size:12.5px;color:var(--tenue);margin-top:3px}
  .vacio{padding:34px 16px;text-align:center;color:var(--tenue);font-size:14px}
  .cargando{padding:40px 0;text-align:center;color:var(--tenue)}
  .err{background:#FDF3F3;border:1px solid #F0C2C4;color:var(--hoy);
    padding:12px 14px;border-radius:11px;font-size:13px}
  .sec{font-size:14.5px;font-weight:800;letter-spacing:-.01em;
    color:var(--texto);padding:13px 15px 9px;background:#F7F9FB;
    border-top:1px solid var(--linea);display:flex;align-items:baseline;gap:8px}
  .sec .cuenta{font-size:11.5px;font-weight:700;color:var(--tenue);
    letter-spacing:0;margin-left:auto;white-space:nowrap}
  .sec.urge{color:var(--hoy);background:#FDF3F3}
  .sec.urge .cuenta{color:#B4232A}
  .pie{margin-top:18px;font-size:11.5px;color:var(--tenue);text-align:center}
  /* ── (v-pliegos) Secciones plegables al tocar el título ── */
  .sec{cursor:pointer;-webkit-user-select:none;user-select:none;position:relative}
  .sec::after{content:"▾";position:absolute;right:2px;top:50%;transform:translateY(-50%);
    font-size:11px;opacity:.55}
  .sec.plegada::after{content:"▸"}

  /* ── (v-notas) Hilo de notas por pedido ── */
  .notasbox{grid-column:1/-1;margin-top:7px}
  .nbt{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--linea,#d8dee6);
    background:#fff;border-radius:99px;padding:4px 11px;font-size:11px;font-weight:800;
    color:#3b4654;cursor:pointer;font-family:inherit}
  .nbt i{font-style:normal;color:#1f5fa8}
  .hilo{display:none;margin-top:7px;background:#f4f6f9;border:1px solid var(--linea,#d8dee6);
    border-radius:10px;padding:9px 10px}
  .hilo.abierto{display:block}
  .nota{background:#fff;border:1px solid var(--linea,#d8dee6);border-radius:8px;
    padding:7px 9px;margin-bottom:6px}
  .nota .ntx{font-size:12px;line-height:1.45;color:#1c232b}
  .nota .nmeta{display:flex;gap:7px;align-items:center;margin-top:3px;font-size:9.5px;color:#7a8494}
  .nota .nmeta b{color:#3b4654}
  .nota .ndel{margin-left:auto;cursor:pointer;font-size:10.5px}
  .nform{display:flex;gap:6px}
  .nform textarea{flex:1;border:1.5px solid var(--linea,#d8dee6);border-radius:8px;padding:7px 9px;
    font-size:12px;font-family:inherit;resize:none;outline:none;min-width:0;box-sizing:border-box}
  .nform button{border:none;background:#1f5fa8;color:#fff;border-radius:8px;padding:0 14px;
    font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  .hilo .vacio{font-size:10.5px;color:#7a8494;margin:0 0 6px}
</style>
</head>
<body>

<header>
  <a class="volver" href="index.html"><span class="f">←</span> Volver al portal</a>
  <h1>Pedidos planificados</h1>
  <p class="sub" id="quien">Cargando…</p>
</header>

<main>
  <div class="filtros" id="filtros" hidden>
    <select id="fagente" onchange="filtrar()"></select>
    <button class="chip" id="finter" aria-pressed="false" onclick="alternarInter()">
      Sin intercompañía
    </button>
  </div>

  <div class="tabs" role="group" aria-label="Agrupar por">
    <button onclick="ver('dia')"    aria-pressed="true"  id="t-dia">Por día</button>
    <button onclick="ver('semana')" aria-pressed="false" id="t-semana">Por semana</button>
    <button onclick="ver('mes')"    aria-pressed="false" id="t-mes">Por mes</button>
    <button onclick="ver('diario')" aria-pressed="false" id="t-diario">Diario</button>
  </div>
  <div id="app"><div class="cargando">Leyendo pedidos…</div></div>
</main>

<script src="agentes.js"></script>
<script>
const PROY="grupo-consolidado-crm";
const BASE=`https://firestore.googleapis.com/v1/projects/${PROY}/databases/(default)/documents`;
const $=(id)=>document.getElementById(id);
const eur=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
const norm=(s)=>String(s||"").toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
// Firestore devuelve cada campo con su tipo. Faltaba booleanValue, y por eso
// "intercompany" llegaba como nulo y el filtro no quitaba nada.
const val=(f)=>{
  if(!f) return null;
  if(f.doubleValue!==undefined)  return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.stringValue!==undefined)  return f.stringValue;
  return null;
};

let TODOS=[], PEDIDOS=[], MODO="dia";
let F_AGENTE="", SIN_INTER=false;
// Comercial al que se limita la vista. null = mando, lo ve todo.
let CLAVE=null;

// ── Memoria de unidades por linea ──────────────────────────────────────
// Una linea servida desaparece de pbi_pedidos, asi que despues no hay de
// donde sacar cuantas unidades tenia. Se guarda en Firestore (compartido
// entre todos, no por navegador) repartido en pocos documentos: guardar
// una linea por documento serian miles de escrituras cada dia.
let MEM={};
const MEM_COL="pbi_uds_memoria";
const MEM_BLOQUES=12;
function bloqueDe(k){
  let h=0; for(let i=0;i<k.length;i++){ h=((h<<5)-h)+k.charCodeAt(i); h|=0; }
  return "b"+(Math.abs(h)%MEM_BLOQUES);
}
async function cargarMemoriaUds(){
  try{
    const r=await fetch(`${BASE}/${MEM_COL}?pageSize=${MEM_BLOQUES+5}`);
    if(!r.ok) return;
    const j=await r.json();
    (j.documents||[]).forEach(d=>{
      const f=d.fields||{};
      if(!f.datos||!f.datos.stringValue) return;
      try{ Object.assign(MEM,JSON.parse(f.datos.stringValue)); }catch(e){}
    });
  }catch(e){}
}
// Escribe solo los bloques que han cambiado, y como mucho una vez por carga
let memGuardando=false;
async function guardarMemoriaUds(nuevas){
  const claves=Object.keys(nuevas||{});
  if(!claves.length||memGuardando) return;
  memGuardando=true;
  // Agrupar lo nuevo por bloque y reescribir solo esos
  const porBloque={};
  claves.forEach(k=>{ (porBloque[bloqueDe(k)]=porBloque[bloqueDe(k)]||[]).push(k); });
  for(const b of Object.keys(porBloque)){
    // El bloque completo = lo que ya habia de ese bloque + lo nuevo
    const datos={};
    Object.keys(MEM).forEach(k=>{ if(bloqueDe(k)===b) datos[k]=MEM[k]; });
    try{
      await fetch(`${BASE}/${MEM_COL}/${b}`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          datos:{stringValue:JSON.stringify(datos)},
          lineas:{doubleValue:Object.keys(datos).length},
          actualizado:{stringValue:new Date().toISOString()}}})});
    }catch(e){}
  }
  memGuardando=false;
}
let EQUIPO_CLAVES=null; // códigos de agente del equipo, cuando quien mira es un responsable
let INICIADO=false;            // ya se ha abierto el primer grupo
const ABIERTOS=new Set();      // grupos de fecha desplegados
const CLI_ABIERTO=new Set();   // clientes con el detalle abierto

const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio",
             "agosto","septiembre","octubre","noviembre","diciembre"];

// Dentro del portal manda el boton "Hub" de la barra superior. Este enlace
// sobraria y ademas cargaria el portal dentro del propio iframe.
if(window.parent!==window){
  const v=document.querySelector(".volver");
  if(v) v.style.display="none";
}

function sesion(){
  // Primero la URL, que es lo unico que no depende de lo que este movil
  // tenga guardado. localStorage queda de respaldo al recargar la pagina.
  try{
    const h=decodeURIComponent((location.hash||"").replace(/^#/,""));
    if(h){
      const u=JSON.parse(h);
      // No se guarda: el hash sobrevive a la recarga, y escribirlo aqui
      // machacaba la sesion completa del portal, que lleva accesos e icono.
      // Sin accesos, al volver el portal aparecia sin ningun modulo.
      if(u&&(u.username||u.crmId||u.nombre)) return u;
    }
  }catch(e){ /* hash ilegible: se prueba con localStorage */ }
  try{ return JSON.parse(localStorage.getItem("gc_portal_user")||"{}"); }catch(e){ return {}; }
}

// Semana ISO: el lunes manda, que es como se organiza la ruta
function lunesDe(d){
  const x=new Date(d);
  const dow=(x.getDay()+6)%7;
  x.setDate(x.getDate()-dow);
  x.setHours(0,0,0,0);
  return x;
}

function etiqueta(fechaISO){
  const f=new Date(fechaISO+"T00:00:00");
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const dias=Math.round((f-hoy)/86400000);

  if(MODO==="dia"){
    const cuando = dias===0?"hoy" : dias===1?"mañana"
      : dias<7 ? DIAS[f.getDay()]
      : `${DIAS[f.getDay()]} ${f.getDate()} de ${MESES[f.getMonth()]}`;
    return {clave:fechaISO, titulo:cuando.charAt(0).toUpperCase()+cuando.slice(1),
            sub:f.toLocaleDateString("es-ES"), dias};
  }
  if(MODO==="semana"){
    const l=lunesDe(f), v=new Date(l); v.setDate(v.getDate()+4);
    const dl=Math.round((l-hoy)/86400000);
    const t = dl<=0 ? "Esta semana" : dl<8 ? "Semana que viene"
      : `Semana del ${l.getDate()} de ${MESES[l.getMonth()]}`;
    return {clave:l.toISOString().slice(0,10), titulo:t,
            sub:`${l.getDate()}/${l.getMonth()+1} al ${v.getDate()}/${v.getMonth()+1}`, dias:dl};
  }
  const t=`${MESES[f.getMonth()]} ${f.getFullYear()}`;
  return {clave:`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,"0")}`,
          titulo:t.charAt(0).toUpperCase()+t.slice(1), sub:"", dias};
}

async function cargar(){
  const u=sesion();

  // Sin sesion no se puede saber a quien limitar la vista. Antes se seguia
  // adelante y se acababa enseñando el grupo entero al primero que abriera
  // la URL: mejor no enseñar nada y mandar al portal.
  if(!u || !Object.keys(u).length){
    $("quien").textContent="Sin identificar";
    $("app").innerHTML=`<p style="padding:34px 18px;color:var(--tenue);
      font-size:14.5px;line-height:1.55">Entra desde el portal para ver tus
      pedidos. <a href="index.html" style="color:var(--tinta);font-weight:700">
      Ir al portal</a><br><span style="font-size:12px">Ni el enlace
      ${location.hash?"(traía datos ilegibles)":"(sin datos)"} ni este
      navegador han dado una identidad.</span></p>`;
    return;
  }
  let clave=null, titulo="Todos los comerciales";

  try{
    // La tabla de identidades primero: de ella depende a quién se le
    // atribuye cada pedido.
    try{ if(window.Agentes) await window.Agentes.cargar(); }catch(e){}

    // A quién corresponde: si el usuario es comercial, solo lo suyo
    const ru=await fetch(`${BASE}/usuarios?pageSize=300`);
    const usuarios = ru.ok ? ((await ru.json()).documents||[]).map(d=>{
      const o={_id:d.name.split("/").pop()};
      for(const [k,v] of Object.entries(d.fields||{})) o[k]=val(v);
      return o;
    }) : [];

    const rol=String(u.rol||"").toLowerCase();
    const mando = rol.includes("director")||rol==="admin"||rol==="ceo";
    const esJefeEquipo = !mando && (rol==="jefe"||rol==="crm_jefe");
    let equipoClaves=null; // códigos de agente (grupoAgente/catalogoVendedor) del equipo de un responsable
    if(!mando){
      const f=usuarios.find(x=>(u.crmId&&(x._id||x.id)===u.crmId)
        || (u.username&&norm(x.username)===norm(u.username))
        || (u.nombre&&norm(x.nombre)===norm(u.nombre)));
      if(esJefeEquipo){
        // Un responsable de equipo no vende con su propio código: tiene que ver
        // la suma de los códigos de los comerciales de su equipo, no el suyo.
        const miEquipo = f&&f.equipo;
        titulo = miEquipo ? `Resp. ${miEquipo}` : ((f&&f.nombre)||"Mi equipo");
        if(miEquipo){
          // Con la tabla de alias se recogen TODOS los codigos de cada
          // comercial del equipo: antes solo se miraba uno y los pedidos
          // guardados con otro codigo suyo se quedaban fuera.
          equipoClaves = new Set();
          usuarios.filter(x=>norm(x.equipo)===norm(miEquipo)
            && ["jefe","director","ceo"].indexOf(String(x.rol||"").toLowerCase())<0)
            .forEach(x=>{
              [x.grupoAgente,x.catalogoVendedor,x.username,x.id,x._id]
                .filter(Boolean).forEach(k=>{
                  equipoClaves.add(norm(k));
                  try{
                    if(window.Agentes) window.Agentes.alias(k)
                      .forEach(a=>equipoClaves.add(norm(a)));
                  }catch(e){}
                });
            });
        }
        clave=null; // sin filtro en la propia consulta; se filtra en cliente por equipo
        CLAVE = null;
        EQUIPO_CLAVES = equipoClaves; // también lo necesita el Diario, que lee otra colección aparte
      } else {
        clave = norm((f&&(f.grupoAgente||f.catalogoVendedor))||u.username)||null;
        if(clave) titulo = (f&&f.nombre)||clave;
        CLAVE = clave;
      }
    }
    $("quien").textContent = titulo;

    // Solo los pedidos que tocan: una consulta filtrada, no la colección
    const cuerpo = clave
      ? {structuredQuery:{from:[{collectionId:"pbi_pedidos"}],
          where:{fieldFilter:{field:{fieldPath:"agente"},op:"EQUAL",
                 value:{stringValue:clave}}}, limit:2000}}
      : {structuredQuery:{from:[{collectionId:"pbi_pedidos"}], limit:2000}};

    const r=await fetch(`${BASE}:runQuery`,{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(cuerpo)});
    const j=await r.json();
    TODOS=(Array.isArray(j)?j:[]).filter(x=>x.document).map(x=>{
      const o={};
      for(const [k,v] of Object.entries(x.document.fields||{})) o[k]=val(v);
      return o;
    }).filter(p=>p.fecha);

    // Responsable de equipo: quedarnos solo con los pedidos de los comerciales de su equipo
    if(equipoClaves){
      TODOS = TODOS.filter(p=>equipoClaves.has(norm(p.agente)));
    }

    // Memoria compartida de unidades, para las líneas que ya se han servido
    await cargarMemoriaUds();

    // El filtro de agente solo tiene sentido para quien ve varios
    if(!clave){
      const ags=[...new Set(TODOS.map(p=>p.agente).filter(Boolean))].sort();
      $("fagente").innerHTML=`<option value="">Todos los comerciales (${ags.length})</option>`
        + ags.map(a=>`<option value="${a}">${a}</option>`).join("");
      $("filtros").hidden=false;
    }else{
      // Un comercial solo necesita el filtro de intercompania
      $("fagente").hidden=true;
      $("filtros").hidden=false;
    }

    filtrar();
  }catch(e){
    $("app").innerHTML=`<div class="err">No se han podido cargar los pedidos: ${e.message}</div>`;
  }
}

function ver(modo){
  MODO=modo;
  for(const m of ["dia","semana","mes","diario"])
    $("t-"+m).setAttribute("aria-pressed", String(m===modo));
  ABIERTOS.clear(); INICIADO=false;
  pintar();
}

function filtrar(){
  F_AGENTE=$("fagente").value||"";
  PEDIDOS=TODOS.filter(p=>
    (!F_AGENTE || p.agente===F_AGENTE) &&
    (!SIN_INTER || !p.intercompany));
  ABIERTOS.clear(); INICIADO=false;
  pintar();
}

function alternarInter(){
  SIN_INTER=!SIN_INTER;
  $("finter").setAttribute("aria-pressed", String(SIN_INTER));
  filtrar();
}

function abrirGrupo(clave){
  if(ABIERTOS.has(clave)) ABIERTOS.delete(clave); else ABIERTOS.add(clave);
  pintar();
}

function abrirCliente(id){
  if(CLI_ABIERTO.has(id)) CLI_ABIERTO.delete(id); else CLI_ABIERTO.add(id);
  pintar();
}

// ── Diario de pedidos ─────────────────────────────────────────────
// Qué pasó desde la sincronización anterior: qué salió, qué se movió de
// fecha y qué entró. Power BI no guarda ese histórico, así que se calcula
// comparando cada día con el anterior.
async function pintarDiario(){
  $("app").innerHTML=`<div class="grupo"><p class="vacio">Leyendo el diario…</p></div>`;
  try{
    // Listar la coleccion devolvia los primeros documentos por nombre, y como
    // el nombre es la fecha, eso son los mas ANTIGUOS: pasado un mes habria
    // dejado de verse el diario de hoy. Y bajaba treinta dias enteros, que es
    // lo que tardaba tanto. Como cada documento se llama YYYY-MM-DD, se piden
    // los siete ultimos por su nombre y en paralelo. Sin consultas ni indices.
    const iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${
      String(d.getDate()).padStart(2,"0")}`;
    const fechas=[];
    for(let i=0;i<7;i++){
      const d=new Date(); d.setDate(d.getDate()-i); fechas.push(iso(d));
    }
    const crudos=await Promise.all(fechas.map(f=>
      fetch(`${BASE}/pbi_pedidos_cambios/${f}`)
        .then(r=>r.ok?r.json():null).catch(()=>null)));
    const dias=crudos.filter(Boolean).map(doc=>{
      const o={_id:doc.name.split("/").pop()};
      for(const [k,v] of Object.entries(doc.fields||{})) o[k]=val(v);
      if(!o.fecha) o.fecha=o._id;   // el nombre del documento ya es la fecha
      return o;
    }).sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")));

    if(!dias.length){
      $("app").innerHTML=`<div class="grupo"><p class="vacio">
        Todavía no hay diario. Hace falta una sincronización más para poder
        comparar con la de hoy.</p></div>`;
      return;
    }

    const lee=(t)=>{ try{ return JSON.parse(t||"[]"); }catch(e){ return []; } };
    // La lista de pedidos ya venia filtrada por la consulta, pero el diario
    // se lee entero de pbi_pedidos_cambios: si no se limita aqui, un
    // comercial ve los movimientos de todo el grupo.
    const mio=(m)=>(!CLAVE||m.agente===CLAVE)
      && (!EQUIPO_CLAVES||EQUIPO_CLAVES.has(norm(m.agente)))
      && (!F_AGENTE||m.agente===F_AGENTE)
      && (!SIN_INTER || !/INTERCO|WIKUK EASY|DISCOB/i.test(m.nombre||""));
    const tot=(l)=>l.reduce((s,m)=>s+(m.importe||0),0);

    let html="";
    for(const d of dias){
      const salidas=lee(d.salidas).filter(mio);
      const movs=lee(d.movimientos).filter(mio);
      const entradas=lee(d.entradas).filter(mio);
      const cambios=lee(d.cambios).filter(mio);
      if(!salidas.length&&!movs.length&&!entradas.length&&!cambios.length) continue;

      const servidos=salidas.filter(m=>m.tipo==="servido");
      const anulados=salidas.filter(m=>m.tipo==="anulado");
      const ret=movs.filter(m=>m.tipo==="retraso");
      const ade=movs.filter(m=>m.tipo==="adelanto");
      // Lo que debía salir ese día y se movió: incumplimiento, no replanificación
      const noSalieron=ret.filter(m=>m.fechaAntes && m.fechaAntes<d.fecha);
      const replan    =ret.filter(m=>!m.fechaAntes || m.fechaAntes>=d.fecha);

      const f=new Date(d.fecha+"T12:00:00");
      const cab=f.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});

      html+=`<div class="grupo">
        <div class="cab${noSalieron.length?" urge":""}" style="display:block">
          <div style="font-size:15px;font-weight:800;letter-spacing:-.01em">
            ${cab.charAt(0).toUpperCase()+cab.slice(1)}
          </div>
          ${CLAVE?"":`<div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:7px">
            <div>
              <div style="font-size:14.5px;font-weight:700;
                font-variant-numeric:tabular-nums">${d.pedidosAntes||"—"} ped · ${
                d.importeAntes?eur(d.importeAntes):"—"}</div>
              <div style="font-size:10.5px;color:var(--tenue);font-weight:700;
                letter-spacing:.4px;text-transform:uppercase">Ayer</div>
            </div>
            <div>
              <div style="font-size:14.5px;font-weight:700;
                font-variant-numeric:tabular-nums">${d.pedidosAhora||"—"} ped · ${
                d.importeAhora?eur(d.importeAhora):"—"}</div>
              <div style="font-size:10.5px;color:var(--tenue);font-weight:700;
                letter-spacing:.4px;text-transform:uppercase">Hoy</div>
            </div>
          </div>`}
          ${noSalieron.length?`<div style="margin-top:8px;padding-top:7px;
            border-top:1px solid var(--linea);font-size:13px;font-weight:800;
            color:var(--hoy)">${eur(tot(noSalieron))} no han salido hoy</div>`:""}
        </div>`;

      // Un pedido de cinco articulos es UNA entrega que se mueve, no cinco
      // avisos distintos: se agrupan las lineas del mismo cliente y numero de
      // pedido, y se listan sus articulos debajo.
      // pbi_pedidos_cambios no trae unidades: solo importe y descripcion. Las
      // cogemos de la lista de pedidos, que si las tiene, cruzando por pedido
      // + articulo. Sin esto, el "1 U" del nombre del articulo (que es su
      // formato) se confunde con la cantidad pedida.
      // pbi_pedidos tiene exactamente tres campos numericos: unidades, precio
      // e importe. No hay unidades servidas, asi que no se puede mostrar el
      // desfase pedido/servido: lo que se ve son las unidades del pedido.
      const num=(v)=>{ if(v==null||v==="") return null;
        const n=Number(v); return isNaN(n)?null:n; };

      // MEM ya viene cargada de Firestore (cargarMemoriaUds), compartida entre
      // todos los usuarios: una linea servida desaparece de pbi_pedidos y sin
      // esto no habria de donde sacar cuantas unidades eran.
      const UDS={}, PRE={}, PRE_ART={};
      const nuevasMem={};
      (TODOS||[]).forEach(l=>{
        const art=l.articulo||l.descripcion||"";
        const k=(l.pedido||"")+"||"+art;
        const u=num(l.unidades);
        if(u!=null){
          UDS[k]=(UDS[k]||0)+u;
          if(MEM[k]!==UDS[k]) nuevasMem[k]=UDS[k];   // solo lo que cambia
        }
        const pr=num(l.precio);
        if(pr!=null){
          if(PRE[k]==null) PRE[k]=pr;
          // Precio por articulo suelto: sirve para los pedidos ya servidos,
          // que han desaparecido de la lista de pendientes.
          if(art&&PRE_ART[art]==null) PRE_ART[art]=pr;
        }
      });
      Object.assign(MEM,nuevasMem);
      guardarMemoriaUds(nuevasMem);
      const claveDe=(m)=>(m.pedido||"")+"||"+(m.articulo||m.descripcion||"");
      const preDe=(m)=>{
        const v=PRE[claveDe(m)];
        if(v!=null) return v;
        const a=m.articulo||m.descripcion||"";
        return PRE_ART[a]!=null?PRE_ART[a]:null;
      };
      // Solo unidades reales del pedido. Nada de estimar a partir del
      // importe: un numero calculado que parece un dato acaba usandose
      // como si lo fuera. Si no consta, no se enseña.
      const udsDe=(m)=>{
        const propio=num(m.unidades);
        if(propio!=null) return propio;
        const k=claveDe(m);
        if(UDS[k]!=null) return UDS[k];
        // Ya no esta en el pedido (servida o anulada): las que tenia
        return MEM[k]!=null?MEM[k]:null;
      };
      // Unidades y precio dicen mas que el importe de cada linea: el total
      // ya esta en la cabecera del pedido, repetirlo por linea es ruido.
      const detArt=(m)=>{
        const uu=udsDe(m), p=preDe(m);
        return {
          uds: uu!=null ? uu.toLocaleString("es-ES")+" uds" : "",
          pre: p!=null ? p.toLocaleString("es-ES",
            {minimumFractionDigits:2,maximumFractionDigits:2})+" €/u" : ""
        };
      };

      const agrupar=(l)=>{
        const g={};
        l.forEach(m=>{
          const k=(m.nombre||m.cliente||"?")+"||"+(m.pedido||"__"+(m.id||Math.random()));
          if(!g[k]) g[k]={...m, lineas:[], importe:0};
          g[k].lineas.push(m);
          g[k].importe+=(m.importe||0);
        });
        return Object.values(g).sort((a,b)=>
          Math.abs(b.importe)-Math.abs(a.importe));
      };

      const linea=(m,extra)=>{
        const n=m.lineas?m.lineas.length:1;
        const arts=(m.lineas||[m]);
        return `<div class="linea">
        <div style="min-width:0">
          <div class="nom">${m.nombre||m.cliente}</div>
          <div class="det">${m.pedido?"Pedido "+m.pedido:"Sin nº de pedido"}${
            m.agente?" · "+m.agente:""}${n>1?" · "+n+" líneas":""}</div>
          <div class="det">${extra}</div>
          ${n>1 ? "" : `<div class="det">${m.descripcion||m.articulo||""}${
                (()=>{const d=detArt(m);
                  const t=[d.uds,d.pre].filter(Boolean).join(" · ");
                  return t?" · "+t:"";})()}</div>`}
        </div>
        <div class="der">
          <div style="font-weight:800">${
            m.tipo==="cambio"&&m.importe>0?"+":""}${eur(m.importe)}</div>
          ${m.dias!=null?`<div class="det" style="font-weight:700;color:${
            m.dias>0?"var(--hoy)":"var(--ok)"}">${
            m.dias>0?"+":""}${m.dias} d</div>`:""}
        </div>
        ${n>1
          ? `<div class="arts">${arts.map(x=>{
              const d=detArt(x);
              return `<span class="n" title="${(x.descripcion||x.articulo||"").replace(/"/g,"&quot;")}">${x.descripcion||x.articulo||"—"}</span>`
                +`<span class="u">${d.uds}</span>`
                +`<span class="p">${d.pre||eur(x.importe)}</span>`;
              }).join("")}</div>`
          : ""}
        ${m.pedido?notasBox(m.pedido,m.nombre||m.cliente||""):""}
      </div>`;
      };

      // El título lleva el importe y cuántos pedidos distintos lo componen:
      // 39.291 € en un solo pedido no exige lo mismo que en doce.
      const cuenta=(l)=>{
        const n=new Set(l.map(m=>m.pedido).filter(Boolean)).size || l.length;
        return `${n} ${n===1?"pedido":"pedidos"}`;
      };
      const tit=(t,l,urge)=>`<div class="sec${urge?" urge":""}">${t} · ${eur(tot(l))}
        <span class="cuenta">${cuenta(l)}</span></div>`;

      if(noSalieron.length){
        html+=tit("No han salido hoy", noSalieron, true)
          +agrupar(noSalieron).map(m=>linea(m,
            `debía salir el ${fechaCorta(m.fechaAntes)} → ahora <b>${fechaCorta(m.fechaNueva)}</b>`)).join("");
      }
      if(servidos.length){
        html+=tit("Servidos", servidos)
          +agrupar(servidos).map(m=>linea(m,`salía el ${fechaCorta(m.fechaAntes)}`)).join("");
      }
      if(replan.length){
        html+=tit("Cambian de fecha", replan)
          +agrupar(replan).map(m=>linea(m,
            `${fechaCorta(m.fechaAntes)} → <b>${fechaCorta(m.fechaNueva)}</b>`)).join("");
      }
      if(ade.length){
        html+=tit("Se adelantan", ade)
          +agrupar(ade).map(m=>linea(m,
            `${fechaCorta(m.fechaAntes)} → <b>${fechaCorta(m.fechaNueva)}</b>`)).join("");
      }
      if(cambios.length){
        // El importe de cada línea es la diferencia, así que el total de la
        // sección es la variación neta: puede salir negativo y está bien.
        html+=tit("Cambian de importe", cambios)
          +agrupar(cambios).map(m=>linea(m,
            `${eur(m.importeAntes)} → <b>${eur(m.importeAhora)}</b>`)).join("");
      }
      if(anulados.length){
        html+=tit("Ya no están", anulados)
          +agrupar(anulados).map(m=>linea(m,`estaba previsto para el ${fechaCorta(m.fechaAntes)}`)).join("");
      }
      if(entradas.length){
        html+=tit("Entran nuevos", entradas)
          +entradas.map(m=>linea(m,`sale el ${fechaCorta(m.fechaNueva)}`)).join("");
      }
      html+=`</div>`;
    }

    if(!html) html=`<div class="grupo"><p class="vacio">
      Sin movimientos con los filtros actuales.</p></div>`;
    window.__notasPinta&&setTimeout(window.__notasPinta,0);
    $("app").innerHTML=html+`<p class="pie">
      Comparación con la sincronización anterior. Un pedido que desaparece con
      fecha ya pasada se da por servido; si su fecha era futura, se marca como
      anulado o modificado. · v1.16</p>`;
  }catch(e){
    $("app").innerHTML=`<div class="grupo"><p class="vacio">
      No se ha podido leer el diario: ${e.message}</p></div>`;
  }
}

const fechaCorta=(f)=>{
  if(!f) return "—";
  const d=new Date(f+"T12:00:00");
  return isNaN(d)?f:d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});
};

function pintar(){
  if(MODO==="diario"){ pintarDiario(); return; }
  if(!PEDIDOS.length){
    $("app").innerHTML=`<div class="grupo"><p class="vacio">
      No tienes pedidos con fecha de entrega pendiente.</p></div>`;
    return;
  }

  const grupos=new Map();
  for(const p of PEDIDOS){
    const e=etiqueta(p.fecha);
    if(!grupos.has(e.clave)) grupos.set(e.clave,{...e, lineas:[], importe:0, clientes:new Set()});
    const g=grupos.get(e.clave);
    g.lineas.push(p); g.importe+=p.importe||0; g.clientes.add(p.cliente);
  }
  const orden=[...grupos.values()].sort((a,b)=>a.clave.localeCompare(b.clave));

  const eurC=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
  const totalF=PEDIDOS.reduce((t,p)=>t+(p.importe||0),0);
  const pedidosF=new Set(PEDIDOS.map(p=>p.pedido).filter(Boolean)).size;
  const clientesF=new Set(PEDIDOS.map(p=>p.cliente)).size;
  const totalT=TODOS.reduce((t,p)=>t+(p.importe||0),0);
  const pedidosT=new Set(TODOS.map(p=>p.pedido).filter(Boolean)).size;
  const hayFiltro = !!(F_AGENTE || SIN_INTER);
  const prox=orden[0];

  let html=`<div class="resumen">
    <div class="bloque">
      <div class="et">${hayFiltro
        ? `${F_AGENTE||"Todos"}${SIN_INTER?" · sin intercompañía":""}`
        : "Todos los pedidos"}</div>
      <div class="par">
        <div><div class="v">${eurC(totalF)}</div><div class="e">Importe</div></div>
        <div><div class="v">${pedidosF}</div><div class="e">Pedidos</div></div>
        <div><div class="v">${clientesF}</div><div class="e">Clientes</div></div>
      </div>
      <div class="pie2">${PEDIDOS.length} líneas${
        hayFiltro && totalT ? ` · ${Math.round(totalF/totalT*100)} % de ${eurC(totalT)}` : ""}</div>
    </div>
  </div>
  ${prox?`<p class="prox">Próxima salida: <b>${prox.titulo}</b></p>`:""}`;

  // Solo la primera vez se abre el grupo inicial. Con una marca aparte,
  // porque si se comprueba "conjunto vacio" cerrar el unico grupo abierto
  // lo volveria a abrir solo.
  if(!INICIADO && orden.length){ ABIERTOS.add(orden[0].clave); INICIADO=true; }

  for(const g of orden){
    const abierto=ABIERTOS.has(g.clave);

    // Dentro de cada fecha, agrupado por cliente
    const porCli=new Map();
    for(const l of g.lineas){
      const k=l.cliente;
      if(!porCli.has(k)) porCli.set(k,{id:g.clave+"|"+k, cliente:k,
        nombre:l.nombre||k, poblacion:l.poblacion, inter:!!l.intercompany,
        importe:0, lineas:[], pedidos:new Set(), primera:l.fecha});
      const c=porCli.get(k);
      c.importe+=l.importe||0; c.lineas.push(l);
      if(l.fecha && (!c.primera || l.fecha < c.primera)) c.primera=l.fecha;
      if(l.pedido) c.pedidos.add(l.pedido);
    }

    const clase = g.dias<=1 ? "urge" : g.dias<=7 ? "pronto" : "";
    html+=`<div class="grupo">
      <div class="cab ${clase}" role="button" tabindex="0" aria-expanded="${abierto}"
        onclick="abrirGrupo('${g.clave}')">
        <div><div class="f">${g.titulo}</div>
          <div class="c">${g.sub}${g.sub?" · ":""}${porCli.size} cliente${porCli.size>1?"s":""}</div></div>
        <div class="imp">${eur(g.importe)}</div>
        <span class="flecha">›</span>
      </div>`;

    if(abierto){
      // Por fecha de salida, que es lo que se viene a consultar. A igualdad
      // de fecha manda el importe.
      const ordenCli=[...porCli.values()].sort((a,b)=>
        String(a.primera||"").localeCompare(String(b.primera||"")) ||
        (b.importe-a.importe));
      for(const c of ordenCli){
        const cAbierto=CLI_ABIERTO.has(c.id);
        html+=`<div class="linea" role="button" tabindex="0"
          aria-expanded="${cAbierto}" onclick="abrirCliente('${c.id}')">
          <div style="min-width:0">
            <div class="nom">${c.nombre}${c.inter?' <span style="font-size:10px;font-weight:700;color:#4338CA">·INTERCO</span>':""}</div>
            <div class="det">${c.poblacion?c.poblacion+" · ":""}${c.lineas.length} línea${c.lineas.length>1?"s":""}${
              c.pedidos.size?` · ${[...c.pedidos].slice(0,2).join(", ")}${c.pedidos.size>2?"…":""}`:""}${
              (()=>{
                if(MODO==="dia") return "";
                const fs=[...new Set(c.lineas.map(l=>l.fecha))].sort();
                if(!fs.length) return "";
                const corta=(f)=>{const d=new Date(f+"T00:00:00");
                  return `${d.getDate()}/${d.getMonth()+1}`;};
                return fs.length===1
                  ? ` · entrega ${corta(fs[0])}`
                  : ` · ${fs.length} fechas, de ${corta(fs[0])} a ${corta(fs[fs.length-1])}`;
              })()}</div>
          </div>
          <div class="der"><b>${eur(c.importe)}</b></div>
          <span class="flecha" style="margin-left:8px;color:#94A3B0">${cAbierto?"▾":"›"}</span>
        </div>`;

        if(cAbierto){
          // Las lineas del mismo numero de pedido van juntas: un pedido de
          // cinco articulos es UNA entrega, no cinco cosas sueltas.
          const porPedido={};
          c.lineas.forEach(l=>{
            const k=l.pedido||"__sin__";
            (porPedido[k]=porPedido[k]||[]).push(l);
          });
          const grupos=Object.keys(porPedido).map(k=>{
            const ls=porPedido[k];
            const fs=[...new Set(ls.map(l=>l.fecha).filter(Boolean))].sort();
            return {ped:k==="__sin__"?"":k, lineas:ls,
              importe:ls.reduce((s,l)=>s+(l.importe||0),0),
              fecha:fs[0]||"", fechas:fs};
          }).sort((a,b)=>String(a.fecha||"").localeCompare(String(b.fecha||""))
                        ||(b.importe-a.importe));

          html+=`<div class="detalle">${grupos.map(g=>{
            // Cabecera del pedido: numero, cuando sale y cuanto suma
            let cab="";
            if(g.ped||grupos.length>1){
              const partesCab=[];
              if(MODO!=="dia"&&g.fecha){
                const f=new Date(g.fecha+"T00:00:00");
                const hoy=new Date(); hoy.setHours(0,0,0,0);
                const dd=Math.round((f-hoy)/86400000);
                partesCab.push(dd===0?"sale hoy":dd===1?"sale mañana"
                  :`sale ${DIAS[f.getDay()].slice(0,3)} ${f.getDate()}/${f.getMonth()+1}`);
              }
              if(g.fechas.length>1) partesCab.push(g.fechas.length+" fechas");
              partesCab.push(g.lineas.length+" línea"+(g.lineas.length>1?"s":""));
              cab=`<div class="pedcab">
                <div style="min-width:0">
                  <b>${g.ped?"Pedido "+g.ped:"Sin número de pedido"}</b>
                  <span>${partesCab.join(" · ")}</span>
                </div>
                <b>${eur(g.importe)}</b>
              </div>`;
            }
            return cab+g.lineas
            .sort((a,b)=>
              String(a.fecha||"").localeCompare(String(b.fecha||"")) ||
              ((b.importe||0)-(a.importe||0)))
            .map(l=>{
              // Descripción, metros y calibre no están en la tabla de pedidos
              // validados; se muestran si algún día llegan en el documento.
              const partes=[];
              // Agrupando por semana o mes, cada linea puede salir un dia
              // distinto: sin la fecha no se sabe cuando llega cada cosa.
              // Solo se repite la fecha si dentro del pedido hay varias
              if(MODO!=="dia" && l.fecha && g.fechas.length>1){
                const f=new Date(l.fecha+"T00:00:00");
                const hoy=new Date(); hoy.setHours(0,0,0,0);
                const dd=Math.round((f-hoy)/86400000);
                partes.push(dd===0?"sale hoy":dd===1?"sale mañana"
                  :`sale ${DIAS[f.getDay()].slice(0,3)} ${f.getDate()}/${f.getMonth()+1}`);
              }
              // El numero de pedido ya va en la cabecera del grupo
              if(l.calibre) partes.push("calibre "+l.calibre);
              if(l.metros) partes.push(l.metros+" m");
              if(l.familia) partes.push("fam. "+l.familia
                + (l.subfamilia?"/"+l.subfamilia:""));
              return `<div class="art">
                <div style="min-width:0">
                  <div class="c">${l.descripcion||l.articulo||"—"}</div>
                  <div class="s">${l.descripcion&&l.articulo?l.articulo+" · ":""}${partes.join(" · ")}</div>
                </div>
                <div class="d">
                  <b>${eur(l.importe)}</b>
                  <div class="u">${(l.unidades||0).toLocaleString("es-ES")} uds${
                    l.precio?` · ${Number(l.precio).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})} €/u`:""}</div>
                </div>
              </div>`;
            }).join("");
          }).join("")}</div>`;
        }
      }
    }
    html+=`</div>`;
  }

  html+=`<p class="pie">Pedidos validados con fecha de entrega desde hoy.
    Se actualizan cada día a las 13:00. · v1.3</p>`;
  $("app").innerHTML=html;
  window.__notasPinta&&setTimeout(window.__notasPinta,0);
}

cargar();

// ═══════════════════════════════════════════════════════════════════
// (v-notas) HILO DE NOTAS POR PEDIDO — colección pedidos_notas.
// Cada nota lleva autor y fecha; el hilo queda asociado al nº de pedido
// y se comparte entre todos los que abren esta página.
// ═══════════════════════════════════════════════════════════════════
let NOTAS={};          // nº pedido → [notas ordenadas]
let NOTAS_OK=false;
let _nbSeq=0;

function notasBox(ped,cliente){
  const id="nb"+(_nbSeq++);
  const pe=String(ped).replace(/"/g,"&quot;");
  const ce=String(cliente).replace(/"/g,"&quot;");
  return `<div class="notasbox">
    <button class="nbt" data-ped="${pe}" data-h="${id}" type="button">💬 <i></i> notas</button>
    <div class="hilo" id="${id}" data-ped="${pe}" data-cli="${ce}"></div>
  </div>`;
}

function notasParse(d){
  const o={id:(d.name||"").split("/").pop()};
  const f=d.fields||{};
  for(const k in f) o[k]=val(f[k]);
  return o;
}
async function cargarNotas(){
  try{
    const r=await fetch(`${BASE}/pedidos_notas?pageSize=300`);
    if(!r.ok){NOTAS_OK=true;return;}
    const docs=((await r.json()).documents||[]).map(notasParse);
    NOTAS={};
    docs.sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(n=>{
      (NOTAS[n.pedido]=NOTAS[n.pedido]||[]).push(n);
    });
  }catch(e){}
  NOTAS_OK=true;
  window.__notasPinta();
}
function _enc(o){
  const f={};
  for(const k in o){
    const v=o[k];
    if(typeof v==="number") f[k]=Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
    else if(typeof v==="boolean") f[k]={booleanValue:v};
    else f[k]={stringValue:String(v==null?"":v)};
  }
  return {fields:f};
}
function _yo(){
  const u=sesion()||{};
  return {id:u.username||u.crmId||u.id||u.nombre||"anon",
          nombre:u.nombre||u.username||"Alguien"};
}
// (v-pliegos) Tocar un título pliega/abre su bloque; se recuerda por título.
const _secPleg={};
function _claveSec(el){return (el.textContent||"").split("·")[0].trim();}
function aplicarPliegues(){
  document.querySelectorAll(".sec").forEach(s=>{
    const pleg=!!_secPleg[_claveSec(s)];
    s.classList.toggle("plegada",pleg);
    let n=s.nextElementSibling;
    while(n&&!n.classList.contains("sec")&&!n.classList.contains("pie")){
      n.style.display=pleg?"none":"";
      n=n.nextElementSibling;
    }
  });
}

window.__notasPinta=function(){
  aplicarPliegues();
  document.querySelectorAll(".nbt").forEach(b=>{
    const n=(NOTAS[b.dataset.ped]||[]).length;
    const i=b.querySelector("i"); if(i) i.textContent=n>0?n:"";
  });
  document.querySelectorAll(".hilo.abierto").forEach(h=>pintarHilo(h));
};
function pintarHilo(h){
  const yo=_yo();
  const lista=NOTAS[h.dataset.ped]||[];
  let x=lista.length?"":`<p class="vacio">Sin notas aún — cuenta qué ha pasado con este pedido.</p>`;
  lista.forEach(n=>{
    const mia=n.por===yo.id||n.porNombre===yo.nombre;
    x+=`<div class="nota"><div class="ntx">${esc(n.texto)}</div>
      <div class="nmeta"><b>${esc(n.porNombre||"")}</b><span>${esc(n.fecha||"")}</span>
      ${mia?`<span class="ndel" data-id="${n.id}" data-ped="${h.dataset.ped}">🗑️</span>`:""}</div></div>`;
  });
  x+=`<div class="nform"><textarea rows="2" placeholder="Anotación sobre este pedido…"></textarea>
    <button type="button" class="nsave">＋</button></div>`;
  h.innerHTML=x;
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

document.addEventListener("click",async(ev)=>{
  const sec=ev.target.closest(".sec");
  if(sec){
    const k=_claveSec(sec);
    _secPleg[k]=!_secPleg[k];
    aplicarPliegues();
    return;
  }
  const bt=ev.target.closest(".nbt");
  if(bt){
    const h=document.getElementById(bt.dataset.h);
    if(!h)return;
    const abrir=!h.classList.contains("abierto");
    h.classList.toggle("abierto",abrir);
    if(abrir){
      if(!NOTAS_OK) await cargarNotas();
      pintarHilo(h);
      const t=h.querySelector("textarea"); if(t) t.focus();
    }
    return;
  }
  const del=ev.target.closest(".ndel");
  if(del){
    if(!confirm("¿Eliminar esta nota?"))return;
    const ped=del.dataset.ped, id=del.dataset.id;
    fetch(`${BASE}/pedidos_notas/${id}`,{method:"DELETE"}).catch(()=>{});
    NOTAS[ped]=(NOTAS[ped]||[]).filter(n=>n.id!==id);
    window.__notasPinta();
    return;
  }
  const sv=ev.target.closest(".nsave");
  if(sv){
    const h=sv.closest(".hilo");
    const t=h.querySelector("textarea");
    const texto=(t.value||"").trim();
    if(!texto)return;
    const yo=_yo();
    const nota={id:"pn"+Date.now(),pedido:h.dataset.ped,cliente:h.dataset.cli,
      texto:texto,por:yo.id,porNombre:yo.nombre,
      fecha:new Date().toLocaleDateString("es-ES")+" "+new Date().toTimeString().slice(0,5),
      ts:Date.now()};
    sv.disabled=true;
    try{
      await fetch(`${BASE}/pedidos_notas/${nota.id}`,{method:"PATCH",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(_enc(nota))});
    }catch(e){}
    sv.disabled=false;
    (NOTAS[nota.pedido]=NOTAS[nota.pedido]||[]).push(nota);
    window.__notasPinta();
  }
});
cargarNotas();

</script>
</body>
</html>
