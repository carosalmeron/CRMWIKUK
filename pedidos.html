<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos planificados · Grupo Consolidado</title>
<style>
  :root{--tinta:#0E1626;--papel:#F6F7F9;--blanco:#fff;--linea:#E2E6EC;
        --texto:#0E1626;--tenue:#69737F;--hoy:#B4232A;--pronto:#8A5A00;--ok:#12794A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--texto);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  header{background:var(--tinta);color:#fff;padding:18px 18px 20px}
  /* Zona de toque holgada: en movil una flecha pequena se falla siempre */
  .volver{display:inline-flex;align-items:center;gap:8px;color:#C6D0DC;
    text-decoration:none;font-size:15px;font-weight:600;margin-bottom:12px;
    padding:9px 14px 9px 10px;border-radius:11px;background:rgba(255,255,255,.09);
    min-height:44px}
  .volver:active{background:rgba(255,255,255,.18)}
  .volver .f{font-size:22px;line-height:1}
  h1{margin:0;font-size:20px;font-weight:800}
  .sub{margin:4px 0 0;font-size:13px;color:#93A1B5}
  main{padding:14px 14px 60px;max-width:760px;margin:0 auto}

  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{flex:1;padding:11px;border-radius:10px;font:inherit;font-size:13px;
    font-weight:700;border:1.5px solid var(--linea);background:#fff;color:var(--tenue);
    cursor:pointer}
  .tabs button[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}

  .resumen{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .bloque{flex:1 1 100%;background:var(--blanco);
    border:1px solid var(--linea);border-radius:13px;padding:14px 16px}
  /* Se distingue con un filete lateral, no invirtiendo el color: en pantalla
     pequena dos bloques de fondo opuesto compiten entre si. */
  .bloque.destacado{border-left:4px solid var(--tinta)}
  .bloque.destacado .et{color:var(--texto)}
  .et{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--tenue);margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .par{display:flex;gap:22px}
  .par>div{min-width:0}
  .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;line-height:1.15}
  .e{font-size:10px;color:var(--tenue);text-transform:uppercase;
    letter-spacing:.05em;font-weight:700;margin-top:2px}
  .pie2{font-size:11px;color:var(--tenue);margin-top:9px;
    padding-top:8px;border-top:1px solid var(--linea)}
  .prox{margin:0 0 14px;font-size:12.5px;color:var(--tenue)}
  .prox b{color:var(--texto)}

  /* Cada bloque es una fecha de salida: eso es lo que se viene a mirar */
  .grupo{background:var(--blanco);border:1px solid var(--linea);border-radius:13px;
    margin-bottom:11px;overflow:hidden}
  .cab{display:flex;align-items:baseline;gap:10px;padding:12px 15px;
    border-left:4px solid var(--linea);background:#FBFCFD}
  .cab.urge{border-left-color:var(--hoy)}
  .cab.pronto{border-left-color:var(--pronto)}
  .cab .f{font-weight:800;font-size:15px}
  .cab .c{font-size:11.5px;color:var(--tenue)}
  .cab .imp{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
  .linea{display:flex;gap:11px;padding:10px 15px;border-top:1px solid #EFF2F5;font-size:13.5px}
  .linea .nom{font-weight:600}
  .linea .det{font-size:11.5px;color:var(--tenue);margin-top:1px}
  .linea .der{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
  /* Filtros: agente e intercompania */
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .filtros select{flex:1;min-width:150px;font:inherit;font-size:13px;padding:10px 11px;
    border:1.5px solid var(--linea);border-radius:10px;background:#fff;color:var(--texto)}
  .chip{font:inherit;font-size:12.5px;font-weight:700;padding:9px 13px;border-radius:10px;
    border:1.5px solid var(--linea);background:#fff;color:var(--tenue);cursor:pointer}
  .chip[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:#fff}

  .cab{cursor:pointer;user-select:none}
  .cab .flecha{margin-left:10px;color:#94A3B0;font-size:15px;transition:transform .18s}
  .cab[aria-expanded=true] .flecha{transform:rotate(90deg)}
  .linea{cursor:pointer}
  .linea:active{background:#F4F7FA}
  .detalle{background:#F7F9FB;border-top:1px solid #E6EBF0;padding:2px 0}
  .art{display:flex;gap:12px;padding:13px 15px 13px 24px;font-size:14.5px;
    border-top:1px solid #E9EEF3;align-items:flex-start}
  .art:first-child{border-top:none}
  .art .c{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .art .s{font-size:12.5px;color:var(--tenue);margin-top:3px;line-height:1.45}
  .art .d{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none}
  .art .d b{font-size:16px;font-weight:800}
  .art .u{font-size:12.5px;color:var(--tenue);margin-top:3px}
  .vacio{padding:34px 16px;text-align:center;color:var(--tenue);font-size:14px}
  .cargando{padding:40px 0;text-align:center;color:var(--tenue)}
  .err{background:#FDF3F3;border:1px solid #F0C2C4;color:var(--hoy);
    padding:12px 14px;border-radius:11px;font-size:13px}
  .pie{margin-top:18px;font-size:11.5px;color:var(--tenue);text-align:center}
</style>
</head>
<body>

<header>
  <a class="volver" href="index.html"><span class="f">←</span> Volver al portal</a>
  <h1>Pedidos planificados</h1>
  <p class="sub" id="quien">Cargando…</p>
</header>

<main>
  <div class="filtros" id="filtros" hidden>
    <select id="fagente" onchange="filtrar()"></select>
    <button class="chip" id="finter" aria-pressed="false" onclick="alternarInter()">
      Sin intercompañía
    </button>
  </div>

  <div class="tabs" role="group" aria-label="Agrupar por">
    <button onclick="ver('dia')"    aria-pressed="true"  id="t-dia">Por día</button>
    <button onclick="ver('semana')" aria-pressed="false" id="t-semana">Por semana</button>
    <button onclick="ver('mes')"    aria-pressed="false" id="t-mes">Por mes</button>
  </div>
  <div id="app"><div class="cargando">Leyendo pedidos…</div></div>
</main>

<script>
const PROY="grupo-consolidado-crm";
const BASE=`https://firestore.googleapis.com/v1/projects/${PROY}/databases/(default)/documents`;
const $=(id)=>document.getElementById(id);
const eur=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
const norm=(s)=>String(s||"").toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
// Firestore devuelve cada campo con su tipo. Faltaba booleanValue, y por eso
// "intercompany" llegaba como nulo y el filtro no quitaba nada.
const val=(f)=>{
  if(!f) return null;
  if(f.doubleValue!==undefined)  return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.stringValue!==undefined)  return f.stringValue;
  return null;
};

let TODOS=[], PEDIDOS=[], MODO="dia";
let F_AGENTE="", SIN_INTER=false;
let INICIADO=false;            // ya se ha abierto el primer grupo
const ABIERTOS=new Set();      // grupos de fecha desplegados
const CLI_ABIERTO=new Set();   // clientes con el detalle abierto

const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio",
             "agosto","septiembre","octubre","noviembre","diciembre"];

function sesion(){
  try{ return JSON.parse(localStorage.getItem("gc_portal_user")||"{}"); }catch(e){ return {}; }
}

// Semana ISO: el lunes manda, que es como se organiza la ruta
function lunesDe(d){
  const x=new Date(d);
  const dow=(x.getDay()+6)%7;
  x.setDate(x.getDate()-dow);
  x.setHours(0,0,0,0);
  return x;
}

function etiqueta(fechaISO){
  const f=new Date(fechaISO+"T00:00:00");
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const dias=Math.round((f-hoy)/86400000);

  if(MODO==="dia"){
    const cuando = dias===0?"hoy" : dias===1?"mañana"
      : dias<7 ? DIAS[f.getDay()]
      : `${DIAS[f.getDay()]} ${f.getDate()} de ${MESES[f.getMonth()]}`;
    return {clave:fechaISO, titulo:cuando.charAt(0).toUpperCase()+cuando.slice(1),
            sub:f.toLocaleDateString("es-ES"), dias};
  }
  if(MODO==="semana"){
    const l=lunesDe(f), v=new Date(l); v.setDate(v.getDate()+4);
    const dl=Math.round((l-hoy)/86400000);
    const t = dl<=0 ? "Esta semana" : dl<8 ? "Semana que viene"
      : `Semana del ${l.getDate()} de ${MESES[l.getMonth()]}`;
    return {clave:l.toISOString().slice(0,10), titulo:t,
            sub:`${l.getDate()}/${l.getMonth()+1} al ${v.getDate()}/${v.getMonth()+1}`, dias:dl};
  }
  const t=`${MESES[f.getMonth()]} ${f.getFullYear()}`;
  return {clave:`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,"0")}`,
          titulo:t.charAt(0).toUpperCase()+t.slice(1), sub:"", dias};
}

async function cargar(){
  const u=sesion();
  let clave=null, titulo="Todos los comerciales";

  try{
    // A quién corresponde: si el usuario es comercial, solo lo suyo
    const ru=await fetch(`${BASE}/usuarios?pageSize=300`);
    const usuarios = ru.ok ? ((await ru.json()).documents||[]).map(d=>{
      const o={_id:d.name.split("/").pop()};
      for(const [k,v] of Object.entries(d.fields||{})) o[k]=val(v);
      return o;
    }) : [];

    const rol=String(u.rol||"").toLowerCase();
    const mando = rol.includes("director")||rol==="admin"||rol==="ceo";
    if(!mando){
      const f=usuarios.find(x=>(u.crmId&&(x._id||x.id)===u.crmId)
        || (u.username&&norm(x.username)===norm(u.username))
        || (u.nombre&&norm(x.nombre)===norm(u.nombre)));
      clave = norm((f&&(f.grupoAgente||f.catalogoVendedor))||u.username)||null;
      if(clave) titulo = (f&&f.nombre)||clave;
    }
    $("quien").textContent = titulo;

    // Solo los pedidos que tocan: una consulta filtrada, no la colección
    const cuerpo = clave
      ? {structuredQuery:{from:[{collectionId:"pbi_pedidos"}],
          where:{fieldFilter:{field:{fieldPath:"agente"},op:"EQUAL",
                 value:{stringValue:clave}}}, limit:2000}}
      : {structuredQuery:{from:[{collectionId:"pbi_pedidos"}], limit:2000}};

    const r=await fetch(`${BASE}:runQuery`,{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(cuerpo)});
    const j=await r.json();
    TODOS=(Array.isArray(j)?j:[]).filter(x=>x.document).map(x=>{
      const o={};
      for(const [k,v] of Object.entries(x.document.fields||{})) o[k]=val(v);
      return o;
    }).filter(p=>p.fecha);

    // El filtro de agente solo tiene sentido para quien ve varios
    if(!clave){
      const ags=[...new Set(TODOS.map(p=>p.agente).filter(Boolean))].sort();
      $("fagente").innerHTML=`<option value="">Todos los comerciales (${ags.length})</option>`
        + ags.map(a=>`<option value="${a}">${a}</option>`).join("");
      $("filtros").hidden=false;
    }else{
      // Un comercial solo necesita el filtro de intercompania
      $("fagente").hidden=true;
      $("filtros").hidden=false;
    }

    filtrar();
  }catch(e){
    $("app").innerHTML=`<div class="err">No se han podido cargar los pedidos: ${e.message}</div>`;
  }
}

function ver(modo){
  MODO=modo;
  for(const m of ["dia","semana","mes"])
    $("t-"+m).setAttribute("aria-pressed", String(m===modo));
  ABIERTOS.clear(); INICIADO=false;
  pintar();
}

function filtrar(){
  F_AGENTE=$("fagente").value||"";
  PEDIDOS=TODOS.filter(p=>
    (!F_AGENTE || p.agente===F_AGENTE) &&
    (!SIN_INTER || !p.intercompany));
  ABIERTOS.clear(); INICIADO=false;
  pintar();
}

function alternarInter(){
  SIN_INTER=!SIN_INTER;
  $("finter").setAttribute("aria-pressed", String(SIN_INTER));
  filtrar();
}

function abrirGrupo(clave){
  if(ABIERTOS.has(clave)) ABIERTOS.delete(clave); else ABIERTOS.add(clave);
  pintar();
}

function abrirCliente(id){
  if(CLI_ABIERTO.has(id)) CLI_ABIERTO.delete(id); else CLI_ABIERTO.add(id);
  pintar();
}

function pintar(){
  if(!PEDIDOS.length){
    $("app").innerHTML=`<div class="grupo"><p class="vacio">
      No tienes pedidos con fecha de entrega pendiente.</p></div>`;
    return;
  }

  const grupos=new Map();
  for(const p of PEDIDOS){
    const e=etiqueta(p.fecha);
    if(!grupos.has(e.clave)) grupos.set(e.clave,{...e, lineas:[], importe:0, clientes:new Set()});
    const g=grupos.get(e.clave);
    g.lineas.push(p); g.importe+=p.importe||0; g.clientes.add(p.cliente);
  }
  const orden=[...grupos.values()].sort((a,b)=>a.clave.localeCompare(b.clave));

  const eurC=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
  const totalF=PEDIDOS.reduce((t,p)=>t+(p.importe||0),0);
  const pedidosF=new Set(PEDIDOS.map(p=>p.pedido).filter(Boolean)).size;
  const clientesF=new Set(PEDIDOS.map(p=>p.cliente)).size;
  const totalT=TODOS.reduce((t,p)=>t+(p.importe||0),0);
  const pedidosT=new Set(TODOS.map(p=>p.pedido).filter(Boolean)).size;
  const hayFiltro = !!(F_AGENTE || SIN_INTER);
  const prox=orden[0];

  let html=`<div class="resumen">
    <div class="bloque">
      <div class="et">${hayFiltro
        ? `${F_AGENTE||"Todos"}${SIN_INTER?" · sin intercompañía":""}`
        : "Todos los pedidos"}</div>
      <div class="par">
        <div><div class="v">${eurC(totalF)}</div><div class="e">Importe</div></div>
        <div><div class="v">${pedidosF}</div><div class="e">Pedidos</div></div>
        <div><div class="v">${clientesF}</div><div class="e">Clientes</div></div>
      </div>
      <div class="pie2">${PEDIDOS.length} líneas${
        hayFiltro && totalT ? ` · ${Math.round(totalF/totalT*100)} % de ${eurC(totalT)}` : ""}</div>
    </div>
  </div>
  ${prox?`<p class="prox">Próxima salida: <b>${prox.titulo}</b></p>`:""}`;

  // Solo la primera vez se abre el grupo inicial. Con una marca aparte,
  // porque si se comprueba "conjunto vacio" cerrar el unico grupo abierto
  // lo volveria a abrir solo.
  if(!INICIADO && orden.length){ ABIERTOS.add(orden[0].clave); INICIADO=true; }

  for(const g of orden){
    const abierto=ABIERTOS.has(g.clave);

    // Dentro de cada fecha, agrupado por cliente
    const porCli=new Map();
    for(const l of g.lineas){
      const k=l.cliente;
      if(!porCli.has(k)) porCli.set(k,{id:g.clave+"|"+k, cliente:k,
        nombre:l.nombre||k, poblacion:l.poblacion, inter:!!l.intercompany,
        importe:0, lineas:[], pedidos:new Set(), primera:l.fecha});
      const c=porCli.get(k);
      c.importe+=l.importe||0; c.lineas.push(l);
      if(l.fecha && (!c.primera || l.fecha < c.primera)) c.primera=l.fecha;
      if(l.pedido) c.pedidos.add(l.pedido);
    }

    const clase = g.dias<=1 ? "urge" : g.dias<=7 ? "pronto" : "";
    html+=`<div class="grupo">
      <div class="cab ${clase}" role="button" tabindex="0" aria-expanded="${abierto}"
        onclick="abrirGrupo('${g.clave}')">
        <div><div class="f">${g.titulo}</div>
          <div class="c">${g.sub}${g.sub?" · ":""}${porCli.size} cliente${porCli.size>1?"s":""}</div></div>
        <div class="imp">${eur(g.importe)}</div>
        <span class="flecha">›</span>
      </div>`;

    if(abierto){
      // Por fecha de salida, que es lo que se viene a consultar. A igualdad
      // de fecha manda el importe.
      const ordenCli=[...porCli.values()].sort((a,b)=>
        String(a.primera||"").localeCompare(String(b.primera||"")) ||
        (b.importe-a.importe));
      for(const c of ordenCli){
        const cAbierto=CLI_ABIERTO.has(c.id);
        html+=`<div class="linea" role="button" tabindex="0"
          aria-expanded="${cAbierto}" onclick="abrirCliente('${c.id}')">
          <div style="min-width:0">
            <div class="nom">${c.nombre}${c.inter?' <span style="font-size:10px;font-weight:700;color:#4338CA">·INTERCO</span>':""}</div>
            <div class="det">${c.poblacion?c.poblacion+" · ":""}${c.lineas.length} línea${c.lineas.length>1?"s":""}${
              c.pedidos.size?` · ${[...c.pedidos].slice(0,2).join(", ")}${c.pedidos.size>2?"…":""}`:""}${
              (()=>{
                if(MODO==="dia") return "";
                const fs=[...new Set(c.lineas.map(l=>l.fecha))].sort();
                if(!fs.length) return "";
                const corta=(f)=>{const d=new Date(f+"T00:00:00");
                  return `${d.getDate()}/${d.getMonth()+1}`;};
                return fs.length===1
                  ? ` · entrega ${corta(fs[0])}`
                  : ` · ${fs.length} fechas, de ${corta(fs[0])} a ${corta(fs[fs.length-1])}`;
              })()}</div>
          </div>
          <div class="der"><b>${eur(c.importe)}</b></div>
          <span class="flecha" style="margin-left:8px;color:#94A3B0">${cAbierto?"▾":"›"}</span>
        </div>`;

        if(cAbierto){
          html+=`<div class="detalle">${c.lineas
            .sort((a,b)=>
              String(a.fecha||"").localeCompare(String(b.fecha||"")) ||
              ((b.importe||0)-(a.importe||0)))
            .map(l=>{
              // Descripción, metros y calibre no están en la tabla de pedidos
              // validados; se muestran si algún día llegan en el documento.
              const partes=[];
              // Agrupando por semana o mes, cada linea puede salir un dia
              // distinto: sin la fecha no se sabe cuando llega cada cosa.
              if(MODO!=="dia" && l.fecha){
                const f=new Date(l.fecha+"T00:00:00");
                const hoy=new Date(); hoy.setHours(0,0,0,0);
                const dd=Math.round((f-hoy)/86400000);
                partes.push(dd===0?"sale hoy":dd===1?"sale mañana"
                  :`sale ${DIAS[f.getDay()].slice(0,3)} ${f.getDate()}/${f.getMonth()+1}`);
              }
              if(l.pedido) partes.push(l.pedido);
              if(l.calibre) partes.push("calibre "+l.calibre);
              if(l.metros) partes.push(l.metros+" m");
              if(l.familia) partes.push("fam. "+l.familia
                + (l.subfamilia?"/"+l.subfamilia:""));
              return `<div class="art">
                <div style="min-width:0">
                  <div class="c">${l.descripcion||l.articulo||"—"}</div>
                  <div class="s">${l.descripcion&&l.articulo?l.articulo+" · ":""}${partes.join(" · ")}</div>
                </div>
                <div class="d">
                  <b>${eur(l.importe)}</b>
                  <div class="u">${(l.unidades||0).toLocaleString("es-ES")} uds${
                    l.precio?` · ${Number(l.precio).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})} €/u`:""}</div>
                </div>
              </div>`;
            }).join("")}</div>`;
        }
      }
    }
    html+=`</div>`;
  }

  html+=`<p class="pie">Pedidos validados con fecha de entrega desde hoy.
    Se actualizan cada día a las 13:00. · v1.3</p>`;
  $("app").innerHTML=html;
}

cargar();
</script>
</body>
</html>
