@media(max-width:640px){body{font-size:18px}.tabs{gap:5px}.tab{font-size:12px;padding:8px 1px}.tab b{font-size:26px}h1{font-size:22px}.cli{font-size:21px}}

</style></head><body>
<div class="top"><div class="fila"><h1>🗓️ Planificación de producción</h1>
<button class="pill" id="dbPill" onclick="cambiarDb()"></button>
<button class="bt g" style="padding:9px 14px;font-size:16px" onclick="cargar()">🔄 Actualizar</button></div>

<div class="w"><input class="bus" id="bus" placeholder="🔎 Buscar artículo, cliente o nº de pedido / orden" oninput="pintar()"><div id="lista"><div class="carg">Cargando de SAP…</div></div></div>
<script>/* pase SAP: lo da el portal al entrar */
(function(){
  // Pase de SAP: lo da el portal al entrar (usuario y contraseña del portal, una vez cada 30 días).
  // Aquí no se pide ninguna contraseña: si falta el pase, se explica y se ofrece salir y volver a entrar.
  var K='sap_pedido_key';
  function galleta(){ var m=/(?:^|;\s*)sap_pase=([^;]+)/.exec(document.cookie||'')||/(?:^|;\s*)cs_pase=([^;]+)/.exec(document.cookie||''); return m?decodeURIComponent(m[1]):''; }
  function get(){ var t=''; try{ t=localStorage.getItem(K)||''; }catch(e){} return exp(t)>Date.now()?t:galleta(); }
  function exp(t){ var m=/^crm\.([A-Za-z0-9_-]+)\./.exec(t||''); if(!m) return 0; try{ return JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))).exp||0; }catch(e){ return 0; } }
  var abierto=false;
  function ventana(motivo){
    if(abierto) return; abierto=true;
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif');
    d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:380px;width:100%;padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.3)">'
      +'<div style="font-weight:800;font-size:18px">🔐 Falta el permiso de SAP</div>'
      +'<div style="font-size:14px;color:#334155;margin:8px 0 14px;line-height:1.45">'+(motivo||'Este aparato todavía no tiene permiso para SAP.')+'<br><br>Sal del portal y vuelve a entrar con tu usuario: el permiso se activa solo y dura 30 días.'+(function(){ var e=''; try{ e=localStorage.getItem('sap_pase_error')||''; }catch(x){} return e?'<div style="margin-top:10px;background:#FEE2E2;color:#991B1B;border-radius:8px;padding:8px;font-weight:700">Último intento: '+String(e).replace(/[<>&]/g,'')+'</div>':''; })()+'</div>'
      +'<button id="sp_out" style="width:100%;font-size:17px;font-weight:800;padding:12px;border:0;border-radius:10px;background:#0F172A;color:#fff">Salir y volver a entrar</button>'
      +'<button id="sp_x" style="width:100%;font-size:15px;font-weight:700;padding:10px;border:0;background:transparent;color:#64748B;margin-top:6px">Ahora no</button></div>';
    document.body.appendChild(d);
    document.getElementById('sp_x').onclick=function(){ d.remove(); abierto=false; };
    document.getElementById('sp_out').onclick=function(){
      try{ localStorage.removeItem(K); localStorage.removeItem('gc_portal_user'); }catch(e){}
      try{ if(window.top&&window.top.doLogout){ window.top.doLogout(); return; } }catch(e){}
      try{ window.top.location.href='/'; }catch(e){ location.href='/'; }
    };
  }
  // Intento automático: con la sesión del portal abierta en ESTE navegador (gc_portal_user), se lee la ficha del usuario
  // y se pide el pase sin preguntar nada. Así funciona en Safari, Chrome o cualquier navegador donde se haya entrado al portal.
  async function auto(){
    var pu=null; try{ pu=JSON.parse(localStorage.getItem('gc_portal_user')||'null'); if(!pu||!pu.id){ var sid=localStorage.getItem('sap_portal_id')||decodeURIComponent((/(?:^|;\s*)sap_portal_id=([^;]+)/.exec(document.cookie)||[])[1]||''); if(sid) pu={id:sid}; } }catch(e){}
    if(!pu||!pu.id) return 'no hay sesión del portal en este navegador';
    var h=pu.passHash||'';
    if(!h){ try{ var FB='https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents';
      for(var col of ['portal_users','usuarios']){ var r=await fetch(FB+'/'+col+'/'+encodeURIComponent(pu.id)); if(!r.ok) continue; var j=await r.json(); var f=(j.fields||{}).passHash; if(f&&f.stringValue){ h=f.stringValue; break; } } }catch(e){} }
    if(!h) return 'no encuentro la ficha del usuario '+pu.id;
    try{ var r2=await fetch('/api/sap-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:pu.id,passHash:h})});
      var j2=await r2.json().catch(function(){ return {ok:false,error:'HTTP '+r2.status}; });
      if(j2&&j2.ok&&j2.token){ try{ localStorage.setItem(K,j2.token); localStorage.removeItem('sap_pase_error'); }catch(e){} return ''; }
      return (j2&&j2.error)||'sin respuesta'; }catch(e){ return 'no se llega al servidor: '+e.message; } }
  var intentado=false;
  async function resolver(motivo){
    if(!intentado){ intentado=true; var err=await auto(); if(!err){ location.reload(); return; } try{ localStorage.setItem('sap_pase_error',err); }catch(e){} }
    ventana(motivo);
  }
  window.pedirPaseSap=resolver;
  var f0=window.fetch;
  window.fetch=function(u,o){ return f0.apply(this,arguments).then(function(r){ try{ if(r.status===401&&/\/api\/sap-(pedido|factura|produccion|traslado|planificacion|cs)/.test(String(u&&u.url||u))) setTimeout(function(){ resolver(exp(get())?'El permiso guardado ya no vale.':''); },0); }catch(e){} return r; }); };
  if(!(exp(get())>Date.now())){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ resolver(); }); else resolver(); }
})();
</script>
<script>
const API="/api/sap-cs";
const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
let DB=LS("cs_db_real")||"U_CARO_00", TAB="fab", CEN=LS("pl_centro")||"", MES="", LIN=[], TIPOS={}, ALMS=[], ART={}, PEDS=[], ORD=[], VERD={};
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fx=(d)=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7)+"/"+String(d).slice(0,4):"—";
const n=(v)=>(Math.round((Number(v)||0)*100)/100).toLocaleString("es-ES");
const HOY=new Date().toISOString().slice(0,10);
const PROD=["1","2","3","6","7"];
const quiere=(p)=>p.pideComercial||p.entrega||"";
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const meses=(()=>{ const o=[]; const d=new Date(); d.setDate(1); for(let k=0;k<4;k++){ const y=d.getFullYear(), m=d.getMonth(); const ini=new Date(Date.UTC(y,m,1)).toISOString().slice(0,10), fin=new Date(Date.UTC(y,m+1,0)).toISOString().slice(0,10); o.push({k:ini.slice(0,7),ini,fin,nom:MESES[m]+(k?"":" (este mes)")}); d.setMonth(m+1); } return o; })();
MES=meses[0].k;
const mesDe=(k)=>meses.find(m=>m.k===k)||meses[0];
const TB={fab:["📥","Por fabricar","Aceptados por CS"],glob:["📦","Globales","Del periodo"],ord:["🏭","Órdenes","Del mes, por día"],mov:["🔁","Movimientos","De almacén"]};
let MOV=null, MDIAS=Number(LS("pl_mdias"))||7, MALM=LS("pl_malm")||"";
function pill(){ const p=document.getElementById("dbPill"); p.textContent=DB==="U_CARO_00"?"SAP REAL":"SAP PRUEBAS"; p.className="pill "+(DB==="U_CARO_00"?"pv":"pp"); }
window.cambiarDb=()=>dialogo('<h2>¿Qué SAP?</h2><button class="bt a op" onclick="ponDb(\'U_CARO_99\')">🧪 Pruebas · U_CARO_99</button><button class="bt op" style="background:#B91C1C" onclick="ponDb(\'U_CARO_00\')">⚠️ Real · U_CARO_00</button><button class="bt g op" onclick="cerrar()">Cancelar</button>');
window.ponDb=(d)=>{ DB=d; LS("cs_db_real",d); LIN=[]; ORD=[]; cerrar(); pill(); cargar(); };
async function api(url,opts){ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(DB),Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json","x-crm-key":LS("sap_pedido_key")||""}},opts||{})); return r.json().catch(()=>({ok:false,error:"sin respuesta del servidor (HTTP "+r.status+")"})); }
function aviso(t,ok){ const d=document.createElement("div"); d.className="msg"; d.style.background=ok?"#16A34A":"#B91C1C"; d.style.color="#fff"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ok?5000:10000); }
function marcaCarga(t){ let m=document.getElementById("cargando"); if(!m){ m=document.createElement("div"); m.id="cargando"; m.setAttribute("style","margin-top:8px;font-size:15px;font-weight:700;color:#1D4ED8"); document.querySelector(".top").appendChild(m); } m.textContent=t||""; m.hidden=!t; }
function aplicar(j,o){ TIPOS=j.tipos||{}; ART=j.articulos||{}; PEDS=(j.pedidos||[]).filter(p=>p.etapa!=="servido"&&p.etapa!=="anulado"); LIN=[];
  PEDS.forEach(p=>(p.lineas||[]).forEach(l=>{ if(l.sol) LIN.push(Object.assign({},l,{p})); })); ORD=(o&&o.ordenes)||[]; pintar(); }
async function cargar(){
  let copia=false; if(!LIN.length){ try{ const c=JSON.parse(sessionStorage.getItem("pl_cache_"+DB)||"null"); if(c&&c.j){ aplicar(c.j,c.o); copia=true; } }catch(e){} }
  if(!copia&&!LIN.length) document.getElementById("lista").innerHTML='<div class="carg">Cargando de SAP…</div>';
  const t0=Date.now(), reloj=setInterval(()=>marcaCarga("🔄 Actualizando desde SAP… "+Math.round((Date.now()-t0)/1000)+" s"),1000); marcaCarga("🔄 Actualizando desde SAP…");
  const [j,o]=await Promise.all([api(API+"?pedidos=1&solo=prod"),api(API+"?plan=1")]); clearInterval(reloj);
  if(!j.ok||!o.ok){ marcaCarga(""); const e=(j.error||o.error||""); if(LIN.length) return aviso("No se ha podido actualizar: "+e,false); document.getElementById("lista").innerHTML='<div class="nada" style="color:#B91C1C">No se ha podido leer SAP:<br><b>'+esc(e)+'</b></div>'; return; }
  try{ sessionStorage.setItem("pl_cache_"+DB,JSON.stringify({j,o})); }catch(e){}
  marcaCarga("✓ Actualizado a las "+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})); aplicar(j,o); }
window.ponCen=(c)=>{ CEN=c; LS("pl_centro",c); pintar(); };
window.ponMes=(m)=>{ MES=m; pintar(); };
window.verTab=(t)=>{ TAB=t; if(t==="mov"&&!MOV) cargarMov(); pintar(); };
async function cargarMov(){ MOV=null; await almacenes(); document.getElementById("lista").innerHTML='<div class="carg">Cargando movimientos de SAP…</div>'; const j=await api(API+"?movimientos=1&dias="+MDIAS+(MALM?"&almacen="+encodeURIComponent(MALM):"")); MOV=j.ok?(j.movimientos||[]):[]; if(!j.ok) aviso("No se han podido leer los movimientos: "+(j.error||""),false); pintar(); }
window.ponMDias=(d)=>{ MDIAS=d; LS("pl_mdias",d); cargarMov(); };
window.ponMAlm=(a)=>{ MALM=a; LS("pl_malm",a); cargarMov(); };
function detalleH(l){ const a=ART[l.articulo]||{alm:[],fab:[],compras:[]};
  const tabla=(cab,filas)=>'<table style="width:100%;border-collapse:collapse;font-size:16px;margin-top:6px"><tr>'+cab.map(c=>'<th style="text-align:left;border-bottom:2px solid #E2E8F0;padding:5px 4px;color:#64748B;font-size:14px">'+c+'</th>').join('')+'</tr>'+filas.join('')+'</table>';
  const td=(v,b)=>'<td style="padding:6px 4px;border-bottom:1px solid #F1F5F9'+(b?';font-weight:800':'')+'">'+v+'</td>';
  const alm=a.alm.map(x=>'<tr'+(x.alm===l.alm?' style="background:#FEF3C7"':'')+'>'+td(esc(x.alm),1)+td(n(x.stock))+td(n(x.comp))+td('<span style="color:'+(x.libre<0?'#B91C1C':'#15803D')+'">'+n(x.libre)+'</span>',1)+td(n(x.ped))+'</tr>');
  const otros=[]; PEDS.forEach(p=>p.lineas.forEach(x=>{ if(x.articulo===l.articulo) otros.push({p,x}); }));
  otros.sort((a,b)=>String(quiere(a.p)).localeCompare(String(quiere(b.p))));
  const ped=otros.map(o=>'<tr'+(o.p.entry===l.p.entry&&o.x.linea===l.linea?' style="background:#DBEAFE"':'')+'>'+td(esc(o.p.nombre.slice(0,26)))+td(o.p.num)+td(n(o.x.pide),1)+td(fx(quiere(o.p)))+'</tr>');
  const fab=a.fab.map(x=>'<tr>'+td(x.orden,1)+td(esc(x.estado))+td(n(x.uds),1)+td(fx(x.fecha)+(x.fecha&&x.fecha<HOY?' <b style="color:#B91C1C">tarde</b>':''))+td(esc(x.alm))+'</tr>');
  const com=a.compras.map(x=>'<tr'+(x.previsto?' style="color:#64748B"':'')+'>'+td(esc(x.clase||'pedido de compra')+' <b>'+x.orden+'</b>'+(x.prov?'<br><span style="font-size:12px">'+esc(x.prov)+'</span>':''))+td(n(x.uds),1)+td(fx(x.fecha)+(x.fecha&&x.fecha<HOY?' <b style="color:#B91C1C">tarde</b>':''))+td(esc(x.alm||''))+'</tr>');
  const totP=otros.reduce((t,o)=>t+(Number(o.x.pide)||0),0), totF=a.fab.reduce((t,x)=>t+x.uds,0), totC=a.compras.filter(x=>!x.previsto).reduce((t,x)=>t+x.uds,0), totPrev=a.compras.filter(x=>x.previsto).reduce((t,x)=>t+x.uds,0), totS=a.alm.reduce((t,x)=>t+x.stock,0), totCo=a.alm.reduce((t,x)=>t+x.comp,0), bal=totS-totCo+totF+totC;
  return '<div style="background:#F8FAFC;border:2px solid #E2E8F0;border-radius:14px;padding:12px;margin-top:10px">'

  for(let i=0;i<M.length;i++){ const u=Number(document.getElementById("u"+i).value); b.textContent="Creando "+(i+1)+" de "+M.length+"…"; const j=await escribir({accion:"ordenar",entry:M[i].p.entry,linea:M[i].linea,uds:u,fecha:f,almacen:a},null,true); if(j.ok) ok++; else err.push(M[i].p.num+": "+j.error); }
  cerrar(); aviso((ok?"✅ "+ok+" orden(es) creada(s)":"")+(err.length?" · ❌ "+err.join(" · "):""),!err.length); cargar(); };
window.dlgDeGlobal=()=>{ const M=marcadas(), g=globalesDe(ARTA)[0], tot=M.reduce((t,l)=>t+l.pide,0), f=M.map(l=>l.entrega).filter(x=>x&&x>=HOY).sort()[0]||HOY;
  dialogo('<h2>✂️ Sacar de la global '+g.num+'</h2><p>'+esc(ARTA)+' · quedan <b>'+n(g.uds)+'</b> por repartir. Se crea una orden por pedido, enlazada a la global <b>y</b> al pedido.</p>'
   +M.map((l,i)=>'<div class="chk on" style="cursor:default"><div style="flex:1"><b>'+esc(l.p.nombre)+'</b> · pedido '+l.p.num+'</div><input class="num" style="width:130px;margin:0" type="number" inputmode="decimal" id="u'+i+'" value="'+l.pide+'"></div>').join("")
   +(tot>g.uds?'<p style="color:#B91C1C;font-weight:800">⚠️ Piden '+n(tot)+' y en la global solo quedan '+n(g.uds)+'.</p>':'')
   +'<p><b>¿Qué día?</b></p><input type="date" id="f" min="'+HOY+'" value="'+f+'"><label class="chk"><input type="checkbox" id="lib"> Liberar ya (se puede fabricar en el obrador)</label>'

window.enviarDeGlobal=async(abs,b)=>{ const M=marcadas(), f=document.getElementById("f").value, lib=document.getElementById("lib").checked; if(!f) return aviso("Pon el día",false);
  b.disabled=true; let ok=0; const err=[];
  for(let i=0;i<M.length;i++){ const u=Number(document.getElementById("u"+i).value); b.textContent="Creando "+(i+1)+" de "+M.length+"…"; const j=await escribir({accion:"hija",global:abs,entry:M[i].p.entry,linea:M[i].linea,uds:u,fecha:f,liberar:lib},null,true); if(j.ok) ok++; else err.push(M[i].p.num+": "+j.error); }
  cerrar(); aviso((ok?"✅ "+ok+" orden(es) creada(s) de la global":"")+(err.length?" · ❌ "+err.join(" · "):""),!err.length); cargar(); };
window.dlgGlobal=async(a)=>{ await almacenes(); const M=mesDe(MES), A=ART[a]||{alm:[],fab:[],compras:[]};
  const dem=LIN.filter(l=>l.articulo===a&&aceptada(l)).reduce((t,l)=>t+l.pide,0), bal=A.alm.reduce((t,x)=>t+x.stock-x.comp,0)+A.fab.reduce((t,x)=>t+x.uds,0)+A.compras.reduce((t,x)=>t+x.uds,0);
  const sug=bal<0?-bal:dem, cen=centroDe(a), def=(cen&&LS("pc_alm_"+cen))||"BA01";
  dialogo('<h2>📦 Producción global del periodo</h2><p>Una orden <b>planificada</b> con el total; luego sacarás de ella las órdenes semanales o diarias.</p>'
   +'<p><b>Artículo</b></p><input class="num" id="ga" data-buscador value="'+esc(a)+'" placeholder="🔎 Escribe código o descripción" style="font-size:20px">'
   +'<p><b>¿Cuánto en total?</b>'+(a?' <span class="sub">(balance '+n(bal)+' · aceptado '+n(dem)+')</span>':'')+'</p><input class="num" type="number" inputmode="decimal" id="gu" value="'+(sug>0?Math.round(sug):"")+'">'
   +'<p><b>Periodo</b></p><div class="cen" style="flex-wrap:wrap">'+meses.map((m,i)=>'<button id="gm'+i+'" class="'+(m.k===MES?'on':'')+'" onclick="gMes('+i+')">'+esc(m.nom.replace(" (este mes)",""))+'</button>').join("")+'</div>'
   +'<div style="display:flex;gap:8px"><div style="flex:1"><p><b>Desde</b></p><input type="date" id="gd" value="'+(M.ini<HOY?HOY:M.ini)+'"></div><div style="flex:1"><p><b>Hasta</b></p><input type="date" id="gh" value="'+M.fin+'"></div></div>'
   +'<p><b>Almacén</b></p>'+selAlm("gw",def)+'<p><b>Nota</b> (opcional)</p><textarea id="gn" rows="2" placeholder="Ej.: campaña de Navidad"></textarea>'
   +'<button class="bt a op" onclick="enviarGlobal(this)">Crear producción global en SAP</button><button class="bt g op" onclick="'+(a&&ARTA===a?'pintarArt()':'cerrar()')+'">Volver</button>',true); };
window.gMes=(i)=>{ const m=meses[i]; document.getElementById("gd").value=m.ini<HOY?HOY:m.ini; document.getElementById("gh").value=m.fin; document.querySelectorAll("[id^=gm]").forEach((b,k)=>b.className=k===i?"on":""); };
window.enviarGlobal=(b)=>{ const a=document.getElementById("ga").value.trim().toUpperCase(), u=Number(document.getElementById("gu").value), d=document.getElementById("gd").value, h=document.getElementById("gh").value;
  if(!a) return aviso("Pon el artículo",false); if(!(u>0)) return aviso("Pon la cantidad",false); if(!d||!h||h<d) return aviso("Revisa el periodo",false);
  escribir({accion:"global",articulo:a,uds:u,desde:d,hasta:h,almacen:document.getElementById("gw").value,nota:document.getElementById("gn").value.trim()},b); };
window.dlgHija=async(abs)=>{ await almacenes(); const g=ORD.find(o=>o.abs===abs); const L=LIN.filter(l=>l.articulo===g.art&&aceptada(l));
  dialogo('<h2>✂️ Orden de la global '+g.num+'</h2><p>'+esc(g.art)+' · quedan <b>'+n(g.uds)+'</b> por repartir</p>'
   +'<p><b>¿Cuánto?</b></p><input class="num" type="number" inputmode="decimal" id="hu" value="'+Math.min(g.uds,Math.round(g.uds/4)||g.uds)+'">'
   +'<div class="btl">'+[["Una semana",Math.round(g.uds/4)],["La mitad",Math.round(g.uds/2)],["Todo",g.uds]].map(x=>'<button class="bt g" onclick="document.getElementById(\'hu\').value='+x[1]+'">'+x[0]+' ('+n(x[1])+')</button>').join("")+'</div>'
   +'<p><b>¿Qué día?</b></p><input type="date" id="hf" min="'+HOY+'" value="'+(g.inicio>HOY?g.inicio:HOY)+'">'
   +'<p><b>Almacén</b></p>'+selAlm("hw",g.alm)
   +'<p><b>¿Para un pedido concreto?</b> (opcional: queda trazado al cliente)</p><select class="sel" id="hp"><option value="">— Sin pedido (stock) —</option>'+L.map(l=>'<option value="'+l.p.entry+'|'+l.linea+'">'+esc(l.p.nombre.slice(0,30))+' · '+l.p.num+' · '+n(l.pide)+'</option>').join("")+'</select>'
   +'<label class="chk"><input type="checkbox" id="hl"> Liberar ya (se puede fabricar en el obrador)</label>'
   +'<button class="bt a op" onclick="enviarHija('+abs+',this)">Crear orden en SAP</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.enviarHija=(abs,b)=>{ const u=Number(document.getElementById("hu").value), f=document.getElementById("hf").value, p=document.getElementById("hp").value.split("|");
  if(!(u>0)) return aviso("Pon la cantidad",false); if(!f) return aviso("Pon el día",false);
  escribir(Object.assign({accion:"hija",global:abs,uds:u,fecha:f,almacen:document.getElementById("hw").value,liberar:document.getElementById("hl").checked},p[0]?{entry:Number(p[0]),linea:Number(p[1])}:{}),b); };
window.liberar=(abs,num)=>dialogo('<h2>▶️ Liberar orden '+num+'</h2><p>La orden pasa a <b>liberada</b>: ya se puede fabricar y dar el parte en el obrador.</p><button class="bt v op" onclick="escribir({accion:\'liberar\',abs:'+abs+'},this)">Sí, liberar</button><button class="bt g op" onclick="cerrar()">Cancelar</button>');
pill(); cargar();
</script>

<script>/* Buscador automático de artículos (catálogo del CRM, el mismo que usa «Nuevo pedido») */
(function(){
  var FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents", ARTS=null, carga=null;
  var N=function(t){ return String(t||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,""); };
  function cargar(){ if(carga) return carga; carga=(async function(){ var L=[]; try{ var m=await fetch(FB+"/stock_sap/meta").then(function(r){ return r.ok?r.json():null; }); var n=Number(m&&m.fields&&m.fields.chunks&&(m.fields.chunks.integerValue||m.fields.chunks.doubleValue))||0;
      var P=await Promise.all(Array.from({length:n},function(_,i){ return fetch(FB+"/stock_sap_detalle/chunk_"+i).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); }));
      P.forEach(function(d){ var rows=[]; try{ rows=JSON.parse(d&&d.fields&&d.fields.rows&&d.fields.rows.stringValue||"[]"); }catch(e){} rows.forEach(function(r){ if(r&&r.cod) L.push({c:String(r.cod).toUpperCase(),d:r.desc||"",s:(Number(r.stockTodos!=null?r.stockTodos:r.stock)||0),n:N(r.cod+" "+r.desc)}); }); }); }catch(e){}
    ARTS=L; return L; })(); return carga; }
  var css=document.createElement("style"); css.textContent=".bsug{position:absolute;left:0;right:0;top:100%;background:#fff;border:2px solid #CBD5E1;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:60;max-height:320px;overflow:auto;margin-top:4px}.bsug div{padding:12px 14px;border-bottom:1px solid #F1F5F9;cursor:pointer;font-size:18px;text-align:left}.bsug div:hover,.bsug div.on{background:#EFF6FF}.bsug b{display:block}.bsug small{color:#64748B;font-size:15px}"; document.head.appendChild(css);
  var esc=function(t){ return String(t==null?"":t).replace(/[<>&"]/g,function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]; }); };
  // Pon data-buscador en cualquier <input> (o llama a window.buscadorArticulos(input)) y tendrá sugerencias al escribir
  window.buscadorArticulos=function(inp,alElegir){ if(!inp||inp._bus) return; inp._bus=1; inp.setAttribute("autocomplete","off"); cargar();
    var caja=document.createElement("div"); caja.className="bsug"; caja.hidden=true; var w=document.createElement("div"); w.style.position="relative"; w.style.flex=getComputedStyle(inp).flex; inp.parentNode.insertBefore(w,inp); w.appendChild(inp); w.appendChild(caja);
    var sel=-1, R=[];
    function pinta(){ caja.innerHTML=R.map(function(a,i){ return '<div class="'+(i===sel?'on':'')+'" data-i="'+i+'"><b>'+esc(a.c)+'</b><small>'+esc(a.d)+' · stock '+a.s.toLocaleString("es-ES")+'</small></div>'; }).join("")||'<div style="color:#64748B;cursor:default">'+(ARTS?'Sin resultados':'Cargando artículos…')+'</div>'; caja.hidden=false; }
    function elige(a){ inp.value=a.c; caja.hidden=true; if(alElegir) alElegir(a); inp.dispatchEvent(new Event("change")); }
    inp.addEventListener("input",async function(){ var q=N(inp.value).split(/\s+/).filter(Boolean); if(!q.length){ caja.hidden=true; return; } if(!ARTS){ R=[]; pinta(); await cargar(); }
      R=ARTS.filter(function(a){ return q.every(function(t){ return a.n.indexOf(t)>=0; }); }).sort(function(a,b){ return (a.c.indexOf(q[0])===0?0:1)-(b.c.indexOf(q[0])===0?0:1)||b.s-a.s; }).slice(0,20); sel=-1; pinta(); });
    inp.addEventListener("keydown",function(e){ if(caja.hidden) return; if(e.key==="ArrowDown"){ sel=Math.min(R.length-1,sel+1); pinta(); e.preventDefault(); } else if(e.key==="ArrowUp"){ sel=Math.max(0,sel-1); pinta(); e.preventDefault(); } else if(e.key==="Enter"&&R[sel>=0?sel:0]){ elige(R[sel>=0?sel:0]); e.preventDefault(); } else if(e.key==="Escape") caja.hidden=true; });
    caja.addEventListener("mousedown",function(e){ var d=e.target.closest("[data-i]"); if(d){ e.preventDefault(); elige(R[Number(d.getAttribute("data-i"))]); } });
    inp.addEventListener("blur",function(){ setTimeout(function(){ caja.hidden=true; },150); }); };
  new MutationObserver(function(){ document.querySelectorAll("input[data-buscador]").forEach(function(i){ window.buscadorArticulos(i); }); }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener("DOMContentLoaded",function(){ document.querySelectorAll("input[data-buscador]").forEach(function(i){ window.buscadorArticulos(i); }); });
})();
</script>
