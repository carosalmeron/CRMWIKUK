<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Objetivos por rama</title>
<style>
  :root{--papel:#EEF1F5;--tinta:#0F1E33;--tenue:#5C6B80;--linea:#CFD8E3;
        --hueco:#fff;--ok:#0F6E63;--mal:#C2263D;--aviso:#B07908}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);max-width:640px;
    margin-inline:auto;padding:22px 16px calc(110px + env(safe-area-inset-bottom));
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  h1{margin:0 0 5px;font-size:22px;font-weight:800;letter-spacing:-.03em}
  .sub{margin:0 0 18px;font-size:13px;color:var(--tenue)}
  .chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
  .chip{flex:0 0 auto;border:1px solid var(--linea);background:var(--hueco);
    color:var(--tenue);border-radius:99px;padding:7px 14px;font:600 12.5px inherit;cursor:pointer}
  .chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .tot{background:var(--tinta);color:#fff;border-radius:3px;padding:14px 16px;margin-bottom:14px}
  .tot b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em}
  .tot span{font-size:12.5px;color:#A7B2BE}
  .fila{background:var(--hueco);border:1px solid var(--linea);border-radius:3px;
    padding:12px 13px;margin-bottom:8px}
  .fila.tocada{border-color:var(--aviso);background:#FFFDF7}
  .cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
  .ag{font-size:14.5px;font-weight:700}
  .ag small{display:block;font-weight:400;font-size:11px;color:var(--tenue);margin-top:2px}
  .v25{font-size:12px;color:var(--tenue);white-space:nowrap}
  input{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:3px;
    font:600 15px/1.3 inherit;color:var(--tinta);font-variant-numeric:tabular-nums}
  .pie{margin:6px 0 0;font-size:11.5px;color:var(--tenue)}
  .alerta{color:var(--mal);font-weight:600}
  .barra{position:fixed;left:0;right:0;bottom:0;background:var(--tinta);color:#fff;
    padding:13px 16px calc(13px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .barra p{margin:0;font-size:12.5px;color:#A7B2BE}
  button{background:#fff;color:var(--tinta);border:none;border-radius:3px;
    padding:11px 18px;font:700 14.5px inherit;cursor:pointer}
  button:disabled{opacity:.4}
  .log{background:var(--hueco);border:1px solid var(--linea);border-radius:3px;
    padding:12px;font-size:12.5px;line-height:1.7;margin-bottom:12px}
  .estado{padding:34px 4px;color:var(--tenue);font-size:14.5px}
</style></head><body>

<h1>Objetivos por rama</h1>
<p class="sub">Editar el objetivo anual de cada comercial. v1.0</p>
<div id="app"><p class="estado">Leyendo…</p></div>

<div class="barra">
  <p id="cuenta">—</p>
  <button id="btn" disabled onclick="guardar()">Guardar</button>
</div>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const eur=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
const num=(n)=>Number(n)||0;
const arriba=(s)=>String(s||"").toUpperCase().trim();
// Lo que dice cada Excel, para avisar si el objetivo cargado no coincide
const EXCEL=[{"fichero": "ACRUZ", "agenteExcel": "ACRUZ", "anual": 348624.99}, {"fichero": "AGUSTIN", "agenteExcel": "AGUSTIN", "anual": 967375.0}, {"fichero": "BOSCH", "agenteExcel": "BOSCH", "anual": 0}, {"fichero": "CARLOS", "agenteExcel": "CARLOSG", "anual": 1300000.0}, {"fichero": "DAVIDMAG", "agenteExcel": "DAVID MAG", "anual": 597126.25}, {"fichero": "DVEGA", "agenteExcel": "DVEGA", "anual": 520625.0}, {"fichero": "ESTHER", "agenteExcel": "ESTHER", "anual": 414625.0}, {"fichero": "JESUS", "agenteExcel": "JESUS", "anual": 805300.0}, {"fichero": "JOSE_LUIS", "agenteExcel": "GERHARD", "anual": 400000.0}, {"fichero": "Josep", "agenteExcel": "JOSEP", "anual": 167000.0}, {"fichero": "Lluis", "agenteExcel": "LLUIS", "anual": 112500.0}, {"fichero": "Miguel", "agenteExcel": "ACRUZ", "anual": 1350000.0}, {"fichero": "PEPE", "agenteExcel": "PEPE", "anual": 775500.0}, {"fichero": "RICARDO", "agenteExcel": "RICARDO", "anual": 2200000.0}, {"fichero": "RPIEDRA", "agenteExcel": "RAMON", "anual": 528625.0}, {"fichero": "VERO", "agenteExcel": "VERO", "anual": 414625.0}, {"fichero": "VESES", "agenteExcel": "VESES", "anual": 650000.0}, {"fichero": "ZARCO", "agenteExcel": "ZARCO", "anual": 1000000.0}];
let FILAS=[], fEquipo="";

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  return null;
}
async function leer(col){
  try{
    const r=await fetch(`${FB}/${col}?pageSize=300`);
    if(!r.ok) return [];
    return ((await r.json()).documents||[]).map(d=>{
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,v] of Object.entries(d.fields||{})) o[k]=val(v);
      return o;
    });
  }catch(e){ return []; }
}
window.setEq=(v)=>{ fEquipo=v; pintar(); };
window.editar=(i,el)=>{
  FILAS[i].nuevo=Number(String(el.value).replace(/[^\d.-]/g,""))||0;
  el.closest(".fila").classList.toggle("tocada",FILAS[i].nuevo!==FILAS[i].obj);
  refrescar();
};
function pendientes(){ return FILAS.filter(f=>f.nuevo!==undefined&&f.nuevo!==f.obj); }
function refrescar(){
  const n=pendientes().length;
  document.getElementById("cuenta").textContent=n?`${n} por guardar`:"Sin cambios";
  document.getElementById("btn").disabled=!n;
}

function pintar(){
  const l=FILAS.filter(f=>!fEquipo||f.equipo===fEquipo);
  const equipos=[...new Set(FILAS.map(f=>f.equipo))].sort();
  const suma=l.reduce((s,f)=>s+(f.nuevo!==undefined?f.nuevo:f.obj),0);
  const v25=l.reduce((s,f)=>s+f.ant,0);
  document.getElementById("app").innerHTML=
    `<div class="chips">
      <button class="chip${fEquipo?"":" on"}" onclick="setEq('')">Todos</button>
      ${equipos.map(e=>`<button class="chip${fEquipo===e?" on":""}"
        onclick="setEq('${e}')">${e}</button>`).join("")}
    </div>
    <div class="tot"><b class="num">${eur(suma)}</b>
      <span>${l.length} comerciales · vendieron ${eur(v25)} en 2025${
        v25?` · ${suma>=v25?"+":""}${((suma/v25-1)*100).toFixed(1)} %`:""}</span></div>`
    + l.map(f=>{
      const i=FILAS.indexOf(f);
      const x=EXCEL.find(e=>arriba(e.agenteExcel)===arriba(f.id));
      const desvia=x&&Math.abs(x.anual-f.obj)>1;
      return `<div class="fila${f.nuevo!==undefined&&f.nuevo!==f.obj?" tocada":""}">
        <div class="cab">
          <div class="ag">${f.nombre}<small>${f.equipo} · ${f.origen||"sin origen"}${
            f.meses?" · 12 meses":""}</small></div>
          <span class="v25 num">2025: ${eur(f.ant)}</span>
        </div>
        <input inputmode="numeric" value="${f.nuevo!==undefined?f.nuevo:f.obj}"
          oninput="editar(${i},this)">
        <p class="pie">${f.ant?`${f.obj>=f.ant?"+":""}${((f.obj/f.ant-1)*100).toFixed(1)} % sobre 2025`
          :"sin ventas en 2025"}${
          desvia?` · <span class="alerta">el Excel ${x.fichero} dice ${eur(x.anual)}</span>`:""}</p>
      </div>`;
    }).join("");
  refrescar();
}

async function guardar(){
  const l=pendientes();
  if(!confirm(`Se van a guardar ${l.length} objetivos. ¿Seguir?`)) return;
  const btn=document.getElementById("btn"); btn.disabled=true; btn.textContent="Guardando…";
  const lin=[];
  for(const f of l){
    try{
      // Solo el anual y la marca de origen: los meses y semanas se conservan
      const r=await fetch(`${FB}/pbi_objetivos/${encodeURIComponent(f.id)}`
        +`?updateMask.fieldPaths=objAnual&updateMask.fieldPaths=origen`
        +`&updateMask.fieldPaths=cargadoEl&updateMask.fieldPaths=agente&updateMask.fieldPaths=anio`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          objAnual:{doubleValue:f.nuevo},
          origen:{stringValue:"ajuste_manual"},
          agente:{stringValue:f.id}, anio:{doubleValue:2026},
          cargadoEl:{stringValue:new Date().toISOString()}}})});
      if(!r.ok) throw new Error("HTTP "+r.status);
      f.obj=f.nuevo; lin.push(`✓ ${f.nombre} · ${eur(f.nuevo)}`);
    }catch(e){ lin.push(`✗ ${f.nombre}: ${e.message}`); }
  }
  document.getElementById("app").insertAdjacentHTML("afterbegin",
    `<div class="log">${lin.join("<br>")}</div>`);
  btn.textContent="Guardar"; pintar();
}

(async()=>{
  const [ag,ob]=await Promise.all([leer("pbi_resumen_agente"),leer("pbi_objetivos")]);
  if(!ag.length){ document.getElementById("app").innerHTML=
    '<p class="estado">No se ha podido leer pbi_resumen_agente.</p>'; return; }
  const po={}; for(const o of ob) po[arriba(o.agente||o._id)]=o;
  FILAS=ag.filter(a=>a._id!=="_TOTAL"&&(num(a.ventasAct)>0||num(a.ventasAntFull)>0))
    .map(a=>{
      const o=po[arriba(a._id)]||{};
      return {id:a._id, nombre:a.agente||a._id, equipo:a.equipo||"(sin equipo)",
              obj:num(o.objAnual), origen:o.origen, meses:o.mes_1!==undefined,
              ant:num(a.ventasAntFull)};
    })
    .sort((x,y)=>y.obj-x.obj);
  pintar();
})();
</script></body></html>
