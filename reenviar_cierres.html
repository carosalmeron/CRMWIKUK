<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reenviar cierres</title>
<style>
 :root{--papel:#F2F4F7;--tinta:#14181F;--tenue:#6B7684;--linea:#DCE1E7;
       --ok:#0E7C5A;--mal:#C2263D;--med:#B07908;--okL:#EDF7F3;--malL:#FEF2F4;--medL:#FFFBEB}
 *{box-sizing:border-box}
 body{margin:0;background:var(--papel);color:var(--tinta);max-width:860px;
   margin-inline:auto;padding:20px 14px 90px;
   font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 h1{margin:0 0 3px;font-size:21px;font-weight:800}
 .sub{margin:0 0 14px;font-size:13px;color:var(--tenue)}
 .card{background:#fff;border:1px solid var(--linea);border-radius:10px;
   padding:14px 15px;margin-bottom:10px}
 .card.ok{border-color:var(--ok);background:var(--okL)}
 .card.mal{border-color:var(--mal);background:var(--malL)}
 .card.med{border-color:var(--med);background:var(--medL)}
 code{background:#F1F5F9;padding:1px 6px;border-radius:4px;font-size:11.5px;
   font-family:ui-monospace,monospace}
 .fila{display:flex;gap:12px;align-items:center}
 .fila input[type=checkbox]{width:18px;height:18px}
 .n{font-size:20px;font-weight:800;line-height:1}
 select,input[type=text]{padding:8px 10px;border-radius:8px;
   border:1.5px solid var(--linea);font-size:13px;font-family:inherit}
 button{padding:11px 20px;border-radius:9px;border:none;background:var(--tinta);
   color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
 button:disabled{background:#94A3B8;cursor:default}
 button.sec{background:#fff;color:var(--tinta);border:1.5px solid var(--linea);
   padding:7px 13px;font-size:12.5px}
 .estado{padding:32px 4px;color:var(--tenue);text-align:center}
 .barra{position:fixed;left:0;right:0;bottom:0;background:#fff;
   border-top:1px solid var(--linea);padding:12px 14px;display:flex;gap:10px;
   align-items:center;justify-content:space-between;box-shadow:0 -2px 12px #0000000f}
 .prev{max-height:420px;overflow:auto;border:1px solid var(--linea);
   border-radius:10px;margin-top:10px;background:#fff}
</style></head><body>
<h1>✉️ Reenviar cierres de la semana</h1>
<p class="sub">Lee los cierres ya guardados y compone el correo para el
  responsable. Útil para los que se enviaron antes de que el aviso existiera.</p>
<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
  <label style="font-size:13px;color:var(--tenue)">Semana</label>
  <input type="text" id="sem" style="width:80px" value="">
  <button class="sec" onclick="cargar()">Buscar</button>
</div>
<div id="app"><p class="estado">Cargando…</p></div>
<div class="barra" id="barra" style="display:none">
  <span class="sub" id="txt" style="margin:0"></span>
  <button id="btn" onclick="enviarTodos()">Enviar a los responsables</button>
</div>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const ARR=(s)=>String(s||"").toUpperCase().trim();
const esc=(t)=>String(t||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

function semanaISO(d=new Date()){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/86400000+1)/7);
}
function val(f){
  if(!f) return null;
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.nullValue!==undefined) return null;
  return null;
}
// (sep 2026) Los hitos vienen como arrayValue de Firestore, no como texto
// JSON: hacer JSON.parse fallaba siempre y por eso no salia ninguno.
function desdeFB(v){
  if(!v) return null;
  if(v.stringValue!==undefined) return v.stringValue;
  if(v.booleanValue!==undefined) return v.booleanValue;
  if(v.doubleValue!==undefined) return Number(v.doubleValue);
  if(v.integerValue!==undefined) return Number(v.integerValue);
  if(v.nullValue!==undefined) return null;
  if(v.arrayValue!==undefined) return (v.arrayValue.values||[]).map(desdeFB);
  if(v.mapValue!==undefined){
    const o={};
    for(const [k,x] of Object.entries(v.mapValue.fields||{})) o[k]=desdeFB(x);
    return o;
  }
  return null;
}
async function leer(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=desdeFB(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<20);
  return t;
}

let CIERRES=[], USERS=[], NOMBRES={}, ABIERTO={}, ALIAS={};
document.getElementById("sem").value=semanaISO();

window.cargar=async()=>{
  const app=document.getElementById("app");
  const SEM=Number(document.getElementById("sem").value)||semanaISO();
  app.innerHTML='<p class="estado">Leyendo cierres de la semana '+SEM+'…</p>';
  try{
    const [inf,us,est,ofe,mue,inc,pro,ali]=await Promise.all([
      leer("informes"),leer("usuarios"),
      leer("estrategias").catch(()=>[]), leer("ofertas").catch(()=>[]),
      leer("muestras").catch(()=>[]), leer("incidencias").catch(()=>[]),
      leer("proyectos").catch(()=>[]),
      leer("agentes_alias").catch(()=>[]),
    ]);
    // Alias por canonico: todos los codigos con los que aparece cada persona
    ALIAS={};
    (ali||[]).forEach(a=>{
      const c=ARR(a.canonico);
      if(!c) return;
      (ALIAS[c]=ALIAS[c]||[]).push(ARR(a.alias||a._id));
      if(a.original) ALIAS[c].push(ARR(a.original));
    });
    // Y al reves: desde cualquier alias se llega al resto
    Object.entries({...ALIAS}).forEach(([c,l])=>{
      l.forEach(al=>{ ALIAS[al]=[...new Set([c,...l])]; });
    });
    USERS=us;
    // (sep 2026) El correo mostraba "est_1780415207180" porque el cierre no
    // guarda el nombre del cliente en todas las respuestas. Se resuelve aqui
    // contra la ficha real de cada estrategia, oferta o muestra.
    NOMBRES={};
    [...est,...ofe,...mue].forEach(o=>{
      const n=o.clienteNombre||o.cliente||o.nombre;
      if(n) NOMBRES[o._id]=n;
    });
    ABIERTO={est,ofe,inc,pro};

    CIERRES=inf.filter(x=>Number(x.semana)===SEM&&x.respuestas)
      .map(x=>{
        let R={}; try{ R=JSON.parse(x.respuestas||"{}"); }catch(e){}
        const yo=us.find(u=>[u._id,u.id,u.grupoAgente,u.catalogoVendedor,u.username]
          .filter(Boolean).some(k=>ARR(k)===ARR(x.agente)));
        // A quién le toca: su jefe de equipo, más director y CEO
        const eq=ARR(yo&&yo.equipo);
        const dest=us.filter(u=>{
          const rol=String(u.rol||"").toLowerCase();
          if(u._id===(yo&&yo._id)) return false;
          if(rol==="ceo"||rol==="director"||rol==="crm_director") return true;
          return (rol==="jefe"||rol==="crm_jefe")&&eq&&ARR(u.equipo)===eq;
        });
        // Lo que tiene abierto: no está en el cierre, se cuenta aquí
        // (sep 2026) Cada coleccion usa un identificador distinto: las
        // estrategias guardan el codigo de vendedor (DAVIDMAG) y los hitos el
        // id del CRM (ik4). Comparando contra uno solo no cruzaba ninguno.
        const MIOS=new Set([ARR(x.agente)]);
        [yo&&yo._id,yo&&yo.id,yo&&yo.crmId,yo&&yo.grupoAgente,
         yo&&yo.catalogoVendedor,yo&&yo.username,yo&&yo.nombre]
          .filter(Boolean).forEach(k=>MIOS.add(ARR(k)));
        // Y sus alias registrados, que cubren los ids del portal
        (ALIAS[ARR(x.agente)]||[]).forEach(k=>MIOS.add(ARR(k)));
        if(yo) (ALIAS[ARR(yo._id)]||[]).forEach(k=>MIOS.add(ARR(k)));
        const suyo=(o)=>MIOS.has(ARR(o.agente))||MIOS.has(ARR(o.responsableComercial))
          ||MIOS.has(ARR(o.creadoPor));
        const hoy=new Date();
        const fechaDe=(o)=>{
          const f=o.fecha||o.fechaCreacion||o.fechaCreacionStr||"";
          const m=String(f).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
          if(m) return new Date(+m[3],+m[2]-1,+m[1]);
          const d=new Date(f); return isNaN(d)?null:d;
        };
        const abierto={
          estr:(ABIERTO.est||[]).filter(o=>suyo(o)&&!o.eliminada
            &&!/completada|ko|cerrada/.test(String(o.estado||"").toLowerCase())).length,
          ofertas:(ABIERTO.ofe||[]).filter(o=>{
            if(!suyo(o)||o.eliminada) return false;
            if(/pedido|perdida|aceptada|rechazada/.test(String(o.estado||"").toLowerCase())) return false;
            const f=fechaDe(o);
            return f&&Math.round((hoy-f)/86400000)>10;
          }).length,
          // (sep 2026) Se contaban juntas las que debe resolver y las que el
          // reporto a otros: eso inflaba su cifra con cosas ajenas. Separadas.
          incLista:(ABIERTO.inc||[]).filter(o=>!o.eliminada
            &&!/resuelta|cerrada|cancelada/.test(String(o.estado||"").toLowerCase())
            &&(MIOS.has(ARR(o.agente))||MIOS.has(ARR(o.responsable))
               ||MIOS.has(ARR(o.asignadoA))))
            .map(o=>({
              texto:o.titulo||o.asunto||o.descripcion||o.texto||"(sin descripción)",
              cli:o.clienteNombre||o.cliente||"",
              fecha:String(o.fecha||o.fechaCreacion||"").slice(0,10),
              prio:String(o.prioridad||"").toLowerCase(),
            }))
            .sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))),
          incAbiertas:(ABIERTO.inc||[]).filter(o=>!o.eliminada
            &&!/resuelta|cerrada|cancelada/.test(String(o.estado||"").toLowerCase())
            &&MIOS.has(ARR(o.creadoPor))
            &&!MIOS.has(ARR(o.agente))&&!MIOS.has(ARR(o.responsable))
            &&!MIOS.has(ARR(o.asignadoA))).length,
          hitos:[],
          cobros:0, nFacV:0,
        };
        // Hitos suyos sin resolver
        (ABIERTO.pro||[]).forEach(pr=>{
          if(String(pr.estado||"").toLowerCase()==="cerrado") return;
          const hs=Array.isArray(pr.hitos)?pr.hitos:[];
          hs.forEach(h=>{
            if(!h||h.hecho||h.completado) return;
            if(!MIOS.has(ARR(h.responsable))) return;
            abierto.hitos.push({nom:h.nombre||h.titulo||"(sin nombre)",
              proy:pr.nombre||"", fecha:String(h.fecha||"").slice(0,10)});
          });
        });
        abierto.hitos.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
        abierto.inc=(abierto.incLista||[]).length;

        return {...x, R, yo, dest, abierto, MIOS, marcado:true};
      })
      .sort((a,b)=>String(b.fechaEnvio||"").localeCompare(String(a.fechaEnvio||"")));

    // Cobros fuera de plazo: un documento por codigo de comercial
    await Promise.all(CIERRES.map(async c=>{
      for(const cod of [...(c.MIOS||[])]){
        try{
          const rc=await fetch(`${FB}/cobros_comercial/${encodeURIComponent(cod)}`,
            {cache:"no-store"});
          if(!rc.ok) continue;
          const j=await rc.json();
          const f={};
          for(const [k,v] of Object.entries(j.fields||{})) f[k]=val(v);
          const v=Number(f.totalVencido||f.venc||0);
          if(v>c.abierto.cobros){
            c.abierto.cobros=v;
            c.abierto.nFacV=Number(f.nFacturasVencidas||f.nFacV||0);
          }
        }catch(e){}
      }
    }));

    pintar(SEM);
  }catch(e){
    app.innerHTML='<div class="card mal">Error: '+e.message+'</div>';
  }
};

// El nombre bueno: el que guardo el cierre, o el de la ficha real
function nomDe(k,v){
  const n=(v&&v.nom||"").trim();
  if(n) return n;
  const id=String(k).split(/:(.+)/)[1]||k;
  return NOMBRES[id]||id;
}

function resumen(c){
  const R=c.R||{};
  const prom=Object.entries(R).filter(([k,v])=>k.startsWith("promesa:")&&(v.accion||v.texto));
  const cumpl=prom.filter(([k,v])=>/fue bien|lo hice/i.test(v.accion||"")).length;
  const riesgo=Object.entries(R).filter(([k,v])=>k.startsWith("cliente:")&&(v.accion||v.texto));
  const cerr=Object.entries(R).filter(([k,v])=>v.cierra);
  return {prom,cumpl,riesgo,cerr,
    comoHaIdo:(R.semana||{}).texto||"", prioridad:(R.prioridad||{}).texto||""};
}

function htmlCorreo(c){
  const r=resumen(c);
  const nom=(c.yo&&c.yo.nombre)||c.agente;
  const enlace="https://crmwikuk.vercel.app/parte_semanal.html?agente="
    +encodeURIComponent(c.agente);
  const bloque=(tit,items,pinta)=>items.length
    ? `<h3 style="margin:20px 0 7px;font-size:14px;color:#14181F">${tit}</h3>`
      +items.map(pinta).join("") : "";

  return `<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',
    Roboto,sans-serif;max-width:600px;margin:0 auto;color:#14181F;line-height:1.55">
    <div style="background:#14181F;color:#fff;padding:18px 20px;border-radius:12px 12px 0 0">
      <div style="font-size:11px;letter-spacing:.08em;opacity:.7;
        text-transform:uppercase">Cierre semanal · semana ${c.semana}</div>
      <div style="font-size:20px;font-weight:800;margin-top:3px">${esc(nom)}</div>
      ${c.yo&&c.yo.equipo?`<div style="font-size:12px;opacity:.75">${esc(c.yo.equipo)}</div>`:""}
    </div>
    <div style="border:1px solid #DCE1E7;border-top:none;border-radius:0 0 12px 12px;
      padding:20px;background:#fff">
      ${r.prom.length?`<div style="background:#F7F9FB;border-radius:10px;
        padding:14px 16px;margin-bottom:4px">
        <div style="font-size:26px;font-weight:800;line-height:1">${r.cumpl}
          <span style="font-size:15px;font-weight:400;color:#6B7684">de ${
            r.prom.length}</span></div>
        <div style="font-size:12px;color:#6B7684">compromisos del lunes cumplidos</div>
      </div>`:""}

      ${r.comoHaIdo?`<h3 style="margin:20px 0 7px;font-size:14px">Cómo ha ido</h3>
        <p style="margin:0;font-size:13.5px;color:#3A424E;white-space:pre-wrap"
          >${esc(r.comoHaIdo)}</p>`:""}

      ${bloque("Lo que dijo el lunes",r.prom,([k,v])=>
        `<div style="border-left:3px solid ${
          /fue bien|lo hice/i.test(v.accion||"")?"#0E7C5A":"#B07908"};
          padding:5px 0 5px 11px;margin-bottom:9px">
          <div style="font-size:13.5px;font-weight:700">${esc(nomDe(k,v))}</div>
          <div style="font-size:12px;color:#6B7684">${esc(v.accion||"")}</div>
          ${v.texto?`<div style="font-size:12.5px;color:#3A424E;margin-top:3px;
            font-style:italic">“${esc(v.texto)}”</div>`:""}
        </div>`)}

      ${bloque("Clientes en riesgo",r.riesgo,([k,v])=>
        `<div style="border-left:3px solid #C2263D;padding:5px 0 5px 11px;
          margin-bottom:9px">
          <div style="font-size:13.5px;font-weight:700">${esc(nomDe(k,v))}</div>
          <div style="font-size:12px;color:#6B7684">${esc(v.accion||"")}</div>
          ${v.texto?`<div style="font-size:12.5px;color:#3A424E;margin-top:3px;
            font-style:italic">“${esc(v.texto)}”</div>`:""}
        </div>`)}

      ${r.cerr.length?`<h3 style="margin:20px 0 7px;font-size:14px">
        Ha cerrado ${r.cerr.length}</h3>
        <div style="font-size:12.5px;color:#6B7684">${
          r.cerr.map(([k,v])=>esc(nomDe(k,v))
            +" ("+esc(v.accion||"")+")").join(" · ")}</div>`:""}

      ${(()=>{ const a=c.abierto||{};
        if(!a.cobros&&!a.inc&&!a.incAbiertas&&!a.estr&&!a.ofertas
          &&!(a.hitos||[]).length) return "";
        const fila=(t,v,col)=>`<tr>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5">${t}</td>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5;text-align:right;
            font-weight:800${col?";color:"+col:""}">${v}</td></tr>`;
        return `<h3 style="margin:22px 0 8px;font-size:14px;color:#14181F">
          Lo que tiene abierto</h3>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          ${a.cobros?fila("💰 Cobros fuera de plazo"
            +(a.nFacV?` <span style="color:#6B7684;font-size:11.5px">· ${a.nFacV} facturas</span>`:""),
            Math.round(a.cobros).toLocaleString("es-ES")+" €","#C2263D"):""}
          ${a.inc?fila("🚨 Incidencias suyas sin resolver",a.inc):""}
          ${a.incAbiertas?fila("📤 Incidencias que abrió, aún sin resolver",
            a.incAbiertas):""}
          ${a.estr?fila("🎯 Estrategias sin cerrar",a.estr):""}
          ${a.ofertas?fila("💰 Ofertas de más de 10 días",a.ofertas):""}
          ${(a.hitos||[]).length?fila("📁 Hitos de proyecto sin resolver",a.hitos.length):""}
        </table>
        ${(a.incLista||[]).length?`<div style="margin-top:9px">
          ${a.incLista.slice(0,6).map(x=>`<div style="font-size:12.5px;color:#3A424E;
            padding:4px 0 4px 11px;border-left:2px solid ${
              /urgente|alta/.test(x.prio)?"#C2263D":"#DCE1E7"};margin-bottom:4px">
            ${esc(x.texto)}${x.cli?`<span style="color:#8A94A0"> · ${esc(x.cli)}</span>`:""}
            ${x.fecha?`<span style="color:#B07908"> · ${
              x.fecha.split("-").reverse().join("/")}</span>`:""}</div>`).join("")}
          ${a.incLista.length>6?`<div style="font-size:11.5px;color:#8A94A0">
            y ${a.incLista.length-6} más</div>`:""}</div>`:""}

        ${(a.hitos||[]).length?`<div style="margin-top:9px">
          ${a.hitos.slice(0,6).map(h=>`<div style="font-size:12.5px;color:#3A424E;
            padding:4px 0 4px 11px;border-left:2px solid #DCE1E7;margin-bottom:4px">
            ${esc(h.nom)}${h.proy?`<span style="color:#8A94A0"> · ${esc(h.proy)}</span>`:""}
            ${h.fecha?`<span style="color:#B07908"> · ${
              h.fecha.split("-").reverse().join("/")}</span>`:""}</div>`).join("")}
          ${a.hitos.length>6?`<div style="font-size:11.5px;color:#8A94A0">
            y ${a.hitos.length-6} más</div>`:""}</div>`:""}`;
      })()}

      ${r.prioridad?`<div style="background:#FFFBEB;border:1px solid #F59E0B;
        border-radius:10px;padding:14px 16px;margin-top:20px">
        <div style="font-size:11px;font-weight:800;color:#92400E;
          text-transform:uppercase;letter-spacing:.05em">Su prioridad · semana ${
            Number(c.semana)+1}</div>
        <div style="font-size:14px;margin-top:5px">${esc(r.prioridad)}</div>
      </div>`:""}

      <div style="margin-top:22px;text-align:center">
        <a href="${enlace}" style="display:inline-block;background:#14181F;
          color:#fff;text-decoration:none;padding:11px 26px;border-radius:9px;
          font-size:13.5px;font-weight:700">Ver el parte completo</a>
      </div>
    </div>
  </div>`;
}

function pintar(SEM){
  const app=document.getElementById("app");
  if(!CIERRES.length){
    app.innerHTML='<div class="card med">No hay cierres guardados de la semana '
      +SEM+'.</div>';
    document.getElementById("barra").style.display="none";
    return;
  }
  app.innerHTML=CIERRES.map((c,i)=>{
    const r=resumen(c);
    const nom=(c.yo&&c.yo.nombre)||c.agente;
    const conEmail=c.dest.filter(d=>d.email);
    return `<div class="card">
      <div class="fila">
        <input type="checkbox" ${c.marcado?"checked":""}
          onchange="marcar(${i},this.checked)">
        <div style="flex:1;min-width:0">
          <b style="font-size:15px">${esc(nom)}</b>
          ${c.yo&&c.yo.equipo?`<span style="color:var(--tenue);font-size:12px"> · ${
            esc(c.yo.equipo)}</span>`:""}
          <div style="font-size:12px;color:var(--tenue);margin-top:2px">
            ${r.prom.length?r.cumpl+" de "+r.prom.length+" cumplidos · ":""}
            ${r.riesgo.length?r.riesgo.length+" en riesgo · ":""}
            ${r.cerr.length?r.cerr.length+" cerradas · ":""}
            ${c.fechaEnvio?"enviado "+String(c.fechaEnvio).slice(0,10)
              .split("-").reverse().join("/"):""}
          </div>
          <div style="font-size:11.5px;margin-top:4px;color:${
            conEmail.length?"var(--ok)":"var(--mal)"}">
            ${conEmail.length
              ? "→ "+conEmail.map(d=>esc(d.nombre||d._id)).join(", ")
              : "⚠ Ningún responsable con email"}</div>
        </div>
        <button class="sec" onclick="verPrev(${i})">Ver</button>
      </div>
      <div id="prev${i}"></div>
    </div>`;
  }).join("");

  document.getElementById("barra").style.display="flex";
  actualiza();
}

window.marcar=(i,v)=>{ CIERRES[i].marcado=v; actualiza(); };
function actualiza(){
  const n=CIERRES.filter(c=>c.marcado&&c.dest.some(d=>d.email)).length;
  document.getElementById("txt").textContent=n+" cierre(s) se enviarán";
  document.getElementById("btn").disabled=!n;
}

window.verPrev=(i)=>{
  const d=document.getElementById("prev"+i);
  if(d.innerHTML){ d.innerHTML=""; return; }
  d.innerHTML='<div class="prev">'+htmlCorreo(CIERRES[i])+'</div>';
};

window.enviarTodos=async()=>{
  const lista=CIERRES.filter(c=>c.marcado&&c.dest.some(d=>d.email));
  if(!lista.length) return;
  const nEnv=lista.reduce((t,c)=>t+c.dest.filter(d=>d.email).length,0);
  if(!confirm("Se enviarán "+nEnv+" correos ("+lista.length+" cierres).\n\n¿Seguimos?")) return;
  const btn=document.getElementById("btn");
  btn.disabled=true;
  let ok=0,err=0;
  for(const c of lista){
    const nom=(c.yo&&c.yo.nombre)||c.agente;
    const asunto="📋 "+nom+" ha cerrado la semana "+c.semana;
    const html=htmlCorreo(c);
    for(const d of c.dest.filter(x=>x.email)){
      btn.textContent="Enviando… "+(ok+err+1)+"/"+nEnv;
      try{
        const r=await fetch("/api/send-email",{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({to:d.email,subject:asunto,html})});
        if(r.ok) ok++; else err++;
      }catch(e){ err++; }
    }
  }
  btn.textContent = err ? ok+" enviados, "+err+" fallaron" : "✓ "+ok+" enviados";
  if(err) btn.disabled=false;
};

cargar();
</script></body></html>
