<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auditoría de actividad CRM</title>
<style>
:root{--burdeos:#7A1F2B;--crema:#FCF6F5;--carbon:#2B2B2B;--gris:#6B6B6B;--verde:#2C5F2D;--ambar:#B98A00;--rojo:#B3261E;--linea:#E3D9D7}
*{box-sizing:border-box}body{font-family:Calibri,Segoe UI,Arial,sans-serif;margin:0;background:var(--crema);color:var(--carbon)}
.top{background:var(--burdeos);color:#fff;padding:18px 26px}
.top h1{margin:0;font-family:Cambria,Georgia,serif;font-size:26px}
.top .sub{color:#F2DDE0;font-size:13px;margin-top:4px}
.wrap{max-width:1150px;margin:0 auto;padding:20px 22px 60px}
.card{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:16px 18px;margin:14px 0}
h2{font-family:Cambria,Georgia,serif;font-size:19px;color:var(--burdeos);margin:2px 0 4px}
.h2sub{color:var(--gris);font-size:12.5px;font-style:italic;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--burdeos);color:#fff;text-align:left;padding:7px 9px;font-weight:600}
td{padding:6px 9px;border-bottom:1px solid var(--linea)}
tr:nth-child(even) td{background:#FAF5F4}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;background:#fff;border:1px solid var(--linea);border-radius:8px;padding:8px 14px;margin:4px 8px 4px 0}
.pill b{font-size:20px;font-family:Cambria,serif}
.aviso{background:#FBEAEA;border-left:4px solid var(--rojo);padding:10px 14px;border-radius:6px;font-size:13px;margin:12px 0}
.ok{background:#E8F0E4;border-left:4px solid var(--verde);padding:10px 14px;border-radius:6px;font-size:13px;margin:12px 0}
.cargando{color:var(--gris);padding:30px;text-align:center}
select,button{font:inherit;padding:6px 10px;border:1px solid var(--linea);border-radius:6px;background:#fff}
button{background:var(--burdeos);color:#fff;cursor:pointer;border:none}
.chip{display:inline-block;background:#EFEAE4;border-radius:6px;padding:2px 8px;margin:2px;font-size:12px}
small{color:var(--gris)}
</style></head><body>
<div class="top">
  <h1>Auditoría de actividad · CRM en crudo</h1>
  <div class="sub">Lee la colección <b>visitas</b> tal cual, SIN los filtros del cruce · para verificar qué se registra, con qué resultado, con qué cliente y en qué fechas</div>
</div>
<div class="wrap">
  <div class="card">
    <label><b>Agente:</b> <select id="selAg"><option value="">(cargando…)</option></select></label>
    <label style="margin-left:14px"><b>Año:</b> <select id="selAnio"></select></label>
    <button id="btn" style="margin-left:14px">Auditar</button>
    <span id="estado" style="margin-left:12px;color:var(--gris);font-size:13px"></span>
  </div>
  <div id="out"><div class="cargando">Leyendo la colección de visitas completa…</div></div>
</div>
<script src="agentes.js"></script>
<script>
const FB_BASE="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const val=f=>f?.stringValue??f?.timestampValue??(f?.integerValue!=null?+f.integerValue:(f?.doubleValue!=null?+f.doubleValue:(f?.booleanValue??null)));
function parseFecha(v){
  if(v==null||v==="") return null;
  const s=String(v).trim();
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){ const d=+m[1], mes=+m[2]; let a=+m[3]; if(a<100) a+=2000;
    return (mes<=12&&d<=31)?new Date(a,mes-1,d):null; }
  const d=new Date(s); return isNaN(d)?null:d;
}
function lunesISO(anio,sem){const s=new Date(anio,0,4);const dia=(s.getDay()+6)%7;return new Date(anio,0,4-dia+(sem-1)*7);}
// La MISMA regla que usa hoy el cruce del plan: esto es lo que se audita
const esLlamadaCruce=r=>{r=String(r||"");return r.startsWith("llamada")||r==="no_contesta";};
// Regla candidata: todo lo telefónico (pedido tfno incluido) es 📞
const esTelefono=r=>{r=String(r||"").toLowerCase();return r.startsWith("llamada")||r==="no_contesta"||r.includes("tfno")||r.includes("telef")||r.includes("phone");};

const MESES=["E","F","M","A","M","J","J","A","S","O","N","D"];
const NOPERSONA=new Set(["WIKUK","INTERKEY","FRANCIA","DISTRIBUIDOR","INTERC.NACIONAL","INTERC.INTERN.","TIENDA","TELEFONO","SIN AGENTE","_TOTAL","CAMPOFRIO"]);
let DOCS=[]; let AGDE={}, NOMDE={};   // código→agente PBI · nombre-normalizado→agente
const normN=s=>String(s||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[.,;:()\-\/]/g," ").replace(/\s+/g," ").trim();
async function cargarCartera(){
  // pbi_indice_clientes va empaquetado: pocos docs con campo datos = JSON de
  // [codigo, nombre, agente, vAct, vAnt, poblacion]
  const r=await fetch(`${FB_BASE}/pbi_indice_clientes?pageSize=10`);
  if(!r.ok) return;
  const j=await r.json();
  for(const d of (j.documents||[])){
    const datos=d.fields?.datos?.stringValue;
    if(!datos) continue;
    for(const [codigo,nombre,agente] of JSON.parse(datos)){
      const cod=String(codigo||"").toUpperCase().trim();
      const ag=String(agente||"").toUpperCase().trim();
      if(cod&&ag){AGDE[cod]=ag; const kn=normN(nombre); if(kn&&!NOMDE[kn])NOMDE[kn]=ag;}
    }
  }
}
function agenteDe(d){
  if(d.cod&&AGDE[d.cod]) return AGDE[d.cod];
  if(Agentes.variantes) for(const vv of Agentes.variantes(d.cod)){const V=String(vv).toUpperCase(); if(AGDE[V]) return AGDE[V];}
  const kn=normN(d.nom); return kn&&NOMDE[kn]?NOMDE[kn]:null;
}
async function cargar(){
  if(typeof Agentes==="undefined"){document.getElementById("out").innerHTML='<div class="aviso">Falta <b>agentes.js</b> junto a esta página. Despliégalo y recarga: esta herramienta usa la tabla oficial de identidades.</div>';return;}
  await Agentes.cargar();
  await cargarCartera();
  const est=document.getElementById("estado");
  let nextPage=null,pags=0;
  do{
    const r=await fetch(`${FB_BASE}/visitas?pageSize=300${nextPage?"&pageToken="+nextPage:""}`);
    if(!r.ok){document.getElementById("out").innerHTML=`<div class="aviso">Firestore ${r.status} leyendo visitas</div>`;return;}
    const j=await r.json();
    for(const d of (j.documents||[])){
      const f={};for(const[k,v]of Object.entries(d.fields||{}))f[k]=val(v);
      let fecha=parseFecha(f.fecha)||parseFecha(f.fechaVisita)||parseFecha(f.fechaCreacion);
      if(!fecha&&f.semana!=null&&Number(f.semana)>0)fecha=lunesISO(Number(f.anio)||new Date().getFullYear(),Number(f.semana));
      const rawAgD=String(f.agente||f.usuario||"?").toUpperCase().trim();
      let canD=rawAgD;
      try{ if(!NOPERSONA.has(rawAgD)&&Agentes.id){ const c2=Agentes.id(rawAgD); if(c2) canD=String(c2).toUpperCase(); } }catch(e){}
      DOCS.push({fecha,ag:rawAgD,can:canD,
        res:String(f.resultado||"(sin resultado)"),
        cod:String(f.clienteId||f.codigoERP||f.codigo||"").toUpperCase().trim(),
        nom:String(f.clienteNombre||f.cliente||f.nombreCliente||f.nombre||""),
        txt:String(f.comentario||f.notas||f.observaciones||"").slice(0,90)});
    }
    nextPage=j.nextPageToken; pags++;
    est.textContent=`leídas ${DOCS.length} filas (${pags} páginas)…`;
  }while(nextPage&&pags<200);
  est.textContent=`${DOCS.length} registros en total`;
  const ags=[...new Set(DOCS.map(d=>d.can))].sort();
  const eti=a=>{try{const n2=Agentes.nombre&&Agentes.nombre(a);return n2&&n2!==a?`${n2} (${a})`:a;}catch(e){return a;}};
  document.getElementById("selAg").innerHTML=`<option value="">— TODOS —</option>`+ags.map(a=>`<option value="${a}">${NOPERSONA.has(a)?a+" · ⚠ no es persona":eti(a)}</option>`).join("");
  const anios=[...new Set(DOCS.filter(d=>d.fecha).map(d=>d.fecha.getFullYear()))].sort();
  document.getElementById("selAnio").innerHTML=anios.map(a=>`<option ${a===new Date().getFullYear()?"selected":""}>${a}</option>`).join("");
  const p=new URLSearchParams(location.search).get("agente");
  if(p)document.getElementById("selAg").value=p.toUpperCase();
  auditar();
}
function auditar(){
  const ag=document.getElementById("selAg").value;
  const anio=+document.getElementById("selAnio").value||new Date().getFullYear();
  const docs=DOCS.filter(d=>{
    if(!ag) return true;
    try{ return d.can===ag||Agentes.mismo(d.ag,ag); }catch(e){ return d.can===ag; }
  });
  const conFecha=docs.filter(d=>d.fecha), sinFecha=docs.length-conFecha.length;
  const delAnio=conFecha.filter(d=>d.fecha.getFullYear()===anio);
  // ── 1 · registros por MES × RESULTADO (crudo) ──
  const porRes={};
  for(const d of delAnio){const r=d.res;porRes[r]=porRes[r]||Array(13).fill(0);porRes[r][d.fecha.getMonth()]++;porRes[r][12]++;}
  const filas=Object.entries(porRes).sort((a,b)=>b[1][12]-a[1][12]).map(([r,m])=>
    `<tr><td><b>${r}</b> ${esLlamadaCruce(r)?'<span class="chip">📞 cruce</span>':'<span class="chip">🚗 cruce</span>'}${esTelefono(r)&&!esLlamadaCruce(r)?'<span class="chip" style="background:#FBEAEA">☎ debería ser 📞</span>':''}</td>`+
    m.slice(0,12).map(x=>`<td class="num">${x||"·"}</td>`).join("")+`<td class="num"><b>${m[12]}</b></td></tr>`).join("");
  // ── 2 · jun–jul: cómo lo cuenta el cruce HOY vs regla candidata ──
  const jj=delAnio.filter(d=>[5,6].includes(d.fecha.getMonth()));
  const conCli=jj.filter(d=>d.cod||d.nom.trim());
  const cnt=(f)=>{let v=0,l=0;for(const d of jj){if(f(d.res))l++;else v++;}return[v,l];};
  const [vC,lC]=cnt(esLlamadaCruce), [vN,lN]=cnt(esTelefono);
  // ── 3 · higiene ──
  const sinCli=jj.length-conCli.length;
  // ── 4 · últimas filas crudas ──
  const ult=[...delAnio].sort((a,b)=>b.fecha-a.fecha).slice(0,15).map(d=>
    `<tr><td>${d.fecha.toLocaleDateString("es-ES")}</td><td>${d.res}</td><td>${d.cod||'<span style="color:var(--rojo)">—</span>'}</td><td>${d.nom||'<span style="color:var(--rojo)">—</span>'}</td><td><small>${d.txt}</small></td></tr>`).join("");
  // ¿Quién es cada usuario? — por el agente PBI de los clientes que registra
  const porUser={};
  for(const d of DOCS.filter(x=>x.fecha&&x.fecha.getFullYear()===anio)){
    const u=porUser[d.can]=porUser[d.can]||{n:0,ag:{},ej:new Set(),logins:new Set()};
    u.logins.add(d.ag);
    u.n++;
    const a=agenteDe(d);
    if(a){u.ag[a]=(u.ag[a]||0)+1; if(u.ej.size<3&&d.nom)u.ej.add(d.nom.slice(0,24));}
  }
  const filasId=Object.entries(porUser).sort((a,b)=>b[1].n-a[1].n).map(([u,x])=>{
    const tot=Object.values(x.ag).reduce((s,v)=>s+v,0);
    const top=Object.entries(x.ag).sort((a,b)=>b[1]-a[1])[0];
    const pct=top&&tot?Math.round(100*top[1]/tot):0;
    const veredicto=top&&pct>=60?`<b style="color:var(--verde)">${top[0]}</b> <small>(${pct}% de sus clientes)</small>`
      :(top?`<span style="color:var(--ambar)">quizá ${top[0]} (${pct}%)</span>`:'<span style="color:var(--rojo)">sin pista (clientes sin casar)</span>');
    const conocido=(()=>{try{const n2=Agentes.nombre&&Agentes.nombre(u);return n2&&n2!==u;}catch(e){return false;}})();
    const accion=NOPERSONA.has(u)?'<span class="chip">equipo/no-persona: no mapear</span>'
      :(conocido?'<span class="chip" style="background:#E8F0E4">en la tabla oficial ✓</span>'
      :'<b style="color:var(--rojo)">sin dueño</b> → añadir en <code>tabla_alias.html</code> (bloque «Códigos de facturación»)');
    return `<tr><td><b>${u}</b> <small>${[...x.logins].filter(l=>l!==u).join(" · ")}</small></td><td class="num">${x.n}</td><td>${veredicto}</td><td><small>${[...x.ej].join(" · ")}</small></td><td>${accion}</td></tr>`;
  }).join("");
  document.getElementById("out").innerHTML=`
  <div class="card">
    <h2>0 · ¿Quién es cada usuario? · identificación por sus huellas</h2>
    <div class="h2sub">Para cada login del CRM: a qué agente de Power BI pertenecen los clientes que registra · si ≥60% son de uno, ese es · los códigos sin dueño se dan de alta en tabla_alias.html — la tabla agentes_alias es la ÚNICA fuente de verdad</div>
    <table><thead><tr><th>Usuario CRM</th><th class="num">Registros ${anio}</th><th>Vendedor inferido</th><th>Ejemplos de sus clientes</th><th>Estado en la tabla oficial</th></tr></thead>
    <tbody>${filasId}</tbody></table>
  </div>
  <div class="card">
    <h2>1 · Qué registra ${ag||"todo el equipo"} · ${anio}, mes a mes y por tipo de resultado</h2>
    <div class="h2sub">El dato crudo: cada valor de «resultado» tal cual está en el CRM · la etiqueta dice cómo lo clasifica HOY el cruce del plan</div>
    <table><thead><tr><th>Resultado (crudo)</th>${MESES.map(m=>`<th class="num">${m}</th>`).join("")}<th class="num">Total</th></tr></thead><tbody>${filas||'<tr><td colspan="14">sin registros</td></tr>'}</tbody></table>
    ${sinFecha?`<div class="aviso">${sinFecha} registros sin fecha interpretable (no entran en ningún cruce)</div>`:""}
  </div>
  <div class="card">
    <h2>2 · Jun–Jul: el número del plan, explicado</h2>
    <div class="h2sub">Mismo periodo y mismos registros; lo único que cambia es la regla de qué cuenta como llamada</div>
    <span class="pill">Regla ACTUAL del cruce<br><b>🚗 ${(vC/2).toFixed(1)}</b>/mes · <b>📞 ${(lC/2).toFixed(1)}</b>/mes<br><small>llamada* y no_contesta = 📞; el resto (pedido tfno incluido) = 🚗</small></span>
    <span class="pill">Regla CANDIDATA (todo lo telefónico = 📞)<br><b>🚗 ${(vN/2).toFixed(1)}</b>/mes · <b>📞 ${(lN/2).toFixed(1)}</b>/mes<br><small>pedido tfno, llamada, no contesta → 📞; solo la visita física → 🚗</small></span>
    <div class="${vC!==vN?"aviso":"ok"}">${vC!==vN
      ?`La diferencia entre ambas reglas es de <b>${((vC-vN)/2).toFixed(1)} «visitas»/mes</b>: son pedidos telefónicos contados hoy como visita. Si el comité decide que pedido-tfno es 📞, se cambia UNA línea en el plan y el dato queda como debe.`
      :`Con estos registros, ambas reglas dan lo mismo: la clasificación no es la causa del descuadre.`}</div>
    ${sinCli?`<div class="aviso">${sinCli} registros de jun–jul <b>sin cliente vinculado</b> («—»): actividad real que ningún cruce puede atribuir.</div>`:""}
  </div>
  <div class="card">
    <h2>3 · Las últimas 15 filas, en crudo</h2>
    <div class="h2sub">Para comparar a ojo con lo que el agente dice que hizo</div>
    <table><thead><tr><th>Fecha</th><th>Resultado</th><th>Código</th><th>Cliente</th><th>Comentario</th></tr></thead><tbody>${ult}</tbody></table>
  </div>`;
}
document.getElementById("btn").onclick=auditar;
document.getElementById("selAg").onchange=auditar;
document.getElementById("selAnio").onchange=auditar;
cargar();
</script>
</body></html>
