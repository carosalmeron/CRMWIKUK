<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de almacén</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ──────────────────────────────────────────────────────────────────────
   Plan de almacén. Tres zonas:
   · Compras: da de alta las entradas y cambia fechas.
   · Almacén: ve por día, semana o mes lo que entra y lo que sale.
   · Picking: lo que hay que preparar hoy, agrupado por producto y envase.
   Entradas ⬇ en azul petróleo, salidas ⬆ en ámbar: nunca se mezclan.
   ────────────────────────────────────────────────────────────────────── */
:root{
  --pared:#E6ECEA; --blanco:#fff; --tinta:#15201D; --suave:#5C6B66; --linea:#C9D3CF;
  --ent:#0E5E6F; --entL:#DCEBEE;      /* entradas */
  --sal:#B45309; --salL:#FCEBD5;      /* salidas */
  --ok:#1C8A4C; --okL:#E2F3E8; --nc:#C4302B; --ncL:#FBE6E4; --amb:#B7790A; --ambL:#FBF0D9;
  --gris:#E9EDEC; --radio:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--pared);color:var(--tinta);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.4;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #F2B705;outline-offset:2px}
.oculto{display:none!important}
.envol{max-width:1180px;margin:0 auto;padding:16px 16px 120px}

.cab{background:var(--tinta);color:#fff;padding:12px 16px}
.cab .envol{padding:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cab h1{margin:0;font-size:21px;flex:1;min-width:160px}
.zonas{display:flex;gap:6px;background:rgba(255,255,255,.1);padding:5px;border-radius:14px}
.zonas button{border:0;background:transparent;color:#fff;opacity:.75;padding:10px 14px;border-radius:10px;
  font-size:15px;font-weight:700;min-height:46px}
.zonas button[aria-pressed="true"]{background:#fff;color:var(--tinta);opacity:1}

h2{font-size:25px;margin:18px 0 6px}
.nota{color:var(--suave);font-size:15px;margin:0 0 12px}
.fila-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.seg{display:flex;gap:6px;background:#fff;padding:6px;border-radius:16px}
.seg button{border:0;background:transparent;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:700;
  color:var(--suave);min-height:54px}
.seg button[aria-pressed="true"]{background:var(--tinta);color:#fff}
.flecha{width:56px;height:56px;border-radius:14px;border:2px solid var(--linea);background:#fff;font-size:24px;font-weight:700}
.titulo-per{font-size:22px;font-weight:700;flex:1;min-width:180px}
.btn{border:0;border-radius:14px;padding:14px 20px;font-size:18px;font-weight:700;min-height:56px}
.btn.ent{background:var(--ent);color:#fff}
.btn.sal{background:var(--sal);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.nc{background:#fff;color:var(--nc);border:2px solid var(--nc)}
.btn.sec{background:#fff;color:var(--tinta);border:2px solid var(--linea)}
.btn:disabled{opacity:.45;cursor:default}

/* Semana */
.semana{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.dia{background:#fff;border-radius:var(--radio);padding:12px;display:flex;flex-direction:column;gap:8px;
  border:3px solid transparent;text-align:left;min-height:240px}
.dia.hoy{border-color:var(--tinta)}
.dia .cab-d{display:flex;justify-content:space-between;align-items:baseline}
.dia .cab-d b{font-size:19px}
.dia .cab-d span{font-size:13px;color:var(--suave)}
.carga{height:8px;border-radius:4px;background:var(--gris);overflow:hidden}
.carga i{display:block;height:100%}
.bloque{border-radius:12px;padding:9px 10px}
.bloque.ent{background:var(--entL)} .bloque.sal{background:var(--salL)}
.bloque .t{font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.bloque.ent .t{color:var(--ent)} .bloque.sal .t{color:var(--sal)}
.bloque .n{font-size:26px;font-weight:700;line-height:1.1}
.bloque .d{font-size:13px;color:var(--suave)}
.mini-l{font-size:13px;margin-top:4px;display:flex;gap:5px;align-items:center}
.pt{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Mes */
.mes{background:#fff;border-radius:var(--radio);padding:10px;overflow-x:auto}
.mes table{border-collapse:separate;border-spacing:5px;width:100%;min-width:640px}
.mes th{font-size:13px;color:var(--suave);text-align:left;padding:0 4px}
.cm{width:100%;min-height:92px;border-radius:12px;border:2px solid var(--gris);background:#fff;padding:7px;
  text-align:left;display:flex;flex-direction:column;gap:4px;font-size:13px}
.cm .n{font-weight:700;font-size:16px}
.cm.hoy{border-color:var(--tinta)} .cm.fuera{opacity:.35}
.chip-e{background:var(--entL);color:var(--ent);border-radius:8px;padding:2px 6px;font-weight:700}
.chip-s{background:var(--salL);color:var(--sal);border-radius:8px;padding:2px 6px;font-weight:700}

/* Día */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col h3{margin:4px 0 10px;font-size:21px;display:flex;gap:8px;align-items:center}
.col.ent h3{color:var(--ent)} .col.sal h3{color:var(--sal)}
.tarj{background:#fff;border-radius:var(--radio);padding:14px 16px;margin-bottom:10px;border-left:8px solid var(--linea)}
.tarj.ent{border-left-color:var(--ent)} .tarj.sal{border-left-color:var(--sal)}
.tarj .prov{font-size:20px;font-weight:700}
.tarj .det{font-size:15px;color:var(--suave);margin-top:2px}
.tarj .cant{font-size:24px;font-weight:700;margin-top:6px}
.tarj .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.estado{display:inline-block;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;margin-top:6px}
.e-pend{background:var(--ambL);color:#7A5205} .e-ok{background:var(--okL);color:var(--ok)}
.e-camb{background:var(--ncL);color:var(--nc)} .e-rec{background:var(--gris);color:var(--suave)}
.e-conf{background:#fff;color:var(--suave);border:2px dashed var(--linea)}
.lin{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--gris);font-size:15px}
.lin:first-of-type{border-top:0}
.lin .q{font-weight:700;min-width:64px;text-align:right}

/* Picking */
.prog{background:#fff;border-radius:var(--radio);padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.prog .barra{flex:1;height:14px;border-radius:7px;background:var(--gris);overflow:hidden}
.prog .barra i{display:block;height:100%;background:var(--ok)}
.prod{background:#fff;border-radius:var(--radio);margin-bottom:12px;overflow:hidden}
.prod-cab{padding:14px 16px;border-bottom:2px solid var(--pared);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.prod-cab .cod{font-size:22px;font-weight:700}
.prod-cab .des{flex:1;color:var(--suave);font-size:15px;min-width:160px}
.env{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--gris)}
.env:first-of-type{border-top:0}
.env .eti{flex:1;min-width:0}
.env .eti b{font-size:19px}
.env .eti small{display:block;color:var(--suave);font-size:14px}
.env .uds{font-size:30px;font-weight:700;min-width:90px;text-align:right;line-height:1}
.env .uds small{display:block;font-size:13px;color:var(--suave);font-weight:400}
.check{width:120px;height:72px;border-radius:16px;border:3px solid var(--linea);background:#fff;font-size:16px;font-weight:700;
  color:var(--suave);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
.check svg{width:28px;height:28px}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.env.hecho{background:#F6FBF8}
.env.hecho .eti b{text-decoration:line-through;color:var(--suave)}
.clientes{font-size:13px;color:var(--suave);margin-top:4px}

/* Hoja de seguimiento (Compras) */
.hoja-cal{background:#fff;border-radius:var(--radio);overflow:auto;max-height:70vh;border:1px solid var(--linea)}
.hoja-cal table{border-collapse:separate;border-spacing:0;font-size:14px;min-width:2100px}
.hoja-cal th{position:sticky;top:0;z-index:2;background:#F3F6F5;color:var(--suave);font-size:12px;font-weight:700;
  text-align:left;padding:8px 6px;border-bottom:2px solid var(--linea);white-space:nowrap}
.hoja-cal td{border-bottom:1px solid var(--gris);padding:3px;vertical-align:middle;background:#fff}
.hoja-cal td:first-child,.hoja-cal th:first-child{position:sticky;left:0;z-index:3;box-shadow:2px 0 0 var(--linea)}
.hoja-cal th:first-child{z-index:4}
.hoja-cal tr.baza-hoy td{background:#FFFBEF}
.hoja-cal tr.llegada td{background:#F7F9F8;color:var(--suave)}
.cel{width:100%;font:inherit;font-size:14px;border:1.5px solid transparent;border-radius:7px;padding:7px 6px;
  background:transparent;color:inherit;min-width:0}
.cel:hover{border-color:var(--linea)} .cel:focus{border-color:var(--ent);background:#fff;outline:none}
.cel.baza{font-weight:700;color:var(--ent)} .cel.vacio-ob{border-color:#F1C6C3;background:var(--ncL)}
.tgl{border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700;color:var(--suave)}
.tgl.on{border-color:var(--ok);background:var(--okL);color:var(--ok)}
.guardado{font-size:12px;color:var(--ok)}

/* Compras */
.lista{background:#fff;border-radius:var(--radio);overflow:hidden}
.fe{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;padding:12px 16px;
  border-top:1px solid var(--gris);font-size:16px}
.fe:first-child{border-top:0}
.fe.cabl{background:var(--gris);font-size:13px;font-weight:700;color:var(--suave)}
.fe .p{font-weight:700}
.aviso{background:var(--ambL);color:#6B4A06;border-radius:14px;padding:13px 16px;margin:10px 0;font-size:16px}
.aviso.err{background:var(--ncL);color:#7E1E1A} .aviso.ok{background:var(--okL);color:#145E35}
label.c{display:block;font-weight:700;margin:14px 0 6px;font-size:16px}
input.t,select.t,textarea.t{width:100%;font:inherit;font-size:18px;padding:13px;border:2px solid var(--linea);border-radius:12px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--linea);background:#fff;border-radius:999px;padding:9px 15px;font-size:16px;font-weight:700;min-height:46px}
.chip[aria-pressed="true"]{border-color:var(--ent);background:var(--entL);color:var(--ent)}
.rej{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}

.velo{position:fixed;inset:0;background:rgba(21,32,29,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.hoja{background:#fff;width:100%;max-width:760px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0));
  max-height:92vh;overflow:auto}
.hoja h3{margin:0 0 6px;font-size:22px}
.hist{font-size:14px;color:var(--suave);border-top:1px solid var(--gris);padding:6px 0}
.vacio{background:#fff;border-radius:var(--radio);padding:22px;color:var(--suave);text-align:center;font-size:16px}
.toast{position:fixed;left:16px;right:16px;top:14px;z-index:50;max-width:640px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}

@media (max-width:820px){
  .dos{grid-template-columns:1fr}
  .fe{grid-template-columns:1fr 1fr;row-gap:4px}
  .fe.cabl{display:none}
  .semana{grid-template-columns:repeat(6,minmax(170px,1fr))}
}
@media (max-width:560px){
  body{font-size:17px}
  .env{flex-wrap:wrap}
  .check{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="cab">
  <div class="envol">
    <h1>Plan de almacén</h1>
    <div class="zonas" role="group" aria-label="Zona">
      <button data-z="plan">📅 Plan</button>
      <button data-z="picking">🧺 Picking</button>
      <button data-z="compras">🧾 Compras</button>
    </div>
  </div>
</header>
<main class="envol" id="app"><p class="nota" style="padding:40px 0;text-align:center">Cargando…</p></main>
<div id="capa"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// Datos y utilidades
// ═══════════════════════════════════════════════════════════════════════
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const COL_ENT="almacen_entradas", COL_PICK="almacen_picking";
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DCORTO=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const UNIDADES=["Barriles","Pallets","Cajas","Contenedor"];
const TRANSPORTE=["Camión","Contenedor"];
const $=(s,c=document)=>c.querySelector(s);
const esc=(t)=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const iso=(d)=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const HOY=iso(new Date());
const deISO=(f)=>new Date(f+"T12:00:00");
const sumaDias=(f,n)=>{ const d=deISO(f); d.setDate(d.getDate()+n); return iso(d); };
const lunesDe=(f)=>{ const d=deISO(f); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
const fLarga=(f)=>{ const d=deISO(f); return DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()]; };
const fCorta=(f)=>{ const d=deISO(f); return d.getDate()+"/"+(d.getMonth()+1); };
const n0=(x)=>Math.round(Number(x)||0).toLocaleString("es-ES");
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg>';

// Fechas de SAP en cualquier formato → AAAA-MM-DD
function aISO(v){
  if(!v) return "";
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ const a=m[3].length===2?"20"+m[3]:m[3]; return a+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  const d=new Date(s); return isNaN(d)?"":iso(d);
}

function deFB(f){
  if(!f) return null;
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.arrayValue!==undefined) return (f.arrayValue.values||[]).map(deFB);
  if(f.timestampValue!==undefined) return f.timestampValue;
  return null;
}
function aFB(v){
  if(v===null||v===undefined) return {nullValue:null};
  if(typeof v==="boolean") return {booleanValue:v};
  if(typeof v==="number") return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  return {stringValue:String(v)};
}
async function leerCol(col,max=30){
  const out=[]; let tok=null, v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?"&pageToken="+encodeURIComponent(tok):""),{cache:"no-store"});
    if(!r.ok) break;
    const j=await r.json();
    (j.documents||[]).forEach(d=>{
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      Object.entries(d.fields||{}).forEach(([k,x])=>o[k]=deFB(x));
      out.push(o);
    });
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<max);
  return out;
}
async function escribir(col,id,obj,campos){
  const fields={}; Object.keys(obj).forEach(k=>fields[k]=aFB(obj[k]));
  const mask=campos?("?"+campos.map(c=>"updateMask.fieldPaths="+c).join("&")):"";
  const r=await fetch(`${FB}/${col}/${encodeURIComponent(id)}${mask}`,{method:"PATCH",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});
  if(!r.ok) throw new Error("HTTP "+r.status);
}
function aviso(t,tipo){
  const d=document.createElement("div"); d.className="aviso toast "+(tipo||""); d.textContent=t;
  document.body.appendChild(d); setTimeout(()=>d.remove(),3500);
}

// ── Sesión y permisos ──────────────────────────────────────────────────
function sesion(){
  let u={};
  try{ u=JSON.parse(localStorage.getItem("gc_portal_user")||"{}"); }catch(e){}
  try{ const h=decodeURIComponent((location.hash||"").replace(/^#/,"")); if(h.charAt(0)==="{") u={...u,...JSON.parse(h)}; }catch(e){}
  return u;
}
const U=sesion();
// El portal calcula el perfil con el organigrama. Si no llega, se deduce.
function perfil(){
  const p=String(U.almPerfil||"");
  const rol=String(U.rol||"").toLowerCase(), tip=String(U.tipologia||"").toLowerCase();
  const ids=[U.crmId,U.id].filter(Boolean).map(x=>String(x).toLowerCase());
  if(p==="direccion"||["ceo","admin","director","crm_director"].includes(rol)) return "direccion";
  if(p) return p;
  if(ids.includes("compras")||tip==="stock"||tip==="compras"||rol==="compras") return "compras";
  return "almacen";
}
const PERFIL=perfil();
// Qué zonas ve cada uno
const ZONAS_DE={direccion:["plan","picking","compras"],compras:["compras","plan"],almacen:["plan","picking"]};
const QUIEN=U.nombre||U.username||"—";

// ═══════════════════════════════════════════════════════════════════════
// Estado
// ═══════════════════════════════════════════════════════════════════════
const S={zona:null, vista:"semana", ref:HOY, entradas:[], pedidos:[], picking:{}, cargado:false, filtroC:"proximas"};

async function cargarTodo(){
  const [ent,ped]=await Promise.all([leerCol(COL_ENT,10),leerCol("pbi_pedidos",30)]);
  S.entradas=ent.filter(e=>!e.eliminada).map(e=>{
    try{ e.historial=JSON.parse(e.historial||"[]"); }catch(x){ e.historial=[]; }
    return e;
  });
  // Salidas: una línea por pedido y artículo, con la fecha en la que sale
  S.pedidos=ped.map(l=>({...l,_f:aISO(l.fecha)})).filter(l=>l._f);
  S.cargado=true;
}
async function cargarPicking(f){
  try{
    const r=await fetch(`${FB}/${COL_PICK}/${f}`,{cache:"no-store"});
    if(!r.ok){ S.picking[f]={}; return; }
    const j=await r.json();
    S.picking[f]=JSON.parse(((j.fields||{}).preparados||{}).stringValue||"{}");
  }catch(e){ S.picking[f]={}; }
}

// Producto y envase del código de SAP: MX248.8-8R2 → producto MX248, envase 8-8R2
function partirCodigo(c){
  const s=String(c||"").trim(); const i=s.indexOf(".");
  return i>0?{prod:s.slice(0,i),env:s.slice(i+1)}:{prod:s||"—",env:""};
}
const cantidadEnt=(e)=>Number(e.cantidad)||0;
// (sep 2026) Lo que importa a almacen es CUANTO llega, no en que viene: un
// camion puede traer un palé y un contenedor, 80 barriles. Se separan.
// (sep 2026) Qué llega. Un contenedor siempre es completo; por aire o por
// carretera puede ser un camión completo, barriles, pallets, cajas sueltas o
// una muestra, y entonces hay que decir cuántos.
const UNIDADES_CONT=["Camión completo","Barriles","Pallets","Cajas","Bultos","Kg","Muestra"];
const QUE_AEREO=["Barriles","Pallets","Cajas","Muestra"];
const QUE_TERRESTRE=["Camión completo","Barriles","Pallets","Cajas","Muestra"];
function contenidoEnt(e){
  const c=cantidadEnt(e), u=e.unidad;
  if(e.transporte==="Contenedor"||u==="Contenedor") return "Contenedor completo";
  if(u==="Muestra"||(e.transporte==="Paquetería"&&!c)) return "Muestra";
  if(u==="Camión completo"){ const n=c||1; return n+(n===1?" camión completo":" camiones completos"); }
  const SG={Barriles:"barril",Pallets:"pallet",Cajas:"caja suelta",Bultos:"bulto",Kg:"kg"};
  const PL={Barriles:"barriles",Pallets:"pallets",Cajas:"cajas sueltas",Bultos:"bultos",Kg:"kg"};
  return c&&SG[u]?n0(c)+" "+(c===1?SG[u]:PL[u]):"";
}
function medioEnt(e){
  if(e.transporte==="Paquetería") return "Muestra";
  if(e.transporte==="Avión") return "Aéreo";
  if(e.transporte==="Camión") return "Camión";
  if(e.tipoTxt) return "Contenedor "+e.tipoTxt;
  return e.transporte==="Contenedor"?"Contenedor":"";
}
const sinCantidad=(e)=>!contenidoEnt(e);
// Tipo de llegada, para filtrar
function tipoDe(e){
  if(e.unidad==="Muestra"||e.transporte==="Paquetería") return "muestra";
  if(e.transporte==="Contenedor") return "contenedor";
  if(e.transporte==="Avión") return "aereo";
  return "terrestre";
}
const TIPOS_FILTRO=[["todos","Todos",""],["contenedor","Contenedor","🚢"],["aereo","Aéreo","✈️"],
  ["terrestre","Terrestre","🚚"],["muestra","Muestras","📦"]];
const almDe=(e)=>String(e.almacen||"BAZA").trim().toUpperCase()||"BAZA";
function almacenes(){ return [...new Set(["BAZA"].concat(S.entradas.map(almDe)))].sort(); }
const entradasDe=(f)=>S.entradas.filter(e=>e.fecha===f&&(!S.planAlm||S.planAlm==="todos"||almDe(e)===S.planAlm));
const salidasDe=(f)=>S.pedidos.filter(l=>l._f===f);
function pedidosDe(f){
  const m={};
  salidasDe(f).forEach(l=>{ const k=l.pedido||("?"+(l.cliente||"")); (m[k]=m[k]||{pedido:l.pedido,cliente:l.nombre||l.cliente||"",
    poblacion:l.poblacion||"",lineas:[]}).lineas.push(l); });
  return Object.values(m);
}
// Carga del día, para pintar la barra: barriles y pallets que entran + líneas que salen
function cargaDe(f){
  // Con cantidad, se cuenta lo que llega; sin ella, una estimación por el medio
  const peso=(x)=>{
    const c=cantidadEnt(x);
    if(x.transporte==="Contenedor"||x.unidad==="Contenedor") return 40;
    if(x.unidad==="Muestra"||x.transporte==="Paquetería") return 1;
    if(x.unidad==="Camión completo") return 30*(c||1);
    if(contenidoEnt(x)) return x.unidad==="Pallets"?c*2:x.unidad==="Barriles"?c:x.unidad==="Kg"?c/100:c*0.5;
    return x.transporte==="Camión"?10:5;
  };
  const e=entradasDe(f).reduce((t,x)=>t+peso(x),0);
  return e+salidasDe(f).length*2;
}
function colorCarga(c){ return c>=160?"var(--nc)":c>=90?"var(--amb)":"var(--ok)"; }
const ESTADO={
  pendiente:{t:"Pendiente de almacén",c:"e-pend"}, aceptada:{t:"Aceptada",c:"e-ok"},
  cambio:{t:"Almacén pide otra fecha",c:"e-camb"}, recibida:{t:"Recibida",c:"e-rec"},
};
function etiquetaEstado(e){
  if(!e.fecha) return `<span class="estado e-conf">Por confirmar</span>`;
  const x=ESTADO[e.estado]||ESTADO.pendiente;
  return `<span class="estado ${x.c}">${x.t}</span>`;
}

// Almacén: el departamento "almacen" y lo que cuelga de él. Compras: el
// departamento "compras" (con su responsable base) y quien tenga su tipología.
const GENERICOS=["info@unitedcaro.com"];
async function emailsDe(raiz){
  const [us,pu,deps]=await Promise.all([leerCol("usuarios",5),leerCol("portal_users",5),leerCol("departamentos",2)]);
  const rama=new Set([raiz]); let crece=true;
  while(crece){ crece=false; deps.forEach(d=>{ if(!rama.has(d._id)&&d.padre&&rama.has(d.padre)){ rama.add(d._id); crece=true; } }); }
  const resp=new Set(raiz==="compras"?["compras"]:[]);
  deps.filter(d=>rama.has(d._id)).forEach(d=>(d.responsableIds||[]).forEach(r=>resp.add(String(r))));
  const tipos=raiz==="compras"?["compras","stock"]:["almacen"];
  const ids=new Set();
  [...us,...pu].forEach(u=>{
    if(u.activo===false) return;
    if(tipos.includes(String(u.tipologia||"").toLowerCase())||rama.has(String(u.departamentoId||""))
      ||resp.has(u._id)||resp.has(String(u.crmId||""))) ids.add(String(u.crmId||u._id));
  });
  const em=new Set();
  [...us,...pu].forEach(u=>{ if(u.email&&[u._id,u.id,u.crmId].filter(Boolean).some(k=>ids.has(String(k))))
    em.add(String(u.email).toLowerCase().trim()); });
  const pers=[...em].filter(e=>!GENERICOS.includes(e));
  return pers.length?pers:[...em];
}
async function avisar(raiz,asunto,cuerpo,e){
  try{
    const to=await emailsDe(raiz); if(!to.length) return;
    const html=`<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:600px;margin:0 auto;color:#15201D">
      <div style="background:#15201D;color:#fff;padding:16px 20px;border-radius:14px 14px 0 0;font-size:19px;font-weight:700">${esc(asunto)}</div>
      <div style="border:1px solid #C9D3CF;border-top:none;border-radius:0 0 14px 14px;padding:18px 20px">
        ${cuerpo}
        ${e?`<table style="width:100%;border-collapse:collapse;margin-top:12px;font-size:14px">
          ${[["Proveedor",e.proveedor],["Referencia",e.ref],["Pedido",e.pedido],
             ["Qué llega",contenidoEnt(e)||"Cantidad por confirmar"],["Cómo llega",medioEnt(e)],
             ["Almacén",e.almacen]].map(([k,v])=>`<tr><td style="padding:5px 0;color:#5C6B66;width:120px">${k}</td><td style="padding:5px 0"><b>${esc(v||"—")}</b></td></tr>`).join("")}
        </table>`:""}
        <div style="text-align:center;margin-top:18px"><a href="https://crmwikuk.vercel.app/almacen.html"
          style="display:inline-block;background:#0E5E6F;color:#fff;text-decoration:none;padding:12px 24px;border-radius:10px;font-weight:700">Abrir el plan de almacén</a></div>
      </div></div>`;
    await fetch("/api/send-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to,subject:asunto,html})});
  }catch(x){}
}

async function guardarEntrada(e,evento){
  e.historial=(e.historial||[]).concat([{ts:new Date().toISOString(),por:QUIEN,que:evento}]);
  e.actualizado=new Date().toISOString();
  const doc={...e,historial:JSON.stringify(e.historial)}; delete doc._id;
  await escribir(COL_ENT,e._id,doc);
  const i=S.entradas.findIndex(x=>x._id===e._id);
  if(i>=0) S.entradas[i]=e; else S.entradas.push(e);
}

        <option value="todos">Todos los almacenes</option>
        ${almacenes().map(a=>`<option value="${esc(a)}" ${S.planAlm===a?"selected":""}>🏭 ${esc(a)}</option>`).join("")}</select>`:""}
    </div>
    ${PERFIL!=="compras"&&pendientes.length?`<div class="aviso">📬 ${pendientes.length} entrada${pendientes.length>1?"s":""}
      con fecha nueva esperando tu respuesta. Tócalas para aceptarlas o pedir otra fecha.</div>`:""}

  const t={}; l.forEach(e=>{

    t[u]=(t[u]||0)+((cont||u==="Muestras"||u==="Sin cantidad")?1:(cantidadEnt(e)||1)); });
  const SING={Muestras:"muestra",Barriles:"barril",Pallets:"pallet",Cajas:"caja",Bultos:"bulto",
    Contenedores:"contenedor","Camiones completos":"camión completo"};

  const acc=$("#accEnt"), btns=[];
  if(esAlm&&e.fecha&&e.estado==="pendiente") btns.push(`<button class="btn ok" id="bAcep">✅ Acepto esta fecha</button>`,
    `<button class="btn nc" id="bCamb">📅 Pedir otra fecha</button>`);
  if(esAlm&&e.fecha&&e.estado==="aceptada"&&e.fecha<=HOY) btns.push(`<button class="btn ok" id="bRec">📦 Ya ha llegado</button>`);
  if(esAlm&&e.fecha&&e.estado==="aceptada"&&e.fecha>HOY) btns.push(`<button class="btn nc" id="bCamb">📅 Pedir otra fecha</button>`);
  if(esCom&&e.estado==="cambio") btns.push(`<button class="btn ok" id="bAcepProp">✅ Aceptar el ${fLarga(e.propuesta)}</button>`,
    `<button class="btn sec" id="bMant">Mantener el ${fLarga(e.fecha)}</button>`);
  if(esCom) btns.push(`<button class="btn ent" id="bEdit">✏️ Cambiar datos o fecha</button>`);
  acc.innerHTML=btns.join("");
  const on=(id,fn)=>{ const b=$("#"+id); if(b) b.onclick=fn; };
  on("bAcep",async()=>{ e.estado="aceptada"; e.aceptadaPor=QUIEN; await guardarYVolver(e,"Almacén acepta el "+fLarga(e.fecha));
    avisar("compras","✅ Almacén acepta la entrada de "+e.proveedor+" el "+fLarga(e.fecha),
      `<p>${esc(QUIEN)} ha aceptado la fecha.</p>`,e); });
  on("bRec",async()=>{ e.estado="recibida"; e.recibidaEl=new Date().toISOString(); await guardarYVolver(e,"Recibida en almacén");
    avisar("compras","📦 Recibida la entrada de "+e.proveedor,`<p>${esc(QUIEN)} ha confirmado la llegada.</p>`,e); });
  on("bCamb",()=>pedirCambio(e));
  on("bAcepProp",async()=>{ const ant=e.fecha; e.fechaAnterior=ant; e.fecha=e.propuesta; e.estado="aceptada";
    e.propuesta=""; await guardarYVolver(e,"Compras acepta la fecha que pidió almacén: "+fLarga(e.fecha));
    avisar("almacen","✅ Aceptado: "+e.proveedor+" llega el "+fLarga(e.fecha),
      `<p>Compras ha aceptado la fecha que pediste (antes era el ${fLarga(ant)}).</p>`,e); });
  on("bMant",async()=>{ const m=prompt("¿Por qué se mantiene la fecha? (se lo decimos a almacén)",""); if(m===null) return;
    e.estado="pendiente"; e.propuesta=""; await guardarYVolver(e,"Compras mantiene el "+fLarga(e.fecha)+(m?": "+m:""));
    avisar("almacen","📅 Se mantiene la entrada de "+e.proveedor+" el "+fLarga(e.fecha),
      `<p>Compras no puede mover la fecha${m?": "+esc(m):""}. Vuelve a revisarla en el plan.</p>`,e); });
  on("bEdit",()=>{ cerrar(); nuevaFila(e); });
}
async function guardarYVolver(e,evento){
  try{ await guardarEntrada(e,evento); $("#capa").innerHTML=""; aviso("Guardado","ok"); pintar(); }
  catch(x){ aviso("No se ha podido guardar: "+x.message,"err"); }
}
function pedirCambio(e){
  $("#capa").innerHTML=`<div class="velo" id="velo"><div class="hoja" role="dialog" aria-modal="true">
    <h3>📅 Pedir otra fecha</h3>
    <p class="nota">${esc(e.proveedor)} · ahora llega el ${fLarga(e.fecha)}</p>
    <label class="c">¿Qué día te viene bien?</label>
    <div class="chips" id="sugs">${[1,2,3,4,5,6,7].map(i=>sumaDias(e.fecha,i)).filter(f=>deISO(f).getDay()!==0)
      .slice(0,5).map(f=>`<button class="chip" data-pf="${f}">${DCORTO[deISO(f).getDay()]} ${fCorta(f)}</button>`).join("")}</div>
    <input class="t" type="date" id="pf" style="margin-top:10px" value="${sumaDias(e.fecha,1)}">
    <label class="c">¿Por qué?</label>
    <div class="chips">${["Mucha carga ese día","Falta de personal","Falta de espacio","Coincide con otra entrada"].map(m=>`<button class="chip" data-pm="${m}">${m}</button>`).join("")}</div>
    <textarea class="t" id="pm" rows="2" style="margin-top:10px" placeholder="Explícalo si hace falta"></textarea>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn sec" id="pCanc" style="flex:1">Cancelar</button>
      <button class="btn nc" id="pOk" style="flex:2">Pedir el cambio a compras</button></div>
  </div></div>`;
  document.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{ $("#pf").value=b.dataset.pf;
    document.querySelectorAll("[data-pf]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); });
  document.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{ $("#pm").value=b.dataset.pm; });
  $("#pCanc").onclick=()=>{ $("#capa").innerHTML=""; };
  $("#pOk").onclick=async()=>{
    const f=$("#pf").value, m=$("#pm").value.trim();
    if(!f){ aviso("Elige el día","err"); return; }
    if(!m){ aviso("Di por qué","err"); return; }
    e.estado="cambio"; e.propuesta=f; e.motivoCambio=m;
    await guardarYVolver(e,"Almacén pide el "+fLarga(f)+" en vez del "+fLarga(e.fecha)+": "+m);
    avisar("compras","📅 Almacén pide cambiar la entrada de "+e.proveedor,
      `<p>${esc(QUIEN)} pide recibirla el <b>${fLarga(f)}</b> en lugar del ${fLarga(e.fecha)}.</p><p>Motivo: ${esc(m)}</p>
       <p>Acéptalo o mantén la fecha desde el escritorio de compras.</p>`,e);
  };
}

// PICKING
// ═══════════════════════════════════════════════════════════════════════
async function pintarPicking(){
  const f=S.pickDia||HOY; S.pickDia=f;
  if(!S.picking[f]){ $("#app").innerHTML=`<p class="nota" style="padding:30px 0;text-align:center">Cargando el picking…</p>`; await cargarPicking(f); }
  const hechos=S.picking[f]||{};
  // Producto → envase → unidades, pedidos y clientes
  const grupos={};
  salidasDe(f).forEach(l=>{
    const {prod,env}=partirCodigo(l.articulo);
    const g=grupos[prod]=grupos[prod]||{prod,des:"",env:{}};
    (g.descs=g.descs||[]).push(String(l.descripcion||"").replace(/\s+/g," ").trim());
    const k=env||"—";
    const x=g.env[k]=g.env[k]||{env:k,art:l.articulo,des:l.descripcion||"",uds:0,pedidos:new Set(),clientes:new Set()};
    x.uds+=Number(l.unidades)||0; if(l.pedido) x.pedidos.add(l.pedido); x.clientes.add(l.nombre||l.cliente||"");
  });
  // Nombre del producto: lo que tienen en comun las descripciones de sus envases
  Object.values(grupos).forEach(g=>{
    const ds=(g.descs||[]).filter(Boolean); let c=ds[0]||"";
    ds.forEach(d=>{ let i=0; while(i<c.length&&i<d.length&&c[i]===d[i]) i++; c=c.slice(0,i); });
    c=c.replace(/[\s(·,-]+$/,"").trim();
    g.des=c.length>=4?c:(ds[0]||"");
  });
  const lista=Object.values(grupos).sort((a,b)=>a.prod.localeCompare(b.prod));
  const tot=lista.reduce((t,g)=>t+Object.keys(g.env).length,0);
  const hech=lista.reduce((t,g)=>t+Object.values(g.env).filter(x=>hechos[x.art]).length,0);
  const soloPend=!!S.soloPend;
  $("#app").innerHTML=`
    <div class="fila-ctl">
      <button class="flecha" id="pAnt" aria-label="Día anterior">‹</button>
      <span class="titulo-per">🧺 ${fLarga(f)}</span>
      <button class="flecha" id="pSig" aria-label="Día siguiente">›</button>
      <button class="btn sec" id="pHoy">Hoy</button>
      <button class="btn sec" id="pFil" aria-pressed="${soloPend}">${soloPend?"Ver todo":"Solo lo que falta"}</button>
    </div>
    ${tot?`<div class="prog"><b style="font-size:22px">${hech} de ${tot}</b>
      <span class="barra"><i style="width:${tot?hech/tot*100:0}%"></i></span>
      <span style="color:var(--suave)">${pedidosDe(f).length} pedidos</span></div>`:""}
    ${tot?lista.map(g=>{
      const envs=Object.values(g.env).filter(x=>!soloPend||!hechos[x.art]);
      if(!envs.length) return "";
      const sinEnv=Object.keys(g.env).length===1&&g.env["—"];
      return `<section class="prod"><div class="prod-cab"><span class="cod">${esc(g.prod)}</span>
        <span class="des">${sinEnv?"":esc(g.des)}</span></div>
        ${envs.map(x=>{ const h=hechos[x.art];
          return `<div class="env${h?" hecho":""}">
            <div class="eti"><b>${x.env==="—"?esc(x.des||x.art):"Envase "+esc(x.env)}</b>
              <small>${x.env==="—"?esc(x.art):esc(x.des)+" · "+esc(x.art)}</small>
              <div class="clientes">${x.pedidos.size} pedido${x.pedidos.size>1?"s":""} · ${[...x.clientes].filter(Boolean).slice(0,3).map(esc).join(", ")}${x.clientes.size>3?"…":""}</div>
              ${h?`<div class="clientes" style="color:var(--ok)">Preparado por ${esc(h.por)} a las ${new Date(h.ts).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}</div>`:""}</div>
            <div class="uds">${n0(x.uds)}<small>unidades</small></div>
            <button class="check" data-pk="${esc(x.art)}" aria-pressed="${!!h}">${CHECK}${h?"Preparado":"Preparar"}</button>
          </div>`;}).join("")}
      </section>`;}).join(""):`<div class="vacio">Este día no hay pedidos que preparar.</div>`}`;
  $("#pAnt").onclick=()=>{ S.pickDia=sumaDias(f,-1); pintarPicking(); };
  $("#pSig").onclick=()=>{ S.pickDia=sumaDias(f,1); pintarPicking(); };
  $("#pHoy").onclick=()=>{ S.pickDia=HOY; pintarPicking(); };
  $("#pFil").onclick=()=>{ S.soloPend=!soloPend; pintarPicking(); };
  document.querySelectorAll("[data-pk]").forEach(b=>b.onclick=async()=>{
    const art=b.dataset.pk, m={...(S.picking[f]||{})};
    if(m[art]) delete m[art]; else m[art]={por:QUIEN,ts:new Date().toISOString()};
    S.picking[f]=m; pintarPicking();
    try{ await escribir(COL_PICK,f,{fecha:f,preparados:JSON.stringify(m),actualizado:new Date().toISOString(),por:QUIEN}); }
    catch(e){ aviso("No se ha podido guardar. Revisa la conexión.","err"); }
  });
}

const TIPOS_CONT=["20'DRY","40'DRY","40'HC","20'RF","40'RF","AIR","Camión","Muestra"];
const COLS=[
  {k:"proveedor",t:"Proveedor",w:150,ob:true},
  {k:"ref",t:"Nº FRA/LOTE",w:95},
  {k:"notas",t:"Notas",w:150},
  {k:"pedido",t:"Order#",w:105},
  {k:"contenedor",t:"Nº contenedor",w:130},
  {k:"naviera",t:"Naviera",w:115},
  {k:"situacion",t:"Situación",w:100,opc:["","Pagado","Pendiente"]},
  {k:"transitario",t:"Transitario",w:105},
  {k:"incoterm",t:"Incoterm",w:80,opc:["","EXW","FOB","FCA","CFR","CIF","CPT","CIP","DAP","DDP"]},
  {k:"tipoContenedor",t:"Contenedor",w:100,opc:[""].concat(TIPOS_CONT)},
  {k:"cantidad",t:"Cantidad",w:85,num:true},
  {k:"unidad",t:"Unidad",w:100,opc:[""].concat(UNIDADES_CONT)},
  {k:"doc",t:"DOC",w:60,tgl:true},

  {k:"puertoOrigen",t:"Puerto origen",w:115},
  {k:"fechaPuerto",t:"Llegada puerto",w:135,fecha:true},
  {k:"puertoDestino",t:"Puerto destino",w:110},
  {k:"fecha",t:"Llegada",w:140,fecha:true,baza:true},
  {k:"almacen",t:"Almacén",w:95},
  {k:"invForwarders",t:"Inv. forwarders",w:80,tgl:true},
  {k:"importeFactura",t:"Invoice",w:115},
];

function pintarCompras(){
  const F=S.filtroC, q=String(S.buscaC||"").toLowerCase();
  let l=S.entradas.slice();
  if(F==="proximas") l=l.filter(e=>e.estado!=="recibida"&&(!e.fecha||e.fecha>=sumaDias(HOY,-3)));
  else if(F==="transito") l=l.filter(e=>e.estado!=="recibida"&&e.fechaSalida&&e.fechaSalida<=HOY&&(!e.fechaPuerto||e.fechaPuerto>=HOY));
  else if(F==="respuesta") l=l.filter(e=>e.estado==="cambio");
  else if(F==="recibidas") l=l.filter(e=>e.estado==="recibida");
  if(q) l=l.filter(e=>COLS.some(c=>String(e[c.k]||"").toLowerCase().includes(q)));
  // (sep 2026) Por almacén y por tipo. Los recuentos se calculan antes de
  // aplicar el propio filtro, para ver cuántos hay de cada.
  const FA=S.filtroAlm||"todos", FT=S.filtroTipo||"todos";
  const porAlm=l.filter(e=>FA==="todos"||almDe(e)===FA);
  const cuentaTipo={}; porAlm.forEach(e=>{ const t=tipoDe(e); cuentaTipo[t]=(cuentaTipo[t]||0)+1; });
  const porTipo=l.filter(e=>FT==="todos"||tipoDe(e)===FT);
  const cuentaAlm={}; porTipo.forEach(e=>{ const a=almDe(e); cuentaAlm[a]=(cuentaAlm[a]||0)+1; });
  l=porAlm.filter(e=>FT==="todos"||tipoDe(e)===FT);
  // En pantalla, BAZA y la respuesta de almacén van junto al proveedor: es lo
  // que más se mira. La descarga conserva el orden del Excel de siempre.
  const PRIM=["fecha","almacen","cantidad","unidad"];
  const VIS=[COLS[0],COLS[1]].concat(PRIM.map(k=>COLS.find(c=>c.k===k)))
    .concat(COLS.slice(2).filter(c=>!PRIM.includes(c.k)));
  const NPRIM=6;
  l.sort((a,b)=>(a.fecha||"9999").localeCompare(b.fecha||"9999"));
  const nCamb=S.entradas.filter(e=>e.estado==="cambio").length;
  const celda=(e,c)=>{
    const v=e[c.k]==null?"":e[c.k];
    const esCont0=e.transporte==="Contenedor"||e.unidad==="Contenedor";
    if((c.k==="cantidad"||c.k==="unidad")&&esCont0)
      return c.k==="unidad"?`<span style="font-size:13px;color:var(--suave);padding:0 6px">Completo</span>`:"";
    if(c.tgl) return `<button class="tgl${v?" on":""}" data-tg="${esc(e._id)}|${c.k}">${v?"OK":"—"}</button>`;
    if(c.opc) return `<select class="cel" data-c="${esc(e._id)}|${c.k}">${c.opc.map(o=>`<option ${o===v?"selected":""} value="${esc(o)}">${esc(o||"—")}</option>`).join("")}</select>`;
    if(c.fecha) return `<input class="cel${c.baza?" baza":""}" type="date" data-c="${esc(e._id)}|${c.k}" value="${esc(v)}">`;
    const esCont=e.transporte==="Contenedor"||e.unidad==="Contenedor";
    if((c.k==="cantidad"||c.k==="unidad")&&esCont)
      return c.k==="unidad"?`<span style="font-size:13px;color:var(--suave);padding:0 6px">Completo</span>`:"";
    if(c.k==="cantidad"&&(e.unidad==="Muestra"||e.transporte==="Paquetería")) return "";
    if(c.num) return `<input class="cel${sinCantidad(e)?" vacio-ob":""}" type="number" min="0" data-c="${esc(e._id)}|${c.k}" value="${esc(v)}"
      title="${sinCantidad(e)?"Falta la cantidad":""}">`;
    return `<input class="cel${c.ob&&!v?" vacio-ob":""}" data-c="${esc(e._id)}|${c.k}" value="${esc(v)}">`;
  };
  $("#app").innerHTML=`
    <div class="fila-ctl">
      <h2 style="margin:0;flex:1">Seguimiento de entradas</h2>
      <button class="btn ent" id="cNueva">＋ Nueva fila</button>
      <button class="btn sec" id="cBaj">⬇ Descargar Excel</button>
      <label class="btn sec" style="display:inline-flex;align-items:center">📥 Importar Excel
        <input type="file" id="cXls" accept=".xlsx,.xls" style="display:none"></label>
    </div>
    ${nCamb?`<div class="aviso err">📅 Almacén pide cambiar la fecha de ${nCamb} entrada${nCamb>1?"s":""}.
      <button class="btn nc" id="verResp" style="margin-left:8px;min-height:44px;padding:8px 14px;font-size:15px">Verlas</button></div>`:""}
    <div class="fila-ctl">
      <div class="seg" role="group" aria-label="Qué entradas ver">
        ${[["proximas","Próximas"],["transito","En tránsito"],["respuesta","Almacén pide cambio"],["recibidas","Llegadas"],["todas","Todas"]]
          .map(([k,t])=>`<button data-fc="${k}" aria-pressed="${F===k}">${t}</button>`).join("")}
      </div>
      <input class="t" id="cBus" placeholder="🔍 Buscar proveedor, contenedor, pedido…" value="${esc(S.buscaC||"")}" style="max-width:340px">
      <span class="guardado" id="cOk"></span>
    </div>
    <div class="fila-ctl">
      <div class="seg" role="group" aria-label="Tipo">
        ${TIPOS_FILTRO.map(([k,t,i])=>{ const n=k==="todos"?porAlm.length:(cuentaTipo[k]||0);
          return `<button data-ft="${k}" aria-pressed="${FT===k}">${i?i+" ":""}${t} <span style="opacity:.6">${n}</span></button>`; }).join("")}
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:700;font-size:16px">Almacén
        <select class="t" id="cAlm" style="width:auto;min-width:170px">
          <option value="todos" ${FA==="todos"?"selected":""}>Todos (${porTipo.length})</option>
          ${almacenes().map(a=>`<option value="${esc(a)}" ${FA===a?"selected":""}>${esc(a)} (${cuentaAlm[a]||0})</option>`).join("")}
        </select></label>
      ${FA!=="todos"||FT!=="todos"?`<button class="btn sec" id="cLimpia" style="min-height:48px;padding:8px 14px;font-size:15px">Quitar filtros</button>`:""}
    </div>
    <p class="nota">Para cambiar un dato, escribe directamente en la celda: se guarda solo. O pulsa ✏️ para abrir la ficha entera,
      y 🗑 para eliminarla. Si cambias la fecha de <b>llegada</b>, almacén recibe un aviso y tiene que aceptarla.</p>
    ${l.length?`<div class="hoja-cal"><table>
      <thead><tr>${VIS.slice(0,NPRIM).map(c=>`<th style="min-width:${c.w}px">${c.t}</th>`).join("")}<th style="min-width:190px">Respuesta de almacén</th>
        <th style="min-width:92px"></th>
        ${VIS.slice(NPRIM).map(c=>`<th style="min-width:${c.w}px">${c.t}</th>`).join("")}</tr></thead>
      <tbody>${l.map(e=>`<tr class="${e.estado==="recibida"?"llegada":e.fecha&&e.fecha<=sumaDias(HOY,2)&&e.fecha>=HOY?"baza-hoy":""}">
        ${VIS.slice(0,NPRIM).map(c=>`<td>${celda(e,c)}</td>`).join("")}
        <td><button class="tgl" data-ent="${esc(e._id)}" style="border:0;background:none;padding:0;text-align:left">${etiquetaEstado(e)}</button></td>
        <td style="white-space:nowrap"><button class="tgl" data-edit="${esc(e._id)}" title="Editar" aria-label="Editar">✏️</button>
          <button class="tgl" data-borra="${esc(e._id)}" title="Eliminar" aria-label="Eliminar" style="color:var(--nc)">🗑</button></td>
        ${VIS.slice(NPRIM).map(c=>`<td>${celda(e,c)}</td>`).join("")}
        <td><button class="tgl" data-borra="${esc(e._id)}" title="Eliminar esta llegada" aria-label="Eliminar"
          style="color:var(--nc);border-color:#F1C6C3">🗑</button></td>
      </tr>`).join("")}</tbody></table></div>`
      :`<div class="vacio">No hay entradas en esta lista. Añade una con «＋ Nueva fila».</div>`}`;
  document.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{ S.filtroC=b.dataset.fc; pintarCompras(); });
  document.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{ S.filtroTipo=b.dataset.ft; pintarCompras(); });
  $("#cAlm").onchange=(ev)=>{ S.filtroAlm=ev.target.value; pintarCompras(); };
  const cl=$("#cLimpia"); if(cl) cl.onclick=()=>{ S.filtroTipo="todos"; S.filtroAlm="todos"; pintarCompras(); };
  $("#cBus").oninput=(ev)=>{ S.buscaC=ev.target.value; clearTimeout(S._tb); S._tb=setTimeout(()=>{ pintarCompras(); const i=$("#cBus"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },350); };
  $("#cNueva").onclick=()=>nuevaFila();
  $("#cBaj").onclick=()=>descargarExcel(l);
  $("#cXls").onchange=(ev)=>{ const f=ev.target.files[0]; if(f) importarContenedores(f); ev.target.value=""; };
  const vr=$("#verResp"); if(vr) vr.onclick=()=>{ S.filtroC="respuesta"; pintarCompras(); };
  document.querySelectorAll("[data-c]").forEach(inp=>inp.onchange=()=>{ const [id,k]=inp.dataset.c.split("|"); guardarCampo(id,k,inp.value.trim()); });
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ const e=S.entradas.find(x=>x._id===b.dataset.edit); if(e) nuevaFila(e); });
  document.querySelectorAll("[data-borra]").forEach(b=>b.onclick=()=>{ const e=S.entradas.find(x=>x._id===b.dataset.borra); if(e) eliminarEntrada(e); });
  document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{ const [id,k]=b.dataset.tg.split("|");
    const e=S.entradas.find(x=>x._id===id); guardarCampo(id,k,e&&e[k]?"":"OK"); });
  document.querySelectorAll("[data-borra]").forEach(b=>b.onclick=()=>borrarEntrada(b.dataset.borra));
  enlazarEntradas();
}

// (sep 2026) Eliminar una llegada. No se borra de verdad: queda marcada como
// eliminada con quién y cuándo, para que se pueda rastrear. Si almacén la tenía
// en su plan, se le avisa.
async function borrarEntrada(id){
  const e=S.entradas.find(x=>x._id===id); if(!e) return;
  if(!confirm("¿Eliminar la llegada de "+(e.proveedor||"sin proveedor")+" "+(e.ref||"")+"?"
    +(e.fecha&&e.estado!=="recibida"?"\n\nAlmacén la tiene en su plan para el "+fLarga(e.fecha)+" y recibirá un aviso.":""))) return;
  try{
    await guardarEntrada({...e,eliminada:true,eliminadaPor:QUIEN,eliminadaEl:new Date().toISOString()},"Eliminada por compras");
    S.entradas=S.entradas.filter(x=>x._id!==id);
    aviso("Llegada eliminada","ok"); pintarCompras();
    if(e.fecha&&e.estado!=="recibida"&&e.proveedor) avisar("almacen","🗑️ Anulada la llegada de "+e.proveedor+" "+(e.ref||""),
      `<p>Compras ha anulado esta llegada, que estaba prevista para el ${fLarga(e.fecha)}. Ya no aparece en tu plan.</p>`,e);
  }catch(x){ aviso("No se ha podido eliminar: "+x.message,"err"); }
}

// Guardar una celda. La fecha de Baza es la única que pone en marcha a almacén.
async function guardarCampo(id,k,v){
  const e=S.entradas.find(x=>x._id===id); if(!e) return;
  const ant=e[k]==null?"":String(e[k]);
  if(ant===v) return;
  if(k==="unidad"&&v&&!["Muestra","Camión completo"].includes(v)&&!e.cantidad) aviso("Pon también la cantidad","err");
  const y={...e}; y[k]=k==="cantidad"?(v===""?"":Number(v)):k==="almacen"?(String(v).toUpperCase()||"BAZA"):v;
  if(k==="tipoContenedor"){
    const tc=tipoContenedor(v);
    y.tipoTxt=v==="Camión"?"":tc.txt; y.frio=!!tc.frio; y.transporte=tc.transporte;
    if(y.transporte==="Contenedor"){ y.unidad="Contenedor"; y.cantidad=1; }
    else if(y.unidad==="Contenedor"){ y.unidad=""; y.cantidad=""; }
    if(y.transporte==="Avión"&&y.unidad==="Camión completo") y.unidad="";
  }
  const nom=(COLS.find(c=>c.k===k)||{}).t||k;
  let evento="Compras cambia "+nom+": «"+(ant||"—")+"» → «"+(v||"—")+"»";
  if(k==="fecha"){ y.fechaAnterior=ant; y.estado="pendiente"; y.propuesta="";
    evento="Compras cambia la llegada a Baza: "+(ant?fLarga(ant):"sin fecha")+" → "+(v?fLarga(v):"sin fecha"); }
  try{
    await guardarEntrada(y,evento);
    const ok=$("#cOk"); if(ok){ ok.textContent="✓ Guardado "+nom; setTimeout(()=>{ if(ok) ok.textContent=""; },2500); }
    if(["fecha","tipoContenedor","cantidad","unidad"].includes(k)) pintarCompras();
    if(k==="fecha"&&y.proveedor) avisar("almacen",
      (ant?"📅 Cambio de fecha: ":"🚚 Nueva llegada: ")+y.proveedor+" "+(y.ref||"")+(v?" → "+fLarga(v):" queda sin fecha"),
      `<p>Compras ha ${ant?"cambiado":"puesto"} la llegada a Baza${ant?" (antes: "+fLarga(ant)+")":""}.</p>
       <p>${v?"Acéptala o pide otra fecha según tu carga, desde el plan de almacén.":"Te avisaremos cuando haya fecha."}</p>`,y);
  }catch(x){ aviso("No se ha podido guardar: "+x.message,"err"); }
}

        estado:"pendiente",creadoPor:QUIEN,creadoEl:new Date().toISOString(),historial:[]};

      try{ await guardarEntrada(y,"Alta ("+contenidoEnt(y)+", "+medioEnt(y).toLowerCase()+")"+(y.fecha?" con llegada a Baza el "+fLarga(y.fecha):" sin fecha de Baza")); }
      catch(e){ aviso("No se ha podido guardar: "+e.message,"err"); $("#nOk").disabled=false; $("#nOk").textContent="Dar de alta"; return; }
      $("#capa").innerHTML=""; aviso("Llegada dada de alta","ok");

      const i=document.querySelector(`[data-c="${y._id}|proveedor"]`);
      if(i){ i.scrollIntoView({block:"center"}); const tr=i.closest("tr"); if(tr){ tr.style.outline="3px solid var(--ent)"; setTimeout(()=>{ tr.style.outline=""; },2500); } }
      if(y.fecha) avisar("almacen","🚚 Nueva llegada: "+y.proveedor+" "+(y.ref||"")+" el "+fLarga(y.fecha),
        `<p>Compras ha dado de alta una llegada: <b>${esc(contenidoEnt(y))}</b> (${esc(medioEnt(y).toLowerCase())}).
         Acéptala o pide otra fecha desde el plan de almacén.</p>`,y);

      if(f&&!f.value&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))) f.focus(); },50);
  };
  pinta();
}

// Eliminar: no se borra el documento, se marca como eliminado con el motivo.
// Así queda rastro de que existió y de quién lo quitó.
async function eliminarEntrada(e){
  const m=prompt("¿Por qué se elimina la llegada de "+e.proveedor+" "+(e.ref||"")+"?\n(duplicada, anulada por el proveedor…)","");
  if(m===null) return;
  const y={...e,eliminada:true,eliminadaPor:QUIEN,eliminadaEl:new Date().toISOString(),motivoEliminacion:m};
  try{ await guardarEntrada(y,"Eliminada"+(m?": "+m:"")); }
  catch(x){ aviso("No se ha podido eliminar: "+x.message,"err"); return; }
  S.entradas=S.entradas.filter(z=>z._id!==e._id);
  $("#capa").innerHTML=""; aviso("Llegada eliminada","ok"); pintar();
  if(e.fecha&&e.estado!=="recibida") avisar("almacen","🗑️ Anulada la llegada de "+e.proveedor+" "+(e.ref||""),
    `<p>Compras ha anulado esta llegada, prevista para el ${fLarga(e.fecha)}${m?": "+esc(m):""}.</p>`,e);
}

function descargarExcel(l){
  if(typeof XLSX==="undefined"){ aviso("No se ha podido cargar el generador de Excel","err"); return; }
  const filas=l.map(e=>{ const o={}; COLS.forEach(c=>{
      let v=e[c.k]==null?"":e[c.k];
      if(c.fecha&&v){ const d=deISO(v); v=d; }
      o[c.t]=v; });
    o["Respuesta de almacén"]=!e.fecha?"Por confirmar":(ESTADO[e.estado]||{}).t||""; return o; });
  const ws=XLSX.utils.json_to_sheet(filas,{cellDates:true,dateNF:"dd/mm/yyyy"});
  ws["!cols"]=COLS.map(c=>({wch:Math.round(c.w/8)})).concat([{wch:22}]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Llegadas");
  XLSX.writeFile(wb,"llegadas_"+HOY+".xlsx");
}

        <input class="t" id="fFec" type="date" value="${esc(x.fecha)}" style="max-width:220px" ${porConf?"disabled":""}>
        <button class="chip" id="fConf" aria-pressed="${porConf}">Por confirmar</button>
      </div>
      ${!nueva&&e.fecha?`<p class="nota" style="margin-top:6px">Si cambias la fecha, almacén recibe un correo y tiene que aceptarla.</p>`:""}
      <label class="c" for="fNot">Notas</label>
      <textarea class="t" id="fNot" rows="2">${esc(x.notas)}</textarea>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        ${!nueva?`<button class="btn nc" id="fDel">Eliminar</button>`:""}
        <button class="btn sec" id="fCan" style="flex:1">Cancelar</button>
        <button class="btn ent" id="fOk" style="flex:2">${nueva?"Dar de alta":"Guardar cambios"}</button>
      </div></div></div>`;
    const lee=()=>{ x.proveedor=$("#fProv").value.trim(); x.ref=$("#fRef").value.trim(); x.pedido=$("#fPed").value.trim();
      x.almacen=$("#fAlm").value.trim(); x.cantidad=$("#fCant").value; x.notas=$("#fNot").value.trim();
      x.fecha=porConf?"":$("#fFec").value; };
    document.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{ lee(); x.unidad=b.dataset.un; pinta(); });
    document.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{ lee(); x.transporte=b.dataset.tr; pinta(); });
    $("#fConf").onclick=()=>{ lee(); porConf=!porConf; if(porConf) x.fecha=""; pinta(); };
    $("#fCan").onclick=()=>{ $("#capa").innerHTML=""; };
    const del=$("#fDel"); if(del) del.onclick=async()=>{
      if(!confirm("¿Eliminar la entrada de "+e.proveedor+"? Queda guardada en el historial como eliminada.")) return;
      const y={...e,eliminada:true}; try{ await guardarEntrada(y,"Eliminada por compras");
        S.entradas=S.entradas.filter(z=>z._id!==e._id); $("#capa").innerHTML=""; pintar(); }catch(er){ aviso(er.message,"err"); }
      avisar("almacen","🗑️ Anulada la entrada de "+e.proveedor,`<p>Compras ha anulado esta entrada.</p>`,e);
    };
    $("#fOk").onclick=async()=>{
      lee();
      if(!x.proveedor){ aviso("Falta el proveedor","err"); return; }
      if(!porConf&&!x.fecha){ aviso("Pon la fecha o marca «Por confirmar»","err"); return; }
      x.cantidad=x.cantidad===""?"":Number(x.cantidad);
      if(nueva){
        const y={...x,_id:"ent_"+Date.now()+"_"+Math.random().toString(36).slice(2,5),estado:"pendiente",
          creadoPor:QUIEN,creadoEl:new Date().toISOString(),historial:[]};
        try{ await guardarEntrada(y,"Alta"+(y.fecha?" para el "+fLarga(y.fecha):" sin fecha"));
          $("#capa").innerHTML=""; aviso("Entrada dada de alta","ok"); pintar();
          if(y.fecha) avisar("almacen","🚚 Nueva entrada: "+y.proveedor+" el "+fLarga(y.fecha),
            `<p>Compras ha dado de alta una entrada. Acéptala o pide otra fecha desde el plan de almacén.</p>`,y);
        }catch(er){ aviso("No se ha podido guardar: "+er.message,"err"); }
        return;
      }
      const cambioFecha=x.fecha!==e.fecha;
      const y={...e,...x};
      const cambios=[];
      ["proveedor","ref","pedido","cantidad","unidad","transporte","almacen","notas"].forEach(k=>{
        if(String(e[k]??"")!==String(x[k]??"")) cambios.push(k+": "+(e[k]||"—")+" → "+(x[k]||"—")); });
      if(cambioFecha){ y.fechaAnterior=e.fecha; y.estado=y.fecha?"pendiente":"pendiente"; y.propuesta="";
        cambios.unshift("fecha: "+(e.fecha?fLarga(e.fecha):"por confirmar")+" → "+(x.fecha?fLarga(x.fecha):"por confirmar")); }
      if(!cambios.length){ $("#capa").innerHTML=""; return; }
      try{ await guardarEntrada(y,"Compras cambia "+cambios.join(" · ")); $("#capa").innerHTML=""; aviso("Guardado","ok"); pintar(); }
      catch(er){ aviso("No se ha podido guardar: "+er.message,"err"); return; }
      if(cambioFecha) avisar("almacen","📅 Cambio de fecha: "+y.proveedor+(y.fecha?" pasa al "+fLarga(y.fecha):" queda por confirmar"),
        `<p>Compras ha cambiado la fecha de esta entrada${e.fecha?" (antes: "+fLarga(e.fecha)+")":""}.</p>
         <p>${y.fecha?"Acéptala o pide otra fecha según tu carga, desde el plan de almacén.":"Te avisaremos cuando haya fecha."}</p>`,y);
    };
  };
  pinta();
}

// Pegar la tabla desde Excel: Proveedor, Ref, Pedido, Barriles/Pallets, Llegada, Almacén
function pegarExcel(){
  $("#capa").innerHTML=`<div class="velo" id="velo"><div class="hoja" role="dialog" aria-modal="true">
    <h3>📋 Pegar desde Excel</h3>
    <p class="nota">Copia las filas de tu tabla (sin la cabecera) y pégalas aquí. Columnas en este orden:
      proveedor, referencia, pedido, barriles/pallets, llegada, almacén.</p>
    <textarea class="t" id="pgTxt" rows="8" placeholder="GLOBAL	GLO121	260000205	80 BARRILES	03/09/2026	BAZA"></textarea>
    <div id="pgPrev"></div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn sec" id="pgCan" style="flex:1">Cancelar</button>
      <button class="btn ent" id="pgOk" style="flex:2" disabled>Dar de alta</button></div>
  </div></div>`;
  let filas=[];
  const leer=()=>{
    filas=$("#pgTxt").value.split(/\r?\n/).map(l=>l.split("\t").map(c=>c.trim())).filter(c=>c.length>=2&&c[0]&&!/^proveedor$/i.test(c[0]))
      .map(c=>{
        const cant=String(c[3]||""), m=cant.match(/(\d+[\d.,]*)\s*([a-záéíóú]+)?/i);
        const u=/pall/i.test(cant)?"Pallets":/caja/i.test(cant)?"Cajas":/contened/i.test(cant)?"Contenedor":"Barriles";
        return {proveedor:c[0],ref:c[1]||"",pedido:c[2]||"",cantidad:m?Number(m[1].replace(/\./g,"").replace(",",".")):"",
          unidad:u,fecha:/confirm/i.test(c[4]||"")?"":aISO(c[4]),almacen:c[5]||"BAZA",transporte:"Camión",notas:""};
      });
    const yaHay=new Set(S.entradas.map(e=>String(e.pedido||"")+"|"+String(e.ref||"")));
    $("#pgPrev").innerHTML=filas.length?`<div class="lista" style="margin-top:12px">${filas.map(f=>`<div class="fe" style="grid-template-columns:1.4fr .8fr 1fr 1fr 1.2fr">
      <span class="p">${esc(f.proveedor)}</span><span>${esc(f.ref)}</span><span>${esc(f.pedido)}</span>
      <span>${f.cantidad?n0(f.cantidad)+" "+f.unidad.toLowerCase():"Por confirmar"}</span>
      <span>${f.fecha?fLarga(f.fecha):"Por confirmar"}${yaHay.has(f.pedido+"|"+f.ref)?" · <b style='color:var(--amb)'>ya existe</b>":""}</span></div>`).join("")}</div>`:"";
    $("#pgOk").disabled=!filas.length; $("#pgOk").textContent=filas.length?"Dar de alta "+filas.length:"Dar de alta";
  };
  $("#pgTxt").oninput=leer;
  $("#pgCan").onclick=()=>{ $("#capa").innerHTML=""; };
  $("#pgOk").onclick=async()=>{
    const yaHay=new Set(S.entradas.map(e=>String(e.pedido||"")+"|"+String(e.ref||"")));
    const nuevas=filas.filter(f=>!yaHay.has(f.pedido+"|"+f.ref));
    $("#pgOk").disabled=true; $("#pgOk").textContent="Guardando…";
    let ok=0;
    for(const f of nuevas){
      const y={...f,_id:"ent_"+Date.now()+"_"+Math.random().toString(36).slice(2,5),estado:"pendiente",
        creadoPor:QUIEN,creadoEl:new Date().toISOString(),historial:[]};
      try{ await guardarEntrada(y,"Alta desde Excel"); ok++; }catch(e){}
    }
    $("#capa").innerHTML=""; aviso(ok+" entradas dadas de alta"+(filas.length>nuevas.length?" ("+(filas.length-nuevas.length)+" ya existían)":""),"ok");
    pintar();
    if(ok) avisar("almacen","🚚 "+ok+" entradas nuevas en el plan",
      `<p>Compras ha dado de alta ${ok} entradas. Revísalas y acepta las fechas desde el plan de almacén.</p>`,null);
  };
}

// ═══════════════════════════════════════════════════════════════════════
// Importar el Excel de seguimiento de contenedores de Compras
// ═══════════════════════════════════════════════════════════════════════
// Columnas: Proveedor · Nº FRA/LOTE · Notes · Order# · Nº CONTENEDOR · NAVIERA ·
// Situación · TRANSITARIO · INCOTERM · CONTENEDOR · DOC · FECHA (salida) ·
// PUERTO (origen) · FECHA (llegada a puerto) · PUERTO DESTINO · BAZA (llegada al
// almacén) · INV FROM FORWARDERS · Invoice. Se localizan por el nombre de la
// cabecera, así que da igual si Compras añade o mueve columnas.
function cantidadDeNotas(t){
  const m=String(t||"").match(/(\d+[.,]?\d*)\s*(barril|barrel|pallet|palet|caja|box|bulto|kg|kilo)/i);
  if(!m) return null;
  const k=m[2].toLowerCase();
  const u=/barril|barrel/.test(k)?"Barriles":/caja|box/.test(k)?"Cajas":/bulto/.test(k)?"Bultos":/kg|kilo/.test(k)?"Kg":"Pallets";
  return {cantidad:Number(String(m[1]).replace(",",".")),unidad:u};
}
function fechaExcel(v){
  if(v==null||v==="") return "";
  if(v instanceof Date) return iso(v);
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*864e5)); return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  return aISO(v);
}
function tipoContenedor(t){
  const s=String(t||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s/g,"");
  if(!s) return {tipo:"",transporte:"Contenedor",txt:""};
  // Nacional e intracomunitario viene por carretera; las muestras, por paquetería
  if(/CAMION|TRUCK|CARRETERA/.test(s)) return {tipo:"Camión",transporte:"Camión",txt:"Camión"};
  if(/MUESTRA|SAMPLE|PAQUET|COURIER/.test(s)) return {tipo:"Muestra",transporte:"Paquetería",txt:"Muestra"};
  if(/AIR/.test(s)) return {tipo:"AIR",transporte:"Avión",txt:"Aéreo"};
  const pies=(s.match(/(\d{2})'/)||[])[1]||"";
  const frio=/RF|REEF/.test(s);
  return {tipo:s,transporte:"Contenedor",txt:(pies?pies+"' ":"")+(frio?"frigorífico":"seco"),frio};
}
async function importarContenedores(file){
  let filas=[];
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const m=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    const norm=(x)=>String(x||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9#]/g,"");
    const iCab=m.findIndex(r=>r.some(c=>norm(c)==="PROVEEDOR"));
    if(iCab<0) throw new Error("No encuentro la fila de cabecera (la que empieza por «Proveedor»)");
    const cab=m[iCab].map(norm);
    const col=(nombre,n=0)=>{ let v=-1,k=0; cab.forEach((c,i)=>{ if(v<0&&c===nombre){ if(k===n) v=i; k++; } }); return v; };
    // Acepta los nombres del Excel original de compras y los del Excel que
    // descarga el propio sistema, para poder bajarlo y volver a subirlo.
    const una=(...ns)=>{ for(const n of ns){ const [nom,k]=Array.isArray(n)?n:[n,0]; const i=col(nom,k); if(i>=0) return i; } return -1; };
    const C={prov:una("PROVEEDOR"),ref:una("NFRALOTE"),notas:una("NOTES","NOTAS"),pedido:una("ORDER#"),cont:una("NCONTENEDOR"),
      naviera:una("NAVIERA"),sit:una("SITUACION"),transit:una("TRANSITARIO"),inco:una("INCOTERM"),tipo:una("CONTENEDOR"),
      fSal:una(["FECHA",0],"SALIDA"),pOri:una("PUERTO","PUERTOORIGEN"),fPuerto:una(["FECHA",1],"LLEGADAPUERTO"),
      pDes:una("PUERTODESTINO"),baza:una("BAZA","LLEGADA"),importe:una("INVOICE"),
      doc:una("DOC"),inv:una("INVFROMFORWARDERS","INVFORWARDERS"),cant:una("CANTIDAD"),uni:una("UNIDAD"),alm:una("ALMACEN")};
    if(C.prov<0||C.baza<0) throw new Error("Faltan las columnas «Proveedor» o la de la llegada («BAZA» o «Llegada»)");
    const g=(r,i)=>i<0?"":r[i];
    for(let i=iCab+1;i<m.length;i++){
      const r=m[i]; const prov=String(g(r,C.prov)||"").trim();
      if(!prov) continue;
      const tc=tipoContenedor(g(r,C.tipo));
      filas.push({proveedor:prov,ref:String(g(r,C.ref)||"").trim(),notas:String(g(r,C.notas)||"").trim(),
        pedido:String(g(r,C.pedido)||"").trim(),contenedor:String(g(r,C.cont)||"").trim(),
        naviera:String(g(r,C.naviera)||"").trim(),situacion:String(g(r,C.sit)||"").trim(),
        transitario:String(g(r,C.transit)||"").trim(),incoterm:String(g(r,C.inco)||"").trim(),
        tipoContenedor:tc.tipo,tipoTxt:tc.txt,frio:!!tc.frio,transporte:tc.transporte,
        fechaSalida:fechaExcel(g(r,C.fSal)),puertoOrigen:String(g(r,C.pOri)||"").trim(),
        fechaPuerto:fechaExcel(g(r,C.fPuerto)),puertoDestino:String(g(r,C.pDes)||"").trim(),
        fecha:fechaExcel(g(r,C.baza)),importeFactura:String(g(r,C.importe)||"").replace(/\s+/g," ").trim(),
        doc:/ok/i.test(String(g(r,C.doc)||""))?"OK":"",invForwarders:/ok/i.test(String(g(r,C.inv)||""))?"OK":"",
        almacen:String(g(r,C.alm)||"BAZA").trim().toUpperCase()||"BAZA",cantidad:1,unidad:"Contenedor"});
      // Cuánto llega: de su columna si la hay (Excel descargado del sistema), si
      // no de las notas ("CONSIGNA-16 BARRILES"). Si no aparece, queda vacío.
      const ul=filas[filas.length-1];
      const cc=Number(String(g(r,C.cant)||"").replace(",",".")), uu=String(g(r,C.uni)||"").trim();
      const dn=cantidadDeNotas(ul.notas);
      ul.cantidad=cc?cc:(dn?dn.cantidad:""); ul.unidad=cc&&UNIDADES_CONT.includes(uu)?uu:(dn?dn.unidad:"");
      if(ul.transporte==="Contenedor"){ ul.cantidad=1; ul.unidad="Contenedor"; }
      else if(ul.transporte==="Paquetería"&&!cc&&!dn){ ul.cantidad=1; ul.unidad="Muestra"; }
    }
  }catch(e){ aviso("No se ha podido leer el Excel: "+e.message,"err"); return; }

  // Qué hacer con cada fila: nueva, cambia la fecha de Baza, cambia otro dato, igual,
  // o ya pasada (llegó hace más de una semana: es historial, no se importa)
  const clave=(x)=>String(x.pedido||"")+"|"+String(x.ref||"").toUpperCase();
  const porClave={}; S.entradas.forEach(e=>porClave[clave(e)]=e);
  const limite=sumaDias(HOY,-7);
  const plan={nuevas:[],fecha:[],datos:[],iguales:0,pasadas:0,historico:[]};
  const CAMPOS=["proveedor","contenedor","naviera","situacion","transitario","incoterm","tipoContenedor",
    "fechaSalida","puertoOrigen","fechaPuerto","puertoDestino","notas","importeFactura","doc","invForwarders","cantidad","unidad","almacen"];
  filas.forEach(f=>{
    const e=porClave[clave(f)];
    // Sin fecha de Baza manda la de llegada a puerto: si fue hace tiempo, ya llegó
    const ref=f.fecha||f.fechaPuerto;
    if(!e){ if(ref&&ref<limite){ plan.pasadas++; plan.historico.push(f); return; } plan.nuevas.push(f); return; }
    if(String(e.fecha||"")!==String(f.fecha||"")){ plan.fecha.push({e,f}); return; }
    if(CAMPOS.some(k=>String(e[k]??"")!==String(f[k]??""))){ plan.datos.push({e,f}); return; }
    plan.iguales++;
  });

  const fila=(f,extra)=>`<div class="fe" style="grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1.6fr)">
    <span class="p">${f.frio?"❄️":f.transporte==="Avión"?"✈️":"🚢"} ${esc(f.proveedor)}</span><span>${esc(f.ref)}</span>
    <span>${esc(f.tipoTxt||"")}</span><span>${extra}</span></div>`;
  $("#capa").innerHTML=`<div class="velo" id="velo"><div class="hoja" role="dialog" aria-modal="true" style="max-width:900px">
    <h3>📥 ${esc(file.name)}</h3>
    <p class="nota">${filas.length} filas leídas · ${plan.iguales} sin cambios · ${plan.pasadas} ya llegadas hace más de una semana</p>
    ${plan.historico.length?`<label style="display:flex;gap:10px;align-items:center;font-size:16px;margin:6px 0 4px;cursor:pointer">
      <input type="checkbox" id="imHist" style="width:24px;height:24px"> Importar también las ${plan.historico.length} ya llegadas, como histórico
      (quedan como «Recibida» y no se avisa a almacén)</label>`:""}
    ${plan.nuevas.length?`<h3 style="font-size:18px;margin-top:14px">Nuevas · ${plan.nuevas.length}</h3>
      <div class="lista">${plan.nuevas.map(f=>fila(f,f.fecha?"Baza "+DCORTO[deISO(f.fecha).getDay()]+" "+fCorta(f.fecha):"Sin fecha de Baza")).join("")}</div>`:""}
    ${plan.fecha.length?`<h3 style="font-size:18px;margin-top:14px;color:var(--nc)">Cambia la llegada a Baza · ${plan.fecha.length}</h3>
      <p class="nota">Almacén recibirá un aviso y tendrá que aceptar la nueva fecha.</p>
      <div class="lista">${plan.fecha.map(({e,f})=>fila(f,(e.fecha?fCorta(e.fecha):"sin fecha")+" → <b>"+(f.fecha?fCorta(f.fecha):"sin fecha")+"</b>")).join("")}</div>`:""}
    ${plan.datos.length?`<h3 style="font-size:18px;margin-top:14px">Se actualizan otros datos · ${plan.datos.length}</h3>
      <div class="lista">${plan.datos.map(({f})=>fila(f,"naviera, puertos, situación…")).join("")}</div>`:""}
    ${!plan.nuevas.length&&!plan.fecha.length&&!plan.datos.length?`<div class="aviso ok">Todo está al día: no hay nada que cambiar.</div>`:""}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn sec" id="imCan" style="flex:1">Cancelar</button>
      <button class="btn ent" id="imOk" style="flex:2" ${plan.nuevas.length||plan.fecha.length||plan.datos.length||plan.historico.length?"":"disabled"}>Aplicar</button></div>
  </div></div>`;
  $("#imCan").onclick=()=>{ $("#capa").innerHTML=""; };
  $("#imOk").onclick=async()=>{
    const conHist=$("#imHist")&&$("#imHist").checked;
    const b=$("#imOk"); b.disabled=true; b.textContent="Guardando…";
    let ok=0; const cambiosFecha=[];
    if(conHist) for(const f of plan.historico){
      const y={...f,_id:"ent_"+Date.now()+"_"+Math.random().toString(36).slice(2,5),estado:"recibida",
        creadoPor:QUIEN,creadoEl:new Date().toISOString(),historial:[]};
      try{ await guardarEntrada(y,"Histórico importado del Excel de contenedores"); ok++; }catch(e){}
    }
    for(const f of plan.nuevas){
      const y={...f,_id:"ent_"+Date.now()+"_"+Math.random().toString(36).slice(2,5),estado:"pendiente",
        creadoPor:QUIEN,creadoEl:new Date().toISOString(),historial:[]};
      try{ await guardarEntrada(y,"Alta desde el Excel de contenedores"); ok++; }catch(e){}
    }
    for(const {e,f} of plan.fecha){
      const y={...e,...f,fechaAnterior:e.fecha,estado:"pendiente",propuesta:""};
      try{ await guardarEntrada(y,"Excel de contenedores: llegada a Baza "+(e.fecha?fLarga(e.fecha):"sin fecha")+" → "+(f.fecha?fLarga(f.fecha):"sin fecha")); ok++;
        cambiosFecha.push(y); }catch(x){}
    }
    for(const {e,f} of plan.datos){
      const y={...e,...f,estado:e.estado};
      try{ await guardarEntrada(y,"Excel de contenedores: datos actualizados"); ok++; }catch(x){}
    }
    $("#capa").innerHTML=""; aviso(ok+" entradas guardadas","ok"); pintar();
    if(plan.nuevas.length||cambiosFecha.length){
      const lis=[...plan.nuevas.filter(f=>f.fecha).map(f=>`<li><b>${esc(f.proveedor)}</b> ${esc(f.ref)} · ${esc(f.tipoTxt)} · llega el ${fLarga(f.fecha)}</li>`),
        ...cambiosFecha.map(y=>`<li><b>${esc(y.proveedor)}</b> ${esc(y.ref)} · ${y.fechaAnterior?fLarga(y.fechaAnterior):"sin fecha"} → <b>${y.fecha?fLarga(y.fecha):"sin fecha"}</b></li>`)];
      if(lis.length) avisar("almacen","📅 Compras ha actualizado las llegadas de contenedores",
        `<p>${plan.nuevas.length?plan.nuevas.length+" entradas nuevas":""}${plan.nuevas.length&&cambiosFecha.length?" y ":""}${cambiosFecha.length?cambiosFecha.length+" cambios de fecha":""}.
         Revísalas y acepta o pide otra fecha desde el plan de almacén:</p><ul>${lis.join("")}</ul>`,null);
    }
  };
}
