  .mp-rama{margin:0 0 11px;font-size:10.5px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:#8A8078}
  .mp-b{padding:2px 0}
  .mp-dest{opacity:1}
  .mp-t{margin:0 0 9px;font-size:13px;font-weight:700;color:#2B2622}
  .mp-g{display:flex;gap:22px;margin-bottom:10px}
  .mp-k b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;color:#2B2622}
  .mp-k span{display:block;font-size:11px;color:#8A8078;margin-top:2px}
  .mp-k i{font-style:normal;font-weight:700}
  .mp-l{display:flex;flex-wrap:wrap;gap:5px 16px;font-size:11.5px;color:#8A8078;
    margin-bottom:5px}
  .mp-l b{font-size:13px;font-weight:800;color:#2B2622}
  .mp-e{display:inline-block;min-width:30px;font-weight:800;font-size:10px;

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:'Inter',sans-serif;background:#F7F5F2;color:#1A1816;height:100%;overflow:hidden;}
:root{--bg:#F7F5F2;--white:#fff;--text:#1A1816;--muted:#8A8078;--border:#E8E3DC;--accent:#C4501A;--accent-bg:#FDF1EC;}
input,button,select{font-family:inherit;}
#app{height:100%;display:flex;flex-direction:column;}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;}
.screen.active{display:flex;}

/* ── ENTRY ── */
#entry{align-items:center;justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#entry>*:first-child{margin-top:auto;}
#entry>*:last-child{margin-bottom:auto;padding-bottom:24px;}
.entry-logo{font-size:2.2rem;font-weight:800;letter-spacing:.06em;margin-bottom:6px;text-align:center;}
.entry-logo span{color:var(--accent);}
.entry-tag{font-size:.82rem;color:var(--muted);margin-bottom:36px;letter-spacing:.05em;text-align:center;}
.entry-cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;padding:0 24px;}
.entry-card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:20px 22px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:border-color .15s;}
.entry-card:active,.entry-card:hover{border-color:var(--accent);}
.entry-card-icon{font-size:1.5rem;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.entry-card-title{font-size:.98rem;font-weight:700;margin-bottom:2px;}
.entry-card-sub{font-size:.76rem;color:var(--muted);}
.entry-admin{margin-top:20px;background:none;border:none;color:var(--muted);font-size:.75rem;cursor:pointer;font-family:inherit;letter-spacing:.04em;}
.entry-admin:hover{color:var(--accent);}

/* ── LOGIN ── */
#login-screen{flex-direction:column;}
.login-header{padding:16px 20px 10px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;gap:12;flex-shrink:0;}
.login-back{background:none;border:none;color:var(--accent);font-size:.9rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;}
.login-title{font-size:1rem;font-weight:700;}
.login-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px 24px;gap:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}
.login-body>*:first-child{margin-top:auto;}
.login-body>*:last-child{margin-bottom:auto;padding-bottom:24px;}
.login-inp{width:100%;max-width:300px;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;font-family:inherit;outline:none;background:var(--white);color:var(--text);}
.login-inp:focus{border-color:var(--accent);}
.login-btn{width:100%;max-width:300px;padding:13px;background:var(--accent);color:white;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;}
.login-btn:disabled{background:#D5CEC5;cursor:default;}
.login-err{color:#DC2626;font-size:.82rem;display:none;}

/* ── HUB ── */
#hub{flex-direction:column;}
.hub-header{background:var(--white);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hub-logo{font-size:1rem;font-weight:700;}
.hub-logo span{color:var(--accent);}
.hub-user{font-size:.82rem;color:var(--muted);}
.hub-logout{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 12px;color:var(--muted);font-size:.75rem;cursor:pointer;font-family:inherit;}
.hub-logout:hover{border-color:var(--accent);color:var(--accent);}
.hub-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}
.hub-label{margin-top:auto;}
.hub-list{margin-bottom:auto;padding-bottom:24px;}
.hub-label{font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
.hub-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;}
.hub-item{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .15s;}
.hub-item:hover{border-color:var(--item-color,var(--accent));}
.hub-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.hub-item-title{font-size:.96rem;font-weight:700;margin-bottom:2px;}
.hub-item-sub{font-size:.75rem;color:var(--muted);}
.hub-chevron{color:var(--muted);flex-shrink:0;}

/* ── MODULE FRAME ── */
#module-frame{background:#fff;}
.frame-bar{background:#1A1816;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.frame-back{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:8px 14px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.frame-title{color:#fff;font-size:14px;font-weight:800;flex:1;}
.frame-sub{color:rgba(255,255,255,.4);font-size:10px;}
#module-iframe{flex:1;border:none;width:100%;height:0;min-height:0;display:block;}

/* ── ADMIN ── */
#admin-screen{flex-direction:column;}
.admin-topbar{background:#1A1816;color:white;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.admin-back{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:5px;font-family:inherit;}
.admin-title{flex:1;font-size:1rem;font-weight:700;}
.admin-fb{font-size:.72rem;}
.admin-tabs{display:flex;background:#1A1816;border-bottom:2px solid #333;flex-shrink:0;}
.admin-tab{flex:1;padding:10px 4px;text-align:center;font-size:.72rem;font-weight:600;background:none;border:none;cursor:pointer;font-family:inherit;color:rgba(255,255,255,.5);border-bottom:2px solid transparent;margin-bottom:-2px;}
.admin-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.admin-body{flex:1;overflow-y:auto;padding:14px;}
.user-card{background:var(--white);border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.user-card-head{padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;}
.user-avatar{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;color:white;}
.user-name{font-size:.9rem;font-weight:700;}
.user-role{font-size:.72rem;color:var(--muted);margin-top:2px;}
.user-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.badge-sm{font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em;}
.user-body{border-top:1px solid var(--border);padding:14px;display:none;flex-direction:column;gap:14px;}
.user-body.open{display:flex;}
.field-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;font-weight:700;}
.field-val{display:flex;gap:8px;align-items:center;}
.field-code{flex:1;padding:9px 12px;background:var(--white);border:1px solid var(--border);border-radius:7px;font-size:.88rem;font-family:monospace;color:var(--text);font-weight:700;}
.field-dots{flex:1;padding:9px 12px;background:var(--white);border:1px solid var(--border);border-radius:7px;font-size:.88rem;color:var(--muted);letter-spacing:.2em;}
.edit-btn{padding:8px 12px;background:none;border:1px solid var(--border);border-radius:7px;font-size:.78rem;cursor:pointer;color:var(--muted);font-family:inherit;flex-shrink:0;}
.edit-btn:hover{border-color:var(--accent);color:var(--accent);}
.edit-row{display:flex;gap:6px;}
.edit-inp{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.88rem;background:var(--white);color:var(--text);outline:none;}
.edit-inp:focus{border-color:var(--accent);}
.ok-btn{padding:9px 14px;background:#1A1816;color:white;border:none;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;}
.cancel-btn{padding:9px 10px;background:none;border:1px solid var(--border);border-radius:8px;font-size:.82rem;cursor:pointer;color:var(--muted);font-family:inherit;flex-shrink:0;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg);border-radius:8px;cursor:pointer;}
.toggle-label{font-size:.83rem;}
.toggle-sw{width:44px;height:24px;border-radius:12px;position:relative;flex-shrink:0;transition:background .2s;cursor:pointer;}
.toggle-sw::after{content:'';position:absolute;width:18px;height:18px;background:white;border-radius:50%;top:3px;left:3px;transition:left .2s;}
.toggle-sw.on{background:#2E6B42;}
.toggle-sw.on::after{left:23px;}
.toggle-sw.off{background:#ddd;}
.agent-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;border:1.5px solid var(--border);transition:all .15s;margin-bottom:5px;}
.agent-row.on{background:#EDF4F0;border-color:#2E6B42;}
.section-check{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid var(--border);margin-bottom:4px;transition:all .12s;}
.section-check.on{background:#EDF4F0;border-color:#2E6B42;}
.check-box{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.7rem;}
.check-box.on{background:#2E6B42;border-color:#2E6B42;color:white;}
.del-btn{width:100%;padding:9px;background:none;border:1.5px solid #DC2626;border-radius:8px;color:#DC2626;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;}
.new-user-form{background:var(--white);border:1.5px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:14px;}
.new-btn{padding:7px 14px;background:#1A1816;color:white;border:1px solid #1A1816;border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;}
.new-btn.open{background:var(--bg);color:var(--muted);border-color:var(--border);}
.form-inp{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.85rem;background:#fff;color:var(--text);outline:none;box-sizing:border-box;margin-bottom:10px;}
.form-inp:focus{border-color:var(--accent);}
.mod-toggle{padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.78rem;font-weight:700;font-family:inherit;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);margin:3px;}
.mod-toggle.on{border-color:#2E6B42;background:#EDF4F0;color:#2E6B42;}
.create-btn{width:100%;padding:12px;background:#1A1816;color:white;border:none;border-radius:9px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;}
.err-msg{color:#DC2626;font-size:.78rem;margin:4px 0;}
.section-divider{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--border);margin-bottom:5px;margin-top:10px;}
.fb-status{font-size:.72rem;}
</style>
</head>

        <div class="entry-card-title">Acceso empleados</div>

      </div>
    </div>
  </div>
  <button class="entry-admin" onclick="showLogin()">⚙️ Zona Administrador</button>
</div>

<!-- LOGIN -->
<div id="login-screen" class="screen">
  <div class="login-header">
    <button class="login-back" onclick="showEntry()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Volver
    </button>
    <span class="login-title" style="margin-left:8px">Acceso Portal</span>
  </div>
  <div class="login-body">
    <div style="font-size:2.4rem">🔐</div>
    <div style="font-size:1rem;font-weight:700">Introduce tus credenciales</div>
    <input id="inp-user" class="login-inp" placeholder="Usuario" autocomplete="username"
      onkeydown="if(event.key==='Enter')document.getElementById('inp-pass').focus()"/>
    <input id="inp-pass" class="login-inp" type="password" placeholder="Clave" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()"/>
    <div id="login-err" class="login-err">Usuario o clave incorrectos.</div>
    <button id="login-btn" class="login-btn" onclick="doLogin()">Entrar</button>
    <p id="portal-ver" style="margin-top:14px;font-size:.7rem;color:#A8A199;font-weight:600"></p>
  </div>
</div>

<!-- HUB -->
<div id="hub" class="screen">
  <div class="hub-header">
    <div class="hub-logo">GRUPO <span>CONSOLIDADO</span> <span style="font-size:0.4em;color:#8A8078;font-weight:400;margin-left:8px" id="ver-hub">v3.66.12</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="hub-user" id="hub-user-name"></span>
      <button class="hub-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="hub-body">
    <div class="hub-label">Selecciona un módulo</div>
    <div class="hub-list" id="hub-list"></div>
  </div>
</div>

<!-- MODULE FRAME -->
<div id="module-frame" class="screen">
  <div class="frame-bar">
    <button class="frame-back" onclick="backToHub()">← Hub</button>
    <div>
      <div class="frame-title" id="frame-title">Módulo</div>
      <div class="frame-sub" id="frame-sub"></div>
    </div>
  </div>
  <iframe id="module-iframe" src="about:blank"></iframe>
</div>

<!-- ADMIN -->
<div id="admin-screen" class="screen">
  <div class="admin-topbar">
    <button class="admin-back" onclick="backToHub()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Volver
    </button>
    <span class="admin-title">Zona Administrador</span>
    <span class="admin-fb" style="opacity:.5" id="ver-admin">v3.54.0</span>
    <span class="admin-fb fb-status" id="admin-fb-status"></span>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab active" onclick="setAdminTab('usuarios',this)">Usuarios</button>
    <button class="admin-tab" onclick="setAdminTab('organigrama',this)">🏗 Organigrama</button>
    <button class="admin-tab" onclick="setAdminTab('accesos',this)">Accesos</button>
    <button class="admin-tab" onclick="setAdminTab('descuentos',this)">Descuentos</button>
    <button class="admin-tab" onclick="setAdminTab('datos',this)">Datos</button>
    <button class="admin-tab" onclick="setAdminTab('config',this)">Config</button>
    <button class="admin-tab" onclick="setAdminTab('tarifas',this)">💰 Tarifas</button>
    <button class="admin-tab" onclick="setAdminTab('backup',this)">💾 Backup</button>
  </div>
  <div class="admin-body" id="admin-body"></div>
</div>

</div><!-- /app -->

// ── 🔐 Hash SHA-256 para contraseñas (nunca guardar claves en claro) ──
async function sha256Hex(str){
  try{
    if(!window.crypto||!crypto.subtle) return null; // requiere HTTPS
    var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return ("0"+b.toString(16)).slice(-2);}).join("");
  }catch(e){return null;}
}
// Comprueba credenciales: primero hash, luego clave legada en claro (Firestore antiguo)
function matchCredencial(uu,p,pHash){
  if(uu.passHash&&pHash) return uu.passHash===pHash;
  if(uu.pass) return uu.pass===p;
  return false;
}
// Migración automática: si el usuario aún tiene clave en claro, convertirla a hash
function migrarUsuarioHash(found,pHash){
  try{
    if(found&&found.pass&&pHash){
      delete found.pass;
      found.passHash=pHash;
      var users=loadUsers().map(function(x){return x.id===found.id?found:x;});
      saveUsersLocal(users);
      saveUserFB(found); // PATCH completo → elimina el campo "pass" de Firestore
    }
  }catch(e){}
}

function _sv(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==="boolean")return{booleanValue:v};
  if(typeof v==="number")return{doubleValue:v};
  if(typeof v==="string")return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(_sv)}};
  return{stringValue:JSON.stringify(v)};
}
function _dv(v){
  if(v.stringValue!==undefined)return v.stringValue;
  if(v.integerValue!==undefined)return parseInt(v.integerValue);
  if(v.doubleValue!==undefined)return v.doubleValue;
  if(v.booleanValue!==undefined)return v.booleanValue;
  if(v.nullValue!==undefined)return null;
  if(v.arrayValue)return(v.arrayValue.values||[]).map(_dv);
  return null;
}
function _fromFB(doc){
  if(!doc.fields)return null;
  var o={id:doc.name.split("/").pop()};
  Object.keys(doc.fields).forEach(function(k){o[k]=_dv(doc.fields[k]);});
  return o;
}
function _toFB(u){
  var f={};
  Object.keys(u).forEach(function(k){f[k]=_sv(u[k]);});
  return{fields:f};
}
function saveUserFB(u){
  // A su coleccion de origen: escribir siempre en portal_users habria creado
  // un duplicado de cada ficha que vive en usuarios.
  var col=u._col||"portal_users";
  var limpio={};
  Object.keys(u).forEach(function(k){ if(k!=="_col") limpio[k]=u[k]; });
  fetch(PORTAL_FB+"/"+col+"/"+encodeURIComponent(u.id),{method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(_toFB(limpio))}).catch(function(){});
}

}
async function loadUsersFB(){
  // Las mismas personas viven en dos colecciones: portal_users, que es donde
  // escribe esta pantalla, y usuarios, donde las crea estructura_equipos.html.
  // El CRM lee las dos, asi que si aqui solo se leia una, habia comerciales
  // que contaban en el dashboard y no se podian editar (BARBELANNE y otros).
  // Cada ficha recuerda su coleccion en _col para poder guardarla en su sitio.
  async function leer(col){
    try{
      var r=await fetch(PORTAL_FB+"/"+col+"?pageSize=300");
      if(!r.ok) return [];
      var d=await r.json();
      return (d.documents||[]).map(_fromFB).filter(Boolean)
        .map(function(u){ u._col=col; return u; });
    }catch(e){ return []; }
  }
  try{
    var dos=await Promise.all([leer("portal_users"),leer("usuarios")]);
    var fb=dos[0].slice();
    var vistos={};
    fb.forEach(function(u){ vistos[String(u.id).toLowerCase()]=true; });
    // Los de usuarios solo entran si no estan ya en portal_users, que manda.
    dos[1].forEach(function(u){
      if(!vistos[String(u.id).toLowerCase()]){ fb.push(u); vistos[String(u.id).toLowerCase()]=true; }
    });
    if(fb.length){
      var ids=new Set(fb.map(function(u){return u.id;}));
      var merged=fb.concat(USERS_DEFAULT.filter(function(u){return !ids.has(u.id);}));
      saveUsersLocal(merged);
      return merged;
    }
  }catch(e){}
  return loadUsers();
}

function orgActivos(){return DEPTOS.filter(function(d){return d.activo!==false;}).sort(function(a,b){return(a.orden||0)-(b.orden||0);});}

function rolCRMde(p){
  // (v3.66.12) Normaliza SIEMPRE, también el rol guardado en la ficha
  // (hay fichas antiguas con "crm_agente", "comercial", etc.)
  function norm(r,tip){
    r=String(r||"").toLowerCase();
    if(r==="crm_agente"||r==="comercial"||r==="vendedor")return"agente";
    if(r==="crm_jefe")return tip?"tipologia":"jefe";
    if(r==="crm_director")return"director";
    return r;
  }
  var f=ORG_FICHAS[p.orgId]||{};
  if(f.rol)return norm(f.rol,f.tipologia||p.tipologia);
  return norm(p.rol,p.tipologia)||"agente";
}
// (v5.3) Departamento inferido cuando no hay asignación manual:
// comerciales y jefes de equipo → la rama de SU equipo (WIKUK, INTERKEY,
// FRANCIA, DISTRIBUIDOR...) bajo Ventas; responsables con tipología → el
// departamento que gestiona esa tipología.
function orgDeptoInferido(u,f){
  if(f.departamentoId)return f.departamentoId;
  var rol=String(f.rol||u.rol||"").toLowerCase();
  var tip=String(f.tipologia||u.tipologia||"").toLowerCase();
  if(tip){
    var dT=orgActivos().find(function(d){return(d.tipologias||[]).indexOf(tip)>=0;});
    if(dT)return dT.id;
    // (v3.66.12) La tipología suele llamarse como el departamento: casar
    // también por id o nombre (deptos creados a mano sin lista de tipologías)
    var _n=function(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");};
    dT=orgActivos().find(function(d){return d.id===tip||_n(d.nombre)===_n(tip);});
    if(dT)return dT.id;
  }
  // (v3.66.12) El EQUIPO basta por sí solo: quien tiene equipo comercial va a
  // su rama, tenga el rol que tenga la cuenta (muchas guardan roles genéricos
  // tipo "user" y antes se quedaban "sin ubicar" injustamente).
  var eq=String(u.equipo||f.equipo||"").toUpperCase().trim();
  if(eq){
    var dE=orgActivos().find(function(d){return String(d.equipo||"").toUpperCase()===eq;});
    if(dE)return dE.id;
  }
  var esComercial=rol.indexOf("agente")>=0||rol==="comercial"||rol==="vendedor";
  var esJefeEq=(rol==="crm_jefe"||rol==="jefe")&&!tip;
  if(esComercial||esJefeEq){
    // Comercial sin equipo asignado: caer en un depto genérico si existiera
    return orgDeptoDe("comercial")?"comercial":"";
  }
  // (v3.66.12) Dirección al departamento Dirección
  if(rol==="ceo"||rol==="director"||rol==="crm_director")return orgDeptoDe("direccion")?"direccion":"";
  return "";
}

  });
  Object.keys(ORG_FICHAS).forEach(function(id){
    var f=ORG_FICHAS[id];
    if(!f.nombre&&!f.rol)return;
    if(f.duplicadaDe||f.activo===false||f._legacy)return;
    var claves=orgClavesDe(f);
    if(yaVisto(claves))return;
    marcar(claves);
    out.push({orgId:id,nombre:f.nombre||id,icon:f.icon||"👤",rol:f.rol||"",
      tipologia:f.tipologia||"",equipo:f.equipo||"",
      departamentoId:orgDeptoInferido({},f),depManual:!!f.departamentoId,
      reportaA:f.reportaA||"",pestanasOcultas:f.pestanasOcultas||[],pestanasExtra:f.pestanasExtra||[]});
  });
  return out;
}
function orgPersona(orgId,_prof){
  // (v3.66.12) Resolución robusta: id exacto → claves (usuario/vendedor/
  // nombre) → y si apunta a una cuenta UNIFICADA, seguir hasta el titular.
  if(!orgId||(_prof||0)>4)return null;
  var K=String(orgId).toUpperCase();
  var ps=orgPersonas();
  var p=ps.find(function(x){return x.orgId===orgId;});
  if(p)return p;
  p=ps.find(function(x){
    return [x.orgId,x.nombre,x.username,x.catalogoVendedor,x.crmId]
      .filter(Boolean).some(function(k){return String(k).toUpperCase()===K;});
  });
  if(p)return p;
  var uni=(adminUsers||[]).find(function(u){
    return u.duplicadaDe&&[u.id,u.crmId,u.username,u.nombre]
      .filter(Boolean).some(function(k){return String(k).toUpperCase()===K;});
  });
  if(uni)return orgPersona(uni.duplicadaDe,(_prof||0)+1);
  return null;
}
function orgRespsDe(depId){var d=orgDeptoDe(depId);if(!d)return[];
  return (d.responsableIds||[]).map(orgPersona).filter(Boolean);}
function orgMiembrosDe(depId){var d=orgDeptoDe(depId);if(!d)return[];
  var r={};(d.responsableIds||[]).forEach(function(x){r[x]=1;});
  return orgPersonas().filter(function(p){return p.departamentoId===depId&&!r[p.orgId];});}
function orgSuperioresDe(p){
  if(p.reportaA){var e=orgPersona(p.reportaA);if(e)return[e];}
  var misDeps=orgActivos().filter(function(d){return(d.responsableIds||[]).indexOf(p.orgId)>=0;});
  var sup=[];
  // Escala por la cadena de padres hasta encontrar responsables
  function subiendo(depId){
    var d=orgDeptoDe(depId),n=0;
    while(d&&n<30){
      var r=orgRespsDe(d.id).filter(function(u){return u.orgId!==p.orgId;});
      if(r.length>0)return r;
      d=d.padre?orgDeptoDe(d.padre):null;n++;
    }
    return[];
  }
  if(misDeps.length>0){
    // Es responsable → escala desde el PADRE de sus departamentos
    misDeps.forEach(function(d){
      if(d.padre)subiendo(d.padre).forEach(function(u){if(sup.indexOf(u)<0)sup.push(u);});
    });
    if(sup.length>0)return sup;
  }else if(p.departamentoId){
    // Es miembro → responsables de su depto, o del primer ancestro que los tenga
    sup=subiendo(p.departamentoId);
    if(sup.length>0)return sup;
  }
  var ceo=orgPersona("ceo");return ceo&&ceo.orgId!==p.orgId?[ceo]:[];
}

function doLogin(){
  var u=document.getElementById('inp-user').value.trim().toLowerCase();
  var p=document.getElementById('inp-pass').value.trim();
  var btn=document.getElementById('login-btn');
  var err=document.getElementById('login-err');
  btn.textContent='Verificando...';btn.disabled=true;err.style.display='none';
  function buscar(users,pHash){
    for(var i=0;i<users.length;i++){
      var uu=users[i];
      if((uu.id===u||(uu.username||'').toLowerCase()===u||uu.nombre.toLowerCase()===u)&&matchCredencial(uu,p,pHash)){
        if(uu.bloqueado){showLoginError('Usuario bloqueado. Contacta con el administrador.');return;}
        return uu;
      }
    }
    return null;
  }
  function finalizar(found,pHash){
    btn.textContent='Entrar';btn.disabled=false;
    if(found){
      migrarUsuarioHash(found,pHash);
      currentUser=found;
      document.getElementById('inp-user').value='';
      document.getElementById('inp-pass').value='';
      if(found.accesos.length===1&&found.accesos[0]==='rrhh'){
        openModule('rrhh');
      } else {
        showHub();
      }
    } else {
      err.style.display='block';
    }
  }
  sha256Hex(p).then(function(pHash){
    // (v3.39.98) Siempre verificar contra Firebase (no cache local)
    loadUsersFB().then(function(users){
      finalizar(buscar(users,pHash),pHash);
    }).catch(function(){
      // Si Firebase falla, usar cache local como fallback
      finalizar(buscar(loadUsers(),pHash),pHash);
    });
  });
}

var LIMITES_DTO_DEFAULT_PORTAL = { agente: 4, jefe: 10, director: 15 };
var _configDtoPortal = null;

function _dvPortal(v){
  if(!v) return null;
  if(v.doubleValue !== undefined) return parseFloat(v.doubleValue);
  if(v.integerValue !== undefined) return parseInt(v.integerValue);
  return null;
}
function _svPortal(val){
  if(typeof val === "number") return Number.isInteger(val) ? {integerValue: val} : {doubleValue: val};
  if(typeof val === "string") return {stringValue: val};
  if(val === null) return {nullValue: null};
  if(typeof val === "object" && !Array.isArray(val)){
    var fields = {};
    Object.keys(val).forEach(function(k){ fields[k] = _svPortal(val[k]); });
    return {mapValue: {fields: fields}};
  }
  return {stringValue: String(val)};
}

function cargarDescuentosPortal(){
  fetch(PORTAL_FB + "/configuracion/general").then(function(r){
    if(!r.ok) throw new Error("not_found");
    return r.json();
  }).then(function(d){
    var f = (d && d.fields) || {};
    var lim = f.limites_dto && f.limites_dto.mapValue && f.limites_dto.mapValue.fields;
    if(lim){
      _configDtoPortal = {
        agente:   _dvPortal(lim.agente)   || LIMITES_DTO_DEFAULT_PORTAL.agente,
        jefe:     _dvPortal(lim.jefe)     || LIMITES_DTO_DEFAULT_PORTAL.jefe,
        director: _dvPortal(lim.director) || LIMITES_DTO_DEFAULT_PORTAL.director,
      };
    } else {
      _configDtoPortal = Object.assign({}, LIMITES_DTO_DEFAULT_PORTAL);
    }
    rellenarInputsDto();
  }).catch(function(){
    _configDtoPortal = Object.assign({}, LIMITES_DTO_DEFAULT_PORTAL);
    rellenarInputsDto();
  });
}

function rellenarInputsDto(){
  if(!_configDtoPortal) return;
  var iAg = document.getElementById('dto-agente');
  var iJf = document.getElementById('dto-jefe');
  var iDr = document.getElementById('dto-director');
  if(iAg) iAg.value = _configDtoPortal.agente;
  if(iJf) iJf.value = _configDtoPortal.jefe;
  if(iDr) iDr.value = _configDtoPortal.director;
}

function guardarDescuentosPortal(){
  var ag = parseFloat(document.getElementById('dto-agente').value);
  var jf = parseFloat(document.getElementById('dto-jefe').value);
  var dr = parseFloat(document.getElementById('dto-director').value);
  if(isNaN(ag) || isNaN(jf) || isNaN(dr) || ag < 0 || jf < 0 || dr < 0){
    alert("Indica valores numéricos válidos (no negativos)");
    return;
  }
  if(!(ag <= jf && jf <= dr)){
    alert("Los límites deben ser crecientes:\nVendedor (" + ag + ") ≤ Responsable (" + jf + ") ≤ Jefe Ventas (" + dr + ")");
    return;
  }
  var btn = document.getElementById('btn-guardar-dto');
  if(btn){ btn.disabled = true; btn.textContent = "Guardando..."; }
  var datos = {
    limites_dto: { agente: ag, jefe: jf, director: dr },
    actualizadoEn: new Date().toISOString(),
    actualizadoPor: "portal_admin"
  };
  var fields = {};
  Object.keys(datos).forEach(function(k){ fields[k] = _svPortal(datos[k]); });
  var qs = "?updateMask.fieldPaths=limites_dto&updateMask.fieldPaths=actualizadoEn&updateMask.fieldPaths=actualizadoPor";
  fetch(PORTAL_FB + "/configuracion/general" + qs, {
    method: "PATCH",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({fields: fields})
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    _configDtoPortal = { agente: ag, jefe: jf, director: dr };
    if(btn){ btn.disabled = false; btn.textContent = "💾 Guardar límites"; }
    var msg = document.getElementById('dto-msg');
    if(msg){ msg.textContent = "✅ Guardado correctamente"; msg.style.color = "#16A34A"; setTimeout(function(){msg.textContent="";}, 3000); }
  }).catch(function(e){
    if(btn){ btn.disabled = false; btn.textContent = "💾 Guardar límites"; }
    var msg = document.getElementById('dto-msg');
    if(msg){ msg.textContent = "❌ Error: " + e.message; msg.style.color = "#DC2626"; }
  });
}

function orgAbreDep(id){var d=orgDeptoDe(id);if(!d)return;

  orgState.editUser=Object.assign({},p,{pestanasOcultas:(p.pestanasOcultas||[]).slice(),pestanasExtra:(p.pestanasExtra||[]).slice()});renderAdminBody();}
function orgCierra(){orgState={editDep:null,nuevoDep:null,editUser:null};renderAdminBody();}
function orgCapturaDep(){var d=orgState.editDep||orgState.nuevoDep;if(!d)return;
  var n=document.getElementById('org-dep-nombre'),i=document.getElementById('org-dep-icon'),
      pa=document.getElementById('org-dep-padre'),eq=document.getElementById('org-dep-equipo');
  if(n)d.nombre=n.value;if(i)d.icon=i.value;if(pa)d.padre=pa.value||null;
  if(eq)d.equipo=eq.value.toUpperCase().trim()||null;}
function orgCapturaUser(){var p=orgState.editUser;if(!p)return;
  var r=document.getElementById('org-user-rol'),t=document.getElementById('org-user-tip'),
      d=document.getElementById('org-user-dep'),re=document.getElementById('org-user-rep');
  if(r)p._rolEdit=r.value;if(t)p.tipologia=t.value;if(d)p.departamentoId=d.value;if(re)p.reportaA=re.value;}
function orgToggleResp(uid){orgCapturaDep();var d=orgState.editDep;if(!d)return;
  var i=(d.responsableIds||[]).indexOf(uid);
  if(i>=0)d.responsableIds.splice(i,1);else d.responsableIds.push(uid);renderAdminBody();}
function orgColorDep(c){orgCapturaDep();var d=orgState.editDep||orgState.nuevoDep;if(!d)return;d.color=c;renderAdminBody();}
function orgCambiaRol(v){orgCapturaUser();if(orgState.editUser)orgState.editUser._rolEdit=v;renderAdminBody();}
function orgTogglePest(id){orgCapturaUser();var p=orgState.editUser;if(!p)return;
  var rolCRM=p._rolEdit||rolCRMde(p);var base=(MENU_ROL_P[rolCRM]||MENU_ROL_P.agente).indexOf(id)>=0;
  var arr=base?p.pestanasOcultas:p.pestanasExtra;
  var i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);renderAdminBody();}
function orgGuardaDep(){orgCapturaDep();var d=orgState.editDep;if(!d)return;
  if(!d.nombre||!d.nombre.trim()){alert("El nombre es obligatorio");return;}
  if(d.padre&&(d.padre===d.id||orgEsDesc(d.padre,d.id))){alert("No puedes colgar un departamento de sí mismo ni de uno de sus sub-departamentos");return;}
  saveDeptoFB(d);orgCierra();}
function orgCreaDep(){orgCapturaDep();var f=orgState.nuevoDep;if(!f)return;
  if(!f.nombre||!f.nombre.trim()){alert("Escribe el nombre del departamento");return;}
  var id=f.nombre.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||("dep_"+Date.now());
  if(orgDeptoDe(id))id=id+"_"+String(Date.now()).slice(-4);
  saveDeptoFB({id:id,nombre:f.nombre.trim(),icon:f.icon||"🏢",color:f.color||"#6366F1",
    padre:f.padre||null,responsableIds:[],tipologias:[],orden:DEPTOS.length,activo:true});
  orgCierra();}
function orgDesactivaDep(){orgCapturaDep();var d=orgState.editDep;if(!d)return;
  if(orgHijos(d.id).length>0){alert("Este departamento tiene sub-departamentos. Muévelos o desactívalos primero.");return;}
  var gente=orgPersonas().filter(function(p){return p.departamentoId===d.id;});
  if(!confirm('¿Desactivar "'+d.nombre+'"?'+(gente.length>0?'\n\n'+gente.length+' persona(s) quedarán sin departamento.':'')))return;
  d.activo=false;saveDeptoFB(d);orgCierra();}
function orgGuardaUser(){orgCapturaUser();var p=orgState.editUser;if(!p)return;
  var rolCRM=p._rolEdit||rolCRMde(p);
  saveFichaCRM(p.orgId,{nombre:p.nombre,icon:p.icon,rol:rolCRM,tipologia:p.tipologia||"",
    equipo:p.equipo||null,departamentoId:p.departamentoId||"",reportaA:p.reportaA||"",
    pestanasOcultas:p.pestanasOcultas||[],pestanasExtra:p.pestanasExtra||[]});
  orgCierra();}

  btn.classList.add('active');

function renderAdmin(){
  document.querySelectorAll('.admin-tab').forEach(function(b,i){
    b.classList.toggle('active',['usuarios','organigrama','accesos','descuentos','datos','config','tarifas','backup'][i]===adminTab);
  });
  renderAdminBody();
}
function renderAdminBody(){
  var body=document.getElementById('admin-body');
  if(adminTab==='usuarios') body.innerHTML=renderUsuarios();
  else if(adminTab==='organigrama') { body.innerHTML=renderOrganigrama(); return; }
  else if(adminTab==='accesos') body.innerHTML=renderAccesos();
  else if(adminTab==='descuentos') { body.innerHTML=renderDescuentos(); cargarDescuentosPortal(); }
  else if(adminTab==='datos') body.innerHTML=renderDatos();
  else if(adminTab==='backup') { body.innerHTML=renderBackup(); initBackup(); }
  else if(adminTab==='tarifas') { body.innerHTML=renderTarifas(); }
  else { body.innerHTML=renderConfig(); cargarNotifConfigAdmin(); cargarManualesAdmin(); }
  attachAdminEvents();
}

function sortedUsers(){
  return ORDEN_USERS.map(function(id){return adminUsers.find(function(u){return u.id===id;});}).filter(Boolean)
    .concat(adminUsers.filter(function(u){return !ORDEN_USERS.includes(u.id);}));
}

function rolLabel(u){
  if(u.id==='ceo'||u.rol==='admin') return 'CEO · Acceso total';
  if(u.id==='dir') return 'Jefe de Ventas';
  var _id=String(u.id||'');
  if(esRol(u,ROLES_JEFE)&&!_id.startsWith('resp_')) return 'Jefe de Equipo';
  if(esRol(u,ROLES_COMERCIAL)) return 'Comercial / Vendedor';
  if(_id.startsWith('resp_')) return 'Responsable de area';
  if(u.rol==='rrhh') return 'Recursos Humanos';
  return u.rol;
}

function unificarDuplicado(uid){
  var info=(window._dupInfo||{})[uid]; if(!info)return;
  var u=adminUsers.find(function(x){return x.id===uid;}); if(!u)return;
  if(!confirm('Unificar: esta cuenta quedará marcada como duplicada de "'+info.titularNombre+'".\nDesaparece del organigrama, avisos y matrices, pero se conserva por si acaso.\n¿Continuar?'))return;
  u.duplicadaDe=info.titularId;
  saveUserFB(u);
  renderAdminBody(); // pasa al grupo "↪️ Cuentas unificadas" del final
}
function ignorarDuplicado(uid){
  var info=(window._dupInfo||{})[uid]; if(!info)return;
  var u=adminUsers.find(function(x){return x.id===uid;}); if(!u)return;
  u.dupIgnorar=(u.dupIgnorar||[]).concat([info.titularId]);
  saveUserFB(u);
  renderAdminBody();
}
function deshacerUnificacion(uid){
  var u=adminUsers.find(function(x){return x.id===uid;}); if(!u)return;
  u.duplicadaDe="";
  saveUserFB(u);
  renderAdminBody();
}
function eliminarDuplicado(uid){
  var u=adminUsers.find(function(x){return x.id===uid;}); if(!u)return;
  var vacia=!u.catalogoVendedor&&!u.email&&!u.crmId;
  var msg=vacia
    ?'Eliminar la cuenta "'+(u.nombre||u.id)+'" (sin vendedor, sin email, sin CRM — parece vacía).\n¿Seguro?'
    :'⚠️ "'+(u.nombre||u.id)+'" TIENE datos ('+[u.catalogoVendedor&&'vendedor',u.email&&'email',u.crmId&&'CRM'].filter(Boolean).join(', ')+').\nSi tiene ventas o actividad, sus registros quedarían huérfanos.\n¿Seguro que quieres ELIMINARLA? (si dudas, usa Unificar)';
  if(!confirm(msg))return;
  deleteUserFB(u.id);
  adminUsers=adminUsers.filter(function(x){return x.id!==uid;});

  renderAdminBody();

// (v3.66.12) Autoubicación MASIVA: para cada suelto con equipo válido, fija en
// su ficha CRM el equipo y un rol comercial. Convierte la inferencia en dato
// guardado — a prueba de versiones y de roles raros.
function autoubicarSueltos(){
  var hechos=0,fallos=0,pend=[];
  adminUsers.forEach(function(u){
    if(u.duplicadaDe||u.rol==='admin')return;
    var orgId=u.crmId||u.id;
    var f=ORG_FICHAS[orgId]||{};
    if(orgDeptoInferido(u,f))return; // ya ubicado
    var eq=String(u.equipo||f.equipo||"").toUpperCase().trim();
    var dE=eq?orgActivos().find(function(d){return String(d.equipo||"").toUpperCase()===eq;}):null;
    if(!dE){pend.push(u.nombre||u.id);return;}
    try{
      saveFichaCRM(orgId,{equipo:dE.equipo,rol:(f.rol&&f.rol!=="user")?f.rol:"agente"});
      hechos++;
    }catch(e){fallos++;}
  });
  renderAdminBody();
  alert("🧹 Autoubicación:\n✅ "+hechos+" colocados en su equipo"
    +(fallos?"\n⚠️ "+fallos+" con error":"")
    +(pend.length?"\n👤 Quedan a mano ("+pend.length+"): "+pend.slice(0,8).join(", ")+(pend.length>8?"…":""):"\n🎉 Sin pendientes"));
}

// (v3.66.12) Ubicación rápida de un usuario suelto en el organigrama
function ubicarUsuario(uid,depId){
  if(!depId)return;
  var u=adminUsers.find(function(x){return x.id===uid;}); if(!u){alert("Usuario no encontrado");return;}
  var dep=orgDeptoDe(depId); if(!dep){alert("Departamento no encontrado");return;}
  var orgId=u.crmId||u.id;
  var fAct=ORG_FICHAS[orgId]||{};
  if(dep.equipo){
    // Rama comercial → equipo en el usuario del portal Y rol comercial en la
    // ficha (sin rol reconocible, el árbol no sabía dónde ponerlo: ese era el fallo)
    u.equipo=dep.equipo;
    saveUserFB(u);
    saveFichaCRM(orgId,{equipo:dep.equipo,rol:fAct.rol&&fAct.rol!=="user"?fAct.rol:"agente"});
  } else {
    saveFichaCRM(orgId,{departamentoId:dep.id,rol:(fAct.rol&&fAct.rol!=="user"&&fAct.rol!=="agente")?fAct.rol:"tipologia"});
  }
  renderAdminBody();
  setTimeout(function(){alert("✅ "+(u.nombre||u.id)+" ubicado en "+(dep.icon||"")+" "+dep.nombre);},60);
}

// (v3.66.12) Detección AUTOMÁTICA de cambios: primero la etiqueta
// <meta name="cambios"> que traen los manuales generados; si no existe,
// se comparan las secciones del contenido nuevo contra el anterior.
function _bloquesManual(html){
  var out={};
  String(html||"").split('<div class="paso"').slice(1).forEach(function(seg){
    var t=/class="t">([^<]{4,90})</.exec(seg);
    if(!t)return;
    var texto=seg.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    out[t[1].trim()]=texto;
  });
  return out;
}
function detectarCambiosManual(viejo,nuevo){
  var meta=/<meta\s+name=["']cambios["']\s+content=["']([^"']+)["']/i.exec(nuevo||"");
  if(meta&&meta[1].trim())return meta[1].trim();
  if(!viejo)return "Primera publicación del manual dentro del CRM.";
  var a=_bloquesManual(viejo),b=_bloquesManual(nuevo);
  var nuevos=[],mods=[],quitados=[];
  Object.keys(b).forEach(function(t){if(!(t in a))nuevos.push(t);else if(a[t]!==b[t])mods.push(t);});
  Object.keys(a).forEach(function(t){if(!(t in b))quitados.push(t);});
  var partes=[];
  if(nuevos.length)partes.push("Nuevo: "+nuevos.slice(0,3).join(" · "));
  if(mods.length)partes.push("Actualizado: "+mods.slice(0,3).join(" · "));
  if(quitados.length)partes.push("Eliminado: "+quitados.slice(0,2).join(" · "));
  return partes.length?partes.join(" — ").slice(0,240):"Contenido revisado y actualizado.";
}

        });

  inp.value="";
}

// ── Códigos de facturación ────────────────────────────────────────────
// Un comercial aparece en los datos con varios codigos segun de donde
// vengan (CRM, ERP, portal). Aqui se registran todos para que sus ventas,
// pedidos y visitas se le atribuyan de verdad.
var CODFAC_CACHE=null;

async function _codfacDatos(){
  if(CODFAC_CACHE) return CODFAC_CACHE;
  var leer=async function(col,campos,max){
    var uso={}, tok=null, v=0;
    try{
      do{
        var r=await fetch(PORTAL_FB+"/"+col+"?pageSize=300"+(tok?"&pageToken="+encodeURIComponent(tok):""));
        if(!r.ok) break;
        var j=await r.json();
        (j.documents||[]).forEach(function(d){
          var f=d.fields||{};
          campos.forEach(function(c){
            var val=f[c]&&(f[c].stringValue||f[c].doubleValue||f[c].integerValue);
            if(!val) return;
            var k=String(val).toUpperCase().trim();
            if(!k) return;
            uso[k]=(uso[k]||0)+1;
          });
        });
        tok=j.nextPageToken||null; v++;
      }while(tok&&v<(max||12));
    }catch(e){}
    return uso;
  };
  var res=await Promise.all([
    leer("visitas",["agente"],12),
    leer("muestras",["agente"],8),
    leer("pbi_pedidos",["agente","vendedor"],8),
    leer("ofertas",["agente"],5),
  ]);
  var total={};
  ["visitas","muestras","pedidos","ofertas"].forEach(function(n,i){
    Object.keys(res[i]).forEach(function(k){
      total[k]=total[k]||{cod:k,n:0,donde:[]};
      total[k].n+=res[i][k];
      total[k].donde.push(n);
    });
  });
  // Quien ya tiene dueño en la tabla de alias
  var conDueno={};
  try{
    var r2=await fetch(PORTAL_FB+"/agentes_alias?pageSize=300");
    if(r2.ok){
      var j2=await r2.json();
      (j2.documents||[]).forEach(function(d){
        var f=d.fields||{};
        var al=(f.alias&&f.alias.stringValue)||decodeURIComponent(d.name.split("/").pop());
        var cn=(f.canonico&&f.canonico.stringValue)||"";
        if(al) conDueno[String(al).toUpperCase()]=cn;
      });
    }
  }catch(e){}
  CODFAC_CACHE={uso:total, conDueno:conDueno};
  return CODFAC_CACHE;
}

function _norm(x){
  return String(x==null?"":x).toUpperCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
}

async function buscarCodigos(u){
  var cont=document.getElementById("codfac-lista-"+u.id);
  if(!cont) return;
  var d=await _codfacDatos();
  var mios=[], libres=[];
  var claves=[u.id,u.crmId,u.username,u.catalogoVendedor,u.grupoAgente,u.nombre]
    .filter(Boolean).map(_norm);

  Object.keys(d.uso).forEach(function(k){
    var reg=d.uso[k];
    var due=d.conDueno[_norm(k)];
    if(due&&claves.indexOf(_norm(due))>=0){ mios.push(reg); return; }
    if(claves.indexOf(_norm(k))>=0){ mios.push(reg); return; }
    // Sin dueño y con datos: candidato a ser suyo
    if(!due&&reg.n>=3) libres.push(reg);
  });
  mios.sort(function(a,b){return b.n-a.n;});
  libres.sort(function(a,b){return b.n-a.n;});

  var h="";
  if(mios.length){
    h+='<div style="margin-bottom:8px">'
      +mios.map(function(m){
        return '<span style="display:inline-block;background:#DCFCE7;color:#0E7C5A;'
          +'border-radius:99px;padding:2px 10px;font-size:.72rem;font-weight:700;'
          +'margin:0 4px 4px 0;font-family:monospace">'+m.cod+' · '+m.n+'</span>';
      }).join("")+'</div>';
  } else {
    // Obligatorio si ya hay datos suyos en el sistema: dejarlo sin asignar
    // significa que sus ventas y visitas no cuentan para nadie.
    var sospecha=libres.filter(function(l){
      return _norm(l.cod).indexOf(_norm(u.nombre||"").slice(0,4))>=0
        || _norm(u.nombre||"").indexOf(_norm(l.cod).slice(0,4))>=0
        || _norm(l.cod)===_norm(u.catalogoVendedor)
        || _norm(l.cod)===_norm(u.username);
    });
    // (v3.66.12) Solo alarma si hay candidatos RECONOCIBLES (que se parecen
    // al nombre/usuario/vendedor). Los códigos numéricos sueltos (1015, 9999…)
    // son series de clientes o documentos, no vendedores — no se pide al
    // admin que adivine.
    if(sospecha.length){
      h+='<div style="background:#FEF2F4;border:1px solid #C2263D;border-radius:8px;'
        +'padding:10px 12px;margin-bottom:8px;font-size:.76rem;color:#C2263D">'
        +'<b>⚠️ Códigos que parecen suyos, sin asignar:</b> '
        +sospecha.map(function(x){return '<b>'+x.cod+'</b> ('+x.n+' docs)';}).join(", ")
        +'</div>';
    } else {
      h+='<div style="font-size:.72rem;color:#8A8078;margin-bottom:6px">'
        +'Sin código propio detectado. Si esta persona no factura con código de vendedor, no hay nada que hacer aquí.</div>';
    }
  }

  // Candidatos mostrados: solo los que se parecen a la persona
  var _norm2=function(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");};
  var candidatos=libres.filter(function(l){
    var c=_norm2(l.cod);
    if(!/[A-Z]/.test(c))return false; // numéricos puros: fuera de la vista normal
    var nn=_norm2(u.nombre).slice(0,4);
    return (nn&&c.indexOf(nn)>=0)||c===_norm2(u.catalogoVendedor)||c===_norm2(u.username)||c===_norm2(u.id);
  });
  var resto=libres.filter(function(l){return candidatos.indexOf(l)<0;});

  if(candidatos.length){
    h+='<div style="font-size:.72rem;color:#8A8078;margin:6px 0 5px">Marca los que sean suyos:</div>'
      +candidatos.slice(0,8).map(function(l){
        return '<label style="display:flex;align-items:center;gap:7px;padding:4px 0;'
          +'font-size:.78rem;cursor:pointer">'
          +'<input type="checkbox" value="'+l.cod+'" '
          +'onchange="marcarCodigo(\''+u.id+'\',this)">'
          +'<code style="font-family:monospace;font-weight:700">'+l.cod+'</code>'
          +'<span style="color:#8A8078">'+l.n+' docs · '+l.donde.join(", ")+'</span>'
          +'</label>';
      }).join("")
      +'<button onclick="guardarCodigos(\''+u.id+'\')" '
      +'style="margin-top:8px;padding:8px 14px;border-radius:8px;border:none;'
      +'background:#1A1816;color:#fff;font-size:.78rem;font-weight:700;'
      +'cursor:pointer">Asignar los marcados</button>';
  }
  if(resto.length){
    h+='<div style="margin-top:8px">'
      +'<a href="javascript:void(0)" onclick="var x=document.getElementById(\'codraro-'+u.id+'\');x.style.display=x.style.display===\'none\'?\'block\':\'none\'" '
      +'style="font-size:.7rem;color:#8A8078;text-decoration:underline">Avanzado: '+resto.length+' códigos huérfanos genéricos (series numéricas, probablemente clientes)</a>'
      +'<div id="codraro-'+u.id+'" style="display:none;margin-top:5px">'
      +resto.slice(0,10).map(function(l){
        return '<label style="display:flex;align-items:center;gap:7px;padding:3px 0;'
          +'font-size:.74rem;cursor:pointer;color:#8A8078">'
          +'<input type="checkbox" value="'+l.cod+'" '
          +'onchange="marcarCodigo(\''+u.id+'\',this)">'
          +'<code style="font-family:monospace">'+l.cod+'</code>'
          +'<span>'+l.n+' docs</span></label>';
      }).join("")
      +'<button onclick="guardarCodigos(\''+u.id+'\')" style="margin-top:6px;padding:6px 12px;border-radius:7px;border:1px solid #E8E3DC;background:#fff;font-size:.72rem;font-weight:700;cursor:pointer">Asignar marcados</button>'
      +'</div></div>';
  }
  if(!candidatos.length&&!resto.length&&mios.length){
    h+='<div style="font-size:.72rem;color:#0E7C5A">Todo asignado.</div>';
  }
  cont.innerHTML=h;
}

var CODFAC_SEL={};
function marcarCodigo(uid,el){
  CODFAC_SEL[uid]=CODFAC_SEL[uid]||{};
  if(el.checked) CODFAC_SEL[uid][el.value]=1;
  else delete CODFAC_SEL[uid][el.value];
}

async function guardarCodigos(uid){
  var sel=Object.keys(CODFAC_SEL[uid]||{});
  if(!sel.length){ alert("No has marcado ningún código."); return; }
  var u=(adminUsers||[]).find(function(x){return x.id===uid;})||{};
  var canon=u.crmId||u.id;
  if(!confirm("Se van a asignar "+sel.length+" código(s) a "+(u.nombre||canon)
    +".\n\nSus documentos pasarán a contar como suyos. ¿Seguimos?")) return;
  for(var i=0;i<sel.length;i++){
    var al=_norm(sel[i]);
    try{
      await fetch(PORTAL_FB+"/agentes_alias/"+encodeURIComponent(al),{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          alias:{stringValue:al}, original:{stringValue:sel[i]},
          canonico:{stringValue:canon},
          nombre:{stringValue:u.nombre||canon},
          equipo:{stringValue:u.equipo||""},
          origen:{stringValue:"panel_admin"},
          actualizado:{stringValue:new Date().toISOString()}
        }})});
    }catch(e){}
  }
  CODFAC_CACHE=null; CODFAC_SEL[uid]={};
  alert("Códigos asignados.");
  buscarCodigos(u);
}

    }).catch(function(){});
  }
  renderAdminBody();
}

function deleteUser(uid){
  // Verificar si tiene datos antes de eliminar
  var colecciones=["visitas","muestras","ofertas","estrategias","incidencias"];
  var checking=Promise.all(colecciones.map(function(col){
    return fetch(PORTAL_FB+"/"+col+"?pageSize=5").then(function(r){return r.json();}).then(function(d){
      if(!d.documents) return 0;
      var count=0;
      d.documents.forEach(function(doc){
        var fields=doc.fields||{};
        var agente=(fields.agente||{}).stringValue||"";
        var autor=(fields.autor||{}).stringValue||"";
        var creadoPor=(fields.creadoPor||{}).stringValue||"";
        if(agente===uid||autor===uid||creadoPor===uid) count++;
      });
      return count;
    }).catch(function(){return 0;});
  }));
  checking.then(function(results){
    var total=results.reduce(function(s,n){return s+n;},0);
    if(total>0){
      alert("⚠️ Este usuario tiene datos asociados (visitas, muestras, ofertas...).\n\nNo se puede eliminar. Usa 'Bloquear' para desactivarlo sin perder sus datos.");
      return;
    }
    if(!window.confirm("¿Eliminar este usuario?\n\nSolo se permite porque NO tiene datos asociados.")) return;
    adminUsers=adminUsers.filter(function(u){return u.id!==uid;});
    saveUsersLocal(adminUsers);deleteUserFB(uid);renderAdminBody();
  });
}
function bloquearUser(uid){
  var u=adminUsers.find(function(u){return u.id===uid;});
  if(!u) return;
  var nuevo=!u.bloqueado;
  if(nuevo&&!window.confirm("¿Bloquear a "+u.nombre+"?\n\nNo podrá acceder al CRM pero sus datos se conservan.")) return;
  updateUser(uid,function(u){u.bloqueado=nuevo;});
  renderAdminBody();
}
function updateUser(uid,fn){
  adminUsers=adminUsers.map(function(u){if(u.id===uid){fn(u);}return u;});
  var u=adminUsers.find(function(u){return u.id===uid;});
  saveUsersLocal(adminUsers);if(u) saveUserFB(u);
}

function createUser(){
  var vendor=(document.getElementById('nf-vendor')||{}).value||'';
  var nombre=(document.getElementById('nf-nombre')||{}).value||'';
  var username=(document.getElementById('nf-username')||{}).value||'';
  var pass=(document.getElementById('nf-pass')||{}).value||'';
  var email=(document.getElementById('nf-email')||{}).value||'';
  var equipo=newForm.equipo||'';
  var tipo=newForm.tipoUsuario||'comercial';
  var err=document.getElementById('nf-err');

  if(!nombre.trim()){if(err)err.textContent='Nombre obligatorio';return;}
  if(!username.trim()){if(err)err.textContent='Usuario obligatorio';return;}
  if(pass.length<4){if(err)err.textContent='Clave min. 4 caracteres';return;}

  var rol='crm_agente';
  var tipologia='';
  var crmId=null;
  var color='#8A8078';
  var icon='👤';

  if(tipo==='comercial'){
    if(!vendor){if(err)err.textContent='Selecciona un vendedor del catálogo';return;}
    if(!equipo){if(err)err.textContent='Selecciona el equipo (WIKUK o INTERKEY)';return;}
    rol='crm_agente';
    color=equipo==='WIKUK'?'#1E5A8A':'#2E6B42';
  } else if(tipo==='jefe'){
    if(!equipo){if(err)err.textContent='Selecciona el equipo';return;}
    rol='crm_jefe';
    color=equipo==='WIKUK'?'#1E5A8A':'#2E6B42';
  } else if(tipo==='responsable'){
    // (v5.2) Responsable con identidad PROPIA: su crmId es su propio usuario,
    // no un perfil resp_* compartido. Al guardar se crea también su ficha en
    // la colección "usuarios" y se le añade como responsable del departamento.
    if(!newForm.deptoId&&!newForm.tipologia){if(err)err.textContent='Selecciona el departamento';return;}
    rol='crm_jefe';
    tipologia=newForm.tipologia||'';
    crmId=null; // se fija más abajo con el username
    var depAlta=(typeof orgDeptoDe==='function')?orgDeptoDe(newForm.deptoId):null;
    icon=depAlta?depAlta.icon:'🏢';
    color='#991B1B';
  } else if(tipo==='operario'){
    // (v5.2) Miembro de departamento: identidad propia, ficha CRM con menú de
    // departamento, NO se añade como responsable — reporta a los responsables.
    if(!newForm.deptoId){if(err)err.textContent='Selecciona el departamento';return;}
    rol='crm_agente'; // acceso básico al hub
    tipologia='';
    crmId=null; // se fija más abajo con el username
    var depOper=(typeof orgDeptoDe==='function')?orgDeptoDe(newForm.deptoId):null;
    icon='👷';
    color=(depOper&&depOper.color)||'#0369A1';
  } else if(tipo==='director'){
    var rolDir=(document.getElementById('nf-rol-dir')||{}).value||'crm_director';
    rol=rolDir;
    icon=rolDir==='ceo'?'👑':'📊';
    color='#7C3AED';
  }

  var un=username.trim().toLowerCase().split(' ').join('');
  if(adminUsers.some(function(u){return u.id===un||u.username===un;})){if(err)err.textContent='Usuario ya existe';return;}
  // (v5.2) Responsable u operario: su identidad CRM es su propio usuario
  if(tipo==='responsable'||tipo==='operario'){crmId=un;}

  var nuevo={id:crmId||('u_'+Date.now()),nombre:nombre.trim(),username:un,rol:rol,
    icon:icon,color:color,email:email,
    equipo:equipo,accesos:newForm.accesos||['crm'],
    crmId:crmId,perfilCRM:crmId,tipologia:tipologia,
    catalogoVendedor:vendor||null,equipoCrm:[],catalogoSecciones:null};
  if((tipo==='responsable'||tipo==='operario')&&newForm.deptoId)nuevo.departamentoId=newForm.deptoId;
  // 🔐 Guardar la clave hasheada, nunca en claro
  sha256Hex(pass).then(function(h){
    if(h){nuevo.passHash=h;} else {nuevo.pass=pass;} // fallback sin crypto
    adminUsers.push(nuevo);saveUsersLocal(adminUsers);saveUserFB(nuevo);
    // (v5.2) Ficha de organización para el CRM + responsable del departamento
    if(tipo==='responsable'&&typeof saveFichaCRM==='function'){
      saveFichaCRM(un,{nombre:nombre.trim(),icon:icon,color:color,rol:'tipologia',
        tipologia:tipologia,departamentoId:newForm.deptoId||'',email:email});
      var depR=(typeof orgDeptoDe==='function')?orgDeptoDe(newForm.deptoId):null;
      if(depR&&(depR.responsableIds||[]).indexOf(un)<0){
        depR.responsableIds=(depR.responsableIds||[]).concat([un]);
        saveDeptoFB(depR);
      }
    }
    // (v5.2) Operario: ficha CRM de miembro — menú de departamento, sin
    // responsabilidad. Su parte semanal irá a los responsables del depto.
    if(tipo==='operario'&&typeof saveFichaCRM==='function'){
      saveFichaCRM(un,{nombre:nombre.trim(),icon:icon,color:color,rol:'tipologia',
        tipologia:'',departamentoId:newForm.deptoId||'',email:email});
    }
    showNewForm=false;newForm={accesos:['crm'],tipoUsuario:'comercial',tipologia:'',crmIdResp:''};renderAdminBody();
  });
}

async function bkFbRead(col){
  var all=[];var nextPage="";
  while(true){
    var url="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents/"+col+"?pageSize=300"+(nextPage?"&pageToken="+nextPage:"");
    var r=await fetch(url);var j=await r.json();
    if(!j.documents)break;
    j.documents.forEach(function(doc){
      var id=doc.name.split("/").pop();var o={id:id};
      if(doc.fields)Object.keys(doc.fields).forEach(function(k){var f=doc.fields[k];
        if(f.stringValue!==undefined)o[k]=f.stringValue;
        else if(f.integerValue!==undefined)o[k]=parseInt(f.integerValue);
        else if(f.doubleValue!==undefined)o[k]=f.doubleValue;
        else if(f.booleanValue!==undefined)o[k]=f.booleanValue;
        else if(f.nullValue!==undefined)o[k]=null;
        else if(f.mapValue)o[k]=bkParseMap(f.mapValue);
        else if(f.arrayValue)o[k]=bkParseArr(f.arrayValue);
        else o[k]=JSON.stringify(f);
      });
      all.push(o);
    });
    if(!j.nextPageToken)break;nextPage=j.nextPageToken;
  }
  return all;
}
function bkParseMap(mv){var o={};if(mv.fields)Object.keys(mv.fields).forEach(function(k){var f=mv.fields[k];if(f.stringValue!==undefined)o[k]=f.stringValue;else if(f.integerValue!==undefined)o[k]=parseInt(f.integerValue);else if(f.doubleValue!==undefined)o[k]=f.doubleValue;else if(f.booleanValue!==undefined)o[k]=f.booleanValue;else if(f.nullValue!==undefined)o[k]=null;else if(f.mapValue)o[k]=bkParseMap(f.mapValue);else if(f.arrayValue)o[k]=bkParseArr(f.arrayValue);else o[k]=JSON.stringify(f);});return o;}
function bkParseArr(av){if(!av.values)return[];return av.values.map(function(f){if(f.stringValue!==undefined)return f.stringValue;if(f.integerValue!==undefined)return parseInt(f.integerValue);if(f.doubleValue!==undefined)return f.doubleValue;if(f.booleanValue!==undefined)return f.booleanValue;if(f.nullValue!==undefined)return null;if(f.mapValue)return bkParseMap(f.mapValue);if(f.arrayValue)return bkParseArr(f.arrayValue);return JSON.stringify(f);});}
function bkToFV(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==="string")return{stringValue:v};if(typeof v==="boolean")return{booleanValue:v};if(typeof v==="number")return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};if(Array.isArray(v))return{arrayValue:{values:v.map(bkToFV)}};if(typeof v==="object"){var fields={};Object.keys(v).forEach(function(k){fields[k]=bkToFV(v[k]);});return{mapValue:{fields:fields}};} return{stringValue:String(v)};}
async function bkFbWrite(col,id,data){var fields={};Object.keys(data).forEach(function(k){if(k==="id")return;fields[k]=bkToFV(data[k]);});await fetch("https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents/"+col+"/"+id+"?updateMask.fieldPaths="+Object.keys(fields).join("&updateMask.fieldPaths="),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:fields})});}

  var blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="backup_crm_"+new Date().toISOString().split("T")[0].replace(/-/g,"")+".json";a.click();
  localStorage.setItem("lastBackup",new Date().toLocaleDateString("es-ES"));
  log.innerHTML+='<span style="color:#2E6B42">\n💾 Descargado ('+Math.round(blob.size/1024)+' KB)</span>\n';
  btn.disabled=false;btn.textContent="💾 Descargar backup completo";
}

function bkHandleFile(file){
  if(!file)return;var reader=new FileReader();
  reader.onload=function(e){
    try{bkImportData=JSON.parse(e.target.result);
      if(!bkImportData.collections){alert("Archivo no válido");bkImportData=null;return;}
      var cols=Object.keys(bkImportData.collections);var td=cols.reduce(function(s,c){return s+(bkImportData.collections[c]||[]).length;},0);
      var meta=bkImportData._meta||{};
      var prev=document.getElementById("bk-import-preview");var btn=document.getElementById("bk-import-btn");
      prev.style.display="block";
      prev.innerHTML='<div style="background:#fff;border:1px solid #F0DDB4;border-radius:10px;padding:12px;margin-bottom:10px">'
        +'<p style="margin:0 0 4px;font-size:12px;font-weight:700;color:#92400E">📋 Contenido del backup</p>'
        +'<p style="margin:0;font-size:11px;color:#8A8078">Fecha: <strong>'+(meta.fechaStr||"?")+'</strong> · '+cols.length+' colecciones · '+td+' documentos</p>'
        +'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">'+cols.map(function(c){return '<span style="background:#FEF9EE;border:1px solid #F0DDB4;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:600;color:#92400E">'+c+' <strong>'+(bkImportData.collections[c]||[]).length+'</strong></span>';}).join("")+'</div></div>';
      btn.style.display="block";
    }catch(err){alert("Error: "+err.message);}
  };reader.readAsText(file);
}

async function bkImport(){
  if(!bkImportData||!bkImportData.collections)return;
  if(!confirm("⚠️ ¿Seguro? Sobreescribirá documentos existentes."))return;
  var btn=document.getElementById("bk-import-btn");var bar=document.getElementById("bk-import-bar");
  var prog=document.getElementById("bk-import-progress");var status=document.getElementById("bk-import-status");
  var log=document.getElementById("bk-import-log");
  btn.disabled=true;btn.textContent="⏳ Restaurando...";prog.style.display="block";log.style.display="block";log.innerHTML="";
  var cols=Object.keys(bkImportData.collections);var totalDocs=cols.reduce(function(s,c){return s+(bkImportData.collections[c]||[]).length;},0);
  var written=0;var errors=0;
  for(var ci=0;ci<cols.length;ci++){
    var col=cols[ci];var docs=bkImportData.collections[col]||[];
    status.textContent=col+" ("+docs.length+")...";log.innerHTML+='<span style="color:#3B82F6">📝 '+col+'...</span>\n';
    for(var di=0;di<docs.length;di++){
      try{await bkFbWrite(col,docs[di].id||col+"_"+di,docs[di]);written++;}catch(e){errors++;}
      if((written+errors)%20===0)bar.style.width=Math.round(((written+errors)/totalDocs)*100)+"%";
    }
    log.innerHTML+='<span style="color:#2E6B42">  ✅ '+col+': '+docs.length+'</span>\n';
  }
  bar.style.width="100%";status.textContent="✅ "+written+" escritos, "+errors+" errores";
  btn.disabled=false;btn.textContent="⚡ Restaurar datos";
}

// Al volver de pedidos.html el portal debe reaparecer con
// los botones. Se llama aqui, al final, no en DOMContentLoaded: el script

/* ── Panel del comercial ── RETIRADO ──────────────────────────────
   Se quitó del hub el 3/8/2026 para verlo más adelante. El código queda
   aquí, sin llamarse desde ningún sitio: para reactivarlo basta con volver
   a poner <div id="mi-panel"></div> en el hub y llamar a pintarMiPanel
   desde showHub. Comparaba al mejor de la rama con uno mismo, en el año y
   en el último mes cerrado. */
if(false){
/* ── Panel del comercial ───────────────────────────────────────────
   Solo para quien vende. Un jefe no lo ve: sus datos son los del equipo
   y ya los tiene en el CRM. Compara al mejor de su rama con uno mismo,
   en el año y en el último mes cerrado. */
(function(){
  var FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
  var ARR=function(s){return String(s||"").toUpperCase().trim();};
  var NUM=function(n){return Number(n)||0;};
  var EUR=function(n){return Math.round(n||0).toLocaleString("es-ES")+" €";};
  var MES=["enero","febrero","marzo","abril","mayo","junio","julio",
           "agosto","septiembre","octubre","noviembre","diciembre"];

  function val(f){
    if(!f) return null;
    if(f.doubleValue!==undefined) return Number(f.doubleValue);
    if(f.integerValue!==undefined) return Number(f.integerValue);
    if(f.stringValue!==undefined) return f.stringValue;
    if(f.booleanValue!==undefined) return f.booleanValue;
    return null;
  }
  function leer(col){
    var todo=[],tok=null,v=0;
    function paso(){
      return fetch(FB+"/"+col+"?pageSize=300"+(tok?"&pageToken="+encodeURIComponent(tok):""))
        .then(function(r){ return r.ok?r.json():{}; })
        .then(function(j){
          (j.documents||[]).forEach(function(d){
            var o={_id:decodeURIComponent(d.name.split("/").pop())};
            for(var k in (d.fields||{})) o[k]=val(d.fields[k]);
            todo.push(o);
          });
          tok=j.nextPageToken||null; v++;
          return (tok&&v<30) ? paso() : todo;
        });
    }
    return paso().catch(function(){ return []; });
  }

  window.pintarMiPanel=function(u){
    var el=document.getElementById("mi-panel");
    if(!el) return;
    el.innerHTML="";
    var rol=String((u&&u.rol)||"").toLowerCase();
    // Jefes, dirección y responsables no lo ven
    if(!u||/jefe|director|ceo|admin|resp/.test(rol)){
      console.log("[panel] no se pinta · rol:",rol); return;
    }
    var clave=ARR(u.grupoAgente||u.catalogoVendedor||u.crmId||u.username);
    if(!clave){ console.log("[panel] sin clave de comercial en la ficha"); return; }
    console.log("[panel] pintando para",clave);

    Promise.all([leer("pbi_resumen_agente"),leer("pbi_ventas_cliente"),
                 leer("pbi_estacionalidad"),leer("muestras"),
                 leer("ofertas"),leer("estrategias"),
                 leer("pbi_perfiles"),leer("portal_users"),leer("usuarios")])
    .then(function(r){
      var res=r[0],cli=r[1],est=r[2],mu=r[3],of=r[4],es=r[5],
          perf=r[6],portal=r[7],usuarios=r[8];

      // La actividad guarda el perfil del CRM (ik4, wk5), no la clave del
      // comercial. Sin traducir, AZARCO salia con 0 muestras teniendo 254.
      var TRAD={};
      perf.forEach(function(p2){ if(p2.agente) TRAD[ARR(p2._id)]=ARR(p2.agente); });
      portal.concat(usuarios).forEach(function(f){
        var d=ARR(f.grupoAgente||f.catalogoVendedor); if(!d) return;
        [f.crmId,f.username,f._id,f.id,f.nombre].forEach(function(c){
          if(c&&!TRAD[ARR(c)]) TRAD[ARR(c)]=d; });
      });
      function agDe(o){
        var v=ARR(o.agente||o.autor||o.comercial);
        return TRAD[v]||v;
      }
      var yo=null;
      for(var i=0;i<res.length;i++) if(ARR(res[i]._id)===clave) yo=res[i];
      if(!yo){ console.log("[panel]",clave,"no está en pbi_resumen_agente"); return; }
      var rama=yo.equipo||"";
      var E={}; est.forEach(function(x){ E[ARR(x.agente||x._id)]=x; });

      // Cartera por comercial
      var cart={};
      cli.forEach(function(c){
        var ok=(c.cuenta!==undefined)?c.cuenta:(!c.intercompany&&!c.fusionadoEn);
        if(!ok) return;
        var a=ARR(c.agenteFinal||c.agente); if(!a) return;
        var g=cart[a]=cart[a]||{rep:0,nue:0,per:0};
        var act=NUM(c.ventasAct),ant=NUM(c.ventasAntYTD);
        if(act>0&&ant>0) g.rep++; else if(act>0) g.nue++; else if(ant>0) g.per++;
      });

      // Actividad: enviadas y aceptadas
      // Cada actividad se cierra bien de una forma distinta: una muestra
      // acaba en pedido, una estrategia en completada.
      var OK={ mu:["pedido","positivo","positiva","ok","aceptada"],
               of:["pedido","aceptada","ok"],
               es:["completada","ok"] };
      // dd/mm/aa, dd/mm/aaaa y sellos con hora
      var CF=["fecha","fechaCreacion","fechaCreacionStr","creadoEl","fechaEnvio","fechaAlta"];
      function fechaDe(o){
        for(var i=0;i<CF.length;i++){
          var v=o[CF[i]]; if(!v) continue;
          var t=String(v), m2=t.match(/^(\d{4})-(\d{2})-(\d{2})/);
          if(m2) return m2[1]+"-"+m2[2];
          m2=t.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
          if(m2){ var an=m2[3].length===2?"20"+m2[3]:m2[3];
            return an+"-"+("0"+m2[2]).slice(-2); }
        }
        return null;
      }
      var HOY=new Date();
      var CLAVE_MES=HOY.getFullYear()+"-"+("0"+HOY.getMonth()).slice(-2);  // mes cerrado
      var ANIO=String(HOY.getFullYear());

      function cuenta(lista,tipo){
        var m={}, buenos=OK[tipo];
        lista.forEach(function(o){
          var a=agDe(o); if(!a) return;
          var g=m[a]=m[a]||{env:0,ok:0,mEnv:0,mOk:0};
          var e=String(o.estado||"").toLowerCase();
          var r=String(o.resultado||"").toLowerCase();
          var bien=buenos.indexOf(e)>=0||buenos.indexOf(r)>=0;
          var f=fechaDe(o);
          // Año en curso
          if(f&&f.slice(0,4)===ANIO){ g.env++; if(bien) g.ok++; }
          // Último mes cerrado
          if(f===CLAVE_MES){ g.mEnv++; if(bien) g.mOk++; }
        });
        return m;
      }
      var cMu=cuenta(mu,"mu"), cOf=cuenta(of,"of"), cEs=cuenta(es,"es");

      var mesCerrado=new Date().getMonth();     // 1-12 del último cerrado
      function datos(a){
        var k=ARR(a._id), c=cart[k]||{rep:0,nue:0,per:0}, e=E[k]||{};
        var act=NUM(a.ventasAct), ant=NUM(a.ventasAntYTD);
        return {
          nom:a.agente||a._id,
          anio:{ v:act, vs: ant?(act-ant)/ant*100:null },
          mes:{ v:NUM(e["act_"+mesCerrado]),
                vs: NUM(e["mes_"+mesCerrado]) ?
                    (NUM(e["act_"+mesCerrado])-NUM(e["mes_"+mesCerrado]))/NUM(e["mes_"+mesCerrado])*100 : null },
          nue:c.nue, per:c.per,
          ret:(c.rep+c.per)?c.rep/(c.rep+c.per)*100:null,
          mu:cMu[k]||{env:0,ok:0,mEnv:0,mOk:0}, of:cOf[k]||{env:0,ok:0,mEnv:0,mOk:0}, es:cEs[k]||{env:0,ok:0,mEnv:0,mOk:0}
        };
      }

      // El mejor de la rama: por cumplimiento sobre su propio año anterior
      var mismos=res.filter(function(a){
        return a._id!=="_TOTAL" && a.equipo===rama && NUM(a.ventasAct)>0; });
      var mejor=null, mejorV=-1e9;
      mismos.forEach(function(a){
        var ant=NUM(a.ventasAntYTD);
        var x = ant ? (NUM(a.ventasAct)-ant)/ant*100 : 0;
        if(x>mejorV){ mejorV=x; mejor=a; }
      });

      var mio=datos(yo);
      var top=mejor?datos(mejor):null;
      var soyElMejor = mejor && ARR(mejor._id)===clave;

      function pc(v){ return v==null?"·":(v>=0?"+":"")+Math.round(v)+"%"; }
      function col(v){ return v==null?"":"color:var(--"+(v>=0?"ok":"mal")+")"; }
      function bloque(d,tit,dest){
        return '<div class="mp-b'+(dest?" mp-dest":"")+'">'
          +'<p class="mp-t">'+tit+'</p>'
          +'<div class="mp-g">'
            +'<div class="mp-k"><b>'+EUR(d.anio.v)+'</b><span>año · <i style="'
              +col(d.anio.vs)+'">'+pc(d.anio.vs)+'</i></span></div>'
            +'<div class="mp-k"><b>'+EUR(d.mes.v)+'</b><span>'+MES[mesCerrado-1]
              +' · <i style="'+col(d.mes.vs)+'">'+pc(d.mes.vs)+'</i></span></div>'
          +'</div>'
          +'<div class="mp-l">'
            +'<span>Nuevos <b style="color:var(--ok)">'+(d.nue||0)+'</b></span>'
            +'<span>Perdidos <b style="color:var(--mal)">'+(d.per||0)+'</b></span>'
            +'<span>Retiene <b>'+(d.ret==null?"·":Math.round(d.ret)+"%")+'</b></span>'
          +'</div>'
          +'<div class="mp-l"><span class="mp-e">Año</span>'
            +'<span>Muestras <b>'+d.mu.env+'</b>·<b style="color:var(--ok)">'+d.mu.ok+'</b></span>'
            +'<span>Ofertas <b>'+d.of.env+'</b>·<b style="color:var(--ok)">'+d.of.ok+'</b></span>'
            +'<span>Estrategias <b>'+d.es.env+'</b>·<b style="color:var(--ok)">'+d.es.ok+'</b></span>'
          +'</div>'
          +'<div class="mp-l"><span class="mp-e">'+MES[mesCerrado-1].slice(0,3)+'</span>'
            +'<span>Muestras <b>'+d.mu.mEnv+'</b>·<b style="color:var(--ok)">'+d.mu.mOk+'</b></span>'
            +'<span>Ofertas <b>'+d.of.mEnv+'</b>·<b style="color:var(--ok)">'+d.of.mOk+'</b></span>'
            +'<span>Estrategias <b>'+d.es.mEnv+'</b>·<b style="color:var(--ok)">'+d.es.mOk+'</b></span>'
          +'</div></div>';
      }

      el.innerHTML='<div class="mp">'
        +'<p class="mp-rama">'+(rama||"Sin equipo")+'</p>'
        +(top&&!soyElMejor ? bloque(top,"El mejor de tu equipo · "+top.nom,true) : "")
        +(top&&!soyElMejor ? '<div class="mp-sep"></div>' : "")
        +bloque(mio, soyElMejor?"Vas primero de tu equipo":"Tus datos", soyElMejor)
        +'</div>';
    });
  };
})();
}


</script>

<script>
// Los crones escriben un latido en pbi_latidos cada vez que corren. Si uno deja
// de hacerlo, nadie se entera hasta que alguien nota los datos viejos. Esto lo
// pone delante, en la primera pantalla que se abre.
(function(){
  var ESPERADO={ full:12, resumen:12, pedidos:24, mesescliente:24,
                 estacionalidad:24, maestro:24 };
  var NOMBRE={ full:"ventas y clientes", resumen:"resumen por comercial",
    pedidos:"pedidos planificados", mesescliente:"desglose mensual",
    estacionalidad:"estacionalidad", maestro:"maestro de clientes" };
  fetch("https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm"
    +"/databases/(default)/documents/pbi_latidos?pageSize=50")
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    if(!j) return;
    var lat={};
    (j.documents||[]).forEach(function(d){
      var o={_id:d.name.split("/").pop()};
      for(var k in (d.fields||{})){
        var f=d.fields[k];
        o[k]= f.stringValue!==undefined ? f.stringValue
            : f.doubleValue!==undefined ? Number(f.doubleValue)
            : f.integerValue!==undefined ? Number(f.integerValue) : null;
      }
      lat[o._id]=o;
    });
    var ahora=Date.now(), malos=[];
    Object.keys(ESPERADO).forEach(function(k){
      var l=lat[k];
      // Sin latido aun no se avisa: acaba de ponerse en marcha
      if(!l||!l.cuando) return;
      var h=(ahora-new Date(l.cuando))/3600000;
      if(h > ESPERADO[k]*2) malos.push(NOMBRE[k]+", hace "+
        (h<48?Math.round(h)+" h":Math.round(h/24)+" días"));
      else if(l.errores) malos.push(NOMBRE[k]+", con errores");
    });
    if(!malos.length) return;
    var d=document.getElementById("avisoSalud");
    // (ago 2026) Iba en position:fixed sobre el top y tapaba la cabecera, con
    // el boton de volver al hub debajo. Ahora ocupa su sitio en el flujo y
    // empuja el contenido, sin esconder nada.
    d.style.cssText="display:flex;align-items:center;gap:10px;"
      +"background:#C2263D;color:#fff;padding:10px 14px;font:600 13px/1.4 "
      +"-apple-system,BlinkMacSystemFont,sans-serif;position:relative;z-index:5";
    d.innerHTML = '<span style="flex:1;min-width:0">'
      + (malos.length===1 ? "Un proceso no está al día" :
         malos.length+" procesos no están al día")
      + ' <span style="font-weight:400;opacity:.85">· '+malos.join(" · ")+'</span></span>'
      + '<a href="/salud.html" style="color:#fff;opacity:.85;flex-shrink:0;'
      + 'text-decoration:underline;font-size:12px">ver ›</a>'
      + '<button aria-label="Cerrar aviso" style="background:none;border:none;'
      + 'color:#fff;opacity:.7;font-size:16px;cursor:pointer;flex-shrink:0;'
      + 'padding:0 2px" onclick="this.parentNode.style.display=\'none\'">✕</button>';
  }).catch(function(){});
})();
</script>
