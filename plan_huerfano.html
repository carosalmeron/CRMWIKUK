<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan semanal huérfano</title>
<style>
 body{font-family:-apple-system,sans-serif;background:#F8FAFC;margin:0;padding:16px;color:#0F172A}
 .card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px;margin-bottom:10px;font-size:13px}
 .warn{border-color:#F59E0B;background:#FFFBEB}
 code{background:#F1F5F9;padding:1px 6px;border-radius:5px}
 h1{font-size:18px}
</style></head>
<body>
<h1>🔎 Planes de la semana 32 (2026)</h1>
<div id="app">Buscando…</div>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.arrayValue!==undefined) return (f.arrayValue.values||[]).map(val);
  return null;
}
async function leer(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<20);
  return t;
}
(async()=>{
  const app=document.getElementById("app");
  try{
    const planes=await leer("planes_semanales");
    const s32=planes.filter(p=>Number(p.semana)===32 && (!p.anio||Number(p.anio)===2026));
    if(s32.length===0){ app.innerHTML="<p>No hay ningún plan guardado para la semana 32.</p>"; return; }
    app.innerHTML = s32.map(p=>`<div class="card ${norm(p._id).indexOf("WK4")<0?"warn":""}">
      <b>${p._id}</b><br>
      agente: <code>${p.agente||"—"}</code> · estado: ${p.estado||"—"} · modo: ${p.modo||"—"}
      · rutaNum: ${p.rutaNum||"—"}<br>
      visitados: ${(p.visitados||[]).length} clientes
    </div>`).join("");
  }catch(e){ app.innerHTML = "Error: "+e.message; }
  function norm(s){return String(s||"").toUpperCase();}
})();
</script>
</body>
</html>
