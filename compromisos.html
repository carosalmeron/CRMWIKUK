<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compromisos de cobro</title>
<!--
  (oct 2026) COMPROMISOS DE COBRO
  El comercial dice qué va a hacer con un cobro y para qué fecha (desde Cobros
  o desde su cierre semanal). Administración de clientes lo ve el día que toca
  al entrar en el portal / CRM, y comprueba:
     ✅ Ha pagado      → se cierra
     ❌ No ha pagado   → mensaje al comercial (correo con enlace a este hilo)
  El comercial contesta en el mismo hilo (y si quiere, con una nueva fecha:
  vuelve a salir a Administración ese día). Todo vive en la incidencia
  (colección «incidencias», compromiso:true), así que se ve también en el CRM.
  Parámetros: ?rol=admin|comercial|jefe|director|ceo &agente= &uid= &nombre= &id=<incidencia> &vuelve=
-->
<style>
  :root{--navy:#0F172A;--muted:#64748B;--border:#E2E8F0;--green:#16A34A;--red:#DC2626;--amber:#D97706;--blue:#2563EB}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F8FAFC;color:var(--navy)}
  header{background:var(--navy);color:#fff;padding:14px 16px 12px}
  h1{margin:0 0 3px;font-size:19px;font-weight:800}
  .hs{margin:0;font-size:12px;opacity:.75}
  #volver{display:none;color:#CBD5E1;font-size:13px;font-weight:700;text-decoration:none;margin-bottom:6px}
  main{padding:14px 16px 60px;max-width:760px;margin:0 auto}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px}
  .tabs button{flex:none;border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
  .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 3px #0000000d}
  .fila{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-top:1px solid #EEF1F5;cursor:pointer}
  .fila:first-child{border-top:none}
  .fila .n{flex:1;min-width:0}.fila b{font-size:14px}.fila small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .imp{font-weight:800;white-space:nowrap;font-size:14px}
  .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px;margin-top:4px}
  .estado{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}
  .vacio{color:var(--muted);font-size:13px;padding:8px 0}
  .lbl{display:block;font-size:10.5px;font-weight:800;color:#64748B;text-transform:uppercase;margin:12px 0 4px}
  textarea,input,select{width:100%;padding:10px 11px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;background:#fff;outline:none}
  textarea{min-height:70px;resize:vertical}
  textarea:focus,input:focus{border-color:var(--blue)}
  .btn{border:1.5px solid var(--border);background:#fff;color:var(--navy);border-radius:10px;padding:11px 14px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn.ok{background:var(--green);border-color:var(--green);color:#fff}
  .btn.ko{background:var(--red);border-color:var(--red);color:#fff}
  .btn.prim{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn:disabled{opacity:.5}
  .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acc .btn{flex:1;min-width:140px}
  .hilo{margin-top:6px}
  .msg{border-left:3px solid #CBD5E1;padding:6px 10px;margin:8px 0;background:#F8FAFC;border-radius:0 9px 9px 0}
  .msg .q{font-size:12px;color:var(--muted)}.msg .q b{color:var(--navy)}
  .msg .t{font-size:13.5px;white-space:pre-wrap;margin-top:2px}
  .msg.ko{border-left-color:var(--red);background:#FEF2F2}.msg.ok{border-left-color:var(--green);background:#F0FDF4}.msg.fe{border-left-color:var(--blue);background:#EFF6FF}
  .dato{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .dato div{background:#F8FAFC;border-radius:10px;padding:8px 10px}.dato span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase}.dato b{font-size:15px}
  .aviso{font-size:12.5px;border-radius:10px;padding:9px 11px;margin-top:8px;line-height:1.45}
</style></head><body>
<header>
  <a id="volver" href="#">‹ Volver</a>
  <h1 id="h1">💶 Compromisos de cobro</h1>
  <p class="hs" id="hs"></p>
</header>
<main id="app"><p class="estado">Cargando…</p></main>
<script src="recuperacion_comun.js?v=20261008a"></script>
<script>
const Q=new URLSearchParams(location.search);
const U=(s)=>String(s||"").toUpperCase().trim();
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const ROL=(Q.get("rol")||"comercial").toLowerCase();
const ES_ADM=ROL==="admin";
const AGENTE=U(Q.get("agente")), UID=(Q.get("uid")||"").trim(), NOMBRE=(Q.get("nombre")||"").trim()||AGENTE||"—";
const POR={id:UID||AGENTE,nombre:NOMBRE};
let LISTA=[], VISTA=ES_ADM?"hoy":"mios", SEL=Q.get("id")||null, MIS=new Set([AGENTE,U(UID)].filter(Boolean));

const fES=RC.fechaES, eur=RC.eur, hoy=RC.hoyISO();
const diasDesde=(iso)=>{ const t=Date.parse(iso||""); return isNaN(t)?0:Math.floor((Date.parse(hoy)-t)/86400000); };
const estadoTag=(i)=>{ const [t,c]=RC.ESTADO_COBRO[i.estadoCobro]||["",""]; return t?`<span class="tag" style="background:${c}18;color:${c}">${t}</span>`:""; };
const esMio=(i)=>MIS.has(U(i.agente))||MIS.has(U(i.autor));

async function cargar(){
  if(!ES_ADM&&ROL==="comercial"){
    // Todas sus claves (código de vendedor, perfil del CRM…) para encontrar lo suyo
    try{ const us=await RC.leer("usuarios",10);
      us.filter(u=>[u._id,u.id,u.crmId,u.grupoAgente,u.catalogoVendedor,u.username].some(k=>k&&MIS.has(U(k))))
        .forEach(u=>[u._id,u.id,u.crmId,u.grupoAgente,u.catalogoVendedor,u.username].forEach(k=>{ if(k) MIS.add(U(k)); })); }catch(e){}
  }
  LISTA=await RC.leerCompromisos();
  if(VER_SEG){ try{ const [a,b]=await Promise.all([facturasSeguro(),RC.leer("seguro_facturas",10).catch(()=>[])]); SEG=a; SEGM={}; b.forEach(d=>{ SEGM[d._id]=d; }); }catch(e){ SEG=[]; SEG_ERR=e.message; } }
}
// (oct 2026) ÁREA DE SEGURO (Administración): todas las facturas con aviso o parte de seguro.
// Días desde la FECHA DE FACTURA, solo facturas vencidas y por cobrar (sin apuntes, anuladas ni compensadas con un abono)
const VER_SEG=ROL!=="comercial";
let SEG=[], SEG_ERR="", SEG_F="", SEGM={};
// Lo hecho con cada factura (colección seguro_facturas): aviso enviado y/o parte enviado, con fecha y quién
const segId=(x)=>[x.com,x.cli,x.g,x.num,String(x.ff).slice(0,10)].join("|").toUpperCase().replace(/[^A-Z0-9|]/g,"").replace(/\|/g,"__").slice(0,140);
window.segMarcar=async(i,campo,btn)=>{
  const x=SEG[i]; if(!x) return; const id=segId(x), d=SEGM[id]||{};
  const quita=!!d[campo];
  if(quita&&!confirm("¿Quitar la marca de "+(campo==="parte"?"parte enviado":"aviso enviado")+"?")) return;
  if(!quita&&!confirm((campo==="parte"?"¿Marcar como ENVIADO AL SEGURO (parte)?":"¿Marcar el AVISO de seguro como enviado?")+"\n\n"+x.cli+" · "+x.num+" · "+eur(x.im))) return;
  if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  const ahora=new Date().toISOString(), hist=(Array.isArray(d.historial)?d.historial:[]).concat([{accion:(quita?"Quita ":"")+(campo==="parte"?"parte enviado":"aviso enviado"),por:NOMBRE,fecha:ahora}]);
  const o={cliente:x.cli,clienteCodigo:x.cod,comercial:x.com,factura:x.num,empresa:x.g,fechaFactura:x.ff,vencimiento:x.fv,importe:x.im,historial:hist,actualizado:ahora};
  o[campo]=!quita; o[campo+"Fecha"]=quita?"":ahora; o[campo+"Por"]=quita?"":NOMBRE;
  try{ await RC.guardarEn("seguro_facturas",id,o,true); SEGM[id]=Object.assign({},d,o); lista(); }
  catch(e){ alert("No se ha guardado: "+e.message); if(btn){ btn.disabled=false; } }
};
// Fuera la intercompañía: comerciales que no son personas (intercompañía, tienda, sin comercial…) y clientes del propio grupo
// (mismo criterio que el cierre de Administración)
const NO_PERSONA=/^(interc|sincomercial|clientsdirect|cataluna|tienda|telefono|sinagente|total|campofrio|wikuk|interkey|francia|distribuidor)/i;
const CLI_GRUPO=/WIKUK|UNITED CARO|INTERKEY|INTERCOMPA/i;
const esInterco=(com,cli)=>NO_PERSONA.test(String(com||"").replace(/[.\s_-]/g,""))||CLI_GRUPO.test(String(cli||""));
let SEG_FUERA={n:0,im:0};
async function facturasSeguro(){
  const D=await docsCobros(), out=[], nomCom={}; SEG_FUERA={n:0,im:0};
  try{ (await RC.leer("usuarios",10)).forEach(u=>[u.grupoAgente,u.catalogoVendedor,u.username,u._id].forEach(k=>{ if(k) nomCom[U(k)]=u.nombre||k; })); }catch(e){}
  D.forEach(d=>(d.clis||[]).forEach(c=>{
    const F=(c.f||[]), cen=(x)=>Math.round(Math.abs(Number(x)||0)*100);
    const negs=F.filter(f=>Number(f.im)<0);
    F.forEach(f=>{
      if(!(f.im>0)||f.anul||f.corr||String(f.t||"").toUpperCase()==="AS") return;
      if(!(f.ve===1||(f.ve===undefined&&f.fv&&f.fv<hoy))) return;
      if(negs.some(n=>cen(n.im)===cen(f.im)&&String(n.g||"")===String(f.g||""))) return;
      const ds=RC.diasFactura(f.ff,f.fv), niv=RC.seguroNivel(ds); if(!niv) return;
      if(esInterco(d.com||d.id,c.c)||esInterco(d.comNom,"")){ SEG_FUERA.n++; SEG_FUERA.im+=Number(f.im)||0; return; }
      out.push({niv,ds,dv:f.dv!=null?f.dv:diasDesde(f.fv),cli:c.c||"",cod:c.cod||"",com:d.com||d.id,comNom:d.comNom||nomCom[U(d.com||d.id)]||d.com||d.id,
        num:((f.t?f.t+" ":"")+(f.n||"")).trim(),g:f.g||"",ff:f.ff||"",fv:f.fv||"",im:Number(f.im)||0});
    }); }));
  // Una factura en varios plazos: una sola línea con lo vencido sumado
  const m=new Map(), visto=new Set(); out.forEach(x=>{ const ex=[U(x.cli),x.g,U(x.num),x.ff,x.fv,Math.round(x.im*100)].join("|"); if(visto.has(ex+"|"+x.com)) return; visto.add(ex+"|"+x.com);
    const k=[U(x.cli),x.g,U(x.num),x.ff].join("|"); const y=m.get(k);
    if(!y) m.set(k,Object.assign({},x)); else { y.im+=x.im; if(x.ds>y.ds){ y.ds=x.ds; y.niv=x.niv; } if(x.fv<y.fv) y.fv=x.fv; } });
  return [...m.values()].sort((a,b)=>b.ds-a.ds||b.im-a.im);
}
function segHTML(){
  if(SEG_ERR) return `<p class="vacio">No se han podido leer las facturas: ${esc(SEG_ERR)}</p>`;
  const q=U(SEG_F), L=SEG.filter(x=>!q||U(x.cli).includes(q)||U(x.comNom).includes(q)||U(x.num).includes(q));
  const M=(x)=>SEGM[segId(x)]||{};
  const env=L.filter(x=>M(x).parte), va=L.filter(x=>x.niv==="va"&&!M(x).parte), ri=L.filter(x=>x.niv==="riesgo"&&!M(x).parte&&!M(x).aviso),
        riOk=L.filter(x=>x.niv==="riesgo"&&!M(x).parte&&M(x).aviso), sum=(l)=>l.reduce((t,x)=>t+x.im,0);
  const fD=(iso)=>iso?new Date(iso).toLocaleDateString("es-ES"):"";
  const marcas=(x)=>{ const m=M(x), i=SEG.indexOf(x);
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">
      ${m.aviso?`<span style="font-size:11.5px;font-weight:700;background:#ECFDF5;color:#15803D;border-radius:8px;padding:3px 8px">✓ Aviso enviado ${esc(fD(m.avisoFecha))}${m.avisoPor?" · "+esc(m.avisoPor):""}</span>`:""}
      ${m.parte?`<span style="font-size:11.5px;font-weight:700;background:#7F1D1D;color:#fff;border-radius:8px;padding:3px 8px">🛡️ Enviado al seguro ${esc(fD(m.parteFecha))}${m.partePor?" · "+esc(m.partePor):""}</span>`:""}
      ${ES_ADM?`<button class="btn" style="padding:5px 10px;font-size:12px" onclick="segMarcar(${i},'aviso',this)">${m.aviso?"Quitar aviso":"✓ Aviso enviado"}</button>
        ${x.niv==="va"||m.parte?`<button class="btn" style="padding:5px 10px;font-size:12px;${m.parte?"":"background:#7F1D1D;border-color:#7F1D1D;color:#fff"}" onclick="segMarcar(${i},'parte',this)">${m.parte?"Quitar parte":"🛡️ Parte enviado al seguro"}</button>`:""}`:""}
    </div>`; };
  const cp=(x)=>LISTA.filter(i=>i.estadoCobro!=="pagado"&&U(i.clienteNombre||i.cliente)===U(x.cli)).sort((a,b)=>String(b.fechaCreacion||"").localeCompare(String(a.fechaCreacion||"")))[0];
  const fila=(x)=>{ const c=cp(x);
    return `<div class="fila" style="cursor:default"><div class="n"><b>${esc(x.cli)}</b> ${RC.seguroProc(x.ds)}
      <small>🧾 <b>${esc(x.num||"—")}</b> · ${esc(x.g)} · fecha ${esc(fES(x.ff))} · vence ${esc(fES(x.fv))}</small>
      <small><b style="color:#B91C1C">${x.ds} días desde la factura</b> · ${x.dv} vencida · ${esc(x.comNom)}</small>
      ${c?`<small style="color:#1D4ED8;font-weight:700">📅 ${esc(c.accionCobro||"")} · para el ${esc(fES(c.fechaCompromiso))} · ${esc((RC.ESTADO_COBRO[c.estadoCobro]||[""])[0])}</small>`:`<small style="color:#B91C1C;font-weight:700">Sin acción</small>`}
      ${marcas(x)}
      <a href="/cobros.html?agente=${encodeURIComponent(x.com)}&cliente=${encodeURIComponent(x.cli)}&vista=vencidos&rol=admin&nombre=${encodeURIComponent(NOMBRE)}&uid=${encodeURIComponent(UID)}" style="font-size:12px;font-weight:700;color:#2563EB">Ver en Cobros ›</a></div>
      <div class="imp" style="color:#B91C1C">${eur(x.im)}</div></div>`; };
  const bloque=(t,col,bg,l,sub)=>`<div style="background:${bg};color:${col};border-radius:10px;padding:8px 11px;margin:10px 0 4px;font-weight:800;font-size:13px">${t} · ${l.length} factura${l.length===1?"":"s"} · ${eur(sum(l))}<div style="font-weight:600;font-size:11.5px;opacity:.85">${sub}</div></div>${l.length?l.map(fila).join(""):`<p class="vacio">Ninguna.</p>`}`;
  return `${SEG_FUERA.n?`<p style="margin:0 0 6px;font-size:12px;color:#64748B">Fuera ${SEG_FUERA.n} factura${SEG_FUERA.n===1?"":"s"} de intercompañía (${eur(SEG_FUERA.im)}).</p>`:""}<input placeholder="Buscar cliente, comercial o factura…" value="${esc(SEG_F)}" oninput="SEG_F=this.value;clearTimeout(window._sf);window._sf=setTimeout(()=>{ lista(); const i=document.querySelector('#app input'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } },250)" style="margin:4px 0 6px">
    ${bloque("🛡️ PARTE SEGURO · pendiente de enviar","#fff","#7F1D1D",va,`Más de ${RC.SEGURO_VA} días desde la fecha de factura: hay que declararlas a la aseguradora`)}
    ${bloque("⚠️ AVISO SEGURO · pendiente de enviar","#B91C1C","#FEE2E2",ri,`De ${RC.SEGURO_RIESGO+1} a ${RC.SEGURO_VA} días desde la fecha de factura: enviar el aviso y cobrarlas antes de que pasen al seguro`)}
    ${bloque("✓ AVISO ENVIADO · en seguimiento","#15803D","#ECFDF5",riOk,`Aviso hecho: si no se cobran antes de los ${RC.SEGURO_VA} días, pasan a parte`)}
    ${bloque("🛡️ ENVIADAS AL SEGURO","#475569","#F1F5F9",env,"Parte hecho a la aseguradora")}`;
}
function filaHTML(i){
  const vence=String(i.fechaCompromiso||"");
  const atras=i.estadoCobro==="pendiente"&&vence<hoy?diasDesde(vence):0;
  return `<div class="fila" onclick="abrir('${esc(i._id)}')">
    <div class="n"><b>${esc(i.clienteNombre||i.cliente||"")}</b>
      <small>${esc(i.accionCobro||"")} · ${vence===hoy?"<b style='color:#B45309'>hoy</b>":"el "+esc(fES(vence))}${atras?` · <b style="color:#B91C1C">hace ${atras} día${atras===1?"":"s"}</b>`:""}${ES_ADM?" · "+esc(i.autorNombre||i.agente||""):""}${i.empresa?" · "+esc(i.empresa):""}</small>
      ${estadoTag(i)}</div>
    <div class="imp">${i.importeCompromiso?eur(i.importeCompromiso):""}</div></div>`;
}
function lista(){
  const app=document.getElementById("app");
  let grupos;
  if(ES_ADM){
    const H=RC.avisosCobroHoy(LISTA), R=LISTA.filter(i=>i.estadoCobro==="no_pagado"&&!/resuelta|cerrada/.test(i.estado||""));
    const P=LISTA.filter(i=>i.estadoCobro==="pendiente"&&String(i.fechaCompromiso||"")>hoy).sort((a,b)=>String(a.fechaCompromiso).localeCompare(String(b.fechaCompromiso)));
    const OK=LISTA.filter(i=>i.estadoCobro==="pagado").sort((a,b)=>String(b.fechaUltimoCambio||"").localeCompare(String(a.fechaUltimoCambio||""))).slice(0,40);
    grupos={hoy:["🔔 Para comprobar hoy",H,"Nada que comprobar hoy."],rec:["❌ Reclamados · esperando al comercial",R,"No hay cobros reclamados."],
            prox:["📅 Próximos días",P,"No hay compromisos para los próximos días."],ok:["✅ Pagados",OK,"Todavía ninguno."]};

  } else {
    const M=LISTA.filter(esMio), ab=M.filter(i=>i.estadoCobro!=="pagado");
    grupos={mios:["Mis compromisos abiertos",ab.sort((a,b)=>(a.estadoCobro==="no_pagado"?-1:0)-(b.estadoCobro==="no_pagado"?-1:0)||String(a.fechaCompromiso).localeCompare(String(b.fechaCompromiso))),"No tienes compromisos abiertos. Se apuntan desde Cobros o desde tu cierre semanal."],
            ok:["✅ Pagados",M.filter(i=>i.estadoCobro==="pagado"),"Todavía ninguno."]};
  }
  if(VER_SEG) grupos.seg=["🛡️ Seguro · aviso y parte",SEG.filter(x=>!(SEGM[segId(x)]||{}).parte),""];
  const [tit,l,vac]=grupos[VISTA]||Object.values(grupos)[0];
  app.innerHTML=`<div class="tabs">${Object.entries(grupos).map(([k,[t,x]])=>`<button class="${k===VISTA?"on":""}" onclick="VISTA='${k}';lista()">${CORTO[k]||t.split(" ")[0]} ${x.length}</button>`).join("")}</div>
    <div class="card"><p style="margin:0 0 4px;font-weight:800;font-size:14.5px">${tit}</p>
      ${ES_ADM&&VISTA==="hoy"?`<p style="margin:0 0 6px;font-size:12px;color:#64748B">Comprueba si ha entrado el cobro. Si no, reclámalo: al comercial le llega un correo y contesta en el mismo hilo.</p>`:""}
      ${VISTA==="seg"?segHTML():l.length?l.map(filaHTML).join(""):`<p class="vacio">${vac}</p>`}</div>`;
}
const CORTO={hoy:"🔔 Hoy",rec:"❌ Reclamados",prox:"📅 Próximos",ok:"✅ Pagados",mios:"📅 Abiertos",seg:"🛡️ Seguro"};
window.abrir=(id)=>{ SEL=id; pintar(); window.scrollTo(0,0); };
window.atras=()=>{ SEL=null; pintar(); };

// (oct 2026) Facturas del cliente (las mismas que en Cobros): factura, empresa, fecha, vencimiento, importe y vencido
let COBROS_DOCS=null;
async function docsCobros(){
  if(COBROS_DOCS) return COBROS_DOCS;
  const FBC='https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents/cobros_comercial';
  const out=[]; let tok=null, n=0;
  do{ const r=await fetch(FBC+'?pageSize=100'+(tok?'&pageToken='+encodeURIComponent(tok):''),{cache:'no-store'}); if(!r.ok) break;
    const j=await r.json(); (j.documents||[]).forEach(d=>{ const F=d.fields||{}, sv=(k)=>(F[k]&&F[k].stringValue)||'';
      try{ out.push({id:d.name.split('/').pop(),com:sv('comercial'),comNom:sv('comercialNombre'),fuente:sv('fuente'),clis:JSON.parse(sv('datos')||'[]')}); }catch(e){} });
    tok=j.nextPageToken||null; n++; }while(tok&&n<20);
  return COBROS_DOCS=out;
}
async function pintarFacturas(i){
  const box=document.getElementById('facBox'); if(!box) return;
  try{
    const D=await docsCobros(), cod=U(i.clienteCodigo||i.clienteId), nom=U(i.clienteNombre||i.cliente);
    const prim=D.filter(d=>U(d.id)===U(i.agente)).concat(D.filter(d=>U(d.id)!==U(i.agente)));
    let c=null; for(const d of prim){ c=d.clis.find(x=>(cod&&U(x.cod)===cod)||U(x.c)===nom); if(c) break; }
    if(SEL!==i._id) return;
    const F=c?(c.f||[]).filter(f=>f.im>0&&!f.anul):[];
    if(!F.length){ box.innerHTML=c?'No tiene facturas pendientes.':'No encuentro sus facturas en Cobros.'; return; }
    const venc=(f)=>f.ve===1||(f.ve===undefined&&f.fv&&f.fv<hoy);
    const G={}; F.forEach(f=>{ const k=[f.g,f.t,f.n,f.ff].join('|'); (G[k]=G[k]||[]).push(f); });
    const filas=Object.values(G).map(l=>{ l.sort((a,b)=>String(a.fv).localeCompare(String(b.fv))); const f=l[0];
      const ven=l.filter(venc), fvV=ven.length?ven[0].fv:f.fv;
      return {num:((f.t?f.t+' ':'')+(f.n||'—')).trim(),emp:f.g||'',ff:f.ff,fv:fvV,plazos:l.length,imp:l.reduce((t,x)=>t+x.im,0),vimp:ven.reduce((t,x)=>t+x.im,0),
        dias:ven.length?(ven[0].dv!=null?ven[0].dv:Math.round((Date.parse(hoy)-Date.parse(ven[0].fv))/86400000)):null,
        esta:i.facturaNum&&String(f.n||'').includes(String(i.facturaNum))}; })
      .sort((a,b)=>(b.vimp>0)-(a.vimp>0)||String(a.fv).localeCompare(String(b.fv)));
    const tI=filas.reduce((t,x)=>t+x.imp,0), tV=filas.reduce((t,x)=>t+x.vimp,0);
    box.style.color='inherit';
    box.innerHTML=`<div style="margin-bottom:6px;font-size:13px">Pendiente <b>${eur(tI)}</b> · Vencido <b style="color:#B91C1C">${eur(tV)}</b> · ${filas.length} factura${filas.length===1?'':'s'}</div>`
      +filas.map(x=>`<div style="border-top:1px solid #EEF1F5;padding:8px 0;${x.esta?'background:#FFFBEB;':''}">
        <div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:13.5px">🧾 ${esc(x.num)}</b><span style="font-size:11.5px;font-weight:800;background:#F1F5F9;border-radius:99px;padding:2px 8px">${esc(x.emp)}</span></div>
        <div class="dato" style="grid-template-columns:repeat(4,1fr);gap:5px;margin-top:5px">
          <div><span>Fecha</span><b style="font-size:13px">${esc(fES(x.ff))}</b></div>
          <div><span>Vencimiento</span><b style="font-size:13px">${esc(fES(x.fv))}</b></div>
          <div><span>Importe</span><b style="font-size:13px">${eur(x.imp)}</b></div>
          <div><span>Vencido</span><b style="font-size:13px;color:${x.vimp?'#B91C1C':'#15803D'}">${eur(x.vimp)}</b></div></div>
        <div style="font-size:11.5px;color:#64748B;margin-top:2px">${x.dias!=null?`<b style="color:#B91C1C">${x.dias} días vencida</b>`:'en plazo'}${x.ff?` · lleva <b>${Math.max(0,Math.round((Date.parse(hoy)-Date.parse(x.ff))/86400000))} días</b>`:''} ${/^AS\b/i.test(x.num)?'<span style="font-size:10.5px;color:#64748B">apunte contable</span>':(x.dias!=null&&RC.seguroProc?RC.seguroProc(RC.diasFactura(x.ff,x.fv)):'')}${x.plazos>1?` · ${x.plazos} plazos`:''}${x.esta?' · <b>factura del compromiso</b>':''}</div></div>`).join('');
  }catch(e){ box.textContent='No se han podido cargar las facturas ('+e.message+').'; }
}
function detalle(){
  const i=LISTA.find(x=>x._id===SEL);
  const app=document.getElementById("app");
  if(!i){ app.innerHTML=`<p class="estado">No encuentro este compromiso.<br><button class="btn" style="margin-top:10px" onclick="atras()">Ver la lista</button></p>`; return; }
  const cerrado=i.estadoCobro==="pagado";
  const hilo=(i.historial||[]).filter(h=>h&&(h.nota||h.accion));
  const cls=(h)=>/No ha pagado/.test(h.accion||"")?"ko":/Cobrado|pagado/i.test(h.accion||"")?"ok":/fecha|Compromiso/.test(h.accion||"")?"fe":"";
  const fechaDef=(()=>{ const d=new Date(); d.setDate(d.getDate()+3); return d.toISOString().slice(0,10); })();
  app.innerHTML=`<button class="btn" style="margin-bottom:10px" onclick="atras()">‹ Lista</button>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <div><b style="font-size:16px">${esc(i.clienteNombre||i.cliente)}</b><div style="font-size:12px;color:#64748B">${esc(i.autorNombre||i.agente||"")}${i.empresa?" · "+esc(i.empresa):""}${i.facturaNum?" · factura "+esc(i.facturaNum):""}</div></div>
      ${estadoTag(i)}</div>
      <div class="dato"><div><span>Acción</span><b>${esc(i.accionCobro||"")}</b></div><div><span>Fecha</span><b>${esc(fES(i.fechaCompromiso))}</b></div>
        ${i.importeCompromiso?`<div><span>Importe</span><b>${eur(i.importeCompromiso)}</b></div>`:""}<div><span>Apuntado</span><b>${esc(i.fecha||"")}</b></div></div></div>
    <div class="card" id="facCard"><p style="margin:0;font-weight:800">🧾 Facturas pendientes</p><div id="facBox" style="font-size:12.5px;color:#64748B;margin-top:6px">Buscando sus facturas…</div></div>
    <div class="card"><p style="margin:0;font-weight:800">Hilo</p><div class="hilo">
      ${hilo.map(h=>`<div class="msg ${cls(h)}"><div class="q"><b>${esc(h.por||"")}</b> · ${esc(h.fecha||"")} · ${esc(h.accion||"")}</div>${h.nota?`<div class="t">${esc(h.nota)}</div>`:""}</div>`).join("")}</div></div>
    ${cerrado?`<div class="aviso" style="background:#F0FDF4;color:#166534">✓ Cobrado. Hilo cerrado.</div>`:ES_ADM?`
    <div class="card"><p style="margin:0;font-weight:800">¿Ha pagado?</p>
      <div class="acc"><button class="btn ok" onclick="pagado()">✅ Ha pagado</button><button class="btn ko" onclick="document.getElementById('rec').hidden=false;document.getElementById('recTxt').focus()">❌ No ha pagado</button></div>
      <div id="rec" hidden><span class="lbl">Mensaje para ${esc(i.autorNombre||"el comercial")} (le llega por correo)</span>
        <textarea id="recTxt">No ha pagado. Necesito esto urgente: dime qué pasa y nueva fecha.</textarea>
        <button class="btn ko" style="width:100%;margin-top:8px" onclick="reclamar(this)">Enviar reclamación</button></div>
      <span class="lbl">O solo un comentario</span>
      <div style="display:flex;gap:6px"><input id="comTxt" placeholder="Comentario en el hilo"><button class="btn" onclick="comentar(this)">Enviar</button></div></div>`:`
    <div class="card"><p style="margin:0;font-weight:800">${i.estadoCobro==="no_pagado"?"Administración dice que no ha pagado: contesta":"Contestar"}</p>
      <span class="lbl">Qué pasa</span><textarea id="resTxt" placeholder="Ej.: he hablado con el cliente, paga el viernes por transferencia"></textarea>
      <div class="dato" style="grid-template-columns:1fr 1fr"><div style="background:none;padding:0"><span>Nueva fecha (opcional)</span><input type="date" id="resFecha" min="${hoy}"></div>
        <div style="background:none;padding:0"><span>Acción</span><select id="resAcc">${RC.ACC_COBRO.map(a=>`<option${a===i.accionCobro?" selected":""}>${a}</option>`).join("")}</select></div></div>
      <div class="acc"><button class="btn prim" onclick="responder(this)">Enviar respuesta</button><button class="btn ok" onclick="dicePagado(this)">✅ Ya ha pagado</button></div>
      <div class="aviso" style="background:#EFF6FF;color:#1E40AF">Si pones nueva fecha, Administración lo vuelve a comprobar ese día.</div></div>`}`;
  pintarFacturas(i);
}
async function accion(btn,fn){ if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  try{ await fn(); pintar(); }catch(e){ alert("No se ha guardado: "+e.message); if(btn) btn.disabled=false; } }
const actual=()=>LISTA.find(x=>x._id===SEL);
window.pagado=()=>accion(null,()=>RC.cobroPagado(actual(),POR,""));
window.reclamar=(b)=>{ const t=document.getElementById("recTxt").value.trim(); if(t.length<3){ alert("Escribe el mensaje"); return; } accion(b,()=>RC.cobroReclamar(actual(),POR,t)); };
window.comentar=(b)=>{ const t=document.getElementById("comTxt").value.trim(); if(t.length<2) return; accion(b,()=>RC.cobroComentar(actual(),POR,t)); };
window.responder=(b)=>{ const t=document.getElementById("resTxt").value.trim(), f=document.getElementById("resFecha").value, a=document.getElementById("resAcc").value;
  if(t.length<3&&!f){ alert("Escribe qué pasa o pon una nueva fecha"); return; }
  accion(b,()=>RC.cobroResponder(actual(),POR,t,f||"",a)); };
window.dicePagado=(b)=>{ const t=document.getElementById("resTxt").value.trim();
  accion(b,()=>RC.cobroResponder(actual(),POR,"Dice que ya ha pagado."+(t?" "+t:""),"",null)); };

function pintar(){
  document.getElementById("hs").textContent=NOMBRE+(ES_ADM?" · Administración de clientes":"");
  if(SEL) detalle(); else lista();
}
(()=>{ const v=Q.get("vuelve"); if(!v) return; const a=document.getElementById("volver"); a.style.display="inline-block"; a.href=v;
  a.onclick=(e)=>{ e.preventDefault(); if(history.length>1) history.back(); else location.href=v; }; })();
(async()=>{ try{ await cargar(); pintar(); }
  catch(e){ document.getElementById("app").innerHTML=`<p class="estado">No se han podido cargar los compromisos: ${esc(e.message)}</p>`; } })();
</script>
</body></html>
