<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compromisos de cobro</title>
<!--
  (oct 2026) COMPROMISOS DE COBRO
  El comercial dice qué va a hacer con un cobro y para qué fecha (desde Cobros
  o desde su cierre semanal). Administración de clientes lo ve el día que toca
  al entrar en el portal / CRM, y comprueba:
     ✅ Ha pagado      → se cierra
     ❌ No ha pagado   → mensaje al comercial (correo con enlace a este hilo)
  El comercial contesta en el mismo hilo (y si quiere, con una nueva fecha:
  vuelve a salir a Administración ese día). Todo vive en la incidencia
  (colección «incidencias», compromiso:true), así que se ve también en el CRM.
  Parámetros: ?rol=admin|comercial|jefe|director|ceo &agente= &uid= &nombre= &id=<incidencia> &vuelve=
-->
<style>
  :root{--navy:#0F172A;--muted:#64748B;--border:#E2E8F0;--green:#16A34A;--red:#DC2626;--amber:#D97706;--blue:#2563EB}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F8FAFC;color:var(--navy)}
  header{background:var(--navy);color:#fff;padding:14px 16px 12px}
  h1{margin:0 0 3px;font-size:19px;font-weight:800}
  .hs{margin:0;font-size:12px;opacity:.75}
  #volver{display:none;color:#CBD5E1;font-size:13px;font-weight:700;text-decoration:none;margin-bottom:6px}
  main{padding:14px 16px 60px;max-width:760px;margin:0 auto}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px}
  .tabs button{flex:none;border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
  .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 3px #0000000d}
  .fila{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-top:1px solid #EEF1F5;cursor:pointer}
  .fila:first-child{border-top:none}
  .fila .n{flex:1;min-width:0}.fila b{font-size:14px}.fila small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .imp{font-weight:800;white-space:nowrap;font-size:14px}
  .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px;margin-top:4px}
  .estado{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}
  .vacio{color:var(--muted);font-size:13px;padding:8px 0}
  .lbl{display:block;font-size:10.5px;font-weight:800;color:#64748B;text-transform:uppercase;margin:12px 0 4px}
  textarea,input,select{width:100%;padding:10px 11px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;background:#fff;outline:none}
  textarea{min-height:70px;resize:vertical}
  textarea:focus,input:focus{border-color:var(--blue)}
  .btn{border:1.5px solid var(--border);background:#fff;color:var(--navy);border-radius:10px;padding:11px 14px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn.ok{background:var(--green);border-color:var(--green);color:#fff}
  .btn.ko{background:var(--red);border-color:var(--red);color:#fff}
  .btn.prim{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn:disabled{opacity:.5}
  .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acc .btn{flex:1;min-width:140px}
  .hilo{margin-top:6px}
  .msg{border-left:3px solid #CBD5E1;padding:6px 10px;margin:8px 0;background:#F8FAFC;border-radius:0 9px 9px 0}
  .msg .q{font-size:12px;color:var(--muted)}.msg .q b{color:var(--navy)}
  .msg .t{font-size:13.5px;white-space:pre-wrap;margin-top:2px}
  .msg.ko{border-left-color:var(--red);background:#FEF2F2}.msg.ok{border-left-color:var(--green);background:#F0FDF4}.msg.fe{border-left-color:var(--blue);background:#EFF6FF}
  .dato{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .dato div{background:#F8FAFC;border-radius:10px;padding:8px 10px}.dato span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase}.dato b{font-size:15px}
  .aviso{font-size:12.5px;border-radius:10px;padding:9px 11px;margin-top:8px;line-height:1.45}
</style></head><body>
<header>
  <a id="volver" href="#">‹ Volver</a>
  <h1 id="h1">💶 Compromisos de cobro</h1>
  <p class="hs" id="hs"></p>
</header>
<main id="app"><p class="estado">Cargando…</p></main>
<script src="recuperacion_comun.js?v=20261005a"></script>
<script>
const Q=new URLSearchParams(location.search);
const U=(s)=>String(s||"").toUpperCase().trim();
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const ROL=(Q.get("rol")||"comercial").toLowerCase();
const ES_ADM=ROL==="admin";
const AGENTE=U(Q.get("agente")), UID=(Q.get("uid")||"").trim(), NOMBRE=(Q.get("nombre")||"").trim()||AGENTE||"—";
const POR={id:UID||AGENTE,nombre:NOMBRE};
let LISTA=[], VISTA=ES_ADM?"hoy":"mios", SEL=Q.get("id")||null, MIS=new Set([AGENTE,U(UID)].filter(Boolean));

const fES=RC.fechaES, eur=RC.eur, hoy=RC.hoyISO();
const diasDesde=(iso)=>{ const t=Date.parse(iso||""); return isNaN(t)?0:Math.floor((Date.parse(hoy)-t)/86400000); };
const estadoTag=(i)=>{ const [t,c]=RC.ESTADO_COBRO[i.estadoCobro]||["",""]; return t?`<span class="tag" style="background:${c}18;color:${c}">${t}</span>`:""; };
const esMio=(i)=>MIS.has(U(i.agente))||MIS.has(U(i.autor));

async function cargar(){
  if(!ES_ADM&&ROL==="comercial"){
    // Todas sus claves (código de vendedor, perfil del CRM…) para encontrar lo suyo
    try{ const us=await RC.leer("usuarios",10);
      us.filter(u=>[u._id,u.id,u.crmId,u.grupoAgente,u.catalogoVendedor,u.username].some(k=>k&&MIS.has(U(k))))
        .forEach(u=>[u._id,u.id,u.crmId,u.grupoAgente,u.catalogoVendedor,u.username].forEach(k=>{ if(k) MIS.add(U(k)); })); }catch(e){}
  }
  LISTA=await RC.leerCompromisos();
}
function filaHTML(i){
  const vence=String(i.fechaCompromiso||"");
  const atras=i.estadoCobro==="pendiente"&&vence<hoy?diasDesde(vence):0;
  return `<div class="fila" onclick="abrir('${esc(i._id)}')">
    <div class="n"><b>${esc(i.clienteNombre||i.cliente||"")}</b>
      <small>${esc(i.accionCobro||"")} · ${vence===hoy?"<b style='color:#B45309'>hoy</b>":"el "+esc(fES(vence))}${atras?` · <b style="color:#B91C1C">hace ${atras} día${atras===1?"":"s"}</b>`:""}${ES_ADM?" · "+esc(i.autorNombre||i.agente||""):""}${i.empresa?" · "+esc(i.empresa):""}</small>
      ${estadoTag(i)}</div>
    <div class="imp">${i.importeCompromiso?eur(i.importeCompromiso):""}</div></div>`;
}
function lista(){
  const app=document.getElementById("app");
  let grupos;
  if(ES_ADM){
    const H=RC.avisosCobroHoy(LISTA), R=LISTA.filter(i=>i.estadoCobro==="no_pagado"&&!/resuelta|cerrada/.test(i.estado||""));
    const P=LISTA.filter(i=>i.estadoCobro==="pendiente"&&String(i.fechaCompromiso||"")>hoy).sort((a,b)=>String(a.fechaCompromiso).localeCompare(String(b.fechaCompromiso)));
    const OK=LISTA.filter(i=>i.estadoCobro==="pagado").sort((a,b)=>String(b.fechaUltimoCambio||"").localeCompare(String(a.fechaUltimoCambio||""))).slice(0,40);
    grupos={hoy:["🔔 Para comprobar hoy",H,"Nada que comprobar hoy."],rec:["❌ Reclamados · esperando al comercial",R,"No hay cobros reclamados."],
            prox:["📅 Próximos días",P,"No hay compromisos para los próximos días."],ok:["✅ Pagados",OK,"Todavía ninguno."]};
  } else {
    const M=LISTA.filter(esMio), ab=M.filter(i=>i.estadoCobro!=="pagado");
    grupos={mios:["Mis compromisos abiertos",ab.sort((a,b)=>(a.estadoCobro==="no_pagado"?-1:0)-(b.estadoCobro==="no_pagado"?-1:0)||String(a.fechaCompromiso).localeCompare(String(b.fechaCompromiso))),"No tienes compromisos abiertos. Se apuntan desde Cobros o desde tu cierre semanal."],
            ok:["✅ Pagados",M.filter(i=>i.estadoCobro==="pagado"),"Todavía ninguno."]};
  }
  const [tit,l,vac]=grupos[VISTA]||Object.values(grupos)[0];
  app.innerHTML=`<div class="tabs">${Object.entries(grupos).map(([k,[t,x]])=>`<button class="${k===VISTA?"on":""}" onclick="VISTA='${k}';lista()">${CORTO[k]||t.split(" ")[0]} ${x.length}</button>`).join("")}</div>
    <div class="card"><p style="margin:0 0 4px;font-weight:800;font-size:14.5px">${tit}</p>
      ${ES_ADM&&VISTA==="hoy"?`<p style="margin:0 0 6px;font-size:12px;color:#64748B">Comprueba si ha entrado el cobro. Si no, reclámalo: al comercial le llega un correo y contesta en el mismo hilo.</p>`:""}
      ${l.length?l.map(filaHTML).join(""):`<p class="vacio">${vac}</p>`}</div>`;
}
const CORTO={hoy:"🔔 Hoy",rec:"❌ Reclamados",prox:"📅 Próximos",ok:"✅ Pagados",mios:"📅 Abiertos"};
window.abrir=(id)=>{ SEL=id; pintar(); window.scrollTo(0,0); };
window.atras=()=>{ SEL=null; pintar(); };

function detalle(){
  const i=LISTA.find(x=>x._id===SEL);
  const app=document.getElementById("app");
  if(!i){ app.innerHTML=`<p class="estado">No encuentro este compromiso.<br><button class="btn" style="margin-top:10px" onclick="atras()">Ver la lista</button></p>`; return; }
  const cerrado=i.estadoCobro==="pagado";
  const hilo=(i.historial||[]).filter(h=>h&&(h.nota||h.accion));
  const cls=(h)=>/No ha pagado/.test(h.accion||"")?"ko":/Cobrado|pagado/i.test(h.accion||"")?"ok":/fecha|Compromiso/.test(h.accion||"")?"fe":"";
  const fechaDef=(()=>{ const d=new Date(); d.setDate(d.getDate()+3); return d.toISOString().slice(0,10); })();
  app.innerHTML=`<button class="btn" style="margin-bottom:10px" onclick="atras()">‹ Lista</button>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <div><b style="font-size:16px">${esc(i.clienteNombre||i.cliente)}</b><div style="font-size:12px;color:#64748B">${esc(i.autorNombre||i.agente||"")}${i.empresa?" · "+esc(i.empresa):""}${i.facturaNum?" · factura "+esc(i.facturaNum):""}</div></div>
      ${estadoTag(i)}</div>
      <div class="dato"><div><span>Acción</span><b>${esc(i.accionCobro||"")}</b></div><div><span>Fecha</span><b>${esc(fES(i.fechaCompromiso))}</b></div>
        ${i.importeCompromiso?`<div><span>Importe</span><b>${eur(i.importeCompromiso)}</b></div>`:""}<div><span>Apuntado</span><b>${esc(i.fecha||"")}</b></div></div></div>
    <div class="card"><p style="margin:0;font-weight:800">Hilo</p><div class="hilo">
      ${hilo.map(h=>`<div class="msg ${cls(h)}"><div class="q"><b>${esc(h.por||"")}</b> · ${esc(h.fecha||"")} · ${esc(h.accion||"")}</div>${h.nota?`<div class="t">${esc(h.nota)}</div>`:""}</div>`).join("")}</div></div>
    ${cerrado?`<div class="aviso" style="background:#F0FDF4;color:#166534">✓ Cobrado. Hilo cerrado.</div>`:ES_ADM?`
    <div class="card"><p style="margin:0;font-weight:800">¿Ha pagado?</p>
      <div class="acc"><button class="btn ok" onclick="pagado()">✅ Ha pagado</button><button class="btn ko" onclick="document.getElementById('rec').hidden=false;document.getElementById('recTxt').focus()">❌ No ha pagado</button></div>
      <div id="rec" hidden><span class="lbl">Mensaje para ${esc(i.autorNombre||"el comercial")} (le llega por correo)</span>
        <textarea id="recTxt">No ha pagado. Necesito esto urgente: dime qué pasa y nueva fecha.</textarea>
        <button class="btn ko" style="width:100%;margin-top:8px" onclick="reclamar(this)">Enviar reclamación</button></div>
      <span class="lbl">O solo un comentario</span>
      <div style="display:flex;gap:6px"><input id="comTxt" placeholder="Comentario en el hilo"><button class="btn" onclick="comentar(this)">Enviar</button></div></div>`:`
    <div class="card"><p style="margin:0;font-weight:800">${i.estadoCobro==="no_pagado"?"Administración dice que no ha pagado: contesta":"Contestar"}</p>
      <span class="lbl">Qué pasa</span><textarea id="resTxt" placeholder="Ej.: he hablado con el cliente, paga el viernes por transferencia"></textarea>
      <div class="dato" style="grid-template-columns:1fr 1fr"><div style="background:none;padding:0"><span>Nueva fecha (opcional)</span><input type="date" id="resFecha" min="${hoy}"></div>
        <div style="background:none;padding:0"><span>Acción</span><select id="resAcc">${RC.ACC_COBRO.map(a=>`<option${a===i.accionCobro?" selected":""}>${a}</option>`).join("")}</select></div></div>
      <div class="acc"><button class="btn prim" onclick="responder(this)">Enviar respuesta</button><button class="btn ok" onclick="dicePagado(this)">✅ Ya ha pagado</button></div>
      <div class="aviso" style="background:#EFF6FF;color:#1E40AF">Si pones nueva fecha, Administración lo vuelve a comprobar ese día.</div></div>`}`;
}
async function accion(btn,fn){ if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  try{ await fn(); pintar(); }catch(e){ alert("No se ha guardado: "+e.message); if(btn) btn.disabled=false; } }
const actual=()=>LISTA.find(x=>x._id===SEL);
window.pagado=()=>accion(null,()=>RC.cobroPagado(actual(),POR,""));
window.reclamar=(b)=>{ const t=document.getElementById("recTxt").value.trim(); if(t.length<3){ alert("Escribe el mensaje"); return; } accion(b,()=>RC.cobroReclamar(actual(),POR,t)); };
window.comentar=(b)=>{ const t=document.getElementById("comTxt").value.trim(); if(t.length<2) return; accion(b,()=>RC.cobroComentar(actual(),POR,t)); };
window.responder=(b)=>{ const t=document.getElementById("resTxt").value.trim(), f=document.getElementById("resFecha").value, a=document.getElementById("resAcc").value;
  if(t.length<3&&!f){ alert("Escribe qué pasa o pon una nueva fecha"); return; }
  accion(b,()=>RC.cobroResponder(actual(),POR,t,f||"",a)); };
window.dicePagado=(b)=>{ const t=document.getElementById("resTxt").value.trim();
  accion(b,()=>RC.cobroResponder(actual(),POR,"Dice que ya ha pagado."+(t?" "+t:""),"",null)); };

function pintar(){
  document.getElementById("hs").textContent=NOMBRE+(ES_ADM?" · Administración de clientes":"");
  if(SEL) detalle(); else lista();
}
(()=>{ const v=Q.get("vuelve"); if(!v) return; const a=document.getElementById("volver"); a.style.display="inline-block"; a.href=v;
  a.onclick=(e)=>{ e.preventDefault(); if(history.length>1) history.back(); else location.href=v; }; })();
(async()=>{ try{ await cargar(); pintar(); }
  catch(e){ document.getElementById("app").innerHTML=`<p class="estado">No se han podido cargar los compromisos: ${esc(e.message)}</p>`; } })();
</script>
</body></html>
