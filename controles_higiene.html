<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PNCH · Controles de higiene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────────────────
   Controles de higiene · Preoperativo (Almacén / Producción) y Operativo
   (Calidad). Pensado para tablets en planta: botones grandes, poco texto,
   se usa con guantes. Todo se guarda en Firestore, colección
   "controles_higiene", sin borrar nunca nada (lo exige la normativa).
   ────────────────────────────────────────────────────────────────────── */
:root{
  --pared:#E6ECEA;      /* fondo: azulejo de planta */
  --blanco:#FFFFFF;
  --tinta:#15201D;
  --suave:#5C6B66;
  --linea:#C9D3CF;
  --acero:#0E5E6F;      /* interfaz */
  --aceroL:#DCEBEE;
  --ok:#1C8A4C;         /* conforme: solo para esto */
  --okL:#E2F3E8;
  --nc:#C4302B;         /* no conforme: solo para esto */
  --ncL:#FBE6E4;
  --ambar:#B7790A;
  --ambarL:#FBF0D9;
  --radio:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pared);color:var(--tinta);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:18px;line-height:1.4;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:4px solid #F2B705;outline-offset:2px}
.oculto{display:none!important}
.envol{max-width:980px;margin:0 auto;padding:18px 16px 140px}

/* Cabecera */
.cab{background:var(--acero);color:#fff;padding:14px 16px}
.cab .envol{padding:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cab h1{margin:0;font-size:22px;font-weight:700;flex:1;min-width:200px}
.cab .fecha{font-size:16px;opacity:.85}
.roles{display:flex;gap:6px;background:rgba(255,255,255,.12);padding:5px;border-radius:14px}
.roles button{border:0;background:transparent;color:#fff;padding:10px 14px;border-radius:10px;
  font-size:15px;font-weight:700;opacity:.75;min-height:44px}
.roles button[aria-pressed="true"]{background:#fff;color:var(--acero);opacity:1}

/* Tarjetas grandes de inicio */
.grande{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:18px 0}
.tile{background:var(--blanco);border:3px solid transparent;border-radius:var(--radio);
  padding:26px 22px;text-align:left;min-height:160px;display:flex;flex-direction:column;gap:8px}
.tile .ico{font-size:52px;line-height:1}
.tile b{font-size:26px}
.tile span{color:var(--suave);font-size:16px}
.tile[aria-pressed="true"]{border-color:var(--acero);background:var(--aceroL)}
.tile:active{transform:scale(.99)}

h2{font-size:26px;margin:22px 0 6px}
.nota{color:var(--suave);font-size:16px;margin:0 0 14px}
label.campo{display:block;font-weight:700;margin:18px 0 8px}
input.txt,textarea.txt,select.txt{width:100%;font:inherit;font-size:20px;padding:16px;
  border:2px solid var(--linea);border-radius:14px;background:#fff;color:var(--tinta)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:2px solid var(--linea);background:#fff;border-radius:999px;padding:10px 16px;
  font-size:16px;font-weight:700;min-height:46px}
.chip[aria-pressed="true"]{border-color:var(--acero);background:var(--aceroL);color:var(--acero)}

.btn{border:0;border-radius:16px;padding:18px 22px;font-size:20px;font-weight:700;min-height:64px}
.btn.pri{background:var(--acero);color:#fff}
.btn.pri:disabled{background:#9DB2B7;cursor:default}
.btn.sec{background:#fff;color:var(--acero);border:2px solid var(--acero)}
.btn.ok{background:var(--ok);color:#fff}
.btn.full{width:100%}

/* Zona (sección) del parte */
.zona{background:var(--blanco);border-radius:var(--radio);margin:16px 0;overflow:hidden}
.zona-cab{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:2px solid var(--pared)}
.zona-cab .ico{font-size:34px}
.zona-cab h3{margin:0;font-size:21px;flex:1}
.zona-cab .cuenta{font-weight:700;color:var(--suave);font-size:16px;white-space:nowrap}
.barra{height:8px;background:var(--pared)}
.barra i{display:block;height:100%;background:var(--acero);width:0;transition:width .25s}
.todo-bien{margin:12px 18px 4px;border:2px dashed var(--ok);background:var(--okL);color:var(--ok);
  font-weight:700;font-size:17px;border-radius:14px;padding:12px;width:calc(100% - 36px);min-height:52px}

.punto{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--pared)}
.punto:first-of-type{border-top:0}
.punto .txt{flex:1;font-size:18px}
.punto .extra{display:block;font-size:14px;color:var(--nc);font-weight:700;margin-top:4px}
.punto .extra.ok{color:var(--ok)}
.decide{display:flex;gap:8px;flex-shrink:0}
.sn{width:84px;height:72px;border-radius:16px;border:3px solid var(--linea);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:14px;font-weight:700;color:var(--suave)}
.sn svg{width:30px;height:30px}
.sn.si[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sn.no[aria-pressed="true"]{background:var(--nc);border-color:var(--nc);color:#fff}
.na{border:0;background:none;color:var(--suave);font-size:13px;text-decoration:underline;padding:6px}
.na[aria-pressed="true"]{color:var(--acero);font-weight:700}
.punto.hecho-ok{background:#F6FBF8}
.punto.hecho-nc{background:#FFF7F6}

/* Temperatura */
.temp{display:flex;align-items:center;gap:6px;margin-top:8px}
.temp button{width:52px;height:52px;border-radius:14px;border:2px solid var(--linea);background:#fff;
  font-size:26px;font-weight:700;color:var(--acero)}
.temp output{min-width:92px;text-align:center;font-size:26px;font-weight:700}

/* Barra fija inferior */
.pie{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:2px solid var(--linea);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0))}
.pie .envol{padding:0;display:flex;gap:12px;align-items:center}
.pie .prog{flex:1;font-weight:700;font-size:17px}
.pie .prog small{display:block;font-weight:400;color:var(--suave);font-size:14px}

/* Hoja inferior (no conforme) */
.velo{position:fixed;inset:0;background:rgba(21,32,29,.45);display:flex;align-items:flex-end;
  justify-content:center;z-index:30}
.hoja{background:#fff;width:100%;max-width:720px;border-radius:24px 24px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom,0));max-height:92vh;overflow:auto}
.hoja h3{margin:0 0 4px;font-size:22px;color:var(--nc)}
.sino{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sino button{min-height:64px;border-radius:14px;border:3px solid var(--linea);background:#fff;
  font-size:19px;font-weight:700}
.sino button.si[aria-pressed="true"]{border-color:var(--ok);background:var(--okL);color:var(--ok)}
.sino button.no[aria-pressed="true"]{border-color:var(--nc);background:var(--ncL);color:var(--nc)}

/* Firma */
.firma-caja{background:#fff;border:3px dashed var(--linea);border-radius:var(--radio);position:relative}
.firma-caja canvas{display:block;width:100%;height:220px;touch-action:none;border-radius:var(--radio)}
.firma-caja .guia{position:absolute;left:20px;right:20px;bottom:46px;border-bottom:2px solid var(--linea);
  pointer-events:none}
.firma-caja .vacia{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--suave);pointer-events:none;font-size:18px}

/* Listo */
.listo{text-align:center;padding:40px 10px}
.listo .gran{width:140px;height:140px;border-radius:50%;margin:0 auto 18px;display:flex;
  align-items:center;justify-content:center}
.listo .gran svg{width:80px;height:80px}

/* Calendario del responsable */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.kpi{background:#fff;border-radius:var(--radio);padding:16px 18px}
.kpi b{display:block;font-size:34px;line-height:1.1}
.kpi span{color:var(--suave);font-size:15px}
.cal{background:#fff;border-radius:var(--radio);padding:14px;overflow-x:auto}
.cal table{border-collapse:separate;border-spacing:6px;width:100%;min-width:560px}
.cal th{font-size:14px;color:var(--suave);font-weight:700;text-align:left;padding:0 4px}
.cal td{vertical-align:top}
.dia{width:100%;min-height:96px;border-radius:14px;border:2px solid var(--pared);background:#fff;
  padding:8px;text-align:left;display:flex;flex-direction:column;gap:5px}
.dia .n{font-weight:700;font-size:18px}
.dia.hoy{border-color:var(--acero)}
.dia.futuro{background:transparent;border-style:dashed;opacity:.5}
.marca{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.marca i{width:14px;height:14px;border-radius:5px;flex-shrink:0}
.m-ok i{background:var(--ok)}   .m-ok{color:var(--ok)}
.m-sub i{background:var(--ambar)} .m-sub{color:var(--ambar)}
.m-nc i{background:var(--nc)}   .m-nc{color:var(--nc)}
.m-falta i{background:transparent;border:2px dashed var(--suave)} .m-falta{color:var(--suave)}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;margin:10px 4px 0}

.lista{background:#fff;border-radius:var(--radio);overflow:hidden;margin:12px 0}
.fila{display:flex;gap:12px;align-items:center;padding:16px 18px;border-top:1px solid var(--pared);
  width:100%;text-align:left;background:#fff;border-left:0;border-right:0;border-bottom:0;font-size:17px}
.fila:first-child{border-top:0}
.fila .quien{flex:1}
.fila .quien small{display:block;color:var(--suave);font-size:14px}
.pill{border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--okL);color:var(--ok)}
.pill.nc{background:var(--ncL);color:var(--nc)}
.pill.sub{background:var(--ambarL);color:var(--ambar)}
.pill.rev{background:var(--aceroL);color:var(--acero)}
.pill.pend{background:var(--pared);color:var(--suave)}

.top{background:#fff;border-radius:var(--radio);padding:6px 18px;margin:12px 0}
.top .l{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--pared)}
.top .l:first-child{border-top:0}
.top .l .t{flex:1;font-size:16px}
.top .l .bar{width:120px;height:10px;background:var(--pared);border-radius:5px;overflow:hidden}
.top .l .bar i{display:block;height:100%;background:var(--nc)}

.aviso{background:var(--ambarL);color:#6B4A06;border-radius:14px;padding:14px 16px;margin:12px 0;font-size:16px}
.aviso.err{background:var(--ncL);color:#7E1E1A}
.aviso.ok{background:var(--okL);color:#145E35}

.seg{display:flex;gap:6px;background:#fff;padding:6px;border-radius:16px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:12px;font-size:16px;
  font-weight:700;color:var(--suave);min-height:52px;min-width:110px}
.seg button[aria-pressed="true"]{background:var(--acero);color:#fff}

/* Configuracion */
.cfg-fam{background:#fff;border-radius:var(--radio);margin:14px 0;border:2px solid transparent}
.cfg-fam-cab{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:2px solid var(--pared);flex-wrap:wrap}
.cfg-ico{font-size:30px;width:58px;height:58px;border-radius:14px;border:2px solid var(--linea);background:#fff}
.cfg-fam-cab input{flex:1;min-width:180px}
.mini{min-width:48px;height:48px;border-radius:12px;border:2px solid var(--linea);background:#fff;font-size:20px;
  font-weight:700;color:var(--acero)}
.mini.del{color:var(--nc);border-color:#F1C6C3}
.mini:disabled{opacity:.35;cursor:default}
.cfg-item{display:flex;gap:8px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--pared);flex-wrap:wrap}
.cfg-item input.txt{flex:1;min-width:220px;font-size:17px;padding:12px}
.cfg-opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding-left:2px}
.tog{border:2px solid var(--linea);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;
  color:var(--suave);min-height:44px}
.tog[aria-pressed="true"]{border-color:var(--acero);background:var(--aceroL);color:var(--acero)}
.emojis{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:var(--pared)}
.emojis button{font-size:26px;width:52px;height:52px;border-radius:12px;border:0;background:#fff}
.logo-caja{background:#fff;border:3px dashed var(--linea);border-radius:var(--radio);padding:18px;display:flex;
  gap:16px;align-items:center;flex-wrap:wrap}
.logo-caja img{max-height:90px;max-width:260px;object-fit:contain}

/* Informe imprimible */
#informe{display:none}
@media print{
  body{background:#fff;font-size:11pt}
  body > *:not(#informe){display:none!important}
  #informe{display:block;padding:0}
  #informe h1{font-size:16pt;margin:0 0 4pt}
  #informe table{width:100%;border-collapse:collapse;margin:6pt 0 12pt;font-size:9pt}
  #informe th,#informe td{border:1px solid #999;padding:3pt 4pt;text-align:left;vertical-align:top}
  #informe .bloque{page-break-inside:avoid;margin-bottom:10pt}
  #informe img{height:40pt}
}
@media (max-width:560px){
  body{font-size:17px}
  .punto{flex-wrap:wrap}
  .decide{width:100%;justify-content:flex-end}
  .sn{width:calc(50% - 30px);height:64px}
  .cab h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="cab">

<main class="envol" id="app"></main>

  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7);
}

// Firestore
function aFB(v){
  if(v===null||v===undefined) return {nullValue:null};
  if(typeof v==="boolean") return {booleanValue:v};
  if(typeof v==="number") return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  return {stringValue:String(v)};
}
function deFB(f){
  if(!f) return null;
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.booleanValue!==undefined) return f.booleanValue;
  return null;
}
async function escribir(id,obj,campos){
  const fields={}; Object.keys(obj).forEach(k=>fields[k]=aFB(obj[k]));
  const mask=campos?("?"+campos.map(c=>"updateMask.fieldPaths="+c).join("&")):"";
  const r=await fetch(`${FB}/${COL}/${encodeURIComponent(id)}${mask}`,{method:"PATCH",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});
  if(!r.ok) throw new Error("HTTP "+r.status);
}
async function leerTodos(){
  const out=[]; let tok=null, v=0;
  do{
    const r=await fetch(`${FB}/${COL}?pageSize=300`+(tok?"&pageToken="+encodeURIComponent(tok):""),{cache:"no-store"});
    if(!r.ok) break;
    const j=await r.json();
    (j.documents||[]).forEach(d=>{
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      Object.entries(d.fields||{}).forEach(([k,x])=>o[k]=deFB(x));
      try{ o.items=JSON.parse(o.items||"[]"); }catch(e){ o.items=[]; }
      try{ o.mantenimiento=o.mantenimiento?JSON.parse(o.mantenimiento):null; }catch(e){ o.mantenimiento=null; }
      out.push(o);
    });
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<40);
  return out;
}

// En planta la wifi falla: lo que no se pueda enviar se guarda aquí y se
// reintenta solo. Nunca se pierde un parte firmado.
const COLA="controles_higiene_cola";
function cola(){ try{ return JSON.parse(localStorage.getItem(COLA)||"[]"); }catch(e){ return []; } }
function guardarCola(c){ try{ localStorage.setItem(COLA,JSON.stringify(c)); }catch(e){} }
async function vaciarCola(){
  const c=cola(); if(!c.length) return 0;
  const quedan=[];
  for(const x of c){
    try{
      await escribir(x.id,x.doc);
      let its=[]; try{ its=JSON.parse(x.doc.items||"[]"); }catch(e){}
      avisarCalidad(x.doc,its);
    }catch(e){ quedan.push(x); }
  }
  guardarCola(quedan);
  return c.length-quedan.length;
}

// Aviso a Calidad por email al cerrar un preoperativo
// ═══════════════════════════════════════════════════════════════════════
// Destinatarios: el departamento de Calidad y los que cuelgan de el (Tecnico
// de Calidad), mas quien tenga la tipologia Calidad en su ficha. El buzon
// generico solo se usa si no hay ningun email personal.
const EMAILS_GENERICOS=["info@unitedcaro.com"];
async function leerCol(col){
  const out=[]; let tok=null, v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?"&pageToken="+encodeURIComponent(tok):""));
    if(!r.ok) break;
    const j=await r.json();
    (j.documents||[]).forEach(d=>{
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      Object.entries(d.fields||{}).forEach(([k,x])=>{
        o[k]=x.arrayValue?(x.arrayValue.values||[]).map(deFB):deFB(x);
      });
      out.push(o);
    });
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<20);
  return out;
}
async function emailsCalidad(){
  const [us,pu,deps]=await Promise.all([leerCol("usuarios"),leerCol("portal_users"),leerCol("departamentos")]);
  // Rama de Calidad: el departamento base y sus hijos
  const rama=new Set(["calidad"]);
  let crece=true;
  while(crece){ crece=false;
    deps.forEach(d=>{ if(!rama.has(d._id)&&d.padre&&rama.has(d.padre)){ rama.add(d._id); crece=true; } }); }
  const resp=new Set(["resp_cal"]);
  deps.filter(d=>rama.has(d._id)).forEach(d=>(d.responsableIds||[]).forEach(r=>resp.add(String(r))));
  const ids=new Set();
  [...us,...pu].forEach(u=>{
    if(u.activo===false) return;
    const tip=String(u.tipologia||"").toLowerCase();
    if(tip==="calidad"||rama.has(String(u.departamentoId||""))||resp.has(u._id)||resp.has(String(u.crmId||"")))
      ids.add(String(u.crmId||u._id));
  });
  // Emails de esas personas, en cualquiera de sus fichas
  const emails=new Set();
  [...us,...pu].forEach(u=>{
    if(!u.email) return;
    if([u._id,u.id,u.crmId].filter(Boolean).some(k=>ids.has(String(k)))) emails.add(String(u.email).toLowerCase().trim());
  });
  const personales=[...emails].filter(e=>!EMAILS_GENERICOS.includes(e));
  return personales.length?personales:[...emails];
}
async function avisarCalidad(doc,items){
  if(doc.tipo!=="preoperativo") return;       // el operativo lo hace la propia Calidad
  try{
    const dest=await emailsCalidad();
    if(!dest.length) return;

      +(sin.length?" · "+sin.length+" sin corregir":nc.length?" · "+nc.length+" corregidos":" · todo bien");
    const filasNC=nc.map(i=>`<tr>

    const temps=items.filter(i=>i.temp!=null).map(i=>esc(i.t)+": <b>"+Number(i.temp).toFixed(1)+" °C</b>").join(" · ");
    const html=`<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:620px;margin:0 auto;color:#15201D">
      <div style="background:#0E5E6F;color:#fff;padding:18px 20px;border-radius:14px 14px 0 0">
        <div style="font-size:13px;opacity:.8">Control preoperativo · ${esc(PARTES.preoperativo.edicion)}</div>
        <div style="font-size:21px;font-weight:700;margin-top:2px">${esc(zona)} · ${fechaLarga(doc.fecha)} · ${esc(doc.hora)}</div>

      <div style="border:1px solid #C9D3CF;border-top:none;border-radius:0 0 14px 14px;padding:18px 20px">
        <p style="font-size:20px;margin:0 0 10px"><b style="color:#1C8A4C">${doc.nOK} bien</b>
          ${nc.length?` · <b style="color:#C4302B">${nc.length} mal</b>`:""}${doc.nNA?` · ${doc.nNA} no aplica`:""}</p>
        ${sin.length?`<p style="background:#FBE6E4;color:#7E1E1A;padding:10px 12px;border-radius:10px;margin:0 0 12px">
          ${sin.length} punto${sin.length>1?"s siguen":" sigue"} mal: hay que revisarlo antes de empezar la actividad.</p>`:""}
        ${nc.length?`<table style="width:100%;border-collapse:collapse;margin:6px 0 12px">${filasNC}</table>`:""}
        ${temps?`<p style="font-size:14px;margin:0 0 12px">🌡️ ${temps}</p>`:""}
        ${doc.mantenimiento?`<p style="font-size:14px;margin:0 0 12px">🔧 Ha venido una empresa externa de mantenimiento.</p>`:""}
        <div style="text-align:center;margin-top:16px">
          <a href="https://crmwikuk.vercel.app/controles_higiene.html?rol=calidad" style="display:inline-block;background:#0E5E6F;
            color:#fff;text-decoration:none;padding:12px 26px;border-radius:10px;font-weight:700">Revisar el parte</a></div>
      </div></div>`;
    await fetch("/api/send-email",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({to:dest,subject:asunto,html})});

}

function seccionesDe(tipo,zona){
  return PARTES[tipo].secciones.filter(s=>!s.area||s.area.includes(zona));

function empezarParte(tipo,zona){
  S.tipo=tipo; S.zona=zona; S.resp={}; S.mant=null; S.paso="parte";
  // Las temperaturas empiezan en su valor habitual, para no teclear
  seccionesDe(tipo,zona).forEach(s=>s.items.forEach((it,i)=>{
    if(it.temp!==undefined) S.resp[s.id+"#"+i]={temp:it.temp};
  }));
  const r=recientes().filter(n=>n!==S.nombre); r.unshift(S.nombre);
  try{ localStorage.setItem("ch_nombres",JSON.stringify(r.slice(0,8))); }catch(e){}
  pintar(); window.scrollTo(0,0);
}
function totales(){
  const secs=seccionesDe(S.tipo,S.zona);
  let tot=0, hechos=0, nc=0;
  secs.forEach(s=>s.items.forEach((it,i)=>{
    tot++; const r=S.resp[s.id+"#"+i];
    if(r&&r.e){ hechos++; if(r.e==="nc") nc++; }
  }));
  return {tot,hechos,nc};
}
function pintarParte(){
  const P=PARTES[S.tipo], secs=seccionesDe(S.tipo,S.zona);

    s.items.forEach((it,i)=>{ const k=s.id+"#"+i, r=S.resp[k]||{};

function filaPunto(s,it,i){
  const k=s.id+"#"+i, r=S.resp[k]||{};
  const cls=r.e==="ok"?"hecho-ok":r.e==="nc"?"hecho-nc":"";
  let extra="";
  if(r.e==="nc") extra=`<span class="extra${r.subsanado?" ok":""}">${esc(r.motivo||"No conforme")}${r.nota?": "+esc(r.nota):""} · ${r.subsanado?"corregido":"sin corregir"}</span>`;
  return `<div class="punto ${cls}">
    <div class="txt">${esc(it.t)}${extra}
      ${it.temp!==undefined?`<div class="temp"><button data-t="${k}" data-d="-0.5" aria-label="Bajar">−</button>
        <output>${(r.temp!=null?r.temp:it.temp).toFixed(1)} °C</output>
        <button data-t="${k}" data-d="0.5" aria-label="Subir">+</button></div>`:""}
      ${it.na?`<button class="na" data-na="${k}" aria-pressed="${r.e==="na"}">No aplica</button>`:""}
    </div>
    <div class="decide">
      <button class="sn si" data-k="${k}" data-v="ok" aria-pressed="${r.e==="ok"}">${ICO.si}Bien</button>
      <button class="sn no" data-k="${k}" data-v="nc" aria-pressed="${r.e==="nc"}">${ICO.no}Mal</button>
    </div></div>`;
}
function enlazarPuntos(secs){
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, v=b.dataset.v, r=S.resp[k]||{};
    if(v==="ok"){ S.resp[k]={...r,e:"ok",motivo:"",nota:"",subsanado:false}; repintarPunto(k,secs); }
    else abrirNC(k,secs);
  });
  document.querySelectorAll("[data-na]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.na, r=S.resp[k]||{};
    S.resp[k]={...r,e:r.e==="na"?null:"na"}; repintarPunto(k,secs);
  });
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.t, r=S.resp[k]||{};
    S.resp[k]={...r,temp:Math.round(((r.temp||0)+Number(b.dataset.d))*10)/10};
    repintarPunto(k,secs);
  });
}
function repintarPunto(k,secs){
  const [sid,i]=k.split("#"); const s=secs.find(x=>x.id===sid);
  const cont=$("#z-"+sid); if(!cont) return;
  const filas=cont.querySelectorAll(".punto");
  const tmp=document.createElement("div"); tmp.innerHTML=filaPunto(s,s.items[+i],+i);
  filas[+i].replaceWith(tmp.firstElementChild);
  enlazarPuntos(secs); actualizarProgreso(secs);
}
function actualizarProgreso(secs){
  secs.forEach(s=>{
    let h=0; s.items.forEach((it,i)=>{ if((S.resp[s.id+"#"+i]||{}).e) h++; });
    const c=$("#c-"+s.id), b=$("#b-"+s.id);
    if(c) c.textContent=h+" de "+s.items.length;
    if(b) b.style.width=(h/s.items.length*100)+"%";
  });
  const t=totales();
  const pie=$("#pie"); pie.classList.remove("oculto");
  const falta=t.tot-t.hechos;
  $("#pieIn").innerHTML=`<div class="prog">${t.hechos} de ${t.tot} revisados
      <small>${falta?"Faltan "+falta:"Todo revisado"}${t.nc?" · "+t.nc+" mal":""}</small></div>
    <button class="btn pri" id="aFirma" ${falta?"disabled":""}>Firmar y enviar</button>`;
  $("#aFirma").onclick=()=>{ S.paso="firma"; pintar(); window.scrollTo(0,0); };
}

// No conforme: qué pasa y si se ha corregido
function abrirNC(k,secs){
  const [sid,i]=k.split("#"); const s=secs.find(x=>x.id===sid), it=s.items[+i];
  const r=S.resp[k]||{};
  const st={motivo:r.motivo||"",nota:r.nota||"",subsanado:r.subsanado===true?true:(r.subsanado===false&&r.e==="nc"?false:null)};
  const pinta=()=>{
    $("#capa").innerHTML=`<div class="velo" id="velo"><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hTit">
      <h3 id="hTit">Está mal</h3>
      <p class="nota" style="margin:0 0 6px">${esc(s.nombre)} · ${esc(it.t)}</p>
      <label class="campo" style="margin-top:10px">¿Qué pasa?</label>
      <div class="chips">${MOTIVOS.map(m=>`<button class="chip" data-m="${m}" aria-pressed="${st.motivo===m}">${m}</button>`).join("")}</div>
      <label class="campo" for="ncNota">Explícalo, si hace falta</label>
      <textarea class="txt" id="ncNota" rows="2" placeholder="Ej: falta jabón en el lavamanos 2">${esc(st.nota)}</textarea>
      <label class="campo">¿Se ha corregido ya?</label>
      <div class="sino">
        <button class="si" data-s="1" aria-pressed="${st.subsanado===true}">Sí, corregido</button>
        <button class="no" data-s="0" aria-pressed="${st.subsanado===false}">No, sigue mal</button>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn sec" id="ncCancel" style="flex:1">Cancelar</button>
        <button class="btn pri" id="ncOk" style="flex:2">Guardar</button>
      </div></div></div>`;
    $("#velo").onclick=(e)=>{ if(e.target.id==="velo") cerrar(); };
    document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ st.nota=$("#ncNota").value; st.motivo=b.dataset.m; pinta(); });
    document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ st.nota=$("#ncNota").value; st.subsanado=b.dataset.s==="1"; pinta(); });
    $("#ncCancel").onclick=cerrar;
    $("#ncOk").onclick=()=>{
      st.nota=$("#ncNota").value.trim();
      if(!st.motivo){ aviso("Elige qué pasa","err"); return; }
      if(st.subsanado===null){ aviso("Indica si se ha corregido","err"); return; }
      S.resp[k]={...r,e:"nc",motivo:st.motivo,nota:st.nota,subsanado:st.subsanado};
      cerrar(); repintarPunto(k,secs);
    };
  };
  const cerrar=()=>{ $("#capa").innerHTML=""; };
  pinta();
}

function pintarFirma(){
  const t=totales();
  $("#app").innerHTML=`
    <button class="btn sec" id="volverP" style="min-height:52px;padding:10px 16px;font-size:17px">Volver al parte</button>

      ${t.nc?t.nc+" mal":"todos bien"}</p>
    ${t.nc?`<div class="aviso${Object.values(S.resp).some(r=>r.e==="nc"&&!r.subsanado)?" err":""}">
      ${Object.values(S.resp).filter(r=>r.e==="nc"&&!r.subsanado).length
        ?"Hay puntos que siguen mal. Calidad los verá marcados en rojo al revisar el parte."
        :"Todo lo que estaba mal se ha corregido."}</div>`:""}
    <label class="campo">Firma con el dedo, ${esc(S.nombre)}</label>
    <div class="firma-caja"><canvas id="lienzo"></canvas><div class="guia"></div>
      <div class="vacia" id="vacia">Firma aquí</div></div>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn sec" id="borrarF" style="flex:1">Borrar firma</button>
      <button class="btn ok" id="enviar" style="flex:2" disabled>Enviar parte</button>
    </div>`;
  $("#volverP").onclick=()=>{ S.paso="parte"; pintar(); };
  const cv=$("#lienzo"), ctx=cv.getContext("2d");
  const ajustar=()=>{ const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.scale(dpr,dpr);
    ctx.lineWidth=3; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#15201D"; };
  ajustar();
  let dib=false, trazos=0;
  const pos=(e)=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.onpointerdown=(e)=>{ dib=true; cv.setPointerCapture(e.pointerId); const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  cv.onpointermove=(e)=>{ if(!dib) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
  cv.onpointerup=()=>{ if(!dib) return; dib=false; trazos++; $("#vacia").style.display="none"; $("#enviar").disabled=false; };
  $("#borrarF").onclick=()=>{ ctx.clearRect(0,0,cv.width,cv.height); trazos=0; $("#vacia").style.display=""; $("#enviar").disabled=true; };
  $("#enviar").onclick=()=>enviarParte(cv);
}

async function enviarParte(cv){
  const btn=$("#enviar"); btn.disabled=true; btn.textContent="Enviando…";
  const ahora=new Date(), secs=seccionesDe(S.tipo,S.zona), items=[];
  secs.forEach(s=>s.items.forEach((it,i)=>{
    const r=S.resp[s.id+"#"+i]||{};
    const x={s:s.id,sec:s.nombre,t:it.t,e:r.e||""};
    if(it.temp!==undefined) x.temp=r.temp;
    if(r.e==="nc"){ x.motivo=r.motivo; x.nota=r.nota||""; x.subsanado=!!r.subsanado; }
    items.push(x);
  }));
  // La firma se guarda reducida para no inflar el documento
  const peq=document.createElement("canvas"); peq.width=360; peq.height=120;
  peq.getContext("2d").drawImage(cv,0,0,360,120);
  const hora=String(ahora.getHours()).padStart(2,"0")+":"+String(ahora.getMinutes()).padStart(2,"0");
  const u=sesion();
  const doc={
    tipo:S.tipo, zona:S.zona, fecha:HOY, hora,
    semana:semanaISO(ahora), ano:ahora.getFullYear(), diaSemana:DIAS[ahora.getDay()],
    operario:String(S.nombre).trim(), usuario:u.username||u.id||"",
    items:JSON.stringify(items),
    total:items.length, nOK:items.filter(i=>i.e==="ok").length,
    nNC:items.filter(i=>i.e==="nc").length, nNA:items.filter(i=>i.e==="na").length,
    nSinCorregir:items.filter(i=>i.e==="nc"&&!i.subsanado).length,
    mantenimiento:S.mant?JSON.stringify(S.mant):"",
    firma:peq.toDataURL("image/png"),
    edicionFormulario:PARTES[S.tipo].edicion,
    creadoTs:ahora.toISOString(),
  };
  // Id unico: nunca se sobreescribe un parte anterior
  const id=S.tipo+"_"+S.zona+"_"+HOY+"_"+hora.replace(":","")+"_"+Math.random().toString(36).slice(2,6);
  try{
    await escribir(id,doc);
    S.enviadoOffline=false;
    avisarCalidad(doc,items);
  }catch(e){
    const c=cola(); c.push({id,doc}); guardarCola(c);
    S.enviadoOffline=true;
  }
  S.ultimo={...doc,items};
  S.docs=null;
  S.paso="listo"; pintar(); window.scrollTo(0,0);
}

    const quien=S.nombre||sesion().nombre||"Calidad";
    const cambio={revisadoPor:quien,revisadoTs:new Date().toISOString(),comentarioRevision:com};
    try{
      // Solo se añaden los campos de revision: lo que firmó el operario no se toca

// Responsable: calendario, cifras e informes
// ═══════════════════════════════════════════════════════════════════════
async function pintarResponsable(){
  if(!S.mes){ const d=new Date(); S.mes=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  if(!S.docs){
    $("#app").innerHTML=`<p class="nota" style="padding:40px 0;text-align:center">Leyendo los partes…</p>`;
    try{ S.docs=await leerTodos(); }catch(e){ $("#app").innerHTML=`<div class="aviso err">No se han podido leer los partes: ${esc(e.message)}</div>`; return; }
  }
  const [a,m]=S.mes.split("-").map(Number);
  const delMes=S.docs.filter(d=>String(d.fecha).startsWith(S.mes));
  const filtrados=delMes.filter(d=>S.filtro==="todos"||(S.filtro==="operativo"?d.tipo==="operativo":d.tipo==="preoperativo"&&d.zona===S.filtro));
  const tot=filtrados.reduce((t,d)=>t+(d.total||0),0), ok=filtrados.reduce((t,d)=>t+(d.nOK||0),0);
  const nc=filtrados.reduce((t,d)=>t+(d.nNC||0),0), sinCorr=filtrados.reduce((t,d)=>t+(d.nSinCorregir||0),0);
  const sinRev=filtrados.filter(d=>d.tipo==="preoperativo"&&!d.revisadoPor).length;
  const pct=tot?Math.round(ok/(tot-filtrados.reduce((t,d)=>t+(d.nNA||0),0))*100):null;

  // Lo que más falla
  const cuenta={};
  filtrados.forEach(d=>d.items.forEach(i=>{ if(i.e==="nc"){ const k=i.sec+" · "+i.t; cuenta[k]=(cuenta[k]||0)+1; } }));

  $("#app").innerHTML=`
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px">
      <button class="btn sec" id="mesAnt" style="min-height:52px;padding:8px 18px" aria-label="Mes anterior">‹</button>

      <button class="btn sec" id="mesSig" style="min-height:52px;padding:8px 18px" aria-label="Mes siguiente">›</button>
      ${PERFIL.config?`<button class="btn sec" id="cfgR" style="min-height:52px;padding:8px 18px">⚙️ Configuración</button>`:""}
    </div>
    <div class="seg" style="margin-top:14px" role="group" aria-label="Qué partes ver">
      ${[["todos","Todos"],["almacen","Preop. Almacén"],["produccion","Preop. Producción"],["operativo","Operativo"]]
        .map(([k,t])=>`<button data-f="${k}" aria-pressed="${S.filtro===k}">${t}</button>`).join("")}
    </div>
    <div class="kpis">
      <div class="kpi"><b>${filtrados.length}</b><span>partes registrados</span></div>
      <div class="kpi"><b style="color:${pct==null?"inherit":pct>=95?"var(--ok)":pct>=85?"var(--ambar)":"var(--nc)"}">${pct==null?"—":pct+" %"}</b><span>de puntos conformes</span></div>
      <div class="kpi"><b style="color:${nc?"var(--nc)":"inherit"}">${nc}</b><span>no conformidades${sinCorr?", "+sinCorr+" sin corregir":""}</span></div>
      <div class="kpi"><b style="color:${sinRev?"var(--ambar)":"inherit"}">${sinRev}</b><span>sin revisar por Calidad</span></div>
    </div>
    ${calendario(a,m,delMes)}
    <div class="leyenda">
      <span class="marca m-ok"><i></i>Todo bien</span><span class="marca m-sub"><i></i>Algo mal, corregido</span>
      <span class="marca m-nc"><i></i>Algo sigue mal</span><span class="marca m-falta"><i></i>No se hizo</span>
    </div>
    ${top.length?`<h2>Lo que más falla</h2><div class="top">${top.map(([t,n])=>`
      <div class="l"><span class="t">${esc(t)}</span><span class="bar"><i style="width:${n/maxTop*100}%"></i></span>
      <b style="min-width:28px;text-align:right">${n}</b></div>`).join("")}</div>`:""}

      <button data-inf="dia">Un día</button><button data-inf="semana">Una semana</button>
      <button data-inf="mes">Este mes</button><button data-inf="rango">Entre fechas</button>
    </div>
    <div id="infOpc" style="margin-top:10px"></div>
    <h2>Partes del mes</h2>
    <div class="lista">${filtrados.sort((x,y)=>String(y.creadoTs).localeCompare(String(x.creadoTs))).map(filaDoc).join("")
      ||`<p class="nota" style="padding:18px">No hay partes en este mes.</p>`}</div>`;
  $("#mesAnt").onclick=()=>{ const d=new Date(a,m-2,1); S.mes=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); pintarResponsable(); };
  $("#mesSig").onclick=()=>{ const d=new Date(a,m,1); S.mes=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); pintarResponsable(); };

  if($("#cfgR")) $("#cfgR").onclick=abrirConfig;
  document.querySelectorAll("[data-dia]").forEach(b=>b.onclick=()=>verDia(b.dataset.dia));
  document.querySelectorAll("[data-inf]").forEach(b=>b.onclick=()=>opcionesInforme(b.dataset.inf));

}

function marcaDe(docs,etq){
  if(!docs.length) return `<span class="marca m-falta"><i></i>${etq}</span>`;
  const e=docs.map(estadoDoc);
  const c=e.includes("nc")?"m-nc":e.includes("sub")?"m-sub":"m-ok";
  return `<span class="marca ${c}"><i></i>${etq}</span>`;
}
function calendario(a,m,docs){
  const primero=new Date(a,m-1,1), ultimo=new Date(a,m,0).getDate();
  const semanas=[]; let fila=[null,null,null,null,null];
  for(let d=1; d<=ultimo; d++){
    const f=new Date(a,m-1,d), ds=f.getDay();
    if(ds===0||ds===6){ if(ds===0&&fila.some(x=>x)){ semanas.push(fila); fila=[null,null,null,null,null]; } continue; }
    fila[ds-1]=d;
  }
  if(fila.some(x=>x)) semanas.push(fila);
  const cel=(d)=>{
    if(!d) return `<td></td>`;
    const f=a+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const futuro=f>HOY, del=docs.filter(x=>x.fecha===f);
    const ver=(t,z)=>del.filter(x=>x.tipo===t&&(!z||x.zona===z));
    const marcas=futuro?"":
      (S.filtro==="todos"||S.filtro==="almacen"?marcaDe(ver("preoperativo","almacen"),"Almacén"):"")+
      (S.filtro==="todos"||S.filtro==="produccion"?marcaDe(ver("preoperativo","produccion"),"Producción"):"")+
      (S.filtro==="todos"||S.filtro==="operativo"?marcaDe(ver("operativo"),"Calidad"):"");
    return `<td><button class="dia${f===HOY?" hoy":""}${futuro?" futuro":""}" data-dia="${f}" ${futuro?"disabled":""}
      aria-label="${fechaLarga(f)}"><span class="n">${d}</span>${marcas}</button></td>`;
  };
  return `<div class="cal"><table><thead><tr>${["Lunes","Martes","Miércoles","Jueves","Viernes"].map(x=>`<th>${x}</th>`).join("")}</tr></thead>
    <tbody>${semanas.map(s=>`<tr>${s.map(cel).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function verDia(f){
  const del=(S.docs||[]).filter(x=>x.fecha===f);
  $("#capa").innerHTML=`<div class="velo" id="velo"><div class="hoja" role="dialog" aria-modal="true">
    <h3 style="color:var(--tinta)">${fechaLarga(f)}</h3>
    ${del.length?`<div class="lista" style="margin:12px 0 0">${del.map(filaDoc).join("")}</div>`
      :`<p class="nota">Ese día no se registró ningún parte.</p>`}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn sec" id="dCerrar" style="flex:1">Cerrar</button>
      ${del.length?`<button class="btn pri" id="dInf" style="flex:1">Informe del día</button>`:""}</div>
  </div></div>`;
  $("#velo").onclick=(e)=>{ if(e.target.id==="velo") $("#capa").innerHTML=""; };
  $("#dCerrar").onclick=()=>{ $("#capa").innerHTML=""; };
  if(del.length) $("#dInf").onclick=()=>{ $("#capa").innerHTML=""; informe(f,f); };
  document.querySelectorAll("#capa [data-doc]").forEach(b=>b.onclick=()=>abrirDoc(b.dataset.doc));
}

function opcionesInforme(tipo){
  document.querySelectorAll("[data-inf]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.inf===tipo)));
  const c=$("#infOpc");
  const [a,m]=S.mes.split("-").map(Number);
  if(tipo==="mes"){
    const ini=S.mes+"-01", fin=S.mes+"-"+String(new Date(a,m,0).getDate()).padStart(2,"0");
    c.innerHTML=botonesInforme(ini,fin); enlazarInforme(); return;
  }
  const hoy=HOY;
  c.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
    <label style="flex:1;min-width:180px">${tipo==="rango"?"Desde":tipo==="semana"?"Cualquier día de la semana":"Día"}
      <input class="txt" type="date" id="fIni" value="${hoy}"></label>
    ${tipo==="rango"?`<label style="flex:1;min-width:180px">Hasta<input class="txt" type="date" id="fFin" value="${hoy}"></label>`:""}
    <button class="btn pri" id="fOk">Preparar</button></div><div id="infBtns"></div>`;
  $("#fOk").onclick=()=>{
    let ini=$("#fIni").value, fin=tipo==="rango"?$("#fFin").value:ini;
    if(tipo==="semana"){
      const d=new Date(ini+"T12:00:00"), lun=new Date(d); lun.setDate(d.getDate()-((d.getDay()+6)%7));
      const vie=new Date(lun); vie.setDate(lun.getDate()+4); ini=iso(lun); fin=iso(vie);
    }
    if(fin<ini){ aviso("La fecha final es anterior a la inicial","err"); return; }
    $("#infBtns").innerHTML=botonesInforme(ini,fin); enlazarInforme();
  };
}
function botonesInforme(ini,fin){
  const n=(S.docs||[]).filter(d=>d.fecha>=ini&&d.fecha<=fin).length;
  return `<div class="aviso" style="margin-top:12px">Del ${fechaLarga(ini)} al ${fechaLarga(fin)} · ${n} parte${n===1?"":"s"}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn pri" data-imp="${ini}|${fin}" style="flex:1">Imprimir o guardar PDF</button>
      <button class="btn sec" data-csv="${ini}|${fin}" style="flex:1">Descargar para Excel</button></div>`;
}
function enlazarInforme(){
  document.querySelectorAll("[data-imp]").forEach(b=>b.onclick=()=>{ const [i,f]=b.dataset.imp.split("|"); informe(i,f); });
  document.querySelectorAll("[data-csv]").forEach(b=>b.onclick=()=>{ const [i,f]=b.dataset.csv.split("|"); csv(i,f); });
}
function informe(ini,fin){
  const docs=(S.docs||[]).filter(d=>d.fecha>=ini&&d.fecha<=fin)

  const E=EMPRESA;
  $("#informe").innerHTML=`

      <div style="flex:1">
        ${E.nombre?`<div style="font-size:13pt;font-weight:700">${esc(E.nombre)}</div>`:""}
        <div style="font-size:8.5pt;color:#444">${[E.cif?"CIF "+esc(E.cif):"",esc(E.direccion||""),
          E.registro?"Reg. sanitario "+esc(E.registro):"",esc(E.telefono||""),esc(E.email||"")].filter(Boolean).join(" · ")}</div>
      </div>
    </div>

    ${docs.map(d=>{
      const P=PARTES[d.tipo]||{titulo:d.tipo,edicion:""};
      return `<div class="bloque"><h2 style="font-size:12pt;margin:10pt 0 2pt">${P.titulo} (${esc(d.edicionFormulario||P.edicion)}) ·
        ${(ZONAS[d.zona]||{}).nombre||d.zona} · ${fechaLarga(d.fecha)} ${esc(d.hora)}</h2>
        <p style="margin:0">Responsable de la vigilancia: ${esc(d.operario)}${d.revisadoPor?" · Revisado por "+esc(d.revisadoPor)+" ("+new Date(d.revisadoTs).toLocaleDateString("es-ES")+")":" · Sin revisar"}</p>
        <table><thead><tr><th>Zona</th><th>Punto de control</th><th>Resultado</th><th>Observaciones</th></tr></thead><tbody>
        ${d.items.map(i=>`<tr><td>${esc(i.sec)}</td><td>${esc(i.t)}${i.temp!=null?" ("+Number(i.temp).toFixed(1)+" °C)":""}</td>
          <td>${i.e==="ok"?"V · Conforme":i.e==="nc"?"X · No conforme":"No aplica"}</td>
          <td>${i.e==="nc"?esc(i.motivo)+(i.nota?": "+esc(i.nota):"")+(i.subsanado?" · subsanado":" · SIN SUBSANAR"):""}</td></tr>`).join("")}
        </tbody></table>
        ${d.mantenimiento?`<p>Mantenimiento externo: ${esc(d.mantenimiento.empresa)} · ${esc(d.mantenimiento.tarea)} · ${esc((d.mantenimiento.zonas||[]).join(", "))}</p>`:""}
        ${d.comentarioRevision?`<p>Comentario de Calidad: ${esc(d.comentarioRevision)}</p>`:""}
        ${d.firma?`<p>Firma: <img src="${d.firma}" alt="Firma"></p>`:""}</div>`;
    }).join("")||"<p>No hay partes en este periodo.</p>"}`;
  setTimeout(()=>window.print(),100);
}
function csv(ini,fin){
  const docs=(S.docs||[]).filter(d=>d.fecha>=ini&&d.fecha<=fin);
  const filas=[["Fecha","Hora","Parte","Zona","Rellenado por","Seccion","Punto","Resultado","Temperatura","Motivo","Nota","Subsanado","Revisado por","Fecha revision"]];
  docs.forEach(d=>d.items.forEach(i=>filas.push([d.fecha,d.hora,(PARTES[d.tipo]||{}).titulo||d.tipo,(ZONAS[d.zona]||{}).nombre||d.zona,
    d.operario,i.sec,i.t,i.e==="ok"?"Conforme":i.e==="nc"?"No conforme":"No aplica",i.temp!=null?String(i.temp).replace(".",","):"",
    i.motivo||"",i.nota||"",i.e==="nc"?(i.subsanado?"Si":"No"):"",d.revisadoPor||"",d.revisadoTs?d.revisadoTs.slice(0,10):""])));
  const txt="\uFEFF"+filas.map(f=>f.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  a.download="controles_higiene_"+ini+"_"+fin+".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

// Configuración: empresa y formularios
// ═══════════════════════════════════════════════════════════════════════
// Se guarda en controles_higiene_config/actual. Cada vez que se guarda, la
// version anterior queda archivada (version_<fecha>), porque una auditoria
// puede pedir que formulario estaba vigente en una fecha. Los partes ya
// rellenados guardan el texto de cada punto, asi que cambiar el formulario no
// altera lo que ya se registro.
const COL_CFG="controles_higiene_config";
const EMOJIS=["🚚","🏭","❄️","📦","🚿","🧼","🥼","❤️","🔀","🏷️","💧","🔧","🌡️","🧤","🚪","🧽","🧴","🪣","🗑️","🐀","🧯","⚙️","🧪","🍖","🧂","🔪","⚖️","📋"];

async function cargarConfig(){
  try{
    const r=await fetch(`${FB}/${COL_CFG}/actual`,{cache:"no-store"});
    if(!r.ok) return;
    const j=await r.json(), f=j.fields||{};
    if(f.partes&&f.partes.stringValue){
      const p=JSON.parse(f.partes.stringValue);
      if(p&&p.preoperativo&&p.operativo) PARTES=p;
    }
    if(f.empresa&&f.empresa.stringValue) EMPRESA={...EMPRESA,...JSON.parse(f.empresa.stringValue)};
  }catch(e){}
  pintarLogoCab();
}
function pintarLogoCab(){
  const i=$("#logoCab"); if(!i) return;
  if(EMPRESA.logo){ i.src=EMPRESA.logo; i.style.display=""; } else i.style.display="none";
}
async function guardarConfig(partes,empresa){
  const quien=S.nombre||sesion().nombre||"—", ts=new Date().toISOString();
  // Se archiva la version que habia antes de este cambio
  try{
    const r=await fetch(`${FB}/${COL_CFG}/actual`,{cache:"no-store"});
    if(r.ok){
      const j=await r.json();
      if(j.fields) await fetch(`${FB}/${COL_CFG}/version_${ts.replace(/[:.]/g,"-")}`,{method:"PATCH",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{...j.fields,
          archivadaEl:{stringValue:ts},archivadaPor:{stringValue:quien}}})});
    }
  }catch(e){}
  const body={fields:{partes:{stringValue:JSON.stringify(partes)},empresa:{stringValue:JSON.stringify(empresa)},
    actualizadoEl:{stringValue:ts},actualizadoPor:{stringValue:quien}}};
  const r=await fetch(`${FB}/${COL_CFG}/actual`,{method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error("HTTP "+r.status);
  PARTES=JSON.parse(JSON.stringify(partes)); EMPRESA={...empresa};
  pintarLogoCab();
}

// ── Pantalla ───────────────────────────────────────────────────────────
function abrirConfig(){
  if(!PERFIL.config){ aviso("La configuración solo la puede cambiar el responsable de Calidad","err"); return; }
  S.cfg={partes:JSON.parse(JSON.stringify(PARTES)),empresa:{...EMPRESA},pestana:"empresa",cambios:false,icoAbierto:null};
  S.paso="config"; pintar(); window.scrollTo(0,0);
}
function marcarCambio(){ S.cfg.cambios=true; pieConfig(); }
function pieConfig(){
  const pie=$("#pie"); pie.classList.remove("oculto");
  $("#pieIn").innerHTML=`<div class="prog">${S.cfg.cambios?"Hay cambios sin guardar":"Sin cambios"}
      <small>Se guarda una copia de la versión anterior</small></div>
    <button class="btn sec" id="cfgSalir">${S.cfg.cambios?"Descartar":"Salir"}</button>
    <button class="btn pri" id="cfgGuardar" ${S.cfg.cambios?"":"disabled"}>Guardar cambios</button>`;
  $("#cfgSalir").onclick=()=>{
    if(S.cfg.cambios&&!confirm("Se perderán los cambios. ¿Salir?")) return;
    S.cfg=null; S.paso="inicio"; pintar();
  };
  $("#cfgGuardar").onclick=async()=>{
    const err=validarCfg(); if(err){ aviso(err,"err"); return; }
    const b=$("#cfgGuardar"); b.disabled=true; b.textContent="Guardando…";
    try{
      await guardarConfig(S.cfg.partes,S.cfg.empresa);
      S.cfg.cambios=false; aviso("Configuración guardada","ok"); pieConfig();
    }catch(e){ b.disabled=false; b.textContent="Guardar cambios"; aviso("No se ha podido guardar: "+e.message,"err"); }
  };
}
function validarCfg(){
  for(const k of ["preoperativo","operativo"]){
    const P=S.cfg.partes[k];
    if(!String(P.titulo||"").trim()) return "El "+k+" necesita un título";
    if(!P.secciones.length) return "El "+P.titulo+" necesita al menos una familia";
    for(const sec of P.secciones){
      if(!String(sec.nombre||"").trim()) return "Hay una familia sin nombre en "+P.titulo;
      if(!sec.items.length) return "La familia «"+sec.nombre+"» no tiene ningún punto";
      if(k==="preoperativo"&&(!sec.area||!sec.area.length)) return "Indica a qué área pertenece «"+sec.nombre+"»";
      for(const it of sec.items) if(!String(it.t||"").trim()) return "Hay un punto vacío en «"+sec.nombre+"»";
    }
  }
  return null;
}

function pintarConfig(){
  const C=S.cfg;
  $("#app").innerHTML=`
    <h2>Configuración</h2>
    <div class="seg" role="group" aria-label="Qué configurar">
      ${[["empresa","Empresa"],["preoperativo","Control preoperativo"],["operativo","Control operativo"]]
        .map(([k,t])=>`<button data-tab="${k}" aria-pressed="${C.pestana===k}">${t}</button>`).join("")}
    </div>
    <div id="cfgCuerpo"></div>`;
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ C.pestana=b.dataset.tab; C.icoAbierto=null; pintarConfig(); });
  if(C.pestana==="empresa") pintarCfgEmpresa(); else pintarCfgParte(C.pestana);
  pieConfig();
}

function pintarCfgEmpresa(){
  const E=S.cfg.empresa;
  const campo=(k,t,ph)=>`<label class="campo" for="e_${k}">${t}</label>
    <input class="txt" id="e_${k}" data-e="${k}" value="${esc(E[k]||"")}" placeholder="${ph||""}">`;
  $("#cfgCuerpo").innerHTML=`
    <p class="nota" style="margin-top:14px">Estos datos y el logo salen en la cabecera de los informes.</p>
    <label class="campo">Logo</label>
    <div class="logo-caja">
      ${E.logo?`<img src="${E.logo}" alt="Logo de la empresa">`:`<span class="nota" style="margin:0">Todavía no hay logo</span>`}
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <label class="btn sec" style="display:inline-flex;align-items:center">${E.logo?"Cambiar logo":"Subir logo"}
          <input type="file" id="logoIn" accept="image/*" style="display:none"></label>
        ${E.logo?`<button class="btn sec" id="logoFuera" style="color:var(--nc);border-color:var(--nc)">Quitar</button>`:""}
      </div>
    </div>
    ${campo("nombre","Nombre de la empresa","Ej: United Caro S.L.")}
    ${campo("cif","CIF")}
    ${campo("direccion","Dirección")}
    ${campo("registro","Registro sanitario (RGSEAA)")}
    ${campo("telefono","Teléfono")}
    ${campo("email","Email")}`;
  document.querySelectorAll("[data-e]").forEach(i=>i.oninput=()=>{ E[i.dataset.e]=i.value; marcarCambio(); });
  $("#logoIn").onchange=(ev)=>{
    const f=ev.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        // Se reduce para que el documento no pese: 600 px de ancho como mucho
        const esc=Math.min(1,600/img.width,240/img.height);
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*esc); c.height=Math.round(img.height*esc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        E.logo=c.toDataURL("image/png"); marcarCambio(); pintarCfgEmpresa();
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  const q=$("#logoFuera"); if(q) q.onclick=()=>{ E.logo=""; marcarCambio(); pintarCfgEmpresa(); };
}

function pintarCfgParte(k){
  const P=S.cfg.partes[k], C=S.cfg, esPre=k==="preoperativo";
  const nuevoId=()=>"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  $("#cfgCuerpo").innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px">
      <div><label class="campo" for="pTit">Título</label><input class="txt" id="pTit" value="${esc(P.titulo)}"></div>
      <div><label class="campo" for="pEd">Edición y fecha</label><input class="txt" id="pEd" value="${esc(P.edicion)}" placeholder="Ed.7 · 14/10/2025"></div>
    </div>
    <label class="campo" for="pNorma">Qué hacer si algo está mal</label>
    <input class="txt" id="pNorma" value="${esc(P.norma)}">
    <p class="nota" style="margin-top:10px">Si cambias los puntos de control, actualiza también la edición:
      así en cada parte guardado queda con qué versión del formulario se hizo.</p>
    ${P.secciones.map((sec,si)=>`
      <section class="cfg-fam">
        <div class="cfg-fam-cab">
          <button class="cfg-ico" data-ico="${si}" aria-label="Cambiar icono">${sec.ico||"📋"}</button>
          <input class="txt" data-fnom="${si}" value="${esc(sec.nombre)}" placeholder="Nombre de la familia">
          <button class="mini" data-fmov="${si}|-1" ${si===0?"disabled":""} aria-label="Subir familia">↑</button>
          <button class="mini" data-fmov="${si}|1" ${si===P.secciones.length-1?"disabled":""} aria-label="Bajar familia">↓</button>
          <button class="mini del" data-fdel="${si}" aria-label="Eliminar familia">✕</button>
        </div>
        ${C.icoAbierto===si?`<div class="emojis">${EMOJIS.map(e=>`<button data-emo="${si}|${e}">${e}</button>`).join("")}</div>`:""}
        ${esPre?`<div class="cfg-opts" style="padding:10px 16px;border-bottom:1px solid var(--pared)">
          <span class="nota" style="margin:0">Lo rellena:</span>
          ${["almacen","produccion"].map(z=>`<button class="tog" data-area="${si}|${z}" aria-pressed="${(sec.area||[]).includes(z)}">${ZONAS[z].ico} ${ZONAS[z].nombre}</button>`).join("")}
        </div>`:""}
        ${sec.items.map((it,ii)=>`
          <div class="cfg-item">
            <input class="txt" data-inom="${si}|${ii}" value="${esc(it.t)}" placeholder="Punto de control">
            <button class="mini" data-imov="${si}|${ii}|-1" ${ii===0?"disabled":""} aria-label="Subir">↑</button>
            <button class="mini" data-imov="${si}|${ii}|1" ${ii===sec.items.length-1?"disabled":""} aria-label="Bajar">↓</button>
            <button class="mini del" data-idel="${si}|${ii}" aria-label="Eliminar punto">✕</button>
            <div class="cfg-opts">
              <button class="tog" data-itemp="${si}|${ii}" aria-pressed="${it.temp!==undefined}">🌡️ Temperatura</button>
              ${it.temp!==undefined?`<span class="temp" style="margin:0">
                <button data-tv="${si}|${ii}|-0.5" aria-label="Bajar">−</button>
                <output>${Number(it.temp).toFixed(1)} °C</output>
                <button data-tv="${si}|${ii}|0.5" aria-label="Subir">+</button></span>`:""}
              <button class="tog" data-ina="${si}|${ii}" aria-pressed="${!!it.na}">Permite «No aplica»</button>
            </div>
          </div>`).join("")}
        <div style="padding:12px 16px">
          <button class="btn sec" data-iadd="${si}" style="min-height:52px;font-size:17px;padding:10px 16px">Añadir punto</button>
        </div>
      </section>`).join("")}
    <button class="btn pri full" id="fAdd" style="margin-top:6px">Añadir familia</button>`;

  const reP=()=>{ marcarCambio(); pintarCfgParte(k); };
  $("#pTit").oninput=(e)=>{ P.titulo=e.target.value; marcarCambio(); };
  $("#pEd").oninput=(e)=>{ P.edicion=e.target.value; marcarCambio(); };
  $("#pNorma").oninput=(e)=>{ P.norma=e.target.value; marcarCambio(); };
  document.querySelectorAll("[data-fnom]").forEach(i=>i.oninput=()=>{ P.secciones[+i.dataset.fnom].nombre=i.value; marcarCambio(); });
  document.querySelectorAll("[data-inom]").forEach(i=>i.oninput=()=>{ const [a,b]=i.dataset.inom.split("|").map(Number);
    P.secciones[a].items[b].t=i.value; marcarCambio(); });
  document.querySelectorAll("[data-ico]").forEach(b=>b.onclick=()=>{ const si=+b.dataset.ico;
    C.icoAbierto=C.icoAbierto===si?null:si; pintarCfgParte(k); });
  document.querySelectorAll("[data-emo]").forEach(b=>b.onclick=()=>{ const [si,e]=b.dataset.emo.split("|");
    P.secciones[+si].ico=e; C.icoAbierto=null; reP(); });
  document.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{ const [si,z]=b.dataset.area.split("|");
    const a=P.secciones[+si].area||[]; P.secciones[+si].area=a.includes(z)?a.filter(x=>x!==z):a.concat(z); reP(); });
  document.querySelectorAll("[data-fmov]").forEach(b=>b.onclick=()=>{ const [si,d]=b.dataset.fmov.split("|").map(Number);
    const l=P.secciones; [l[si],l[si+d]]=[l[si+d],l[si]]; reP(); });
  document.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=()=>{ const si=+b.dataset.fdel, sec=P.secciones[si];
    if(!confirm("¿Eliminar la familia «"+sec.nombre+"» y sus "+sec.items.length+" puntos?\n\nLos partes ya guardados no cambian.")) return;
    P.secciones.splice(si,1); reP(); });
  document.querySelectorAll("[data-imov]").forEach(b=>b.onclick=()=>{ const [si,ii,d]=b.dataset.imov.split("|").map(Number);
    const l=P.secciones[si].items; [l[ii],l[ii+d]]=[l[ii+d],l[ii]]; reP(); });
  document.querySelectorAll("[data-idel]").forEach(b=>b.onclick=()=>{ const [si,ii]=b.dataset.idel.split("|").map(Number);
    const it=P.secciones[si].items[ii];
    if(it.t&&!confirm("¿Eliminar «"+it.t+"»?")) return;
    P.secciones[si].items.splice(ii,1); reP(); });
  document.querySelectorAll("[data-itemp]").forEach(b=>b.onclick=()=>{ const [si,ii]=b.dataset.itemp.split("|").map(Number);
    const it=P.secciones[si].items[ii]; if(it.temp!==undefined) delete it.temp; else it.temp=4; reP(); });
  document.querySelectorAll("[data-tv]").forEach(b=>b.onclick=()=>{ const [si,ii,d]=b.dataset.tv.split("|").map(Number);
    const it=P.secciones[si].items[ii]; it.temp=Math.round((Number(it.temp)+d)*10)/10; reP(); });
  document.querySelectorAll("[data-ina]").forEach(b=>b.onclick=()=>{ const [si,ii]=b.dataset.ina.split("|").map(Number);
    const it=P.secciones[si].items[ii]; if(it.na) delete it.na; else it.na=true; reP(); });
  document.querySelectorAll("[data-iadd]").forEach(b=>b.onclick=()=>{ const si=+b.dataset.iadd;
    P.secciones[si].items.push({t:""}); reP();
    const ins=document.querySelectorAll(`[data-inom^="${si}|"]`); const u=ins[ins.length-1]; if(u) u.focus(); });
  $("#fAdd").onclick=()=>{
    P.secciones.push({id:nuevoId(),nombre:"",ico:"📋",area:esPre?["almacen","produccion"]:undefined,items:[{t:""}]});
    reP(); const ins=document.querySelectorAll("[data-fnom]"); const u=ins[ins.length-1];
    if(u){ u.focus(); u.scrollIntoView({block:"center"}); }
  };
}

// ═══════════════════════════════════════════════════════════════════════
// Arranque
// ═══════════════════════════════════════════════════════════════════════
$("#hoyTxt").textContent=fechaLarga(HOY);
vaciarCola();
cargarConfig().finally(()=>cambiarRol(rolInicial()));
</script>
</body>
