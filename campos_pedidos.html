<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campos de pbi_pedidos</title>
<style>
 body{font-family:-apple-system,sans-serif;background:#F8FAFC;margin:0;padding:18px;color:#0F172A}
 h1{font-size:19px;margin:0 0 4px}
 p.sub{font-size:12.5px;color:#64748B;margin:0 0 16px}
 .card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px;
       margin-bottom:11px;font-size:13px}
 pre{background:#F1F5F9;padding:11px;border-radius:9px;font-size:11.5px;overflow-x:auto;
     margin:8px 0 0}
 table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
 th{background:#F1F5F9;text-align:left;padding:8px;font-size:10.5px;color:#64748B;
    text-transform:uppercase}
 td{padding:8px;border-top:1px solid #E2E8F0}
 code{background:#F1F5F9;padding:1px 6px;border-radius:5px;font-size:11.5px}
 .ok{color:#22C55E;font-weight:700}
 .err{padding:14px;background:#FEF2F2;color:#EF4444;border-radius:10px;font-size:13px}
</style></head>
<body>
<h1>🔬 Campos reales de pbi_pedidos</h1>
<p class="sub">Para saber cómo se llaman de verdad las unidades pedidas y servidas.</p>
<div id="app">Leyendo…</div>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  return null;
}
(async()=>{
  const app=document.getElementById("app");
  try{
    const r=await fetch(FB+"/pbi_pedidos?pageSize=25");
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    const docs=(j.documents||[]).map(d=>{
      const o={_id:d.name.split("/").pop()};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      return o;
    });
    if(!docs.length){ app.innerHTML="<p>Sin documentos.</p>"; return; }

    // Todos los campos que aparecen, con un ejemplo de valor
    const campos={};
    docs.forEach(d=>{
      for(const [k,v] of Object.entries(d)){
        if(!campos[k]) campos[k]={n:0,ej:v};
        campos[k].n++;
        if(campos[k].ej===null||campos[k].ej==="") campos[k].ej=v;
      }
    });
    const nums=Object.keys(campos).filter(k=>typeof campos[k].ej==="number");

    let h='<div class="card"><b>Campos numéricos</b> (aquí estarán las unidades)'
      +'<table><thead><tr><th>Campo</th><th>Ejemplo</th><th>Aparece en</th></tr></thead><tbody>'
      +nums.map(k=>'<tr><td><code>'+k+'</code></td><td>'+campos[k].ej
        +'</td><td>'+campos[k].n+'/'+docs.length+'</td></tr>').join("")
      +'</tbody></table></div>';

    h+='<div class="card"><b>Todos los campos</b><table><thead><tr>'
      +'<th>Campo</th><th>Ejemplo</th></tr></thead><tbody>'
      +Object.keys(campos).sort().map(k=>'<tr><td><code>'+k+'</code></td><td>'
        +String(campos[k].ej).slice(0,60)+'</td></tr>').join("")
      +'</tbody></table></div>';

    h+='<div class="card"><b>Una línea completa, en crudo</b>'
      +'<pre>'+JSON.stringify(docs[0],null,1)+'</pre></div>';

    app.innerHTML=h;
  }catch(e){ app.innerHTML='<div class="err">Error: '+e.message+'</div>'; }
})();
</script>
</body></html>
