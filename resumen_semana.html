<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resumen de la semana · CEO</title>
<!-- (oct 2026) RESUMEN DE LA SEMANA PARA EL CEO. Un informe, no una herramienta: se lee de arriba abajo.
     Junta los partes de los comerciales (informes), las actas de los comités (cierres_flujo) y los
     objetivos de la semana siguiente (objetivos_semana) y lo cuenta en claro. Solo lee, no cambia nada. -->
<style>
  :root{--tx:#0F172A;--mu:#64748B;--li:#E5E7EB;--ok:#16A34A;--wa:#D97706;--ko:#DC2626;--bl:#2563EB}
  *{box-sizing:border-box} body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#F4F5F7;color:var(--tx)}
  .w{max-width:640px;margin:0 auto;padding:12px 14px 60px}
  .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px}
  .nav a{text-decoration:none;color:var(--tx);font-weight:800;font-size:20px;padding:0 10px}
  .doc{background:#fff;border:1px solid var(--li);border-radius:16px;padding:20px 18px}
  h1{font-size:22px;margin:0} .fecha{color:var(--mu);font-size:14px;margin:2px 0 14px}
  .frase{font-size:17px;line-height:1.55;background:#F8FAFC;border-left:5px solid var(--tx);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:22px}
  h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:26px 0 8px;padding-top:14px;border-top:2px solid var(--tx)}
  .nota{margin:0;color:var(--mu);font-size:14px}
  .eq{font-size:13px;font-weight:800;color:#fff;background:var(--tx);display:inline-block;padding:2px 10px;border-radius:99px;margin:14px 0 6px}
  .eq.ko{background:var(--ko)} .eq.wa{background:var(--wa)}
  .com{margin:10px 0 0;padding:10px 12px;background:#F8FAFC;border-radius:10px}
  .com b.n{font-size:15.5px} .com .r{color:var(--mu);font-size:13.5px}
  ul{margin:6px 0 0;padding-left:20px} li{margin:4px 0} li.ko{color:var(--ko);font-weight:700} li.wa{color:#92400E}
  .cli{font-weight:700} .q{font-style:italic}
  .tag{font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:6px;color:#fff;margin-right:4px;vertical-align:1px;white-space:nowrap}
  .t-ok{background:var(--ok)} .t-ca{background:var(--bl)} .t-su{background:var(--ko)} .t-po{background:var(--wa)} .t-no{background:var(--mu)} .t-je{background:#7C3AED}
  .num{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .num div{text-align:center;background:#F8FAFC;border-radius:10px;padding:8px 4px} .num b{display:block;font-size:19px} .num small{color:var(--mu);font-size:11.5px}
  .pie{margin-top:16px;font-size:13px;color:var(--mu);text-align:center}
  .btn{font:inherit;font-size:14px;font-weight:800;padding:10px 14px;border-radius:12px;border:1.5px solid var(--tx);background:#fff;cursor:pointer}
  .err{background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:10px;color:#991B1B;font-size:14px;margin:8px 0}
  @media print{body{background:#fff}.nav,.pie{display:none}.doc{border:none;padding:0}}
</style></head><body><div class="w">
<div class="nav"><a href="#" onclick="semana(-1);return false">‹</a><span id="navt">Semana</span><a href="#" onclick="semana(1);return false">›</a></div>
<div class="doc" id="doc"><p class="nota">Leyendo los partes, las actas y los objetivos…</p></div>
<div class="pie"><button class="btn" onclick="window.print()">🖨 Imprimir o guardar en PDF</button></div>
</div>
<script src="/recuperacion_comun.js?v=20261013a"></script>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const P=new URLSearchParams(location.search);
const U=(s)=>String(s||"").toUpperCase().trim();
const N=(s)=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const mismo=(a,b)=>{ a=N(a); b=N(b); return !!(a&&b&&(a===b||(a.length>=5&&b.length>=5&&(a.startsWith(b)||b.startsWith(a))))); };
const esc=(t)=>String(t??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const num=(v)=>{ const n=Number(String(v??"").replace(",",".")); return isFinite(n)?n:0; };
const eur=(n)=>Math.round(Math.abs(num(n))).toLocaleString("es-ES")+" €";
const J=(s,d)=>{ if(s&&typeof s==="object") return s; try{ return JSON.parse(s||""); }catch(e){ return d; } };
const fdia=(s)=>{ if(!s) return ""; const t=Date.parse(String(s).length===10?s+"T12:00:00":s); if(!t) return String(s); const d=new Date(t);
  return ["dom","lun","mar","mié","jue","vie","sáb"][d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"); };
const fhora=(s)=>{ const t=Date.parse(s||""); if(!t) return ""; const d=new Date(t); return fdia(s)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const cap=(s)=>{ s=String(s||"").trim(); return s?s[0].toUpperCase()+s.slice(1):""; };
// Semana ISO
function isoSem(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn); const a=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return {anio:t.getUTCFullYear(),sem:Math.ceil((((t-a)/86400000)+1)/7)}; }
function lunesDe(anio,sem){ const e=new Date(anio,0,4); const l=new Date(e); l.setDate(e.getDate()-((e.getDay()||7)-1)); l.setDate(l.getDate()+(sem-1)*7); l.setHours(0,0,0,0); return l; }
let W=(()=>{ const hoy=new Date(); const w=isoSem(hoy); if(P.get("semana")) return {anio:Number(P.get("anio"))||w.anio,sem:Number(P.get("semana"))};
  if((hoy.getDay()||7)<4){ const d=new Date(hoy); d.setDate(d.getDate()-7); return isoSem(d); } return w; })();
window.semana=(d)=>{ const l=lunesDe(W.anio,W.sem); l.setDate(l.getDate()+7*d); W=isoSem(l); cargar(); };
// Firestore
const val=(f)=>!f?null:f.stringValue!==undefined?f.stringValue:f.doubleValue!==undefined?Number(f.doubleValue):f.integerValue!==undefined?Number(f.integerValue):f.booleanValue!==undefined?f.booleanValue:f.arrayValue?(f.arrayValue.values||[]).map(val):f.mapValue?Object.fromEntries(Object.entries(f.mapValue.fields||{}).map(([k,v])=>[k,val(v)])):null;
async function porSemana(col,sem){
  const r=await fetch(FB+":runQuery",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({structuredQuery:{from:[{collectionId:col}],
    where:{fieldFilter:{field:{fieldPath:"semana"},op:"EQUAL",value:{integerValue:String(sem)}}}}})});
  const j=r.ok?await r.json():[];
  const out=(Array.isArray(j)?j:[]).filter(x=>x.document).map(x=>{ const o={_id:decodeURIComponent(x.document.name.split("/").pop())}; for(const [k,y] of Object.entries(x.document.fields||{})) o[k]=val(y); return o; });
  // Firestore guarda a veces la semana como número decimal: segunda pasada
  if(!out.length){ const r2=await fetch(FB+":runQuery",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({structuredQuery:{from:[{collectionId:col}],
      where:{fieldFilter:{field:{fieldPath:"semana"},op:"EQUAL",value:{doubleValue:sem}}}}})});
    const j2=r2.ok?await r2.json():[];
    (Array.isArray(j2)?j2:[]).filter(x=>x.document).forEach(x=>{ const o={_id:decodeURIComponent(x.document.name.split("/").pop())}; for(const [k,y] of Object.entries(x.document.fields||{})) o[k]=val(y); out.push(o); }); }
  return out.filter(o=>{ const a=Number(o.anio||o.ano); return !a||a===W.anio; });
}
const delEq=(eq)=>!/FRANC|DISTRIB/i.test(String(eq||""));

async function cargar(){
  document.getElementById("navt").textContent="Semana "+W.sem+" · "+fdia(lunesDe(W.anio,W.sem)).slice(4)+" – "+fdia(new Date(lunesDe(W.anio,W.sem).getTime()+5*86400000)).slice(4);
  const doc=document.getElementById("doc"); doc.innerHTML='<p class="nota">Leyendo los partes, las actas y los objetivos de la semana '+W.sem+'…</p>';
  const errs=[];
  const t=async(nombre,p,def)=>{ try{ return await p; }catch(e){ errs.push(nombre+": "+(e.message||e)); return def; } };
  const [panel,informes,flujo,objs,casos,ests]=await Promise.all([
    t("equipos",fetch(`/api/notificar-incidencia?panel=semana&semana=${W.sem}&anio=${W.anio}`,{cache:"no-store"}).then(r=>r.json()),null),
    t("partes",porSemana("informes",W.sem),[]),
    t("actas",porSemana("cierres_flujo",W.sem),[]),
    t("objetivos",porSemana("objetivos_semana",W.sem+1),[]),
    t("recuperación",window.RC?RC.leerCasos():Promise.resolve([]),[]),
    t("estrategias",window.RC&&RC.leerProfundo?RC.leerProfundo("estrategias"):Promise.resolve([]),[]),
  ]);
  try{ pintar({panel,informes:informes.filter(i=>i.estado!=="borrador"),actas:flujo.filter(f=>f.paso==="comite"&&delEq(f.equipo)),objs,casos:casos.filter(c=>delEq(c.equipo)),ests:ests.filter(e=>!e.eliminada),errs}); }
  catch(e){ doc.innerHTML='<div class="err">No se ha podido montar el resumen: '+esc(e.message)+'</div>'; console.error(e); }
}

function pintar(D){
  const {panel,informes,actas,objs,casos,ests,errs}=D;
  // ── La gente: equipos y comerciales (misma lista que el cierre del director) ──
  let equipos=[];
  if(panel&&panel.equipos) equipos=panel.equipos.filter(E=>delEq(E.eq)).map(E=>({eq:E.eq,jefe:E.jefe||E.responsable||"",gente:(E.gente||[]).filter(p=>!p.ausente).map(p=>({nombre:p.nombre,cod:p.cod,id:p.id,eq:E.eq}))}));
  const gente=equipos.flatMap(E=>E.gente);
  const esDe=(p,cod,nom)=>[p.cod,p.id].filter(Boolean).some(x=>U(x)===U(cod))||mismo(p.nombre,nom)||mismo(p.nombre,cod)||mismo(p.cod,nom);
  // Partes y actas que no casan con nadie del panel: se añaden como gente suelta
  const suelto=(cod,nom,eq)=>{ let p=gente.find(p=>esDe(p,cod,nom)); if(p) return p;
    p={nombre:nom||cod,cod,id:cod,eq:eq||"OTROS"}; let E=equipos.find(E=>U(E.eq)===U(p.eq)); if(!E){ E={eq:p.eq,jefe:"",gente:[]}; equipos.push(E); } E.gente.push(p); gente.push(p); return p; };
  informes.forEach(i=>{ i._p=gente.find(p=>esDe(p,i.agente,i.nombre)||(i.uid&&U(p.id)===U(i.uid)))||suelto(i.agente,i.nombre||i.agente,i.equipo); i._R=J(i.respuestas,{})||{}; i._K=J(i.kpis,null); });
  actas.forEach(a=>{ a._p=gente.find(p=>esDe(p,a.agente,a.agenteNombre))||suelto(a.agente,a.agenteNombre||a.agente,a.equipo); a._P=(J(a.puntos,{})||{}); a._pp=a._P.p||{}; });
  const infDe=(p)=>informes.find(i=>i._p===p), actaDe=(p)=>actas.find(a=>a._p===p);
  const casoDe=new Map(casos.map(c=>[c._id,c]));
  const casosDe=(p)=>casos.filter(c=>RC.abierto(c)&&esDe(p,c.agente,c.agenteNombre));
  const objsDe=(p)=>objs.filter(o=>[p.cod,p.id].filter(Boolean).some(x=>U(x)===U(o.agente))||mismo(p.nombre,o.agente)||mismo(p.nombre,o.agenteNombre));
  const nomPunto=(a,k)=>{ const c=k.startsWith("rec:")?casoDe.get(k.slice(4)):null; if(c) return c.nombre||c.cliente;
    for(const s of (a._P.secciones||[])) for(const it of (s.items||[])) if(it.k===k) return it.nom||k; return k.replace(/^[a-z]+:/,""); };
  const perdDe=(k)=>{ const c=k.startsWith("rec:")?casoDe.get(k.slice(4)):null; return c?num(c.perdido):0; };
  const DEC={ok:["t-ok","de acuerdo"],cambia:["t-ca","cambia"],sube:["t-su","te lo sube"],pospone:["t-po","semana que viene"]};
  const lunes=lunesDe(W.anio,W.sem), ini=lunes.getTime()-2*86400000, fin=ini+9*86400000, enSem=(f)=>{ const t=Date.parse(f||""); return t&&t>=ini&&t<=fin; };

  // ── Lo que cada comercial se comprometió en su parte ──
  const compromisos=(p)=>{ const i=infDe(p); if(!i) return null; const R=i._R, out={prio:(R.prioridad||{}).texto||"",como:(R.semana||{}).texto||"",rec:[],cob:[],otros:[]};
    Object.entries(R).forEach(([k,v])=>{ if(!v||typeof v!=="object") return;
      if(k.startsWith("recup:")){ if(v.siguiente||v.archivo) out.rec.push({nom:v.nom||nomPunto({_P:{}},"rec:"+k.slice(6)),perdido:num(v.perdido),t:v.siguiente||"",hecho:[v.hecho,v.respuesta].filter(Boolean).join(" · "),fecha:v.fecha||"",archivo:v.archivo||"",id:k.slice(6)}); }
      else if(k.startsWith("cobro:")){ if(v.accion||v.texto) out.cob.push({nom:v.nom||k.slice(6),t:[v.accion,v.texto].filter(Boolean).join(": "),fecha:v.fecha||""}); }
      else if(/^(promo|muestras|ofertas|estrategias|cliente):/.test(k)){ if(v.accion||v.texto) out.otros.push({tipo:k.split(":")[0],nom:v.nom||k.split(":")[1],t:[v.accion,v.texto].filter(Boolean).join(": ")}); } });
    const K=i._K||{}; ["cobros","muestras","actividad"].forEach(k=>{ const pl=((K[k]||{}).plan||"").trim(); if(pl) out.otros.push({tipo:k,nom:"",t:pl}); });
    return out; };
  // Casos de recuperación de un comercial con compromiso escrito esta semana (parte o ficha)
  const conCompromiso=(c)=>(c.historial||[]).some(h=>h&&!h.sistema&&h.siguiente&&(Number(h.sem)===W.sem||enSem(h.fecha)));

  // ── Cabecera: partes, comités, objetivos ──
  const sinParte=gente.filter(p=>!infDe(p));
  const comEq=equipos.map(E=>({E,hechos:E.gente.filter(p=>actaDe(p)).length,total:E.gente.length}));
  const subidas=[]; actas.forEach(a=>Object.entries(a._pp).forEach(([k,q])=>{ if(q&&q.r==="sube") subidas.push({a,k,q}); }));
  const nObjJefe=objs.length, nObjCom=gente.reduce((t,p)=>{ const c=compromisos(p); return t+(c?c.rec.filter(x=>x.t).length+c.cob.length+c.otros.length+(c.prio?1:0):0); },0);
  const revisados=new Set(); actas.forEach(a=>Object.keys(a._pp).forEach(k=>{ if(k.startsWith("rec:")&&a._pp[k]&&a._pp[k].r) revisados.add(k.slice(4)); }));
  const estPend=ests.filter(e=>e.estado==="pendiente_aprobacion"||e.estado==="pendiente"), archPend=casos.filter(c=>c.estado==="propuesta_archivo");
  const abiertos=casos.filter(c=>RC.abierto(c)&&c.estado!=="propuesta_archivo"), totPerd=abiertos.reduce((t,c)=>t+num(c.perdido),0);
  const li=(cls,h)=>`<li${cls?' class="'+cls+'"':""}>${h}</li>`;

  let h=`<h1>📋 Resumen de la semana ${W.sem}</h1><div class="fecha">Para el CEO · ${fdia(new Date()).slice(0)} · del ${fdia(lunes).slice(4)} al ${fdia(new Date(lunes.getTime()+5*86400000)).slice(4)}</div>`;
  if(errs.length) h+=`<div class="err">No se ha podido leer: ${esc(errs.join(" · "))}. El resumen sale con lo demás.</div>`;
  h+=`<div class="frase"><b>${gente.length-sinParte.length} de ${gente.length}</b> comerciales han hecho el parte${sinParte.length?` (falta${sinParte.length>1?"n":""} <b>${esc(sinParte.map(p=>p.nombre).join(", "))}</b>)`:""}.<br>
    Comités: ${comEq.map(x=>`<b style="color:${x.hechos>=x.total&&x.total?"var(--ok)":x.hechos?"var(--wa)":"var(--ko)"}">${esc(x.E.eq)} ${x.hechos>=x.total&&x.total?"los "+x.total:x.hechos?x.hechos+" de "+x.total:"ninguno de "+x.total}</b>`).join(" · ")||"ninguno"}.<br>
    Se han puesto <b>${nObjCom+nObjJefe} objetivos</b> para la semana ${W.sem+1} (${nObjCom} de los comerciales, ${nObjJefe} de los jefes). ${subidas.length?`<b style="color:var(--ko)">${subidas.length} cosa${subidas.length>1?"s":""} te sube${subidas.length>1?"n":""}</b> para decidir.`:"<b>Nada</b> te sube para decidir."}</div>`;

  // ── 1 · Conclusiones de los comités ──
  h+=`<h2>1 · Conclusiones de los comités</h2><p class="nota">Lo que cada jefe decidió con su comercial. Solo lo que cambia o importa; si no se dice nada, estaba de acuerdo con el parte.</p>`;
  equipos.forEach(E=>{ const hechos=E.gente.filter(p=>actaDe(p));
    if(!hechos.length){ const cs=E.gente.flatMap(casosDe), eu=cs.reduce((t,c)=>t+num(c.perdido),0), top=cs.slice().sort((a,b)=>num(b.perdido)-num(a.perdido)).slice(0,3);
      h+=`<span class="eq ko">${esc(E.eq)}${E.jefe?" · "+esc(E.jefe):""} · ningún comité de ${E.gente.length}</span><div class="com"><ul>`
        +li("ko",`No se ha hecho ningún comité. ${cs.length} clientes en recuperación (−${eur(eu)}) sin revisar${top.length?", entre ellos "+top.map(c=>esc(c.nombre||c.cliente)+" (−"+eur(c.perdido)+")").join(", "):""}.`)
        +(E.gente.filter(p=>infDe(p)).length?li("",`${esc(E.gente.filter(p=>infDe(p)).map(p=>p.nombre).join(", "))} sí hicieron el parte: sus compromisos están en el punto 2, pero nadie los ha revisado.`):"")+`</ul></div>`; return; }
    const jefes=[...new Set(hechos.map(p=>actaDe(p).porNombre).filter(Boolean))];
    const nRev=hechos.reduce((t,p)=>t+Object.values(actaDe(p)._pp).filter(q=>q&&q.r).length,0);
    h+=`<span class="eq${hechos.length<E.gente.length?" wa":""}">${esc(E.eq)}${jefes.length?" · "+esc(jefes.join(", ")):""} · ${hechos.length} de ${E.gente.length} comités · ${nRev} puntos revisados</span>`;
    const sinCambios=[];
    hechos.forEach(p=>{ const a=actaDe(p), pts=Object.entries(a._pp).filter(([k,q])=>q&&q.r), R=(infDe(p)||{})._R||{};
      const dichoDe=(k)=>{ if(k.startsWith("rec:")){ const v=R["recup:"+k.slice(4)]||{}; if(v.siguiente) return v.siguiente; const c=casoDe.get(k.slice(4)); return c&&conCompromiso(c)?((c.historial||[]).slice().reverse().find(x=>x.siguiente)||{}).siguiente:""; }
        if(k.startsWith("cobro:")){ const v=R[k]||{}; return [v.accion,v.texto].filter(Boolean).join(": "); } const v=R[k]||{}; return [v.accion,v.texto].filter(Boolean).join(": "); };
      const items=[];
      pts.forEach(([k,q])=>{ const nom=nomPunto(a,k), perd=perdDe(k), dicho=dichoDe(k), acc=(q.accs||[]);
        const accH=acc.map(y=>` ➕ <b>${esc(y.que||"")}</b> (${esc(y.depNom||y.dep||y.quien||"")}${y.cuando?", para el "+fdia(y.cuando):""}${y.incId?", incidencia enviada":""})`).join("");
        const cab=`<span class="cli">${esc(nom)}</span>${perd?" (−"+eur(perd)+")":""}: `;
        if(q.r==="ok"&&!q.t&&!q.com&&!acc.length){ if(k.startsWith("rec:")&&!dicho&&perd>=5000) items.push(li("wa",`<span class="tag t-ok">ok</span>${cab}de acuerdo… pero el comercial no escribió qué va a hacer. <b>Acuerdo vacío.</b>`)); else sinCambios.push(nom); return; }
        const d=DEC[q.r]||["t-no",q.r];
        items.push(li(q.r==="sube"?"ko":"",`<span class="tag ${d[0]}">${d[1]}</span>${cab}${q.t?`<span class="q">«${esc(q.t)}»</span>`:(q.r==="ok"&&dicho?`<span class="q">«${esc(dicho)}»</span>`:"")}${q.com?` 💬 ${esc(q.com)}`:""}${accH}`)); });
      const g=a._P.gen||{}; const genH=[(g.com||"").trim()?` 💬 ${esc(g.com)}`:"",...((g.accs||[]).map(y=>` ➕ <b>${esc(y.que||"")}</b> (${esc(y.quien||"")})`))].filter(Boolean).join("");
      if(genH) items.push(li("",`<span class="tag t-je">general</span>${genH}`));
      if(items.length) h+=`<div class="com"><b class="n">${esc(p.nombre)}</b> <span class="r">· ${pts.length} punto${pts.length===1?"":"s"} · ${fhora(a.fecha)}${a.porNombre?" · con "+esc(a.porNombre):""}</span><ul>${items.join("")}</ul></div>`;
      else h+=`<div class="com"><b class="n">${esc(p.nombre)}</b> <span class="r">· ${pts.length} punto${pts.length===1?"":"s"} · ${fhora(a.fecha)}</span><ul>${li("",pts.length?"De acuerdo con todo lo que puso en el parte. Sin cambios ni acciones nuevas.":"Comité guardado sin puntos.")}</ul></div>`; });
    const falt=E.gente.filter(p=>!actaDe(p)); if(falt.length) h+=`<div class="com"><ul>${li("ko",`Sin comité: ${esc(falt.map(p=>p.nombre).join(", "))}.`)}</ul></div>`; });

  // ── 2 · Objetivos para la semana que viene ──
  h+=`<h2>2 · Objetivos para la semana ${W.sem+1}</h2><p class="nota">Lo que cada comercial se ha comprometido a hacer: lo que escribió en su parte más lo que le pidió su jefe. Es lo que se le preguntará el jueves que viene.</p>`;
  const cnt={rec:0,cob:0,otros:0}; gente.forEach(p=>{ const c=compromisos(p); if(c){ cnt.rec+=c.rec.filter(x=>x.t).length; cnt.cob+=c.cob.length; cnt.otros+=c.otros.length; } });
  h+=`<div class="num"><div><b>${nObjCom+nObjJefe}</b><small>objetivos</small></div><div><b>${cnt.rec}</b><small>recuperación</small></div><div><b>${cnt.cob}</b><small>cobros</small></div><div><b>${nObjJefe}</b><small>pedidos por<br>los jefes</small></div></div>`;
  equipos.forEach(E=>{ h+=`<span class="eq">${esc(E.eq)}</span>`;
    E.gente.forEach(p=>{ const c=compromisos(p), oj=objsDe(p), a=actaDe(p); const items=[];
      if(c){ if(c.prio) items.push(li("",`<b>Su prioridad:</b> <span class="q">«${esc(c.prio)}»</span>`));
        c.rec.sort((x,y)=>y.perdido-x.perdido).forEach(x=>{ if(x.archivo) items.push(li("wa",`<span class="cli">${esc(x.nom)}</span>${x.perdido?" (−"+eur(x.perdido)+")":""}: pide dejar de insistir · ${esc(x.archivo)}`));
          else items.push(li("",`<span class="cli">${esc(x.nom)}</span>${x.perdido?" (−"+eur(x.perdido)+")":""}: <span class="q">«${esc(x.t)}»</span>${x.fecha?" · antes del "+fdia(x.fecha):""}`)); });
        c.cob.forEach(x=>items.push(li("",`💰 <span class="cli">${esc(x.nom)}</span>: ${esc(x.t)}${x.fecha?" · "+fdia(x.fecha):""}`)));
        c.otros.forEach(x=>items.push(li("",`${({promo:"🏷️",muestras:"📦",ofertas:"📨",estrategias:"💶",cliente:"👤",cobros:"💰 Plan de cobro:",actividad:"👋 Actividad:"})[x.tipo]||"•"} ${x.nom?`<span class="cli">${esc(x.nom)}</span>: `:""}${esc(x.t)}`))); }
      oj.forEach(o=>items.push(li("",`<span class="tag t-je">${/ceo/i.test(o.creadoPorNombre||o.creadoPor||"")?"CEO":"jefe"}</span>${esc(o.texto)}${o.creadoPorNombre?` <span class="r">· ${esc(o.creadoPorNombre)}</span>`:""}`)));
      const nReal=items.length;
      const cs=casosDe(p), grandes=cs.filter(x=>num(x.perdido)>=15000&&!conCompromiso(x)&&!(c&&c.rec.some(r=>r.id===x._id&&r.t)));
      if(grandes.length) items.push(li("wa",`Sin objetivo para ${grandes.map(x=>esc(x.nombre||x.cliente)+" (−"+eur(x.perdido)+")").join(", ")}.`));
      const estado=!c?`<span style="color:var(--ko)">sin parte</span>`:!a?`<span style="color:var(--wa)">sin revisar por su jefe</span>`:"revisado";
      h+=`<div class="com"><b class="n">${esc(p.nombre)}</b> <span class="r">· ${nReal} objetivo${nReal===1?"":"s"} · ${estado}</span>${items.length?`<ul>${items.join("")}</ul>`:(c?`<ul>${li("wa","Hizo el parte pero no se puso ningún objetivo.")}</ul>`:"")}</div>`; }); });

  // ── 3 · Lo que necesita tu decisión ──
  h+=`<h2>3 · Lo que necesita tu decisión</h2><div class="com"><ul>`;
  if(subidas.length) subidas.forEach(({a,k,q})=>{ h+=li("ko",`<span class="cli">${esc(nomPunto(a,k))}</span>${perdDe(k)?" (−"+eur(perdDe(k))+")":""}: ${esc(q.t||q.com||"te lo suben sin más detalle")} <span class="r">· ${esc(a.porNombre||"")} por ${esc(a._p.nombre)}</span>`); });
  else h+=li("","Nada te han subido desde los comités.");
  if(estPend.length) h+=li("",`<b>${estPend.length} estrategia${estPend.length>1?"s":""} de precio</b> pendiente${estPend.length>1?"s":""} de aprobar (${esc([...new Set(estPend.map(e=>e.clienteNombre||e.cliente||"").filter(Boolean))].slice(0,5).join(", "))}${estPend.length>5?"…":""}).`);
  if(archPend.length) h+=li("",`<b>${archPend.length} cliente${archPend.length>1?"s":""}</b> piden dejar de insistir (−${eur(archPend.reduce((t,c)=>t+num(c.perdido),0))}).`);
  h+=`</ul></div>`;

  // ── 4 · Lo que no se ha hecho ──
  const grandesSin=abiertos.filter(c=>num(c.perdido)>=15000&&!conCompromiso(c)&&!(revisados.has(c._id)&&(()=>{ const a=actas.find(a=>a._pp["rec:"+c._id]); const q=a&&a._pp["rec:"+c._id]; return q&&(q.r!=="ok"||q.t||(q.accs||[]).length); })())).sort((a,b)=>num(b.perdido)-num(a.perdido));
  h+=`<h2>4 · Lo que no se ha hecho</h2><div class="com"><ul>`;
  comEq.filter(x=>!x.hechos&&x.total).forEach(x=>{ h+=li("ko",`${esc(x.E.eq)}: ningún comité${x.E.jefe?" ("+esc(x.E.jefe)+")":""}.`); });
  comEq.filter(x=>x.hechos&&x.hechos<x.total).forEach(x=>{ h+=li("wa",`${esc(x.E.eq)}: faltan ${x.total-x.hechos} comités (${esc(x.E.gente.filter(p=>!actaDe(p)).map(p=>p.nombre).join(", "))}).`); });
  if(sinParte.length) h+=li("ko",`Sin parte: ${esc(sinParte.map(p=>p.nombre).join(", "))}.`);
  if(grandesSin.length) h+=li("wa",`${grandesSin.length} cliente${grandesSin.length>1?"s":""} de más de 15.000 € sin ningún compromiso esta semana (−${eur(grandesSin.reduce((t,c)=>t+num(c.perdido),0))}): ${grandesSin.slice(0,8).map(c=>esc(c.nombre||c.cliente)+" ("+esc(c.agenteNombre||c.agente||"")+")").join(", ")}${grandesSin.length>8?" y "+(grandesSin.length-8)+" más":""}.`);
  if(!comEq.some(x=>x.hechos<x.total)&&!sinParte.length&&!grandesSin.length) h+=li("","Todo hecho: partes, comités y compromisos en los clientes grandes.");
  h+=`</ul></div>`;

  // ── 5 · Las cifras ──
  h+=`<h2>5 · Las cifras de la semana</h2><div class="num">
    <div><b>−${eur(totPerd)}</b><small>en recuperación<br>${abiertos.length} clientes</small></div>
    <div><b>${revisados.size}</b><small>revisados<br>en comité</small></div>
    <div><b>${nObjCom+nObjJefe}</b><small>objetivos<br>semana ${W.sem+1}</small></div>
    <div><b>${subidas.length+estPend.length+archPend.length}</b><small>decisiones<br>tuyas pendientes</small></div></div>`;
  h+=`<div class="pie">Sale de los partes (informes), las actas de los comités y los objetivos de la semana ${W.sem+1}. Solo lee, no cambia nada.</div>`;
  document.getElementById("doc").innerHTML=h;
}
cargar();
</script></body></html>
