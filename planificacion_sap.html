<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planificación de fabricación · SAP</title>
<style>
:root{--rojo:#DC2626;--verde:#16A34A;--azul:#2563EB;--amb:#D97706;--muted:#64748B;--line:#E5E7EB}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:#F4F5F7;color:#0F172A}
.w{max-width:1150px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.tab{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}.tab.on{background:#0F172A;color:#fff;border-color:#0F172A}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.card h3{margin:0 0 4px;font-size:15px}
.row{display:grid;grid-template-columns:28px 1.6fr 1.3fr 90px 1.6fr;gap:8px;align-items:center;border-top:1px solid #EEF1F5;padding:8px 0}
.row.h{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;border-top:0}
.c{color:var(--muted);font-size:12px}
.bd{display:inline-block;font-size:11px;font-weight:700;border-radius:7px;padding:1px 6px;background:#F1F5F9;color:#334155;margin-right:3px}
.bd.a{background:#FEF3C7;color:#92400E}.bd.v{background:#DCFCE7;color:#166534}.bd.r{background:#FEE2E2;color:#991B1B}.bd.b{background:#DBEAFE;color:#1E40AF}
input,select,button,textarea{font:inherit}
input,select{padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.btn{font-weight:800;padding:7px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;white-space:nowrap}
.btn.ok{background:var(--verde);color:#fff;border-color:var(--verde)}.btn.dk{background:#0F172A;color:#fff;border-color:#0F172A}.btn.no{color:var(--rojo)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.falta{font-size:11.5px;color:var(--rojo);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0F172A;color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:50}
.bar input,.bar select{background:#1E293B;color:#fff;border-color:#475569}
.msg{padding:9px 12px;border-radius:10px;margin-top:8px;font-weight:700}.msg.ok{background:#DCFCE7;color:#166534}.msg.ko{background:#FEE2E2;color:#991B1B}
.dia{font-weight:800;font-size:13px;margin:14px 0 4px;color:#334155}.dia.tarde{color:var(--rojo)}
.of{display:grid;grid-template-columns:1.4fr 1.3fr 90px 1.6fr;gap:8px;align-items:center;border-top:1px solid #EEF1F5;padding:7px 0}
.mv{display:grid;grid-template-columns:90px 120px 1.6fr 90px 1.2fr 1.2fr;gap:8px;border-top:1px solid #EEF1F5;padding:6px 0;font-size:13px}
@media(max-width:760px){.row,.of,.mv{grid-template-columns:1fr}.row.h{display:none}}
</style></head><body><div class="w">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
  <div><h1>🗓️ Planificación de fabricación</h1><div class="sub">Todo en directo contra SAP · <span id="dbPill" class="bd a"></span> <a href="#" onclick="cambiarDb();return false">cambiar</a> · <span id="estado">conectando…</span></div></div>
  <button class="btn" onclick="cargar()">↻ Actualizar</button>
</div>
<div class="card" id="cardKey" hidden data-old="1" style="display:none"><b>Clave</b> <input id="key" type="password" style="width:320px" placeholder="SAP_PEDIDOS_KEY"> <button class="btn dk" onclick="guardarKey()">Guardar</button></div>
<div class="tabs"><span class="tab on" data-t="sin" onclick="tab('sin')">📥 Sin planificar</span><span class="tab" data-t="plan" onclick="tab('plan')">🗓️ Plan de fabricación</span><span class="tab" data-t="mov" onclick="tab('mov')">🔁 Movimientos de almacén</span><span class="tab" data-t="env" onclick="tab('env')">📨 Mandar a producción</span></div>
<div id="v"></div><div id="msg"></div>
</div>
<div class="bar" id="bar" hidden><b id="barN"></b><span>Fabricar el</span><input type="date" id="pFecha"><span>en</span><select id="pAlm"></select><input id="pNota" placeholder="nota (opcional)" style="width:180px"><button class="btn ok" id="bPlan" onclick="planificar()">🗓️ Planificar</button><span class="falta" id="pFalta" style="color:#FCA5A5"></span></div>
<script>/* pase SAP: lo da el portal al entrar */
(function(){
  // Pase de SAP: lo da el portal al entrar (usuario y contraseña del portal, una vez cada 30 días).
  // Aquí no se pide ninguna contraseña: si falta el pase, se explica y se ofrece salir y volver a entrar.
  var K='sap_pedido_key';
  function get(){ try{ return localStorage.getItem(K)||''; }catch(e){ return ''; } }
  function exp(t){ var m=/^crm\.([A-Za-z0-9_-]+)\./.exec(t||''); if(!m) return 0; try{ return JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))).exp||0; }catch(e){ return 0; } }
  var abierto=false;
  function ventana(motivo){
    if(abierto) return; abierto=true;
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif');
    d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:380px;width:100%;padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.3)">'
      +'<div style="font-weight:800;font-size:18px">🔐 Falta el permiso de SAP</div>'
      +'<div style="font-size:14px;color:#334155;margin:8px 0 14px;line-height:1.45">'+(motivo||'Este aparato todavía no tiene permiso para SAP.')+'<br><br>Sal del portal y vuelve a entrar con tu usuario: el permiso se activa solo y dura 30 días.'+(function(){ var e=''; try{ e=localStorage.getItem('sap_pase_error')||''; }catch(x){} return e?'<div style="margin-top:10px;background:#FEE2E2;color:#991B1B;border-radius:8px;padding:8px;font-weight:700">Último intento: '+String(e).replace(/[<>&]/g,'')+'</div>':''; })()+'</div>'
      +'<button id="sp_out" style="width:100%;font-size:17px;font-weight:800;padding:12px;border:0;border-radius:10px;background:#0F172A;color:#fff">Salir y volver a entrar</button>'
      +'<button id="sp_x" style="width:100%;font-size:15px;font-weight:700;padding:10px;border:0;background:transparent;color:#64748B;margin-top:6px">Ahora no</button></div>';
    document.body.appendChild(d);
    document.getElementById('sp_x').onclick=function(){ d.remove(); abierto=false; };
    document.getElementById('sp_out').onclick=function(){
      try{ localStorage.removeItem(K); localStorage.removeItem('gc_portal_user'); }catch(e){}
      try{ if(window.top&&window.top.doLogout){ window.top.doLogout(); return; } }catch(e){}
      try{ window.top.location.href='/'; }catch(e){ location.href='/'; }
    };
  }
  window.pedirPaseSap=ventana;
  var f0=window.fetch;
  window.fetch=function(u,o){ return f0.apply(this,arguments).then(function(r){ try{ if(r.status===401&&/\/api\/sap-(pedido|factura|produccion|traslado|planificacion)/.test(String(u&&u.url||u))) setTimeout(function(){ ventana(exp(get())?'El permiso guardado ya no vale.':''); },0); }catch(e){} return r; }); };
  if(!(exp(get())>Date.now())){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ ventana(); }); else ventana(); }
})();
</script>
<script>
const API="/api/sap-planificacion";
const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
let DB=LS("plan_db")||"U_CARO_99", KEY=LS("sap_pedido_key")||"", TAB="sin", LIN=[], ORD=[], MOV=[], ALMS=[], SEL={}, TIPOS={}, ESTS={};
const PROD=["1","2","3","6","7"];
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fx=(d)=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7):"—", n=(v)=>(Math.round((Number(v)||0)*1000)/1000).toLocaleString("es-ES");
const HOY=new Date().toISOString().slice(0,10);
function pill(){ const p=document.getElementById("dbPill"); p.textContent=DB+(DB==="U_CARO_00"?" · REAL":" · PRUEBAS"); p.className="bd "+(DB==="U_CARO_00"?"v":"a"); }
window.cambiarDb=()=>{ const v=prompt("Base de SAP: U_CARO_99 (pruebas) o U_CARO_00 (real)",DB); if(v&&/^[A-Z0-9_]+$/i.test(v)){ DB=v.toUpperCase(); LS("plan_db",DB); pill(); cargar(); } };
window.guardarKey=()=>{ KEY=document.getElementById("key").value.trim(); LS("sap_pedido_key",KEY); cargar(); };
async function api(url,opts){ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(DB),Object.assign({headers:{"Content-Type":"application/json","x-crm-key":KEY}},opts||{})); const j=await r.json().catch(()=>({ok:false,error:"sin respuesta"})); if(r.status===401){ document.getElementById("cardKey").hidden=false; throw new Error("clave incorrecta"); } return j; }
function aviso(t,ok){ document.getElementById("msg").innerHTML='<div class="msg '+(ok?'ok':'ko')+'">'+esc(t)+'</div>'; if(ok) setTimeout(()=>{ document.getElementById("msg").innerHTML=""; },6000); }
window.tab=async(t)=>{ TAB=t; document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.dataset.t===t)); if(t==="mov"){ document.getElementById("v").innerHTML='<div class="card c">Cargando movimientos…</div>'; try{ await cargarMov(); }catch(e){ aviso(e.message,false); } } pintar(); };
async function cargar(){ const E=document.getElementById("estado"); E.textContent="cargando…";
  try{ const [a,p,o]=await Promise.all([api(API+"?almacenes=1"),api(API+"?pendientes=1"),api(API+"?plan=1")]);
    if(!a.ok) throw new Error(a.error); ALMS=a.almacenes||[]; LIN=p.lineas||[]; TIPOS=p.tipos||{}; ESTS=p.estados||{}; ORD=o.ordenes||[];
    document.getElementById("cardKey").hidden=true; E.innerHTML='<b style="color:var(--verde)">✓ conectado</b> · '+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
    const s=document.getElementById("pAlm"), prev=LS("plan_alm")||""; s.innerHTML='<option value="">almacén…</option>'+ALMS.map(x=>'<option value="'+esc(x.codigo)+'"'+(x.codigo===prev?' selected':'')+'>'+esc(x.codigo)+'</option>').join("");
    if(TAB==="mov") await cargarMov(); pintar(); }
  catch(e){ E.innerHTML='<b style="color:var(--rojo)">✗ '+esc(e.message)+'</b>'; } }
async function cargarMov(){ const d=Number((document.getElementById("mDias")||{}).value||LS("plan_mdias"))||7, a=((document.getElementById("mAlm")||{}).value)??(LS("plan_malm")||""); const j=await api(API+"?movimientos=1&dias="+d+(a?"&almacen="+encodeURIComponent(a):"")); MOV=j.movimientos||[]; }
function pintar(){ const V=document.getElementById("v"); document.getElementById("bar").hidden=TAB!=="sin";
  if(TAB==="sin") return pintarSin(V); if(TAB==="plan") return pintarPlan(V); if(TAB==="mov") return pintarMov(V); if(TAB==="env") return pintarEnv(V); }
// ── Zona 1: pedidos de producción sin planificar ──
function pintarSin(V){ const L=LIN.filter(l=>PROD.includes(l.tipo)&&!l.ordenes.length&&Number(l.estado)<3);
  const f=LS("plan_ftipo")||""; const LL=L.filter(l=>!f||l.tipo===f);
  const pend=LL.filter(l=>l.estado==="0"||l.estado==="1"), val=LL.filter(l=>l.estado==="2");
  const filtro='<div class="acc" style="margin-top:4px">Centro: '+['',...PROD].map(t=>'<span class="btn'+(f===t?' dk':'')+'" onclick="LS(\'plan_ftipo\',\''+t+'\');pintar()">'+(t?esc(TIPOS[t]):"Todos")+' · '+L.filter(l=>!t||l.tipo===t).length+'</span>').join("")+'</div>';
  const fila=(l,puede)=>{ const k=l.entry+"_"+l.linea, s=SEL[k]; return '<div class="row"><div>'+(puede?'<input type="checkbox" '+(s?'checked':'')+' onchange="sel(\''+k+'\',this.checked)">':'')+'</div>'
    +'<div><b>'+esc(l.articulo)+'</b><div class="c">'+esc(l.descripcion)+'</div></div><div>'+esc(l.nombre)+'<div class="c">Pedido '+esc(l.num)+' · '+esc(l.vendedor)+' · entrega '+fx(l.entrega)+(l.entrega&&l.entrega<HOY?' <b style="color:var(--rojo)">vencida</b>':'')+'</div></div>'
    +'<div>'+(puede?'<input type="number" step="any" min="0" value="'+esc(s?s.uds:l.uds)+'" style="width:84px" oninput="udsSel(\''+k+'\',this.value)">':'<b>'+n(l.uds)+'</b>')+'</div>'
    +'<div><span class="bd b">'+esc(l.tipoN)+'</span><span class="bd '+(l.estado==="2"?'v':'a')+'">'+esc(l.estadoN)+'</span>'+(l.detalle?'<div class="c">💬 '+esc(l.detalle)+'</div>':'')
    +(!puede?'<div class="acc" style="margin-top:4px"><input type="date" id="f_'+k+'" value="'+esc(l.entrega||"")+'" style="width:140px"><button class="btn ok" onclick="validar('+l.entry+','+l.linea+',\''+k+'\')">✓ Validar con esta fecha</button>'+(l.estado==="0"?'<button class="btn" onclick="estado('+l.entry+','+l.linea+',\'1\')">En proceso</button>':'')+'</div>':'')+'</div></div>'; };
  V.innerHTML=filtro
   +'<div class="card"><h3>⏳ Pendientes de validar por producción · '+pend.length+'</h3><div class="c">Producción tiene que validar con una fecha. Hasta que no esté validado no se puede planificar.</div>'+(pend.length?'<div class="row h"><div></div><div>Artículo</div><div>Cliente · pedido</div><div>Uds</div><div>Solicitud</div></div>'+pend.map(l=>fila(l,false)).join(""):'<div class="c" style="padding:8px 0">Ninguno.</div>')+'</div>'
   +'<div class="card"><h3>✅ Validados, sin planificar · '+val.length+'</h3><div class="c">Marca los que quieras fabricar, ajusta las unidades y planifícalos abajo.</div>'+(val.length?'<div class="row h"><div></div><div>Artículo</div><div>Cliente · pedido</div><div>Uds</div><div>Solicitud</div></div>'+val.map(l=>fila(l,true)).join(""):'<div class="c" style="padding:8px 0">Ninguno.</div>')+'</div>';
  barra(); }
window.sel=(k,on)=>{ if(on){ const l=LIN.find(x=>x.entry+"_"+x.linea===k); SEL[k]={entry:l.entry,linea:l.linea,uds:l.uds}; } else delete SEL[k]; barra(); };
window.udsSel=(k,v)=>{ if(SEL[k]) SEL[k].uds=Number(v)||0; barra(); };
function barra(){ const S=Object.values(SEL); document.getElementById("barN").textContent=S.length+" seleccionado(s)"; const f=[]; if(!S.length) f.push("marca algún pedido"); if(!document.getElementById("pFecha").value) f.push("pon el día"); if(!document.getElementById("pAlm").value) f.push("elige almacén"); if(S.some(x=>!(x.uds>0))) f.push("unidades a 0");
  document.getElementById("pFalta").textContent=f.length?"Falta: "+f.join(" · "):""; document.getElementById("bPlan").disabled=f.length>0; }
["pFecha","pAlm"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{ if(id==="pAlm") LS("plan_alm",document.getElementById(id).value); barra(); }));
window.planificar=async()=>{ barra(); if(document.getElementById("bPlan").disabled) return; const b=document.getElementById("bPlan"); b.disabled=true; b.textContent="Creando órdenes…";
  try{ const j=await api(API,{method:"POST",body:JSON.stringify({db:DB,accion:"planificar",fecha:document.getElementById("pFecha").value,almacen:document.getElementById("pAlm").value,nota:document.getElementById("pNota").value,lineas:Object.values(SEL)})});
    if(j.creadas&&j.creadas.length){ SEL={}; } aviso((j.ok?"✅ ":"❌ ")+(j.mensaje||j.error||"")+((j.errores||[]).length?" · "+j.errores.map(e=>e.error).join(" | "):""),j.ok&&!(j.errores||[]).length); await cargar(); }
  catch(e){ aviso(e.message,false); } b.textContent="🗓️ Planificar"; barra(); };
window.validar=async(entry,linea,k)=>{ const f=document.getElementById("f_"+k).value; if(!f){ aviso("Pon la fecha en que estará: es obligatoria",false); return; } await estado(entry,linea,"2",f); };
window.estado=async(entry,linea,est,fecha)=>{ try{ const j=await api(API,{method:"POST",body:JSON.stringify({db:DB,accion:"estado",entry,linea,estado:est,fecha:fecha||""})}); aviso((j.ok?"✅ ":"❌ ")+(j.mensaje||j.error),j.ok); if(j.ok) await cargar(); }catch(e){ aviso(e.message,false); } };
// ── Zona 2: plan de fabricación (órdenes por día) ──
function pintarPlan(V){ const g={}; ORD.forEach(o=>{ const k=o.fecha||"sin fecha"; (g[k]=g[k]||[]).push(o); });
  const dias=Object.keys(g).sort();
  V.innerHTML=!ORD.length?'<div class="card">No hay órdenes planificadas ni liberadas.</div>':dias.map(d=>'<div class="dia'+(d<HOY?' tarde':'')+'">'+(d===HOY?'HOY · ':d<HOY?'⚠️ ATRASADA · ':'')+(d==="sin fecha"?d:new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"2-digit",month:"2-digit"}))+' · '+g[d].length+' orden(es)</div><div class="card" style="margin-top:0">'
    +g[d].map(o=>'<div class="of"><div><b>'+esc(o.articulo)+'</b> <span class="c">OF '+esc(o.num)+'</span><div class="c">'+esc(o.descripcion||"")+'</div></div><div>'+(o.pedido?'Pedido '+esc(o.pedido):'<span class="c">sin pedido</span>')+'<div class="c">'+esc(o.notas||o.cliente||"")+'</div></div><div><b>'+n(o.uds)+'</b>'+(o.hechas?'<div class="c">hechas '+n(o.hechas)+'</div>':'')+'<div class="c">'+esc(o.almacen)+'</div></div>'
      +'<div class="acc"><span class="bd '+(o.estado==="liberada"?'v':'a')+'">'+esc(o.estado)+'</span>'+(o.estado==="planificada"?'<button class="btn ok" onclick="orden('+o.entry+',\'liberar\')">▶ Liberar</button>':'')+'<input type="date" id="of_'+o.entry+'" value="'+esc(o.fecha||"")+'" style="width:140px"><button class="btn" onclick="ordenFecha('+o.entry+')">Cambiar día</button><button class="btn no" onclick="ordenCancelar('+o.entry+')">Cancelar</button></div></div>').join("")+'</div>').join(""); }
window.orden=async(entry,que,extra)=>{ try{ const j=await api(API,{method:"POST",body:JSON.stringify(Object.assign({db:DB,accion:"orden",entry,que},extra||{}))}); aviso((j.ok?"✅ ":"❌ ")+(j.mensaje||j.error),j.ok); if(j.ok) await cargar(); }catch(e){ aviso(e.message,false); } };
window.ordenFecha=(e)=>{ const f=document.getElementById("of_"+e).value; if(!f){ aviso("Pon el día",false); return; } orden(e,"fecha",{fecha:f}); };
window.ordenCancelar=(e)=>{ const m=prompt("Motivo de la cancelación (obligatorio):"); if(!m||!m.trim()){ aviso("Sin motivo no se cancela",false); return; } orden(e,"cancelar",{motivo:m}); };
// ── Zona 3: movimientos de almacén ──
function pintarMov(V){ const a=LS("plan_malm")||"";
  V.innerHTML='<div class="card"><div class="acc">Últimos <select id="mDias" onchange="recMov()">'+[3,7,14,30].map(d=>'<option'+(d===Number(LS("plan_mdias")||7)?' selected':'')+'>'+d+'</option>').join("")+'</select> días · almacén <select id="mAlm" onchange="LS(\'plan_malm\',this.value);recMov()"><option value="">todos</option>'+ALMS.map(x=>'<option'+(x.codigo===a?' selected':'')+'>'+esc(x.codigo)+'</option>').join("")+'</select></div>'
   +(MOV.length?'<div class="mv" style="font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase"><div>Fecha</div><div>Tipo</div><div>Artículo</div><div>Uds</div><div>Almacén</div><div>Lotes / nota</div></div>'+MOV.map(m=>'<div class="mv"'+(m.pendiente?' style="background:#FFFBEB"':'')+'><div>'+fx(m.fecha)+' <span class="c">'+esc(m.num)+'</span></div><div><span class="bd '+(m.tipo==="entrada"?'v':m.tipo==="salida"?'r':'b')+'">'+esc(m.tipo)+(m.produccion?' prod.':'')+'</span>'+(m.pendiente?' <span class="bd a">pendiente</span>':'')+'</div><div><b>'+esc(m.articulo)+'</b> <span class="c">'+esc(m.descripcion||"")+'</span></div><div><b>'+n(m.uds)+'</b></div><div>'+(m.de?esc(m.de)+' → '+esc(m.a):esc(m.alm||""))+'</div><div class="c">'+esc(m.lotes||"")+(m.nota?' · '+esc(m.nota):'')+'</div></div>').join(""):'<div class="c" style="padding:8px 0">Sin movimientos.</div>')+'</div>'; }
window.recMov=async()=>{ LS("plan_mdias",document.getElementById("mDias").value); try{ await cargarMov(); }catch(e){ aviso(e.message,false); } pintarMov(document.getElementById("v")); };
// ── Zona 4: mandar a producción / compras líneas de pedido sin solicitud ──
function pintarEnv(V){ const q=(LS("plan_q")||"").toUpperCase(); const L=LIN.filter(l=>!PROD.includes(l.tipo)&&l.tipo!=="5"&&l.tipo!=="4").filter(l=>!q||(l.articulo+" "+l.descripcion+" "+l.nombre+" "+l.num).toUpperCase().includes(q)).slice(0,150);
  V.innerHTML='<div class="card"><div class="acc"><input id="qEnv" placeholder="Buscar pedido, cliente o artículo" value="'+esc(q)+'" style="width:320px" oninput="LS(\'plan_q\',this.value);clearTimeout(window._tq);window._tq=setTimeout(pintar,300)"> <span class="c">Líneas abiertas sin solicitud a producción/compras · '+L.length+'</span></div>'
   +L.map(l=>{ const k=l.entry+"_"+l.linea; return '<div class="row"><div></div><div><b>'+esc(l.articulo)+'</b><div class="c">'+esc(l.descripcion)+'</div></div><div>'+esc(l.nombre)+'<div class="c">Pedido '+esc(l.num)+' · entrega '+fx(l.entrega)+'</div></div><div><b>'+n(l.uds)+'</b></div>'
     +'<div class="acc"><select id="t_'+k+'"><option value="">¿a quién?</option>'+Object.entries(TIPOS).map(([c,nn])=>'<option value="'+c+'">'+esc(nn)+'</option>').join("")+'</select><input id="d_'+k+'" placeholder="qué hay que hacer *" style="width:170px"><button class="btn dk" onclick="enviar('+l.entry+','+l.linea+',\''+k+'\')">Mandar</button></div></div>'; }).join("")+'</div>'; }
window.enviar=async(entry,linea,k)=>{ const t=document.getElementById("t_"+k).value, d=document.getElementById("d_"+k).value.trim(); const f=[]; if(!t) f.push("a quién"); if(!d) f.push("qué hay que hacer"); if(f.length){ aviso("Falta: "+f.join(" y "),false); return; }
  try{ const j=await api(API,{method:"POST",body:JSON.stringify({db:DB,accion:"enviar",entry,linea,tipo:t,detalle:d})}); aviso((j.ok?"✅ ":"❌ ")+(j.mensaje||j.error),j.ok); if(j.ok) await cargar(); }catch(e){ aviso(e.message,false); } };
pill(); if(!KEY) document.getElementById("cardKey").hidden=false; document.getElementById("pFecha").value=HOY; cargar();
