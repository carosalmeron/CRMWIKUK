<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Obrador · Parte</title>
<style>
:root{--verde:#16A34A;--rojo:#DC2626;--azul:#2563EB;--amb:#D97706;--muted:#475569;--line:#CBD5E1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:20px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;background:#F1F5F9;color:#0F172A;user-select:none}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0F172A;color:#fff;font-weight:800;font-size:18px}
.top .paso{flex:1}.top button{background:transparent;color:#fff;border:2px solid #475569;border-radius:12px;font-size:16px;padding:6px 12px}
.w{max-width:820px;margin:0 auto;padding:14px}
h2{font-size:30px;margin:6px 0 14px}
.big{display:block;width:100%;border:0;border-radius:18px;padding:22px;font-size:26px;font-weight:900;margin:10px 0;cursor:pointer}
.ok{background:var(--verde);color:#fff}.sec{background:#fff;color:#0F172A;border:3px solid var(--line)}.no{background:#FEE2E2;color:#991B1B}
.tile{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px 18px;margin:10px 0;font-size:22px;cursor:pointer}
.tile b{font-size:26px}.tile small{display:block;font-size:17px;color:var(--muted);margin-top:4px}
.tile.sel{border-color:var(--verde);background:#F0FDF4}
input.q{width:100%;font-size:30px;padding:18px;border:3px solid var(--line);border-radius:16px}
.num{font-size:64px;font-weight:900;text-align:center;background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px;min-height:96px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pad button{font-size:38px;font-weight:900;padding:20px 0;border:3px solid var(--line);background:#fff;border-radius:16px}
.comp{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.comp.mal{border-color:var(--rojo);background:#FEF2F2}.comp.bien{border-color:var(--verde)}
.comp .t{font-size:24px;font-weight:900}.comp .s{font-size:17px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:3px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:19px;font-weight:800}
.chip.on{border-color:var(--verde);background:#DCFCE7}
.res{background:#fff;border-radius:18px;padding:16px;margin:10px 0;font-size:20px}
.res div{padding:6px 0;border-bottom:1px solid #E2E8F0}
.aviso{background:#FEF3C7;color:#92400E;border-radius:14px;padding:12px 14px;font-size:18px;font-weight:700;margin:10px 0}
.error{background:#FEE2E2;color:#991B1B;border-radius:14px;padding:14px;font-size:20px;font-weight:800;margin:10px 0}
.cfg label{display:block;font-size:16px;font-weight:800;color:var(--muted);margin:12px 0 4px}
.cfg select,.cfg input{width:100%;font-size:20px;padding:12px;border:3px solid var(--line);border-radius:12px}
.spin{text-align:center;font-size:24px;padding:40px 0;color:var(--muted)}
</style></head><body>
<div class="top"><span class="paso" id="paso">Parte de producción</span><button onclick="atras()" id="bAtras">← Atrás</button><button onclick="ir('cfg')">⚙️</button></div>
<div class="w" id="v"></div>
<script>
const API="/api/sap-produccion";
const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
let CFG={db:LS("obr_db")||"U_CARO_99",alm:LS("obr_alm")||"",key:LS("sap_pedido_key")||"",dias:Number(LS("obr_dias"))||0};
let ALMS=[], P=null, ESC=null, CANT="", COMPS=[], LOTE="", DEST="", PASO="ini", HIST=[], RES=null;
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const r3=(v)=>Math.round((Number(v)||0)*1000)/1000, n=(v)=>r3(v).toLocaleString("es-ES");
const V=(h)=>{ document.getElementById("v").innerHTML=h; window.scrollTo(0,0); };
async function api(url,opts){ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(CFG.db),Object.assign({headers:{"Content-Type":"application/json","x-crm-key":CFG.key}},opts||{})); const j=await r.json().catch(()=>({ok:false,error:"sin respuesta"})); if(r.status===401) throw new Error("La clave no vale: avisa al encargado (⚙️)"); return j; }
const PASOS={ini:"1 · ¿Qué fabricas?",cant:"2 · ¿Cuántos?",comp:"3 · Lo que gastas",lote:"4 · Lote",dest:"5 · ¿Adónde va?",fin:"6 · Comprobar",hecho:"Hecho",cfg:"Ajustes del encargado"};
function ir(p,sinHist){ if(!sinHist&&PASO!==p) HIST.push(PASO); PASO=p; document.getElementById("paso").textContent=PASOS[p]||""; document.getElementById("bAtras").style.visibility=(HIST.length&&p!=="hecho")?"visible":"hidden"; R[p](); }
window.atras=()=>{ const p=HIST.pop(); if(p) ir(p,true); };
const R={};
// ── Ajustes (una vez por tablet: el encargado) ──
R.cfg=()=>V('<div class="cfg"><h2>⚙️ Ajustes</h2><div class="aviso">Esto lo toca solo el encargado.</div>'
  +'<label>Almacén de este obrador</label>'+(ALMS.length?'<select id="cAlm">'+ALMS.map(a=>'<option value="'+esc(a.codigo)+'"'+(a.codigo===CFG.alm?' selected':'')+'>'+esc(a.codigo)+' · '+esc(a.nombre)+'</option>').join("")+'</select>':'<input id="cAlm" value="'+esc(CFG.alm)+'" placeholder="código, p. ej. BAZ03 (pon la clave y guarda para ver la lista)">')
  +'<label>Clave</label><input id="cKey" type="password" value="'+esc(CFG.key)+'">'
  +'<label>Base de SAP</label><select id="cDb"><option'+(CFG.db==="U_CARO_99"?' selected':'')+' value="U_CARO_99">U_CARO_99 · PRUEBAS</option><option'+(CFG.db==="U_CARO_00"?' selected':'')+' value="U_CARO_00">U_CARO_00 · REAL</option></select>'
  +'<label>Días de caducidad del lote (0 = no poner)</label><input id="cDias" type="number" value="'+CFG.dias+'">'
  +'<button class="big ok" onclick="guardarCfg()">Guardar</button></div>');
window.guardarCfg=async()=>{ CFG.alm=String(document.getElementById("cAlm").value||"").trim().toUpperCase(); CFG.key=document.getElementById("cKey").value.trim(); CFG.db=document.getElementById("cDb").value; CFG.dias=Number(document.getElementById("cDias").value)||0;
  LS("obr_alm",CFG.alm); LS("sap_pedido_key",CFG.key); LS("obr_db",CFG.db); LS("obr_dias",String(CFG.dias)); HIST=[]; await arrancar(); };
// ── 1 · Producto ──
let tB=null;
R.ini=()=>{ V('<h2>¿Qué vas a fabricar?</h2><div id="plan"><div class="spin" style="padding:10px">Mirando lo planificado…</div></div><div style="font-size:18px;font-weight:800;color:var(--muted);margin:16px 0 6px">…o búscalo:</div><input class="q" id="q" placeholder="Escribe el código o el nombre" autocomplete="off" oninput="buscar(this.value)"><div id="lista"></div>'
  +(CFG.db!=="U_CARO_00"?'<div class="aviso">Modo PRUEBAS (no cuenta de verdad)</div>':''));
  // Lo que la oficina ha planificado para este obrador hasta hoy (lo atrasado, primero)
  api("/api/sap-planificacion?plan=1&hasta="+new Date().toISOString().slice(0,10)+"&almacen="+encodeURIComponent(CFG.alm)).then(j=>{ const L=(j.ordenes||[]).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))); window._PL=L; const E=document.getElementById("plan"); if(!E) return;
    E.innerHTML=L.length?'<div style="font-size:18px;font-weight:800;color:var(--muted);margin-bottom:6px">📋 Planificado para hoy</div>'+L.map((o,i)=>'<button class="tile" style="border-color:'+(o.fecha<new Date().toISOString().slice(0,10)?'var(--rojo)':'var(--azul)')+'" onclick="elegirPlan('+i+')"><b>'+esc(o.articulo)+' · '+n(o.uds-(o.hechas||0))+'</b><small>'+esc(o.descripcion||"")+(o.pedido?' · pedido '+esc(o.pedido):'')+(o.fecha<new Date().toISOString().slice(0,10)?' · <b style="color:var(--rojo)">ATRASADA</b>':'')+'</small></button>').join(""):''; }).catch(()=>{ const E=document.getElementById("plan"); if(E) E.innerHTML=""; }); };
window.elegirPlan=async(i)=>{ const o=window._PL[i]; P={codigo:o.articulo,nombre:o.descripcion}; V('<div class="spin">Cargando la receta…</div>');
  try{ const j=await api(API+"?escandallo="+encodeURIComponent(o.articulo)); ESC=j.ok?j.escandallo:null; }catch(e){ ESC=null; }
  if(!ESC||!(ESC.componentes||[]).length){ V('<div class="error">Sin receta en SAP. Avisa al encargado.</div><button class="big sec" onclick="ir(\'ini\')">Volver</button>'); return; }
  window._REINT={p:o.articulo,o:o.entry,s:0}; CANT=String(Math.max(0,(o.uds||0)-(o.hechas||0))).replace(".",","); ir("cant"); };
window.buscar=(v)=>{ clearTimeout(tB); if(v.trim().length<2){ document.getElementById("lista").innerHTML=""; return; }
  tB=setTimeout(async()=>{ try{ const j=await api(API+"?articulos="+encodeURIComponent(v)); const L=(j.articulos||[]).filter(a=>a.porLotes);
    document.getElementById("lista").innerHTML=L.map((a,i)=>'<button class="tile" onclick="elegir('+i+')"><b>'+esc(a.codigo)+'</b><small>'+esc(a.nombre)+(a.conEscandallo?' · ✅ con receta':'')+'</small></button>').join("")||'<div class="aviso">No encuentro nada. Prueba con otra palabra.</div>'; window._L=L; }catch(e){ document.getElementById("lista").innerHTML='<div class="error">'+esc(e.message)+'</div>'; } },400); };
window.elegir=async(i)=>{ P=window._L[i]; V('<div class="spin">Cargando la receta…</div>');
  try{ const j=await api(API+"?escandallo="+encodeURIComponent(P.codigo)); ESC=j.ok?j.escandallo:null; }catch(e){ ESC=null; }
  if(!ESC||!(ESC.componentes||[]).length){ V('<h2>'+esc(P.codigo)+'</h2><div class="error">Este artículo no tiene receta (escandallo) en SAP. Avisa al encargado.</div><button class="big sec" onclick="ir(\'ini\')">Elegir otro</button>'); return; }
  CANT=""; ir("cant"); };
// ── 2 · Cantidad (teclado grande) ──
R.cant=()=>V('<h2>¿Cuántos <u>'+esc(P.codigo)+'</u> has hecho?</h2><div class="num" id="num">'+(CANT||"0")+'</div>'
  +'<div class="pad">'+["1","2","3","4","5","6","7","8","9",",","0","⌫"].map(k=>'<button onclick="tecla(\''+k+'\')">'+k+'</button>').join("")+'</div>'
  +'<button class="big ok" onclick="okCant()">Siguiente →</button>');
window.tecla=(k)=>{ if(k==="⌫") CANT=CANT.slice(0,-1); else if(k===","){ if(!CANT.includes(",")) CANT=(CANT||"0")+","; } else if(CANT.length<8) CANT+=k; document.getElementById("num").textContent=CANT||"0"; };
window.okCant=async()=>{ const c=Number(String(CANT).replace(",",".")); if(!(c>0)){ alert("Pon cuántos has hecho"); return; }
  V('<div class="spin">Calculando lo que gastas…</div>');
  const base=ESC.cantidadBase||1;
  COMPS=ESC.componentes.map(x=>({articulo:x.articulo,nombre:x.nombre,uds:r3(x.cantidadBase/base*c),porLotes:x.porLotes,porAlmacen:x.porAlmacen||{},almacen:CFG.alm,lotes:[],disp:[]}));
  // Lotes: se eligen solos, primero los que caducan antes (el operario solo comprueba)
  await Promise.all(COMPS.map(async(x)=>{ if(!x.porLotes) return; try{ const j=await api(API+"?lotes="+encodeURIComponent(x.articulo)+"&almacen="+encodeURIComponent(x.almacen)); x.disp=(j.lotes||[]).filter(l=>l.cantidad==null||l.cantidad>0); autoLotes(x); }catch(e){} }));
  ir("comp"); };
function autoLotes(x){ x.lotes=[]; let falta=x.uds; for(const l of x.disp){ if(falta<=0) break; const q=l.cantidad==null?falta:Math.min(l.cantidad,falta); x.lotes.push({lote:l.lote,uds:r3(q)}); falta=r3(falta-q); } }
const libreEn=(x)=>Number((x.porAlmacen||{})[x.almacen])||0;
const compOk=(x)=>libreEn(x)>=x.uds-0.0005&&(!x.porLotes||Math.abs(x.lotes.reduce((t,l)=>t+l.uds,0)-x.uds)<0.0005);
// ── 3 · Componentes ──
R.comp=()=>{ const malos=COMPS.filter(x=>!compOk(x)).length;
  V('<h2>Esto es lo que gastas</h2>'+(malos?'<div class="error">⚠️ '+malos+' con problema: tócalo para arreglarlo o avisa al encargado</div>':'<div class="aviso" style="background:#DCFCE7;color:#166534">Todo bien. Comprueba los lotes y sigue.</div>')
  +COMPS.map((x,i)=>'<div class="comp '+(compOk(x)?'bien':'mal')+'"><div class="t">'+(compOk(x)?'✅ ':'❌ ')+esc(x.nombre||x.articulo)+'</div><div class="s">'+esc(x.articulo)+' · <b style="font-size:22px;color:#0F172A">'+n(x.uds)+'</b> · almacén '+esc(x.almacen)+'</div>'
    +(libreEn(x)<x.uds-0.0005?'<div class="s" style="color:var(--rojo);font-weight:800">Aquí solo hay '+n(libreEn(x))+'. Tócalo para cogerlo de otro almacén:</div><div class="chips">'+Object.keys(x.porAlmacen).filter(k=>x.porAlmacen[k]>0).map(k=>'<button class="chip" onclick="otroAlm('+i+',\''+esc(k)+'\')">'+esc(k)+' · '+n(x.porAlmacen[k])+'</button>').join("")+'</div>':'')
    +(x.porLotes?'<div class="s" style="margin-top:6px">Lote:</div><div class="chips">'+x.disp.slice(0,8).map(l=>{ const u=x.lotes.find(y=>y.lote===l.lote); return '<button class="chip'+(u?' on':'')+'" onclick="togLote('+i+',\''+esc(l.lote).replace(/'/g,"")+'\')">'+esc(l.lote)+(u?' · '+n(u.uds):'')+'</button>'; }).join("")+(x.disp.length?'':'<span class="s" style="color:var(--rojo)">No hay lotes en este almacén</span>')+'</div>':'')
    +'</div>').join("")
  +'<button class="big ok" onclick="okComp()">Siguiente →</button>'); };
window.otroAlm=async(i,a)=>{ const x=COMPS[i]; x.almacen=a; x.disp=[]; x.lotes=[]; V('<div class="spin">Buscando lotes…</div>'); try{ const j=await api(API+"?lotes="+encodeURIComponent(x.articulo)+"&almacen="+encodeURIComponent(a)); x.disp=(j.lotes||[]).filter(l=>l.cantidad==null||l.cantidad>0); autoLotes(x); }catch(e){} R.comp(); };
window.togLote=(i,lote)=>{ const x=COMPS[i]; const k=x.lotes.findIndex(y=>y.lote===lote);
  if(k>=0) x.lotes.splice(k,1); else { const l=x.disp.find(y=>y.lote===lote); const falta=r3(x.uds-x.lotes.reduce((t,y)=>t+y.uds,0)); if(falta<=0){ x.lotes=[]; } const f2=r3(x.uds-x.lotes.reduce((t,y)=>t+y.uds,0)); x.lotes.push({lote,uds:r3(l&&l.cantidad!=null?Math.min(l.cantidad,f2):f2)}); }
  R.comp(); };
window.okComp=()=>{ const m=COMPS.find(x=>!compOk(x)); if(m){ alert("Falta arreglar: "+(m.nombre||m.articulo)); return; } if(!LOTE) LOTE=loteSugerido(); ir("lote"); };
// ── 4 · Lote nuevo ──
function loteSugerido(){ const d=new Date(), y=String(d.getFullYear()).slice(2), m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0"), hh=String(d.getHours()).padStart(2,"0"), mi=String(d.getMinutes()).padStart(2,"0"); return y+"P."+m+dd+hh+mi; }
R.lote=()=>V('<h2>Lote de lo que has hecho</h2><div class="num" style="font-size:44px">'+esc(LOTE)+'</div><div class="aviso">Escribe este número en la etiqueta.</div>'
  +'<button class="big sec" onclick="cambiarLote()">✏️ Cambiar el número</button><button class="big ok" onclick="ir(\'dest\')">Siguiente →</button>');
window.cambiarLote=()=>{ const v=prompt("Número de lote:",LOTE); if(v&&v.trim()){ LOTE=v.trim().toUpperCase(); R.lote(); } };
// ── 5 · Destino ──
R.dest=()=>V('<h2>¿Adónde va?</h2><button class="tile'+(!DEST?' sel':'')+'" onclick="DEST=\'\';ir(\'fin\')"><b>Se queda aquí</b><small>'+esc(CFG.alm)+'</small></button>'
  +ALMS.filter(a=>a.codigo!==CFG.alm&&/^(BA01|EX43|DR01|BAZ01)$/i.test(a.codigo)).map(a=>'<button class="tile'+(DEST===a.codigo?' sel':'')+'" onclick="DEST=\''+esc(a.codigo)+'\';ir(\'fin\')"><b>Llevar a '+esc(a.codigo)+'</b><small>'+esc(a.nombre)+'</small></button>').join("")
  +'<details style="margin-top:10px;font-size:18px"><summary>Otro almacén…</summary>'+ALMS.filter(a=>a.codigo!==CFG.alm).map(a=>'<button class="tile" onclick="DEST=\''+esc(a.codigo)+'\';ir(\'fin\')"><b>'+esc(a.codigo)+'</b><small>'+esc(a.nombre)+'</small></button>').join("")+'</details>');
// ── 6 · Resumen y terminar ──
R.fin=()=>V('<h2>Comprueba y termina</h2><div class="res"><div>Has hecho <b>'+n(Number(String(CANT).replace(",",".")))+'</b> de <b>'+esc(P.codigo)+'</b></div><div>Lote <b>'+esc(LOTE)+'</b></div><div>Gastas: '+COMPS.map(x=>esc(x.nombre||x.articulo)+' <b>'+n(x.uds)+'</b>').join(" · ")+'</div><div>'+(DEST?'Va a <b>'+esc(DEST)+'</b> (se pide el traslado)':'Se queda en <b>'+esc(CFG.alm)+'</b>')+'</div></div>'
  +(CFG.db!=="U_CARO_00"?'<div class="aviso">PRUEBAS: no cuenta de verdad</div>':'')
  +'<button class="big ok" id="bFin" onclick="terminar()" style="padding:30px;font-size:32px">✅ TERMINAR</button><div id="err"></div>');
window.terminar=async()=>{ const b=document.getElementById("bFin"); b.disabled=true; b.textContent="Guardando en SAP…";
  const hoy=new Date().toISOString().slice(0,10); let cad=""; if(CFG.dias>0){ const d=new Date(); d.setDate(d.getDate()+CFG.dias); cad=d.toISOString().slice(0,10); }
  const body={db:CFG.db,parte:{ordenEntry:window._REINT&&window._REINT.p===P.codigo?window._REINT.o:0,salidaHecha:window._REINT&&window._REINT.p===P.codigo?window._REINT.s||0:0,
    producto:P.codigo,cantidad:Number(String(CANT).replace(",",".")),almacen:CFG.alm,fecha:hoy,loteNuevo:LOTE,fabricacion:hoy,caducidad:cad,cerrar:true,trasladoA:DEST,comentario:"Parte del obrador",
    componentes:COMPS.map(x=>({articulo:x.articulo,uds:x.uds,almacen:x.almacen,lotes:x.lotes}))}};
  try{ const j=await api(API,{method:"POST",body:JSON.stringify(body)});
    if(j.ok){ window._REINT=null; RES=j; HIST=[]; ir("hecho"); return; }
    if(j.ordenParaReintentar) window._REINT={p:P.codigo,o:j.ordenParaReintentar,s:j.salidaParaReintentar||0};
    document.getElementById("err").innerHTML='<div class="error">No se ha guardado: '+esc(j.error||"error")+'<br><br>Avisa al encargado. Puedes darle otra vez a TERMINAR cuando esté arreglado (no se duplica).</div>'; }
  catch(e){ document.getElementById("err").innerHTML='<div class="error">'+esc(e.message)+'</div>'; }
  b.disabled=false; b.textContent="✅ TERMINAR"; };
R.hecho=()=>V('<div style="text-align:center;font-size:96px">✅</div><h2 style="text-align:center">¡Hecho!</h2><div class="res"><div>Producción <b>'+esc(RES.orden&&RES.orden.DocumentNumber)+'</b></div><div>Lote <b>'+esc(LOTE)+'</b> · '+n(Number(String(CANT).replace(",",".")))+' uds</div>'+(RES.solicitudTraslado?'<div>Traslado pedido a <b>'+esc(RES.solicitudTraslado.destino)+'</b></div>':'')+(RES.avisoTraslado?'<div style="color:var(--rojo)">'+esc(RES.avisoTraslado)+'</div>':'')+'</div>'
  +'<button class="big ok" onclick="nuevo()">➕ Otro parte</button>');
window.nuevo=()=>{ P=null; ESC=null; CANT=""; COMPS=[]; LOTE=""; DEST=""; RES=null; HIST=[]; ir("ini",true); };
async function arrancar(){ V('<div class="spin">Conectando…</div>');
  try{ const j=await api(API+"?almacenes=1"); if(!j.ok) throw new Error(j.error||"error"); ALMS=j.almacenes||[];
    if(!CFG.alm||!CFG.key){ HIST=[]; ir("cfg",true); return; } HIST=[]; ir("ini",true); }
  catch(e){ V('<div class="error">'+esc(e.message)+'</div><button class="big sec" onclick="ir(\'cfg\')">⚙️ Ajustes</button>'); } }
arrancar();
</script><script>(function(){ if(!/[?&]menu=1/.test(location.search)) return; var b=document.createElement('a'); b.href='produccion_menu.html'; b.textContent='← Producción'; b.setAttribute('style','display:block;background:#0F172A;color:#fff;font:700 14px system-ui,sans-serif;padding:9px 14px;text-decoration:none'); document.body.insertBefore(b,document.body.firstChild); })();</script>
</body></html>
