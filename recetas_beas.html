<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recetas de beas a SAP</title>
<style>
:root{--t:#0F172A;--g:#64748B;--l:#E2E8F0;--v:#15803D;--vb:#DCFCE7;--r:#B91C1C;--rb:#FEE2E2;--a:#B45309;--ab:#FEF3C7;--z:#1D4ED8;--zb:#DBEAFE}
*{box-sizing:border-box}body{margin:0;font:19px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:#F1F5F9;color:var(--t)}
.top{background:#fff;border-bottom:1px solid var(--l);padding:12px 16px;position:sticky;top:0;z-index:5}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:26px;margin:0;flex:1}
.pill{font-size:14px;font-weight:800;border-radius:99px;padding:5px 12px;border:0}.pv{background:var(--rb);color:var(--r)}.pp{background:var(--ab);color:var(--a)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.dias{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.dia{font:inherit;font-weight:800;font-size:17px;border:2px solid var(--l);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--t)}
.dia.on{background:var(--t);color:#fff;border-color:var(--t)}.dia.rojo{border-color:#FCA5A5;color:var(--r)}.dia.rojo.on{background:var(--r);color:#fff}
.dias input{font:inherit;font-size:17px;padding:9px 10px;border:2px solid var(--l);border-radius:12px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.res>div{background:#fff;border:2px solid var(--l);border-radius:14px;padding:10px 12px;font-weight:800;font-size:16px;cursor:pointer}.res b{display:block;font-size:28px}
.tab{border:2px solid var(--l);background:#fff;border-radius:14px;padding:10px 6px;text-align:center;font-weight:800;font-size:16px;cursor:pointer;color:var(--t)}
.tab b{display:block;font-size:34px;line-height:1.1}
.tab.on{border-color:var(--t);background:var(--t);color:#fff}
.w{max-width:980px;margin:0 auto;padding:14px 16px 90px}
input.bus{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:2px solid var(--l);border-radius:14px;margin:4px 0 12px}
.ped{background:#fff;border:2px solid var(--l);border-radius:18px;margin-bottom:14px;overflow:hidden}
.ped.bloq{border-color:#FCA5A5}
.cab{padding:14px 16px;cursor:pointer}
.cli{font-size:23px;font-weight:800}
.meta{color:var(--g);font-size:17px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ch{font-size:15px;font-weight:800;border-radius:9px;padding:4px 10px}
.cv{background:var(--vb);color:var(--v)}.cr{background:var(--rb);color:var(--r)}.ca{background:var(--ab);color:var(--a)}.cz{background:var(--zb);color:var(--z)}.cg{background:#F1F5F9;color:#334155}
.cuerpo{border-top:2px solid var(--l);padding:6px 16px 16px;background:#FAFBFC}
.lin{background:#fff;border:2px solid var(--l);border-left-width:10px;border-radius:14px;padding:12px 14px;margin-top:10px}

.dice{font-size:20px;margin-top:6px}
.sub{font-size:16px;color:#334155;margin-top:4px}
.bt{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;color:#fff;background:var(--t)}
.bt.v{background:#16A34A}.bt.z{background:#2563EB}.bt.a{background:#D97706}.bt.g{background:#fff;color:var(--t);border:2px solid var(--l)}
.bt:disabled{opacity:.4}
.btl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.acc .bt{flex:1;min-width:200px;font-size:20px;padding:16px}

.dlg h2{margin:0 0 8px;font-size:25px}.dlg p{font-size:19px;margin:6px 0}
.dlg textarea,.dlg input[type=date]{width:100%;font:inherit;font-size:20px;padding:14px;border:2px solid var(--l);border-radius:12px;margin-top:8px}

.op.on{outline:4px solid #2563EB}

@media(max-width:640px){body{font-size:18px}.tabs{gap:5px}.tab{font-size:12px;padding:8px 1px}.tab b{font-size:26px}h1{font-size:22px}.cli{font-size:21px}}
.cen{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
.cen button{flex:0 0 auto;font:inherit;font-weight:800;font-size:17px;border:2px solid var(--l);background:#fff;border-radius:99px;padding:9px 16px;cursor:pointer;color:var(--t)}
.cen button.on{background:#B45309;border-color:#B45309;color:#fff}
.cen button b{background:#FEF3C7;color:#92400E;border-radius:99px;padding:0 8px;margin-left:6px}.cen button.on b{background:#fff}
select.sel{width:100%;font:inherit;font-size:19px;padding:13px;border:2px solid var(--l);border-radius:12px;margin-top:8px;background:#fff}
input.num{width:100%;font:inherit;font-size:24px;font-weight:800;padding:12px;border:2px solid var(--l);border-radius:12px;margin-top:8px}
.chk{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--l);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:17px;cursor:pointer}
.chk input{width:26px;height:26px;flex:0 0 auto}.chk.on{border-color:#2563EB;background:#EFF6FF}
.barra{height:16px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin-top:8px}.barra i{display:block;height:100%;background:#16A34A}
.dlg.ancho{max-width:760px}
.dlg table{font-size:14px!important;table-layout:fixed}.dlg td,.dlg th{word-break:break-word}
.dia-h{font-weight:800;font-size:19px;margin:18px 0 6px;color:#334155}
</style></head><body>
<div class="top"><div class="fila"><h1>📋 Recetas de beas → SAP</h1><button class="pill" id="dbPill" onclick="cambiarDb()"></button></div>
<div class="sub" style="font-size:16px">Sube la exportación de beas (tabla de estructuras, separada por «;»). Se crean en SAP las listas de materiales que falten; las que ya existen no se tocan.</div></div>
<div class="w">
<label class="bt a" style="display:block;text-align:center;font-size:21px;padding:18px;margin-top:6px">📂 Elegir archivo de beas<input type="file" id="f" accept=".csv,.txt,text/plain,*/*" hidden onchange="leer(this.files[0])"></label>
<div id="res"></div><input class="bus" id="bus" placeholder="🔎 Buscar receta" oninput="pintar()" hidden><div id="lista"></div></div>
<script>/* pase SAP: lo da el portal al entrar */
(function(){
  // Pase de SAP: lo da el portal al entrar (usuario y contraseña del portal, una vez cada 30 días).
  // Aquí no se pide ninguna contraseña: si falta el pase, se explica y se ofrece salir y volver a entrar.
  var K='sap_pedido_key';
  function galleta(){ var m=/(?:^|;\s*)sap_pase=([^;]+)/.exec(document.cookie||'')||/(?:^|;\s*)cs_pase=([^;]+)/.exec(document.cookie||''); return m?decodeURIComponent(m[1]):''; }
  function get(){ var t=''; try{ t=localStorage.getItem(K)||''; }catch(e){} return exp(t)>Date.now()?t:galleta(); }
  function exp(t){ var m=/^crm\.([A-Za-z0-9_-]+)\./.exec(t||''); if(!m) return 0; try{ return JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))).exp||0; }catch(e){ return 0; } }
  var abierto=false;
  function ventana(motivo){
    if(abierto) return; abierto=true;
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif');
    d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:380px;width:100%;padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.3)">'
      +'<div style="font-weight:800;font-size:18px">🔐 Falta el permiso de SAP</div>'
      +'<div style="font-size:14px;color:#334155;margin:8px 0 14px;line-height:1.45">'+(motivo||'Este aparato todavía no tiene permiso para SAP.')+'<br><br>Sal del portal y vuelve a entrar con tu usuario: el permiso se activa solo y dura 30 días.'+(function(){ var e=''; try{ e=localStorage.getItem('sap_pase_error')||''; }catch(x){} return e?'<div style="margin-top:10px;background:#FEE2E2;color:#991B1B;border-radius:8px;padding:8px;font-weight:700">Último intento: '+String(e).replace(/[<>&]/g,'')+'</div>':''; })()+'</div>'
      +'<button id="sp_out" style="width:100%;font-size:17px;font-weight:800;padding:12px;border:0;border-radius:10px;background:#0F172A;color:#fff">Salir y volver a entrar</button>'
      +'<button id="sp_x" style="width:100%;font-size:15px;font-weight:700;padding:10px;border:0;background:transparent;color:#64748B;margin-top:6px">Ahora no</button></div>';
    document.body.appendChild(d);
    document.getElementById('sp_x').onclick=function(){ d.remove(); abierto=false; };
    document.getElementById('sp_out').onclick=function(){
      try{ localStorage.removeItem(K); localStorage.removeItem('gc_portal_user'); }catch(e){}
      try{ if(window.top&&window.top.doLogout){ window.top.doLogout(); return; } }catch(e){}
      try{ window.top.location.href='/'; }catch(e){ location.href='/'; }
    };
  }
  // Intento automático: con la sesión del portal abierta en ESTE navegador (gc_portal_user), se lee la ficha del usuario
  // y se pide el pase sin preguntar nada. Así funciona en Safari, Chrome o cualquier navegador donde se haya entrado al portal.
  async function auto(){
    var pu=null; try{ pu=JSON.parse(localStorage.getItem('gc_portal_user')||'null'); if(!pu||!pu.id){ var sid=localStorage.getItem('sap_portal_id')||decodeURIComponent((/(?:^|;\s*)sap_portal_id=([^;]+)/.exec(document.cookie)||[])[1]||''); if(sid) pu={id:sid}; } }catch(e){}
    if(!pu||!pu.id) return 'no hay sesión del portal en este navegador';
    var h=pu.passHash||'';
    if(!h){ try{ var FB='https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents';
      for(var col of ['portal_users','usuarios']){ var r=await fetch(FB+'/'+col+'/'+encodeURIComponent(pu.id)); if(!r.ok) continue; var j=await r.json(); var f=(j.fields||{}).passHash; if(f&&f.stringValue){ h=f.stringValue; break; } } }catch(e){} }
    if(!h) return 'no encuentro la ficha del usuario '+pu.id;
    try{ var r2=await fetch('/api/sap-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:pu.id,passHash:h})});
      var j2=await r2.json().catch(function(){ return {ok:false,error:'HTTP '+r2.status}; });
      if(j2&&j2.ok&&j2.token){ try{ localStorage.setItem(K,j2.token); localStorage.removeItem('sap_pase_error'); }catch(e){} return ''; }
      return (j2&&j2.error)||'sin respuesta'; }catch(e){ return 'no se llega al servidor: '+e.message; } }
  var intentado=false;
  async function resolver(motivo){
    if(!intentado){ intentado=true; var err=await auto(); if(!err){ location.reload(); return; } try{ localStorage.setItem('sap_pase_error',err); }catch(e){} }
    ventana(motivo);
  }
  window.pedirPaseSap=resolver;
  var f0=window.fetch;
  window.fetch=function(u,o){ return f0.apply(this,arguments).then(function(r){ try{ if(r.status===401&&/\/api\/sap-(pedido|factura|produccion|traslado|planificacion|cs)/.test(String(u&&u.url||u))) setTimeout(function(){ resolver(exp(get())?'El permiso guardado ya no vale.':''); },0); }catch(e){} return r; }); };
  if(!(exp(get())>Date.now())){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ resolver(); }); else resolver(); }
})();
</script>
<script>
const API="/api/sap-cs";
const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
let DB=LS("rec_db")||"U_CARO_99", REC=[], CHK=null, TAB="nuevas", VER={}, HECHO={};
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const n=(v)=>(Number(v)||0).toLocaleString("es-ES",{maximumFractionDigits:6});
function pill(){ const p=document.getElementById("dbPill"); p.textContent=DB==="U_CARO_00"?"SAP REAL":"SAP PRUEBAS"; p.className="pill "+(DB==="U_CARO_00"?"pv":"pp"); }
function dialogo(h){ cerrar(); const d=document.createElement("div"); d.className="velo"; d.id="velo"; d.innerHTML='<div class="dlg">'+h+'</div>'; d.onclick=(e)=>{ if(e.target===d) cerrar(); }; document.body.appendChild(d); }
window.cerrar=()=>{ const d=document.getElementById("velo"); if(d) d.remove(); };
window.cambiarDb=()=>dialogo('<h2>¿En qué SAP?</h2><button class="bt a op" onclick="ponDb(\'U_CARO_99\')">🧪 Pruebas · U_CARO_99</button><button class="bt op" style="background:#B91C1C" onclick="ponDb(\'U_CARO_00\')">⚠️ Real · U_CARO_00</button><button class="bt g op" onclick="cerrar()">Cancelar</button>');
window.ponDb=(d)=>{ DB=d; LS("rec_db",d); cerrar(); pill(); HECHO={}; if(REC.length) comprobar(); };
async function api(url,opts){ const ac=new AbortController(), to=setTimeout(()=>ac.abort(),75000);
  try{ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(DB),Object.assign({credentials:"same-origin",signal:ac.signal,headers:{"Content-Type":"application/json","x-crm-key":LS("sap_pedido_key")||""}},opts||{})); return await r.json().catch(()=>({ok:false,error:"sin respuesta del servidor (HTTP "+r.status+")"})); }
  catch(e){ return {ok:false,error:ac.signal.aborted?"SAP ha tardado demasiado: pulsa Reintentar":"sin conexión: pulsa Reintentar"}; } finally{ clearTimeout(to); } }
// Números de beas: «0,59» (coma decimal) · «5.000» (punto de miles) · «1»
const num=(v)=>{ v=String(v||"").trim(); if(!v||v==="?") return null; if(v.includes(",")) v=v.replace(/\./g,"").replace(",","."); else if(/^\d{1,3}(\.\d{3})+$/.test(v)) v=v.replace(/\./g,""); const x=Number(v); return isFinite(x)?x:null; };
const mcd=(a,b)=>b?mcd(b,a%b):a, mcm=(a,b)=>a/mcd(a,b)*b;
function partirCsv(t){ const L=t.replace(/^﻿/,"").split(/\r?\n/).filter(x=>x.trim()); const H=L[0].split(";").map(x=>x.trim()); return L.slice(1).map(l=>{ const c=l.split(";"); const o={}; H.forEach((h,i)=>o[h]=(c[i]||"").trim()); return o; }); }
window.leer=(file)=>{ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ procesar(String(r.result)); }catch(e){ document.getElementById("res").innerHTML='<div class="nada" style="color:#B91C1C">No entiendo el archivo: '+esc(e.message)+'</div>'; } }; r.readAsText(file,"utf-8"); };
function procesar(t){ const F=partirCsv(t); if(!F.length||!("ART1_ID" in F[0])||!("ItemCode" in F[0])) throw new Error("no tiene las columnas de beas (ItemCode, ART1_ID, MENGE_VERBRAUCH, MENGE_JE)");
  const P={}; let sinComp=0, inact=0;
  for(const f of F){ const art=f.ItemCode.toUpperCase(); if(!art) continue; if(f.AKTIV&&f.AKTIV!=="J"){ inact++; continue; } if(!f.ART1_ID){ sinComp++; continue; }
    const v=num(f.MENGE_VERBRAUCH)??num(f.MENGE_LAGER)??1, je=num(f.MENGE_JE)||1, alm=(f.WhsCode&&f.WhsCode!=="?")?f.WhsCode:"";
    (P[art]=P[art]||[]).push({cod:f.ART1_ID.toUpperCase(),v,je,alm,desc:(f.DESCRIPTION&&f.DESCRIPTION!=="?")?f.DESCRIPTION:"",pos:Number(f.POS_ID)||0}); }
  // Cantidad base de la receta = mínimo común múltiplo de los «por cada X» (así las cantidades quedan exactas: 1 caja por 120)
  REC=Object.entries(P).map(([art,L])=>{ L.sort((a,b)=>a.pos-b.pos); let q=1; if(L.every(l=>Number.isInteger(l.je))) { for(const l of L){ q=mcm(q,l.je); if(q>1e6){ q=1; break; } } }
    return {art,cantidad:q,lineas:L.map(l=>({cod:l.cod,uds:l.v*q/l.je,alm:l.alm,desc:l.desc,por:l.v/l.je}))}; });
  const cods=new Set(REC.map(r=>r.art)); REC.forEach(r=>{ r.semi=false; r.lineas.forEach(l=>{ l.semi=cods.has(l.cod); }); r.envasado=r.lineas.some(l=>l.semi); });
  document.getElementById("res").innerHTML='<div class="tot" style="margin-top:12px">Leídas <b>'+F.length+'</b> líneas · <b>'+REC.length+'</b> recetas'+(sinComp?' · '+sinComp+' líneas de texto (se ignoran)':'')+(inact?' · '+inact+' inactivas (se ignoran)':'')
    +(F.length>=999&&F.length<=1001?'<div style="color:#B45309;margin-top:6px">⚠️ El archivo tiene justo '+F.length+' líneas: parece que beas cortó la exportación a 1.000. Revisa si faltan recetas y expórtalas en otro archivo.</div>':'')+'</div><div class="carg">Comprobando en SAP qué existe…</div>';
  comprobar(); }
async function comprobar(){ const comps=[...new Set(REC.flatMap(r=>r.lineas.map(l=>l.cod)))];
  const j=await api(API,{method:"POST",body:JSON.stringify({accion:"recetas_check",arts:REC.map(r=>r.art),comps})});
  if(!j.ok){ document.getElementById("res").insertAdjacentHTML("beforeend",'<div class="nada" style="color:#B91C1C">'+esc(j.error)+'</div>'); return; }
  CHK=j; const no=new Set(j.noExisten||[]), ya=new Set(j.conReceta||[]);
  REC.forEach(r=>{ r.ya=ya.has(r.art); r.artNo=no.has(r.art); r.faltan=r.lineas.filter(l=>no.has(l.cod)).map(l=>l.cod); r.nombre=(j.nombres||{})[r.art]||""; r.estado=HECHO[r.art]||(r.ya?"ya":r.artNo||r.faltan.length?"mal":"nueva"); });
  document.getElementById("bus").hidden=false; pintar(); }
const ET={nueva:["🆕","Para crear"],mal:["⚠️","Con problemas"],ya:["✅","Ya en SAP"],creada:["🎉","Creadas ahora"],error:["❌","Error al crear"]};
window.verTab=(t)=>{ TAB=t; pintar(); };
window.verRec=(a)=>{ VER[a]=!VER[a]; pintar(); };
function pintar(){ pill(); if(!CHK) return; const c={}; Object.keys(ET).forEach(k=>c[k]=0); REC.forEach(r=>c[r.estado]++); const tabs=Object.keys(ET).filter(k=>c[k]||k==="nueva");
  if(!tabs.includes(TAB)) TAB=tabs[0];
  const q=document.getElementById("bus").value.trim().toUpperCase(), L=REC.filter(r=>r.estado===TAB&&(!q||(r.art+" "+r.nombre+" "+r.lineas.map(l=>l.cod).join(" ")).toUpperCase().includes(q)));
  document.getElementById("res").innerHTML=document.getElementById("res").innerHTML.split('<div class="carg">')[0].split('<div class="tabs"')[0]
   +'<div class="tabs" style="grid-template-columns:repeat('+tabs.length+',1fr);margin-top:12px">'+tabs.map(k=>'<div class="tab'+(TAB===k?' on':'')+'" onclick="verTab(\''+k+'\')"><b>'+c[k]+'</b>'+ET[k][0]+' '+ET[k][1]+'</div>').join("")+'</div>'
   +(TAB==="nueva"&&c.nueva?'<button class="bt v" style="width:100%;font-size:21px;padding:18px;margin-top:12px" onclick="crear()">✅ Crear '+c.nueva+' receta'+(c.nueva>1?'s':'')+' en '+(DB==="U_CARO_00"?"SAP REAL":"SAP PRUEBAS")+'</button>':'')
   +(TAB==="error"&&c.error?'<button class="bt v" style="width:100%;font-size:21px;padding:18px;margin-top:12px" onclick="reintentar()">🔁 Reintentar '+c.error+' con error</button>':'')
   +(TAB==="mal"?'<div class="sub" style="margin-top:10px;font-size:17px">Estas no se pueden crear hasta que existan en SAP los artículos marcados en rojo (o el propio artículo fabricado).</div>':'')
   +(TAB==="mal"&&c.mal?faltanH()+'<button class="bt a" style="width:100%;font-size:20px;padding:16px;margin-top:10px" onclick="copiarMal()">📋 Copiar la lista para mandarla</button>':'')
   +(TAB==="ya"?'<div class="sub" style="margin-top:10px;font-size:17px">Ya tienen receta en SAP: no se tocan.</div>':'');
  document.getElementById("lista").innerHTML=L.slice(0,300).map(r=>'<div class="lin '+(r.estado==="nueva"?"re":r.estado==="mal"||r.estado==="error"?"no":"ok")+'"><div class="art" onclick="verRec(\''+esc(r.art)+'\')" style="cursor:pointer">'+(VER[r.art]?'▾ ':'▸ ')+esc(r.art)+' <span class="desc">'+esc(r.nombre)+'</span>'+(r.envasado?' <span class="ch cz">envasado</span>':'')+'</div>'
     +'<div class="dice">'+r.lineas.length+' componente'+(r.lineas.length>1?'s':'')+' · receta para '+n(r.cantidad)+' uds</div>'
     +(r.artNo?'<div class="sub" style="color:#B91C1C;font-weight:700">El artículo '+esc(r.art)+' no existe en SAP</div>':'')+(r.faltan.length?'<div class="sub" style="color:#B91C1C;font-weight:700">No existen en SAP: '+esc(r.faltan.join(", "))+'</div>':'')+(r.err?'<div class="sub" style="color:#B91C1C">'+esc(r.err)+'</div>':'')
     +(VER[r.art]?'<table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:15px">'+r.lineas.map(l=>'<tr style="border-top:1px solid #F1F5F9"><td style="padding:5px 4px;'+(r.faltan.includes(l.cod)?'color:#B91C1C;font-weight:800':'')+'"><b>'+esc(l.cod)+'</b><br><span style="color:#64748B;font-size:13px">'+esc(l.desc||(CHK.nombres||{})[l.cod]||"")+(l.semi?' · semielaborado':'')+'</span></td><td style="padding:5px 4px;text-align:right"><b>'+n(l.uds)+'</b><br><span style="color:#64748B;font-size:13px">'+(l.por<1?'1 cada '+n(Math.round(1/l.por*1000)/1000):n(l.por)+' por ud')+'</span></td><td style="padding:5px 4px">'+esc(l.alm)+'</td></tr>').join("")+'</table>':'')+'</div>').join("")
   +(L.length>300?'<div class="tot">… y '+(L.length-300)+' más (usa el buscador)</div>':'')+(L.length?'':'<div class="nada">Nada aquí.</div>'); }
window.crear=()=>{ const N=REC.filter(r=>r.estado==="nueva"); dialogo('<h2>✅ Crear '+N.length+' recetas</h2><p>En <b>'+(DB==="U_CARO_00"?"SAP REAL (U_CARO_00)":"SAP PRUEBAS (U_CARO_99)")+'</b>. Las que ya existen no se tocan.</p>'
   +(DB==="U_CARO_00"?'<p style="color:#B91C1C;font-weight:800">⚠️ Es el SAP real. ¿Las has revisado antes en pruebas?</p>':'')+'<button class="bt v op" onclick="crearYa(this)">Sí, crear</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.crearYa=async(b,est)=>{ b.disabled=true; const N=REC.filter(r=>r.estado===(est||"nueva")); let ok=0, ko=0, ya=0, cola=N.slice(), hechas=0, vueltas=0;
  let wl=null; try{ wl=await navigator.wakeLock.request("screen"); }catch(e){}
  const p=document.createElement("div"); p.style.cssText="font-size:19px;font-weight:800;margin-top:12px;text-align:center"; b.after(p);
  const pinta=()=>{ b.textContent="Creando… "+hechas+" de "+N.length; p.innerHTML="✅ "+ok+" creadas · ⏭ "+ya+" ya estaban · ❌ "+ko+" con error<br><span style=\"font-weight:600;font-size:16px;color:#64748B\">No cierres esta pantalla</span>"; };
  pinta();
  while(cola.length&&vueltas<400){ vueltas++; const T=cola.splice(0,5);
    const j=await api(API,{method:"POST",body:JSON.stringify({accion:"recetas_crear",recetas:T.map(r=>({art:r.art,cantidad:r.cantidad,lineas:r.lineas.map(l=>({cod:l.cod,uds:l.uds,alm:l.alm}))}))})});
    if(!j.ok){ T.forEach(r=>{ r.estado=HECHO[r.art]="error"; r.err=j.error; }); ko+=T.length; hechas+=T.length; pinta(); continue; }
    (j.creadas||[]).forEach(a=>{ const r=REC.find(x=>x.art===a); if(r){ r.estado=HECHO[a]="creada"; r.err=""; ok++; hechas++; } });
    (j.saltadas||[]).forEach(a=>{ const r=REC.find(x=>x.art===a); if(r){ r.estado=HECHO[a]="ya"; ya++; hechas++; } });
    (j.errores||[]).forEach(e=>{ const r=REC.find(x=>x.art===e.art); if(r){ r.estado=HECHO[e.art]="error"; r.err=e.error; ko++; hechas++; } });
    (j.pendientes||[]).forEach(a=>{ const r=REC.find(x=>x.art===a); if(r) cola.push(r); });
    pinta(); }
  try{ wl&&wl.release(); }catch(e){}
  cerrar(); TAB=REC.some(r=>r.estado==="error")?"error":"creada"; pintar(); aviso(ok+" recetas creadas"+(ko?" · "+ko+" con error":""),!ko); };
function aviso(t,ok){ const d=document.createElement("div"); d.style.cssText="position:fixed;left:16px;right:16px;bottom:20px;padding:14px 16px;border-radius:12px;font:800 18px system-ui,sans-serif;z-index:100001;color:#fff;background:"+(ok?"#16A34A":"#B91C1C"); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),6000); }
function faltanM(){ const M={}; REC.filter(r=>r.estado==="mal").forEach(r=>{ if(r.artNo) (M[r.art]=M[r.art]||{fab:true,rec:[]}).rec.push(r.art); r.faltan.forEach(c=>{ const l=r.lineas.find(x=>x.cod===c)||{}; (M[c]=M[c]||{desc:l.desc||"",rec:[]}).rec.push(r.art); }); }); return Object.entries(M).sort((a,b)=>b[1].rec.length-a[1].rec.length); }
function faltanH(){ const M=faltanM(); return '<div class="lin no" style="margin-top:10px"><div class="art">Faltan en SAP '+M.length+' código'+(M.length>1?'s':'')+'</div>'+M.map(([c,x])=>'<div class="sub" style="font-size:17px;padding:4px 0;border-top:1px solid #F1F5F9"><b>'+esc(c)+'</b> '+esc(x.desc||"")+(x.fab?' · <b>artículo fabricado</b>':'')+' → '+x.rec.length+' receta'+(x.rec.length>1?'s':'')+'</div>').join("")+'</div>'; }
window.copiarMal=async()=>{ const t="Recetas con problemas ("+REC.filter(r=>r.estado==="mal").length+")\nCódigos que no existen en SAP:\n"+faltanM().map(([c,x])=>"- "+c+(x.desc?" "+x.desc:"")+(x.fab?" (artículo fabricado)":"")+" → "+x.rec.join(", ")).join("\n");
  try{ await navigator.clipboard.writeText(t); aviso("📋 Copiado: pégalo en el chat",true); }catch(e){ dialogo('<h2>Copia este texto</h2><textarea style="width:100%;height:300px;font-size:14px">'+esc(t)+'</textarea><button class="bt g op" onclick="cerrar()">Cerrar</button>'); } };
window.reintentar=()=>{ const N=REC.filter(r=>r.estado==="error"); dialogo('<h2>🔁 Reintentar '+N.length+' recetas</h2><p>En <b>'+(DB==="U_CARO_00"?"SAP REAL (U_CARO_00)":"SAP PRUEBAS (U_CARO_99)")+'</b>.</p><button class="bt v op" onclick="crearYa(this,\'error\')">Sí, reintentar</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
pill();
</script>
