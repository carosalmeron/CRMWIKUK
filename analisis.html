<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análisis · Grupo Consolidado</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0E1626; --papel:#F6F7F9; --blanco:#fff;
    --linea:#E2E6EC; --texto:#0E1626; --tenue:#69737F;
    --sube:#12794A; --baja:#B4232A; --aviso:#8A5A00;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--texto);
    font:15px/1.55 Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{background:var(--tinta);color:#fff;padding:18px 18px 22px}
  /* Zona de toque holgada: en movil una flecha pequena se falla siempre */
  .volver{display:inline-flex;align-items:center;gap:8px;color:#C6D0DC;
    text-decoration:none;font-size:15px;font-weight:600;margin-bottom:12px;
    padding:9px 14px 9px 10px;border-radius:11px;background:rgba(255,255,255,.09);
    min-height:44px}
  .volver:active{background:rgba(255,255,255,.18)}
  .volver .f{font-size:22px;line-height:1}
  .quien{font-size:12px;color:#93A1B5;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  h1{margin:3px 0 0;font-size:21px;font-weight:800;letter-spacing:-.015em}
  main{padding:16px 14px 50px;max-width:760px;margin:0 auto}

  /* ── El veredicto: lo primero y lo único grande ── */
  .veredicto{
    background:var(--blanco);border:1px solid var(--linea);border-radius:14px;
    padding:18px 18px 16px;margin-bottom:14px;
  }
  .veredicto .titular{font-size:15px;font-weight:700;line-height:1.35;margin:0 0 12px}
  .cifras{display:flex;gap:18px;flex-wrap:wrap}
  .cifra .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .cifra .e{font-size:11px;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .sube{color:var(--sube)} .baja{color:var(--baja)} .aviso{color:var(--aviso)}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--tenue);
     margin:24px 0 9px;font-weight:700}
  .grupo{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
  .fila{display:flex;align-items:center;gap:12px;padding:12px 15px;border-top:1px solid #EEF1F4}
  .fila:first-child{border-top:none}
  .fila .nom{font-weight:700;font-size:14px}
  .fila .det{font-size:11.5px;color:var(--tenue);margin-top:1px}
  .fila .der{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
  .fila .imp{font-weight:700;font-size:14px}
  .fila .pct{font-size:12px;font-weight:700}
  .barra{height:3px;border-radius:2px;background:#EEF1F4;margin-top:5px;overflow:hidden}
  .barra i{display:block;height:100%}
  .filtros{display:flex;gap:8px;max-width:760px;margin:0 auto;padding:14px 14px 0}
  .filtros select{flex:1;min-width:0;font:inherit;font-size:13.5px;padding:11px 12px;
    border:1.5px solid var(--linea);border-radius:11px;background:#fff;
    color:var(--texto);min-height:46px}
  .pulsa{cursor:pointer;min-height:56px}
  .pulsa:active{background:#EEF2F6}
  .chev{color:#94A3B0;font-size:26px;line-height:1;margin-left:6px;
    width:30px;text-align:center;flex:none}
  .atras{display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;background:var(--blanco);border:1px solid var(--linea);
    border-radius:11px;color:var(--texto);font:inherit;font-size:14px;
    font-weight:700;cursor:pointer;padding:13px;margin-bottom:14px}
  .atras:active{background:#EEF2F6}
  .nota{background:#FFF9EC;border:1px solid #F0DCA8;border-radius:11px;
    padding:11px 13px;font-size:13px;margin-bottom:14px}
  .nota a{color:var(--texto);font-weight:700}
  .etiq{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
    padding:2px 7px;border-radius:20px;background:#EEF1F4;color:var(--tenue);margin-left:6px}
  .etiq.mal{background:#FDECEC;color:var(--baja)}
  .etiq.bien{background:#E9F6EF;color:var(--sube)}
  .vacio{padding:18px 15px;color:var(--tenue);font-size:13px;text-align:center}
  .pie{margin-top:22px;font-size:11.5px;color:var(--tenue);text-align:center}
  .cargando{padding:40px 0;text-align:center;color:var(--tenue);font-size:14px}
  .err{background:#FDF3F3;border:1px solid #F0C2C4;color:var(--baja);
       padding:12px 14px;border-radius:11px;font-size:13px}
</style>
</head>
<body>

<header>
  <a class="volver" href="index.html"><span class="f">←</span> Volver al portal</a>
  <div class="quien" id="quien">Cargando</div>
  <h1 id="ambito">Análisis</h1>
</header>

<div id="filtros" class="filtros" hidden>
    <select id="fequipo" onchange="cambiaEquipo()"></select>
    <select id="fagente" onchange="cambiaAgente()"></select>
  </div>

<main id="app"><div class="cargando">Leyendo datos de ventas…</div></main>

<script>
const PROY="grupo-consolidado-crm";
const BASE=`https://firestore.googleapis.com/v1/projects/${PROY}/databases/(default)/documents`;

const $=(id)=>document.getElementById(id);
const eur=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
const pct=(n)=>(n>0?"+":"")+Number(n||0).toFixed(1)+" %";
const norm=(s)=>String(s||"").toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const val=(f)=>!f?null:
  f.doubleValue!==undefined?Number(f.doubleValue):
  f.integerValue!==undefined?Number(f.integerValue):
  f.stringValue!==undefined?f.stringValue:
  f.booleanValue!==undefined?f.booleanValue:null;

async function leer(col){
  const out=[]; let tk=null,v=0;
  do{
    const r=await fetch(`${BASE}/${col}?pageSize=300${tk?`&pageToken=${tk}`:""}`);
    if(!r.ok) throw new Error(`${col}: HTTP ${r.status}`);
    const j=await r.json();
    for(const d of (j.documents||[])){
      const o={_id:d.name.split("/").pop()};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      out.push(o);
    }
    tk=j.nextPageToken||null;
  }while(tk && ++v<30);
  return out;
}

function sesion(){
  try{ return JSON.parse(localStorage.getItem("gc_portal_user")||"{}"); }
  catch(e){ return {}; }
}

// Qué ve cada quien: dirección lo ve todo, un responsable su equipo,
// y un comercial solo lo suyo.
function alcance(u, agentes, usuarios){
  const rol=String(u.rol||"").toLowerCase();
  const igual=(a,b)=>{ const x=norm(a), y=norm(b); return !!x && x===y; };

  if(!u || (!u.username && !u.crmId && !u.nombre))
    return {tipo:"grupo", titulo:"Todo el grupo", sinSesion:true, lista:agentes};

  if(rol.includes("director")||rol==="admin"||rol==="ceo")
    return {tipo:"grupo", titulo:"Todo el grupo", lista:agentes};

  const ficha=usuarios.find(x=>
       (u.crmId && (x._id||x.id)===u.crmId)
    || igual(x.username, u.username)
    || igual(x.nombre,   u.nombre));

  if(rol.includes("jefe")){
    const eq=norm(ficha&&ficha.equipo);
    if(eq){
      const mios=agentes.filter(a=>norm(a.equipo)===eq);
      if(mios.length) return {tipo:"equipo", titulo:ficha.equipo, lista:mios};
    }
  }

  const clave=norm((ficha&&(ficha.grupoAgente||ficha.catalogoVendedor))||u.username);
  if(clave){
    const yo=agentes.filter(a=>norm(a._id)===clave);
    if(yo.length) return {tipo:"agente", titulo:yo[0].agente, lista:yo, clave};
  }
  // Sin correspondencia: mejor enseñar el grupo que inventar un agente
  return {tipo:"grupo", titulo:"Todo el grupo", sinFicha:true, lista:agentes};
}

function totales(lista){
  const t=lista.reduce((s,a)=>({
    act:s.act+(a.ventasAct||0), ant:s.ant+(a.ventasAntYTD||0),
    mes:s.mes+(a.ventasMes||0), mesAnt:s.mesAnt+(a.ventasMesAnt||0),
    mg:s.mg+(a.margenAct||0), mgAnt:s.mgAnt+(a.margenAntYTD||0),
    mgMes:s.mgMes+(a.margenMes||0), bMes:s.bMes+(a.baseMes||0),
    mgMesAnt:s.mgMesAnt+(a.margenMesAnt||0), bMesAnt:s.bMesAnt+(a.baseMesAnt||0),
    baseAnt:s.baseAnt+((a.ventasAntYTD||0)*((a.coberturaAntYTD||0)/100)),
    base:s.base+((a.ventasAct||0)*((a.coberturaAct||0)/100)),
    cli:s.cli+(a.clientes||0), act1:s.act1+(a.clientesConVentaMes||0),
  // Todos los acumuladores deben arrancar en 0: si falta uno, la suma da NaN
  // y la comparativa desaparece sin dar ningún error.
  }),{act:0,ant:0,mes:0,mesAnt:0,mg:0,mgAnt:0,mgMes:0,bMes:0,
      mgMesAnt:0,bMesAnt:0,base:0,baseAnt:0,cli:0,act1:0});
  t.varPct = t.ant ? (t.act-t.ant)/t.ant*100 : null;
  t.varMes = t.mesAnt ? (t.mes-t.mesAnt)/t.mesAnt*100 : null;
  t.margenPct = t.base ? t.mg/t.base*100 : null;
  t.margenPctAnt = t.baseAnt ? t.mgAnt/t.baseAnt*100 : null;
  t.margenPctMes    = t.bMes    ? t.mgMes/t.bMes*100 : null;
  t.margenPctMesAnt = t.bMesAnt ? t.mgMesAnt/t.bMesAnt*100 : null;

  // Respaldo: si faltan los importes del mes (documentos de una sincronización
  // anterior), se promedia el porcentaje ya calculado, ponderado por venta.
  const pond=(campo, peso)=>{
    let num=0, den=0;
    for(const a of lista){
      const v=a[campo], w=a[peso]||0;
      if(v!=null && w>0){ num+=v*w; den+=w; }
    }
    return den ? num/den : null;
  };
  if(t.margenPctMes===null)    t.margenPctMes    = pond("margenPctMes","ventasMes");
  if(t.margenPctMesAnt===null) t.margenPctMesAnt = pond("margenPctMesAnt","ventasMesAnt");
  if(t.margenPct===null)       t.margenPct       = pond("margenPctAct","ventasAct");
  if(t.margenPctAnt===null)    t.margenPctAnt    = pond("margenPctAntYTD","ventasAntYTD");

  // El margen se calcula solo sobre las lineas con coste valido. Si la
  // cobertura de los dos anos difiere mucho, los porcentajes no son
  // comparables y hay que decirlo: un salto de 20 puntos casi nunca es real.
  t.cobPct    = t.act ? t.base/t.act*100 : null;
  t.cobPctAnt = t.ant ? t.baseAnt/t.ant*100 : null;
  t.margenFiable = !(t.cobPct!==null && t.cobPctAnt!==null &&
    Math.abs(t.cobPct-t.cobPctAnt) > 10);
  return t;
}

function titular(t, alc){
  const v=t.varPct;
  const quien = alc.tipo==="agente" ? "Vas" : alc.tipo==="equipo" ? "El equipo va" : "El grupo va";
  if(v===null) return `${quien} con ${eur(t.act)} facturados este año.`;
  const dif=Math.abs(t.act-t.ant);
  if(v>=3)  return `${quien} por delante del año pasado: ${eur(dif)} más a estas alturas.`;
  if(v<=-3) return `${quien} por detrás del año pasado: faltan ${eur(dif)} para igualarlo.`;
  return `${quien} en línea con el año pasado, con una diferencia de ${eur(dif)}.`;
}

function filaAgente(a, extra){
  const v=a.variacionPct;
  const color = v===null?"":v<0?"baja":"sube";
  const ancho = Math.min(100, Math.abs(v||0));
  return `<div class="fila pulsa" onclick="verAgente('${String(a._id).replace(/'/g,"")}')">
    <div>
      <div class="nom">${a.agente||a._id}</div>
      <div class="det">${extra||""}</div>
    </div>
    <div class="der">
      <div class="imp">${eur(a.ventasAct)}</div>
      <div class="pct ${color}">${v!==null?pct(v):"—"}</div>
    </div>
    <span class="chev">→</span>
  </div>
  <div style="padding:0 15px 9px"><div class="barra">
    <i style="width:${ancho}%;background:${v<0?"#B4232A":"#12794A"}"></i></div></div>`;
}

let CACHE={agentes:[],meta:null};
let BASE_LISTA=[], ALC=null, SYNC=null;
let F_EQUIPO="", F_AGENTE="";

// Detalle de un comercial: de donde viene su caida o su crecimiento.
// Se leen sus clientes con una consulta filtrada, no la coleccion entera.
async function verAgente(id){
  const a=CACHE.agentes.find(x=>x._id===id);
  if(!a) return;
  window.scrollTo(0,0);
  $("ambito").textContent=a.agente||id;
  $("app").innerHTML=`<div class="cargando">Cargando sus clientes…</div>`;

  let clientes=[];
  try{
    // Con limite de espera: si Firestore no responde, mejor decirlo que
    // dejar "Cargando sus clientes..." indefinidamente.
    const conLimite=(prom,ms)=>Promise.race([prom,
      new Promise((_,rj)=>setTimeout(()=>rj(new Error(`sin respuesta en ${ms/1000} s`)),ms))]);

    const r=await conLimite(fetch(`${BASE}:runQuery`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({structuredQuery:{
        from:[{collectionId:"pbi_ventas_cliente"}],
        where:{fieldFilter:{field:{fieldPath:"agente"},op:"EQUAL",
               value:{stringValue:a._id}}},
        limit:800,
      }}),
    }), 20000);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const j=await r.json();
    if(j && j.error) throw new Error(j.error.message||"error de Firestore");
    clientes=(Array.isArray(j)?j:[]).filter(f=>f.document).map(f=>{
      const o={_id:f.document.name.split("/").pop()};
      for(const [k,v] of Object.entries(f.document.fields||{})) o[k]=val(v);
      return o;
    }).filter(c=>!c.fusionadoEn && !c.intercompany);
  }catch(e){
    $("app").innerHTML=`<div class="err">
      No se han podido leer sus clientes: ${e.message}
      <p style="margin:8px 0 0"><button class="atras" onclick="verAgente('${
        String(a._id).replace(/'/g,"")}')">Reintentar</button></p>
      <p style="margin:8px 0 0"><button class="atras" onclick="arrancar()">← Volver</button></p>
    </div>`;
    return;
  }

  // Todo el pintado va protegido: un error aquí dejaba la pantalla en
  // "Cargando sus clientes" sin decir nada, porque la excepción se escapaba
  // del try de la consulta.
  try{
  const dif=(c)=>(c.ventasAct||0)-(c.ventasAntYTD||0);
  const pierde=clientes.filter(c=>dif(c)<-500).sort((x,y)=>dif(x)-dif(y));
  const gana=clientes.filter(c=>dif(c)>500).sort((x,y)=>dif(y)-dif(x));
  const dormidos=clientes.filter(c=>!(c.ventasAct>0) && (c.ventasAntFull||0)>1000)
    .sort((x,y)=>(y.ventasAntFull||0)-(x.ventasAntFull||0));
  const perdido=pierde.reduce((t,c)=>t+dif(c),0);
  const ganado=gana.reduce((t,c)=>t+dif(c),0);

  const fecha=(f)=>f?new Date(f).toLocaleDateString("es-ES"):"—";
  const filaCli=(c,extra)=>`<div class="fila">
    <div style="min-width:0">
      <div class="nom">${c.nombre||c.cliente}</div>
      <div class="det">${c.poblacion||""}${extra?" · "+extra:""}</div>
    </div>
    <div class="der">
      <div class="imp">${eur(c.ventasAct)}</div>
      <div class="pct ${dif(c)<0?"baja":"sube"}">${dif(c)>0?"+":""}${eur(dif(c))}</div>
    </div>
  </div>`;

  $("app").innerHTML=`
    <button class="atras" onclick="arrancar()">← Volver al análisis</button>

    <div class="veredicto">
      <p class="titular">${
        perdido && Math.abs(perdido)>ganado
          ? `Pierde ${eur(Math.abs(perdido))} en ${pierde.length} clientes y recupera ${eur(ganado)} en otros ${gana.length}.`
          : `Gana ${eur(ganado)} en ${gana.length} clientes y cede ${eur(Math.abs(perdido))} en otros ${pierde.length}.`
      }</p>
      <div class="cifras">
        <div class="cifra"><div class="v">${eur(a.ventasAct)}</div><div class="e">Este año</div></div>
        <div class="cifra"><div class="v ${a.variacionPct<0?"baja":"sube"}">${
          a.variacionPct!=null?pct(a.variacionPct):"—"}</div><div class="e">vs 2025</div></div>
        <div class="cifra"><div class="v">${(a.margenPctAct||0).toFixed(1)} %</div>
          <div class="e">Margen${a.objetivoMargen?` · obj ${a.objetivoMargen.toFixed(0)} %`:""}</div></div>
        <div class="cifra"><div class="v">${clientes.length}</div><div class="e">Clientes</div></div>
      </div>
    </div>

    <h2>Dónde pierde <span class="etiq mal">${eur(Math.abs(perdido))}</span></h2>
    <div class="grupo">${pierde.length
      ? pierde.slice(0,15).map(c=>filaCli(c,`venía de ${eur(c.ventasAntYTD)}`)).join("")
      : `<p class="vacio">No pierde volumen en ningún cliente.</p>`}</div>

    <h2>Dónde gana <span class="etiq bien">${eur(ganado)}</span></h2>
    <div class="grupo">${gana.length
      ? gana.slice(0,10).map(c=>filaCli(c,`venía de ${eur(c.ventasAntYTD)}`)).join("")
      : `<p class="vacio">Sin crecimientos.</p>`}</div>

    <h2>Dejaron de comprar · ${dormidos.length}</h2>
    <div class="grupo">${dormidos.length
      ? dormidos.slice(0,15).map(c=>`<div class="fila">
          <div style="min-width:0">
            <div class="nom">${c.nombre||c.cliente}</div>
            <div class="det">${c.poblacion||""} · última venta ${fecha(c.ultimaVenta)}</div>
          </div>
          <div class="der"><div class="imp">${eur(c.ventasAntFull)}</div>
            <div class="pct baja">en 2025</div></div>
        </div>`).join("")
      : `<p class="vacio">Todos sus clientes siguen comprando.</p>`}</div>

    <p class="pie">Nada en ${new Date().getFullYear()} y más de 1.000 € el año
      anterior. Es la lista de recuperación. · v1.6</p>
  `;
  }catch(e){
    $("app").innerHTML=`<div class="err">Error al mostrar el detalle: ${e.message}
      <p style="margin:8px 0 0"><button class="atras" onclick="arrancar()">← Volver</button></p>
    </div>`;
  }
}

async function arrancar(){
  const u=sesion();
  $("quien").textContent = u.nombre || u.username || "Sin identificar";

  try{
    const [agentesRaw, usuarios, ajustes, meta] = await Promise.all([
      leer("pbi_resumen_agente"),
      leer("usuarios").catch(()=>[]),
      leer("pbi_ajustes").catch(()=>[]),
      fetch(`${BASE}/pbi_meta/estado`).then(r=>r.ok?r.json():null).catch(()=>null),
    ]);

    // Los cambios de rama hechos en la herramienta de estructura mandan sobre
    // lo que traiga Power BI. Sin esto, Francia aparece como "sin equipo".
    // La rama ya viene resuelta desde la sincronización, que aplica la regla
    // de pbi_config/ramas y las correcciones de pbi_ajustes. Aquí solo se
    // respetan las exclusiones.
    const AJ={}; for(const a of ajustes) AJ[norm(a._id)]=a;
    for(const a of agentesRaw){
      const aj=AJ[norm(a._id)];
      if(aj && aj.equipo==="_EXCLUIR") a._excluido=true;
      if(!a.equipo) a.equipo="Sin rama";

      // Los traspasos entre empresas del grupo no son actividad comercial:
      // aparecían entre los que más caen y distorsionaban el análisis.
      const n=norm(a._id)+" "+norm(a.agente);
      if(/INTERC|INTERCOMPANY|SIN AGENTE|TIENDA/.test(n)) a._excluido=true;
    }

    const agentes = agentesRaw
      .filter(a=>!a._excluido)
      .filter(a=>a._id!=="_TOTAL")
      .filter(a=>(a.ventasAct||0)>0 || (a.ventasAntYTD||0)>0);

    CACHE.agentes=agentes;
    ALC = alcance(u, agentes, usuarios);
    BASE_LISTA = ALC.lista;
    SYNC = meta?.fields?.ultimaSync?.stringValue;

    // Un comercial no necesita filtros: solo tiene su propia cartera
    if(ALC.tipo!=="agente"){
      const eqs=[...new Set(BASE_LISTA.map(a=>a.equipo).filter(Boolean))].sort();
      $("fequipo").innerHTML=`<option value="">Todas las ramas (${eqs.length})</option>`
        + eqs.map(e=>`<option value="${e}">${e}</option>`).join("");
      pintarAgentes();
      $("filtros").hidden=false;
    }
    render();
  }catch(e){
    $("app").innerHTML=`<div class="err">No se han podido cargar los datos: ${e.message}</div>`;
  }
}

function pintarAgentes(){
  const lista=BASE_LISTA.filter(a=>!F_EQUIPO || a.equipo===F_EQUIPO);
  const ags=[...new Set(lista.map(a=>a.agente||a._id))].sort();
  $("fagente").innerHTML=`<option value="">Todos los comerciales (${ags.length})</option>`
    + ags.map(a=>`<option value="${a}"${F_AGENTE===a?" selected":""}>${a}</option>`).join("");
}

function cambiaEquipo(){
  F_EQUIPO=$("fequipo").value||"";
  F_AGENTE="";                 // al cambiar de rama, el agente deja de aplicar
  pintarAgentes();
  render();
}
function cambiaAgente(){ F_AGENTE=$("fagente").value||""; render(); }

function render(){
  {
    const alc = {...ALC};
    alc.lista = BASE_LISTA.filter(a=>
      (!F_EQUIPO  || a.equipo===F_EQUIPO) &&
      (!F_AGENTE  || (a.agente||a._id)===F_AGENTE));

    alc.titulo = F_AGENTE ? F_AGENTE : F_EQUIPO ? F_EQUIPO : ALC.titulo;
    $("ambito").textContent = alc.titulo;

    const t = totales(alc.lista);
    const sync = SYNC;
    const dias = sync ? Math.floor((Date.now()-new Date(sync).getTime())/86400000) : null;

    // Compara el mes con el acumulado del año: dice si la cosa mejora o
    // empeora, que es lo que no se ve mirando solo una cifra.
    const tendencia=(t)=>{
      if(t.varMes===null || t.varPct===null) return "";
      const dif=t.varMes-t.varPct;
      const mes=pct(t.varMes), ano=pct(t.varPct);
      if(Math.abs(dif)<3)
        return `Este mes va ${mes}, en línea con el acumulado del año (${ano}).`;
      if(t.varMes>=0 && t.varPct<0)
        return `Este mes remonta: ${mes} frente al ${ano} acumulado. Si se mantiene, la brecha del año se estrecha.`;
      if(dif>0)
        return `Este mes mejora: ${mes} frente al ${ano} del año. La caída se está frenando.`;
      if(t.varMes<0 && t.varPct>=0)
        return `Ojo al mes: ${mes}, cuando el año va ${ano}. Es un cambio de signo.`;
      return `Este mes empeora: ${mes} frente al ${ano} del año. La tendencia se acelera a la baja.`;
    };

    let html = "";
    if(alc.sinSesion) html += `<div class="nota">
      No has iniciado sesión, así que se muestra el grupo completo.
      <a href="index.html">Entrar</a> para ver solo lo tuyo.</div>`;
    else if(alc.sinFicha) html += `<div class="nota">
      Tu usuario no está enlazado con ningún comercial de Power BI,
      así que se muestra el grupo completo.</div>`;

    html += `<div class="veredicto">
      <p class="titular">${titular(t, alc)}</p>
      ${(!t.margenFiable && t.cobPct!==null) ? `
        <p style="margin:-4px 0 12px;font-size:12.5px;line-height:1.5;
          background:#FFF9EC;border-left:3px solid var(--aviso);
          border-radius:0 8px 8px 0;padding:9px 11px;color:#6B5314">
          Los dos márgenes no son comparables: este año hay coste válido en el
          <b>${t.cobPct.toFixed(0)} %</b> de la venta y el año pasado en el
          <b>${t.cobPctAnt.toFixed(0)} %</b>. La diferencia de puntos viene en
          parte de ahí, no de la gestión.
        </p>` : ""}
      ${(()=>{const tx=tendencia(t); return tx
        ? `<p style="margin:-4px 0 13px;font-size:13.5px;color:var(--tenue);
             line-height:1.5">${tx}</p>` : "";})()}
      <div class="cifras">
        <div class="cifra"><div class="v">${eur(t.act)}</div><div class="e">Este año</div></div>
        <div class="cifra"><div class="v ${t.varPct<0?"baja":"sube"}">${t.varPct!==null?pct(t.varPct):"—"}</div>
          <div class="e">vs mismo periodo</div></div>
        <div class="cifra">
          <div class="v">${eur(t.mes)}
            ${t.varMes!==null?`<span style="font-size:15px;font-weight:800;margin-left:5px"
              class="${t.varMes<0?"baja":"sube"}">${pct(t.varMes)}</span>`:""}</div>
          <div class="e">Este mes${t.mesAnt?` · antes ${eur(t.mesAnt)}`:""}</div>
        </div>
        <div class="cifra">
          <div class="v">${t.margenPct!==null?t.margenPct.toFixed(1)+" %":"—"}
            ${(t.margenPct!==null&&t.margenPctAnt!==null)?`<span style="font-size:15px;
              font-weight:800;margin-left:5px" class="${t.margenPct<t.margenPctAnt?"baja":"sube"}"
              >${t.margenPct-t.margenPctAnt>0?"+":""}${(t.margenPct-t.margenPctAnt).toFixed(1)} pts</span>`:""}</div>
          <div class="e">Margen${t.margenPctAnt!==null?` · antes ${t.margenPctAnt.toFixed(1)} %`:""}</div>
        </div>
        <div class="cifra">
          <div class="v">${t.margenPctMes!==null?t.margenPctMes.toFixed(1)+" %":"—"}
            ${(t.margenPctMes!==null&&t.margenPctMesAnt!==null)?`<span style="font-size:15px;
              font-weight:800;margin-left:5px" class="${t.margenPctMes<t.margenPctMesAnt?"baja":"sube"}"
              >${t.margenPctMes-t.margenPctMesAnt>0?"+":""}${(t.margenPctMes-t.margenPctMesAnt).toFixed(1)} pts</span>`:""}</div>
          <div class="e">Margen del mes${t.margenPctMesAnt!==null?` · antes ${t.margenPctMesAnt.toFixed(1)} %`:""}</div>
        </div>
      </div>
    </div>`;

    if(alc.tipo!=="agente"){
      const caen=alc.lista.filter(a=>a.variacionPct!==null&&a.variacionPct<0&&a.ventasAntYTD>20000)
        .sort((a,b)=>a.variacionPct-b.variacionPct).slice(0,6);
      const suben=alc.lista.filter(a=>a.variacionPct!==null&&a.variacionPct>0&&a.ventasAct>20000)
        .sort((a,b)=>b.variacionPct-a.variacionPct).slice(0,5);

      html += `<h2>Quién baja</h2><div class="grupo">${
        caen.length
          ? caen.map(a=>filaAgente(a,
              `${eur(a.ventasAntYTD-a.ventasAct)} menos · ${a.equipo||"sin equipo"}`)).join("")
          : `<p class="vacio">Nadie cae respecto al año pasado.</p>`
      }</div>`;

      html += `<h2>Quién crece</h2><div class="grupo">${
        suben.length
          ? suben.map(a=>filaAgente(a,
              `${eur(a.ventasAct-a.ventasAntYTD)} más · ${a.equipo||"sin equipo"}`)).join("")
          : `<p class="vacio">Sin crecimientos destacables.</p>`
      }</div>`;

      // Margen por debajo del objetivo: lo que no se ve en la cifra de ventas
      const flojos=alc.lista
        .filter(a=>a.desviacionObjetivo!==null&&a.desviacionObjetivo!==undefined
                   &&a.desviacionObjetivo<0&&a.ventasAct>20000)
        .sort((a,b)=>a.desviacionObjetivo-b.desviacionObjetivo).slice(0,6);
      if(flojos.length){
        html += `<h2>Margen por debajo del objetivo</h2><div class="grupo">${
          flojos.map(a=>`<div class="fila">
            <div><div class="nom">${a.agente}</div>
              <div class="det">objetivo ${(a.objetivoMargen||0).toFixed(1)} % · ${a.equipo||""}</div></div>
            <div class="der"><div class="imp">${(a.margenPctAct||0).toFixed(1)} %</div>
              <div class="pct baja">${a.desviacionObjetivo.toFixed(1)} pts</div></div>
          </div>`).join("")
        }</div>`;
      }
    }else{
      const a=alc.lista[0];
      html += `<div class="grupo" style="margin-bottom:14px">
        <div class="fila pulsa" onclick="verAgente('${String(a._id).replace(/'/g,"")}')">
          <div><div class="nom">Ver dónde ganas y dónde pierdes</div>
            <div class="det">Cliente a cliente</div></div>
          <span class="chev" style="margin-left:auto">→</span>
        </div></div>`;
      const dormidos=(a.clientes||0)-(a.clientesConVentaMes||0);
      html += `<h2>Tu cartera</h2><div class="grupo">
        <div class="fila"><div><div class="nom">${a.clientes||0} clientes asignados</div>
          <div class="det">${a.clientesConVentaMes||0} han comprado este mes</div></div></div>
        <div class="fila"><div><div class="nom">${dormidos} sin comprar este mes</div>
          <div class="det">Es tu lista de recuperación</div></div></div>
        <div class="fila"><div><div class="nom">Margen ${(a.margenPctAct||0).toFixed(1)} %</div>
          <div class="det">objetivo ${(a.objetivoMargen||0).toFixed(1)} %${
            a.desviacionObjetivo!=null
              ? ` · ${a.desviacionObjetivo>0?"por encima":"por debajo"} ${Math.abs(a.desviacionObjetivo).toFixed(1)} pts`
              : ""}</div></div></div>
      </div>`;
    }

    if(alc.tipo!=="agente"){
      html += `<h2>Reparto por equipo</h2><div class="grupo">${(()=>{
        const eq={};
        for(const a of alc.lista){
          const k=a.equipo||"Sin equipo";
          eq[k]=eq[k]||{act:0,ant:0,n:0};
          eq[k].act+=a.ventasAct||0; eq[k].ant+=a.ventasAntYTD||0; eq[k].n++;
        }
        const filas=Object.entries(eq).sort((a,b)=>b[1].act-a[1].act);
        if(!filas.length) return `<p class="vacio">Sin datos.</p>`;
        return filas.map(([k,v])=>{
          const p=v.ant?(v.act-v.ant)/v.ant*100:null;
          return `<div class="fila">
            <div><div class="nom">${k}</div><div class="det">${v.n} vendedores</div></div>
            <div class="der"><div class="imp">${eur(v.act)}</div>
              <div class="pct ${p<0?"baja":"sube"}">${p!==null?pct(p):"—"}</div></div>
          </div>`;
        }).join("");
      })()}</div>`;
    }

    html += `<p class="pie">${
      dias!==null && dias>=2
        ? `⚠️ Datos de hace ${dias} días. La sincronización puede haber fallado.`
        : `Ventas reales de Power BI${sync?" · "+new Date(sync).toLocaleDateString("es-ES"):""} · v1.6`
    }</p>`;

    $("app").innerHTML=html;
  }
}

arrancar();
</script>
</body>
</html>
