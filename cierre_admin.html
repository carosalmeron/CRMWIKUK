<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cierre de cobros</title>
<script src="/recuperacion_comun.js?v=20261004c"></script>
<style>
:root{--tinta:#0F172A;--tenue:#64748B;--linea:#E2E8F0;--ok:#15803D;--mal:#B91C1C;--med:#B45309}
*{box-sizing:border-box}
body{margin:0;background:#F8FAFC;color:var(--tinta);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.cab{background:var(--tinta);color:#fff;padding:16px 18px 18px}
.cab h1{margin:0;font-size:20px}.cab p{margin:3px 0 0;color:#A7B2BE;font-size:13px}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 120px}
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:13px 15px;margin:10px 0}
.ct{margin:0 0 2px;font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--tenue);text-transform:uppercase}
.cs{margin:0 0 8px;color:var(--tenue);font-size:13px}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tile{flex:1;min-width:110px;background:#F8FAFC;border-radius:12px;padding:9px 11px}
.tile span{display:block;font-size:10.5px;font-weight:800;color:var(--tenue);text-transform:uppercase}
.tile b{font-size:19px}
.bar{height:10px;border-radius:99px;background:#F1F5F9;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;border-radius:99px}
.fila{border-top:1px solid #EEF1F5;padding:9px 0;display:flex;gap:10px;align-items:flex-start}
.fila .n{flex:1;min-width:0}.fila .n b{font-size:14px}.fila .n small{display:block;color:var(--tenue);font-size:12px}
.imp{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{border:1.5px solid var(--c,#CBD5E1);background:#fff;color:var(--c,#0F172A);border-radius:99px;padding:6px 11px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--c);color:#fff}
.est{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:800}
details.sec{background:#fff;border:1px solid var(--linea);border-radius:14px;margin:10px 0;padding:0 15px}
details.sec>summary{cursor:pointer;list-style:none;padding:13px 0;display:flex;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
.num{width:26px;height:26px;border-radius:99px;background:var(--tinta);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.sub{font-size:12px;font-weight:800;letter-spacing:.04em;margin:12px 0 2px;padding:6px 10px;border-radius:9px}
textarea{width:100%;min-height:70px;border:1.5px solid #CBD5E1;border-radius:10px;padding:10px;font:inherit;font-size:14px}
.pie{position:fixed;left:0;right:0;bottom:0;background:var(--tinta);color:#fff;padding:12px 16px}
.pie .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.pie button{flex:none;border:none;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:var(--tinta)}
.pie button:disabled{opacity:.45;cursor:default}
.estado{padding:40px 10px;text-align:center;color:var(--tenue)}
</style></head><body>
<div class="cab"><h1>💳 Cierre de cobros · semana <span id="semT"></span></h1><p id="cabSub">Administración de clientes</p></div>
<div class="wrap" id="app"><p class="estado">Leyendo compromisos y cobros…</p></div>
<div class="pie" id="pie" hidden><div class="in"><div id="pieTxt" style="flex:1;font-size:13px"></div><button id="btnCerrar" onclick="cerrar()">✓ Cerrar la semana de cobros</button></div></div>
<script>
// ══════════════════════════════════════════════════════════════════════
// (oct 2026) CIERRE SEMANAL DE ADMINISTRACIÓN (cobros)
//   1 · Compromisos de ESTA semana: lo previsto, lo cobrado y lo que no.
//       Lo que lleva 2 semanas o más sin cobrar, y las facturas en riesgo
//       de seguro (+90 días) o que ya van al seguro (+110 días).
//   2 · Lo que ha entrado esta semana, los compromisos de la semana que
//       viene y las facturas de más de 2.000 € sin compromiso del comercial.
// Todo sale de la misma ficha de Cobros (compromisos) y del Excel de cobros.
// ══════════════════════════════════════════════════════════════════════
const P=new URLSearchParams(location.search);
const UID=P.get("uid")||"", NOMBRE=P.get("nombre")||"Administración", SOLOVER=P.get("solover")==="1";
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const eur=(n)=>Math.round(Number(n)||0).toLocaleString("es-ES")+" €";
const NZ=(x)=>String(x||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const iso=(d)=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fES=(s)=>RC.fechaES(s);
function isoSem(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  return {anio:t.getUTCFullYear(),sem:Math.ceil((((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/86400000)+1)/7)}; }
const W=(()=>{ const h=isoSem(new Date()); return {anio:Number(P.get("anio"))||h.anio,sem:Number(P.get("semana"))||h.sem}; })();
const lunesDe=(a,s)=>{ const e=new Date(a,0,4), l=new Date(e); l.setDate(e.getDate()-((e.getDay()||7)-1)); l.setDate(l.getDate()+(s-1)*7); l.setHours(0,0,0,0); return l; };
const L1=lunesDe(W.anio,W.sem), D1=new Date(L1); D1.setDate(D1.getDate()+6);
const L2=new Date(L1); L2.setDate(L2.getDate()+7); const D2=new Date(L2); D2.setDate(D2.getDate()+6);
const SL1=iso(L1), SD1=iso(D1), SL2=iso(L2), SD2=iso(D2), HOY=iso(new Date());
const enRango=(s,a,b)=>!!s&&s>=a&&s<=b;
document.getElementById("semT").textContent=W.sem;
document.getElementById("cabSub").textContent=`Del ${fES(SL1)} al ${fES(SD1)} · ${NOMBRE}`;
const por={id:UID||"administracion",nombre:NOMBRE};
let COMP=[], COB=[], FLUJO=null, PEDIDOS=new Set();
const ABIERTO=(i)=>i.estadoCobro!=="pagado"&&!/resuelta|cerrada/.test(i.estado||"");

async function cargar(){
  const [c,cb,fl]=await Promise.all([RC.leerCompromisos().catch(()=>[]),RC.leer("cobros_comercial").catch(()=>[]),
    fetch(`${RC.FB}/cierres_flujo/${W.anio}_s${W.sem}_admin`,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)]);
  COMP=c; COB=cb; FLUJO=fl&&fl.fields?RC.desdeFB(fl):null;
  pintar();
}
// Facturas del Excel de cobros: una línea por factura vencida (con días) o por saldo de cliente y empresa
function lineasCobro(){
  const out=[];
  COB.forEach(d=>{ let L=[]; try{ L=typeof d.datos==="string"?JSON.parse(d.datos||"[]"):(d.datos||[]); }catch(e){}
    const corte=String(d.fechaDatos||d.actualizado||HOY).slice(0,10)||HOY, com=d.comercial||d._id;
    L.forEach(cli=>{ const fv=(cli.f||[]).filter(f=>f.fv&&f.fv<corte);
      if(fv.length) fv.forEach(f=>{ const dias=Math.round((Date.parse(corte+"T12:00:00Z")-Date.parse(f.fv+"T12:00:00Z"))/86400000);
          out.push({com,cli:cli.c||"",cod:cli.cod||"",n:f.n||"",g:f.g||"",fv:f.fv,im:Number(f.im)||0,dias}); });
      else if(cli.emp) Object.entries(cli.emp).forEach(([g,e])=>{ const v=Number(e.ven)||0; if(v>=1) out.push({com,cli:cli.c||"",cod:cli.cod||"",n:"",g,saldo:true,im:v,v70:Number(e.v70)||0,dias:Number(e.v70)>=1?71:Number(e.v20)>=1?21:0}); });
      else if(Number(cli.ven)>=1) out.push({com,cli:cli.c||"",cod:cli.cod||"",n:"",g:"",saldo:true,im:Number(cli.ven)||0,v70:Number(cli.v70)||0,dias:Number(cli.v70)>=1?71:0});
    }); });
  return out;
}
const estH=(i)=>{ const E=RC.ESTADO_COBRO[i.estadoCobro]||["",""]; return `<span class="est" style="background:${E[1]}1A;color:${E[1]}">${esc(E[0])}</span>`; };
const nomCom=(c)=>String(c||"").toUpperCase();
// Comerciales que no son personas (intercompañía, tienda, sin comercial…) y clientes del propio grupo
const NO_PERSONA=/^(interc|sincomercial|clientsdirect|cataluna|tienda|telefono|sinagente|total|campofrio|wikuk|interkey|francia|distribuidor)/i;
const CLI_GRUPO=/WIKUK|UNITED CARO|INTERKEY/i;
const esPersona=(c)=>!NO_PERSONA.test(String(c||"").replace(/[.\s_-]/g,""));
// Una sola línea por cliente: su compromiso más reciente (los anteriores quedan en su hilo)
function ultimos(){ const m={}; COMP.forEach(i=>{ const k=NZ(i.clienteNombre||i.cliente), t=String(i.fechaUltimoCambio||i.fechaCreacion||"");
    if(!m[k]||t>m[k]._t){ i._t=t; m[k]=i; } }); return Object.values(m); }
const btnPedir=(k,txt)=>SOLOVER?"":PEDIDOS.has(k)?`<span style="font-size:12px;color:#15803D;font-weight:700">✓ Pedido al comercial</span>`
  :`<button class="chip" style="--c:#7C3AED" onclick="pedir('${esc(k)}')">📨 ${txt||"Pedir compromiso al comercial"}</button>`;
function filaComp(i,conBotones){
  const dec=i.estadoCobro==="pagado", k="c:"+i._id; PED[k]={com:i.agente,cli:i.clienteNombre||i.cliente,im:i.importeCompromiso,txt:"El compromiso «"+(i.accionCobro||"")+"» para el "+fES(i.fechaCompromiso)+" no se ha cumplido."};
  return `<div class="fila"><div class="n"><b>${esc(i.clienteNombre||i.cliente)}</b>
      <small>${esc(nomCom(i.agente))} · ${esc(i.accionCobro||"")} · para el ${esc(fES(i.fechaCompromiso))}</small>
      <div style="margin-top:4px">${estH(i)}</div>
      ${conBotones&&!SOLOVER&&!dec?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        ${i.estadoCobro!=="no_pagado"?`<button class="chip" style="--c:#15803D" onclick="decidir('${esc(i._id)}','ok')">✅ Cobrado</button>
        <button class="chip" style="--c:#B91C1C" onclick="decidir('${esc(i._id)}','no')">❌ No cobrado</button>`:`<button class="chip" style="--c:#15803D" onclick="decidir('${esc(i._id)}','ok')">✅ Ya ha cobrado</button>`}
        ${btnPedir(k,"Pedir nuevo compromiso")}</div>`:""}</div>
    <div class="imp" style="color:${dec?"#15803D":"#B91C1C"}">${eur(i.importeCompromiso)}</div></div>`;
}
const PED={};
function pintar(){
  const UL=ultimos(), sumC=(l)=>l.reduce((t,i)=>t+(Number(i.importeCompromiso)||0),0), sum=(l)=>l.reduce((t,f)=>t+(Number(f.im)||0),0);
  // 1 · Compromisos que vencían esta semana (o antes) — cumplidos y no cumplidos
  const semana=UL.filter(i=>enRango(i.fechaCompromiso,SL1,SD1));
  const cobrados=UL.filter(i=>i.estadoCobro==="pagado"&&(enRango(i.fechaCompromiso,SL1,SD1)||enRango(String(i.fechaUltimoCambio||"").slice(0,10),SL1,SD1)));
  const noHecho=UL.filter(i=>ABIERTO(i)&&i.fechaCompromiso&&i.fechaCompromiso<=SD1).sort((a,b)=>(Number(b.importeCompromiso)||0)-(Number(a.importeCompromiso)||0));
  const prev=sumC(semana), cob=sumC(semana.filter(i=>i.estadoCobro==="pagado")), pc=prev?Math.round(cob/prev*100):0;
  const lim14=new Date(); lim14.setDate(lim14.getDate()-14); const S14=iso(lim14);
  const dosSem=noHecho.filter(i=>i.fechaCompromiso<=S14);
  // 2 · Seguro
  const LC=lineasCobro().filter(f=>esPersona(f.com)&&!CLI_GRUPO.test(f.cli));
  const cobradoRec=new Set(UL.filter(i=>i.estadoCobro==="pagado").map(i=>NZ(i.clienteNombre||i.cliente)));
  const seg=LC.filter(f=>!f.saldo&&f.dias>RC.SEGURO_RIESGO&&!cobradoRec.has(NZ(f.cli))).sort((a,b)=>b.dias-a.dias);
  const segVa=seg.filter(f=>f.dias>RC.SEGURO_VA), segR=seg.filter(f=>f.dias<=RC.SEGURO_VA);
  const sald70=LC.filter(f=>f.saldo&&f.v70>=1&&!cobradoRec.has(NZ(f.cli)));
  // 3 · Semana que viene + grandes sin compromiso
  const proxima=UL.filter(i=>enRango(i.fechaCompromiso,SL2,SD2)&&ABIERTO(i)).sort((a,b)=>String(a.fechaCompromiso).localeCompare(String(b.fechaCompromiso))||(Number(b.importeCompromiso)||0)-(Number(a.importeCompromiso)||0));
  const conAlgo=new Set(UL.map(i=>NZ(i.clienteNombre||i.cliente)));   // con compromiso abierto o ya cobrado: no se pide otro
  const grandes=LC.filter(f=>f.im>=2000&&!conAlgo.has(NZ(f.cli))).sort((a,b)=>b.im-a.im);
  const porDecidir=noHecho.filter(i=>i.estadoCobro!=="no_pagado"&&i.fechaCompromiso<=HOY);
  window._R={prev,cob,pc,semana:semana.length,cobN:cobrados.length,noHecho:noHecho.length,noHechoEur:sumC(noHecho),dosSem:dosSem.length,dosSemEur:sumC(dosSem),
    segVa:segVa.length,segVaEur:sum(segVa),segR:segR.length,segREur:sum(segR),proxima:proxima.length,proximaEur:sumC(proxima),grandes:grandes.length,grandesEur:sum(grandes),porDecidir:porDecidir.length};
  const segFila=(f)=>{ const k="f:"+NZ(f.cli)+"|"+f.n; PED[k]={com:f.com,cli:f.cli,im:f.im,txt:`Factura ${f.n} (${f.g}) de ${eur(f.im)} con ${f.dias} días: ${f.dias>RC.SEGURO_VA?"VA AL SEGURO":"en riesgo de ir al seguro"}.`};
    return `<div class="fila"><div class="n"><b>${esc(f.cli)}</b> ${RC.seguroTag(f.dias,true)}
      <small>${esc(nomCom(f.com))} · factura ${esc(f.n||"—")} · ${esc(f.g)} · venció el ${esc(fES(f.fv))} · <b style="color:#B91C1C">${f.dias} días</b></small>
      <div style="margin-top:6px">${btnPedir(k)}</div></div>
    <div class="imp" style="color:#B91C1C">${eur(f.im)}</div></div>`; };
  let h="";
  if(FLUJO) h+=`<div class="card" style="border-color:#86EFAC;background:#F0FDF4"><b style="color:#15803D">✓ Semana ${W.sem} de cobros cerrada</b>${FLUJO.porNombre?" por "+esc(FLUJO.porNombre):""}${FLUJO.nota?`<div style="margin-top:4px;font-size:13px">${esc(FLUJO.nota)}</div>`:""}</div>`;
  h+=`<div class="card"><div class="tiles" style="margin:0"><div class="tile"><span>Previsto semana</span><b>${eur(prev)}</b></div>
      <div class="tile"><span>Cobrado</span><b style="color:#15803D">${eur(cob)}</b></div><div class="tile"><span>No cumplido</span><b style="color:#B91C1C">${eur(sumC(noHecho))}</b></div></div>
    <div class="bar"><i style="width:${Math.min(100,pc)}%;background:${pc>=80?"#16A34A":pc>=50?"#D97706":"#DC2626"}"></i></div>
    <div style="font-size:12px;color:var(--tenue)">${pc} % de lo comprometido para esta semana · una línea por cliente (su compromiso más reciente)</div></div>`;
  // ── 1 ──
  h+=`<details class="sec" open><summary><span class="num">1</span><div style="flex:1"><b>Tenía compromiso y no se ha cobrado</b><div class="cs" style="margin:0">${noHecho.length} clientes · ${eur(sumC(noHecho))}${dosSem.length?" · "+dosSem.length+" con 2 semanas o más":""}</div></div></summary>
    ${noHecho.length?noHecho.map(i=>filaComp(i,true)).join(""):`<p class="cs">Todo lo comprometido está cobrado.</p>`}
    ${cobrados.length?`<details style="margin:10px 0"><summary style="cursor:pointer;font-size:12.5px;font-weight:800;color:#15803D">✅ Cobrado esta semana · ${cobrados.length} · ${eur(sumC(cobrados))}</summary>${cobrados.map(i=>filaComp(i,false)).join("")}</details>`:""}
  </details>`;
  // ── 2 ──
  h+=`<details class="sec" open><summary><span class="num">2</span><div style="flex:1"><b>Riesgo de seguro</b><div class="cs" style="margin:0">🛡️ ${segVa.length} van al seguro (${eur(sum(segVa))}) · ⚠️ ${segR.length} en riesgo (${eur(sum(segR))})</div></div></summary>
    <div class="sub" style="background:#7F1D1D;color:#fff">🛡️ VAN AL SEGURO · MÁS DE ${RC.SEGURO_VA} DÍAS · ${segVa.length} · ${eur(sum(segVa))}</div>
    ${segVa.length?segVa.map(segFila).join(""):`<p class="cs">Ninguna.</p>`}
    <div class="sub" style="background:#FEE2E2;color:#B91C1C">⚠️ EN RIESGO · DE ${RC.SEGURO_RIESGO} A ${RC.SEGURO_VA} DÍAS · ${segR.length} · ${eur(sum(segR))}</div>
    ${segR.length?segR.map(segFila).join(""):`<p class="cs">Ninguna.</p>`}
    ${sald70.length?`<p class="cs" style="margin-top:8px">Además, ${sald70.length} clientes tienen saldo de <b>más de 70 días</b> (${eur(sald70.reduce((t,f)=>t+f.v70,0))}) sin fecha de cada factura en el Excel: no se puede saber si pasan de 90 o 110 días.</p>`:""}
  </details>`;
  // ── 3 ──
  h+=`<details class="sec" open><summary><span class="num">3</span><div style="flex:1"><b>La semana que viene</b><div class="cs" style="margin:0">${proxima.length} compromisos · ${eur(sumC(proxima))} · ${grandes.length} de +2.000 € sin compromiso</div></div></summary>
    <div class="sub" style="background:#F0FDF4;color:#15803D">📅 COMPROMISOS DEL ${esc(fES(SL2))} AL ${esc(fES(SD2))} · ${proxima.length} · ${eur(sumC(proxima))}</div>
    ${proxima.length?proxima.map(i=>filaComp(i,false)).join(""):`<p class="cs">Ninguno todavía.</p>`}
    <div class="sub" style="background:#FEF2F2;color:#B91C1C">💶 MÁS DE 2.000 € FUERA DE PLAZO SIN COMPROMISO DEL COMERCIAL · ${grandes.length} · ${eur(sum(grandes))}</div>
    ${grandes.length?grandes.map(f=>{ const k="g:"+NZ(f.cli)+"|"+f.g; PED[k]={com:f.com,cli:f.cli,im:f.im,txt:`${f.cli} tiene ${eur(f.im)} fuera de plazo${f.n?" (factura "+f.n+", "+f.dias+" días)":""} y no tiene compromiso de pago.`};
      return `<div class="fila"><div class="n"><b>${esc(f.cli)}</b> ${f.saldo?"":RC.seguroTag(f.dias,true)}
        <small>${esc(nomCom(f.com))} · ${f.saldo?"saldo fuera de plazo "+esc(f.g):"factura "+esc(f.n)+" · "+esc(f.g)+" · "+f.dias+" días"}</small>
        <div style="margin-top:6px">${btnPedir(k)}</div></div><div class="imp" style="color:#B91C1C">${eur(f.im)}</div></div>`; }).join(""):`<p class="cs">Todas tienen compromiso.</p>`}
    <p class="cs" style="margin-top:8px">No salen los clientes del propio grupo ni los que no tienen comercial asignado.</p>
  </details>`;
  if(!SOLOVER&&!FLUJO) h+=`<div class="card"><p class="ct">Comentario de la semana</p><textarea id="nota" placeholder="Lo importante de los cobros de esta semana (opcional)"></textarea></div>`;
  document.getElementById("app").innerHTML=h;
  const pie=document.getElementById("pie");
  if(SOLOVER||FLUJO){ pie.hidden=true; return; }
  pie.hidden=false;
  document.getElementById("pieTxt").innerHTML=porDecidir.length?`Faltan <b>${porDecidir.length}</b> compromiso${porDecidir.length===1?"":"s"} por marcar (cobrado o no)`:"Todo marcado";
  document.getElementById("btnCerrar").disabled=porDecidir.length>0;
}
window.decidir=async(id,r)=>{
  const i=COMP.find(x=>x._id===id); if(!i) return;
  try{
    if(r==="ok") await RC.cobroPagado(i,por,"");
    else { const t=prompt("¿Qué le dices al comercial? (le llega por correo y queda en el hilo)","No consta el pago."); if(t===null) return; await RC.cobroReclamar(i,por,t); }
    pintar();
  }catch(e){ alert("No se ha guardado: "+e.message); }
};
window.pedir=async(k)=>{
  const f=PED[k]; if(!f) return;
  try{ const d=await RC.avisarGenerico({agente:f.com,quienId:UID,quien:NOMBRE,titulo:f.cli,etiqueta:"Cobros · pon compromiso de pago",
      texto:f.txt+" Pon la acción y la fecha en su ficha de Cobros.",
      pie:"Entra en Cobros, busca el cliente y pulsa «📅 Poner acción y fecha» (o «Nueva fecha / acción»)."});
    PEDIDOS.add(k); pintar(); alert(RC.textoAviso?RC.textoAviso(d):"Enviado"); }
  catch(e){ alert("No se ha enviado: "+e.message); }
};
window.cerrar=async()=>{
  const b=document.getElementById("btnCerrar"); b.disabled=true; b.textContent="Guardando…";
  const R=window._R||{}, nota=((document.getElementById("nota")||{}).value||"").trim();
  try{
    await RC.guardarEn("cierres_flujo",`${W.anio}_s${W.sem}_admin`,{anio:W.anio,semana:W.sem,paso:"admin",por:UID||"administracion",porNombre:NOMBRE,
