<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radiografía CRM — Grupo Consolidado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08131D;        /* fondo consola */
  --panel:#0F2231;      /* paneles */
  --panel2:#16303F;     /* paneles elevados */
  --line:#1F4155;       /* bordes */
  --text:#E6F1F7;
  --muted:#7FA2B5;
  --green:#3DDC84;
  --amber:#FFB020;
  --red:#FF5C5C;
  --blue:#4FC3F7;
  --violet:#B48CFF;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px}

/* ── Cabecera ───────────────────────────────────────── */
header{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0C1C28 0%,#08131D 100%);
  position:sticky;top:0;z-index:20;
}
.hd{max-width:1180px;margin:0 auto;padding:16px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;flex:1;min-width:220px}
.brand h1{font-size:19px;font-weight:700}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:7px;vertical-align:1px}
.pulse.on{background:var(--green);box-shadow:0 0 0 0 rgba(61,220,132,.5);animation:p 2s infinite}
.pulse.err{background:var(--red)}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);padding:9px 15px;transition:.15s;font-weight:500}
button:hover{background:#1D3E52;border-color:#2C5B75}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.primary{background:var(--green);border-color:var(--green);color:#06231A;font-weight:600}
button.primary:hover{background:#5AE99A}
button:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent}

/* ── Navegación ─────────────────────────────────────── */
nav{border-bottom:1px solid var(--line);background:#0A1926;position:sticky;top:69px;z-index:19;overflow-x:auto}
.nv{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;gap:2px;min-width:max-content}
.tab{padding:12px 14px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;border-radius:0;white-space:nowrap;font-size:13px}
.tab:hover{background:none;color:var(--text)}
.tab.sel{color:var(--text);border-bottom-color:var(--green)}
.tab .n{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);margin-right:6px}

/* ── Bloques ────────────────────────────────────────── */
section{display:none;padding-top:26px}
section.sel{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.kpi .lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:"JetBrains Mono",monospace;font-size:27px;font-weight:700;line-height:1.15;margin-top:6px}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:3px}
.tag{display:inline-block;font-size:10.5px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.tag.ok{color:var(--green);border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.08)}
.tag.warn{color:var(--amber);border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.08)}
.tag.bad{color:var(--red);border-color:rgba(255,92,92,.35);background:rgba(255,92,92,.08)}
.tag.info{color:var(--blue);border-color:rgba(79,195,247,.35);background:rgba(79,195,247,.08)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
   font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid rgba(31,65,85,.5)}
tr:hover td{background:rgba(31,65,85,.22)}
td.num,th.num{text-align:right;font-family:"JetBrains Mono",monospace}
.scroll{overflow-x:auto}

/* barra horizontal */
.bar{height:7px;border-radius:4px;background:#173040;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.rank{display:flex;flex-direction:column;gap:9px}
.rank .row{display:grid;grid-template-columns:1fr 66px;gap:10px;align-items:center}
.rank .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .qt{font-family:"JetBrains Mono",monospace;font-size:12px;text-align:right;color:var(--muted)}
.rank .bar{grid-column:1/3;margin-top:-4px}

/* mapa de campos (firma) */
.mapa{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.frow{display:grid;grid-template-columns:minmax(150px,1.4fr) 1fr 78px 92px;gap:12px;align-items:center;
      background:var(--panel);padding:7px 12px;font-size:12.5px}
.frow:hover{background:var(--panel2)}
.frow .fn{font-family:"JetBrains Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .pc{font-family:"JetBrains Mono",monospace;text-align:right;font-size:12px}
.frow .ty{font-size:10.5px;color:var(--muted);text-align:right;overflow:hidden;white-space:nowrap}
.chead{background:var(--panel2);padding:9px 12px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:13px;
       display:flex;justify-content:space-between;align-items:center;gap:10px}
.chead span{font-weight:400;color:var(--muted);font-size:11.5px;font-family:Inter,sans-serif}

/* uso / oportunidades */
.uso{border:1px solid var(--line);border-radius:var(--r);padding:15px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.uso h3{font-size:13.5px}
.uso p{margin:0;font-size:12.5px;color:#B9D2DE}
.uso .meta{font-size:11.5px;color:var(--muted);font-family:"JetBrains Mono",monospace}
.uso.listo{border-left:3px solid var(--green)}
.uso.parcial{border-left:3px solid var(--amber)}
.uso.falta{border-left:3px solid var(--red)}

.hint{background:rgba(79,195,247,.07);border:1px solid rgba(79,195,247,.25);border-radius:var(--r);padding:14px;font-size:12.5px;color:#C4DEEA}
.hint code{font-family:"JetBrains Mono",monospace;font-size:11.5px;background:rgba(0,0,0,.3);padding:2px 5px;border-radius:4px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{font-size:17px;color:var(--text);margin-bottom:8px}
.log{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);max-height:180px;overflow:auto;
     background:#0A1926;border:1px solid var(--line);border-radius:8px;padding:10px}
.log div{padding:1px 0}
.log b{color:var(--green);font-weight:400}
.log i{color:var(--red);font-style:normal}
@media (max-width:640px){
  .frow{grid-template-columns:minmax(110px,1.3fr) 1fr 60px;font-size:12px}
  .frow .ty{display:none}
  nav{top:auto;position:static}
  header{position:static}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand">
      <h1>Radiografía CRM</h1>
      <small><span class="pulse" id="pulse"></span><span id="estado">Sin conectar</span></small>
    </div>
    <button class="primary" id="btnCargar">Leer todo el CRM</button>
    <button class="ghost" id="btnInforme" disabled>Descargar informe</button>
    <button class="ghost" id="btnJson" disabled>Descargar datos (JSON)</button>
  </div>
</header>

<nav><div class="nv" id="nav"></div></nav>

<div class="wrap">

  <!-- RESUMEN -->
  <section id="s-resumen" class="sel">
    <div id="bienvenida" class="empty">
      <h2>Conecta y lee la base entera</h2>
      <p>Lee todas las colecciones de <span class="mono">grupo-consolidado-crm</span>, mide qué hay dentro,<br>
      qué está bien, qué está roto y qué se puede construir con ello.</p>
      <p style="margin-top:22px"><button class="primary" onclick="cargarTodo()">Leer todo el CRM</button></p>
    </div>
    <div id="resumen" style="display:none"></div>
  </section>

  <!-- COLECCIONES -->
  <section id="s-colecciones"><div id="colecciones"></div></section>

  <!-- MAPA DE CAMPOS -->
  <section id="s-campos"><div id="campos"></div></section>

  <!-- CALIDAD -->
  <section id="s-calidad"><div id="calidad"></div></section>

  <!-- NEGOCIO -->
  <section id="s-negocio"><div id="negocio"></div></section>

  <!-- QUÉ SE PUEDE HACER -->
  <section id="s-usos"><div id="usos"></div></section>

</div>

<script>
/* ══════════════════════════════════════════════════════════════
   1. CONEXIÓN — API REST de Firestore, misma vía que usa el CRM
   ══════════════════════════════════════════════════════════════ */
const PROYECTO = "grupo-consolidado-crm";
const FB = `https://firestore.googleapis.com/v1/projects/${PROYECTO}/databases/(default)/documents`;
const COLS = ["clientes","visitas","oportunidades","incidencias","tareas","muestras",
              "proyectos","estrategias","informes","productos","ofertas","pedidos"];

const DB = {};            // colección -> array de documentos
const META = {};          // colección -> {docs, error, ms}
let CARGADO = false;

function pv(v){                                   // valor Firestore -> JS
  if(v==null) return null;
  if(v.stringValue!==undefined)  return v.stringValue;
  if(v.integerValue!==undefined) return parseInt(v.integerValue,10);
  if(v.doubleValue!==undefined)  return parseFloat(v.doubleValue);
  if(v.booleanValue!==undefined) return v.booleanValue;
  if(v.timestampValue!==undefined) return v.timestampValue;
  if(v.nullValue!==undefined)    return null;
  if(v.arrayValue) return (v.arrayValue.values||[]).map(pv);
  if(v.mapValue)   return pm(v.mapValue.fields||{});
  return undefined;
}
function pm(f){ const o={}; for(const k in f){ const x=pv(f[k]); if(x!==undefined) o[k]=x; } return o; }
function fromDoc(d){
  const o = { id: d.name ? d.name.split("/").pop() : "" };
  if(d.fields) for(const k in d.fields){ const x=pv(d.fields[k]); if(x!==undefined) o[k]=x; }
  return o;
}

async function leerColeccion(nombre){
  const t0 = performance.now();
  let docs=[], token=null, vueltas=0;
  do{
    const url = `${FB}/${nombre}?pageSize=300${token?"&pageToken="+encodeURIComponent(token):""}`;
    const r = await fetch(url);
    if(!r.ok){
      const j = await r.json().catch(()=>({}));
      throw new Error(`${r.status} · ${j?.error?.message||"sin detalle"}`);
    }
    const data = await r.json();
    if(data.documents) docs = docs.concat(data.documents.map(fromDoc));
    token = data.nextPageToken || null;
    vueltas++;
  } while(token && vueltas < 60);
  return { docs, ms: Math.round(performance.now()-t0) };
}

async function cargarTodo(){
  const btn = document.getElementById("btnCargar");
  btn.disabled = true; btn.textContent = "Leyendo…";
  document.getElementById("bienvenida").innerHTML =
    `<h2>Leyendo la base</h2><p>Una colección cada vez, con paginación completa.</p>
     <div class="log" id="log" style="max-width:520px;margin:22px auto;text-align:left"></div>`;
  const log = document.getElementById("log");
  const linea = (t,cls)=>{ const d=document.createElement("div"); d.innerHTML = cls?`<${cls}>${t}</${cls}>`:t; log.appendChild(d); log.scrollTop=log.scrollHeight; };

  let vivos = 0, errores = 0;
  for(const c of COLS){
    linea(`→ ${c} …`);
    try{
      const { docs, ms } = await leerColeccion(c);
      DB[c] = docs; META[c] = { docs: docs.length, ms, error:null };
      log.lastChild.innerHTML = `<b>✓ ${c.padEnd(14," ")} ${String(docs.length).padStart(5," ")} docs · ${ms} ms</b>`;
      if(docs.length) vivos++;
    }catch(e){
      DB[c] = []; META[c] = { docs:0, ms:0, error:e.message };
      log.lastChild.innerHTML = `<i>✕ ${c.padEnd(14," ")} ${e.message}</i>`;
      errores++;
    }
  }

  CARGADO = true;
  const p = document.getElementById("pulse"), est = document.getElementById("estado");
  if(vivos===0){
    p.className="pulse err";
    est.textContent = "Sin lectura — revisa las reglas de Firestore";
    btn.disabled=false; btn.textContent="Reintentar";
    linea("");
    linea(`Ninguna colección respondió. Si el error es 403 o PERMISSION_DENIED, las reglas de Firestore no permiten lectura anónima desde este origen.`);
    return;
  }
  p.className="pulse on";
  est.textContent = `${vivos} colecciones · ${Object.values(META).reduce((a,m)=>a+m.docs,0).toLocaleString("es-ES")} documentos`;
  btn.textContent = "Releer";  btn.disabled = false;
  document.getElementById("btnInforme").disabled = false;
  document.getElementById("btnJson").disabled = false;
  pintarTodo();
}

/* ══════════════════════════════════════════════════════════════
   2. UTILIDADES DE ANÁLISIS
   ══════════════════════════════════════════════════════════════ */
const esVacio = v => v===null || v===undefined || v==="" ||
  (Array.isArray(v)&&v.length===0) || (typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).length===0);
const tipoDe = v => Array.isArray(v) ? "lista" : v===null ? "nulo" : typeof v==="object" ? "objeto" :
  typeof v==="number" ? "número" : typeof v==="boolean" ? "sí/no" : "texto";
const num = n => (n||0).toLocaleString("es-ES");
const eur = n => "€"+Math.round(n||0).toLocaleString("es-ES");
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n,uno,muchos)=> n===1?uno:muchos;
const norm = s => String(s??"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");

// primer campo no vacío de una lista de nombres posibles
function pick(o, nombres){
  for(const n of nombres){ if(o && !esVacio(o[n])) return o[n]; }
  return null;
}
// fecha: acepta "dd/mm/aa", "dd/mm/aaaa", ISO
function fecha(v){
  if(!v) return null;
  if(typeof v==="number") return new Date(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let a=+m[3]; if(a<100) a+=2000; const d=new Date(a,+m[2]-1,+m[1]); return isNaN(d)?null:d; }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
const dias = d => d ? Math.round((Date.now()-d.getTime())/864e5) : null;

// inventario de campos de una colección
function auditar(docs){
  const total = docs.length, campos = {};
  docs.forEach(d=>{
    for(const k in d){
      const c = campos[k] || (campos[k] = {presente:0, lleno:0, tipos:{}, distintos:new Set(), ejemplo:null});
      c.presente++;
      const v = d[k];
      if(!esVacio(v)){
        c.lleno++;
        c.tipos[tipoDe(v)] = (c.tipos[tipoDe(v)]||0)+1;
        if(c.distintos.size < 6000 && typeof v!=="object") c.distintos.add(String(v));
        if(c.ejemplo===null) c.ejemplo = typeof v==="object" ? JSON.stringify(v).slice(0,60) : String(v).slice(0,60);
      }
    }
  });
  return Object.entries(campos)
    .map(([n,c])=>({nombre:n, lleno:c.lleno, relleno:pct(c.lleno,total),
      tipos:Object.keys(c.tipos), distintos:c.distintos.size, ejemplo:c.ejemplo}))
    .sort((a,b)=>b.relleno-a.relleno || a.nombre.localeCompare(b.nombre));
}

// conteo agrupado -> array ordenado
function contar(arr, fn){
  const m = new Map();
  arr.forEach(x=>{ const k = fn(x); if(k===null||k===undefined||k==="") return;
    m.set(String(k), (m.get(String(k))||0)+1); });
  return [...m.entries()].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
}
function sumar(arr, fn){ return arr.reduce((a,x)=>a+(Number(fn(x))||0),0); }

/* ══════════════════════════════════════════════════════════════
   3. COMPONENTES DE PINTADO
   ══════════════════════════════════════════════════════════════ */
const kpi = (lab,val,foot="") =>
  `<div class="kpi"><div class="lab">${esc(lab)}</div><div class="val">${val}</div>
   ${foot?`<div class="foot">${foot}</div>`:""}</div>`;

function ranking(datos, max=12, color="var(--blue)"){
  if(!datos.length) return `<p class="sub" style="margin:0">Sin datos para agrupar.</p>`;
  const top = datos.slice(0,max), tope = top[0].v || 1;
  return `<div class="rank">` + top.map(d=>`
    <div class="row"><div class="nm">${esc(d.k)}</div><div class="qt">${num(d.v)}</div>
      <div class="bar"><i style="width:${Math.max(2,d.v*100/tope)}%;background:${color}"></i></div></div>`).join("") + `</div>`;
}
function tabla(cabeceras, filas){
  if(!filas.length) return `<p class="sub" style="margin:0">Nada que mostrar aquí.</p>`;
  return `<div class="scroll"><table><thead><tr>${cabeceras.map((h,i)=>
    `<th class="${i?"num":""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${
    filas.map(f=>`<tr>${f.map((c,i)=>`<td class="${i?"num":""}">${c}</td>`).join("")}</tr>`).join("")
  }</tbody></table></div>`;
}
const card = (titulo, sub, cuerpo) =>
  `<div class="card"><h2>${titulo}</h2><div class="sub">${sub}</div>${cuerpo}</div>`;

/* ══════════════════════════════════════════════════════════════
   4. PESTAÑAS
   ══════════════════════════════════════════════════════════════ */
const TABS = [
  {id:"resumen",    n:"01", t:"Resumen"},
  {id:"colecciones",n:"02", t:"Colecciones"},
  {id:"campos",     n:"03", t:"Mapa de campos"},
  {id:"calidad",    n:"04", t:"Calidad del dato"},
  {id:"negocio",    n:"05", t:"Lectura de negocio"},
  {id:"usos",       n:"06", t:"Qué puedes hacer"},
];
document.getElementById("nav").innerHTML = TABS.map((t,i)=>
  `<button class="tab${i===0?" sel":""}" data-t="${t.id}"><span class="n">${t.n}</span>${t.t}</button>`).join("");
document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("sel", x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("sel", s.id==="s-"+b.dataset.t));
  window.scrollTo({top:0, behavior:"instant"});
});

function pintarTodo(){
  pintarResumen(); pintarColecciones(); pintarCampos();
  pintarCalidad();  pintarNegocio();     pintarUsos();
}

/* ── 01 RESUMEN ─────────────────────────────────────── */
function pintarResumen(){
  document.getElementById("bienvenida").style.display="none";
  const cont = document.getElementById("resumen"); cont.style.display="block";

  const totalDocs = Object.values(META).reduce((a,m)=>a+m.docs,0);
  const vivas = COLS.filter(c=>META[c]?.docs>0);
  const vacias = COLS.filter(c=>META[c] && META[c].docs===0 && !META[c].error);
  const cal = calidadGlobal();
  const peso = Math.round(JSON.stringify(DB).length/1024);

  let h = `<div class="grid g4" style="margin-bottom:16px">
    ${kpi("Documentos leídos", num(totalDocs), `${vivas.length} colecciones con contenido`)}
    ${kpi("Campos distintos", num(cal.campos), `${cal.muertos} sin uso real`)}
    ${kpi("Relleno medio", cal.relleno+"%", "campos con valor sobre el total")}
    ${kpi("Peso en memoria", num(peso)+" KB", "todo el CRM en crudo")}
  </div>`;

  h += card("Qué contiene la base ahora mismo",
    "Volumen por colección, ordenado. Lo que está vacío también es información.",
    ranking(vivas.map(c=>({k:c, v:META[c].docs})), 12, "var(--green)") +
    (vacias.length ? `<p class="sub" style="margin:16px 0 0">Vacías o inexistentes: ${
      vacias.map(c=>`<span class="tag">${c}</span>`).join(" ")}</p>` : ""));

  const av = avisos();
  h += card("Lo que hay que mirar primero",
    "Ordenado por lo que más limita el uso de los datos.",
    av.length ? `<div class="grid g2">${av.slice(0,6).map(a=>
      `<div class="uso ${a.nivel}"><h3>${esc(a.titulo)}</h3><p>${a.detalle}</p></div>`).join("")}</div>`
      : `<p class="sub" style="margin:0">Sin incidencias estructurales relevantes.</p>`);

  const errs = COLS.filter(c=>META[c]?.error);
  if(errs.length) h += card("Colecciones que no se pudieron leer","Respuesta del servidor tal cual.",
    tabla(["Colección","Error"], errs.map(c=>[c, `<span style="color:var(--red)">${esc(META[c].error)}</span>`])));

  cont.innerHTML = h;
}

/* ── 02 COLECCIONES ─────────────────────────────────── */
function pintarColecciones(){
  const filas = COLS.map(c=>{
    const m = META[c] || {docs:0};
    const campos = m.docs ? auditar(DB[c]).length : 0;
    const est = m.error ? `<span class="tag bad">error</span>`
      : m.docs===0 ? `<span class="tag">vacía</span>`
      : `<span class="tag ok">activa</span>`;
    return [`<span class="mono">${c}</span>`, num(m.docs), num(campos), m.ms?m.ms+" ms":"—", est];
  });
  document.getElementById("colecciones").innerHTML =
    card("Inventario de colecciones",
      "Todo lo que el CRM escribe en Firestore. Los ms son de la lectura completa, con paginación.",
      tabla(["Colección","Documentos","Campos","Lectura","Estado"], filas)) +
    `<div class="hint">Estas doce colecciones son las que aparecen escritas en el código del CRM y del catálogo.
     Si has creado alguna más desde consola, añádela en la constante <code>COLS</code> del archivo.</div>`;
}

/* ── 03 MAPA DE CAMPOS (elemento firma) ─────────────── */
function pintarCampos(){
  const vivas = COLS.filter(c=>META[c]?.docs>0);
  let h = `<div class="hint" style="margin-bottom:16px">Cada línea es un campo real de la base.
    La barra es el porcentaje de documentos que lo traen con valor. Por debajo del 10% es un campo que
    se diseñó pero no se está rellenando: o se retira del formulario o se hace obligatorio.</div>`;

  vivas.forEach(c=>{
    const campos = auditar(DB[c]), total = META[c].docs;
    const muertos = campos.filter(f=>f.relleno<10).length;
    h += `<div class="card" style="padding:0;overflow:hidden">
      <div class="chead">${c} <span>${num(total)} docs · ${campos.length} campos${muertos?` · ${muertos} casi vacíos`:""}</span></div>
      <div class="mapa">${campos.map(f=>{
        const col = f.relleno>=90?"var(--green)":f.relleno>=50?"var(--blue)":f.relleno>=10?"var(--amber)":"var(--red)";
        const mixto = f.tipos.length>1 ? ` <span class="tag warn" style="padding:1px 5px">mixto</span>` : "";
        return `<div class="frow" title="${esc(f.ejemplo||"")}">
          <div class="fn">${esc(f.nombre)}</div>
          <div class="bar"><i style="width:${Math.max(1.5,f.relleno)}%;background:${col}"></i></div>
          <div class="pc" style="color:${col}">${f.relleno}%</div>
          <div class="ty">${f.tipos.join("/")}${mixto} · ${num(f.distintos)} val.</div>
        </div>`;
      }).join("")}</div></div>`;
  });
  document.getElementById("campos").innerHTML = h || `<div class="empty">Nada leído todavía.</div>`;
}

/* ── 04 CALIDAD ─────────────────────────────────────── */
function calidadGlobal(){
  let campos=0, muertos=0, llenos=0, celdas=0;
  COLS.filter(c=>META[c]?.docs>0).forEach(c=>{
    const a = auditar(DB[c]);
    campos += a.length;
    muertos += a.filter(f=>f.relleno<10).length;
    a.forEach(f=>{ llenos += f.lleno; celdas += META[c].docs; });
  });
  return { campos, muertos, relleno: pct(llenos, celdas) };
}

function duplicados(){
  const cli = DB.clientes||[];
  const porNombre = new Map(), porCodigo = new Map();
  cli.forEach(c=>{
    const n = norm(pick(c,["NOMBRE","nombre","razonSocial","cliente"]));
    if(n.length>3){ porNombre.set(n,(porNombre.get(n)||0)+1); }
    const cod = pick(c,["CODIGO","codigo","COD_CLIENTE"]);
    if(cod) porCodigo.set(String(cod),(porCodigo.get(String(cod))||0)+1);
  });
  return {
    nombre: [...porNombre.values()].filter(v=>v>1).length,
    codigo: [...porCodigo.values()].filter(v=>v>1).length,
    listaNombre: [...porNombre.entries()].filter(([,v])=>v>1).sort((a,b)=>b[1]-a[1]).slice(0,10)
  };
}

function huerfanos(){
  const ids = new Set((DB.clientes||[]).map(c=>String(c.id)));
  const codigos = new Set((DB.clientes||[]).map(c=>String(pick(c,["CODIGO","codigo"])||"")));
  const test = (arr,campo)=> (arr||[]).filter(x=>{
    const v = x[campo]; if(esVacio(v)) return false;
    return !ids.has(String(v)) && !codigos.has(String(v));
  }).length;
  return {
    visitas: test(DB.visitas,"clienteId"),
    incidencias: test(DB.incidencias,"clienteId"),
    muestras: test(DB.muestras,"clienteId"),
    estrategias: test(DB.estrategias,"clienteId"),
  };
}

function avisos(){
  const a = [];
  const cli = DB.clientes||[], vis = DB.visitas||[];
  if(cli.length){
    const sinAgente = cli.filter(c=>esVacio(pick(c,["GRUPOAGENTE","grupoAgente","AGENTE","agente","vendedor"]))).length;
    const sinRuta   = cli.filter(c=>esVacio(pick(c,["SEMANAVISITA","semana","semanas","ruta","RUTA"]))).length;
    const sinTel    = cli.filter(c=>esVacio(pick(c,["TEL","telefono","TELEFONO","tel","movil"]))).length;
    if(sinAgente) a.push({nivel:sinAgente>cli.length*.1?"falta":"parcial", titulo:`${num(sinAgente)} ${plural(sinAgente,"cliente","clientes")} sin comercial asignado`,
      detalle:`Son el ${pct(sinAgente,cli.length)}% de la cartera. Ninguno aparece en el panel de su vendedor ni suma en los rankings por equipo.`});
    if(sinRuta) a.push({nivel:sinRuta>cli.length*.3?"falta":"parcial", titulo:`${num(sinRuta)} ${plural(sinRuta,"cliente","clientes")} sin semana de visita`,
      detalle:`El ${pct(sinRuta,cli.length)}% de la cartera queda fuera de la planificación de rutas: nadie los ve en su semana.`});
    if(sinTel>cli.length*.3) a.push({nivel:"parcial", titulo:`${num(sinTel)} ${plural(sinTel,"cliente","clientes")} sin teléfono`,
      detalle:`Sin contacto directo no hay campaña telefónica ni aviso de incidencia. Es el ${pct(sinTel,cli.length)}% de la ficha.`});
  }
  const d = duplicados();
  if(d.nombre) a.push({nivel:"parcial", titulo:`${d.nombre} ${plural(d.nombre,"nombre de cliente repetido","nombres de cliente repetidos")}`,
    detalle:`Mismo nombre normalizado en más de una ficha. Reparten ventas, visitas e historial entre registros distintos.`});
  const h = huerfanos(), th = Object.values(h).reduce((x,y)=>x+y,0);
  if(th) a.push({nivel:"parcial", titulo:`${num(th)} ${plural(th,"registro apunta","registros apuntan")} a un cliente que no existe`,
    detalle:`Visitas ${h.visitas} · incidencias ${h.incidencias} · muestras ${h.muestras} · estrategias ${h.estrategias}. Se pierden al cruzar por cliente.`});
  if(cli.length && vis.length){
    const visitados = new Set(vis.map(v=>String(v.clienteId||"")));
    const cobertura = pct([...visitados].filter(x=>x).length, cli.length);
    if(cobertura<50) a.push({nivel:cobertura<20?"falta":"parcial", titulo:`Solo el ${cobertura}% de la cartera tiene alguna visita registrada`,
      detalle:`${num(visitados.size)} clientes con actividad sobre ${num(cli.length)} fichas. El resto es cartera a ciegas: no se sabe si se trabaja o no.`});
  }
  if(!vis.length) a.push({nivel:"falta", titulo:"No hay visitas registradas",
    detalle:"Sin visitas no hay frecuencia, ni cumplimiento de ruta, ni detección de clientes dormidos. Es el dato que más análisis desbloquea."});
  const cal = calidadGlobal();
  if(cal.muertos) a.push({nivel:"parcial", titulo:`${cal.muertos} ${plural(cal.muertos,"campo","campos")} por debajo del 10% de relleno`,
    detalle:`Campos que existen en la base pero casi nadie completa. Cada uno es un formulario que pide algo que no se usa.`});
  const orden = {falta:0, parcial:1, listo:2};
  return a.sort((x,y)=>orden[x.nivel]-orden[y.nivel]);
}

function pintarCalidad(){
  const cli = DB.clientes||[], d = duplicados(), h = huerfanos(), cal = calidadGlobal();
  let out = "";

  const campoCli = [
    ["Nombre", ["NOMBRE","nombre","razonSocial"]],
    ["Comercial asignado", ["GRUPOAGENTE","grupoAgente","AGENTE","agente","vendedor"]],
    ["Semana de visita", ["SEMANAVISITA","semana","semanas","ruta","RUTA"]],
    ["Teléfono", ["TEL","telefono","TELEFONO","tel","movil"]],
    ["Dirección", ["DIR","direccion","DIRECCION","LOCALIDAD","localidad"]],
    ["Email", ["EMAIL","email","correo","MAIL"]],
    ["Empresa / marca", ["Empresa","EMPRESA","empresa"]],
    ["Código contable", ["CODCONTA","codconta","codigoConta"]],
  ];
  if(cli.length){
    out += card("Ficha de cliente, campo a campo",
      `Sobre ${num(cli.length)} fichas. El % es cuántas lo traen relleno.`,
      tabla(["Campo","Rellenos","Vacíos","Cobertura"], campoCli.map(([lab,keys])=>{
        const ok = cli.filter(c=>!esVacio(pick(c,keys))).length;
        const p = pct(ok,cli.length);
        const col = p>=90?"var(--green)":p>=50?"var(--amber)":"var(--red)";
        return [lab, num(ok), num(cli.length-ok), `<span style="color:${col}">${p}%</span>`];
      })));
  }

  out += card("Integridad referencial",
    "Registros hijos cuyo <span class='mono'>clienteId</span> no coincide con ninguna ficha de clientes.",
    tabla(["Colección","Registros huérfanos","Total","% perdido"],
      [["visitas",h.visitas,(DB.visitas||[]).length],
       ["incidencias",h.incidencias,(DB.incidencias||[]).length],
       ["muestras",h.muestras,(DB.muestras||[]).length],
       ["estrategias",h.estrategias,(DB.estrategias||[]).length]]
      .map(([c,hu,tot])=>[`<span class="mono">${c}</span>`, num(hu), num(tot),
        `<span style="color:${hu?"var(--amber)":"var(--green)"}">${pct(hu,tot)}%</span>`])));

  out += card("Duplicados en cartera",
    "Un cliente repetido parte en dos su historial y su facturación.",
    `<div class="grid g4" style="margin-bottom:14px">
      ${kpi("Nombres repetidos", num(d.nombre), "comparando sin acentos ni signos")}
      ${kpi("Códigos repetidos", num(d.codigo), "campo CODIGO")}
     </div>` +
    (d.listaNombre.length ? tabla(["Nombre normalizado","Fichas"],
      d.listaNombre.map(([n,v])=>[`<span class="mono" style="font-size:11.5px">${esc(n)}</span>`, v]))
      : `<p class="sub" style="margin:0">Sin nombres repetidos.</p>`));

  out += card("Salud general del esquema", "Resumen de lo que mide este bloque.",
    `<div class="grid g4">
      ${kpi("Campos totales", num(cal.campos))}
      ${kpi("Campos casi vacíos", num(cal.muertos), "menos del 10% relleno")}
      ${kpi("Relleno medio", cal.relleno+"%")}
      ${kpi("Huérfanos", num(Object.values(h).reduce((a,b)=>a+b,0)))}
     </div>`);

  document.getElementById("calidad").innerHTML = out;
}

/* ── 05 NEGOCIO ─────────────────────────────────────── */
function pintarNegocio(){
  let out = "";
  const cli = DB.clientes||[], vis = DB.visitas||[], opo = DB.oportunidades||[],
        inc = DB.incidencias||[], tar = DB.tareas||[], mue = DB.muestras||[],
        pro = DB.proyectos||[], prod = DB.productos||[];

  /* Cartera */
  if(cli.length){
    const porAgente = contar(cli, c=>pick(c,["GRUPOAGENTE","grupoAgente","AGENTE","agente","vendedor"])||"Sin asignar");
    const porEmpresa = contar(cli, c=>pick(c,["Empresa","EMPRESA","empresa"])||"Sin marca");
    const porSemana = contar(cli, c=>{
      const s = pick(c,["SEMANAVISITA","semana","ruta","RUTA"]);
      const v = Array.isArray(s)?s[0]:s;
      return esVacio(v) ? null : "Semana "+v;
    }).sort((a,b)=>parseInt(a.k.replace(/\D/g,""))-parseInt(b.k.replace(/\D/g,"")));
    const conRuta = cli.filter(c=>!esVacio(pick(c,["SEMANAVISITA","semana","ruta","RUTA"]))).length;

    out += card("Cartera de clientes", `${num(cli.length)} fichas en la base.`,
      `<div class="grid g4" style="margin-bottom:18px">
        ${kpi("Clientes", num(cli.length))}
        ${kpi("Comerciales con cartera", num(porAgente.filter(x=>x.k!=="Sin asignar").length))}
        ${kpi("Con semana de ruta", num(conRuta), pct(conRuta,cli.length)+"% de la cartera")}
        ${kpi("Media por comercial", num(Math.round(cli.length/Math.max(1,porAgente.filter(x=>x.k!=="Sin asignar").length))))}
       </div>
       <div class="grid g2">
         <div><h3 style="font-size:13px;margin-bottom:12px">Reparto por comercial</h3>${ranking(porAgente,14,"var(--green)")}</div>
         <div><h3 style="font-size:13px;margin-bottom:12px">Carga por semana de visita</h3>${ranking(porSemana,14,"var(--violet)")}
              <h3 style="font-size:13px;margin:20px 0 12px">Por marca / empresa</h3>${ranking(porEmpresa,8,"var(--blue)")}</div>
       </div>`);
  }

  /* Actividad comercial */
  if(vis.length){
    const porAgente = contar(vis, v=>pick(v,["agente","agenteId","autor"])||"—");
    const porResultado = contar(vis, v=>pick(v,["resultado","estado"])||"sin resultado");
    const porSemana = contar(vis, v=>{const s=pick(v,["semana","SEMANA"]); return esVacio(s)?null:"Semana "+s;})
      .sort((a,b)=>parseInt(a.k.replace(/\D/g,""))-parseInt(b.k.replace(/\D/g,"")));
    const clientesVis = new Set(vis.map(v=>String(v.clienteId||"")).filter(Boolean));

    // última visita por cliente -> dormidos
    const ultima = new Map();
    vis.forEach(v=>{
      const f = fecha(pick(v,["fecha","FECHA","fechaVisita","createdAt"]));
      const id = String(v.clienteId||"");
      if(!id||!f) return;
      if(!ultima.has(id) || ultima.get(id)<f) ultima.set(id,f);
    });
    const dormidos = [...ultima.entries()].map(([id,f])=>({id, d:dias(f)}))
      .filter(x=>x.d>60).sort((a,b)=>b.d-a.d);
    const nombreDe = id => { const c=(DB.clientes||[]).find(c=>String(c.id)===id);
      return c ? (pick(c,["NOMBRE","nombre","razonSocial"])||id) : id; };

    out += card("Actividad comercial registrada", `${num(vis.length)} visitas guardadas.`,
      `<div class="grid g4" style="margin-bottom:18px">
        ${kpi("Visitas", num(vis.length))}
        ${kpi("Clientes visitados", num(clientesVis.size), cli.length?pct(clientesVis.size,cli.length)+"% de la cartera":"")}
        ${kpi("Visitas por cliente", (vis.length/Math.max(1,clientesVis.size)).toFixed(1))}
        ${kpi("Sin visitar", num(Math.max(0,cli.length-clientesVis.size)), "cartera a ciegas")}
       </div>
       <div class="grid g3">
         <div><h3 style="font-size:13px;margin-bottom:12px">Por comercial</h3>${ranking(porAgente,10,"var(--green)")}</div>
         <div><h3 style="font-size:13px;margin-bottom:12px">Resultado de la visita</h3>${ranking(porResultado,8,"var(--amber)")}</div>
         <div><h3 style="font-size:13px;margin-bottom:12px">Por semana</h3>${ranking(porSemana,12,"var(--violet)")}</div>
       </div>` +
      (dormidos.length ? `<h3 style="font-size:13px;margin:22px 0 10px">Clientes sin visita desde hace más de 60 días</h3>` +
        tabla(["Cliente","Días sin visita"], dormidos.slice(0,15).map(x=>[esc(nombreDe(x.id)), num(x.d)])) : ""));
  }

  /* Pipeline */
  if(opo.length){
    const valor = sumar(opo, o=>pick(o,["valor","importe","VALOR"]));
    const ponderado = opo.reduce((a,o)=>a + (Number(pick(o,["valor","importe"]))||0) * ((Number(pick(o,["prob","probabilidad"]))||0)/100), 0);
    const porEtapa = contar(opo, o=>pick(o,["etapa","estado","fase"])||"sin etapa");
    const porAgente = contar(opo, o=>pick(o,["agente","agenteId","comercial"])||"—");
    const valorEtapa = [...new Set(opo.map(o=>pick(o,["etapa","estado"])||"sin etapa"))]
      .map(e=>({k:String(e), v:sumar(opo.filter(o=>(pick(o,["etapa","estado"])||"sin etapa")===e), o=>pick(o,["valor","importe"]))}))
      .sort((a,b)=>b.v-a.v);

    out += card("Embudo de oportunidades", `${num(opo.length)} oportunidades abiertas en la base.`,
      `<div class="grid g4" style="margin-bottom:18px">
        ${kpi("Oportunidades", num(opo.length))}
        ${kpi("Valor total", eur(valor))}
        ${kpi("Valor ponderado", eur(ponderado), "valor × probabilidad")}
        ${kpi("Ticket medio", eur(valor/opo.length))}
       </div>
       <div class="grid g3">
         <div><h3 style="font-size:13px;margin-bottom:12px">Nº por etapa</h3>${ranking(porEtapa,8,"var(--blue)")}</div>
         <div><h3 style="font-size:13px;margin-bottom:12px">Euros por etapa</h3>${ranking(valorEtapa,8,"var(--green)")}</div>
         <div><h3 style="font-size:13px;margin-bottom:12px">Por comercial</h3>${ranking(porAgente,10,"var(--violet)")}</div>
       </div>`);
  }

  /* Incidencias */
  if(inc.length){
    const abiertas = inc.filter(i=>!["cerrada","resuelta"].includes(String(pick(i,["estado"])||"").toLowerCase()));
    const porTipo = contar(inc, i=>pick(i,["tipo","tipologia"])||"sin tipo");
    const porEstado = contar(inc, i=>pick(i,["estado"])||"sin estado");
    const porPrioridad = contar(inc, i=>pick(i,["prioridad"])||"sin prioridad");
    const edades = abiertas.map(i=>dias(fecha(pick(i,["fecha","FECHA","createdAt"])))).filter(x=>x!=null);
    const media = edades.length ? Math.round(edades.reduce((a,b)=>a+b,0)/edades.length) : null;

    out += card("Incidencias", `${num(inc.length)} registradas, ${num(abiertas.length)} sin cerrar.`,
      `<div class="grid g4" style="margin-bottom:18px">
        ${kpi("Total", num(inc.length))}
        ${kpi("Abiertas", num(abiertas.length), pct(abiertas.length,inc.length)+"% del total")}
        ${kpi("Antigüedad media", media!=null?media+" días":"—", "de las abiertas")}
        ${kpi("Tipos distintos", num(porTipo.length))}
       </div>
       <div class="grid g3">
         <div><h3 style="font-size:13px;margin-bottom:12px">Por tipo</h3>${ranking(porTipo,8,"var(--red)")}</div>
         <div><h3 style="font-size:13px;margin-bottom:12px">Por estado</h3>${ranking(porEstado,8,"var(--amber)")}</div>
         <div><h3 style="font-size:13px;margin-bottom:12px">Por prioridad</h3>${ranking(porPrioridad,6,"var(--violet)")}</div>
       </div>`);
  }

  /* Tareas y proyectos */
  if(tar.length || pro.length){
    let c = `<div class="grid g4" style="margin-bottom:18px">`;
    if(tar.length){
      const hechas = tar.filter(t=>t.hecha===true || String(pick(t,["estado"])||"").toLowerCase()==="hecha").length;
      const vencidas = tar.filter(t=>{
        const f = fecha(pick(t,["fechaLimite","vence","fecha"]));
        const done = t.hecha===true || String(pick(t,["estado"])||"").toLowerCase()==="hecha";
        return f && !done && f.getTime() < Date.now();
      }).length;
      c += kpi("Tareas", num(tar.length)) +
           kpi("Completadas", num(hechas), pct(hechas,tar.length)+"%") +
           kpi("Vencidas sin cerrar", num(vencidas));
    }
    if(pro.length){
      const prog = Math.round(sumar(pro,p=>pick(p,["progreso"]))/pro.length);
      c += kpi("Proyectos", num(pro.length), isNaN(prog)?"":`progreso medio ${prog}%`);
    }
    c += `</div>`;
    if(tar.length) c += `<div class="grid g2">
      <div><h3 style="font-size:13px;margin-bottom:12px">Tareas por responsable</h3>
        ${ranking(contar(tar,t=>pick(t,["asignadoA","responsable","agente","autor"])||"sin asignar"),10,"var(--blue)")}</div>
      <div><h3 style="font-size:13px;margin-bottom:12px">Tareas por estado</h3>
        ${ranking(contar(tar,t=>t.hecha===true?"hecha":(pick(t,["estado"])||"pendiente")),6,"var(--green)")}</div></div>`;
    out += card("Tareas y proyectos", "Seguimiento interno y plan de trabajo.", c);
  }

  /* Muestras y catálogo */
  if(mue.length || prod.length){
    let c = `<div class="grid g4" style="margin-bottom:18px">`;
    if(mue.length){
      const vivas = mue.filter(m=>m.eliminada!==true);
      c += kpi("Muestras entregadas", num(vivas.length)) +
           kpi("Clientes con muestra", num(new Set(vivas.map(m=>String(m.clienteId||""))).size));
    }
    if(prod.length){
      const cats = contar(prod, p=>pick(p,["categoria","cat"])||"sin categoría");
      const precio = sumar(prod,p=>pick(p,["precio"]))/prod.length;
      c += kpi("Productos en catálogo", num(prod.length)) +
           kpi("Categorías", num(cats.length), isFinite(precio)&&precio?`precio medio ${eur(precio)}`:"");
    }
    c += `</div>`;
    if(mue.length) c += `<div class="grid g2">
      <div><h3 style="font-size:13px;margin-bottom:12px">Muestras por comercial</h3>
        ${ranking(contar(mue.filter(m=>m.eliminada!==true), m=>pick(m,["agente","autor"])||"—"),10,"var(--amber)")}</div>
      <div><h3 style="font-size:13px;margin-bottom:12px">Estado de la muestra</h3>
        ${ranking(contar(mue.filter(m=>m.eliminada!==true), m=>pick(m,["estado","resultado"])||"sin estado"),8,"var(--green)")}</div></div>`;
    out += card("Muestras y catálogo", "Prueba de producto y surtido disponible.", c);
  }

  document.getElementById("negocio").innerHTML = out ||
    `<div class="empty"><h2>Sin datos suficientes</h2><p>Las colecciones de negocio están vacías.</p></div>`;
}

/* ── 06 QUÉ PUEDES HACER ────────────────────────────── */
function tiene(col, campos, minPct=30){
  const docs = DB[col]||[]; if(!docs.length) return false;
  const ok = docs.filter(d=>!esVacio(pick(d,campos))).length;
  return pct(ok,docs.length) >= minPct;
}
const hay = col => (DB[col]||[]).length > 0;

    },
    {

      p:"Valor esperado por mes = importe × probabilidad, con desglose por etapa y comercial. Permite anticipar el trimestre en lugar de mirarlo cuando ya pasó.",

    },

/* ══════════════════════════════════════════════════════════════
   5. EXPORTACIÓN
   ══════════════════════════════════════════════════════════════ */
function bajar(nombre, contenido, tipo){
  const b = new Blob([contenido], {type:tipo});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = nombre; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

document.getElementById("btnJson").onclick = ()=>
  bajar(`crm_${PROYECTO}_${new Date().toISOString().slice(0,10)}.json`,
        JSON.stringify(DB,null,1), "application/json");

document.getElementById("btnInforme").onclick = ()=>{
  const cal = calidadGlobal(), h = huerfanos(), d = duplicados();
  let m = `# Radiografía del CRM — ${PROYECTO}\n_${new Date().toLocaleString("es-ES")}_\n\n`;
  m += `## Volumen\n\n| Colección | Documentos | Campos |\n|---|---:|---:|\n`;
  COLS.forEach(c=>{ const me=META[c]||{docs:0};
    m += `| ${c} | ${me.docs} | ${me.docs?auditar(DB[c]).length:0} |\n`; });
  m += `\nTotal: ${Object.values(META).reduce((a,x)=>a+x.docs,0)} documentos, ${cal.campos} campos distintos, relleno medio ${cal.relleno}%.\n`;
  m += `\n## Calidad\n\n- Campos por debajo del 10% de relleno: ${cal.muertos}\n`;
  m += `- Nombres de cliente duplicados: ${d.nombre} · códigos duplicados: ${d.codigo}\n`;
  m += `- Registros huérfanos: visitas ${h.visitas}, incidencias ${h.incidencias}, muestras ${h.muestras}, estrategias ${h.estrategias}\n`;
  m += `\n## Puntos de atención\n\n`;
  avisos().forEach(a=>{ m += `### ${a.titulo}\n${a.detalle}\n\n`; });
  m += `## Detalle de campos\n\n`;
  COLS.filter(c=>META[c]?.docs>0).forEach(c=>{
    m += `### ${c} (${META[c].docs} docs)\n\n| Campo | Relleno | Tipo | Valores distintos |\n|---|---:|---|---:|\n`;
    auditar(DB[c]).forEach(f=> m += `| ${f.nombre} | ${f.relleno}% | ${f.tipos.join("/")} | ${f.distintos} |\n`);
    m += `\n`;
  });
  bajar(`radiografia_crm_${new Date().toISOString().slice(0,10)}.md`, m, "text/markdown");
};
