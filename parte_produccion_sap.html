<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parte de producción · SAP</title>
<style>
:root{--rojo:#DC2626;--verde:#16A34A;--azul:#2563EB;--muted:#64748B;--line:#E5E7EB}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:#F4F5F7;color:#0F172A}
.w{max-width:900px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
input,textarea,select,button{font:inherit}
input,textarea,select{width:100%;box-sizing:border-box;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.g{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.btn{font-weight:800;padding:11px 16px;border:0;border-radius:10px;cursor:pointer;background:#0F172A;color:#fff}
.btn.sec{background:#fff;color:#0F172A;border:1.5px solid var(--line)}.btn.ok{background:var(--verde)}.btn[disabled]{opacity:.5;cursor:default}
.sug{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;max-height:260px;overflow:auto}
.sug div{padding:8px 10px;cursor:pointer;border-bottom:1px solid #F1F5F9;font-size:13px}.sug div:hover{background:#F1F5F9}.sug small{display:block;color:var(--muted)}
.rel{position:relative}
.comp{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:2fr 110px 110px;gap:8px;align-items:end}
.comp .nm{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;background:#F1F5F9;color:#334155;margin-left:6px}.pill.test{background:#FEF3C7;color:#92400E}.pill.real{background:#DCFCE7;color:#166534}
.msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-weight:700}.msg.ok{background:#DCFCE7;color:#166534}.msg.ko{background:#FEE2E2;color:#991B1B}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}.comp{grid-template-columns:1fr 1fr}.comp>:first-child{grid-column:1/-1}}
</style></head><body><div class="w">
<h1>🏭 Parte de producción en SAP</h1>
<div class="sub">Crea la orden de fabricación, da de baja los componentes (con sus lotes) y da de alta el producto con un lote nuevo. Base: <span id="dbPill" class="pill"></span> <button class="btn sec" style="padding:3px 8px;font-size:11.5px" onclick="cambiarDb()">cambiar</button></div>
<div class="card" id="cardKey" hidden>
  <label>Clave</label>
  <div class="g" style="grid-template-columns:1fr auto"><input id="key" type="password" placeholder="SAP_PEDIDOS_KEY de Vercel"><button class="btn" onclick="guardarKey()">Guardar y probar</button></div>
  <div id="keyMsg" style="font-size:12.5px;margin-top:6px;color:var(--muted)"></div>
</div>
<div id="estadoApi" style="font-size:12px;margin:6px 0;color:var(--muted)">Comprobando conexión con SAP…</div>

<div class="card">
  <div class="g g2">
    <div class="rel"><label>Producto a fabricar *</label><input id="prod" placeholder="Código o descripción (con escandallo)" autocomplete="off" oninput="buscarProd(this.value)"><div class="sug" id="prodSug" hidden></div><div id="prodInfo" style="font-size:12px;color:var(--muted);margin-top:4px"></div></div>
    <div><label>Cantidad a fabricar *</label><input id="cant" type="number" inputmode="decimal" min="0" step="any" oninput="recalcular()"></div>
    <div><label>Almacén *</label><select id="alm"><option value="">Cargando…</option></select></div>
    <div><label>Fecha</label><input id="fecha" type="date"></div>
  </div>
  <div style="margin-top:10px"><button class="btn sec" onclick="cargarEscandallo()">📋 Cargar escandallo de SAP</button></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><b>Componentes (se dan de baja)</b><button class="btn sec" onclick="addComp()">+ Añadir componente</button></div>
  <div id="comps"><div style="color:var(--muted);font-size:12.5px;padding:8px 0">Carga el escandallo o añade componentes a mano.</div></div>
</div>

<div class="card">
  <b>Producto terminado (se da de alta)</b>
  <div class="g g3" style="margin-top:8px">
    <div><label>Nº de lote nuevo *</label><input id="lote" placeholder="p. ej. 26P.000123"></div>
    <div><label>Fecha de fabricación</label><input id="fab" type="date"></div>
    <div><label>Caducidad</label><input id="cad" type="date"></div>
  </div>
  <div style="margin-top:8px"><label>Comentarios</label><textarea id="com" rows="2"></textarea></div>
  <label style="display:flex;align-items:center;gap:8px;margin-top:8px;text-transform:none;font-size:13px"><input type="checkbox" id="cerrar" style="width:auto"> Cerrar la orden de fabricación al terminar</label>
</div>

<div class="card">
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" onclick="revisar()">👁 Revisar</button><button class="btn ok" id="btnEnviar" onclick="enviar()">🏭 Ejecutar en SAP</button><button class="btn sec" onclick="location.reload()">Limpiar</button></div>
  <div id="msg"></div>
  <pre id="res" style="white-space:pre-wrap;font-size:12px;background:#F8FAFC;border-radius:10px;padding:10px;margin-top:10px" hidden></pre>
</div>
</div>
<script>
const API="/api/sap-produccion";
let DB=localStorage.getItem("sap_prod_db")||"U_CARO_99", KEY=localStorage.getItem("sap_pedido_key")||"";
let PROD=null, ESC=null, COMPS=[];
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const r3=(v)=>Math.round((Number(v)||0)*1000)/1000;
function pintarDb(){ const p=document.getElementById("dbPill"); p.textContent=DB+(DB==="U_CARO_00"?" · REAL":" · pruebas"); p.className="pill "+(DB==="U_CARO_00"?"real":"test"); }
window.cambiarDb=()=>{ const v=prompt("Base de datos de SAP:\n· U_CARO_99 = pruebas\n· U_CARO_00 = REAL",DB); if(v&&/^[A-Z0-9_]+$/i.test(v)){ DB=v.toUpperCase(); localStorage.setItem("sap_prod_db",DB); pintarDb(); probarApi(false); } };
window.guardarKey=async()=>{ KEY=document.getElementById("key").value.trim(); try{ localStorage.setItem("sap_pedido_key",KEY); }catch(e){} await probarApi(true); };
async function api(url,opts){ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(DB),Object.assign({headers:{"Content-Type":"application/json","x-crm-key":KEY}},opts||{})); const j=await r.json().catch(()=>({ok:false,error:"respuesta no válida"})); if(r.status===401){ document.getElementById("cardKey").hidden=false; throw new Error("clave incorrecta: ponla arriba"); } return j; }
async function probarApi(desdeBoton){ const E=document.getElementById("estadoApi"), K=document.getElementById("keyMsg");
  try{ const r=await fetch(API+"?almacenes=1&db="+encodeURIComponent(DB),{headers:{"x-crm-key":KEY}}); const j=await r.json().catch(()=>({}));
    if(r.status===401){ document.getElementById("cardKey").hidden=false; E.innerHTML='<span style="color:var(--rojo);font-weight:700">✗ La clave guardada no vale.</span> Pon la de SAP_PEDIDOS_KEY de Vercel.'; if(K) K.textContent=desdeBoton?"Esa clave no vale.":""; return; }
    if(!r.ok||j.ok===false){ E.innerHTML='<span style="color:var(--rojo);font-weight:700">✗ Error:</span> '+esc(j.error||("HTTP "+r.status)); return; }
    document.getElementById("cardKey").hidden=true; E.innerHTML='<span style="color:var(--verde);font-weight:700">✓ Conectado a SAP · '+esc(j.db||DB)+'</span>'; if(K) K.textContent="";
    const sel=document.getElementById("alm"), prev=localStorage.getItem("sap_prod_alm")||""; sel.innerHTML='<option value="">— elige —</option>'+(j.almacenes||[]).map(a=>'<option value="'+esc(a.codigo)+'"'+(a.codigo===prev?' selected':'')+'>'+esc(a.codigo)+' · '+esc(a.nombre)+'</option>').join(""); }
  catch(e){ E.innerHTML='<span style="color:var(--rojo);font-weight:700">✗ No se llega a la API:</span> '+esc(e.message); } }
let tP=null;
window.buscarProd=(v)=>{ PROD=null; clearTimeout(tP); const S=document.getElementById("prodSug"); if(v.trim().length<2){ S.hidden=true; return; }
  tP=setTimeout(async()=>{ try{ const j=await api(API+"?articulos="+encodeURIComponent(v)); S.innerHTML=(j.articulos||[]).map(a=>'<div onclick="elegirProd('+esc(JSON.stringify(a)).replace(/"/g,"&quot;")+')"><b>'+esc(a.codigo)+'</b> · '+esc(a.nombre)+(a.conEscandallo?' <span class="pill" style="background:#DCFCE7;color:#166534">escandallo</span>':'')+(a.porLotes?' <span class="pill">lotes</span>':'')+'<small>stock '+esc(a.stock)+'</small></div>').join("")||'<div style="color:var(--muted)">Sin resultados</div>'; S.hidden=false; }catch(e){ aviso(e.message,false); } },350); };
window.elegirProd=(a)=>{ PROD=a; document.getElementById("prod").value=a.codigo; document.getElementById("prodSug").hidden=true; document.getElementById("prodInfo").innerHTML='<b>'+esc(a.codigo)+'</b> · '+esc(a.nombre)+(a.conEscandallo?' · tiene escandallo':' · <span style="color:var(--rojo)">sin escandallo en SAP</span>')+(a.porLotes?' · por lotes':' · <span style="color:var(--rojo)">este artículo NO gestiona lotes</span>'); };
window.cargarEscandallo=async()=>{ if(!PROD){ aviso("Elige primero el producto",false); return; } aviso("Leyendo escandallo…",true);
  try{ const j=await api(API+"?escandallo="+encodeURIComponent(PROD.codigo)); if(!j.ok) throw new Error(j.error); ESC=j.escandallo;
    if(ESC.almacen&&!document.getElementById("alm").value) document.getElementById("alm").value=ESC.almacen;
    COMPS=ESC.componentes.map(c=>({articulo:c.articulo,nombre:c.nombre,base:c.cantidadBase/(ESC.cantidadBase||1),uds:"",almacen:c.almacen||"",porLotes:c.porLotes,stock:c.stock,lotes:[],lotesDisp:null}));
    recalcular(); aviso("Escandallo cargado: "+COMPS.length+" componentes (cantidades para "+(ESC.cantidadBase||1)+" ud. del producto, escaladas a lo que fabriques)",true); COMPS.forEach((c,i)=>{ if(c.porLotes) cargarLotes(i); }); }
  catch(e){ aviso(e.message,false); } };
window.recalcular=()=>{ const n=Number(document.getElementById("cant").value)||0; COMPS.forEach(c=>{ if(c.base!=null) c.uds=n?String(r3(c.base*n)):""; }); pintarComps(); };
window.addComp=()=>{ COMPS.push({articulo:"",nombre:"",base:null,uds:"",almacen:"",porLotes:null,lotes:[],lotesDisp:null}); pintarComps(); };
window.quitarComp=(i)=>{ COMPS.splice(i,1); pintarComps(); };
function pintarComps(){ const E=document.getElementById("comps"); if(!COMPS.length){ E.innerHTML='<div style="color:var(--muted);font-size:12.5px;padding:8px 0">Carga el escandallo o añade componentes a mano.</div>'; return; }
  E.innerHTML=COMPS.map((c,i)=>'<div class="comp"><div class="rel"><label>Componente</label><input data-comp="'+i+'" value="'+esc(c.articulo)+'" placeholder="Código o descripción" autocomplete="off" oninput="buscarComp('+i+',this.value)"><div class="sug" id="compSug'+i+'" hidden></div><div class="nm">'+esc(c.nombre||"")+(c.base!=null?' · '+r3(c.base)+' por ud.':'')+(c.stock!=null?' · stock '+esc(c.stock):'')+'</div></div>'
    +'<div><label>Uds a consumir</label><input type="number" inputmode="decimal" min="0" step="any" value="'+esc(c.uds)+'" oninput="COMPS['+i+'].uds=this.value;refLot('+i+')"></div>'
    +'<div style="display:flex;gap:6px;align-items:end"><div style="flex:1"><label>Almacén</label><input value="'+esc(c.almacen)+'" placeholder="el general" style="text-transform:uppercase" oninput="COMPS['+i+'].almacen=this.value.toUpperCase()"></div><button class="btn sec" style="padding:9px 10px" onclick="quitarComp('+i+')">✕</button></div>'
    +'<div style="grid-column:1/-1">'+lotesH(i)+'</div></div>').join(""); }
// Buscador de componentes (mismo que el de producto): código o descripción, con stock y si va por lotes
let tC={};
window.buscarComp=(i,v)=>{ COMPS[i].articulo=v.toUpperCase(); COMPS[i].nombre=""; COMPS[i].lotes=[]; COMPS[i].lotesDisp=null; COMPS[i].porLotes=null; clearTimeout(tC[i]); const S=document.getElementById("compSug"+i); if(v.trim().length<2){ S.hidden=true; return; }
  tC[i]=setTimeout(async()=>{ try{ const j=await api(API+"?articulos="+encodeURIComponent(v)); S.innerHTML=(j.articulos||[]).map(a=>'<div onclick="elegirComp('+i+','+esc(JSON.stringify(a)).replace(/"/g,"&quot;")+')"><b>'+esc(a.codigo)+'</b> · '+esc(a.nombre)+(a.porLotes?' <span class="pill">lotes</span>':'')+'<small>stock '+esc(a.stock)+'</small></div>').join("")||'<div style="color:var(--muted)">Sin resultados</div>'; S.hidden=false; }catch(e){ aviso(e.message,false); } },350); };
window.elegirComp=(i,a)=>{ COMPS[i].articulo=a.codigo; COMPS[i].nombre=a.nombre; COMPS[i].stock=a.stock; COMPS[i].porLotes=!!a.porLotes; COMPS[i].lotes=[]; COMPS[i].lotesDisp=null; document.getElementById("compSug"+i).hidden=true; pintarComps(); if(a.porLotes) cargarLotes(i); setTimeout(()=>{ const u=document.querySelectorAll(".comp input[type=number]")[i]; if(u) u.focus(); },0); };
async function cargarLotes(i){ const c=COMPS[i]; if(!c.articulo) return; const alm=(c.almacen||document.getElementById("alm").value||"").toUpperCase();
  try{ const j=await api(API+"?lotes="+encodeURIComponent(c.articulo)+(alm?"&almacen="+encodeURIComponent(alm):"")); if(!COMPS[i]||COMPS[i].articulo!==c.articulo) return; COMPS[i].lotesDisp=j.lotes||[]; COMPS[i].lotesVia=j.via||""; if(COMPS[i].porLotes===null) COMPS[i].porLotes=true; pintarComps(); }catch(e){ COMPS[i].lotesDisp=[]; pintarComps(); } }
window.recargarLotes=(i)=>{ COMPS[i].lotesDisp=null; pintarComps(); cargarLotes(i); };
window.addLote=(i,lote,cant)=>{ const c=COMPS[i]; if(!lote||c.lotes.some(x=>x.lote===lote)) return; const falta=Math.max(0,(Number(c.uds)||0)-c.lotes.reduce((t,x)=>t+(Number(x.uds)||0),0)); c.lotes.push({lote,uds:cant!=null?r3(Math.min(cant,falta||cant)):falta}); pintarComps(); };
window.setLoteUds=(i,k,v)=>{ COMPS[i].lotes[k].uds=v; refLot(i); };
window.quitarLote=(i,k)=>{ COMPS[i].lotes.splice(k,1); pintarComps(); };
window.refLot=(i)=>{ const e=document.getElementById("lotSum"+i); if(e) e.innerHTML=sumH(i); };
function sumH(i){ const c=COMPS[i]; const s=c.lotes.reduce((t,x)=>t+(Number(x.uds)||0),0), u=Number(c.uds)||0; return Math.abs(s-u)<0.0005?'<span style="color:var(--verde);font-weight:700">✓ lotes '+r3(s)+' = '+r3(u)+'</span>':'<span style="color:var(--rojo);font-weight:700">lotes '+r3(s)+' de '+r3(u)+'</span>'; }
function lotesH(i){ const c=COMPS[i]; if(!c.articulo) return ''; if(c.porLotes===false) return '<div style="font-size:11.5px;color:var(--muted)">Sin lotes.</div>';
  let h='<div style="background:#F8FAFC;border-radius:10px;padding:8px 10px;margin-top:4px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><b style="font-size:12.5px">🏷️ Lotes a consumir</b><span id="lotSum'+i+'" style="font-size:12px">'+sumH(i)+'</span><button class="btn sec" style="padding:4px 8px;font-size:11.5px" onclick="recargarLotes('+i+')">↻ lotes</button></div>';
  h+=c.lotes.map((x,k)=>'<div style="display:flex;gap:6px;align-items:center;margin-top:6px"><span style="flex:1;font-size:13px"><b>'+esc(x.lote)+'</b></span><input type="number" inputmode="decimal" min="0" step="any" value="'+esc(x.uds)+'" style="width:110px" oninput="setLoteUds('+i+','+k+',this.value)"><button class="btn sec" style="padding:6px 9px" onclick="quitarLote('+i+','+k+')">✕</button></div>').join('');
  if(c.lotesDisp===null) h+='<div style="font-size:11.5px;color:var(--muted);margin-top:6px">Lotes no cargados: pulsa ↻ lotes.</div>';
  else if(!c.lotesDisp.length) h+='<div style="font-size:11.5px;color:var(--rojo);margin-top:6px">Sin lotes con existencias en ese almacén. Escribe el lote a mano:</div><div style="display:flex;gap:6px;margin-top:4px"><input id="lotMan'+i+'" placeholder="nº de lote" style="flex:1"><button class="btn sec" style="padding:6px 9px" onclick="addLote('+i+',document.getElementById(\'lotMan'+i+'\').value.trim(),null)">Añadir</button></div>';
  else h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">'+c.lotesDisp.filter(x=>!c.lotes.some(y=>y.lote===x.lote)).slice(0,30).map(x=>'<button class="btn sec" style="padding:5px 9px;font-size:12px" onclick="addLote('+i+',\''+esc(x.lote).replace(/'/g,"")+'\','+(x.cantidad!=null?x.cantidad:'null')+')">'+esc(x.lote)+(x.cantidad!=null?' · <b>'+x.cantidad+'</b>':'')+(x.almacen?' · '+esc(x.almacen):'')+(x.caducidad?' · cad. '+esc(x.caducidad.slice(8,10)+'/'+x.caducidad.slice(5,7)+'/'+x.caducidad.slice(2,4)):'')+'</button>').join('')+'</div>';
  return h+'</div>'; }
function aviso(t,ok){ document.getElementById("msg").innerHTML='<div class="msg '+(ok?'ok':'ko')+'">'+esc(t)+'</div>'; }
function armar(){ if(!PROD) throw new Error("Elige el producto"); const cant=Number(document.getElementById("cant").value); if(!(cant>0)) throw new Error("Pon la cantidad a fabricar");
  const alm=document.getElementById("alm").value; if(!alm) throw new Error("Elige el almacén"); const lote=document.getElementById("lote").value.trim(); if(!lote) throw new Error("Pon el nº de lote nuevo");
  const C=COMPS.filter(c=>c.articulo&&Number(c.uds)>0); if(!C.length) throw new Error("No hay componentes con cantidad");
  for(const c of C){ if(c.porLotes&&!c.lotes.length) throw new Error("El componente "+c.articulo+" va por lotes: elige el lote"); if(c.lotes.length){ const s=c.lotes.reduce((t,x)=>t+(Number(x.uds)||0),0); if(Math.abs(s-Number(c.uds))>0.0005) throw new Error("En "+c.articulo+" los lotes suman "+r3(s)+" y el componente lleva "+r3(c.uds)); } }
  return {db:DB,parte:{ordenEntry:(window._REINT&&window._REINT.producto===PROD.codigo)?window._REINT.orden:0,salidaHecha:(window._REINT&&window._REINT.producto===PROD.codigo)?window._REINT.salida||0:0,producto:PROD.codigo,cantidad:cant,almacen:alm,fecha:document.getElementById("fecha").value||"",loteNuevo:lote,caducidad:document.getElementById("cad").value||"",fabricacion:document.getElementById("fab").value||"",comentario:document.getElementById("com").value,cerrar:document.getElementById("cerrar").checked,
    componentes:C.map(c=>({articulo:c.articulo,uds:Number(c.uds),almacen:c.almacen||alm,lotes:c.lotes.map(x=>({lote:x.lote,uds:Number(x.uds)||0}))}))}}; }
window.revisar=()=>{ try{ const p=armar(); document.getElementById("res").hidden=false; document.getElementById("res").textContent="Se ejecutará en SAP ("+DB+"):\n1) Orden de fabricación  2) Salida de componentes  3) Entrada del lote nuevo\n\n"+JSON.stringify(p.parte,null,2); aviso("Revisa y pulsa Ejecutar",true); }catch(e){ aviso(e.message,false); } };
window.enviar=async()=>{ let p; try{ p=armar(); }catch(e){ aviso(e.message,false); return; }
  if(DB==="U_CARO_00"&&!confirm("Vas a registrar una producción REAL en SAP: "+p.parte.cantidad+" de "+p.parte.producto+", lote "+p.parte.loteNuevo+". ¿Seguro?")) return;
  const b=document.getElementById("btnEnviar"); b.disabled=true; b.textContent="Ejecutando…"; aviso("Creando orden, salida y entrada en SAP…",true);
  try{ const j=await api(API,{method:"POST",body:JSON.stringify(p)}); document.getElementById("res").hidden=false; document.getElementById("res").textContent=JSON.stringify({orden:j.orden,salida:j.salida,entrada:j.entrada,avisos:[j.avisoLiberar,j.avisoCerrar].filter(Boolean),error:j.error},null,2);
    if(j.ok){ window._REINT=null; aviso("✅ "+j.mensaje,true); }
    else { // Si la orden (y quizá la salida) ya se crearon, el siguiente «Ejecutar» sigue con ellas en vez de duplicar
      if(j.ordenParaReintentar){ window._REINT={producto:p.parte.producto,orden:j.ordenParaReintentar,salida:j.salidaParaReintentar||0}; }
      aviso("❌ "+(j.error||"error")+(j.orden?" · La orden "+j.orden.DocumentNumber+" ya está creada"+(j.salidaParaReintentar?" y los componentes ya se dieron de baja (salida "+j.salidaParaReintentar+")":"")+": corrige y pulsa Ejecutar otra vez, seguirá con ella sin duplicar.":""),false); } }
  catch(e){ aviso("❌ "+e.message,false); }
  b.disabled=false; b.textContent="🏭 Ejecutar en SAP"; };
document.addEventListener("click",(e)=>{ if(!e.target.closest(".rel")) document.querySelectorAll(".sug").forEach(s=>s.hidden=true); });
document.getElementById("alm").addEventListener("change",function(){ localStorage.setItem("sap_prod_alm",this.value); });
pintarDb(); if(!KEY) document.getElementById("cardKey").hidden=false; document.getElementById("fecha").value=new Date().toISOString().slice(0,10); document.getElementById("fab").value=new Date().toISOString().slice(0,10); probarApi(false);
</script></body></html>
