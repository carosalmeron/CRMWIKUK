<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limpiar cruce erróneo</title>
<style>body{font-family:Arial;background:#FAF5F0;padding:18px;color:#2B2B2B}
h1{color:#B3261E;font-size:18px}.sub{color:#6B6B6B;font-size:12.5px;margin-bottom:12px}
button{background:#B3261E;color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}#log{font-size:13px;margin-top:12px;white-space:pre-line}</style></head><body>
<h1>🧹 Limpiar el cruce erróneo de la MAESTRA</h1>
<div class="sub">Elimina (o descarta) de la bolsa SOLO lo que entró del fichero MAESTRA con las columnas cruzadas. La bolsa buena queda intacta. Un solo uso.</div>
<button id="b" onclick="go()">Limpiar ahora</button>
<div id="log">Si este botón no responde, dime qué aparece en la consola (F12).</div>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
async function go(){
  const b=document.getElementById("b");b.disabled=true;
  const log=document.getElementById("log");
  try{
    let docs=[],pt="";
    do{
      const r=await fetch(FB+"/radar_prospectos?pageSize=300"+(pt?"&pageToken="+pt:""));
      if(!r.ok){log.textContent="Error leyendo la bolsa: HTTP "+r.status;b.disabled=false;return;}
      const j=await r.json();
      (j.documents||[]).forEach(d=>docs.push(d));
      pt=j.nextPageToken||"";
      log.textContent="Leyendo bolsa… "+docs.length;
    }while(pt);
    const malos=docs.filter(d=>String(d.fields?.origen?.stringValue||"").toUpperCase().includes("MAESTRA"));
    if(!malos.length){log.textContent="No hay registros con origen MAESTRA. Nada que limpiar (quizá ya se limpió, o el cruce malo no llegó a guardarse).";b.disabled=false;return;}
    log.textContent="Encontrados "+malos.length+". Intentando BORRAR…";
    let ok=0,desc=0;
    for(const d of malos){
      const url=d.name.replace(/^projects.*?documents/,FB);
      let r=await fetch(url,{method:"DELETE"});
      if(r.ok){ok++;}
      else{
        // plan B: marcar descartado
        r=await fetch(url+"?updateMask.fieldPaths=estado",{method:"PATCH",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({fields:{estado:{stringValue:"descartado"}}})});
        if(r.ok)desc++;
      }
      if((ok+desc)%50===0)log.textContent="Limpiando… "+(ok+desc)+"/"+malos.length;
    }
    log.textContent="✓ LIMPIO: "+ok+" borrados"+(desc?(" · "+desc+" marcados descartado (las reglas no dejaban borrar — efecto equivalente)"):"")+".\nAhora re-cruza la MAESTRA con Nombre=NOMBRE.";
  }catch(e){log.textContent="Error: "+e.message;}
  b.disabled=false;
}
</script></body></html>
