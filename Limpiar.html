<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limpiar cruce erróneo de la MAESTRA</title>
<style>body{font-family:Arial;background:#FAF5F0;padding:18px;color:#2B2B2B}
h1{color:#B3261E;font-size:18px}.sub{color:#6B6B6B;font-size:12.5px;margin-bottom:12px}
button{background:#B3261E;color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}#log{font-size:13px;margin-top:12px;white-space:pre-line}</style></head><body>
<h1>🧹 Limpiar el cruce erróneo (MAESTRA con columnas cruzadas)</h1>
<div class="sub">Borra de <b>radar_prospectos</b> ÚNICAMENTE los registros cuyo <b>origen</b> sea el fichero MAESTRA (el cruce con Nombre=Población). No toca nada más de la bolsa. Un solo uso.</div>
<button id="b" onclick="go()">Borrar el cruce erróneo</button>
<div id="log"></div>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
async function go(){
  const b=document.getElementById("b");b.disabled=true;
  const log=document.getElementById("log");
  let docs=[],pt="";
  do{
    const r=await fetch(FB+"/radar_prospectos?pageSize=300"+(pt?"&pageToken="+pt:""));
    const j=await r.json();
    (j.documents||[]).forEach(d=>docs.push(d));
    pt=j.nextPageToken||"";
    log.textContent="Leyendo bolsa… "+docs.length;
  }while(pt);
  const malos=docs.filter(d=>String(d.fields?.origen?.stringValue||"").toUpperCase().includes("MAESTRA"));
  log.textContent="Encontrados "+malos.length+" registros del cruce erróneo. Borrando…";
  let ok=0;
  for(const d of malos){
    const r=await fetch(d.name.replace(/^projects.*?documents/,FB),{method:"DELETE"});
    if(r.ok)ok++;
    if(ok%50===0)log.textContent="Borrando… "+ok+"/"+malos.length;
  }
  log.textContent="✓ LIMPIO: "+ok+" registros erróneos eliminados. La bolsa buena queda intacta.\nAhora vuelve a cruzar la MAESTRA con las columnas BIEN puestas (Nombre=NOMBRE).";
  b.disabled=false;
}
</script></body></html>
