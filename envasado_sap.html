<!doctype html>

<style>

*{box-sizing:border-box}body{margin:0;font:19px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:#F1F5F9;color:var(--t)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}

.ped{background:#fff;border:2px solid var(--l);border-radius:18px;margin-bottom:14px;overflow:hidden}
.ped.bloq{border-color:#FCA5A5}

.cv{background:var(--vb);color:var(--v)}.cr{background:var(--rb);color:var(--r)}.ca{background:var(--ab);color:var(--a)}.cz{background:var(--zb);color:var(--z)}.cg{background:#F1F5F9;color:#334155}
.cuerpo{border-top:2px solid var(--l);padding:6px 16px 16px;background:#FAFBFC}

.btl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.nada{text-align:center;color:var(--g);padding:40px 10px;font-size:20px}

.dlg{background:#fff;border-radius:20px;max-width:560px;width:100%;padding:22px;max-height:92vh;overflow:auto}
.dlg h2{margin:0 0 8px;font-size:25px}.dlg p{font-size:19px;margin:6px 0}
.dlg textarea,.dlg input[type=date]{width:100%;font:inherit;font-size:20px;padding:14px;border:2px solid var(--l);border-radius:12px;margin-top:8px}

@media(max-width:640px){body{font-size:18px}.tabs{gap:5px}.tab{font-size:12px;padding:8px 1px}.tab b{font-size:26px}h1{font-size:22px}.cli{font-size:21px}}
.cen{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
.cen button{flex:0 0 auto;font:inherit;font-weight:800;font-size:17px;border:2px solid var(--l);background:#fff;border-radius:99px;padding:9px 16px;cursor:pointer;color:var(--t)}
.cen button.on{background:#B45309;border-color:#B45309;color:#fff}
.cen button b{background:#FEF3C7;color:#92400E;border-radius:99px;padding:0 8px;margin-left:6px}.cen button.on b{background:#fff}
select.sel{width:100%;font:inherit;font-size:19px;padding:13px;border:2px solid var(--l);border-radius:12px;margin-top:8px;background:#fff}
input.num{width:100%;font:inherit;font-size:24px;font-weight:800;padding:12px;border:2px solid var(--l);border-radius:12px;margin-top:8px}

.chk input{width:26px;height:26px;flex:0 0 auto}.chk.on{border-color:#2563EB;background:#EFF6FF}
.barra{height:16px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin-top:8px}.barra i{display:block;height:100%;background:#16A34A}
.dlg.ancho{max-width:760px}
.dlg table{font-size:14px!important;table-layout:fixed}.dlg td,.dlg th{word-break:break-word}
.dia-h{font-weight:800;font-size:19px;margin:18px 0 6px;color:#334155}
</style><style>
.paso{font-size:15px;font-weight:800;color:#B45309;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px}
.fmt{background:#fff;border:2px solid var(--l);border-radius:16px;padding:14px;margin-top:10px}
.fmt.on{border-color:#16A34A;background:#F0FDF4}
.cnt{display:flex;align-items:center;gap:10px;margin-top:10px}

.cnt input{flex:1;text-align:center;font-size:30px;font-weight:800;padding:10px;border:2px solid var(--l);border-radius:14px;min-width:0}

@media print{.noimp{display:none!important}}
</style></head><body>
<div class="top noimp"><div class="fila"><h1>📦 Envasado</h1><button class="pill" id="dbPill" onclick="cambiarDb()"></button></div>
<div class="sub" style="font-size:16px">Del granel fabricado a bolsas, cajas… con lote nuevo y número de caja. Se pueden mezclar lotes.</div></div>
<div class="w noimp" id="app">
<div class="paso">1 · ¿Qué granel vas a envasar?</div>
<input class="bus" id="g" data-buscador placeholder="🔎 Código o descripción del granel (ej. MX243.20R2)" onchange="cargar()">
<div id="cuerpo"></div></div>
<div id="etq"></div>
<script>/* pase SAP: lo da el portal al entrar */
(function(){
  // Pase de SAP: lo da el portal al entrar (usuario y contraseña del portal, una vez cada 30 días).
  // Aquí no se pide ninguna contraseña: si falta el pase, se explica y se ofrece salir y volver a entrar.
  var K='sap_pedido_key';
  function galleta(){ var m=/(?:^|;\s*)sap_pase=([^;]+)/.exec(document.cookie||'')||/(?:^|;\s*)cs_pase=([^;]+)/.exec(document.cookie||''); return m?decodeURIComponent(m[1]):''; }
  function get(){ var t=''; try{ t=localStorage.getItem(K)||''; }catch(e){} return exp(t)>Date.now()?t:galleta(); }
  function exp(t){ var m=/^crm\.([A-Za-z0-9_-]+)\./.exec(t||''); if(!m) return 0; try{ return JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))).exp||0; }catch(e){ return 0; } }
  var abierto=false;
  function ventana(motivo){
    if(abierto) return; abierto=true;
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif');
    d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:380px;width:100%;padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.3)">'
      +'<div style="font-weight:800;font-size:18px">🔐 Falta el permiso de SAP</div>'
      +'<div style="font-size:14px;color:#334155;margin:8px 0 14px;line-height:1.45">'+(motivo||'Este aparato todavía no tiene permiso para SAP.')+'<br><br>Sal del portal y vuelve a entrar con tu usuario: el permiso se activa solo y dura 30 días.'+(function(){ var e=''; try{ e=localStorage.getItem('sap_pase_error')||''; }catch(x){} return e?'<div style="margin-top:10px;background:#FEE2E2;color:#991B1B;border-radius:8px;padding:8px;font-weight:700">Último intento: '+String(e).replace(/[<>&]/g,'')+'</div>':''; })()+'</div>'
      +'<button id="sp_out" style="width:100%;font-size:17px;font-weight:800;padding:12px;border:0;border-radius:10px;background:#0F172A;color:#fff">Salir y volver a entrar</button>'
      +'<button id="sp_x" style="width:100%;font-size:15px;font-weight:700;padding:10px;border:0;background:transparent;color:#64748B;margin-top:6px">Ahora no</button></div>';
    document.body.appendChild(d);
    document.getElementById('sp_x').onclick=function(){ d.remove(); abierto=false; };
    document.getElementById('sp_out').onclick=function(){
      try{ localStorage.removeItem(K); localStorage.removeItem('gc_portal_user'); }catch(e){}
      try{ if(window.top&&window.top.doLogout){ window.top.doLogout(); return; } }catch(e){}
      try{ window.top.location.href='/'; }catch(e){ location.href='/'; }
    };
  }
  // Intento automático: con la sesión del portal abierta en ESTE navegador (gc_portal_user), se lee la ficha del usuario
  // y se pide el pase sin preguntar nada. Así funciona en Safari, Chrome o cualquier navegador donde se haya entrado al portal.
  async function auto(){
    var pu=null; try{ pu=JSON.parse(localStorage.getItem('gc_portal_user')||'null'); if(!pu||!pu.id){ var sid=localStorage.getItem('sap_portal_id')||decodeURIComponent((/(?:^|;\s*)sap_portal_id=([^;]+)/.exec(document.cookie)||[])[1]||''); if(sid) pu={id:sid}; } }catch(e){}
    if(!pu||!pu.id) return 'no hay sesión del portal en este navegador';
    var h=pu.passHash||'';
    if(!h){ try{ var FB='https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents';
      for(var col of ['portal_users','usuarios']){ var r=await fetch(FB+'/'+col+'/'+encodeURIComponent(pu.id)); if(!r.ok) continue; var j=await r.json(); var f=(j.fields||{}).passHash; if(f&&f.stringValue){ h=f.stringValue; break; } } }catch(e){} }
    if(!h) return 'no encuentro la ficha del usuario '+pu.id;
    try{ var r2=await fetch('/api/sap-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:pu.id,passHash:h})});
      var j2=await r2.json().catch(function(){ return {ok:false,error:'HTTP '+r2.status}; });
      if(j2&&j2.ok&&j2.token){ try{ localStorage.setItem(K,j2.token); localStorage.removeItem('sap_pase_error'); }catch(e){} return ''; }
      return (j2&&j2.error)||'sin respuesta'; }catch(e){ return 'no se llega al servidor: '+e.message; } }
  var intentado=false;
  async function resolver(motivo){
    if(!intentado){ intentado=true; var err=await auto(); if(!err){ location.reload(); return; } try{ localStorage.setItem('sap_pase_error',err); }catch(e){} }
    ventana(motivo);
  }
  window.pedirPaseSap=resolver;
  var f0=window.fetch;
  window.fetch=function(u,o){ return f0.apply(this,arguments).then(function(r){ try{ if(r.status===401&&/\/api\/sap-(pedido|factura|produccion|traslado|planificacion|cs)/.test(String(u&&u.url||u))) setTimeout(function(){ resolver(exp(get())?'El permiso guardado ya no vale.':''); },0); }catch(e){} return r; }); };
  if(!(exp(get())>Date.now())){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ resolver(); }); else resolver(); }
})();
</script>
<script>
const API="/api/sap-cs", FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
let DB=LS("env_db")||"U_CARO_99", G=null, SEL={}, ENV={}, POR={}, HECHO=null;
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fx=(d)=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7)+"/"+String(d).slice(0,4):"—";
const n=(v)=>(Math.round((Number(v)||0)*1000)/1000).toLocaleString("es-ES");
const HOY=new Date().toISOString().slice(0,10);
function pill(){ const p=document.getElementById("dbPill"); p.textContent=DB==="U_CARO_00"?"SAP REAL":"SAP PRUEBAS"; p.className="pill "+(DB==="U_CARO_00"?"pv":"pp"); }
function dialogo(h){ cerrar(); const d=document.createElement("div"); d.className="velo"; d.id="velo"; d.innerHTML='<div class="dlg">'+h+'</div>'; d.onclick=(e)=>{ if(e.target===d) cerrar(); }; document.body.appendChild(d); }
window.cerrar=()=>{ const d=document.getElementById("velo"); if(d) d.remove(); };
window.cambiarDb=()=>dialogo('<h2>¿Qué SAP?</h2><button class="bt a op" onclick="ponDb(\'U_CARO_99\')">🧪 Pruebas · U_CARO_99</button><button class="bt op" style="background:#B91C1C" onclick="ponDb(\'U_CARO_00\')">⚠️ Real · U_CARO_00</button><button class="bt g op" onclick="cerrar()">Cancelar</button>');
window.ponDb=(d)=>{ DB=d; LS("env_db",d); cerrar(); pill(); if(G) cargar(); };
async function api(url,opts){ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(DB),Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json","x-crm-key":LS("sap_pedido_key")||""}},opts||{})); return r.json().catch(()=>({ok:false,error:"sin respuesta del servidor (HTTP "+r.status+")"})); }
function aviso(t,ok){ const d=document.createElement("div"); d.className="msg"; d.style.background=ok?"#16A34A":"#B91C1C"; d.style.color="#fff"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ok?5000:10000); }
const loteNuevo=()=>{ const d=new Date(), p=(x)=>String(x).padStart(2,"0"); return String(d.getFullYear()).slice(2)+"E."+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes()); };
window.cargar=async()=>{ const g=document.getElementById("g").value.trim().toUpperCase(); if(!g) return; if(G&&G.granel&&G.granel.cod===g&&!HECHO) return; HECHO=null;
  document.getElementById("cuerpo").innerHTML='<div class="carg">Buscando lotes y formatos en SAP…</div>';
  const j=await api(API+"?envasado="+encodeURIComponent(g)); if(!j.ok){ document.getElementById("cuerpo").innerHTML='<div class="nada" style="color:#B91C1C">'+esc(j.error)+'</div>'; return; }
  G=j; SEL={}; ENV={}; POR={};
  // Lotes: se marcan solos por caducidad (el que caduca antes, primero)
  (j.formatos||[]).forEach(f=>{ POR[f.cod]=f.porEnvase||f.porEnvaseSugerido||""; ENV[f.cod]=0; });
  pintar(); };
const lotesSel=()=>(G.lotes||[]).filter(l=>SEL[l.lote+"|"+l.alm]>0).map(l=>Object.assign({},l,{usar:SEL[l.lote+"|"+l.alm]}));
const totalSel=()=>lotesSel().reduce((t,l)=>t+l.usar,0);
const necesita=()=>(G.formatos||[]).reduce((t,f)=>t+(Number(ENV[f.cod])||0)*(Number(POR[f.cod])||0),0);
window.marcaLote=(k,max)=>{ SEL[k]=SEL[k]?0:max; pintar(); };
window.udsLote=(k,v,max)=>{ SEL[k]=Math.max(0,Math.min(max,Number(v)||0)); pintar(true); };
window.autoLotes=()=>{ let falta=necesita(); SEL={}; for(const l of (G.lotes||[])){ if(falta<=0) break; const u=Math.min(l.uds,falta); SEL[l.lote+"|"+l.alm]=Math.round(u*1000)/1000; falta-=u; } pintar(); };
window.mas=(c,d)=>{ ENV[c]=Math.max(0,(Number(ENV[c])||0)+d); pintar(); };
window.ponEnv=(c,v)=>{ ENV[c]=Math.max(0,Math.floor(Number(v)||0)); pintar(true); };
window.ponPor=(c,v)=>{ POR[c]=Number(v)||""; pintar(true); };
function pintar(suave){ pill(); if(!G) return; if(suave){ pintaResumen(); return; } const g=G.granel;
  let H='<div class="ped"><div class="cab" style="cursor:default"><div class="cli">'+esc(g.cod)+' <span class="desc">'+esc(g.nom)+'</span></div><div class="meta">'+(g.stock||[]).map(w=>esc(w.alm)+': '+n(w.stock)+' '+esc(g.ud)).join(' · ')+'</div></div></div>';
  H+='<div class="paso">2 · ¿En qué envases y cuántos?</div>';
  if(!(G.formatos||[]).length) H+='<div class="nada" style="color:#B45309">No encuentro formatos de envase para '+esc(g.cod)+'.<br><span style="font-size:17px">Se buscan los artículos que empiezan por «'+esc(g.cod)+'.» (por ejemplo '+esc(g.cod)+'.C140).</span></div>';
  H+=(G.formatos||[]).map(f=>{ const e=Number(ENV[f.cod])||0, p=Number(POR[f.cod])||0;
    return '<div class="fmt'+(e?' on':'')+'"><div class="art">'+esc(f.cod)+' <span class="desc">'+esc(f.nom)+'</span></div>'
     +(f.receta&&f.porEnvase?'<div class="sub">Cada envase lleva <b>'+n(f.porEnvase)+' '+esc(g.ud)+'</b> de granel'+(f.embalaje.length?' + '+f.embalaje.map(x=>esc(x.cod)+' ×'+n(x.porEnvase)).join(', '):'')+'</div>'
       :'<div class="sub" style="color:#B45309">⚠️ Sin receta en SAP: ¿cuántas unidades de granel lleva cada envase? <input class="num" style="width:110px;display:inline-block;margin:0;font-size:20px;padding:6px" type="number" inputmode="decimal" value="'+esc(POR[f.cod])+'" onchange="ponPor(\''+esc(f.cod)+'\',this.value)"></div>')
     +'<div class="cnt"><button onclick="mas(\''+esc(f.cod)+'\',-1)">−</button><input type="number" inputmode="numeric" value="'+e+'" onchange="ponEnv(\''+esc(f.cod)+'\',this.value)"><button onclick="mas(\''+esc(f.cod)+'\',1)">+</button></div>'
     +'<div class="sub" style="text-align:center;font-size:18px" id="u_'+esc(f.cod)+'">'+(e&&p?'= <b>'+n(e*p)+' '+esc(g.ud)+'</b> de granel':'envases')+'</div></div>'; }).join("");
  H+='<div class="paso">3 · ¿De qué lotes de granel? <span style="text-transform:none;color:#64748B">(puedes mezclar)</span></div><button class="bt g" style="width:100%" onclick="autoLotes()">⚡ Elegir lotes solos (caduca antes, primero)</button>';
  H+=(G.lotes||[]).map(l=>{ const k=l.lote+"|"+l.alm, u=SEL[k]||0; return '<label class="chk'+(u?' on':'')+'"><input type="checkbox" '+(u?'checked':'')+' onchange="marcaLote(\''+esc(k)+'\','+l.uds+')"><div style="flex:1"><b>Lote '+esc(l.lote)+'</b> · '+esc(l.alm)+'<br><span class="sub">hay '+n(l.uds)+' · caduca '+fx(l.caduca)+'</span></div>'+(u?'<input class="num" style="width:120px;margin:0" type="number" inputmode="decimal" value="'+u+'" onchange="udsLote(\''+esc(k)+'\',this.value,'+l.uds+')">':'')+'</label>'; }).join("")||'<div class="nada">'+(G.avisoLotes?esc(G.avisoLotes):'No hay lotes de este granel con existencias.')+'</div>';
  H+='<div class="resu" id="res"></div>';
  document.getElementById("cuerpo").innerHTML=H; pintaResumen(); }
function pintaResumen(){ const r=document.getElementById("res"); if(!r) return; const nec=necesita(), sel=totalSel(), fs=(G.formatos||[]).filter(f=>ENV[f.cod]>0), sinPor=fs.filter(f=>!(Number(POR[f.cod])>0));
  (G.formatos||[]).forEach(f=>{ const e=document.getElementById("u_"+f.cod); if(e){ const x=Number(ENV[f.cod])||0, p=Number(POR[f.cod])||0; e.innerHTML=x&&p?'= <b>'+n(x*p)+' '+esc(G.granel.ud)+'</b> de granel':'envases'; } });
  const ok=fs.length&&!sinPor.length&&Math.abs(nec-sel)<0.001;
  r.innerHTML='<div style="font-size:19px;font-weight:800">Hace falta <b>'+n(nec)+'</b> · lotes elegidos <b style="color:'+(Math.abs(nec-sel)<0.001?'#15803D':'#B91C1C')+'">'+n(sel)+'</b> '+esc(G.granel.ud)+'</div>'
   +(sinPor.length?'<div class="sub" style="color:#B91C1C">Falta decir cuántas unidades lleva cada envase de '+esc(sinPor.map(f=>f.cod).join(', '))+'</div>':nec&&Math.abs(nec-sel)>=0.001?'<div class="sub" style="color:#B91C1C">'+(sel<nec?'Faltan '+n(nec-sel):'Sobran '+n(sel-nec))+' en los lotes. Pulsa «Elegir lotes solos» o ajústalos.</div>':'')
   +'<button class="bt v" style="width:100%;font-size:22px;padding:18px;margin-top:8px" '+(ok?'':'disabled')+' onclick="confirmar()">📦 ENVASAR</button>'; }
// Reparte los lotes elegidos entre los formatos (en orden de caducidad)
function reparto(){ const L=lotesSel().map(l=>Object.assign({},l)); return (G.formatos||[]).filter(f=>ENV[f.cod]>0).map(f=>{ let falta=ENV[f.cod]*POR[f.cod]; const usa=[];
  for(const l of L){ if(falta<=1e-9) break; if(l.usar<=1e-9) continue; const u=Math.min(l.usar,falta); usa.push({lote:l.lote,alm:l.alm,uds:Math.round(u*1000)/1000,caduca:l.caduca}); l.usar-=u; falta-=u; } return {f,usa}; }); }
window.confirmar=()=>{ const R=reparto(), lote=loteNuevo();
  dialogo('<h2>📦 ¿Envasar?</h2>'+R.map(x=>'<div class="chk on" style="cursor:default;display:block"><b>'+n(ENV[x.f.cod])+' × '+esc(x.f.cod)+'</b><br><span class="sub">'+n(ENV[x.f.cod]*POR[x.f.cod])+' de granel de '+x.usa.map(u=>'lote '+esc(u.lote)+' ('+n(u.uds)+')').join(' + ')+'</span></div>').join("")
   +'<p>Lote nuevo de los envases: <b>'+lote+'</b> · caducidad: la del lote de granel que caduca antes.</p><p>Los envases se numeran 1, 2, 3… dentro de cada lote (en la etiqueta: «Nº 3/8»).</p>'
   +'<button class="bt v op" style="font-size:22px;padding:18px" onclick="envasar(\''+lote+'\',this)">✅ Sí, envasar en SAP</button><button class="bt g op" onclick="cerrar()">Volver</button>'); };
window.envasar=async(lote,b)=>{ b.disabled=true; const R=reparto(), res=[], alm=(lotesSel()[0]||{}).alm||((G.granel.stock||[])[0]||{}).alm;
  for(let i=0;i<R.length;i++){ const {f,usa}=R[i], cant=ENV[f.cod]; b.textContent="Envasando "+(i+1)+" de "+R.length+"…";
    const cad=usa.map(u=>u.caduca).filter(Boolean).sort()[0]||"";
    const comps=[{articulo:G.granel.cod,uds:Math.round(cant*POR[f.cod]*1000)/1000,almacen:alm,lotes:usa.map(u=>({lote:u.lote,uds:u.uds}))}].concat((f.embalaje||[]).map(e=>({articulo:e.cod,uds:Math.round(cant*e.porEnvase*1000)/1000,almacen:alm})));
    const parte={producto:f.cod,cantidad:cant,almacen:alm,loteNuevo:lote,caducidad:cad||undefined,fabricacion:HOY,cerrar:true,componentes:comps,
      comentario:("Envasado de "+G.granel.cod+" · lotes "+usa.map(u=>u.lote+"("+u.uds+")").join("+")+" · envases 1-"+cant).slice(0,254)};
    const r=await fetch("/api/sap-produccion?db="+encodeURIComponent(DB),{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","x-crm-key":LS("sap_pedido_key")||""},body:JSON.stringify({db:DB,parte})});
    const j=await r.json().catch(()=>({ok:false,error:"HTTP "+r.status}));
    res.push({f,usa,cant,cad,ok:j.ok!==false&&!j.error,j});
    if(j.ok!==false&&!j.error){ // Trazabilidad del envasado (qué lotes de granel hay en cada lote/caja)
      const doc={fields:{lote:{stringValue:lote},articulo:{stringValue:f.cod},granel:{stringValue:G.granel.cod},cajas:{integerValue:String(cant)},porEnvase:{doubleValue:Number(POR[f.cod])},caducidad:{stringValue:cad},fecha:{stringValue:new Date().toISOString()},db:{stringValue:DB},
        orden:{stringValue:String((j.orden||{}).DocumentNumber||"")},origen:{stringValue:JSON.stringify(usa.map(u=>({lote:u.lote,uds:u.uds})))}}};
      try{ await fetch(FB+"/envasados/"+encodeURIComponent(DB+"_"+f.cod+"_"+lote),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(doc)}); }catch(e){} } }
  cerrar(); HECHO={lote,res}; resultado(); };
function resultado(){ const {lote,res}=HECHO, ok=res.filter(x=>x.ok);
  document.getElementById("cuerpo").innerHTML='<div class="paso">Hecho</div>'+res.map(x=>'<div class="lin '+(x.ok?'ok':'no')+'"><div class="art">'+(x.ok?'✅ ':'❌ ')+n(x.cant)+' × '+esc(x.f.cod)+'</div>'
     +(x.ok?'<div class="dice">Lote <b>'+lote+'</b> · cajas 1 a '+n(x.cant)+(x.cad?' · caduca '+fx(x.cad):'')+'</div><div class="sub">Orden '+esc((x.j.orden||{}).DocumentNumber)+' · salida '+esc((x.j.salida||{}).DocNum)+' · entrada '+esc((x.j.entrada||{}).DocNum)+' · de '+x.usa.map(u=>'lote '+esc(u.lote)+' ('+n(u.uds)+')').join(' + ')+'</div>'
       :'<div class="dice" style="color:#B91C1C">'+esc(x.j.error||"error")+'</div>')+'</div>').join("")
   +(ok.length?'<button class="bt a" style="width:100%;font-size:22px;padding:18px;margin-top:12px" onclick="etiquetas()">🖨️ Imprimir etiquetas ('+ok.reduce((t,x)=>t+x.cant,0)+')</button>':'')
   +'<button class="bt g" style="width:100%;margin-top:10px" onclick="location.reload()">Envasar otro</button>'; }
window.etiquetas=()=>{ const {lote,res}=HECHO; let h='<style>@page{size:100mm 60mm;margin:0}body{margin:0}.e{width:100mm;height:60mm;box-sizing:border-box;padding:5mm;font-family:system-ui,sans-serif;page-break-after:always;border:1px dashed #ccc}.e b{font-size:20pt}.e div{font-size:11pt;margin-top:2mm}.e .g{font-size:26pt;font-weight:800}</style>';
  res.filter(x=>x.ok).forEach(x=>{ for(let i=1;i<=x.cant;i++) h+='<div class="e"><b>'+esc(x.f.cod)+'</b><div>'+esc(x.f.nom)+'</div><div class="g">Lote '+lote+' · Nº '+i+'/'+x.cant+'</div><div>'+n(x.f.porEnvase||POR[x.f.cod])+' '+esc(G.granel.ud)+' · Envasado '+fx(HOY)+(x.cad?' · Cad. '+fx(x.cad):'')+'</div><div style="font-size:9pt;color:#555">Origen: '+x.usa.map(u=>esc(u.lote)).join(', ')+'</div></div>'; });
  const w=window.open("","_blank"); if(!w) return aviso("Permite las ventanas emergentes para imprimir",false); w.document.write('<!doctype html><meta charset="utf-8"><title>Etiquetas '+lote+'</title>'+h+'<script>setTimeout(()=>print(),400)<\/script>'); w.document.close(); };
pill();
</script>
<script>/* Buscador automático de artículos (catálogo del CRM, el mismo que usa «Nuevo pedido») */
(function(){
  var FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents", ARTS=null, carga=null;
  var N=function(t){ return String(t||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,""); };
  function cargar(){ if(carga) return carga; carga=(async function(){ var L=[]; try{ var m=await fetch(FB+"/stock_sap/meta").then(function(r){ return r.ok?r.json():null; }); var n=Number(m&&m.fields&&m.fields.chunks&&(m.fields.chunks.integerValue||m.fields.chunks.doubleValue))||0;
      var P=await Promise.all(Array.from({length:n},function(_,i){ return fetch(FB+"/stock_sap_detalle/chunk_"+i).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); }));
      P.forEach(function(d){ var rows=[]; try{ rows=JSON.parse(d&&d.fields&&d.fields.rows&&d.fields.rows.stringValue||"[]"); }catch(e){} rows.forEach(function(r){ if(r&&r.cod) L.push({c:String(r.cod).toUpperCase(),d:r.desc||"",s:(Number(r.stockTodos!=null?r.stockTodos:r.stock)||0),n:N(r.cod+" "+r.desc)}); }); }); }catch(e){}
    ARTS=L; return L; })(); return carga; }
  var css=document.createElement("style"); css.textContent=".bsug{position:absolute;left:0;right:0;top:100%;background:#fff;border:2px solid #CBD5E1;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:60;max-height:320px;overflow:auto;margin-top:4px}.bsug div{padding:12px 14px;border-bottom:1px solid #F1F5F9;cursor:pointer;font-size:18px;text-align:left}.bsug div:hover,.bsug div.on{background:#EFF6FF}.bsug b{display:block}.bsug small{color:#64748B;font-size:15px}"; document.head.appendChild(css);
  var esc=function(t){ return String(t==null?"":t).replace(/[<>&"]/g,function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]; }); };
  // Pon data-buscador en cualquier <input> (o llama a window.buscadorArticulos(input)) y tendrá sugerencias al escribir
  window.buscadorArticulos=function(inp,alElegir){ if(!inp||inp._bus) return; inp._bus=1; inp.setAttribute("autocomplete","off"); cargar();
    var caja=document.createElement("div"); caja.className="bsug"; caja.hidden=true; var w=document.createElement("div"); w.style.position="relative"; w.style.flex=getComputedStyle(inp).flex; inp.parentNode.insertBefore(w,inp); w.appendChild(inp); w.appendChild(caja);
    var sel=-1, R=[];
    function pinta(){ caja.innerHTML=R.map(function(a,i){ return '<div class="'+(i===sel?'on':'')+'" data-i="'+i+'"><b>'+esc(a.c)+'</b><small>'+esc(a.d)+' · stock '+a.s.toLocaleString("es-ES")+'</small></div>'; }).join("")||'<div style="color:#64748B;cursor:default">'+(ARTS?'Sin resultados':'Cargando artículos…')+'</div>'; caja.hidden=false; }
    function elige(a){ inp.value=a.c; caja.hidden=true; if(alElegir) alElegir(a); inp.dispatchEvent(new Event("change")); }
    inp.addEventListener("input",async function(){ var q=N(inp.value).split(/\s+/).filter(Boolean); if(!q.length){ caja.hidden=true; return; } if(!ARTS){ R=[]; pinta(); await cargar(); }
      R=ARTS.filter(function(a){ return q.every(function(t){ return a.n.indexOf(t)>=0; }); }).sort(function(a,b){ return (a.c.indexOf(q[0])===0?0:1)-(b.c.indexOf(q[0])===0?0:1)||b.s-a.s; }).slice(0,20); sel=-1; pinta(); });
    inp.addEventListener("keydown",function(e){ if(caja.hidden) return; if(e.key==="ArrowDown"){ sel=Math.min(R.length-1,sel+1); pinta(); e.preventDefault(); } else if(e.key==="ArrowUp"){ sel=Math.max(0,sel-1); pinta(); e.preventDefault(); } else if(e.key==="Enter"&&R[sel>=0?sel:0]){ elige(R[sel>=0?sel:0]); e.preventDefault(); } else if(e.key==="Escape") caja.hidden=true; });
    caja.addEventListener("mousedown",function(e){ var d=e.target.closest("[data-i]"); if(d){ e.preventDefault(); elige(R[Number(d.getAttribute("data-i"))]); } });
    inp.addEventListener("blur",function(){ setTimeout(function(){ caja.hidden=true; },150); }); };
  new MutationObserver(function(){ document.querySelectorAll("input[data-buscador]").forEach(function(i){ window.buscadorArticulos(i); }); }).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener("DOMContentLoaded",function(){ document.querySelectorAll("input[data-buscador]").forEach(function(i){ window.buscadorArticulos(i); }); });
})();
</script>
