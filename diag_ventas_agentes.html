<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ventas por código de comercial</title>
<style>
  body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:#F8FAFC;color:#0F172A}
  .w{max-width:760px;margin:0 auto;padding:16px}
  h1{font-size:19px;margin:4px 0 4px} p{margin:4px 0;color:#64748B;font-size:13px}
  input{width:100%;box-sizing:border-box;padding:11px;border:1.5px solid #CBD5E1;border-radius:10px;font:inherit;margin:10px 0}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid #F1F5F9;text-align:right} th{background:#F1F5F9;font-size:11px;text-transform:uppercase;color:#64748B}
  td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
  .cod{font-family:ui-monospace,Menlo,monospace;font-weight:700}
  .hit{background:#FEF9C3}
</style></head><body><div class="w">
<h1>🔎 Ventas por código de comercial</h1>
<p>Lo que el CRM ha copiado del Power BI (pbi_resumen_agente). El parte y el CRM buscan las ventas por este código. Solo lee, no cambia nada.</p>
<input id="q" placeholder="Busca un código o nombre (p. ej. PINIESTA, PEREZ)" value="PIN">
<div id="out"><p>Leyendo…</p></div>
</div>
<script>
const FB='https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents';
const v=(f)=>!f?null:f.doubleValue!=null?Number(f.doubleValue):f.integerValue!=null?Number(f.integerValue):f.stringValue!=null?f.stringValue:null;
const eur=(n)=>Math.round(Number(n)||0).toLocaleString('es-ES')+' €';
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=[], ALIAS=[];
async function leer(col){ const out=[]; let tok=null,i=0; do{ const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?'&pageToken='+encodeURIComponent(tok):''),{cache:'no-store'}); if(!r.ok) break;
  const j=await r.json(); (j.documents||[]).forEach(d=>{ const o={_id:decodeURIComponent(d.name.split('/').pop())}; for(const [k,x] of Object.entries(d.fields||{})) o[k]=v(x); out.push(o); }); tok=j.nextPageToken||null; i++; }while(tok&&i<20); return out; }
function pinta(){
  const q=String(document.getElementById('q').value||'').toUpperCase().trim();
  const fil=L.filter(a=>!q||String(a._id).toUpperCase().includes(q)||String(a.agente||'').toUpperCase().includes(q)||String(a.equipo||'').toUpperCase().includes(q));
  const al=ALIAS.filter(a=>q&&(String(a._id).toUpperCase().includes(q)||String(a.canonico||'').toUpperCase().includes(q)||String(a.nombre||'').toUpperCase().includes(q)));
  document.getElementById('out').innerHTML=`<p>${fil.length} de ${L.length} códigos · actualizado ${esc(String((L.find(a=>a.actualizado)||{}).actualizado||'').slice(0,16).replace('T',' '))}</p>
  <table><thead><tr><th>Código</th><th>Equipo</th><th>Semana</th><th>Mes</th><th>Año</th><th>Año pasado</th></tr></thead><tbody>
  ${fil.sort((a,b)=>(b.ventasAct||0)-(a.ventasAct||0)).map(a=>`<tr class="${q&&String(a._id).toUpperCase().includes(q)?'hit':''}"><td class="cod">${esc(a._id)}</td><td>${esc(a.equipo||'')}</td><td>${eur(a.ventasSem)}</td><td>${eur(a.ventasMes)}</td><td>${eur(a.ventasAct)}</td><td>${eur(a.ventasAntYTD)}</td></tr>`).join('')}
  </tbody></table>
  ${al.length?`<p style="margin-top:14px"><b>Tabla de alias</b> (qué código se junta con quién):</p><table><thead><tr><th>Alias</th><th>Es de</th><th>Nombre</th><th>Equipo</th><th></th><th></th></tr></thead><tbody>${al.map(a=>`<tr><td class="cod">${esc(a._id)}</td><td class="cod">${esc(a.canonico||'')}</td><td>${esc(a.nombre||'')}</td><td>${esc(a.equipo||'')}</td><td></td><td></td></tr>`).join('')}</tbody></table>`:''}`;
}
(async()=>{ try{ [L,ALIAS]=await Promise.all([leer('pbi_resumen_agente'),leer('agentes_alias').catch(()=>[])]); pinta(); }catch(e){ document.getElementById('out').innerHTML='<p>No se ha podido leer: '+esc(e.message)+'</p>'; } })();
document.getElementById('q').oninput=pinta;
</script></body></html>
