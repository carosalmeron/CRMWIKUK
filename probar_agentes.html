<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probar identidades</title>
<style>
 :root{--papel:#F2F4F7;--tinta:#14181F;--tenue:#6B7684;--linea:#DCE1E7;
       --ok:#0E7C5A;--mal:#C2263D;--okL:#EDF7F3;--malL:#FEF2F4}
 *{box-sizing:border-box}
 body{margin:0;background:var(--papel);color:var(--tinta);max-width:760px;
   margin-inline:auto;padding:20px 14px 50px;
   font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 h1{margin:0 0 3px;font-size:21px;font-weight:800}
 .sub{margin:0 0 16px;font-size:13px;color:var(--tenue)}
 h2{font-size:15px;margin:24px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--linea)}
 .card{background:#fff;border:1px solid var(--linea);border-radius:6px;
   padding:13px 14px;margin-bottom:9px;font-size:13.5px}
 .card.ok{border-color:var(--ok);background:var(--okL)}
 .card.mal{border-color:var(--mal);background:var(--malL)}
 code{background:#F1F5F9;padding:1px 6px;border-radius:4px;font-size:12px;
   font-family:ui-monospace,monospace}
 table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;
   border:1px solid var(--linea);border-radius:6px;overflow:hidden}
 th{background:#F1F5F9;text-align:left;padding:8px;font-size:10.5px;
   text-transform:uppercase;color:var(--tenue)}
 td{padding:7px 8px;border-top:1px solid var(--linea)}
 .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
 .estado{padding:34px 4px;color:var(--tenue);text-align:center}
</style></head><body>
<h1>🧪 Probar identidades</h1>
<p class="sub">Comprueba que la tabla resuelve bien antes de tocar las páginas.</p>
<div id="app"><p class="estado">Cargando tabla y datos…</p></div>

<script src="agentes.js"></script>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
function val(f){
  if(!f) return null;
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  return null;
}
async function leer(col,max=10){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<max);
  return t;
}

// Casos que han dado problemas durante todo el desarrollo
const CASOS=[
  ["IK4","AZARCO","Antonio Zarco: código CRM vs código de facturación"],
  ["ik4","Azarco","el mismo, en minúsculas"],
  ["WK4","AGUSTIN","Agustín"],
  ["WK5","esther","Esther"],
  ["WK8","alex","Alex Cruz (el huérfano que asignaste)"],
  ["WK13","miguel","Miguel"],
  ["JL","WK9","JL García"],
  ["LLUIS","LLVILA","Lluis"],
  ["U_1779125048046","LLUIS","Lluis con su id de portal"],
  ["WK12","RPIEDRA","R. Piedra"],
  ["IK2","RICARDO","Ricardo"],
  ["IK1","Carlos G.","Carlos G."],
  ["WK6","D. Vega","David Vega"],
  ["IK3","veses","Paco Veses"],
];

(async()=>{
  const app=document.getElementById("app");
  await Agentes.cargar();

  let h='<div class="card '+(Agentes.total?"ok":"mal")+'">'
    +'<b>'+Agentes.total+' alias cargados</b> de agentes_alias'
    +(Agentes.total?"":" — la tabla está vacía o no se ha podido leer")
    +'</div>';

  // 1 · Casos conocidos
  let bien=0;
  h+='<h2>1 · Casos que antes fallaban</h2><table><thead><tr>'
    +'<th>A</th><th>B</th><th>¿Misma persona?</th><th>Resuelve a</th></tr></thead><tbody>'
    +CASOS.map(([a,b,desc])=>{
      const ok=Agentes.mismo(a,b);
      if(ok) bien++;
      return '<tr style="background:'+(ok?"var(--okL)":"var(--malL)")+'">'
        +'<td><code>'+a+'</code></td><td><code>'+b+'</code></td>'
        +'<td>'+(ok?"✅ sí":"❌ NO")+'</td>'
        +'<td>'+(ok?Agentes.nombre(a)+" ("+Agentes.id(a)+")":desc)+'</td></tr>';
    }).join("")
    +'</tbody></table>'
    +'<p class="sub">'+bien+' de '+CASOS.length+' correctos.</p>';

  // 2 · Cobertura real por colección
  h+='<h2>2 · Cobertura sobre los datos</h2>'
    +'<p class="sub">Cuántos documentos tienen un agente que la tabla reconoce.</p>';
  const cols=["visitas","muestras","ofertas","estrategias","informes",
              "planes_semanales","pbi_pedidos","proyectos"];
  const filas=[];
  for(const c of cols){
    const docs=await leer(c,8);
    let con=0, sin=0;
    const desconocidos={};
    docs.forEach(d=>{
      const v=d.agente||d.responsableComercial||d.vendedor||d.agenteId;
      if(!v) return;
      if(Agentes.conocido(v)) con++;
      else { sin++; desconocidos[v]=(desconocidos[v]||0)+1; }
    });
    filas.push({c,con,sin,desconocidos});
  }
  h+='<table><thead><tr><th>Colección</th><th>Reconocidos</th>'
    +'<th>Sin reconocer</th><th>Cuáles</th></tr></thead><tbody>'
    +filas.map(f=>{
      const pct=f.con+f.sin?Math.round(f.con/(f.con+f.sin)*100):0;
      return '<tr><td>'+f.c+'</td><td class="n">'+f.con+' ('+pct+'%)</td>'
        +'<td class="n" style="color:'+(f.sin?"var(--mal)":"var(--tenue)")+'">'+f.sin+'</td>'
        +'<td style="font-size:11px;color:var(--tenue)">'
        +Object.entries(f.desconocidos).sort((a,b)=>b[1]-a[1]).slice(0,5)
          .map(x=>x[0]+" ("+x[1]+")").join(", ")+'</td></tr>';
    }).join("")
    +'</tbody></table>';

  app.innerHTML=h;
})();
</script></body></html>
