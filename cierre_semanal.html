<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--papel:#F2F4F7;--tinta:#14181F;--tenue:#6B7684;--linea:#DCE1E7;
        --hueco:#fff;--ok:#0E7C5A;--mal:#C2263D;--med:#B07908}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);max-width:620px;
    margin-inline:auto;padding:0 0 30px;
    font:400 16px/1.5 "Instrument Sans",-apple-system,system-ui,sans-serif}

  header{background:var(--tinta);color:#fff;padding:18px 16px}

  main{padding:16px}
  .paso{background:var(--hueco);border:1px solid var(--linea);border-radius:5px;
    padding:16px;margin-bottom:12px}
  .num{display:inline-flex;width:20px;height:20px;border-radius:99px;background:var(--tinta);
    color:#fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;
    margin-right:7px}
  .tit{font-size:15.5px;font-weight:700;margin:0 0 3px}
  .sub{margin:0 0 13px;font-size:12.5px;color:var(--tenue);line-height:1.45}
  .rot{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;

  .dato{background:#F7F9FB;border-left:2px solid var(--linea);border-radius:0 3px 3px 0;

  .dg{display:flex;gap:20px;flex-wrap:wrap}
  .dg b{display:block;font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:700}
  .dg span{display:block;font-size:11px;color:var(--tenue);margin-top:1px}
  .up{color:var(--ok)} .dn{color:var(--mal)} .pd{color:var(--med)}
  .item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--linea);font-size:13.5px}
  .item small{display:block;font-size:11px;color:var(--tenue);margin-top:2px}
  .item .imp{font-family:"IBM Plex Mono",monospace;font-weight:700;white-space:nowrap}
  textarea{width:100%;border:1.5px solid var(--linea);border-radius:4px;padding:10px 11px;
    font:400 14.5px/1.5 inherit;color:var(--tinta);resize:vertical;min-height:64px;background:#fff}
  textarea:focus{outline:none;border-color:var(--tinta)}
  textarea.falta{border-color:var(--mal);background:#FEF7F8}
  .obl{font-size:11px;color:var(--mal);font-weight:700;margin:5px 0 0}

    padding:6px 12px;font:600 12px inherit;cursor:pointer}
  .chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .barra{position:sticky;bottom:0;background:var(--tinta);color:#fff;padding:13px 16px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    border-radius:5px;margin:16px}
  .barra p{margin:0;font-size:12.5px;color:#A7B2BE}
  button.env{background:#fff;color:var(--tinta);border:none;border-radius:3px;
    padding:11px 20px;font:800 14.5px inherit;cursor:pointer}
  button.env:disabled{opacity:.35}
  .nota{font-size:11.5px;color:var(--tenue);line-height:1.55;
    border-left:2px solid var(--linea);padding-left:11px;margin:14px 16px 0}
  .estado{padding:40px 16px;color:var(--tenue);font-size:14.5px}
  .listo{background:var(--ok);color:#fff;padding:22px 16px;border-radius:5px;margin:16px;
    text-align:center}
  .listo b{display:block;font-size:19px;font-weight:800;margin-bottom:5px}
</style></head><body>

<header>
  <h1>Cerrar la semana</h1>
  <p class="hs" id="hs">Leyendo…</p>
  <p style="margin:9px 0 0"><a id="salir" href="#" style="color:#A7B2BE;font-size:12.5px">← Dejarlo para luego</a></p>
</header>
<main id="app"><p class="estado">Leyendo…</p></main>
<div id="pie"></div>

<script src="/recuperacion_comun.js?v=20260929c"></script>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const P=new URLSearchParams(location.search);
const ARR=(s)=>String(s||"").toUpperCase().trim();
const num=(n)=>Number(n)||0;
const eur=(n)=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €";
const AGENTE=ARR(P.get("agente")||"");
// Identificador REAL que usa el CRM para el documento del plan semanal
// (plan_{usuario.id}_...). AGENTE es el código comercial (grupoAgente) y sirve
// para cruzar visitas/estrategias/PBI, pero NO es el mismo valor que usuario.id,
// así que escribir "cerrado" bajo AGENTE creaba un documento distinto del que
// el CRM comprueba, y la semana siguiente seguía apareciendo "sin cerrar".
// Si el enlace es antiguo y no trae uid, se cae a AGENTE como hacía antes.
const UID=(P.get("uid")||"").trim()||AGENTE;
if(window.RC) RC.NIVEL_UI="comercial";
const SEMANA=Number(P.get("semana")||0);
const VUELVE=P.get("vuelve")||"";
// Volver recargando el CRM entero tarda segundos (pesa varios MB). Con el
// historial del navegador se recupera de caché y es casi instantáneo.
window.volverCRM=function(ev){
  if(ev&&ev.preventDefault) ev.preventDefault();
  if(window.history.length>1) window.history.back();
  else if(VUELVE) window.location.href=VUELVE;
};

// Umbrales acordados: lo que lleva demasiado tiempo abierto. Con tope por
// bloque para que la primera semana no salgan trescientas cosas y se marque
// cualquiera por salir del paso.
// (sep 2026) Los topes eran 10/8/10: con 20+ decisiones el cierre se hace
// interminable y se abandona a medias. Se piden las 3 mas urgentes de cada
// cosa; el resto sigue vivo y sale la semana siguiente.
const REGLAS={ ofertas:{dias:5,tope:3}, estrategias:{dias:15,tope:3},
               muestras:{dias:30,tope:3} };

const R={};   // respuestas

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  return null;
}
// pbi_pedidos son LINEAS de pedido, decenas de miles. Leer la coleccion
// entera se corta por paginacion, asi que se pregunta solo por las suyas.
async function pedidosDe(ag){
  const t=[]; let tok=null,v=0;
  do{
    const body={ structuredQuery:{
      from:[{collectionId:"pbi_pedidos"}],
      where:{fieldFilter:{field:{fieldPath:"agente"},op:"EQUAL",
             value:{stringValue:ag}}},
      limit:5000 }};
    const r=await fetch(`${FB}:runQuery`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j){
      if(!d.document) continue;
      const o={_id:decodeURIComponent(d.document.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.document.fields||{})) o[k]=val(x);
      t.push(o);
    }
    break;                       // runQuery devuelve todo de una
  }while(v++<3);
  return t;
}

async function leer(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<40);
  return t;
}
// Lee UN documento suelto por su ruta completa (colección/id), no una colección
// entera. Devuelve null si no existe (404) o si no tiene campos, para que se
// pueda encadenar con || y probar rutas alternativas del mismo documento.
async function leerDoc(path){
  const r=await fetch(`${FB}/${path}`);
  if(!r.ok) return null;
  const d=await r.json();
  if(!d||!d.fields) return null;
  const o={_id:decodeURIComponent((d.name||"").split("/").pop())};
  for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
  return o;
}
function fecha(v){
  if(!v) return null;
  const s=String(v), a=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(a) return new Date(+a[1],+a[2]-1,+a[3]);
  const b=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if(b){ const y=b[3].length===2?2000+ +b[3]:+b[3]; return new Date(y,+b[2]-1,+b[1]); }
  return null;
}
const dias=(d)=>d?Math.floor((Date.now()-d)/86400000):null;

// Marcar "la doy por perdida" tiene que cerrarla de verdad: si la semana
// siguiente vuelve a salir, el comercial deja de fiarse del formulario.
const CIERRA={
  "La doy por perdida":"perdida", "La cierro como perdida":"ko",
  "La doy por cerrada":"completada",
};
window.marcar=(k,v,el)=>{
  R[k]=R[k]||{}; R[k].accion=v;
  R[k].cierra = CIERRA[v] || null;
  // (fix ago 2026) Los clientes de esta pantalla vienen de pbi_resumen (SAP),
  // así que la clave queda como "cliente:U4301468" — un código que no existe
  // en la colección "clientes" del CRM. Guardamos también el nombre para que
  // quien lea el informe después no tenga que adivinar de quién se trata.
  if(window.NOMBRES_CLAVE&&window.NOMBRES_CLAVE[k]) R[k].nom=window.NOMBRES_CLAVE[k];
  if(window.CRMID_CLAVE&&window.CRMID_CLAVE[k]) R[k].crmId=window.CRMID_CLAVE[k];
  [...el.parentNode.children].forEach(x=>x.classList.remove("on"));
  el.classList.add("on"); refrescar();
};
// (sep 2026) Responder a todas las lineas de un cliente de una vez: cinco
// muestras del mismo cliente con 95 dias suelen tener el mismo destino, y
// obligar a marcarlas una a una es lo que hace el cierre interminable.
window.marcarVarias=(claves,v,el)=>{
  (claves||[]).forEach(k=>{
    R[k]=R[k]||{}; R[k].accion=v; R[k].cierra=CIERRA[v]||null;
    if(window.NOMBRES_CLAVE&&window.NOMBRES_CLAVE[k]) R[k].nom=window.NOMBRES_CLAVE[k];
    if(window.CRMID_CLAVE&&window.CRMID_CLAVE[k]) R[k].crmId=window.CRMID_CLAVE[k];
  });
  // Se marca el boton del grupo y los de cada linea, para que se vea aplicado
  [...el.parentNode.children].forEach(x=>{
    if(x.classList&&x.classList.contains("chip")) x.classList.remove("on");
  });
  el.classList.add("on");
  let n=el.parentNode.nextElementSibling;
  while(n){
    if(n.classList&&n.classList.contains("acc")){
      [...n.children].forEach(b=>{
        if(!b.classList||!b.classList.contains("chip")) return;
        b.classList.toggle("on", b.textContent.trim()===v);
      });
    }
    // Parar al llegar a la cabecera del siguiente cliente
    if(n.classList&&n.classList.contains("item")
      &&n.getAttribute("style")&&n.getAttribute("style").indexOf("#F1F5F9")>=0) break;
    n=n.nextElementSibling;
  }
  refrescar();
};
window.texto=(k,el)=>{ R[k]=R[k]||{}; R[k].texto=el.value.trim();
  if(window.NOMBRES_CLAVE&&window.NOMBRES_CLAVE[k]) R[k].nom=window.NOMBRES_CLAVE[k];
  if(window.CRMID_CLAVE&&window.CRMID_CLAVE[k]) R[k].crmId=window.CRMID_CLAVE[k];
  el.classList.toggle("falta",false); refrescar(); };
// Diccionarios clave → nombre / id del CRM, rellenados al pintar cada bloque
window.NOMBRES_CLAVE={};
window.CRMID_CLAVE={};
// Todo lo que el sistema le PLANTEÓ, aunque no conteste. Sin esto, el
// responsable no puede saber qué le pidió el sistema y el comercial obvió.
window.PLANTEADOS=[];
function plantear(k,tipo,nom,desc){
  window.PLANTEADOS.push({k:k,tipo:tipo,nom:nom||"",desc:desc||""});
}

let PENDIENTES=[];

// ═══════════════════════════════════════════════════════════════════════
// (sep 2026) PLAN DE RECUPERACIÓN
// Cada cliente que cae tiene un caso con dueño, causa, plan, plazo y euros.
// No se cierra la semana sin diagnosticar los nuevos (8 por semana, los más
// grandes primero, y todos los de nivel CEO) ni sin contar el avance de los
// que ya tienen plan. Solo el CEO puede dar un caso por perdido.
// ═══════════════════════════════════════════════════════════════════════
window.CASOS=[];            // casos abiertos de este comercial
window.RECUP={};            // lo que responde en esta pantalla, por caso
window.CASOS_REQ=new Set(); // los que tiene que responder esta semana
window.CASOS_EDIT=new Set();// los que ha pedido cambiar de plan
const _escR=(s)=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
window.recProd=(id)=>{ const c=window.CASOS.find(x=>x._id===id); if(!c) return;
  const el=document.getElementById("arts_"+id); if(el) el.innerHTML=RC.htmlProductos(null,{cargando:true});
  RC.cargarProductos(c,true).then(p=>{ if(el) el.innerHTML=RC.htmlProductos(p,{max:8,perdido:c.perdido,reintentar:`recProd('${id}')`}); }); };
// El comercial pide una estrategia de precio sin salir del parte. Se crea
// al momento en el CRM (Estrategias) y le llega a su jefe por correo.
window.abrirPE=(id)=>{
  const c=casoDe(id), el=document.getElementById("pe_"+id); if(!el) return;
  const arts=(c.productos&&c.productos.caen)||[];
  el.innerHTML=RC.formEstrategia("pe"+id,arts,"💶 Pedir estrategia de precio",null,c)
    +`<div style="display:flex;gap:8px;margin-top:6px"><button class="chip on" style="background:#7C3AED;border-color:#7C3AED" onclick="enviarPE('${id}')">Enviar a mi jefe</button>
      <button class="chip" onclick="cerrarPE('${id}')">Cancelar</button></div>`;
  RC.activarForms();
};
const _linksPE=(id)=>`<a href="#" onclick="abrirOF('${id}');return false" style="font-size:12.5px;font-weight:700;color:#1D4ED8">📨 Enviar oferta</a>
  <a href="#" onclick="abrirALT('${id}');return false" style="font-size:12.5px;font-weight:700;color:#C2410C">🔄 Ofrecer alternativa</a>
  <a href="#" onclick="abrirPE('${id}');return false" style="font-size:12.5px;font-weight:700;color:#6D28D9">💶 Pedir estrategia de precio a tu jefe</a>`;
window.cerrarPE=(id)=>{ ["pe","of","alt"].forEach(k=>RC.olvidarForm(k+id)); const el=document.getElementById("pe_"+id); if(el) el.innerHTML=_linksPE(id); };
// Oferta al cliente desde el parte: queda en el CRM → Ofertas con su
// seguimiento. Si el descuento supera el límite del comercial, se convierte en
// petición de estrategia para su jefe, como en el formulario del CRM.
window.abrirOF=async(id)=>{
  const c=casoDe(id), el=document.getElementById("pe_"+id); if(!el) return;
  const arts=(c.productos&&c.productos.caen)||[];
  const lim=await RC.limitesDto();
  el.innerHTML=RC.formEstrategia("of"+id,arts,"📨 Oferta al cliente",{fondo:"#EFF6FF",borde:"#BFDBFE",fuerte:"#2563EB",titulo:"#1D4ED8"},c)
    +`<div style="font-size:12px;color:#475569;margin-top:6px">Puedes dar hasta un ${lim.agente} % de descuento sobre la tarifa de este cliente. Si pasas de ahí, se le pide a tu jefe como estrategia.</div>
    <div style="display:flex;gap:8px;margin-top:6px"><button class="chip on" style="background:#2563EB;border-color:#2563EB" onclick="enviarOF('${id}')">Registrar oferta</button>
      <button class="chip" onclick="cerrarPE('${id}')">Cancelar</button></div>`;
  RC.activarForms();
};
window.abrirALT=(id)=>{
  const c=casoDe(id), el=document.getElementById("pe_"+id); if(!el) return;
  const arts=(c.productos&&c.productos.caen)||[];
  el.innerHTML=`<select id="alt${id}_orig" style="width:100%;padding:9px;border:1.5px solid #FED7AA;border-radius:9px;font-size:14px;margin-top:6px">
      ${arts.map((a,i)=>`<option value="${i}">En lugar de: ${RC.esc(a.desc||a.art)}</option>`).join("")}<option value="">En lugar de: otro artículo</option></select>`
    +RC.formAlternativa("alt"+id,null,c)
    +`<div style="display:flex;gap:8px;margin-top:6px"><button class="chip on" style="background:#EA580C;border-color:#EA580C" onclick="enviarALT('${id}')">Registrar alternativa</button>
      <button class="chip" onclick="cerrarPE('${id}')">Cancelar</button></div>`;
  RC.activarForms();
};
window.enviarALT=async(id)=>{
  const c=casoDe(id), arts=(c.productos&&c.productos.caen)||[];
  const sel=(document.getElementById("alt"+id+"_orig")||{}).value;
  const o=sel!==""&&arts[Number(sel)]?arts[Number(sel)]:{art:"",desc:""};
  const alt=RC.leerAlternativa("alt"+id);
  if(!alt.desc){ alert("Busca y elige el producto alternativo en el catálogo."); return; }
  if(!(alt.precioActual>0)){ alert("Falta la tarifa: este artículo no tiene precio en el catálogo, ponla a mano."); return; }
  if(!(alt.precio>0)){ alert("Pon el precio."); return; }
  try{
    const doc=await RC.crearAlternativa(c,{art:o.art,desc:o.desc},alt,{id:UID,nombre:AGENTE,nivel:"comercial"});
    RC.olvidarForm("alt"+id);
    const el=document.getElementById("pe_"+id);
    if(doc._esEstrategia){
      alert(`Un ${doc.dto} % de descuento sobre tarifa supera tu límite del ${doc.tope} %. Se lo he pedido a tu jefe como estrategia.`);
      if(el) el.innerHTML=RC.htmlEstrategia(doc,"")+_linksPE(id);
      _nuevaEst(doc);
    } else if(el) el.innerHTML=RC.htmlOferta(doc)+_linksPE(id);
  }catch(x){ alert("No se ha podido registrar: "+x.message); }
};
window.enviarOF=async(id)=>{
  const c=casoDe(id), arts=(c.productos&&c.productos.caen)||[];
  const l=RC.leerFormEstrategia("of"+id,arts);
  if(!l.desc&&!l.art){ alert("Busca y elige el artículo en el catálogo."); return; }
  if(!(l.precioActual>0)){ alert("Falta la tarifa: este artículo no tiene precio en el catálogo, ponla a mano."); return; }
  if(!(l.precioOferta>0)){ alert("Pon el precio de la oferta."); return; }
  try{
    const r=await RC.crearOferta(c,l,l.nota,{id:UID,nombre:AGENTE,nivel:"comercial"});
    const el=document.getElementById("pe_"+id);
    if(r.tipo==="oferta"){
      R["recup:"+id]=Object.assign(R["recup:"+id]||{},{oferta:l.desc+" a "+l.precioOferta+" €"});
      if(el) el.innerHTML=RC.htmlOferta(r.doc)+_linksPE(id);
    } else {
      alert(`Un ${r.dto} % de descuento supera tu límite del ${r.tope} %. Se lo he pedido a tu jefe como estrategia.`);
      if(el) el.innerHTML=RC.htmlEstrategia(r.doc,"")+_linksPE(id);
      _nuevaEst(r.doc);
    }
  }catch(x){ alert("No se ha podido registrar: "+x.message); }
};
window.enviarPE=async(id)=>{
  const c=casoDe(id), arts=(c.productos&&c.productos.caen)||[];
  const l=RC.leerFormEstrategia("pe"+id,arts);
  if(!l.desc&&!l.art){ alert("Busca y elige el artículo en el catálogo."); return; }
  if(!(l.precioActual>0)){ alert("Falta la tarifa: este artículo no tiene precio en el catálogo, ponla a mano."); return; }
  if(!(l.precioOferta>0)){ alert("Pon el precio que pide el cliente."); return; }
  try{
    const e=await RC.crearEstrategia(c,l,l.nota,{id:UID,nombre:AGENTE,nivel:"comercial"});
    const el=document.getElementById("pe_"+id);
    if(el) el.innerHTML=RC.htmlEstrategia(e,"")+_linksPE(id);
    _nuevaEst(e);
  }catch(x){ alert("No se ha podido enviar: "+x.message); }
};
function recDe(id){ return (window.RECUP[id]=window.RECUP[id]||{}); }
function casoDe(id){ return window.CASOS.find(c=>c._id===id)||{}; }
window.recChip=(id,campo,v,el)=>{
  const r=recDe(id);
  r[campo]= r[campo]===v ? "" : v;          // pulsar otra vez lo desmarca
  [...el.parentNode.children].forEach(x=>x.classList&&x.classList.remove("on"));
  if(r[campo]) el.classList.add("on");
  if(campo==="accion"){
    const m=document.getElementById("mg_"+id);
    if(m) m.style.display=(r.accion==="Oferta de vuelta")?"block":"none";
  }
  if(campo==="archMotivo"){
    const w=document.getElementById("arw_"+id);
    if(w) w.style.display=r.archMotivo?"block":"none";
  }
  recAviso(id); refrescar();
};
window.recVal=(id,campo,el)=>{ recDe(id)[campo]=String(el.value||"").trim(); recAviso(id); refrescar(); };
window.recEditar=(id)=>{
  window.CASOS_EDIT.add(id);
  const c=casoDe(id), r=recDe(id);
  // Se parte del plan que ya tenía
  ["causa","causaNota","accion","accionNota","fechaObjetivo","eurosObjetivo","margenOferta"]

// Guarda en cada caso lo respondido. Devuelve cuántos fallan.
async function guardarRecuperacion(){
  const ahora=new Date().toISOString();
  let fallos=0;
  for(const c of window.CASOS){
    const r=window.RECUP[c._id]||{};
    if(!Object.values(r).some(v=>v)) continue;
    if(recFalta(c)) continue;             // a medias y de la cola: no se guarda
    const campos={actualizado:ahora};
    const hist=(c.historial||[]).filter(x=>!(x.sem===SEMANA&&x.por===AGENTE));
    const planNuevo=!RC.tienePlan(c)||window.CASOS_EDIT.has(c._id);
    if(planNuevo&&!r.archMotivo){
      const mg=r.accion==="Oferta de vuelta"?Number(String(r.margenOferta).replace(",",".")):null;
      Object.assign(campos,{causa:r.causa,causaNota:r.causaNota||"",accion:r.accion,
        accionNota:r.accionNota||"",fechaObjetivo:r.fechaObjetivo,eurosObjetivo:Number(r.eurosObjetivo)||0,
        margenOferta:mg,necesitaAprobacion:(mg!=null&&mg<RC.UMBRAL.margenMin)?"margen":"",
        margenAprobado:"",estado:"diagnosticado",diagnosticadoEn:c.diagnosticadoEn||ahora});
    }
    const ent={sem:SEMANA,fecha:ahora,por:AGENTE};
    if(r.archMotivo){
      Object.assign(campos,{estado:"propuesta_archivo",archivoMotivo:r.archMotivo,
        archivoNota:r.archNota||"",archivoPropuestoPor:AGENTE,archivoPropuestoEn:ahora,
        archivoDecision:"",archivoRespuesta:""});
      ent.sistema=`Pide archivarlo: ${r.archMotivo} · ${r.archNota||""}`;
    } else if(RC.tienePlan(c)){
      Object.assign(ent,{hecho:r.hecho,respuesta:r.respuesta||"",siguiente:r.siguiente||""});
      if(r.hecho&&r.hecho!=="No he podido"){ campos.ultimaAccion=ahora; campos.estado="en_accion"; }
    } else {
      ent.sistema=`Diagnóstico: ${r.causa} · plan: ${r.accion}`;
    }
    campos.historial=hist.concat([ent]);
    campos.ultimaSemana=SEMANA;
    // Para el informe y el correo del jefe
    R["recup:"+c._id]={nom:c.nombre,perdido:c.perdido,nivel:RC.nivelDe(c).nivel,
      causa:campos.causa||c.causa||"",accion:campos.accion||c.accion||"",
      margen:campos.margenOferta??c.margenOferta??null,
      fecha:campos.fechaObjetivo||c.fechaObjetivo||"",euros:campos.eurosObjetivo||c.eurosObjetivo||0,
      hecho:ent.hecho||"",respuesta:ent.respuesta||"",siguiente:ent.siguiente||"",
      archivo:r.archMotivo?(r.archMotivo+" · "+(r.archNota||"")):"",
      productos:(c.productos&&c.productos.caen||[]).slice(0,3)};
    try{ await RC.guardar(c._id,campos); }catch(e){ fallos++; }
  }
  return fallos;
}
// (sep 2026) Retrasos sin clasificar. Un retraso sin motivo es un dato muerto:
// nadie sabe si fue capacidad, produccion o cliente, asi que nadie puede
// corregirlo. Se clasifica a diario en Pedidos planificados, y aqui se
// comprueba: no se cierra la semana dejandolos en blanco.
let RETRASOS_SIN_MOTIVO=0;
async function comprobarRetrasos(){
  try{
    // (sep 2026) Solo se exige a quien gestiona pedidos: Customer Service,
    // Operaciones, Logistica y Produccion. Bloquear el cierre de un comercial
    // o de Calidad por un retraso de fabrica no tiene sentido.
    let meToca=false;
    try{
      const ru=await fetch(`${FB}/usuarios?pageSize=300`);
      if(ru.ok){
        const ju=await ru.json();
        const DE_PEDIDOS=["customer","operaciones","logistica","produccion"];
        (ju.documents||[]).forEach(d=>{
          const f=d.fields||{};
          const id=ARR(f.id?.stringValue||decodeURIComponent(d.name.split("/").pop()));
          const gr=ARR(f.grupoAgente?.stringValue||f.catalogoVendedor?.stringValue||"");
          if(id!==AGENTE&&gr!==AGENTE) return;
          const dep=String(f.departamentoId?.stringValue||"").toLowerCase();
          const tip=String(f.tipologia?.stringValue||"").toLowerCase();
          if(DE_PEDIDOS.includes(dep)||DE_PEDIDOS.includes(tip)) meToca=true;
          // Los responsables de esos departamentos tambien
          const resp=(f.responsableDe?.arrayValue?.values||[])
            .map(v=>String(v.stringValue||"").toLowerCase());
          if(resp.some(r=>DE_PEDIDOS.includes(r))) meToca=true;
        });
      }
    }catch(e){}
    if(!meToca){ RETRASOS_SIN_MOTIVO=0; refrescar(); return; }

    const iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${
      String(d.getDate()).padStart(2,"0")}`;
    const fechas=[];
    for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); fechas.push(iso(d)); }

    const crudos=await Promise.all(fechas.map(f=>
      fetch(`${FB}/pbi_pedidos_cambios/${f}`).then(r=>r.ok?r.json():null).catch(()=>null)));

    // Motivos ya puestos
    const puestos=new Set();
    try{
      const rm=await fetch(`${FB}/pbi_retrasos_motivo?pageSize=300&mask.fieldPaths=motivo`);
      if(rm.ok){
        const jm=await rm.json();
        (jm.documents||[]).forEach(d=>{
          if(d.fields?.motivo?.stringValue)
            puestos.add(decodeURIComponent(d.name.split("/").pop()));
        });
      }
    }catch(e){}

    const clave=(m)=>[m.pedido||"",m.articulo||m.descripcion||"",
      m.cliente||m.nombre||""].join("|").replace(/[\s\/]/g,"_").slice(0,180);

    // (sep 2026) Arranque limpio: solo se exige clasificar desde esta fecha.
    // Habia 95 retrasos anteriores sin motivo y bloquear el cierre por todos
    // ellos habria hecho que nadie cerrara la semana.
    const DESDE_RETRASOS="2026-09-08";
    const vistos=new Set();
    let sin=0;
    crudos.filter(Boolean).forEach(doc=>{
      const f=doc.fields||{};
      const fDoc=f.fecha?.stringValue||decodeURIComponent(doc.name.split("/").pop());
      if(fDoc<DESDE_RETRASOS) return;
      let movs=[]; try{ movs=JSON.parse(f.movimientos?.stringValue||"[]"); }catch(e){}
      // esMio() se define mas abajo y solo dentro de pintar(): aqui se
      // compara contra el agente de la URL, que es quien cierra.
      movs.filter(m=>m.tipo==="retraso"
        &&ARR(m.agente)===AGENTE
        &&Math.abs(m.dias||0)>=3).forEach(m=>{
        const k=clave(m);
        if(vistos.has(k)) return;
        vistos.add(k);
        if(!puestos.has(k)) sin++;
      });
    });
    RETRASOS_SIN_MOTIVO=sin;
    if(sin){
      const av=document.getElementById("avisoRetrasos");
      if(av){
        av.style.display="block";
        av.innerHTML=`<b>⚠️ ${sin} retraso${sin===1?"":"s"} sin motivo.</b>
          Clasifícalo${sin===1?"":"s"} en <a href="/pedidos.html" style="color:#92400E;
          font-weight:700">Pedidos planificados → Movimientos → Retrasos</a>
          antes de cerrar la semana.`;
      }
    }
    refrescar();
  }catch(e){}
}

function refrescar(){
  const faltan=PENDIENTES.filter(k=>{
    const r=R[k]||{};
    return !(r.accion||r.texto);
  });
  const b=document.getElementById("btn");
  if(!b) return;
  const RF=(typeof recFaltan==="function")?recFaltan():0;
  const EF=(typeof estResFaltan==="function")?estResFaltan():0;
  const KF=(typeof kpiFaltan==="function")?kpiFaltan():0;
  const total=faltan.length+RETRASOS_SIN_MOTIVO+RF+EF+KF;
  document.getElementById("cuenta").innerHTML = total
    ? (faltan.length
        ? `Faltan <b style="color:#fff">${faltan.length}</b> de ${PENDIENTES.length}`
        : "")
      +(RF?(faltan.length?" · ":"")+`<b style="color:#fff">${RF}</b> caso${RF===1?"":"s"} de recuperación`:"")
      +(EF?((faltan.length||RF)?" · ":"")+`<b style="color:#fff">${EF}</b> estrategia${EF===1?"":"s"} sin resultado`:"")
      +(KF?((faltan.length||RF||EF)?" · ":"")+`<b style="color:#fff">${KF}</b> plan${KF===1?"":"es"} (cobros, muestras o actividad)`:"")
      +(RETRASOS_SIN_MOTIVO
        ? (faltan.length?" · ":"")+`<b style="color:#fff">${RETRASOS_SIN_MOTIVO}</b> retraso${
            RETRASOS_SIN_MOTIVO===1?"":"s"} sin motivo`
        : "")
    : "Todo respondido";
  b.disabled=total>0;
}

async function avisarDelCierre(nCerradas, opts){
  opts=opts||{};
  const us=await (async()=>{

          :v.doubleValue!==undefined?v.doubleValue
          :v.booleanValue!==undefined?v.booleanValue:null;

  const _n=(x)=>String(x||"").toUpperCase().trim();

  // el director; el CEO solo si no hay nadie mas.

    us.forEach(u=>{

  }
  if(!destinos.size){
    us.forEach(u=>{ if(String(u.rol||"").toLowerCase()==="ceo") destinos.add(u._id); });

  }

  // (sep 2026) Aunque no haya a quien avisar, el html se guarda en el informe

  const esc=(t)=>String(t||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
  const R2=R||{};
  // (sep 2026) No todas las respuestas guardan el nombre del cliente: salian
  // ids tipo "est_1780415207180". Se resuelven contra las fichas ya leidas.
  const _NOM={};
  try{
    const D2=window._CIERRE_DATOS||{};
    [...(D2.of||[]),...(D2.mu||[]),...(D2.es||[])].forEach(o=>{
      const n=o.clienteNombre||o.cliente||o.nombre;

  const nomDe=(k,v)=>{

async function enviar(){
  const b=document.getElementById("btn"); b.disabled=true; b.textContent="Guardando…";
  const doc={
    id:`informe_${AGENTE}_s${SEMANA}`, agente:AGENTE, semana:SEMANA,
    // El portal comprueba con esto si ya ha cerrado (candado del sabado)
    uid:UID||"",
    ano:new Date().getFullYear(), estado:"enviado",
    fechaEnvio:new Date().toISOString(),
    // Solo lo que el comercial aporta. Las cifras NO se guardan aquí: se
    // leen del CRM cuando se necesiten, y así nunca hay dos versiones.
    respuestas: JSON.stringify(R),
    // Lo planteado permite al responsable ver qué se le pidió y no contestó
    planteados: JSON.stringify(window.PLANTEADOS||[]),
    origen:"cierre_v2",
  };
  const f={};
  for(const [k,v] of Object.entries(doc))
    f[k]= typeof v==="number" ? {doubleValue:v} : {stringValue:String(v)};
  // Primero se cierran los documentos marcados. Si algo falla se avisa y no
  // se cierra la semana: mejor repetir que dar por cerrado lo que sigue abierto.
  const cerrar=[];
  for(const [k,v] of Object.entries(R)){
    if(!v.cierra) continue;
    const [col,id]=k.split(/:(.+)/);
    if(!col||!id||col==="cliente") continue;
    cerrar.push({col,id,estado:v.cierra});
  }
  let fallos=0;
  for(const c of cerrar){
    try{
      const r=await fetch(`${FB}/${c.col}/${encodeURIComponent(c.id)}`
        +`?updateMask.fieldPaths=estado&updateMask.fieldPaths=cerradoEn`
        +`&updateMask.fieldPaths=cerradoPor`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          estado:{stringValue:c.estado},
          cerradoEn:{stringValue:new Date().toISOString()},
          cerradoPor:{stringValue:"cierre_semanal_s"+SEMANA}}})});
      if(!r.ok) throw new Error("HTTP "+r.status);
    }catch(e){ fallos++; }
  }
  if(fallos){
    b.disabled=false; b.textContent="Reintentar";
    alert(fallos+" no se han podido cerrar. No se ha cerrado la semana.");
    return;
  }
  doc.cerrados = cerrar.length;

  // Plan de recuperación: se guarda antes que el informe. Si falla, no se cierra.
  const fR=await guardarRecuperacion();
  if(fR){
    b.disabled=false; b.textContent="Reintentar";
    alert(fR+" caso(s) de recuperación no se han podido guardar. No se ha cerrado la semana.");
    return;
  }
  const fE=await guardarEstRes();
  if(fE){
    b.disabled=false; b.textContent="Reintentar";
    alert(fE+" estrategia(s) no se han podido guardar. No se ha cerrado la semana.");
    return;
  }
  doc.respuestas=JSON.stringify(R);
  f.respuestas={stringValue:doc.respuestas};
  window._KPIS=kpisParaGuardar();
  doc.kpis=JSON.stringify(window._KPIS);
  f.kpis={stringValue:doc.kpis};
  doc.casosRecuperacion=window.CASOS.length;
  f.casosRecuperacion={doubleValue:window.CASOS.length};

  // Las fusiones se ANOTAN; las aplica la sincronizacion, que es donde vive esa
  // logica. Dos sitios fusionando es como se rompen los datos.
  for(const [k,v] of Object.entries(R)){
    if(!k.startsWith("dup:")||!v.accion) continue;
    const id=k.slice(4);
    const d=(typeof DUPS!=="undefined"?DUPS:[]).find(x=>x.id===id);
    if(!d) continue;
    const estado = /Es el mismo/i.test(v.accion) ? "confirmada"
                 : /Son distintos/i.test(v.accion) ? "descartada" : "aplazada";
    try{
      await fetch(`${FB}/fusiones_propuestas/${encodeURIComponent(id)}`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          crmId:{stringValue:id}, pbiCodigo:{stringValue:d.pbiCod},
          nombre:{stringValue:d.nom}, estado:{stringValue:estado},
          agente:{stringValue:AGENTE}, semana:{doubleValue:SEMANA},
          // "No lo sé" no vuelve a preguntar en cuatro semanas
          noPreguntarHasta:{stringValue: estado==="aplazada"
            ? new Date(Date.now()+28*86400000).toISOString() : ""},
          decididoEl:{stringValue:new Date().toISOString()},
        }})});
    }catch(e){}
  }

  try{
    const r=await fetch(`${FB}/informes/${encodeURIComponent(doc.id)}`,{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:f})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    // Marcar el plan como cerrado: es lo que desbloquea la semana siguiente
    // en el CRM. Sin esto el comercial rellena el cierre y sigue bloqueado.
    // IMPORTANTE: el CRM guarda y comprueba el plan como "plan_{usuario.id}_...",
    // no como "plan_{código comercial}_...". Hay que escribir en el mismo
    // documento que el CRM lee, si no, el cierre queda invisible para el CRM.
    try{
      const anio=new Date().getFullYear();
      await fetch(`${FB}/planes_semanales/plan_${UID}_${anio}_s${SEMANA}`
        +`?updateMask.fieldPaths=estado&updateMask.fieldPaths=fechaCierre`,{

    try{ await avisarDelCierre(cerrar.length); }catch(e){}

       ${VUELVE?`<div style="padding:0 16px"><button class="env"
         style="width:100%;background:var(--tinta);color:#fff"

(async()=>{

  if(_sv) setTimeout(()=>_svErr("tiempo agotado"),40000);

  try{

    const yo=res.find(a=>ARR(a._id)===AGENTE);

      `<p class="estado">No encuentro a ${AGENTE} en el resumen.</p>`; _svErr("no está en el resumen de ventas"); return; }

    // Meses por cliente, para el aviso temprano
    const mes={};
    for(const d of mesesRaw){ try{ for(const f of JSON.parse(d.datos||"[]")) mes[f[0]]=f; }catch(e){} }
    const ultimo=new Date().getMonth();

    // Las muestras, ofertas y estrategias se guardan con el PERFIL del CRM

    const MIOS=new Set([AGENTE]);

    perf.forEach(x=>{ if(ARR(x.agente)===AGENTE) MIOS.add(ARR(x._id)); });
    [...portal,...usus].forEach(f=>{
      if(ARR(f.grupoAgente||f.catalogoVendedor)!==AGENTE) return;

    const esMio=(o)=>MIOS.has(ARR(o.agente||o.autor||o.comercial));

    const mios=cli.filter(c=>{
      const ok=c.cuenta!==undefined?c.cuenta:(!c.intercompany&&!c.fusionadoEn);
      return ok && ARR(c.agenteFinal||c.agente)===AGENTE;

    // Plan de recuperación: abre y actualiza sus casos (todos menos Francia)
    const EN_CASO=new Set();
    if(P.get("solover")!=="1"&&window.RC&&!RC.esFrancia(yo.equipo)){
      try{
        const ids=new Set(mios.map(c=>RC.idDe(c._id)));

        const todos=await RC.sincronizar(AGENTE,yo.equipo||"",mios,mes,previos,{por:AGENTE});
        const ab=todos.filter(RC.abierto);
        ab.forEach(c=>EN_CASO.add(ARR(c.cliente)));
        // Primero lo que exige respuesta: los que ya tienen plan (avance), los

        ab.sort((a,b)=>RC.num(b.nivel)-RC.num(a.nivel)||RC.num(b.perdido)-RC.num(a.perdido));
        let nuevos=0;
        ab.forEach(c=>{
          if(c.estado==="propuesta_archivo") return;
          if(RC.tienePlan(c)||RC.nivelDe(c).nivel>=3) window.CASOS_REQ.add(c._id);
          else if(nuevos<RC.UMBRAL.nuevosPorSemana){ window.CASOS_REQ.add(c._id); nuevos++; }

        // Los que exigen respuesta, arriba

        window.CASOS=ab;
      }catch(e){ console.warn("recuperación",e); }
    }
    if(P.get("solover")!=="1"&&window.RC){ try{ await cargarEstRes(); }catch(e){ console.warn("estrategias",e); } }

    // 2 · Los que dan señales de bajada, con la misma regla del parte
    // (sep 2026) El cierre recalculaba desde cero cada viernes: un cliente
    // sobre el que ya dijiste "Le visito" volvia a salir la semana siguiente,
    // y la otra, hasta que hubiera visita registrada. Se recuerda lo
    // respondido en las 3 ultimas semanas para no repreguntar lo mismo.
    const YA_DICHO={};
    try{
      for(let sp=SEMANA-1; sp>=SEMANA-3 && sp>0; sp--){
        const rp=await fetch(`${FB}/informes/informe_${encodeURIComponent(AGENTE)}_s${sp}`);
        if(!rp.ok) continue;
        const jp=await rp.json();
        let R2={};
        try{ R2=JSON.parse(jp.fields?.respuestas?.stringValue||"{}"); }catch(e){}
        for(const [k,v] of Object.entries(R2)){
          if(!k.startsWith("cliente:")||!v||!v.accion) continue;
          // Se guarda la mas reciente: sp va de mayor a menor
          if(!YA_DICHO[k]) YA_DICHO[k]={accion:v.accion, semana:sp, nom:v.nom||""};
        }
      }
    }catch(e){}

    // Nombre de empresa comparable: sin tildes, sin S.L./S.A. y sin puntuacion
    const NN=(x)=>String(x||"").toUpperCase().normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/\b(S\.?L\.?U?|S\.?A\.?U?|S\.?R\.?L|SCL|LDA|SARL|SAS|GMBH|CB|SAT|COOP|SOC|SPA|DOO|OOD|BT|KG|CO)\b/g,"")
      .replace(/[^A-Z0-9]/g,"");

    const avisos=[];
    for(const c of mios){
      if(EN_CASO.has(ARR(c._id))) continue;   // ya está en el plan de recuperación
      const f=mes[ARR(c._id)]; if(!f) continue;
      const act=num(c.ventasAct), ant=num(c.ventasAntYTD);
      if(act<3000) continue;
      // Su venta se ha ido a otro codigo del mismo cliente: no se ha perdido
      if(c.traspaso && !(num(c.caida)<0)) continue;
      if(ant && act < ant*0.92) continue;        // ya cae en el año: se ve aparte
      // (sep 2026) Esto mide FACTURACION, no envios: entre que se manda la
      // mercancia y se factura pasan semanas. El mes recien cerrado todavia
      // no refleja lo servido a final de mes, asi que se descarta: sin esto
      // salian avisos de clientes a los que se acababa de mandar tripa.
      const hastaMes=Math.max(ultimo-1,0);
      const m=[]; for(let i=1;i<=hastaMes;i++) m.push(num(f[i]));
      if(m.length<4) continue;      // sin cuatro meses no hay patron que juzgar
      const rec=m.slice(-2), pre=m.slice(0,-2).filter(x=>x>0);
      if(pre.length<2) continue;
      const ritmo=pre.reduce((a,b)=>a+b,0)/pre.length;
      if(ritmo<400) continue;
      const ahora=rec.reduce((a,b)=>a+b,0)/2;
      const caida=(ahora-ritmo)/ritmo*100;
      let seco=0; for(let i=m.length-1;i>=0&&m[i]===0;i--) seco++;

      // Si hay actividad reciente, no esta perdido: una visita, un pedido o
      // una muestra de las ultimas semanas desmiente la caida.
      const _cl=ARR(c._id), _cn=NN(c.nombre);
      const hayContacto=(vis||[]).some(v=>{
        if(!esMio(v)) return false;
        const d=dias(fecha(v.fecha));
        if(d==null||d>45) return false;
        return ARR(v.clienteId)===_cl||NN(v.clienteNombre||v.cliente)===_cn;
      })||(mu||[]).some(x=>{
        const d=dias(fecha(x.fecha||x.fechaCreacion));
        if(d==null||d>45) return false;
        return ARR(x.clienteId)===_cl||NN(x.clienteNombre||x.cliente)===_cn;
      });
      if(hayContacto) continue;
      let motivo=null, grav=0;
      if(seco>=2){ motivo=`lleva ${seco} meses sin comprar · venía de ${eur(ritmo)} al mes`;
        grav=ritmo*seco; }
      else if(caida<=-45){ motivo=`compraba ${eur(ritmo)} al mes y ahora ${eur(ahora)}, `
        +`un ${Math.round(-caida)} % menos`; grav=(ritmo-ahora)*2; }
      if(motivo){
        const yaD=YA_DICHO["cliente:"+c._id];
        // Si ya se dijo que se iba a hacer algo y sigue igual, no se
        // repregunta: se recuerda lo prometido y se pide el resultado.
        avisos.push({id:c._id,nom:c.nombre||c._id,motivo,grav,
          yaDicho:yaD?yaD.accion:null, yaSem:yaD?yaD.semana:null,
        // Guardamos el nombre normalizado para poder emparejarlo luego con la
        // ficha del CRM: el id de aquí es el código SAP y no vale para eso.
        _k:String(c.nombre||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
             .replace(/\b(S\.?L\.?U?|S\.?A\.?U?|SCL|LDA|SARL|SAS|GMBH|SRL|CB|SAT|COOP|SOC|UNIPESSOAL)\b/g,"")
             .replace(/[^A-Z0-9]/g,"")});
      }
    }
    avisos.sort((a,b)=>b.grav-a.grav);
    // (sep 2026) Un cliente salia en "indicios de bajada" y otra vez en sus

    // manda (es lo grave), y sus pendientes se quedan fuera del otro bloque.
    const av=avisos.slice(0,5);
    const _nn=(x)=>String(x||"").toUpperCase().normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/\b(S\.?L\.?U?|S\.?A\.?U?|S\.?R\.?L|SCL|LDA|SARL|SAS|GMBH|CB|SAT|COOP|SOC|SPA|DOO|OOD|BT|KG|CO)\b/g,"")
      .replace(/[^A-Z0-9]/g,"");
    const YA_EN_AVISOS=new Set(av.map(a=>_nn(a.nom)).filter(Boolean));

    // 3 · Lo que se está enfriando
    function abiertas(lista,tipo,cerrados){
      const g=REGLAS[tipo];
      return lista.filter(o=>{
        if(!esMio(o)) return false;
        const e=String(o.estado||"").toLowerCase();
        if(cerrados.includes(e)) return false;

        const d=dias(fecha(o.fecha||o.fechaCreacion));
        return d!=null && d>g.dias;
      }).map(o=>({id:o._id, cli:o.clienteNombre||o.cliente||"(sin cliente)",
        d:dias(fecha(o.fecha||o.fechaCreacion)),
        // (sep 2026) Las muestras guardan el producto en "prod": buscando solo
        // "producto" salia vacio y el comercial veia cinco lineas identicas
        // del mismo cliente sin saber cual era cual.
        imp:num(o.importe||o.total),
        // (sep 2026) Las muestras NO guardan calibre ni metros: sus campos son
        // prod, tipo, uds, nota. "prod" es texto libre, asi que unas veces trae
        // el nombre ("Deshidratada M + 43") y otras el codigo ("Mx260.20r4").
        // Se enseña lo que haya, mas el tipo y las unidades, que si constan.
        // Desde sep 2026 las muestras del catalogo guardan nombre y codigo
        // aparte; las antiguas solo tienen "prod", que es texto libre.
        tit:o.prodNombre||o.descripcion||o.titulo||o.producto||o.prod||"",
        cod:o.prodCodigo||o.prod||o.articulo||"",
        cal:[o.prodFormato,o.prodCalibre?"⌀"+o.prodCalibre:"",
             o.prodMetros?o.prodMetros+" m":"",o.tipo].filter(Boolean).join(" · "),
        met:(o.uds?o.uds+" uds":""),
        nota:o.nota||"",

        .sort((a,b)=> tipo==="ofertas" ? b.imp-a.imp : b.d-a.d);

    const vOf=abiertas(of,"ofertas",["pedido","perdida","aceptada","rechazada"]);

    const bloque=(tit,l,tipo,opciones,pide)=>{

      const porCli={};
      v.forEach(o=>{ (porCli[o.cli]=porCli[o.cli]||[]).push(o); });

          const maxD=Math.max(...items.map(o=>o.d));
          const sumaImp=items.reduce((t,o)=>t+(o.imp||0),0);

          let h="";
          if(varios){
            // Cabecera del cliente, con la accion para todas a la vez
            h+=`<div class="item" style="background:#F1F5F9;border-radius:8px;
              padding:9px 11px;margin-top:10px">
              <div><b>${cli}</b><small>${items.length} ${
                tipo==="muestras"?"muestras":tipo==="ofertas"?"ofertas":"pendientes"

              <div class="imp ${maxD>60?"dn":"pd"}">${

            <div class="acc" style="margin-bottom:4px">
              <span style="font-size:11px;color:var(--tenue);align-self:center;
                margin-right:4px">Todas:</span>
              ${opciones.map(x=>
                `<button class="chip" onclick="marcarVarias(${
                  JSON.stringify(claves).replace(/"/g,"&quot;")},'${x}',this)"
                  >${x}</button>`).join("")}</div>`;
          }

          h+=items.map(o=>{
            const k=tipo+":"+o.id; PENDIENTES.push(k);
            // Codigo y descripcion juntos: el codigo identifica, la

            const prodTxt=[o.cod,o.tit&&o.tit!==o.cod?o.tit:""].filter(Boolean).join(" · ");
            const carac=[o.cal,o.met].filter(Boolean).join(" · ");
            const detalle=[prodTxt,carac,
              o.fch?o.fch.split("-").reverse().join("/"):""].filter(Boolean).join(" · ");
            plantear(k,tipo,o.cli,detalle+" · "+o.d+" días");
            return `<div class="item"${varios?' style="padding-left:14px"':""}>
              <div>${varios?(prodTxt||"(sin producto)"):o.cli}<small>${
                varios ? [carac,o.fch?o.fch.split("-").reverse().join("/"):""]
                          .filter(Boolean).join(" · ")+(carac||o.fch?" · ":"")+o.d+" días"
                       : detalle+(detalle?" · ":"")+o.d+" días"
              }</small></div>
              <div class="imp ${o.d>60?"dn":"pd"}">${o.imp?eur(o.imp):o.d+" d"}</div>
            </div>
            <div class="acc">${opciones.map(x=>
              `<button class="chip" onclick="marcar('${k}','${x}',this)">${x}</button>`).join("")}</div>
            ${pide?`<textarea placeholder="${pide}" oninput="texto('${k}',this)"></textarea>`:""}`;
          }).join("");
          return h;
        }).join("")}
        ${l.length>v.length?`<p class="sub" style="margin:6px 0 0">Y ${l.length-v.length} más
          para las próximas semanas.</p>`:""}`;
    };

    // El mes es donde todavia se puede actuar; el año solo dice si vas bien.
    const MESES=["enero","febrero","marzo","abril","mayo","junio","julio",
                 "agosto","septiembre","octubre","noviembre","diciembre"];
    const ANIO=new Date().getFullYear();
    // El mes es el de la SEMANA que se cierra, no el de hoy: la 31 acabó el
    // 2 de agosto pero es de julio. Se toma el jueves de esa semana, que es
    // el criterio ISO y evita que una semana a caballo baile de mes.
    function juevesDe(anio,sem){
      const e=new Date(anio,0,4);
      const l=new Date(e); l.setDate(e.getDate()-((e.getDay()||7)-1));
      const j=new Date(l); j.setDate(l.getDate()+(sem-1)*7+3);
      return j;

    for(let d=new Date().getDate(); d<=new Date(ANIO,mNum,0).getDate(); d++){

    const finMes=new Date(ANIO,mNum,0);
    const iniMes=new Date(ANIO,mNum-1,1);
    const misPed=peds;              // ya vienen filtradas por agente
    // (sep 2026) El informe no llevaba cifras arriba: se añaden las ventas del
    // mes, las de la semana y los pedidos introducidos, cada una contra su
    // objetivo. Vienen de pbi_resumen_agente y pbi_entrada_agente.
    let vSem=0, vSemAnt=0, pedSem=0, pedSemAnt=0, objSem=0;
    try{
      for(const cod of [...MIOS]){
        const rr=await fetch(`${FB}/pbi_resumen_agente/${encodeURIComponent(cod)}`,
          {cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
        if(rr&&rr.fields){
          const f={};
          for(const [k,v] of Object.entries(rr.fields))
            f[k]=v.doubleValue!==undefined?Number(v.doubleValue)
              :v.integerValue!==undefined?Number(v.integerValue)
              :v.stringValue;
          if(num(f.ventasSem)>vSem){ vSem=num(f.ventasSem); vSemAnt=num(f.ventasSemAnt); }
        }
        const re2=await fetch(`${FB}/pbi_entrada_agente/${encodeURIComponent(cod)}`,
          {cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
        if(re2&&re2.fields){
          const f={};
          for(const [k,v] of Object.entries(re2.fields))
            f[k]=v.doubleValue!==undefined?Number(v.doubleValue)
              :v.integerValue!==undefined?Number(v.integerValue)
              :v.stringValue;
          if(num(f.entradaSem)>pedSem){ pedSem=num(f.entradaSem); pedSemAnt=num(f.entradaSemAnt); }
        }
      }

      if(mObj) objSem=mObj/4.33;
      // (sep 2026) Semana ya pasada: pbi_resumen_agente solo guarda la semana
      // en curso (el lunes ya es la siguiente). Se usa la foto congelada de
      // esa semana en pbi_semanas, o ventasSemAnt si es la inmediatamente
      // anterior y no hay foto.
      const _hoy=new Date(), _t=new Date(Date.UTC(_hoy.getFullYear(),_hoy.getMonth(),_hoy.getDate()));
      const _dn=_t.getUTCDay()||7; _t.setUTCDate(_t.getUTCDate()+4-_dn);
      const _semHoy=Math.ceil((((_t-new Date(Date.UTC(_t.getUTCFullYear(),0,1)))/86400000)+1)/7);
      if(SEMANA&&SEMANA<_semHoy){
        let foto=null;
        try{
          // La foto se guarda como "2026-W40"
          const _anioF=new Date().getFullYear();
          const rf=await fetch(`${FB}/pbi_semanas/${_anioF}-W${String(SEMANA).padStart(2,"0")}`,{cache:"no-store"})
            .then(r=>r.ok?r:fetch(`${FB}/pbi_semanas/${_anioF}-W${SEMANA}`,{cache:"no-store"}));
          if(rf.ok){ const jf=await rf.json();
            foto=JSON.parse((jf.fields&&jf.fields.agentes&&jf.fields.agentes.stringValue)||"[]"); }
        }catch(e){}
        const mio=foto?foto.find(x=>MIOS.has(ARR(x.id))||MIOS.has(ARR(x.agente))):null;
        if(mio){ vSem=num(mio.ventasSem); vSemAnt=0; }
        else if(SEMANA===_semHoy-1){ vSem=vSemAnt; vSemAnt=0; }
        else { vSem=0; vSemAnt=0; }
      }
    }catch(e){}
    // (sep 2026) Politica de cobro: lo vencido no puede pasar del 5 % de lo
    // vendido en los dos ultimos meses cerrados. Enero mira nov-dic del año
    // anterior (mes_ es el año pasado en la estacionalidad).
    const v2m=[mNum-1,mNum-2].reduce((t,k)=>t+(k>=1?num(e["act_"+k]):num(e["mes_"+(k+12)])),0);
    window._CIERRE_POL={v2m, limite:v2m*0.05};
    window._CIERRE_CIFRAS={mAct,mObj,mAnt,vSem,vSemAnt,pedSem,pedSemAnt,objSem,
      mes:MESES[mNum-1]};

    let planif=0, planifMes=0;
    const refs=new Set();
    for(const x of misPed){
      if(x.intercompany) continue;
      const i=num(x.importe); if(!i) continue;
      planif+=i;
      const f=fecha(x.fecha);
      if(f && f>=iniMes && f<=finMes){ planifMes+=i; refs.add(x.pedido||x._id); }
    }
    const nPed=refs.size;         // pedidos, no lineas
    // ── Lo que prometió el lunes, y si se hizo ──────────────────────────
    // No se le pregunta: se comprueba. Si hay visita, si la oferta cambió, si
    // hubo pedido. Preguntar por algo que el sistema ya sabe es perder tiempo.
    const plan=await leerDoc(`planes_semanales/plan_${UID}_${ANIO}_s${SEMANA}`)
      || await leerDoc(`planes_semanales/plan_${AGENTE}_${ANIO}_s${SEMANA}`)
      || await leerDoc(`planes_semanales/plan_${AGENTE.toLowerCase()}_${ANIO}_s${SEMANA}`);
    window._CIERRE_DATOS={MIOS:MIOS, of:of, es:es, mu:mu, esMio:esMio, fecha:fecha, yo:yo};

    /* (sep 2026) Actividad de la semana contra su objetivo -----------------
       El informe decia cuanto habia facturado pero no cuanto se habia movido.
       Visitas y llamadas se distinguen por el campo "resultado" de la visita;
       el objetivo se fija por equipo y por mes en la Sala de Mandos, asi que
       aqui se reparte entre los comerciales del equipo y se pasa a semana. */
    try{
      const _lun=juevesDe(ANIO,SEMANA); _lun.setDate(_lun.getDate()-3);
      _lun.setHours(0,0,0,0);
      const _dom=new Date(_lun); _dom.setDate(_lun.getDate()+6);
      _dom.setHours(23,59,59,999);
      const _enSem=(f)=>{ const d=fecha(f); return d&&d>=_lun&&d<=_dom; };
      const _esLlam=(r)=>/llamada|no_contesta/i.test(String(r||""));

      let _vis=0,_lla=0;
      for(const v of vis){
        if(v.eliminada) continue;
        if(!MIOS.has(ARR(v.agente))) continue;
        // La visita guarda su semana; si falta se cae a la fecha
        const suya=(v.semana!=null&&v.semana!=="")
          ? Number(v.semana)===SEMANA
          : _enSem(v.fecha||v.fechaCreacion);
        if(!suya) continue;
        if(_esLlam(v.resultado||v.tipo)) _lla++; else _vis++;
      }
      let _mEnv=0,_mOk=0,_mKo=0,_mPend=0;
      for(const m of mu){
        if(m.eliminada||!esMio(m)) continue;
        if(_enSem(m.fecha||m.fechaCreacion)) _mEnv++;
        if(_enSem(m.fechaFeedback)
          &&/pedido|positiv|aceptada|proyecto/.test(String(m.estado||"").toLowerCase())) _mOk++;
        if(_enSem(m.fechaFeedback)&&/(^|_)ko|rechaz|negativ|no_interesa/.test(String(m.estado||"").toLowerCase())) _mKo++;
        // Enviadas hace más de 14 días y sin respuesta del cliente
        if(!m.fechaFeedback&&!/pedido|positiv|aceptada|proyecto|ko|rechaz|negativ|cerrad/.test(String(m.estado||"").toLowerCase())){
          const _f=fecha(m.fecha||m.fechaCreacion); if(_f&&(Date.now()-_f)>14*86400000) _mPend++; }
      }

      // Cuantos comerciales se reparten el objetivo del equipo
      const _eq=String((yo&&yo.equipo)||"").toUpperCase().trim();
      const _cods=new Set();
      [...usus,...portal].forEach(u=>{
        const rol=String(u.rol||"").toLowerCase();
        if(!/agente|crm_agente|comercial|vendedor/.test(rol)) return;
        if(u.activo===false) return;
        if(String(u.equipo||"").toUpperCase().trim()!==_eq) return;
        _cods.add(ARR(u.grupoAgente||u.catalogoVendedor||u.crmId||u._id));
      });
      const _n=Math.max(1,_cods.size);
      // (sep 2026) Objetivo por comercial y mes, fijado en Administracion ->
      // Objetivos para WIKUK, Key Account y Telefonicos. Si su equipo aun tiene
      // el objetivo antiguo (del equipo entero) se reparte entre sus cabezas.
      // Sus fichas (CRM y portal): basta con que una diga que es telefonico
      const _misFichas=[...usus,...portal].filter(u=>
        [u._id,u.id,u.crmId].map(ARR).includes(ARR(UID))
        ||[u.grupoAgente,u.catalogoVendedor,u.username].map(ARR).includes(AGENTE)
        ||MIOS.has(ARR(u._id))||MIOS.has(ARR(u.id)));
      const _tel=_misFichas.some(u=>String(u.perfilComercial||"").toLowerCase()==="telefonico");
      const _pp=(clave)=>objAct.find(o=>String(o.equipo||"").toUpperCase().trim()===clave
        &&(o.porPersona===true||o.porPersona==="true"));
      const _oP=(_tel&&_pp("TELEFONICO"))||_pp(_eq);
      const _o=_oP||objAct.find(o=>String(o.equipo||"").toUpperCase().trim()===_eq)
            ||objAct.find(o=>String(o.equipo||"").toLowerCase()==="todos")||{};
      const _obj=(k)=>{ const m=Number(_o[k])||0; if(!m) return 0;
        return _oP?Math.max(1,Math.round(m*7/30)):Math.max(0,Math.round(m*7/30/_n)); };

      window._CIERRE_ACT={vis:_vis,lla:_lla,mEnv:_mEnv,mOk:_mOk,mKo:_mKo,mPend:_mPend,
        objVis:_obj("visitas"), objLla:_obj("llamadas"),
        objMue:_obj("muestras"), objMueOk:_obj("muestrasOk"),
        equipo:_eq, reparto:_n, telefonico:_tel};
    }catch(e){ window._CIERRE_ACT=null; }
    // (sep 2026) Cobros vencidos, para pedir plan en el parte si se pasa
    try{
      let _v=0,_n=0;
      for(const cod of [...MIOS]){
        const rc=await fetch(`${FB}/cobros_comercial/${encodeURIComponent(cod)}`,{cache:"no-store"});
        if(!rc.ok) continue;
        const fz=(await rc.json()).fields||{};
        const g=(k)=>Number(fz[k]?(fz[k].doubleValue??fz[k].integerValue??fz[k].stringValue):0)||0;
        const vv=g("totalVencido")||g("venc");
        if(vv>_v){ _v=vv; _n=g("nFacturasVencidas")||g("nFacV"); }
      }
      window._CIERRE_COB={venc:_v,nFac:_n};
    }catch(e){ window._CIERRE_COB=null; }

    let prometido=[];
    if(plan&&plan.acciones){
      let A={}; try{ A=JSON.parse(plan.acciones); }catch(e){}
      // Visitas de esta semana, por cliente
      const visSem={};
      for(const v of vis){
        if(!MIOS.has(ARR(v.agente))) continue;
        if(Number(v.semana)!==SEMANA) continue;
        const c=ARR(v.clienteId); if(!c) continue;
        (visSem[c]=visSem[c]||[]).push(v);
      }
      const porId={};
      [...of,...mu,...es].forEach(o=>{ porId[o._id]=o; });

      for(const [k,val0] of Object.entries(A)){
        if(!val0||(!val0.accion&&!val0.texto)) continue;
        if(k==="prioridad") continue;
        if(/Esta semana no/i.test(val0.accion||"")) continue;
        const [t,id]=k.split(/:(.+)/);
        let hecho=null, detalle="";
        if(t==="cliente"){
          const v=visSem[ARR(id)]||[];
          if(v.length){
            const conPedido=v.some(x=>/pedido/i.test(x.resultado||""));
            hecho=true;
            detalle=conPedido?`Visitado y con pedido`
              :`${v.length} contacto${v.length>1?"s":""} registrado${v.length>1?"s":""}`;
          } else { hecho=false; detalle="Sin rastro de contacto esta semana"; }
        } else {
          const o=porId[id];
          if(!o){ hecho=true; detalle="Ya no está abierta"; }
          else {
            const e=String(o.estado||"").toLowerCase();
            const cerrada=/pedido|perdida|aceptada|rechazada|completada|ko|cerrada|positivo/.test(e);
            hecho=cerrada;
            detalle=cerrada?`Cerrada como ${e}`:"Sigue igual que el lunes";
          }
        }
        prometido.push({k, t, id, accion:val0.accion||"", dijo:val0.texto||"",
          hecho, detalle,
          nom:(t==="cliente"
            ? (cli.find(c=>ARR(c._id)===ARR(id))||{}).nombre
            : (porId[id]||{}).clienteNombre) || id});
      }
      // Lo no hecho primero: es de lo que hay que hablar
      // Lo hecho primero: un comercial que cumplio 8 de 10 debe empezar
      // viendo eso, no la lista de lo que le falta.
      prometido.sort((a,b)=>(a.hecho===b.hecho)?0:a.hecho?-1:1);
    }

    // ── Posibles duplicados suyos ───────────────────────────────────────
    // 139 fichas creadas a mano coinciden con clientes de Power BI. Repartidos
    // entre 54 comerciales salen dos o tres cada uno: quien estuvo alli es el
    // unico que puede confirmarlo.
    const norm=(x)=>String(x||"").toUpperCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/\b(S\.?L\.?U?|S\.?A\.?U?|SCL|LDA|SARL|SAS|GMBH|SRL|CB|SAT|COOP|SOC|UNIPESSOAL)\b/g,"")
      .replace(/[^A-Z0-9]/g,"");
    let duplicados=[];
    try{
      const fichas=await leer("clientes");
      // (fix ago 2026) Puente SAP ↔ CRM. Los avisos de bajada traen el código
      // SAP (U4301468), pero cualquier oferta/visita que se cree después usará
      // el id de la ficha del CRM. Sin este cruce, el compromiso y la acción
      // que lo cumple nunca se reconocerían entre sí. Se emparejan por nombre
      // normalizado, que es lo único que ambos sistemas comparten.
      const fichaPorNom={};
      for(const f of fichas){
        const k=norm(f.NOMBRE||f.nombre); if(!k||k.length<5) continue;
        if(!fichaPorNom[k]) fichaPorNom[k]=f;
      }
      av.forEach(a=>{
        const f=a._k?fichaPorNom[a._k]:null;
        if(f) a.crmId=f._id||f.id||"";
      });
      const porNom={};
      for(const p of cli){
        if(p.fusionadoEn) continue;
        const k=norm(p.nombre); if(!k||k.length<5) continue;
        (porNom[k]=porNom[k]||[]).push(p);
      }
      const yaVisto=new Set();
      for(const f of fichas){
        const id=ARR(f._id);
        if(!/^(CLI_|TMP_)/i.test(id)) continue;
        // Solo los suyos
        const suyo = MIOS.has(ARR(f.GRUPOAGENTE||f.grupoAgente||f.agente));
        if(!suyo) continue;
        const k=norm(f.NOMBRE||f.nombre); if(!k) continue;
        const cand=porNom[k]; if(!cand) continue;
        const pobF=norm(f.POBLACION||f.poblacion);
        for(const p of cand){
          if(yaVisto.has(id)) break;
          const pobP=norm(p.poblacion);
          const cert = !pobF ? "sinDato" : pobF===pobP ? "seguro" : "dudoso";
          yaVisto.add(id);
          duplicados.push({ id, cert,
            nom:f.NOMBRE||f.nombre||id, pob:f.POBLACION||f.poblacion||"",
            pbiCod:p._id, pbiNom:p.nombre, pbiPob:p.poblacion||"",
            venta:num(p.ventasAct)||num(p.ventasAntFull) });
        }
      }
      // Los mas claros primero y como mucho cuatro: no es una tarea de limpieza
      const orden={seguro:0,sinDato:1,dudoso:2};
      duplicados.sort((a,b)=>(orden[a.cert]-orden[b.cert])||(b.venta-a.venta));
      duplicados=duplicados.slice(0,4);
      window.DUPS=duplicados;
    }catch(e){}

    const act=num(yo.ventasAct), ant=num(yo.ventasAntYTD);
    PENDIENTES.push("semana"); PENDIENTES.push("prioridad");

    document.getElementById("hs").textContent=
      `${yo.agente||AGENTE} · ${yo.equipo||""} · semana ${SEMANA} · ${MESES[mNum-1]}`;
    document.getElementById("app").innerHTML=`
      ${prometido.length?`<div class="paso" style="background:#FFFBEB;border-color:#F59E0B">
        <p class="tit"><span class="num" style="background:#92400E">✓</span>Lo que dijiste el lunes</p>
        <p class="sub"><b>Hiciste ${prometido.filter(x=>x.hecho).length} de ${
          prometido.length}</b>${prometido.some(x=>/pedido/i.test(x.detalle))
            ?", y una acabó en pedido":""}.
          ${prometido.filter(x=>!x.hecho).length
            ? `Cuéntame qué pasó con ${prometido.filter(x=>!x.hecho).length===1
                ?"la que falta":"las "+prometido.filter(x=>!x.hecho).length+" que faltan"}.`
            : "Cuenta cómo fue."}</p>
        ${prometido.map(x=>{
          const k="promesa:"+x.k; PENDIENTES.push(k);
          plantear(k,"promesa",x.nom,(x.accion||"")+" · "+(x.detalle||""));
          return `<div class="item" style="display:block;padding:12px 0">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
              <div style="min-width:0"><b>${x.nom}</b>
                <small>${x.accion}${x.dijo?" · "+x.dijo:""}</small></div>
              <span class="imp ${x.hecho?"up":"pd"}" style="font-size:11px">
                ${x.hecho?"✓ HECHO":"PENDIENTE"}</span>
            </div>
            <p style="margin:6px 0 0;font-size:12.5px;color:var(--tenue)">${x.detalle}</p>
            <div class="acc">${(x.hecho
              ? ["Fue bien","Sin resultado","Sigo con ello"]
              : ["Lo hice, no lo registré","No pude","Ya no hace falta"])
              .map(o=>`<button class="chip" onclick="marcar('${k}','${o}',this)">${o}</button>`).join("")}</div>
            <textarea placeholder="${x.hecho?"¿Qué salió?":"¿Qué pasó?"}"
              oninput="texto('${k}',this)"></textarea>
          </div>`;
        }).join("")}
      </div>`:""}

      <div class="paso">
        <p class="tit"><span class="num">1</span>Cómo vas</p>
        <p class="sub">Sale del CRM. No hay que teclear nada.</p>
        <div class="dato"><div class="dg">
          <div><b>${eur(mAct)}</b><span>${MESES[mNum-1]} · vendido</span></div>
          <div><b class="${mObj&&mAct>=mObj?"up":"dn"}">${mObj?Math.round(mAct/mObj*100)+" %":"·"}</b>
            <span>de su objetivo${mObj?" · "+eur(mObj):""}</span></div>
          <div><b class="${mAct>=mAnt?"up":"dn"}">${mAnt?eur(mAnt):"·"}</b>
            <span>${MESES[mNum-1]} de ${ANIO-1}${mAnt?" · "+(mAct>=mAnt?"+":"")
              +((mAct-mAnt)/mAnt*100).toFixed(0)+" %":""}</span></div>
        </div></div>
        ${planifMes?`<div class="dato" style="border-left-color:var(--ok)">
          <div class="dg">
            <div><b class="up">${eur(planifMes)}</b>
              <span>ya planificado para ${MESES[mNum-1]} · ${nPed} pedidos</span></div>
            <div><b>${eur(mAct+planifMes)}</b>
              <span>vendido + planificado${mObj?" · "+Math.round((mAct+planifMes)/mObj*100)+" % del objetivo":""}</span></div>
          </div></div>`:""}
        ${esMesEnCurso&&diaHoy<=5?`<p class="sub" style="margin:-4px 0 12px">
          <b>${MESES[mNum-1].charAt(0).toUpperCase()+MESES[mNum-1].slice(1)} acaba
          de empezar</b>, así que estas cifras dicen poco todavía. Lo que cuenta
          esta semana es el año y lo que tienes abierto.</p>`
        : esMesEnCurso&&mObj&&mAct<mObj?`<p class="sub" style="margin:-4px 0 12px">
          Te faltan <b>${eur(Math.max(0,mObj-mAct-planifMes))}</b> para el objetivo
          del mes${planifMes?" contando lo ya planificado":""}.
          Quedan ${diasHabiles} días laborables.</p>`:""}

        <p class="rot" style="margin-top:4px">Y así va el año</p>
        <div class="dato"><div class="dg">
          <div><b>${eur(act)}</b><span>vendido</span></div>
          <div><b class="${act>=ant?"up":"dn"}">${ant?(act>=ant?"+":"")+((act-ant)/ant*100).toFixed(1)+" %":"·"}</b>
            <span>vs ${ANIO-1}</span></div>
          <div><b>${yo.margenPctAct?yo.margenPctAct.toFixed(1)+" %":"·"}</b>
            <span>margen · objetivo ${yo.objetivoMargen||"—"} %</span></div>
        </div></div>
        <textarea placeholder="¿Cómo vas a cerrar el mes? ¿Qué te está faltando?"
          oninput="texto('semana',this)"></textarea>
        <p class="obl">Obligatorio para cerrar</p>
      </div>

      ${bloqueKpis()}
      ${bloqueRecuperacion()}
      ${bloqueEstRes()}

      <div class="paso">
        <p class="tit"><span class="num">2</span>Clientes con indicios de bajada</p>
        <p class="sub">Todavía no caen en el año, pero han cambiado de comportamiento.
      Se mide sobre lo <b>facturado</b>, así que un envío reciente puede no
      aparecer todavía: si el dato no cuadra, dilo.
          Di qué vas a hacer con cada uno.</p>
        ${av.length? av.map(c=>{
          const k="cliente:"+c.id; PENDIENTES.push(k);
          window.NOMBRES_CLAVE[k]=c.nom;
          plantear(k,"cliente",c.nom,c.motivo);
          // El id equivalente en el CRM, para que una oferta o visita creada
          // después se reconozca como cumplimiento de este compromiso.
          if(c.crmId) window.CRMID_CLAVE[k]=c.crmId;
          // Si ya se comprometio a algo y el cliente sigue igual, no se
          // repregunta en frio: se le recuerda y se le pide el resultado.
          const rep=c.yaDicho
            ? `<div style="background:#FEF3C7;border-radius:8px;padding:8px 11px;
                margin:4px 0 6px;font-size:12.5px;color:#92400E">
                Ya dijiste <b>"${c.yaDicho}"</b> en la semana ${c.yaSem}
                y sigue igual. ¿Qué ha pasado?</div>` : "";
          return `<div class="item">
            <div>${c.nom}<small>${c.motivo}</small></div>
            <div class="imp pd">${eur(c.grav)}</div></div>
          ${rep}
          <div class="acc">${(c.yaDicho
              ? ["Ya lo hice","Lo hago esta semana","No he podido","El dato está mal"]
              : ["Le visito","Le llamo","Le mando oferta","Ya lo sé, es normal",
                 "El dato está mal"])
            .map(x=>`<button class="chip" onclick="marcar('${k}','${x}',this)">${x}</button>`).join("")}</div>
          <textarea placeholder="${c.yaDicho
            ? "Qué pasó con lo que dijiste la semana pasada"
            : "Qué ha pasado y cuándo lo vas a hacer"}"
            oninput="texto('${k}',this)"></textarea>`;
        }).join("") : '<p class="sub" style="margin:0">Ninguno da señales por ahora.</p>'}
      </div>

      <div class="paso">
        <p class="tit"><span class="num">3</span>Lo que se está enfriando</p>
        <p class="sub">Cerrar o descartar, pero no dejar.
          <b>Lo que marques como perdido o cerrado se cierra en el CRM</b>, así
          que no volverá a salir la semana que viene.</p>
        ${bloque("Ofertas",vOf,"ofertas",["Insisto","La doy por perdida","Sigue viva"],
          "Si sigue viva, ¿qué falta para cerrarla?")}
        ${bloque("Estrategias",vEs,"estrategias",["Sigo con ella","La doy por cerrada","La replanteo"],"")}
        ${bloque("Muestras",vMu,"muestras",["Insisto","La cierro como perdida","Sigue viva"],"")}
      </div>

      ${duplicados.length?`<div class="paso">
        <p class="tit"><span class="num">+</span>¿Son el mismo cliente?</p>
        <p class="sub">Fichas que creaste tú en una visita y que ahora aparecen
          en facturación con su código real. Si lo confirmas, se juntan y no
          pierdes ninguna visita.</p>
        ${duplicados.map(d=>{
          const k="dup:"+d.id; PENDIENTES.push(k);
          return `<div class="item" style="display:block;padding:13px 0">
            <b style="font-size:14.5px">${d.nom}</b>
            ${d.cert==="dudoso"?'<span class="tag" style="background:#FFF8EC;color:var(--med)">población distinta</span>':""}
            <div class="dato" style="margin:8px 0 0">
              <div style="font-size:12.5px">La que creaste tú
                <b style="display:block;font-size:13.5px">${d.nom}${d.pob?" · "+d.pob:" · sin población"}</b></div>
              <div style="font-size:12.5px;margin-top:7px">En facturación
                <b style="display:block;font-size:13.5px">${d.pbiNom}${d.pbiPob?" · "+d.pbiPob:""}
                  <span style="font-weight:400;color:var(--tenue)"> · ${d.pbiCod}${
                    d.venta?" · "+eur(d.venta):""}</span></b></div>
            </div>
            <div class="acc">${["Es el mismo","Son distintos","No lo sé"]
              .map(o=>`<button class="chip" onclick="marcar('${k}','${o}',this)">${o}</button>`).join("")}</div>
          </div>`;
        }).join("")}
      </div>`:""}

      <div class="paso">
        <p class="tit"><span class="num">4</span>La semana que viene</p>
        <p class="sub">Una sola cosa. La que de verdad va a mover el mes.</p>
        <textarea placeholder="Mi prioridad de la semana ${SEMANA+1} es…"
          oninput="texto('prioridad',this)"></textarea>
      </div>

      <div id="avisoRetrasos" style="display:none;background:#FEF3C7;
        border:1.5px solid #FCD34D;border-radius:12px;padding:12px 14px;
        margin-top:14px;font-size:13px;color:#92400E;line-height:1.5"></div>`;

    // Los retrasos se clasifican en Pedidos planificados, pero es aqui donde
    // se comprueba: cerrar la semana con retrasos sin motivo dejaria el dato
    // muerto y nadie volveria a mirarlo.
    comprobarRetrasos();
    // Qué productos ha dejado de comprar cada cliente en caída
    if(window.CASOS.length) RC.cargarVarios(window.CASOS,(c,p)=>{
      const el=document.getElementById("arts_"+c._id);
      if(el) el.innerHTML=RC.htmlProductos(p,{max:8,perdido:c.perdido,reintentar:`recProd('${c._id}')`});
    });

    document.getElementById("pie").innerHTML=`
      <div class="barra"><p id="cuenta">—</p>
        <button class="env" id="btn" disabled onclick="enviar()">Cerrar semana</button></div>
      <p class="nota">El comercial no teclea ninguna cifra: todas salen del CRM.
        Solo aporta lo que el sistema no puede saber — el porqué y el qué voy a
        hacer. Se guarda en <b>informes/${AGENTE}_s${SEMANA}</b> atado a cada
        cliente y oferta, para poder preguntar por ello la semana que viene.</p>`;
    refrescar();

    // (sep 2026) Modo "solo ver" (?solover=1): el CRM abre esta pagina oculta
    // para rehacer el correo de un cierre ya entregado con la misma plantilla
    // y los mismos calculos. No envia nada; guarda el html en el informe y se
    // lo devuelve al CRM.
    if(P.get("solover")==="1"){
      const avisa=(o)=>{ try{ parent.postMessage(Object.assign({type:"CIERRE_HTML",agente:AGENTE,semana:SEMANA},o),"*"); }catch(e){} };
      try{
        const ri=await fetch(`${FB}/informes/${encodeURIComponent("informe_"+AGENTE+"_s"+SEMANA)}`,{cache:"no-store"});
        if(!ri.ok){ avisa({error:"sin informe"}); }
        else{
          const j=await ri.json(); let RR={};
          try{ RR=JSON.parse((j.fields&&j.fields.respuestas&&j.fields.respuestas.stringValue)||"{}"); }catch(e){}
          Object.keys(R).forEach(k=>delete R[k]); Object.assign(R,RR);
          const html=await avisarDelCierre(0,{soloHtml:true});
          avisa({html:html||""});
        }
      }catch(e){ avisa({error:e.message}); }
    }
  }catch(e){
    document.getElementById("app").innerHTML=`<p class="estado">No se ha podido montar: ${e.message}</p>`;
    if(P.get("solover")==="1") try{ parent.postMessage({type:"CIERRE_HTML",agente:AGENTE,semana:SEMANA,error:e.message},"*"); }catch(e2){}
  }
})();
</script></body></html>
