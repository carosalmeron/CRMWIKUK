  /* Árbol: un apartado por fila, numerado, se abre y cierra al pulsar */

  .prow .pt{flex:1;min-width:0}.prow .pt b{display:block;font-size:14px}.prow .pt small{display:block;font-size:12.5px;color:#475569;margin-top:1px}
  .prow .chev{color:#94A3B8;font-size:16px}
  .pcont{padding:2px 0 12px 38px}
  @media(max-width:520px){.pcont{padding-left:0}}
  .barras div{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
  .barras .bl{width:110px;flex-shrink:0}.barras .bb{flex:1;height:7px;border-radius:99px;background:#EEF1F5;overflow:hidden}

  .rvt{width:100%;padding:8px 10px;border-radius:9px;border:1.5px solid var(--linea);font:inherit;font-size:13.5px;background:#fff;margin-top:5px}

<div class="prueba" id="avisoPrueba" style="display:none">MODO PRUEBA · puedes rellenarlo todo, pero «Cerrar semana» no guarda nada</div>
<header>
  <h1>Cerrar la semana</h1>
  <p class="hs" id="hs">Leyendo…</p>
  <p style="margin:9px 0 0"><a id="salir" href="#" style="color:#A7B2BE;font-size:12.5px">← Dejarlo para luego</a></p>
</header>
<main id="app"><p class="estado">Leyendo…</p></main>
<div id="pie"></div>

<script src="/recuperacion_comun.js?v=20261004c"></script>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const P=new URLSearchParams(location.search);
const ARR=(s)=>String(s||"").toUpperCase().trim();
const num=(n)=>Number(n)||0;
const eur=(n)=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €";
const AGENTE=ARR(P.get("agente")||"");
// Identificador REAL que usa el CRM para el documento del plan semanal
// (plan_{usuario.id}_...). AGENTE es el código comercial (grupoAgente) y sirve
// para cruzar visitas/estrategias/PBI, pero NO es el mismo valor que usuario.id,
// así que escribir "cerrado" bajo AGENTE creaba un documento distinto del que
// el CRM comprueba, y la semana siguiente seguía apareciendo "sin cerrar".
// Si el enlace es antiguo y no trae uid, se cae a AGENTE como hacía antes.
const UID=(P.get("uid")||"").trim()||AGENTE;
if(window.RC) RC.NIVEL_UI="comercial";
const SEMANA=Number(P.get("semana")||0);
const VUELVE=P.get("vuelve")||"";
// Volver recargando el CRM entero tarda segundos (pesa varios MB). Con el
// historial del navegador se recupera de caché y es casi instantáneo.
window.volverCRM=function(ev){
  if(ev&&ev.preventDefault) ev.preventDefault();
  if(window.history.length>1) window.history.back();
  else if(VUELVE) window.location.href=VUELVE;
};

// Umbrales acordados: lo que lleva demasiado tiempo abierto. Con tope por
// bloque para que la primera semana no salgan trescientas cosas y se marque
// cualquiera por salir del paso.
// (sep 2026) Los topes eran 10/8/10: con 20+ decisiones el cierre se hace
// interminable y se abandona a medias. Se piden las 3 mas urgentes de cada
// cosa; el resto sigue vivo y sale la semana siguiente.
const REGLAS={ ofertas:{dias:5,tope:3}, estrategias:{dias:15,tope:3},
               muestras:{dias:30,tope:3} };

const R={};   // respuestas

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  return null;
}
// pbi_pedidos son LINEAS de pedido, decenas de miles. Leer la coleccion
// entera se corta por paginacion, asi que se pregunta solo por las suyas.
async function pedidosDe(ag){ return conCache("ped:"+ag,30,()=>pedidosFB(ag)); }
async function pedidosFB(ag){
  const t=[]; let tok=null,v=0;
  do{
    const body={ structuredQuery:{
      from:[{collectionId:"pbi_pedidos"}],
      where:{fieldFilter:{field:{fieldPath:"agente"},op:"EQUAL",
             value:{stringValue:ag}}},
      limit:5000 }};
    const r=await fetch(`${FB}:runQuery`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j){
      if(!d.document) continue;
      const o={_id:decodeURIComponent(d.document.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.document.fields||{})) o[k]=val(x);
      t.push(o);
    }
    break;                       // runQuery devuelve todo de una
  }while(v++<3);
  return t;
}

// (oct 2026) Caché local de lecturas. La primera vez se lee todo de Firebase;
// si se vuelve atrás y se entra otra vez (o se abre el comité del mismo
// comercial) se usa lo ya leído y la pantalla sale al momento. Las tablas del
// PBI cambian una vez al día (30 min de vida); lo que se toca a mano (muestras,
// ofertas, estrategias, visitas) solo 10 min y se borra al guardar algo nuestro.
const CACHE_VIDA={muestras:10,ofertas:10,estrategias:10,visitas:10};
const _cdb=(()=>{ let p=null; return ()=>p||(p=new Promise((ok,ko)=>{ try{
  const r=indexedDB.open("cierre_cache",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("t");
  r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }catch(e){ ko(e); } })); })();
async function cacheLee(k,min){ try{ const db=await _cdb();
  const o=await new Promise((ok,ko)=>{ const q=db.transaction("t").objectStore("t").get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ko(q.error); });
  return o&&Date.now()-o.t<min*60000?o.d:null; }catch(e){ return null; } }
async function cacheGuarda(k,d){ try{ const db=await _cdb();
  db.transaction("t","readwrite").objectStore("t").put({t:Date.now(),d},k); }catch(e){} }
window.cacheBorra=async(k)=>{ try{ const db=await _cdb(); const st=db.transaction("t","readwrite").objectStore("t");
  k?st.delete(k):st.clear(); }catch(e){} };
window.CACHE_USADA=0;
async function conCache(k,min,fn){
  if(!window._SIN_CACHE){ const c=await cacheLee(k,min); if(c){ window.CACHE_USADA++; return c; } }
  const d=await fn(); if(d&&d.length) cacheGuarda(k,d); return d; }
// Las tablas maestras que lee el módulo común (usuarios, clientes, departamentos)
// también se guardan; lo que se edita en las fichas (recuperación…) no.
const CACHE_RC=new Set(["usuarios","clientes","departamentos","portal_users"]);
if(window.RC&&!RC._conCache){ RC._conCache=1;
  const _l=RC.leer, _lp=RC.leerProfundo;
  RC.leer=(col,max)=>CACHE_RC.has(col)?conCache("rc:"+col+":"+(max||""),30,()=>_l(col,max)):_l(col,max);
  if(_lp) RC.leerProfundo=(col)=>CACHE_RC.has(col)?conCache("rcp:"+col,30,()=>_lp(col)):_lp(col); }
async function leer(col){ return conCache("col:"+col,CACHE_VIDA[col]||30,()=>leerFB(col)); }
async function leerFB(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<40);
  return t;
}
// Lee UN documento suelto por su ruta completa (colección/id), no una colección
// entera. Devuelve null si no existe (404) o si no tiene campos, para que se
// pueda encadenar con || y probar rutas alternativas del mismo documento.
async function leerDoc(path){
  const r=await fetch(`${FB}/${path}`);
  if(!r.ok) return null;
  const d=await r.json();
  if(!d||!d.fields) return null;
  const o={_id:decodeURIComponent((d.name||"").split("/").pop())};
  for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
  return o;
}
function fecha(v){
  if(!v) return null;
  const s=String(v), a=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(a) return new Date(+a[1],+a[2]-1,+a[3]);
  const b=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if(b){ const y=b[3].length===2?2000+ +b[3]:+b[3]; return new Date(y,+b[2]-1,+b[1]); }
  return null;
}
const dias=(d)=>d?Math.floor((Date.now()-d)/86400000):null;

// Marcar "la doy por perdida" tiene que cerrarla de verdad: si la semana
// siguiente vuelve a salir, el comercial deja de fiarse del formulario.
const CIERRA={
  "La doy por perdida":"perdida", "La cierro como perdida":"ko",
  "La doy por cerrada":"completada",
};
window.marcar=(k,v,el)=>{
  R[k]=R[k]||{}; R[k].accion=v;
  R[k].cierra = CIERRA[v] || null;
  // (fix ago 2026) Los clientes de esta pantalla vienen de pbi_resumen (SAP),
  // así que la clave queda como "cliente:U4301468" — un código que no existe
  // en la colección "clientes" del CRM. Guardamos también el nombre para que
  // quien lea el informe después no tenga que adivinar de quién se trata.
  if(window.NOMBRES_CLAVE&&window.NOMBRES_CLAVE[k]) R[k].nom=window.NOMBRES_CLAVE[k];
  if(window.CRMID_CLAVE&&window.CRMID_CLAVE[k]) R[k].crmId=window.CRMID_CLAVE[k];
  [...el.parentNode.children].forEach(x=>x.classList.remove("on"));
  el.classList.add("on"); refrescar();
};
// (sep 2026) Responder a todas las lineas de un cliente de una vez: cinco
// muestras del mismo cliente con 95 dias suelen tener el mismo destino, y
// obligar a marcarlas una a una es lo que hace el cierre interminable.
window.marcarVarias=(claves,v,el)=>{
  (claves||[]).forEach(k=>{
    R[k]=R[k]||{}; R[k].accion=v; R[k].cierra=CIERRA[v]||null;
    if(window.NOMBRES_CLAVE&&window.NOMBRES_CLAVE[k]) R[k].nom=window.NOMBRES_CLAVE[k];
    if(window.CRMID_CLAVE&&window.CRMID_CLAVE[k]) R[k].crmId=window.CRMID_CLAVE[k];
  });
  // Se marca el boton del grupo y los de cada linea, para que se vea aplicado
  [...el.parentNode.children].forEach(x=>{
    if(x.classList&&x.classList.contains("chip")) x.classList.remove("on");
  });
  el.classList.add("on");
  let n=el.parentNode.nextElementSibling;
  while(n){
    if(n.classList&&n.classList.contains("acc")){
      [...n.children].forEach(b=>{
        if(!b.classList||!b.classList.contains("chip")) return;
        b.classList.toggle("on", b.textContent.trim()===v);
      });
    }
    // Parar al llegar a la cabecera del siguiente cliente
    if(n.classList&&n.classList.contains("item")
      &&n.getAttribute("style")&&n.getAttribute("style").indexOf("#F1F5F9")>=0) break;
    n=n.nextElementSibling;
  }
  refrescar();
};
window.texto=(k,el)=>{ R[k]=R[k]||{}; R[k].texto=el.value.trim();
  if(window.NOMBRES_CLAVE&&window.NOMBRES_CLAVE[k]) R[k].nom=window.NOMBRES_CLAVE[k];
  if(window.CRMID_CLAVE&&window.CRMID_CLAVE[k]) R[k].crmId=window.CRMID_CLAVE[k];
  el.classList.toggle("falta",false); refrescar(); };
// Diccionarios clave → nombre / id del CRM, rellenados al pintar cada bloque
window.NOMBRES_CLAVE={};
window.CRMID_CLAVE={};
// Todo lo que el sistema le PLANTEÓ, aunque no conteste. Sin esto, el
// responsable no puede saber qué le pidió el sistema y el comercial obvió.
window.PLANTEADOS=[];
function plantear(k,tipo,nom,desc){
  window.PLANTEADOS.push({k:k,tipo:tipo,nom:nom||"",desc:desc||""});
}

let PENDIENTES=[];
// (oct 2026) Nota general sobre el cliente, en ofertas, estrategias y muestras.
// Opcional para el comercial; si la escribe, el comité la ve como un punto más y la valida.
const TIPO_NOTA={ofertas:"ofertas",estrategias:"estrategias",muestras:"muestras"};
function notaCliH(tipo,cli){
  const k="nota:"+tipo+":"+String(cli||"").normalize("NFD").replace(/[^\w]/g,"_").slice(0,60);
  const nom="📝 "+cli+" · nota sobre "+(TIPO_NOTA[tipo]||tipo);
  window.NOMBRES_CLAVE[k]=nom;
  if(!window.PLANTEADOS.some(x=>x.k===k)) plantear(k,"nota",nom,"Nota general del cliente");
  const v=(R[k]||{}).texto||"";
  return `<div class="notacli" data-nota="${k}" style="margin:6px 0 10px"><small style="display:block;font-size:11px;font-weight:800;color:#64748B;text-transform:uppercase;margin-bottom:3px">📝 Nota sobre el cliente</small>
    <textarea data-nota="${k}" style="min-height:44px;font-size:13px" placeholder="📝 Nota general sobre ${_escR(cli)} (opcional): cómo está el cliente, qué le pasa…" oninput="texto('${k}',this)">${_escR(v)}</textarea></div>`;
}

// ═══════════════════════════════════════════════════════════════════════
// (sep 2026) PLAN DE RECUPERACIÓN
// Cada cliente que cae tiene un caso con dueño, causa, plan, plazo y euros.
// No se cierra la semana sin diagnosticar los nuevos (8 por semana, los más
// grandes primero, y todos los de nivel CEO) ni sin contar el avance de los
// que ya tienen plan. Solo el CEO puede dar un caso por perdido.
// ═══════════════════════════════════════════════════════════════════════
window.CASOS=[];            // casos abiertos de este comercial
window.RECUP={};            // lo que responde en esta pantalla, por caso
window.CASOS_REQ=new Set(); // los que tiene que responder esta semana
window.CASOS_EDIT=new Set();// los que ha pedido cambiar de plan
const _escR=(s)=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
window.recProd=(id)=>{ const c=window.CASOS.find(x=>x._id===id); if(!c) return;
  const el=document.getElementById("arts_"+id); if(el) el.innerHTML=RC.htmlProductos(null,{cargando:true});
  RC.cargarProductos(c,true).then(p=>{ if(el) el.innerHTML=prodsAcc(c,p); }); };
// El comercial pide una estrategia de precio sin salir del parte. Se crea
// al momento en el CRM (Estrategias) y le llega a su jefe por correo.
// (oct 2026) Estrategias, ofertas y alternativas POR PRODUCTO: cada artículo que
// cae lleva sus propios botones y el formulario se abre debajo de ese artículo,
// ya con el artículo elegido. Si no hay artículos, quedan los enlaces generales.
window._ARTSEL={};
function caenDe(id){ const c=casoDe(id); return (c.productos&&c.productos.caen)||[]; }
function artsSel(id){ const L=caenDe(id), i=_ARTSEL[id]; return i!=null&&L[i]?[L[i]]:L; }
function peBox(id){ const i=_ARTSEL[id]; return document.getElementById(i!=null?"pe_"+id+"_"+i:"pe_"+id); }
function linksArt(id,i){ return `<button type="button" class="chip" style="padding:4px 9px;font-size:11.5px;color:#6D28D9;border-color:#DDD6FE" onclick="abrirPE('${id}',${i})">💶 Estrategia</button>
  <button type="button" class="chip" style="padding:4px 9px;font-size:11.5px;color:#1D4ED8;border-color:#BFDBFE" onclick="abrirOF('${id}',${i})">📨 Oferta</button>
  <button type="button" class="chip" style="padding:4px 9px;font-size:11.5px;color:#C2410C;border-color:#FED7AA" onclick="abrirALT('${id}',${i})">🔄 Alternativa</button>
  <button type="button" class="chip" style="padding:4px 9px;font-size:11.5px;color:#0369A1;border-color:#BAE6FD" onclick="abrirINC('${id}',${i})">🧩 Otro departamento</button>`; }
// (oct 2026) Implicar a otro departamento (Compras, Calidad, Logística…) como en Recuperación:
// sale como incidencia de pérdida de venta y su respuesta vuelve al hilo del cliente.
window.abrirINC=async(id,idx)=>{ selArt(id,idx);

// ¿Qué le falta a un caso para poder cerrar la semana? ("" si nada)
function recFalta(c){
  const r=recDe(c._id);
  if(c.estado==="propuesta_archivo") return "";
  if(r.archMotivo) return (r.archNota||"").length>=10 ? "" : "explica por qué archivarlo";
  const conPlan=RC.tienePlan(c)&&!window.CASOS_EDIT.has(c._id);
  if(!conPlan){
    const causa=r.causa||"", acc=r.accion||"";
    if(!causa) return "falta la causa";
    if(!acc) return "falta la acción";
    if(acc==="Oferta de vuelta"&&(r.margenOferta===undefined||r.margenOferta===""||isNaN(Number(String(r.margenOferta).replace(",","."))))) return "falta el margen de la oferta";
    if(!r.fechaObjetivo) return "falta la fecha";
    if(!(Number(r.eurosObjetivo)>0)) return "faltan los euros a recuperar";
  }
  // Si ya tenía plan (de otra semana), se cuenta el avance
  if(RC.tienePlan(c)){
    if(!r.hecho) return "falta qué hiciste";
    if((r.respuesta||"").length<5) return "falta qué dijo el cliente";
    if((r.siguiente||"").length<5) return "falta qué harás";
  }
  return "";
}
function recFaltan(){
  let n=0;
  window.CASOS.forEach(c=>{
    const req=window.CASOS_REQ.has(c._id);
    const r=window.RECUP[c._id]||{};
    const tocado=Object.values(r).some(v=>v);
    const f=recFalta(c);
    // Los de la cola no obligan, pero si los empieza tiene que acabarlos
    if(f&&(req||tocado)) n++;
    const el=document.getElementById("rf_"+c._id);
    if(el) el.textContent=(req||tocado)&&f?"⚠️ "+f:"";
  });
  return n;
}

async function guardarRecuperacion(){

    const planNuevo=!RC.tienePlan(c)||window.CASOS_EDIT.has(c._id);

      margen:campos.margenOferta??c.margenOferta??null,

      archivo:r.archMotivo?(r.archMotivo+" · "+(r.archNota||"")):"",

// (sep 2026) Retrasos sin clasificar. Un retraso sin motivo es un dato muerto:
// nadie sabe si fue capacidad, produccion o cliente, asi que nadie puede
// corregirlo. Se clasifica a diario en Pedidos planificados, y aqui se
// comprueba: no se cierra la semana dejandolos en blanco.
let RETRASOS_SIN_MOTIVO=0;
async function comprobarRetrasos(){
  try{
    // (sep 2026) Solo se exige a quien gestiona pedidos: Customer Service,
    // Operaciones, Logistica y Produccion. Bloquear el cierre de un comercial
    // o de Calidad por un retraso de fabrica no tiene sentido.
    // (sep 2026) Solo el equipo de OPERACIONES (operaciones, producción,
    // logística, almacén y sus subdepartamentos). Customer Service es de
    // ventas y los comerciales nunca. Se mira su propia ficha, no la de otros
    // que compartan código de grupo.
    let meToca=false;
    try{
      const [ru,rd]=await Promise.all([fetch(`${FB}/usuarios?pageSize=300`),fetch(`${FB}/departamentos?pageSize=300`)]);
      const deps={};
      if(rd.ok) ((await rd.json()).documents||[]).forEach(d=>{ const f=d.fields||{};
        deps[decodeURIComponent(d.name.split("/").pop()).toLowerCase()]={padre:String(f.padre?.stringValue||"").toLowerCase(),nombre:String(f.nombre?.stringValue||"").toLowerCase()}; });
      const BASE_PADRE={produccion:"operaciones",coordinacion:"operaciones",logistica:"compras",almacen:"operaciones"};
      const OPS=/operacion|produccion|logistica|almacen/;
      const enOps=(dep)=>{ let cur=String(dep||"").toLowerCase(), g=0;
        while(cur&&g<15){ const d=deps[cur]||{}; if(OPS.test(cur)||OPS.test(d.nombre||"")) return true; cur=d.padre||BASE_PADRE[cur]||""; g++; }
        return false; };
      if(ru.ok){
        const ju=await ru.json();
        (ju.documents||[]).forEach(d=>{
          const f=d.fields||{};
          const id=ARR(f.id?.stringValue||decodeURIComponent(d.name.split("/").pop()));
          const did=ARR(decodeURIComponent(d.name.split("/").pop()));
          if(![id,did].includes(AGENTE)&&![id,did].includes(ARR(UID))) return;
          const rol=String(f.rol?.stringValue||"").toLowerCase();
          const dep=String(f.departamentoId?.stringValue||"").toLowerCase();
          const tip=String(f.tipologia?.stringValue||"").toLowerCase();
          if(/agente|comercial|vendedor/.test(rol)&&!dep) return;
          if(enOps(dep)||(tip&&OPS.test(tip))) meToca=true;
          const resp=(f.responsableDe?.arrayValue?.values||[]).map(v=>String(v.stringValue||"").toLowerCase());
          if(resp.some(enOps)) meToca=true;
        });
      }
    }catch(e){}
    if(!meToca){ RETRASOS_SIN_MOTIVO=0; refrescar(); return; }

    const iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${
      String(d.getDate()).padStart(2,"0")}`;
    const fechas=[];
    for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); fechas.push(iso(d)); }

    const crudos=await Promise.all(fechas.map(f=>
      fetch(`${FB}/pbi_pedidos_cambios/${f}`).then(r=>r.ok?r.json():null).catch(()=>null)));

    // Motivos ya puestos
    const puestos=new Set();
    try{
      const rm=await fetch(`${FB}/pbi_retrasos_motivo?pageSize=300&mask.fieldPaths=motivo`);
      if(rm.ok){
        const jm=await rm.json();
        (jm.documents||[]).forEach(d=>{
          if(d.fields?.motivo?.stringValue)
            puestos.add(decodeURIComponent(d.name.split("/").pop()));
        });
      }
    }catch(e){}

    const clave=(m)=>[m.pedido||"",m.articulo||m.descripcion||"",
      m.cliente||m.nombre||""].join("|").replace(/[\s\/]/g,"_").slice(0,180);

    // (sep 2026) Arranque limpio: solo se exige clasificar desde esta fecha.
    // Habia 95 retrasos anteriores sin motivo y bloquear el cierre por todos
    // ellos habria hecho que nadie cerrara la semana.
    const DESDE_RETRASOS="2026-09-08";
    const vistos=new Set();
    let sin=0;
    crudos.filter(Boolean).forEach(doc=>{
      const f=doc.fields||{};
      const fDoc=f.fecha?.stringValue||decodeURIComponent(doc.name.split("/").pop());
      if(fDoc<DESDE_RETRASOS) return;
      let movs=[]; try{ movs=JSON.parse(f.movimientos?.stringValue||"[]"); }catch(e){}
      // esMio() se define mas abajo y solo dentro de pintar(): aqui se
      // compara contra el agente de la URL, que es quien cierra.
      movs.filter(m=>m.tipo==="retraso"
        &&ARR(m.agente)===AGENTE
        &&Math.abs(m.dias||0)>=3).forEach(m=>{
        const k=clave(m);
        if(vistos.has(k)) return;
        vistos.add(k);
        if(!puestos.has(k)) sin++;
      });
    });
    RETRASOS_SIN_MOTIVO=sin;
    if(sin){
      const av=document.getElementById("avisoRetrasos");
      if(av){
        av.style.display="block";
        av.innerHTML=`<b>⚠️ ${sin} retraso${sin===1?"":"s"} sin motivo.</b>
          Clasifícalo${sin===1?"":"s"} en <a href="/pedidos.html" style="color:#92400E;
          font-weight:700">Pedidos planificados → Movimientos → Retrasos</a>
          antes de cerrar la semana.`;
      }
    }
    refrescar();
  }catch(e){}
}

  const esc=(t)=>String(t||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
  const R2=R||{};
  // (sep 2026) No todas las respuestas guardan el nombre del cliente: salian
  // ids tipo "est_1780415207180". Se resuelven contra las fichas ya leidas.
  const _NOM={};
  try{
    const D2=window._CIERRE_DATOS||{};
    [...(D2.of||[]),...(D2.mu||[]),...(D2.es||[])].forEach(o=>{
      const n=o.clienteNombre||o.cliente||o.nombre;
      if(n&&o._id) _NOM[o._id]=n;
    });
  }catch(e){}
  const nomDe=(k,v)=>{
    const n=((v&&v.nom)||"").trim();
    if(n) return n;
    const id=String(k).split(/:(.+)/)[1]||k;
    return _NOM[id]||id;
  };

  // Lo prometido el lunes y qué pasó
  const promesas=Object.entries(R2)
    .filter(([k,v])=>k.startsWith("promesa:")&&(v.accion||v.texto))
    .map(([k,v])=>({nom:nomDe(k,v),
      accion:v.accion||"", texto:v.texto||""}));
  const cumplidas=promesas.filter(x=>/fue bien|lo hice/i.test(x.accion)).length;

  // Clientes en riesgo sobre los que ha dicho algo
  const riesgo=Object.entries(R2)
    .filter(([k,v])=>k.startsWith("cliente:")&&(v.accion||v.texto))
    .map(([k,v])=>({nom:nomDe(k,v),
      accion:v.accion||"", texto:v.texto||""}));

  // Lo que ha dado por cerrado
  const cerradas=Object.entries(R2)
    .filter(([k,v])=>v.cierra)
    .map(([k,v])=>({nom:nomDe(k,v),accion:v.accion||""}));

  const comoHaIdo=(R2.semana||{}).texto||"";
  const prioridad=(R2.prioridad||{}).texto||"";

  // (sep 2026) El correo traia solo lo que el comercial escribe. Se le añade
  // lo que el sistema sabe y el no cuenta: cobros vencidos, hitos, incidencias,
  // estrategias y ofertas paradas. Asi el responsable ve la foto entera.
  const extra={cobros:0, nFacV:0, hitos:[], inc:0, incLista:[], incAbiertas:0,
    estr:0, ofertas:0};
  try{
    const _campos=(j)=>{ const o={}; for(const [k,v] of Object.entries((j&&j.fields)||{}))
      o[k]=v.stringValue!==undefined?v.stringValue
        :v.doubleValue!==undefined?Number(v.doubleValue)
        :v.integerValue!==undefined?Number(v.integerValue)
        :v.booleanValue!==undefined?v.booleanValue:null;
      return o; };

    const D=window._CIERRE_DATOS||{};
    const MIOS=D.MIOS||new Set([AGENTE]);
    const of=D.of||[], es=D.es||[], esMio=D.esMio||(()=>false), fecha=D.fecha||(()=>null);

    // Cobros fuera de plazo: se prueba con cada codigo suyo
    for(const cod of [...MIOS]){
      try{
        const rc=await fetch(`${FB}/cobros_comercial/${encodeURIComponent(cod)}`,{cache:"no-store"});
        if(!rc.ok) continue;
        const c=_campos(await rc.json());
        const v=Number(c.totalVencido||c.venc||0);
        if(v>extra.cobros){ extra.cobros=v; extra.nFacV=Number(c.nFacturasVencidas||c.nFacV||0); }
      }catch(e){}
    }

    // Hitos de proyecto suyos sin resolver
    try{
      const rp=await fetch(`${FB}/proyectos?pageSize=300`);
      if(rp.ok){
        const jp=await rp.json();
        (jp.documents||[]).forEach(d=>{
          const f=_campos(d);
          if(String(f.estado||"").toLowerCase()==="cerrado") return;
          // Los hitos son un arrayValue de Firestore, no texto JSON
          const arr=(d.fields&&d.fields.hitos&&d.fields.hitos.arrayValue&&
            d.fields.hitos.arrayValue.values)||[];
          const hs=arr.map(v=>{ const o={};
            for(const [k,x] of Object.entries((v.mapValue&&v.mapValue.fields)||{}))
              o[k]=x.stringValue!==undefined?x.stringValue
                :x.booleanValue!==undefined?x.booleanValue
                :x.doubleValue!==undefined?Number(x.doubleValue):null;
            return o; });
          hs.forEach(h=>{
            if(!h||h.hecho||h.completado) return;
            if(!MIOS.has(ARR(h.responsable))) return;
            extra.hitos.push({nom:h.nombre||h.titulo||"(sin nombre)",
              proy:f.nombre||"", fecha:String(h.fecha||"").slice(0,10)});
          });
        });
        extra.hitos.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
      }
    }catch(e){}

    // Incidencias suyas sin resolver
    try{
      const ri=await fetch(`${FB}/incidencias?pageSize=300`);
      if(ri.ok){
        const ji=await ri.json();
        // Separadas: las que debe resolver el, y las que reporto a otros
        const vivas=(ji.documents||[]).map(_campos).filter(f=>{
          if(f.eliminada) return false;
          return !/resuelta|cerrada|cancelada/.test(String(f.estado||"").toLowerCase());
        });
        const _mia=(f)=>MIOS.has(ARR(f.agente))||MIOS.has(ARR(f.responsable))
          ||MIOS.has(ARR(f.asignadoA));
        extra.incLista=vivas.filter(_mia).map(f=>({
          texto:f.titulo||f.asunto||f.descripcion||f.texto||"(sin descripción)",
          cli:f.clienteNombre||f.cliente||"",
          fecha:String(f.fecha||f.fechaCreacion||"").slice(0,10),
          prio:String(f.prioridad||"").toLowerCase(),
        })).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
        extra.inc=extra.incLista.length;
        extra.incAbiertas=vivas.filter(f=>MIOS.has(ARR(f.creadoPor))&&!_mia(f)).length;
      }
    }catch(e){}

    // Estrategias y ofertas ya se han leido arriba para el cierre
    extra.estr=(es||[]).filter(o=>esMio(o)
      &&!/completada|ko|cerrada/.test(String(o.estado||"").toLowerCase())).length;
    const hoyO=new Date();
    extra.ofertas=(of||[]).filter(o=>{
      if(!esMio(o)) return false;
      if(/pedido|perdida|aceptada|rechazada/.test(String(o.estado||"").toLowerCase())) return false;
      const f=fecha(o.fecha||o.fechaCreacion);
      return f && Math.round((hoyO-f)/86400000)>10;
    }).length;
  }catch(e){}

  const mensaje=miNombre+" ha cerrado la semana "+SEMANA+". "
    +(promesas.length?"Cumplió "+cumplidas+" de "+promesas.length+" compromisos. ":"")

  const bloque=(tit,items,pinta)=>items.length
    ? `<h3 style="margin:20px 0 7px;font-size:14px;color:#14181F">${tit}</h3>`

    : "";

  const html=`<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',
    Roboto,sans-serif;max-width:600px;margin:0 auto;color:#14181F;line-height:1.55">
    <div style="background:#14181F;color:#fff;padding:18px 20px;border-radius:12px 12px 0 0">
      <div style="font-size:11px;letter-spacing:.08em;opacity:.7;
        text-transform:uppercase">Cierre semanal · semana ${SEMANA}</div>
      <div style="font-size:20px;font-weight:800;margin-top:3px">${esc(miNombre)}</div>
      ${yo&&yo.equipo?`<div style="font-size:12px;opacity:.75">${esc(yo.equipo)}</div>`:""}
    </div>
    <div style="border:1px solid #DCE1E7;border-top:none;border-radius:0 0 12px 12px;
      padding:20px">

      ${(()=>{ const C=window._CIERRE_CIFRAS||{};
        if(!C.mAct&&!C.vSem&&!C.pedSem) return "";
        const eu=(n)=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €";
        const pct=(a,b)=>b?Math.round(a/b*100):null;
        const fila=(tit,val,obj,ref,refTxt)=>{
          const p=pct(val,obj);
          const col=p==null?"#6B7684":(p>=100?"#0E7C5A":p>=80?"#B07908":"#C2263D");
          return `<tr>
            <td style="padding:9px 0;border-bottom:1px solid #EEF1F5">
              <div style="font-size:13px;font-weight:700">${tit}</div>
              ${obj?`<div style="font-size:11px;color:#8A94A0">objetivo ${eu(obj)}</div>`:""}
            </td>
            <td style="padding:9px 0;border-bottom:1px solid #EEF1F5;text-align:right">
              <div style="font-size:16px;font-weight:800">${eu(val)}</div>
              ${p!=null?`<div style="font-size:11.5px;font-weight:700;color:${col}">
                ${p} % del objetivo</div>`
               :ref?`<div style="font-size:11.5px;color:#8A94A0">${refTxt}</div>`:""}
            </td></tr>`;
        };
        return `<table style="width:100%;border-collapse:collapse;margin-bottom:6px">
          ${C.mAct!=null?fila("Ventas de "+(C.mes||"el mes"),C.mAct,C.mObj,
            C.mAnt,C.mAnt?"año pasado "+eu(C.mAnt):""):""}
          ${C.vSem?fila("Facturado esta semana",C.vSem,C.objSem,
            C.vSemAnt,C.vSemAnt?"semana anterior "+eu(C.vSemAnt):""):""}
          ${C.pedSem?fila("Pedidos introducidos",C.pedSem,0,
            C.pedSemAnt,C.pedSemAnt?"semana anterior "+eu(C.pedSemAnt):""):""}
        </table>`;
      })()}

      ${promesas.length?`<div style="background:#F7F9FB;border-radius:10px;
        padding:14px 16px;margin-bottom:4px">
        <div style="font-size:26px;font-weight:800;line-height:1">${cumplidas}
          <span style="font-size:15px;font-weight:400;color:#6B7684">de ${
            promesas.length}</span></div>
        <div style="font-size:12px;color:#6B7684">compromisos del lunes cumplidos</div>
      </div>`:""}

      ${(()=>{ const A=window._CIERRE_ACT;
        if(!A||(!A.vis&&!A.lla&&!A.mEnv)) return "";
        const fs=[
          {ic:"👋",l:"Visitas",r:A.vis,o:A.objVis},

          {ic:"📦",l:"Muestras env.",r:A.mEnv,o:A.objMue},
          {ic:"✅",l:"Muestras ok",r:A.mOk,o:A.objMueOk},
        ].filter(f=>f.r||f.o);
        if(!fs.length) return "";
        const sinObj=fs.some(f=>!f.o);
        return `<h3 style="margin:22px 0 6px;font-size:14px">Su actividad esta semana</h3>
        <table style="width:100%;border-collapse:collapse">
          ${fs.map(f=>{
            const p=f.o?Math.round(f.r/f.o*100):null;
            const c=p==null?"#6B7684":(p>=100?"#0E7C5A":p>=80?"#B07908":"#C2263D");
            const w=Math.min(100,p||0);

              <td style="padding:7px 0;font-size:12.5px;white-space:nowrap">${f.ic} ${f.l}</td>

                <div style="background:#EEF1F5;border-radius:99px;height:7px;overflow:hidden">
                  <div style="background:${c};width:${w}%;height:7px;border-radius:99px"></div></div></td>
              <td style="padding:7px 0;text-align:right;white-space:nowrap">
                <span style="font-size:13px;font-weight:800">${f.r}</span>
                ${f.o?`<span style="font-size:11.5px;color:#8A94A0">/${f.o}</span>
                  <span style="font-size:11.5px;font-weight:700;color:${c}"> ${p} %</span>`:""}
              </td></tr>`;}).join("")}
        </table>
        <div style="font-size:11.5px;color:#8A94A0;margin-top:5px">
          ${sinObj?"Falta fijar el objetivo en Administración → 🎯 Objetivos."
            :"Su objetivo del mes"+(A.telefonico?" (telefónico)":"")+" llevado a la semana."}</div>`;
      })()}

      ${(()=>{ const rc=Object.entries(R2).filter(([k])=>k.startsWith("recup:")).map(([,v])=>v);
        if(!rc.length) return "";
        const eu=(n)=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €";
        const colN={1:"#16A34A",2:"#D97706",3:"#DC2626"}, txtN={1:"Comercial",2:"Jefe de ventas",3:"CEO"};
        rc.sort((a,b)=>(b.perdido||0)-(a.perdido||0));
        return `<h3 style="margin:22px 0 6px;font-size:14px">🚨 Plan de recuperación · ${rc.length} cliente${rc.length===1?"":"s"}</h3>
        ${rc.map(v=>`<div style="border:1px solid #EEF1F5;border-left:3px solid ${colN[v.nivel]||"#6B7684"};border-radius:6px;padding:9px 11px;margin:6px 0">
          <div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:13px">${esc(v.nom)}</b>
            <span style="font-size:12.5px;font-weight:800;color:#C2263D;white-space:nowrap">−${eu(v.perdido)}</span></div>
          <div style="font-size:11px;color:${colN[v.nivel]||"#6B7684"};font-weight:700">${txtN[v.nivel]||""}</div>
          ${v.productos&&v.productos.length&&window.RC?RC.htmlProductos({caen:v.productos},{max:3,sinSuben:true,perdido:v.perdido}):""}
          ${v.archivo?`<div style="font-size:12.5px;color:#92400E;margin-top:3px">Pide archivarlo: ${esc(v.archivo)}</div>`
          :`<div style="font-size:12.5px;color:#3A424E;margin-top:3px"><b>Causa:</b> ${esc(v.causa)} · <b>Plan:</b> ${esc(v.accion)}${v.margen!=null&&v.margen!==""?" ("+esc(v.margen)+" % margen)":""}
            · ${eu(v.euros)} antes del ${esc(String(v.fecha||"").split("-").reverse().join("/"))}</div>
          ${v.hecho?`<div style="font-size:12.5px;color:#3A424E;margin-top:2px"><b>Esta semana:</b> ${esc(v.hecho)}${v.respuesta?" — "+esc(v.respuesta):""}</div>`:""}
          ${v.siguiente?`<div style="font-size:12.5px;color:#3A424E"><b>Siguiente:</b> ${esc(v.siguiente)}</div>`:""}`}
        </div>`).join("")}`;
      })()}

      ${(()=>{ const K=window._KPIS; if(!K) return "";
        const eu=(n)=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €";
        const fila=(ic,t,cifra,mal,plan)=>`<div style="border:1px solid #EEF1F5;border-left:3px solid ${mal?"#C2263D":"#0E7C5A"};border-radius:6px;padding:8px 11px;margin:6px 0;font-size:12.5px">
          <b>${ic} ${t}</b> · ${cifra}${plan?`<div style="margin-top:3px;color:#3A424E"><b>Plan:</b> ${esc(plan)}</div>`:""}</div>`;
        const c=K.cobros,m=K.muestras,a=K.actividad;
        return `<h3 style="margin:22px 0 6px;font-size:14px">📊 Cobros, muestras y actividad</h3>`
          +(c.hay?fila("💰","Cobros",`vencido ${eu(c.venc)} · máximo ${eu(c.limite)}`,c.pasa,c.plan):"")
          +fila("📦","Muestras",`enviadas ${m.env}${m.objEnv?"/"+m.objEnv:""} · OK ${m.ok}${m.objOk?"/"+m.objOk:""} · KO ${m.ko} · sin respuesta ${m.pend}`,m.objEnv&&m.env<m.objEnv*0.8,m.plan)
          +fila("👋","Actividad",`visitas ${a.vis}${a.objVis?"/"+a.objVis:""} · llamadas ${a.lla}${a.objLla?"/"+a.objLla:""}`,a.flojo,a.plan);
      })()}

      ${(()=>{ const es=Object.entries(R2).filter(([k])=>k.startsWith("estres:")).map(([,v])=>v);
        if(!es.length) return "";
        const t={pedido:["✅ Pedido","#15803D"],pendiente:["⏳ Sigue pendiente","#B45309"],ko:["❌ No ha salido","#B91C1C"]};
        return `<h3 style="margin:22px 0 6px;font-size:14px">💶 Estrategias aprobadas · resultado</h3>
        ${es.map(v=>`<div style="border:1px solid #EEF1F5;border-left:3px solid ${(t[v.res]||[])[1]||"#6B7684"};border-radius:6px;padding:8px 11px;margin:6px 0;font-size:12.5px">
          <b>${esc(v.cli)}</b> · ${esc(v.art)}${v.cal?" "+esc(v.cal):""} a ${esc(v.precio)} €/${esc(v.unidad)}<br>
          <b style="color:${(t[v.res]||[])[1]||"#333"}">${(t[v.res]||[v.res])[0]}</b>${v.sub?" · "+esc(v.sub):""}${v.nota?" — "+esc(v.nota):""}</div>`).join("")}`;
      })()}

      ${comoHaIdo?`<h3 style="margin:20px 0 7px;font-size:14px">Cómo ha ido</h3>
        <p style="margin:0;font-size:13.5px;color:#3A424E;white-space:pre-wrap"
          >${esc(comoHaIdo)}</p>`:""}

      ${bloque("Lo que dijo el lunes",promesas,x=>
        `<div style="border-left:3px solid ${
          /fue bien|lo hice/i.test(x.accion)?"#0E7C5A":"#B07908"};
          padding:5px 0 5px 11px;margin-bottom:9px">
          <div style="font-size:13.5px;font-weight:700">${esc(x.nom)}</div>
          <div style="font-size:12px;color:#6B7684">${esc(x.accion)}</div>
          ${x.texto?`<div style="font-size:12.5px;color:#3A424E;margin-top:3px;
            font-style:italic">“${esc(x.texto)}”</div>`:""}
        </div>`)}

      ${bloque("Clientes en riesgo",riesgo,x=>
        `<div style="border-left:3px solid #C2263D;padding:5px 0 5px 11px;
          margin-bottom:9px">
          <div style="font-size:13.5px;font-weight:700">${esc(x.nom)}</div>
          <div style="font-size:12px;color:#6B7684">${esc(x.accion)}</div>
          ${x.texto?`<div style="font-size:12.5px;color:#3A424E;margin-top:3px;
            font-style:italic">“${esc(x.texto)}”</div>`:""}
        </div>`)}

      ${cerradas.length?`<h3 style="margin:20px 0 7px;font-size:14px">
        Ha cerrado ${cerradas.length}</h3>
        <div style="font-size:12.5px;color:#6B7684">${
          cerradas.map(x=>esc(x.nom)+" ("+esc(x.accion)+")").join(" · ")}</div>`:""}

      ${(extra.cobros||extra.hitos.length||extra.inc||extra.incAbiertas
        ||extra.estr||extra.ofertas)?`
      <h3 style="margin:22px 0 8px;font-size:14px;color:#14181F">Lo que tiene abierto</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        ${extra.cobros?(()=>{
          const eu=(n)=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €";
          const Pl=window._CIERRE_POL||{}, lim=Pl.limite||0;
          const pct=lim?Math.round(extra.cobros/lim*100):null;
          const dentro=lim&&extra.cobros<=lim;
          return `<tr>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5">💰 Cobros fuera de plazo
            ${extra.nFacV?`<span style="color:#6B7684;font-size:11.5px"> · ${extra.nFacV} facturas</span>`:""}
            ${lim?`<div style="font-size:11.5px;margin-top:2px;color:${dentro?"#0E7C5A":"#C2263D"};font-weight:700">
              ${dentro?"✅ Dentro de política":"⚠️ Fuera de política"} · ${pct} % de lo permitido</div>
              <div style="font-size:11px;color:#8A94A0">Máximo permitido ${eu(lim)}: 5 % de ${eu(Pl.v2m)} vendidos en los dos últimos meses${dentro?"":" · sobran "+eu(extra.cobros-lim)}</div>`:""}</td>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5;text-align:right;vertical-align:top;
            font-weight:800;color:${dentro?"#0E7C5A":"#C2263D"}">${eu(extra.cobros)}</td></tr>`;})():""}
        ${extra.inc?`<tr>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5">🚨 Incidencias suyas sin resolver</td>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5;text-align:right;
            font-weight:800">${extra.inc}</td></tr>`:""}
        ${extra.incAbiertas?`<tr>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5">📤 Incidencias que abrió, aún sin resolver</td>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5;text-align:right;
            font-weight:800">${extra.incAbiertas}</td></tr>`:""}
        ${extra.estr?`<tr>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5">🎯 Estrategias sin cerrar</td>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5;text-align:right;
            font-weight:800">${extra.estr}</td></tr>`:""}
        ${extra.ofertas?`<tr>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5">💰 Ofertas de más de 10 días</td>
          <td style="padding:7px 0;border-bottom:1px solid #EEF1F5;text-align:right;
            font-weight:800">${extra.ofertas}</td></tr>`:""}
        ${extra.hitos.length?`<tr>
          <td style="padding:7px 0">📁 Hitos de proyecto sin resolver</td>
          <td style="padding:7px 0;text-align:right;font-weight:800">${extra.hitos.length}</td></tr>`:""}
      </table>
      ${extra.hitos.length?`<div style="margin-top:9px">
        ${extra.hitos.slice(0,6).map(h=>`<div style="font-size:12.5px;color:#3A424E;
          padding:4px 0 4px 11px;border-left:2px solid #DCE1E7;margin-bottom:4px">
          ${esc(h.nom)}${h.proy?`<span style="color:#8A94A0"> · ${esc(h.proy)}</span>`:""}
          ${h.fecha?`<span style="color:#B07908"> · ${

        ${extra.hitos.length>6?`<div style="font-size:11.5px;color:#8A94A0">
          y ${extra.hitos.length-6} más</div>`:""}
      </div>`:""}`:""}

      ${prioridad?`<div style="background:#FFFBEB;border:1px solid #F59E0B;
        border-radius:10px;padding:14px 16px;margin-top:20px">
        <div style="font-size:11px;font-weight:800;color:#92400E;
          text-transform:uppercase;letter-spacing:.05em">Su prioridad · semana ${SEMANA+1}</div>
        <div style="font-size:14px;margin-top:5px;color:#14181F">${esc(prioridad)}</div>
      </div>`:""}

      <div style="margin-top:22px;text-align:center">
        <a href="${enlace}" style="display:inline-block;background:#14181F;
          color:#fff;text-decoration:none;padding:11px 26px;border-radius:9px;
          font-size:13.5px;font-weight:700">Ver el parte completo</a>
      </div>
      <p style="margin:18px 0 0;font-size:11px;color:#8A94A0;text-align:center">
        Enviado automáticamente al cerrar la semana en el CRM.</p>
    </div>
  </div>`;

  // (sep 2026) Se guarda el correo tal cual en el informe: el CRM lo enseña
  // en Partes con el mismo formato, sin tener que recalcular las cifras.
  if(!opts.soloHtml) try{
    await fetch(`${FB}/informes/${encodeURIComponent("informe_"+AGENTE+"_s"+SEMANA)}`
      +"?updateMask.fieldPaths=htmlEmail&updateMask.fieldPaths=htmlEmailOrigen"+(P.get("uid")?"&updateMask.fieldPaths=uid":""),{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:Object.assign({htmlEmail:{stringValue:html},
        htmlEmailOrigen:{stringValue:"cierre"}},
        P.get("uid")?{uid:{stringValue:UID}}:{})})});
  }catch(e){}
  // Modo "solo ver": el CRM pide el correo de un cierre antiguo para enseñarlo
  if(opts.soloHtml) return html;
  if(sinDestinos) return;

  // Emails del portal, por si la ficha del CRM no lo tiene
  let pu=[];
  try{
    const rp=await fetch(`${FB}/portal_users?pageSize=300`);
    if(rp.ok){
      const jp=await rp.json();
      pu=(jp.documents||[]).map(d=>{
        const o={_id:decodeURIComponent(d.name.split("/").pop())};
        for(const [k,v] of Object.entries(d.fields||{}))
          o[k]=v.stringValue!==undefined?v.stringValue:null;
        return o;
      });
    }
  }catch(e){}

  for(const id of destinos){
    const dest={...(us.find(u=>u._id===id)||{})};
    if(!dest.email){
      const p=pu.find(x=>[x._id,x.id,x.crmId,x.username].filter(Boolean)
        .some(k=>_n(k)===_n(id)));
      if(p&&p.email) dest.email=p.email;
    }
    // Mismo formato y coleccion que el resto de avisos del CRM, para que
    // aparezcan juntos y salga el correo por la via de siempre.
    const nid="notif_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
    const campos={
      id:{stringValue:nid},
      tipo:{stringValue:"cierre_semanal"},
      titulo:{stringValue:titulo},
      mensaje:{stringValue:mensaje},
      destinatarioId:{stringValue:id},
      destinatarioEmail:{stringValue:dest.email||""},
      enlace:{stringValue:enlace},
      prioridad:{stringValue:"normal"},
      creadoPor:{stringValue:UID},
      creadoPorNombre:{stringValue:miNombre},
      fecha:{stringValue:ahora},
      leido:{booleanValue:false},
      emailEnviado:{booleanValue:false},
      agente:{stringValue:AGENTE},
      semana:{doubleValue:SEMANA},
    };
    await fetch(`${FB}/notificaciones_email/${nid}`,{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:campos})}).catch(()=>{});

    // Y el correo, si tiene direccion
    if(dest.email){
      fetch("/api/send-email",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ to:dest.email, subject:titulo, html:html })
      }).catch(()=>{});
    }
  }
}

async function enviar(){
  if(P.get("prueba")==="1"){ alert("Modo prueba: no se ha guardado nada. Con la página definitiva, aquí se cerraría tu semana."); return; }
  const b=document.getElementById("btn"); b.disabled=true; b.textContent="Guardando…"; cacheBorra();
  const doc={
    id:`informe_${AGENTE}_s${SEMANA}`, agente:AGENTE, semana:SEMANA,
    // El portal comprueba con esto si ya ha cerrado (candado del sabado)
    uid:UID||"",
    ano:new Date().getFullYear(), estado:"enviado",
    fechaEnvio:new Date().toISOString(),
    // Solo lo que el comercial aporta. Las cifras NO se guardan aquí: se
    // leen del CRM cuando se necesiten, y así nunca hay dos versiones.
    respuestas: JSON.stringify(R),
    // Lo planteado permite al responsable ver qué se le pidió y no contestó
    planteados: JSON.stringify(window.PLANTEADOS||[]),
    origen:"cierre_v2",
  };
  const f={};
  for(const [k,v] of Object.entries(doc))
    f[k]= typeof v==="number" ? {doubleValue:v} : {stringValue:String(v)};
  // Primero se cierran los documentos marcados. Si algo falla se avisa y no
  // se cierra la semana: mejor repetir que dar por cerrado lo que sigue abierto.
  const cerrar=[];
  for(const [k,v] of Object.entries(R)){
    if(!v.cierra) continue;
    const [col,id]=k.split(/:(.+)/);
    if(!col||!id||col==="cliente") continue;
    cerrar.push({col,id,estado:v.cierra});
  }
  let fallos=0;
  for(const c of cerrar){
    try{
      const r=await fetch(`${FB}/${c.col}/${encodeURIComponent(c.id)}`
        +`?updateMask.fieldPaths=estado&updateMask.fieldPaths=cerradoEn`
        +`&updateMask.fieldPaths=cerradoPor`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          estado:{stringValue:c.estado},
          cerradoEn:{stringValue:new Date().toISOString()},
          cerradoPor:{stringValue:"cierre_semanal_s"+SEMANA}}})});
      if(!r.ok) throw new Error("HTTP "+r.status);
    }catch(e){ fallos++; }
  }
  if(fallos){
    b.disabled=false; b.textContent="Reintentar";
    alert(fallos+" no se han podido cerrar. No se ha cerrado la semana.");
    return;
  }
  doc.cerrados = cerrar.length;

  // Plan de recuperación: se guarda antes que el informe. Si falla, no se cierra.
  const fR=await guardarRecuperacion();
  if(fR){
    b.disabled=false; b.textContent="Reintentar";
    alert(fR+" caso(s) de recuperación no se han podido guardar. No se ha cerrado la semana.");
    return;
  }
  try{ await guardarCompromisosCobro(); }catch(e){}
  const fE=await guardarEstRes();
  if(fE){
    b.disabled=false; b.textContent="Reintentar";
    alert(fE+" estrategia(s) no se han podido guardar. No se ha cerrado la semana.");
    return;
  }
  doc.respuestas=JSON.stringify(R);
  f.respuestas={stringValue:doc.respuestas};
  window._KPIS=kpisParaGuardar();
  try{ await guardarObjJefe(); }catch(e){}
  doc.kpis=JSON.stringify(window._KPIS);
  f.kpis={stringValue:doc.kpis};
  doc.casosRecuperacion=window.CASOS.length;
  f.casosRecuperacion={doubleValue:window.CASOS.length};

  // Las fusiones se ANOTAN; las aplica la sincronizacion, que es donde vive esa
  // logica. Dos sitios fusionando es como se rompen los datos.
  for(const [k,v] of Object.entries(R)){
    if(!k.startsWith("dup:")||!v.accion) continue;
    const id=k.slice(4);
    const d=(typeof DUPS!=="undefined"?DUPS:[]).find(x=>x.id===id);
    if(!d) continue;
    const estado = /Es el mismo/i.test(v.accion) ? "confirmada"
                 : /Son distintos/i.test(v.accion) ? "descartada" : "aplazada";
    try{
      await fetch(`${FB}/fusiones_propuestas/${encodeURIComponent(id)}`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          crmId:{stringValue:id}, pbiCodigo:{stringValue:d.pbiCod},
          nombre:{stringValue:d.nom}, estado:{stringValue:estado},
          agente:{stringValue:AGENTE}, semana:{doubleValue:SEMANA},
          // "No lo sé" no vuelve a preguntar en cuatro semanas
          noPreguntarHasta:{stringValue: estado==="aplazada"
            ? new Date(Date.now()+28*86400000).toISOString() : ""},
          decididoEl:{stringValue:new Date().toISOString()},
        }})});
    }catch(e){}
  }

  try{
    const r=await fetch(`${FB}/informes/${encodeURIComponent(doc.id)}`,{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:f})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    // Marcar el plan como cerrado: es lo que desbloquea la semana siguiente
    // en el CRM. Sin esto el comercial rellena el cierre y sigue bloqueado.
    // IMPORTANTE: el CRM guarda y comprueba el plan como "plan_{usuario.id}_...",
    // no como "plan_{código comercial}_...". Hay que escribir en el mismo
    // documento que el CRM lee, si no, el cierre queda invisible para el CRM.
    try{
      const anio=new Date().getFullYear();
      await fetch(`${FB}/planes_semanales/plan_${UID}_${anio}_s${SEMANA}`
        +`?updateMask.fieldPaths=estado&updateMask.fieldPaths=fechaCierre`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          estado:{stringValue:"cerrado"},
          fechaCierre:{stringValue:new Date().toISOString()}}})});
      // Red de seguridad: si el enlace era antiguo (uid=agente) o UID no
      // coincide con lo que de verdad usa el CRM, se marca también bajo el
      // código comercial en minúsculas, como hacía antes.
      if(UID!==AGENTE.toLowerCase()){
        await fetch(`${FB}/planes_semanales/plan_${AGENTE.toLowerCase()}_${anio}_s${SEMANA}`
          +`?updateMask.fieldPaths=estado&updateMask.fieldPaths=fechaCierre`,{
          method:"PATCH",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({fields:{
            estado:{stringValue:"cerrado"},
            fechaCierre:{stringValue:new Date().toISOString()}}})}).catch(()=>{});
      }
    }catch(e){}

    // (sep 2026) El cierre se guardaba y nadie se enteraba: el jefe tenia que
    // acordarse de entrar a mirar. Ahora se le avisa a el y al CEO, como con
    // las incidencias.
    try{ await avisarDelCierre(cerrar.length); }catch(e){}

    document.getElementById("app").innerHTML=
      `<div class="listo"><b>Semana ${SEMANA} cerrada</b>
       ${cerrar.length?cerrar.length+" cerradas en el sistema. ":""}Lo que has
       escrito queda guardado y se te preguntará por ello.</div>
       ${VUELVE?`<div style="padding:0 16px"><button class="env"
         style="width:100%;background:var(--tinta);color:#fff"
         onclick="volverCRM(event)">Volver al CRM</button></div>`:""}`;
    document.getElementById("pie").innerHTML="";
  }catch(e){
    b.disabled=false; b.textContent="Reintentar";
    alert("No se ha podido guardar: "+e.message);
  }
}

(async()=>{
  // En modo "solo ver" cualquier salida anticipada tiene que avisar al CRM,
  // si no se queda esperando. Y un tope de tiempo por si algo se cuelga.
  const _sv=P.get("solover")==="1";
  const _svErr=(m)=>{ if(_sv) try{ parent.postMessage({type:"CIERRE_HTML",agente:AGENTE,semana:SEMANA,error:m},"*"); }catch(e){} };
  if(_sv) setTimeout(()=>_svErr("tiempo agotado"),40000);
  const sal=document.getElementById("salir");
