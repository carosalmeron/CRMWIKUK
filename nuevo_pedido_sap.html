<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuevo pedido · SAP</title>
<style>
:root{--rojo:#DC2626;--verde:#16A34A;--azul:#2563EB;--muted:#64748B;--line:#E5E7EB}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:#F4F5F7;color:#0F172A}
.w{max-width:860px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
input,textarea,select,button{font:inherit}
input,textarea,select{width:100%;box-sizing:border-box;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--azul)}
.g{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:2fr 1fr 1fr}
.btn{font-weight:800;padding:11px 16px;border:0;border-radius:10px;cursor:pointer;background:#0F172A;color:#fff}
.btn.sec{background:#fff;color:#0F172A;border:1.5px solid var(--line)}.btn.ok{background:var(--verde)}.btn[disabled]{opacity:.5;cursor:default}
.sug{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;max-height:260px;overflow:auto}
.sug div{padding:8px 10px;cursor:pointer;border-bottom:1px solid #F1F5F9;font-size:13px}.sug div:hover{background:#F1F5F9}
.sug small{display:block;color:var(--muted)}
.rel{position:relative}
.lin{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:2fr 80px 100px 120px 36px;gap:8px;align-items:end}
.lin .nm{font-size:12px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:15px;padding-top:8px;border-top:2px solid #CBD5E1}
.msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-weight:700}.msg.ok{background:#DCFCE7;color:#166534}.msg.ko{background:#FEE2E2;color:#991B1B}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;background:#F1F5F9;color:#334155;margin-left:6px}
.pill.test{background:#FEF3C7;color:#92400E}.pill.real{background:#DCFCE7;color:#166534}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}.lin{grid-template-columns:1fr 1fr 1fr;}.lin>:first-child{grid-column:1/-1}.lin>:last-child{grid-column:3}}
</style></head><body><div class="w">
<h1>🧾 Nuevo pedido en SAP</h1>
<div class="sub">Se crea directamente en SAP Business One como pedido de venta. Base: <span id="dbPill" class="pill"></span> <button class="btn sec" style="padding:3px 8px;font-size:11.5px" onclick="cambiarDb()">cambiar</button></div>

<div class="card" id="cardKey" hidden data-old="1" style="display:none">
  <label>Clave para dar de alta pedidos</label>
  <div class="g" style="grid-template-columns:1fr auto"><input id="key" type="password" placeholder="La clave SAP_PEDIDOS_KEY de Vercel (si no existe, vale el CRON_SECRET)"><button class="btn" onclick="guardarKey()">Guardar y probar</button></div>
  <div id="keyMsg" style="font-size:12.5px;margin-top:6px;color:var(--muted)"></div>
</div>
<div id="estadoApi" style="font-size:12px;margin:6px 0;color:var(--muted)">Comprobando conexión con SAP…</div>

<div class="card">
  <div class="g g2">
    <div class="rel"><label>Cliente *</label><input id="cli" placeholder="Nombre, código C0… o CIF" autocomplete="off" oninput="buscarCli(this.value)"><div class="sug" id="cliSug" hidden></div>
      <div id="cliInfo" style="font-size:12px;color:var(--muted);margin-top:4px"></div></div>
    <div><label>Fecha de entrega pedida *</label><input id="entrega" type="date"></div>
    <div><label>Vendedor (código SAP)</label><input id="ven" placeholder="se toma del cliente si lo dejas vacío"></div>
    <div><label>Referencia del cliente</label><input id="ref" placeholder="su nº de pedido, opcional"></div>
  </div>
  <div style="margin-top:10px"><label>Comentarios</label><textarea id="com" rows="2" placeholder="Horario de descarga, instrucciones…"></textarea></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center"><b>Líneas</b><button class="btn sec" onclick="addLinea()">+ Añadir línea</button></div>
  <div id="lineas"></div>
  <div class="tot"><span>Total (base)</span><span id="total">0,00 €</span></div>
  <div style="font-size:11.5px;color:var(--muted);margin-top:4px">Si dejas el precio vacío, SAP aplica la tarifa del cliente. El precio que escribas manda sobre la tarifa.</div>
</div>

<div class="card">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn sec" onclick="revisar()">👁 Revisar</button>
    <button class="btn ok" id="btnEnviar" onclick="enviar()">📤 Enviar a SAP</button>
    <button class="btn sec" onclick="limpiar()">Limpiar</button>
  </div>
  <div id="msg"></div>
  <pre id="res" style="white-space:pre-wrap;font-size:12px;background:#F8FAFC;border-radius:10px;padding:10px;margin-top:10px" hidden></pre>
</div>
</div>
<script>/* pase SAP: lo da el portal al entrar */
(function(){
  // Pase de SAP: lo da el portal al entrar (usuario y contraseña del portal, una vez cada 30 días).
  // Aquí no se pide ninguna contraseña: si falta el pase, se explica y se ofrece salir y volver a entrar.
  var K='sap_pedido_key';
  function galleta(){ var m=/(?:^|;\s*)sap_pase=([^;]+)/.exec(document.cookie||''); return m?decodeURIComponent(m[1]):''; }
  function get(){ var t=''; try{ t=localStorage.getItem(K)||''; }catch(e){} return exp(t)>Date.now()?t:galleta(); }
  function exp(t){ var m=/^crm\.([A-Za-z0-9_-]+)\./.exec(t||''); if(!m) return 0; try{ return JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))).exp||0; }catch(e){ return 0; } }
  var abierto=false;
  function ventana(motivo){
    if(abierto) return; abierto=true;
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif');
    d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:380px;width:100%;padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.3)">'
      +'<div style="font-weight:800;font-size:18px">🔐 Falta el permiso de SAP</div>'
      +'<div style="font-size:14px;color:#334155;margin:8px 0 14px;line-height:1.45">'+(motivo||'Este aparato todavía no tiene permiso para SAP.')+'<br><br>Sal del portal y vuelve a entrar con tu usuario: el permiso se activa solo y dura 30 días.'+(function(){ var e=''; try{ e=localStorage.getItem('sap_pase_error')||''; }catch(x){} return e?'<div style="margin-top:10px;background:#FEE2E2;color:#991B1B;border-radius:8px;padding:8px;font-weight:700">Último intento: '+String(e).replace(/[<>&]/g,'')+'</div>':''; })()+'</div>'
      +'<button id="sp_out" style="width:100%;font-size:17px;font-weight:800;padding:12px;border:0;border-radius:10px;background:#0F172A;color:#fff">Salir y volver a entrar</button>'
      +'<button id="sp_x" style="width:100%;font-size:15px;font-weight:700;padding:10px;border:0;background:transparent;color:#64748B;margin-top:6px">Ahora no</button></div>';
    document.body.appendChild(d);
    document.getElementById('sp_x').onclick=function(){ d.remove(); abierto=false; };
    document.getElementById('sp_out').onclick=function(){
      try{ localStorage.removeItem(K); localStorage.removeItem('gc_portal_user'); }catch(e){}
      try{ if(window.top&&window.top.doLogout){ window.top.doLogout(); return; } }catch(e){}
      try{ window.top.location.href='/'; }catch(e){ location.href='/'; }
    };
  }
  // Intento automático: con la sesión del portal abierta en ESTE navegador (gc_portal_user), se lee la ficha del usuario
  // y se pide el pase sin preguntar nada. Así funciona en Safari, Chrome o cualquier navegador donde se haya entrado al portal.
  async function auto(){
    var pu=null; try{ pu=JSON.parse(localStorage.getItem('gc_portal_user')||'null'); if(!pu||!pu.id){ var sid=localStorage.getItem('sap_portal_id')||decodeURIComponent((/(?:^|;\s*)sap_portal_id=([^;]+)/.exec(document.cookie)||[])[1]||''); if(sid) pu={id:sid}; } }catch(e){}
    if(!pu||!pu.id) return 'no hay sesión del portal en este navegador';
    var h=pu.passHash||'';
    if(!h){ try{ var FB='https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents';
      for(var col of ['portal_users','usuarios']){ var r=await fetch(FB+'/'+col+'/'+encodeURIComponent(pu.id)); if(!r.ok) continue; var j=await r.json(); var f=(j.fields||{}).passHash; if(f&&f.stringValue){ h=f.stringValue; break; } } }catch(e){} }
    if(!h) return 'no encuentro la ficha del usuario '+pu.id;
    try{ var r2=await fetch('/api/sap-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:pu.id,passHash:h})});
      var j2=await r2.json().catch(function(){ return {ok:false,error:'HTTP '+r2.status}; });
      if(j2&&j2.ok&&j2.token){ try{ localStorage.setItem(K,j2.token); localStorage.removeItem('sap_pase_error'); }catch(e){} return ''; }
      return (j2&&j2.error)||'sin respuesta'; }catch(e){ return 'no se llega al servidor: '+e.message; } }
  var intentado=false;
  async function resolver(motivo){
    if(!intentado){ intentado=true; var err=await auto(); if(!err){ location.reload(); return; } try{ localStorage.setItem('sap_pase_error',err); }catch(e){} }
    ventana(motivo);
  }
  window.pedirPaseSap=resolver;
  var f0=window.fetch;
  window.fetch=function(u,o){ return f0.apply(this,arguments).then(function(r){ try{ if(r.status===401&&/\/api\/sap-(pedido|factura|produccion|traslado|planificacion)/.test(String(u&&u.url||u))) setTimeout(function(){ resolver(exp(get())?'El permiso guardado ya no vale.':''); },0); }catch(e){} return r; }); };
  if(!(exp(get())>Date.now())){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ resolver(); }); else resolver(); }
})();
</script>
<script>
const API="/api/sap-pedido";
// (28/10) Buscadores locales: clientes y artículos que ya tiene el CRM (Firestore), al instante y sin gastar sesión de SAP.
// Al elegir, se valida contra SAP en segundo plano (vendedor, tarifa, bloqueo / precio del cliente).
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
let CLIENTES_CRM=[], ARTS_CRM=[];
const N=(t)=>String(t||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const sapDeCrm=(cod)=>{ const d=String(cod||"").replace(/\D/g,""); return d?"C0"+d.slice(-4).padStart(4,"0"):String(cod||""); };
async function cargarLocales(){
  try{ const m=await fetch(FB+"/pbi_directorio/clientes").then(r=>r.ok?r.json():null); const n=Number(m&&m.fields&&m.fields.trozos&&(m.fields.trozos.integerValue||m.fields.trozos.doubleValue))||0;
    const P=await Promise.all([...Array(n)].map((_,i)=>fetch(FB+"/pbi_directorio/clientes_"+i).then(r=>r.ok?r.json():null).catch(()=>null)));
    P.forEach(d=>{ let o={}; try{ o=JSON.parse(d&&d.fields&&d.fields.nombres&&d.fields.nombres.stringValue||"{}"); }catch(e){}
      Object.entries(o).forEach(([cod,v])=>{ if(String(cod)[0]!=="U") return; const [nombre,pob]=String(v).split("|"); CLIENTES_CRM.push({crm:cod,codigo:sapDeCrm(cod),nombre,poblacion:pob||"",n:N(nombre+" "+cod+" "+(pob||""))}); }); }); }catch(e){}
  try{ const m=await fetch(FB+"/stock_sap/meta").then(r=>r.ok?r.json():null); const n=Number(m&&m.fields&&m.fields.chunks&&(m.fields.chunks.integerValue||m.fields.chunks.doubleValue))||0;
    const P=await Promise.all([...Array(n)].map((_,i)=>fetch(FB+"/stock_sap_detalle/chunk_"+i).then(r=>r.ok?r.json():null).catch(()=>null)));
    P.forEach(d=>{ let rows=[]; try{ rows=JSON.parse(d&&d.fields&&d.fields.rows&&d.fields.rows.stringValue||"[]"); }catch(e){}
      rows.forEach(r=>{ if(r&&r.cod) ARTS_CRM.push({codigo:String(r.cod).toUpperCase(),nombre:r.desc||"",calibre:r.calibre||"",metros:r.met||"",stock:Number(r.stock)||0,libre:(Number(r.stock)||0)-(Number(r.comprometido)||0),udsPaquete:Number(r.qpkg)||1,n:N(r.cod+" "+r.desc)}); }); }); }catch(e){}
  const i=document.getElementById("cliInfo"); if(i&&!CLI) i.textContent=CLIENTES_CRM.length?CLIENTES_CRM.length.toLocaleString("es-ES")+" clientes y "+ARTS_CRM.length.toLocaleString("es-ES")+" artículos del CRM cargados: escribe para buscar.":"";
}
const buscarLocal=(L,v,max)=>{ const q=N(v).split(/\s+/).filter(Boolean); if(!q.length) return []; return L.filter(x=>q.every(t=>x.n.includes(t))).slice(0,max||15); };
cargarLocales();
let DB=localStorage.getItem("sap_pedido_db")||"U_CARO_99";   // por defecto, PRUEBAS: cambia a U_CARO_00 cuando esté validado
let KEY=localStorage.getItem("sap_pedido_key")||"";
let CLI=null, LIN=[];
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const eu=(n)=>(Number(n)||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
function pintarDb(){ const p=document.getElementById("dbPill"); p.textContent=DB+(DB==="U_CARO_00"?" · REAL":" · pruebas"); p.className="pill "+(DB==="U_CARO_00"?"real":"test"); }
window.cambiarDb=()=>{ const v=prompt("Base de datos de SAP:\n· U_CARO_99 = pruebas (recomendado hasta validar)\n· U_CARO_00 = REAL",DB); if(v&&/^[A-Z0-9_]+$/i.test(v)){ DB=v.toUpperCase(); localStorage.setItem("sap_pedido_db",DB); pintarDb(); } };
window.guardarKey=async()=>{ KEY=document.getElementById("key").value.trim(); try{ localStorage.setItem("sap_pedido_key",KEY); }catch(e){} await probarApi(true); };
// Comprueba la clave y la conexión con SAP al abrir (y al guardar la clave). Explica qué falla, sin adivinar.
async function probarApi(desdeBoton){ const E=document.getElementById("estadoApi"), K=document.getElementById("keyMsg");
  try{ const r=await fetch(API+"?clientes=zz&db="+encodeURIComponent(DB),{headers:{"x-crm-key":KEY}}); const j=await r.json().catch(()=>({}));
    if(r.status===401){ document.getElementById("cardKey").hidden=false; E.innerHTML='<span style="color:var(--rojo);font-weight:700">✗ La clave guardada no vale.</span> Pon la de SAP_PEDIDOS_KEY de Vercel (si acabas de crearla, hay que redesplegar en Vercel para que la coja).'; if(K) K.textContent=desdeBoton?"Esa clave no vale para la API desplegada.":""; return false; }
    if(!r.ok||j.ok===false){ E.innerHTML='<span style="color:var(--rojo);font-weight:700">✗ La API responde con error:</span> '+esc(j.error||("HTTP "+r.status)); return false; }
    document.getElementById("cardKey").hidden=true; E.innerHTML='<span style="color:var(--verde);font-weight:700">✓ Conectado a SAP · '+esc(j.db||DB)+'</span>'; if(K) K.textContent=""; return true; }
  catch(e){ E.innerHTML='<span style="color:var(--rojo);font-weight:700">✗ No se llega a la API:</span> '+esc(e.message); return false; } }
async function api(url,opts){ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(DB),Object.assign({headers:{"Content-Type":"application/json","x-crm-key":KEY}},opts||{})); const j=await r.json().catch(()=>({ok:false,error:"respuesta no válida"})); if(r.status===401){ document.getElementById("cardKey").hidden=false; throw new Error("clave incorrecta: ponla arriba"); } return j; }
let tCli=null;
window.buscarCli=(v)=>{ CLI=null; document.getElementById("cliInfo").textContent=""; clearTimeout(tCli); if(v.trim().length<2){ document.getElementById("cliSug").hidden=true; return; }
  const S=document.getElementById("cliSug"); const loc=buscarLocal(CLIENTES_CRM,v,15);
  if(loc.length){ S.innerHTML=loc.map(c=>'<div onclick="elegirCli('+esc(JSON.stringify(c)).replace(/"/g,"&quot;")+')"><b>'+esc(c.nombre)+'</b><small>'+esc(c.codigo)+' (CRM '+esc(c.crm)+')'+(c.poblacion?' · '+esc(c.poblacion):'')+'</small></div>').join("")+'<div style="color:var(--muted);font-size:11.5px" onclick="buscarCliSap(\''+esc(v).replace(/'/g,"")+'\')">🔎 Buscar en SAP…</div>'; S.hidden=false; return; }
  tCli=setTimeout(()=>buscarCliSap(v),350); };
window.buscarCliSap=async(v)=>{ try{ const j=await api(API+"?clientes="+encodeURIComponent(v)); const S=document.getElementById("cliSug");
    S.innerHTML=(j.clientes||[]).map(c=>'<div onclick="elegirCli('+esc(JSON.stringify(c)).replace(/"/g,"&quot;")+')"><b>'+esc(c.nombre)+'</b>'+(c.bloqueado?' <span class="pill" style="background:#FEE2E2;color:#991B1B">bloqueado</span>':'')+'<small>'+esc(c.codigo)+(c.cif?' · '+esc(c.cif):'')+' · vendedor '+esc(c.vendedor)+' · tarifa '+esc(c.listaPrecios)+'</small></div>').join("")||'<div style="color:var(--muted)">Sin resultados</div>'; S.hidden=false; }catch(e){ aviso(e.message,false); } };
window.elegirCli=async(c)=>{ CLI=c; document.getElementById("cli").value=c.nombre; document.getElementById("cliSug").hidden=true;
  if(c.vendedor===undefined){ document.getElementById("cliInfo").textContent=c.codigo+" · comprobando en SAP…";
    try{ const j=await api(API+"?clientes="+encodeURIComponent(c.codigo)); const s=(j.clientes||[]).find(x=>x.codigo===c.codigo); if(!s){ document.getElementById("cliInfo").innerHTML='<span style="color:var(--rojo);font-weight:700">'+esc(c.codigo)+' no existe en SAP con ese código: búscalo con «Buscar en SAP»</span>'; CLI=null; return; } CLI=c=Object.assign(c,s); }catch(e){ document.getElementById("cliInfo").textContent=e.message; return; } }
  document.getElementById("cliInfo").innerHTML='<b>'+esc(c.codigo)+'</b> · '+esc(c.nombre)+' · vendedor SAP '+esc(c.vendedor)+' · lista de precios '+esc(c.listaPrecios)+(c.bloqueado?' · <span style="color:var(--rojo);font-weight:700">cliente bloqueado en SAP</span>':'');
  if(!document.getElementById("ven").value) document.getElementById("ven").value=c.vendedor||""; LIN.forEach((l,i)=>{ if(l.articulo&&l.precio==="") cargarPrecio(i); }); };
window.addLinea=()=>{ LIN.push({articulo:"",nombre:"",uds:"",precio:"",entrega:"",stock:null}); pintarLineas(); setTimeout(()=>{ const inputs=document.querySelectorAll("[data-art]"); inputs[inputs.length-1]&&inputs[inputs.length-1].focus(); },0); };
window.quitar=(i)=>{ LIN.splice(i,1); pintarLineas(); };
function pintarLineas(){ const E=document.getElementById("lineas");
  E.innerHTML=LIN.map((l,i)=>'<div class="lin"><div class="rel"><label>Artículo *</label><input data-art="'+i+'" value="'+esc(l.articulo)+'" placeholder="Código o descripción" autocomplete="off" oninput="buscarArt('+i+',this.value)"><div class="sug" id="artSug'+i+'" hidden></div><div class="nm">'+esc(l.nombre||"")+(l.stock!=null?' · libre '+l.stock:'')+'</div></div>'
    +'<div><label>Uds *</label><input type="number" inputmode="decimal" min="0" step="any" value="'+esc(l.uds)+'" oninput="LIN['+i+'].uds=this.value;total()"></div>'
    +'<div><label>Precio</label><input type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(l.precio)+'" placeholder="tarifa" oninput="LIN['+i+'].precio=this.value;total()"></div>'
    +'<div><label>Entrega</label><input type="date" value="'+esc(l.entrega)+'" oninput="LIN['+i+'].entrega=this.value"></div>'
    +'<div><button class="btn sec" style="padding:9px 10px" onclick="quitar('+i+')" title="Quitar">✕</button></div></div>').join("")||'<div style="color:var(--muted);font-size:12.5px;padding:8px 0">Añade al menos una línea.</div>';
  total(); }
let tArt={};
window.buscarArt=(i,v)=>{ LIN[i].articulo=v; LIN[i].nombre=""; LIN[i].stock=null; clearTimeout(tArt[i]); const S=document.getElementById("artSug"+i); if(v.trim().length<2){ S.hidden=true; return; }
  const loc=buscarLocal(ARTS_CRM,v,20);
  if(loc.length){ S.innerHTML=loc.map(a=>'<div onclick="elegirArt('+i+','+esc(JSON.stringify(a)).replace(/"/g,"&quot;")+')"><b>'+esc(a.codigo)+'</b> · '+esc(a.nombre)+'<small>'+(a.calibre&&a.calibre!=="Sin calibre"?'cal. '+esc(a.calibre)+' · ':'')+(a.metros?esc(a.metros)+' m · ':'')+'stock '+esc(a.stock)+' · libre '+esc(a.libre)+(a.udsPaquete>1?' · '+esc(a.udsPaquete)+' uds/paquete':'')+'</small></div>').join("")+'<div style="color:var(--muted);font-size:11.5px" onclick="buscarArtSap('+i+',\''+esc(v).replace(/'/g,"")+'\')">🔎 Buscar en SAP…</div>'; S.hidden=false; return; }
  tArt[i]=setTimeout(()=>buscarArtSap(i,v),350); };
window.buscarArtSap=async(i,v)=>{ const S=document.getElementById("artSug"+i); try{ const j=await api(API+"?articulos="+encodeURIComponent(v));
    S.innerHTML=(j.articulos||[]).map(a=>'<div onclick="elegirArt('+i+','+esc(JSON.stringify(a)).replace(/"/g,"&quot;")+')"><b>'+esc(a.codigo)+'</b> · '+esc(a.nombre)+'<small>'+(a.calibre?'cal. '+esc(a.calibre)+' · ':'')+(a.metros?esc(a.metros)+' m · ':'')+'stock '+esc(a.stock)+' · libre '+esc(a.libre)+(a.udsPaquete>1?' · '+esc(a.udsPaquete)+' uds/paquete':'')+'</small></div>').join("")||'<div style="color:var(--muted)">Sin resultados</div>'; S.hidden=false; }catch(e){ aviso(e.message,false); } };
window.elegirArt=(i,a)=>{ LIN[i].articulo=a.codigo; LIN[i].nombre=a.nombre; LIN[i].stock=a.libre; document.getElementById("artSug"+i).hidden=true; pintarLineas(); if(CLI) cargarPrecio(i); };
async function cargarPrecio(i){ try{ const l=LIN[i]; const j=await api(API+"?precio="+encodeURIComponent(l.articulo)+"&cliente="+encodeURIComponent(CLI.codigo)); if(j.precio!=null&&LIN[i]&&LIN[i].precio===""){ LIN[i].precio=String(j.precio); LIN[i].nombre=(LIN[i].nombre||"")+" · tarifa "+j.precio+" €"; pintarLineas(); } }catch(e){} }
window.total=()=>{ const t=LIN.reduce((s,l)=>s+(Number(l.uds)||0)*(Number(l.precio)||0),0); document.getElementById("total").textContent=eu(t); };
function aviso(t,ok){ document.getElementById("msg").innerHTML='<div class="msg '+(ok?'ok':'ko')+'">'+esc(t)+'</div>'; }
function armar(){ if(!CLI) throw new Error("Elige un cliente de la lista"); const entrega=document.getElementById("entrega").value; if(!entrega) throw new Error("Pon la fecha de entrega");
  const L=LIN.filter(l=>l.articulo&&Number(l.uds)>0); if(!L.length) throw new Error("Añade al menos una línea con artículo y unidades");
  return {db:DB,pedido:{cliente:CLI.codigo,entrega,comentario:document.getElementById("com").value,vendedor:document.getElementById("ven").value,refCliente:document.getElementById("ref").value,
    lineas:L.map(l=>({articulo:l.articulo,uds:Number(l.uds),precio:l.precio===""?null:Number(l.precio),entrega:l.entrega||entrega}))}}; }
window.revisar=()=>{ try{ const p=armar(); document.getElementById("res").hidden=false; document.getElementById("res").textContent="Se enviará a SAP ("+DB+"):\n"+JSON.stringify(p.pedido,null,2); aviso("Revisa y pulsa Enviar a SAP",true); }catch(e){ aviso(e.message,false); } };
window.enviar=async()=>{ let p; try{ p=armar(); }catch(e){ aviso(e.message,false); return; }
  if(DB==="U_CARO_00"&&!confirm("Vas a crear un pedido REAL en SAP para "+CLI.nombre+" por "+document.getElementById("total").textContent+". ¿Seguro?")) return;
  const b=document.getElementById("btnEnviar"); b.disabled=true; b.textContent="Enviando…"; aviso("Enviando a SAP…",true);
  try{ const j=await api(API,{method:"POST",body:JSON.stringify(p)}); document.getElementById("res").hidden=false; document.getElementById("res").textContent=JSON.stringify(j.creado||j,null,2);
    if(j.ok){ aviso("✅ "+j.mensaje+" · total "+eu(j.creado.DocTotal),true); } else aviso("❌ "+(j.error||"error"),false); }
  catch(e){ aviso("❌ "+e.message,false); }
  b.disabled=false; b.textContent="📤 Enviar a SAP"; };
window.limpiar=()=>{ CLI=null; LIN=[]; ["cli","ven","ref","com","entrega"].forEach(id=>document.getElementById(id).value=""); document.getElementById("cliInfo").textContent=""; document.getElementById("msg").innerHTML=""; document.getElementById("res").hidden=true; addLinea(); };
document.addEventListener("click",(e)=>{ if(!e.target.closest(".rel")) document.querySelectorAll(".sug").forEach(s=>s.hidden=true); });
pintarDb(); if(!KEY) document.getElementById("cardKey").hidden=false; probarApi(false); addLinea();
</script></body></html>
