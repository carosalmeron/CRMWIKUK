<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusionar Jperez → Piniesta</title>
<style>
 :root{--papel:#F2F4F7;--tinta:#14181F;--tenue:#6B7684;--linea:#DCE1E7;
       --ok:#0E7C5A;--mal:#C2263D;--med:#B07908;--okL:#EDF7F3;--malL:#FEF2F4;--medL:#FFFBEB}
 *{box-sizing:border-box}
 body{margin:0;background:var(--papel);color:var(--tinta);max-width:760px;
   margin-inline:auto;padding:20px 14px 50px;
   font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 h1{margin:0 0 3px;font-size:21px;font-weight:800}
 .sub{margin:0 0 16px;font-size:13px;color:var(--tenue)}
 h2{font-size:15px;margin:22px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--linea)}
 .card{background:#fff;border:1px solid var(--linea);border-radius:8px;
   padding:13px 14px;margin-bottom:9px;font-size:13.5px}
 .card.ok{border-color:var(--ok);background:var(--okL)}
 .card.med{border-color:var(--med);background:var(--medL)}
 .card.mal{border-color:var(--mal);background:var(--malL)}
 code{background:#F1F5F9;padding:1px 6px;border-radius:4px;font-size:12px;
   font-family:ui-monospace,monospace}
 table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;
   border:1px solid var(--linea);border-radius:8px;overflow:hidden}
 th{background:#F1F5F9;text-align:left;padding:8px;font-size:10.5px;
   text-transform:uppercase;color:var(--tenue)}
 td{padding:8px;border-top:1px solid var(--linea)}
 button{padding:12px 20px;border-radius:9px;border:none;background:var(--tinta);
   color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:12px}
 button:disabled{background:#94A3B8;cursor:default}
 .estado{padding:30px 4px;color:var(--tenue);text-align:center}
 .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
</style></head><body>
<h1>🔗 Fusionar Jperez → Piniesta</h1>
<p class="sub">Son la misma persona con dos fichas: <code>jperez</code> se creó
  desde el código de vendedor y <code>u_1779125110944</code> es la del portal,
  con su nombre real. Se conserva la ficha del CRM y se le pone el nombre bueno.</p>
<div id="app"><p class="estado">Analizando…</p></div>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const U=(s)=>String(s||"").toUpperCase().trim();
const NORM=(s)=>U(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");

// La ficha que se conserva y la que aporta el nombre real
const CANON="jperez";
const NOMBRE="Piniesta";
const ALIAS=["jperez","JPEREZ","u_1779125110944","pablo","Piniesta"];

function val(f){
  if(!f) return null;
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  return null;
}
async function leer(col,max=15){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<max);
  return t;
}

(async()=>{
  const app=document.getElementById("app");
  try{
    // Cuántos documentos arrastra cada alias
    const claves=new Set(ALIAS.map(NORM));
    const cols=[["visitas",["agente"]],["muestras",["agente"]],
      ["ofertas",["agente","responsableComercial"]],["estrategias",["agente"]],
      ["informes",["agente"]],["planes_semanales",["agente"]]];
    const cuenta={};
    for(const [c,campos] of cols){
      const docs=await leer(c,10);
      docs.forEach(d=>campos.forEach(k=>{
        const v=d[k]; if(!v) return;
        const n=NORM(v);
        if(claves.has(n)) cuenta[v]=(cuenta[v]||0)+1;
      }));
    }

    let h='<h2>Lo que se va a hacer</h2>'
      +'<div class="card"><b>1.</b> La ficha <code>jperez</code> pasa a llamarse '
      +'<b>Piniesta</b> (el nombre real, no el código de vendedor).<br><br>'
      +'<b>2.</b> Se registran sus alias en <code>agentes_alias</code>, para que '
      +'sus datos del portal se le atribuyan:<br>'
      +ALIAS.map(a=>'<code>'+a+'</code>').join(" ")
      +'<br><br><b>3.</b> No se borra ninguna ficha ni ningún dato.</div>';

    h+='<h2>Documentos que arrastra</h2>';
    const total=Object.values(cuenta).reduce((a,b)=>a+b,0);
    h+= total
      ? '<table><thead><tr><th>Aparece como</th><th>Documentos</th></tr></thead><tbody>'
        +Object.entries(cuenta).sort((a,b)=>b[1]-a[1])
          .map(([k,v])=>'<tr><td><code>'+k+'</code></td><td class="n">'+v+'</td></tr>').join("")
        +'</tbody></table>'
        +'<p class="sub" style="margin-top:8px">Tras la fusión, todos contarán '
        +'como de Piniesta.</p>'
      : '<div class="card">No se han encontrado documentos con esos códigos.</div>';

    h+='<button onclick="fusionar()" id="btn">Fusionar</button>';
    app.innerHTML=h;
  }catch(e){
    app.innerHTML='<div class="card mal">Error: '+e.message+'</div>';
  }
})();

window.fusionar=async()=>{
  if(!confirm("Se renombra la ficha jperez a \"Piniesta\" y se registran sus "
    +"alias.\n\nNo se borra nada. ¿Seguimos?")) return;
  const btn=document.getElementById("btn");
  btn.disabled=true; btn.textContent="Fusionando…";
  let err=[];
  try{
    // 1 · Renombrar la ficha del CRM
    const r=await fetch(FB+"/usuarios/"+CANON
      +"?updateMask.fieldPaths=nombre&updateMask.fieldPaths=username",{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:{
        nombre:{stringValue:NOMBRE},
        username:{stringValue:"pablo"}
      }})});
    if(!r.ok) err.push("usuarios: HTTP "+r.status);

    // 2 · Sus alias, para que todo lo suyo cruce
    for(const a of ALIAS){
      const al=NORM(a);
      const rr=await fetch(FB+"/agentes_alias/"+encodeURIComponent(al),{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          alias:{stringValue:al}, original:{stringValue:a},
          canonico:{stringValue:CANON}, nombre:{stringValue:NOMBRE},
          equipo:{stringValue:"WIKUK"},
          origen:{stringValue:"fusion_manual"},
          actualizado:{stringValue:new Date().toISOString()}
        }})});
      if(!rr.ok) err.push("alias "+al+": HTTP "+rr.status);
    }

    // 3 · Marcar la ficha del portal como fusionada, sin borrarla
    await fetch(FB+"/portal_users/u_1779125110944"
      +"?updateMask.fieldPaths=crmId&updateMask.fieldPaths=fusionadoEn",{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:{
        crmId:{stringValue:CANON},
        fusionadoEn:{stringValue:CANON}
      }})}).catch(()=>{});

    btn.textContent = err.length ? "Hecho con "+err.length+" errores" : "✓ Fusionado";
    if(err.length){ btn.disabled=false; alert(err.join("\n")); }
    else document.getElementById("app").insertAdjacentHTML("beforeend",
      '<div class="card ok" style="margin-top:12px"><b>Listo.</b> La ficha ya '
      +'aparece como <b>Piniesta</b> y sus datos del portal se le atribuyen. '
      +'Recarga el CRM para verlo.</div>');
  }catch(e){
    btn.disabled=false; btn.textContent="Fusionar";
    alert("Error: "+e.message);
  }
};
</script></body></html>
