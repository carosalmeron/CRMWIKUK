<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producción y Compras · Pedidos</title>
<style>
:root{--t:#0F172A;--g:#64748B;--l:#E2E8F0;--v:#15803D;--vb:#DCFCE7;--r:#B91C1C;--rb:#FEE2E2;--a:#B45309;--ab:#FEF3C7;--z:#1D4ED8;--zb:#DBEAFE}
*{box-sizing:border-box}body{margin:0;font:19px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:#F1F5F9;color:var(--t)}
.top{background:#fff;border-bottom:1px solid var(--l);padding:12px 16px;position:sticky;top:0;z-index:5}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:26px;margin:0;flex:1}
.pill{font-size:14px;font-weight:800;border-radius:99px;padding:5px 12px;border:0}.pv{background:var(--rb);color:var(--r)}.pp{background:var(--ab);color:var(--a)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.dias{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.dia{font:inherit;font-weight:800;font-size:17px;border:2px solid var(--l);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--t)}
.dia.on{background:var(--t);color:#fff;border-color:var(--t)}.dia.rojo{border-color:#FCA5A5;color:var(--r)}.dia.rojo.on{background:var(--r);color:#fff}
.dias input{font:inherit;font-size:17px;padding:9px 10px;border:2px solid var(--l);border-radius:12px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.res>div{background:#fff;border:2px solid var(--l);border-radius:14px;padding:10px 12px;font-weight:800;font-size:16px;cursor:pointer}.res b{display:block;font-size:28px}
.tab{border:2px solid var(--l);background:#fff;border-radius:14px;padding:10px 6px;text-align:center;font-weight:800;font-size:16px;cursor:pointer;color:var(--t)}
.tab b{display:block;font-size:34px;line-height:1.1}
.tab.on{border-color:var(--t);background:var(--t);color:#fff}
.w{max-width:980px;margin:0 auto;padding:14px 16px 90px}
input.bus{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:2px solid var(--l);border-radius:14px;margin:4px 0 12px}
.ped{background:#fff;border:2px solid var(--l);border-radius:18px;margin-bottom:14px;overflow:hidden}
.ped.bloq{border-color:#FCA5A5}
.cab{padding:14px 16px;cursor:pointer}
.cli{font-size:23px;font-weight:800}
.meta{color:var(--g);font-size:17px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ch{font-size:15px;font-weight:800;border-radius:9px;padding:4px 10px}
.cv{background:var(--vb);color:var(--v)}.cr{background:var(--rb);color:var(--r)}.ca{background:var(--ab);color:var(--a)}.cz{background:var(--zb);color:var(--z)}.cg{background:#F1F5F9;color:#334155}
.cuerpo{border-top:2px solid var(--l);padding:6px 16px 16px;background:#FAFBFC}
.lin{background:#fff;border:2px solid var(--l);border-left-width:10px;border-radius:14px;padding:12px 14px;margin-top:10px}
.lin.ok{border-left-color:#22C55E}.lin.no{border-left-color:#EF4444}.lin.es{border-left-color:#F59E0B}.lin.re{border-left-color:#3B82F6}
.art{font-weight:800;font-size:20px}.desc{color:var(--g);font-size:16px}
.dice{font-size:20px;margin-top:6px}
.sub{font-size:16px;color:#334155;margin-top:4px}
.bt{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;color:#fff;background:var(--t)}
.bt.v{background:#16A34A}.bt.z{background:#2563EB}.bt.a{background:#D97706}.bt.g{background:#fff;color:var(--t);border:2px solid var(--l)}
.bt:disabled{opacity:.4}
.btl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.acc .bt{flex:1;min-width:200px;font-size:20px;padding:16px}
.nada{text-align:center;color:var(--g);padding:40px 10px;font-size:20px}
.tot{background:#fff;border:2px solid var(--l);border-radius:14px;padding:12px 16px;font-weight:800;font-size:18px}
.velo{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.dlg{background:#fff;border-radius:20px;max-width:560px;width:100%;padding:22px;max-height:92vh;overflow:auto}
.dlg h2{margin:0 0 8px;font-size:25px}.dlg p{font-size:19px;margin:6px 0}
.dlg textarea,.dlg input[type=date]{width:100%;font:inherit;font-size:20px;padding:14px;border:2px solid var(--l);border-radius:12px;margin-top:8px}
.op{display:block;width:100%;text-align:left;margin-top:8px;font-size:20px}
.op.on{outline:4px solid #2563EB}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;font-weight:800;font-size:19px;padding:14px 20px;border-radius:14px;max-width:92%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.carg{text-align:center;padding:40px;font-size:21px;color:var(--g)}
@media(max-width:640px){body{font-size:18px}.tabs{gap:5px}.tab{font-size:12px;padding:8px 1px}.tab b{font-size:26px}h1{font-size:22px}.cli{font-size:21px}}
.cen{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
.cen button{flex:0 0 auto;font:inherit;font-weight:800;font-size:17px;border:2px solid var(--l);background:#fff;border-radius:99px;padding:9px 16px;cursor:pointer;color:var(--t)}
.cen button.on{background:#B45309;border-color:#B45309;color:#fff}
.cen button b{background:#FEF3C7;color:#92400E;border-radius:99px;padding:0 8px;margin-left:6px}.cen button.on b{background:#fff}
select.sel{width:100%;font:inherit;font-size:19px;padding:13px;border:2px solid var(--l);border-radius:12px;margin-top:8px;background:#fff}
input.num{width:100%;font:inherit;font-size:24px;font-weight:800;padding:12px;border:2px solid var(--l);border-radius:12px;margin-top:8px}
</style></head><body>
<div class="top"><div class="fila"><h1>🏭 Producción y Compras</h1>
<button class="pill" id="dbPill" onclick="cambiarDb()"></button>
<button class="bt g" style="padding:9px 14px;font-size:16px" onclick="cargar()">🔄 Actualizar</button></div>
<div class="cen" id="cen"></div>
<div class="tabs" id="tabs"></div></div>
<div class="w"><input class="bus" id="bus" placeholder="🔎 Buscar artículo, cliente o nº de pedido" oninput="pintar()"><div id="lista"><div class="carg">Cargando pedidos de SAP…</div></div></div>
<script>/* pase SAP: lo da el portal al entrar */
(function(){
  // Pase de SAP: lo da el portal al entrar (usuario y contraseña del portal, una vez cada 30 días).
  // Aquí no se pide ninguna contraseña: si falta el pase, se explica y se ofrece salir y volver a entrar.
  var K='sap_pedido_key';
  function galleta(){ var m=/(?:^|;\s*)sap_pase=([^;]+)/.exec(document.cookie||'')||/(?:^|;\s*)cs_pase=([^;]+)/.exec(document.cookie||''); return m?decodeURIComponent(m[1]):''; }
  function get(){ var t=''; try{ t=localStorage.getItem(K)||''; }catch(e){} return exp(t)>Date.now()?t:galleta(); }
  function exp(t){ var m=/^crm\.([A-Za-z0-9_-]+)\./.exec(t||''); if(!m) return 0; try{ return JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))).exp||0; }catch(e){ return 0; } }
  var abierto=false;
  function ventana(motivo){
    if(abierto) return; abierto=true;
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif');
    d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:380px;width:100%;padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.3)">'
      +'<div style="font-weight:800;font-size:18px">🔐 Falta el permiso de SAP</div>'
      +'<div style="font-size:14px;color:#334155;margin:8px 0 14px;line-height:1.45">'+(motivo||'Este aparato todavía no tiene permiso para SAP.')+'<br><br>Sal del portal y vuelve a entrar con tu usuario: el permiso se activa solo y dura 30 días.'+(function(){ var e=''; try{ e=localStorage.getItem('sap_pase_error')||''; }catch(x){} return e?'<div style="margin-top:10px;background:#FEE2E2;color:#991B1B;border-radius:8px;padding:8px;font-weight:700">Último intento: '+String(e).replace(/[<>&]/g,'')+'</div>':''; })()+'</div>'
      +'<button id="sp_out" style="width:100%;font-size:17px;font-weight:800;padding:12px;border:0;border-radius:10px;background:#0F172A;color:#fff">Salir y volver a entrar</button>'
      +'<button id="sp_x" style="width:100%;font-size:15px;font-weight:700;padding:10px;border:0;background:transparent;color:#64748B;margin-top:6px">Ahora no</button></div>';
    document.body.appendChild(d);
    document.getElementById('sp_x').onclick=function(){ d.remove(); abierto=false; };
    document.getElementById('sp_out').onclick=function(){
      try{ localStorage.removeItem(K); localStorage.removeItem('gc_portal_user'); }catch(e){}
      try{ if(window.top&&window.top.doLogout){ window.top.doLogout(); return; } }catch(e){}
      try{ window.top.location.href='/'; }catch(e){ location.href='/'; }
    };
  }
  // Intento automático: con la sesión del portal abierta en ESTE navegador (gc_portal_user), se lee la ficha del usuario
  // y se pide el pase sin preguntar nada. Así funciona en Safari, Chrome o cualquier navegador donde se haya entrado al portal.
  async function auto(){
    var pu=null; try{ pu=JSON.parse(localStorage.getItem('gc_portal_user')||'null'); if(!pu||!pu.id){ var sid=localStorage.getItem('sap_portal_id')||decodeURIComponent((/(?:^|;\s*)sap_portal_id=([^;]+)/.exec(document.cookie)||[])[1]||''); if(sid) pu={id:sid}; } }catch(e){}
    if(!pu||!pu.id) return 'no hay sesión del portal en este navegador';
    var h=pu.passHash||'';
    if(!h){ try{ var FB='https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents';
      for(var col of ['portal_users','usuarios']){ var r=await fetch(FB+'/'+col+'/'+encodeURIComponent(pu.id)); if(!r.ok) continue; var j=await r.json(); var f=(j.fields||{}).passHash; if(f&&f.stringValue){ h=f.stringValue; break; } } }catch(e){} }
    if(!h) return 'no encuentro la ficha del usuario '+pu.id;
    try{ var r2=await fetch('/api/sap-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:pu.id,passHash:h})});
      var j2=await r2.json().catch(function(){ return {ok:false,error:'HTTP '+r2.status}; });
      if(j2&&j2.ok&&j2.token){ try{ localStorage.setItem(K,j2.token); localStorage.removeItem('sap_pase_error'); }catch(e){} return ''; }
      return (j2&&j2.error)||'sin respuesta'; }catch(e){ return 'no se llega al servidor: '+e.message; } }
  var intentado=false;
  async function resolver(motivo){
    if(!intentado){ intentado=true; var err=await auto(); if(!err){ location.reload(); return; } try{ localStorage.setItem('sap_pase_error',err); }catch(e){} }
    ventana(motivo);
  }
  window.pedirPaseSap=resolver;
  var f0=window.fetch;
  window.fetch=function(u,o){ return f0.apply(this,arguments).then(function(r){ try{ if(r.status===401&&/\/api\/sap-(pedido|factura|produccion|traslado|planificacion|cs)/.test(String(u&&u.url||u))) setTimeout(function(){ resolver(exp(get())?'El permiso guardado ya no vale.':''); },0); }catch(e){} return r; }); };
  if(!(exp(get())>Date.now())){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ resolver(); }); else resolver(); }
})();
</script>
<script>
const API="/api/sap-cs";
const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
let DB=LS("cs_db_real")||"U_CARO_00", TAB="pend", CEN=LS("pc_centro")||"", LIN=[], TIPOS={}, ALMS=[];
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fx=(d)=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7)+"/"+String(d).slice(0,4):"—";
const n=(v)=>(Math.round((Number(v)||0)*100)/100).toLocaleString("es-ES");
const eur=(v)=>(Number(v)||0).toLocaleString("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const HOY=new Date().toISOString().slice(0,10);
const dias=(d)=>d?Math.round((new Date(HOY)-new Date(String(d).slice(0,10)))/864e5):0;
const hace=(d)=>{ const x=dias(d); return x<=0?"hoy":x===1?"ayer":"hace "+x+" días"; };
const PROD=["1","2","3","6","7"];
const TB={pend:["⏳","Por confirmar","Contestar en 24 h"],cs:["🔁","En Customer Service","Esperando su aprobación"],conf:["✅","Aprobado","Siguiente paso"],hecho:["🏭","Ordenados","Ya en marcha"]};
// Confirmado por producción/compras (2) → Customer Service lo reconfirma con el cliente (pedido confirmado) → siguiente paso
const tabDe=(l)=>["0","1"].includes(l.sol.estado)?"pend":l.sol.estado==="2"?(l.p.confirmado?"conf":"cs"):"hecho";
function pill(){ const p=document.getElementById("dbPill"); p.textContent=DB==="U_CARO_00"?"SAP REAL":"SAP PRUEBAS"; p.className="pill "+(DB==="U_CARO_00"?"pv":"pp"); }
window.cambiarDb=()=>dialogo('<h2>¿Qué SAP?</h2><button class="bt a op" onclick="ponDb(\'U_CARO_99\')">🧪 Pruebas · U_CARO_99</button><button class="bt op" style="background:#B91C1C" onclick="ponDb(\'U_CARO_00\')">⚠️ Real · U_CARO_00</button><button class="bt g op" onclick="cerrar()">Cancelar</button>');
window.ponDb=(d)=>{ DB=d; LS("cs_db_real",d); LIN=[]; cerrar(); pill(); cargar(); };
async function api(url,opts){ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(DB),Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json","x-crm-key":LS("sap_pedido_key")||""}},opts||{})); return r.json().catch(()=>({ok:false,error:"sin respuesta del servidor (HTTP "+r.status+")"})); }
function aviso(t,ok){ const d=document.createElement("div"); d.className="msg"; d.style.background=ok?"#16A34A":"#B91C1C"; d.style.color="#fff"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ok?4000:9000); }
function marcaCarga(t){ let m=document.getElementById("cargando"); if(!m){ m=document.createElement("div"); m.id="cargando"; m.setAttribute("style","margin-top:8px;font-size:15px;font-weight:700;color:#1D4ED8"); document.querySelector(".top").appendChild(m); } m.textContent=t||""; m.hidden=!t; }
function aplicar(j){ TIPOS=j.tipos||{}; LIN=[];
  (j.pedidos||[]).forEach(p=>(p.lineas||[]).forEach(l=>{ if(l.sol&&l.sol.estado!=="4") LIN.push(Object.assign({},l,{p})); })); pintar(); }
async function cargar(){
  let copia=false; if(!LIN.length){ try{ const c=JSON.parse(sessionStorage.getItem("pc_cache_"+DB)||"null"); if(c&&c.pedidos){ aplicar(c); copia=true; } }catch(e){} }
  if(!copia&&!LIN.length) document.getElementById("lista").innerHTML='<div class="carg">Cargando pedidos de SAP…</div>';
  const t0=Date.now(), reloj=setInterval(()=>marcaCarga("🔄 Actualizando desde SAP… "+Math.round((Date.now()-t0)/1000)+" s"),1000); marcaCarga("🔄 Actualizando desde SAP…");
  const j=await api(API+"?pedidos=1&solo=prod"); clearInterval(reloj);
  if(!j.ok){ marcaCarga(""); if(LIN.length) return aviso("No se ha podido actualizar: "+(j.error||""),false); document.getElementById("lista").innerHTML='<div class="nada" style="color:#B91C1C">No se han podido leer los pedidos:<br><b>'+esc(j.error)+'</b></div>'; return; }
  try{ sessionStorage.setItem("pc_cache_"+DB,JSON.stringify(j)); }catch(e){}
  marcaCarga("✓ Actualizado a las "+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})); aplicar(j); }
window.ponCen=(c)=>{ CEN=c; LS("pc_centro",c); pintar(); };
window.verTab=(t)=>{ TAB=t; pintar(); };
function lineaH(l,i){ const p=l.p, s=l.sol, esProd=PROD.includes(s.tipo), esComp=s.tipo==="5", falta=Math.max(0,l.pide-Math.max(0,l.libre)), espera=dias(p.actualizado||p.fecha), tab=tabDe(l);
  const chips=['<span class="ch cg">'+esc(s.quien)+'</span>'];
  if(tab==="pend") chips.push('<span class="ch '+(espera>=1?'cr':'ca')+'">'+(espera>=1?'⏰ Sin contestar · ':'⏳ ')+esc(s.estadoN)+' · '+hace(p.actualizado||p.fecha)+'</span>');
  if(tab==="cs") chips.push('<span class="ch cz">🔁 Fecha propuesta '+fx(l.entrega)+' · esperando que Customer Service lo apruebe con el cliente</span>');
  if(tab==="conf") chips.push('<span class="ch cv">✅ Aprobado por Customer Service para el '+fx(l.entrega)+' · ¡adelante!</span>');
  if(tab==="hecho") chips.push('<span class="ch cz">🏭 '+esc(s.estadoN)+'</span>');
  if(p.pideComercial) chips.push('<span class="ch '+(p.pideComercial<=HOY?'cr':'cg')+'">📅 El cliente lo quiere el '+fx(p.pideComercial)+'</span>');
  const ll=(l.llegadas||[]);
  let bts="";
  if(tab==="pend") bts='<button class="bt v" onclick="dlgConf('+i+')">📅 Confirmar o proponer fecha</button>'+(s.estado==="0"?'<button class="bt a" onclick="enProceso('+i+')">⏳ En proceso</button>':'')+'<button class="bt z" onclick="dlgReas('+i+')">🔀 Pasar a otro centro</button><button class="bt g" onclick="dlgDev('+i+')">↩️ Devolver a CS</button>';
  if(tab==="conf") bts=esProd?'<button class="bt a" onclick="dlgOrden('+i+')">🏭 Ordenar producción</button>':esComp?'<button class="bt z" onclick="dlgCompra('+i+')">🛒 Compra pedida</button>':'';
  if(tab==="conf"||tab==="cs") bts+='<button class="bt g" onclick="dlgConf('+i+')">📅 Cambiar fecha</button>';
  return '<div class="ped"><div class="cab" style="cursor:default"><div class="cli">'+esc(l.articulo)+' <span class="desc">'+esc(l.descripcion||"")+'</span></div>'
   +'<div class="dice" style="font-size:22px;margin-top:4px">Piden <b>'+n(l.pide)+' '+esc(l.ud)+'</b> · hay <b>'+n(Math.max(0,l.libre))+'</b> libres en '+esc(l.alm)+(falta>0?' → <b style="color:#B91C1C">faltan '+n(falta)+'</b>':'')+'</div>'
   +'<div class="meta">'+esc(p.nombre)+' · pedido <b>'+p.num+'</b> · '+esc(p.vendedor||"")+' · entró el '+fx(p.fecha)+'</div>'
   +(s.detalle?'<div class="sub" style="font-size:18px;margin-top:6px">💬 '+esc(s.detalle)+'</div>':'')
   +(ll.length?'<div class="sub">🚚 Entra: '+ll.map(x=>fx(x.fecha)+' · '+n(x.uds)+' ('+esc(x.de)+')').join(' · ')+'</div>':'')
   +'<div class="chips">'+chips.join("")+'</div>'+(bts?'<div class="acc">'+bts+'</div>':'')+'</div></div>'; }
let VIS=[];
function pintar(){ pill();
  const cent=[...new Set(LIN.map(l=>l.sol.tipo))].sort((a,b)=>(a==="5")-(b==="5")||a.localeCompare(b));
  const pend=(c)=>LIN.filter(l=>(!c||l.sol.tipo===c)&&tabDe(l)!=="hecho").length;
  if(CEN&&!cent.includes(CEN)) CEN="";
  document.getElementById("cen").innerHTML='<button class="'+(CEN?'':'on')+'" onclick="ponCen(\'\')">Todos<b>'+pend("")+'</b></button>'+cent.map(c=>'<button class="'+(CEN===c?'on':'')+'" onclick="ponCen(\''+c+'\')">'+(c==="5"?'🛒 ':'🏭 ')+esc(TIPOS[c]||c)+'<b>'+pend(c)+'</b></button>').join("");
  const base=LIN.filter(l=>!CEN||l.sol.tipo===CEN), cnt={pend:0,cs:0,conf:0,hecho:0}; base.forEach(l=>cnt[tabDe(l)]++);
  document.getElementById("tabs").innerHTML=Object.keys(TB).map(k=>'<div class="tab'+(TAB===k?' on':'')+'" onclick="verTab(\''+k+'\')"><b>'+cnt[k]+'</b>'+TB[k][0]+' '+TB[k][1]+'</div>').join("");
  const q=document.getElementById("bus").value.trim().toLowerCase();
  VIS=base.filter(l=>tabDe(l)===TAB).filter(l=>!q||(l.articulo+" "+l.descripcion+" "+l.p.nombre+" "+l.p.num).toLowerCase().includes(q));
  VIS.sort((a,b)=>String(a.p.pideComercial||a.entrega||"9").localeCompare(String(b.p.pideComercial||b.entrega||"9"))||a.p.num-b.p.num);
  const uds=VIS.reduce((t,l)=>t+(Number(l.pide)||0),0);
  document.getElementById("lista").innerHTML=VIS.length?VIS.map(lineaH).join("")+'<div class="tot">Total: '+VIS.length+' artículo'+(VIS.length>1?'s':'')+' · '+n(uds)+' uds · '+eur(VIS.reduce((t,l)=>t+l.importe,0))+'</div>':'<div class="nada">'+TB[TAB][0]+' No hay nada aquí'+(CEN?' para '+esc(TIPOS[CEN]||CEN):'')+'.</div>'; }
/* ---------- diálogos ---------- */
function dialogo(h){ cerrar(); const d=document.createElement("div"); d.className="velo"; d.id="velo"; d.innerHTML='<div class="dlg">'+h+'</div>'; d.onclick=(e)=>{ if(e.target===d) cerrar(); }; document.body.appendChild(d); }
window.cerrar=()=>{ const d=document.getElementById("velo"); if(d) d.remove(); };
const cab=(l)=>'<p><b>'+esc(l.articulo)+'</b> · '+n(l.pide)+' '+esc(l.ud)+'<br>'+esc(l.p.nombre)+' · pedido '+l.p.num+(l.p.pideComercial?'<br>El cliente lo quiere el <b>'+fx(l.p.pideComercial)+'</b>':'')+'</p>';
async function escribir(body,boton){ if(boton){ boton.disabled=true; boton.textContent="Escribiendo en SAP…"; }
  const j=await api(API,{method:"POST",body:JSON.stringify(body)}); cerrar();
  if(j.ok){ aviso("✅ "+(j.mensaje||"Hecho"),true); cargar(); } else aviso("❌ SAP no lo ha aceptado: "+(j.error||"error"),false); }
const ids=(l)=>({entry:l.p.entry,linea:l.linea});
window.dlgConf=(i)=>{ const l=VIS[i]; const ini=(l.entrega&&l.entrega>=HOY)?l.entrega:(l.p.pideComercial&&l.p.pideComercial>=HOY?l.p.pideComercial:HOY);
  dialogo('<h2>📅 ¿Cuándo estará listo?</h2>'+cab(l)+(l.p.pideComercial?'<button class="bt v op" onclick="ponF(\''+(l.p.pideComercial>=HOY?l.p.pideComercial:HOY)+'\')">👍 Sí llegamos al '+fx(l.p.pideComercial>=HOY?l.p.pideComercial:HOY)+'</button>':'')+'<p><b>O propón otra fecha</b></p><input type="date" id="f" min="'+HOY+'" value="'+ini+'" oninput="compara('+i+')"><div id="cmp" style="font-weight:800;font-size:18px;margin-top:8px"></div><p><b>Nota</b> (opcional)</p><textarea id="nt" rows="2" placeholder="Ej.: fabricamos el martes en turno de mañana"></textarea>'
   +'<button class="bt v op" onclick="enviarConf('+i+',this)">Guardar fecha en SAP</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); compara(i); };
window.ponF=(f)=>{ document.getElementById("f").value=f; document.getElementById("f").dispatchEvent(new Event("input")); };
window.compara=(i)=>{ const l=VIS[i], f=document.getElementById("f").value, q=l.p.pideComercial, c=document.getElementById("cmp"); if(!c) return; if(!f||!q){ c.textContent=""; return; } const d=Math.round((new Date(f)-new Date(q))/864e5); c.style.color=d>0?"#B91C1C":"#15803D"; c.textContent=d>0?"⚠️ "+d+" día"+(d>1?"s":"")+" más tarde de lo que quiere el cliente: Customer Service se lo reconfirmará":"✅ Llega a tiempo para el cliente"; };
window.enviarConf=(i,b)=>{ const f=document.getElementById("f").value; if(!f) return aviso("Pon la fecha",false); escribir(Object.assign({accion:"confirmar",fecha:f,nota:document.getElementById("nt").value.trim()},ids(VIS[i])),b); };
window.enProceso=(i)=>{ const l=VIS[i]; dialogo('<h2>⏳ En proceso</h2>'+cab(l)+'<p>Customer Service verá que lo estáis mirando.</p><button class="bt a op" onclick="escribir(Object.assign({accion:\'en_proceso\'},ids(VIS['+i+'])),this)">Sí, en proceso</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.dlgDev=(i)=>{ const l=VIS[i]; dialogo('<h2>↩️ Devolver a Customer Service</h2>'+cab(l)+'<p><b>¿Por qué?</b> (obligatorio)</p><textarea id="mt" rows="3" placeholder="Ej.: no lo fabricamos aquí, mandar a Lleida"></textarea><button class="bt op" onclick="enviarDev('+i+',this)">Devolver</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.enviarDev=(i,b)=>{ const m=document.getElementById("mt").value.trim(); if(m.length<3) return aviso("Escribe el motivo",false); escribir(Object.assign({accion:"devolver",motivo:m},ids(VIS[i])),b); };
let REAS=null;
window.dlgReas=(i)=>{ const l=VIS[i]; REAS={i,tipo:""};
  const op=["1","2","3","6","7","5","4"].filter(t=>TIPOS[t]&&t!==l.sol.tipo);
  dialogo('<h2>🔀 Pasar a otro centro</h2>'+cab(l)+'<p>Ahora está en <b>'+esc(l.sol.quien)+'</b>. ¿A quién se lo pasas?</p>'
   +op.map(t=>'<button class="bt g op" id="rt'+t+'" onclick="elegirReas(\''+t+'\')">'+(t==="5"?'🛒 ':'🏭 ')+esc(TIPOS[t])+'</button>').join("")
   +'<p><b>Nota</b> (opcional)</p><textarea id="rm" rows="2" placeholder="Ej.: esto lo fabrica Baza Fresca"></textarea>'
   +'<button class="bt z op" onclick="enviarReas(this)">Pasar</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.elegirReas=(t)=>{ REAS.tipo=t; document.querySelectorAll(".op[id^=rt]").forEach(b=>b.classList.toggle("on",b.id==="rt"+t)); };
window.enviarReas=(b)=>{ if(!REAS.tipo) return aviso("Elige a quién se pasa",false); escribir(Object.assign({accion:"reasignar",tipo:REAS.tipo,motivo:document.getElementById("rm").value.trim()},ids(VIS[REAS.i])),b); };
window.dlgCompra=(i)=>{ const l=VIS[i]; dialogo('<h2>🛒 Compra pedida</h2>'+cab(l)+'<p><b>Nº de pedido de compra o proveedor</b> (opcional)</p><textarea id="nt" rows="2"></textarea><button class="bt z op" onclick="escribir(Object.assign({accion:\'compra_hecha\',nota:document.getElementById(\'nt\').value.trim()},ids(VIS['+i+'])),this)">Guardar en SAP</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.dlgOrden=async(i)=>{ const l=VIS[i], falta=Math.max(0,l.pide-Math.max(0,l.libre)), uds=falta>0?falta:l.pide, fe=(l.entrega&&l.entrega>=HOY)?l.entrega:HOY;
  if(!ALMS.length){ dialogo('<h2>Cargando almacenes…</h2>'); const j=await api(API+"?almacenes=1"); ALMS=j.almacenes||[]; }
  const def=LS("pc_alm_"+l.sol.tipo)||l.alm;
  dialogo('<h2>🏭 Ordenar producción</h2>'+cab(l)+'<p><b>¿Cuántos fabricar?</b></p><input class="num" type="number" inputmode="decimal" id="u" value="'+uds+'">'
   +'<p><b>¿Qué día?</b></p><input type="date" id="f" min="'+HOY+'" value="'+fe+'">'
   +'<p><b>¿En qué almacén?</b></p><select class="sel" id="a">'+ALMS.map(a=>'<option value="'+esc(a.codigo)+'"'+(a.codigo===def?' selected':'')+'>'+esc(a.codigo+' · '+a.nombre)+'</option>').join("")+'</select>'
   +'<p style="font-size:16px;color:#64748B">Se crea la orden de fabricación en SAP (planificada) ligada a este pedido.</p>'
   +'<button class="bt a op" onclick="enviarOrden('+i+',this)">Crear orden en SAP</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.enviarOrden=(i,b)=>{ const l=VIS[i], u=Number(document.getElementById("u").value), f=document.getElementById("f").value, a=document.getElementById("a").value;
  if(!(u>0)) return aviso("Pon la cantidad",false); if(!f) return aviso("Pon el día",false); if(!a) return aviso("Elige el almacén",false);
  LS("pc_alm_"+l.sol.tipo,a); escribir(Object.assign({accion:"ordenar",uds:u,fecha:f,almacen:a},ids(l)),b); };
pill(); cargar();
</script>
