<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Proponer prospección</title>
<style>
  :root{--burdeos:#7A1F2B;--crema:#FAF7F0;--linea:#E8DCC8;--gris:#8A8078;
        --texto:#2B2B2B;--verde:#0E7C5A;--azul:#1D4ED8;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
       background:#F4F2EE;color:var(--texto);-webkit-text-size-adjust:100%}
  header{background:var(--burdeos);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:9}
  header h1{margin:0;font-size:17px;font-weight:800}
  header p{margin:3px 0 0;font-size:12px;opacity:.85}
  .caja{background:#fff;margin:12px;border:1.5px solid var(--linea);border-radius:14px;padding:14px}
  .scope{font-size:12.5px;color:var(--gris);line-height:1.5;margin:0 0 12px}
  label{display:block;font-size:11.5px;color:var(--gris);margin:0 0 4px}
  input,select{width:100%;padding:12px 13px;border:1.5px solid var(--linea);border-radius:9px;
       font-size:15px;background:#fff;outline:none;margin-bottom:11px;font-family:inherit}
  input:focus,select:focus{border-color:var(--burdeos)}
  .lista{border:1.5px solid #EFE7DA;border-radius:10px;overflow:hidden}
  .cand{padding:13px 14px;border-bottom:1px solid #F3EFE6;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .cand:last-child{border-bottom:none}
  .cand:active{background:var(--crema)}
  .cand.sel{background:#ECFDF5;border-left:4px solid var(--verde)}
  .cand b{display:block;font-size:14.5px;font-weight:600}
  .cand span{display:block;font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.4}
  .mas{margin-top:9px;padding:11px;text-align:center;border-radius:9px;background:#EFF6FF;
       border:1px solid #BFDBFE;color:var(--azul);font-weight:700;font-size:13px;cursor:pointer}
  .barra{position:sticky;bottom:0;background:#fff;border-top:1.5px solid var(--linea);
       padding:12px 16px;display:flex;gap:10px;align-items:center}
  .barra button{flex:1;padding:14px;border:none;border-radius:11px;background:var(--verde);
       color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .barra button[disabled]{background:#CBD5E1}
  .vacio{padding:18px;text-align:center;color:var(--gris);font-size:13px}
  .aviso{margin:12px;padding:12px 14px;background:#FFF7ED;border:1.5px solid #FED7AA;
       border-radius:12px;font-size:12.5px;color:#9A3412}
  .zona{display:flex;align-items:center;gap:10px;margin:0 0 11px;padding:10px 12px;
       background:var(--crema);border:1.5px solid var(--linea);border-radius:9px}
  .zona span{flex:1;font-size:12px;color:var(--gris);line-height:1.35}
  .zona button{padding:8px 12px;border:1.5px solid var(--burdeos);border-radius:8px;
       background:#fff;color:var(--burdeos);font-size:12px;font-weight:700;cursor:pointer;
       white-space:nowrap;font-family:inherit}
  .zona.off{background:#FFF7ED;border-color:#FED7AA}
  .zona.off button{border-color:#9A3412;color:#9A3412}
</style></head>
<body>
<header>
  <h1>➕ Proponer prospección</h1>
  <p id="sub">cargando…</p>
</header>

<div class="caja">
  <p class="scope" id="scope"></p>
  <label>Afinar por nombre</label>
  <input type="text" id="bus" placeholder="filtrar…" autocomplete="off">
  <label>¿Dónde estás ahora?</label>
  <select id="desde"></select>
  <div class="zona" id="zonaBox">
    <span id="zonaTxt"></span>
    <button id="btnZona" type="button"></button>
  </div>
  <label>Tamaño</label>
  <select id="tam">
    <option value="">Todos los tamaños</option>
    <option value="más de 500|entre 100 y 500">Grandes (+100 M€)</option>
    <option value="entre 30 y 100">30–100 M€</option>
    <option value="entre 6 y 30">6–30 M€</option>
    <option value="entre 1,5 y 3|entre 3 y 6">1,5–6 M€</option>
    <option value="__peq__">Pequeñas / sin dato</option>
  </select>
  <div class="lista" id="lista"><div class="vacio">⏳ cargando la bolsa…</div></div>
  <div class="mas" id="mas" style="display:none"></div>
</div>

<div class="barra">
  <button id="guardar" disabled>Selecciona candidatos</button>
</div>

<script src="muni.js"></script>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const P=new URLSearchParams(location.search);
const KA=(P.get("ka")||"").toUpperCase().trim();
const DIA=P.get("dia")||"";
const POBS=(P.get("pobs")||"").split("|").filter(Boolean);
const PROV=(P.get("prov")||"").trim();

const norm=x=>String(x||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[´`'\u2019]/g," ").replace(/\s+/g," ").trim();
const geo=p=>{const M=window.__MUNI||{};const k=norm(p);
  if(M[k])return M[k];
  const c=k.split("(")[0].split(",")[0].trim();return M[c]||null;};
const kmPts=(a,b)=>{const dla=(a[0]-b[0])*111,
  dlo=(a[1]-b[1])*111*Math.cos((a[0]+b[0])/2*Math.PI/180);
  return Math.sqrt(dla*dla+dlo*dlo)*1.25;};

let BOLSA=[],CANDS=[],tope=10,sel=new Set();
// (29-ago) Por defecto solo se ven los de SU provincia: es lo que evita
// proponerle una puerta a 300 km. Pero a veces el comercial va a cruzar a la
// provincia de al lado y necesita verlo todo, así que puede quitar el filtro.
let soloZona=true;
// (29-ago) Punto de partida. Antes se medía contra TODOS los pueblos del día,
// así que estando en el primero te ofrecía puertas que caen junto al último.
// Ahora se mide desde donde estás y la lista va de ahí hacia adelante.
let desdeIdx=0;   // -1 = todo el día

document.getElementById("sub").textContent=(DIA||"día sin nombre")+" · "+KA;
document.getElementById("scope").innerHTML=
  "Ruta del día: <b>"+(POBS.slice(0,4).join(" · ")||PROV||"su zona")+"</b>"+
  (POBS.length>4?" y "+(POBS.length-4)+" más":"")+
  " · los candidatos salen ordenados por KM desde donde estás · toca los que quieras.";

async function cargarBolsa(){
  const out=[];let tk="";
  do{
    const r=await fetch(FB+"/radar_prospectos?pageSize=300"+(tk?"&pageToken="+tk:""));
    if(!r.ok)break;
    const j=await r.json();
    (j.documents||[]).forEach(d=>{
      const f=d.fields||{},g=k=>(f[k]&&f[k].stringValue)||"";
      out.push({id:d.name.split("/").pop(),n:g("n"),p:g("p"),pr:g("pr"),
        estado:g("estado"),tip:g("tipologia")||g("tipo"),rango:g("rango")||g("cifra")});
    });
    tk=j.nextPageToken||"";
  }while(tk);
  return out;
}

function calcular(){
  // referencia: el pueblo donde está (o todos, si elige "todo el día")
  let ptsDia;
  if(desdeIdx>=0&&POBS[desdeIdx]){
    const g=geo(POBS[desdeIdx]);
    ptsDia=g?[g]:POBS.map(geo).filter(Boolean);
  }else ptsDia=POBS.map(geo).filter(Boolean);
  const pobsD={};POBS.forEach(p=>pobsD[norm(p)]=1);
  const zona=norm(PROV);
  const q=norm(document.getElementById("bus").value);
  const ft=document.getElementById("tam").value;
  CANDS=[];
  for(const b of BOLSA){
    if(!b.n)continue;
    if(b.estado==="bloqueado"||b.estado==="descartado")continue;
    if(soloZona&&zona&&norm(b.pr)&&norm(b.pr)!==zona&&!pobsD[norm(b.p)])continue;
    if(q.length>=2&&norm(b.n).indexOf(q)<0&&norm(b.p).indexOf(q)<0)continue;
    const r=String(b.rango||"");
    if(ft==="__peq__"){ if(/más de 500|entre 100 y 500|entre 30 y 100|entre 6 y 30/i.test(r))continue; }
    else if(ft){ if(!new RegExp(ft.split("|").join("|"),"i").test(r))continue; }
    let km,eti;
    if(pobsD[norm(b.p)]){km=0;eti="📍 misma población · 0 km";}
    else{
      const g=geo(b.p);
      if(g&&ptsDia.length){km=Math.min(...ptsDia.map(p=>kmPts(p,g)));
        eti="a ~"+Math.round(km)+" km del día";}
      else{km=9999;eti="distancia desconocida";}
    }
    CANDS.push({...b,km,eti});
  }
  CANDS.sort((a,b)=>a.km-b.km);
  pintarZona();
  pintar();
}

function pintar(){
  const L=document.getElementById("lista"),M=document.getElementById("mas");
  const v=CANDS.slice(0,tope);
  if(!v.length){L.innerHTML='<div class="vacio">Sin candidatos con esos filtros.</div>';
    M.style.display="none";actualizarBarra();return;}
  L.innerHTML=v.map(c=>
    '<div class="cand'+(sel.has(c.id)?' sel':'')+'" data-id="'+c.id+'">'+
    '<b>'+(sel.has(c.id)?'✓ ':'')+esc(c.n)+'</b><span>'+esc(c.eti)+' · '+esc(c.p||"")+
    (c.rango&&!/SIN CIFRA/i.test(c.rango)?' · '+esc(c.rango):'')+
    (c.tip?' · '+esc(c.tip):'')+'</span></div>').join("");
  L.querySelectorAll(".cand").forEach(el=>el.onclick=()=>{
    const id=el.dataset.id;
    if(sel.has(id))sel.delete(id);else sel.add(id);
    pintar();
  });
  if(CANDS.length>v.length){
    M.style.display="block";
    M.textContent="▾ ver 10 más ("+(CANDS.length-v.length)+" restantes)";
    M.onclick=()=>{tope+=10;pintar();};
  }else M.style.display="none";
  actualizarBarra();
}
function actualizarBarra(){
  const b=document.getElementById("guardar");
  b.disabled=sel.size===0;
  b.textContent=sel.size?("Añadir "+sel.size+" a "+(DIA.split(" ")[0]||"la ruta")):"Selecciona candidatos";
}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function pintarZona(){
  const box=document.getElementById("zonaBox");
  const txt=document.getElementById("zonaTxt");
  const btn=document.getElementById("btnZona");
  if(!PROV){box.style.display="none";return;}
  box.className=soloZona?"zona":"zona off";
  txt.innerHTML=soloZona
    ? "Viendo solo <b>"+esc(PROV)+"</b>, que es la provincia de este día."
    : "Viendo <b>toda la bolsa</b>, también fuera de "+esc(PROV)+". Ojo con los kilómetros.";
  btn.textContent=soloZona?"Ver todas":"Volver a "+PROV;
  btn.onclick=()=>{soloZona=!soloZona;tope=10;calcular();};
}
function pintarDesde(){
  const sel=document.getElementById("desde");
  if(!POBS.length){sel.style.display="none";return;}
  sel.innerHTML=POBS.map((p,i)=>'<option value="'+i+'">'+esc(p)+'</option>').join("")+
    '<option value="-1">Todo el día (cualquier parada)</option>';
  sel.value=String(desdeIdx);
  sel.onchange=()=>{desdeIdx=parseInt(sel.value);tope=10;calcular();};
}
// Si el móvil da la posición, se preselecciona el pueblo más cercano: casi
// siempre es donde está de verdad y ahorra un toque.
function autoUbicar(){
  if(!navigator.geolocation||!POBS.length)return;
  navigator.geolocation.getCurrentPosition(pos=>{
    const yo=[pos.coords.latitude,pos.coords.longitude];
    let mejor=-1,md=1e9;
    POBS.forEach((p,i)=>{const g=geo(p);if(!g)return;
      const d=kmPts(yo,g);if(d<md){md=d;mejor=i;}});
    if(mejor>=0&&md<60){
      desdeIdx=mejor;
      document.getElementById("desde").value=String(mejor);
      document.getElementById("scope").insertAdjacentHTML("beforeend",
        '<br><b style="color:var(--verde)">📍 Estás cerca de '+esc(POBS[mejor])+
        ' (~'+Math.round(md)+' km): la lista sale desde ahí.</b>');
      calcular();
    }
  },()=>{},{timeout:6000,maximumAge:300000});
}
document.getElementById("bus").oninput=()=>{tope=10;calcular();};
document.getElementById("tam").onchange=()=>{tope=10;calcular();};

document.getElementById("guardar").onclick=async()=>{
  const b=document.getElementById("guardar");
  b.disabled=true;b.textContent="Guardando…";
  const elegidos=CANDS.filter(c=>sel.has(c.id));
  const id="prop_"+KA+"_"+Date.now();
  try{
    await fetch(FB+"/prospeccion_propuesta/"+id,{method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:{
        ka:{stringValue:KA},dia:{stringValue:DIA},
        fecha:{stringValue:new Date().toISOString()},
        clientes:{stringValue:JSON.stringify(elegidos.map(c=>({id:c.id,n:c.n,p:c.p,pr:c.pr,km:Math.round(c.km)})))}
      }})});
    document.body.insertAdjacentHTML("afterbegin",
      '<div class="aviso">✓ '+elegidos.length+' candidatos añadidos a '+esc(DIA)+
      '. Vuelve al CRM y recarga la ruta para verlos.</div>');
    b.textContent="✓ Guardado";
    setTimeout(()=>{if(window.opener)window.close();},1600);
  }catch(e){
    b.disabled=false;b.textContent="Error al guardar · reintentar";
  }
};

(async()=>{
  if(!KA){document.getElementById("lista").innerHTML=
    '<div class="vacio">Falta el vendedor. Abre esta página desde el CRM.</div>';return;}
  BOLSA=await cargarBolsa();
  document.getElementById("sub").textContent=(DIA||"")+" · "+KA+" · "+BOLSA.length+" en la bolsa";
  pintarDesde();
  calcular();
  autoUbicar();
})();
</script>
</body></html>
