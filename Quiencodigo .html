<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Quién es cada código huérfano?</title>
<style>
  :root{ --navy:#0F172A; --muted:#64748B; --border:#E2E8F0; --green:#22C55E; --greenL:#F0FDF4;
         --red:#EF4444; --redL:#FEF2F2; --amber:#F59E0B; --amberL:#FFFBEB; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#F8FAFC;color:var(--navy)}
  header{padding:18px 16px 14px;background:#fff;border-bottom:1px solid var(--border)}
  h1{margin:0 0 4px;font-size:19px;font-weight:800}
  .sub{margin:0;font-size:12px;color:var(--muted)}
  main{padding:16px;max-width:820px;margin:0 auto}
  .estado{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;
        margin-bottom:14px}
  .card.resuelto{border-color:var(--green);background:var(--greenL)}
  .card.sinpista{border-color:var(--border)}
  .nombre{font-size:15px;font-weight:800;margin:0 0 6px}
  .meta{margin:2px 0;font-size:12.5px;color:var(--muted)}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;
       margin-left:6px}
  .tag.ok{background:var(--greenL);color:var(--green)}
  .tag.no{background:#F1F5F9;color:var(--muted)}
  .fila{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
        border-top:1px solid #0000000f;font-size:12px}
  .fila:first-of-type{border-top:none}
  h2{font-size:14px;margin:22px 0 8px}
  .nota{font-size:12px;color:var(--muted);margin:6px 0 14px}
  .err{padding:14px;background:var(--redL);color:var(--red);border-radius:10px;font-size:13px}
  code{background:#F1F5F9;padding:1px 6px;border-radius:5px;font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>🕵️ ¿Quién es cada código huérfano?</h1>
  <p class="sub">Busca en las notas/observaciones de sus muestras qué nombre aparece
    mencionado, para saber a cuál de los 18 corresponde cada wk/ik suelto.</p>
</header>
<main><div class="estado" id="app">Buscando…</div></main>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";

// Códigos numéricos huérfanos detectados en el primer diagnóstico (sin contar
// wk1/wk2/wk3/ik1/ik2/ik4, que ya están dados de alta desde siempre).
const CODIGOS_A_REVISAR=["WK4","WK5","WK6","WK8","WK9","WK12","WK13","IK3"];

// Nombres de los 18 que acabamos de dar de alta, para buscarlos en las notas.
const NOMBRES_18=["ALEX","ESTHER","AGUSTIN","VEGA","LLUIS","JPEREZ","PEPE",
  "JESUS","SAHUQUILLO","ANTONIO","MIGUEL","VESES","ANDRES","GARCIA","BOUCHARD",
  "CARAYON","CARO","JPUJOLA","PUJOLA","WALENN"];

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  return null;
}
const norm=(s)=>String(s||"").toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

async function leer(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<60);
  return t;
}

async function iniciar(){
  const app=document.getElementById("app");
  try{
    const [muestras, visitas, portal] = await Promise.all([
      leer("muestras"), leer("visitas"), leer("portal_users")
    ]);

    let html="";
    for(const cod of CODIGOS_A_REVISAR){
      const mDocs=muestras.filter(m=>norm(m.agente)===cod);
      const vDocs=visitas.filter(v=>norm(v.agente)===cod);
      const total=mDocs.length+vDocs.length;

      // Buscar menciones de cualquiera de los 18 nombres en notas/obs de SUS PROPIAS muestras
      const pistas={};
      mDocs.forEach(m=>{
        const txt=norm([m.notaInicial,m.obs,m.agenteNombre].filter(Boolean).join(" "));
        NOMBRES_18.forEach(nom=>{ if(txt.indexOf(nom)>=0) pistas[nom]=(pistas[nom]||0)+1; });
      });
      const pistasOrdenadas=Object.entries(pistas).sort((a,b)=>b[1]-a[1]);
      const resuelto=pistasOrdenadas.length>0;

      html+=`<div class="card ${resuelto?"resuelto":"sinpista"}">
        <p class="nombre">${cod}
          ${resuelto?`<span class="tag ok">→ probablemente ${pistasOrdenadas[0][0]}</span>`:'<span class="tag no">sin pista clara</span>'}</p>
        <p class="meta">${mDocs.length} muestras · ${vDocs.length} visitas</p>`;

      if(pistasOrdenadas.length){
        html+=`<p class="meta">Menciones encontradas en sus notas: `
          + pistasOrdenadas.map(p=>`<code>${p[0]}</code> (${p[1]}×)`).join(", ") + `</p>`;
      }

      // Ejemplo de 3 registros con nota, para verlo con tus propios ojos
      const ejemplos=mDocs.filter(m=>m.notaInicial||m.obs).slice(0,3);
      if(ejemplos.length){
        html+=ejemplos.map(m=>`<div class="fila">
          <span>${m.prod||m.prodNombre||"—"} — ${m.cliente||m.clienteNombre||"—"}
            <br><span class="meta">"${(m.notaInicial||m.obs||"").slice(0,90)}"</span></span>
        </div>`).join("");
      }
      html+="</div>";
    }

    app.innerHTML=html || `<p class="nota">Sin resultados.</p>`;
  }catch(e){
    app.innerHTML = `<div class="err">No se ha podido leer: ${e.message}</div>`;
  }
}
iniciar();
</script>
</body>
</html>
