<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abrir la semana</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--papel:#F2F4F7;--tinta:#14181F;--tenue:#6B7684;--linea:#DCE1E7;
        --hueco:#fff;--ok:#0E7C5A;--mal:#C2263D;--med:#B07908}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);max-width:620px;
    margin-inline:auto;padding:0 0 30px;
    font:400 16px/1.5 "Instrument Sans",-apple-system,system-ui,sans-serif}
  .m{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  header{background:var(--tinta);color:#fff;padding:18px 16px}
  h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em}
  .hs{margin:3px 0 0;font-size:12.5px;color:#A7B2BE}
  main{padding:16px}
  .paso{background:var(--hueco);border:1px solid var(--linea);border-radius:5px;
    padding:16px;margin-bottom:12px}
  .num{display:inline-flex;width:20px;height:20px;border-radius:99px;background:var(--tinta);
    color:#fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;
    margin-right:7px}
  .tit{font-size:15.5px;font-weight:700;margin:0 0 3px}
  .sub{margin:0 0 13px;font-size:12.5px;color:var(--tenue);line-height:1.45}
  .rot{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;
    letter-spacing:.13em;text-transform:uppercase;color:var(--tenue);margin:16px 0 8px}
  .dato{background:#F7F9FB;border-left:2px solid var(--linea);border-radius:0 3px 3px 0;
    padding:11px 13px;margin-bottom:12px}
  .dg{display:flex;gap:20px;flex-wrap:wrap}
  .dg b{display:block;font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:700}
  .dg span{display:block;font-size:11px;color:var(--tenue);margin-top:1px}
  .up{color:var(--ok)} .dn{color:var(--mal)} .pd{color:var(--med)}
  .item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--linea);font-size:13.5px}
  .item small{display:block;font-size:11px;color:var(--tenue);margin-top:2px}
  .item .imp{font-family:"IBM Plex Mono",monospace;font-weight:700;white-space:nowrap}
  textarea{width:100%;border:1.5px solid var(--linea);border-radius:4px;padding:10px 11px;
    font:400 14.5px/1.5 inherit;color:var(--tinta);resize:vertical;min-height:64px;background:#fff}
  textarea:focus{outline:none;border-color:var(--tinta)}
  textarea.falta{border-color:var(--mal);background:#FEF7F8}
  .obl{font-size:11px;color:var(--mal);font-weight:700;margin:5px 0 0}
  .acc{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
  .chip{border:1px solid var(--linea);background:#fff;color:var(--tenue);border-radius:99px;
    padding:6px 12px;font:600 12px inherit;cursor:pointer}
  .chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .barra{position:sticky;bottom:0;background:var(--tinta);color:#fff;padding:13px 16px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    border-radius:5px;margin:16px}
  .barra p{margin:0;font-size:12.5px;color:#A7B2BE}
  button.env{background:#fff;color:var(--tinta);border:none;border-radius:3px;
    padding:11px 20px;font:800 14.5px inherit;cursor:pointer}
  button.env:disabled{opacity:.35}
  .nota{font-size:11.5px;color:var(--tenue);line-height:1.55;
    border-left:2px solid var(--linea);padding-left:11px;margin:14px 16px 0}
  .estado{padding:40px 16px;color:var(--tenue);font-size:14.5px}
  .listo{background:var(--ok);color:#fff;padding:22px 16px;border-radius:5px;margin:16px;
    text-align:center}
  .listo b{display:block;font-size:19px;font-weight:800;margin-bottom:5px}

  .op{width:100%;display:flex;align-items:center;gap:13px;padding:14px;
    border:1.5px solid var(--linea);background:#fff;border-radius:5px;cursor:pointer;
    text-align:left;margin-bottom:8px;font:inherit}
  .op.on{border-color:var(--tinta);border-width:2px}
  .op .n{width:40px;height:40px;border-radius:10px;background:var(--tinta);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .op .t{flex:1;min-width:0}
  .op .t b{display:block;font-size:15px}
  .op .t small{display:block;font-size:11.5px;color:var(--tenue);margin-top:2px}
  .chip.prop{border-color:var(--tinta);color:var(--tinta);font-weight:700}
  .chip.mini{padding:4px 9px;font-size:11px}
  .arts{margin-top:6px}
  .art{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    padding:8px 10px;background:#F7F9FB;border-radius:4px;margin-bottom:5px;font-size:12.5px}
  .art b{font-size:13px} .art small{display:block;color:var(--tenue);font-size:11px}
  .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    background:#EDF0F3;color:var(--tenue);border-radius:99px;padding:2px 7px;margin-left:5px}
</style></head><body>

<header>
  <h1>Abrir la semana</h1>
  <p class="hs" id="hs">Leyendo…</p>
  <p style="margin:9px 0 0"><a id="salir" href="#" style="color:#A7B2BE;font-size:12.5px">← Volver</a></p>
</header>
<main id="app"><p class="estado">Leyendo…</p></main>
<div id="pie"></div>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const P=new URLSearchParams(location.search);
const ARR=(s)=>String(s||"").toUpperCase().trim();
const num=(n)=>Number(n)||0;
const eur=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
const AGENTE=ARR(P.get("agente")||"");
const SEMANA=Number(P.get("semana")||0);
const VUELVE=P.get("vuelve")||"";
const ANIO=new Date().getFullYear();

// Un comercial no puede atacar veinte frentes en una semana. Se le dan DIEZ,
// las mas urgentes de todo lo que tiene, mezclando clientes, ofertas, muestras
// y estrategias en una sola lista ordenada. Mismo criterio con ruta y en libre.
const TOPE=10;
// Una semana de reclamar ofertas no recupera un cliente que se va. Se reservan
// cinco plazas para clientes que bajan, aunque una oferta gorda pese mas.
const MINIMO_CLIENTES=5;

const R={}; let ELEGIDA=null, PEND=[];
const NOMBRES={};   // codigo → nombre, para precargar los formularios

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  return null;
}
async function leer(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<40);
  return t;
}
async function leerDoc(ruta){
  const r=await fetch(`${FB}/${ruta}`); if(!r.ok) return null;
  const j=await r.json(); const o={};
  for(const [k,x] of Object.entries(j.fields||{})) o[k]=val(x);
  return o;
}
function fecha(v){
  if(!v) return null;
  const s=String(v), a=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(a) return new Date(+a[1],+a[2]-1,+a[3]);
  const b=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if(b){ const y=b[3].length===2?2000+ +b[3]:+b[3]; return new Date(y,+b[2]-1,+b[1]); }
  return null;
}
const dias=(d)=>d?Math.floor((Date.now()-d)/86400000):null;

// El desglose por articulo se pide a la API solo cuando el comercial lo abre:
// son consultas caras y la mayoria de las veces no hace falta.
// Igual que en el cierre: marcar algo como perdido lo cierra de verdad. Si
// vuelve a salir el viernes, el comercial deja de fiarse de los botones.
const CIERRA={ "La doy por perdida":"perdida", "La cierro":"cerrada" };

window.verArticulos=async (cli,destino)=>{
  const d=document.getElementById(destino);
  if(d.dataset.abierto){ d.innerHTML=""; d.dataset.abierto=""; return; }
  d.dataset.abierto="1";
  d.innerHTML='<p class="sub" style="margin:8px 0 0">Mirando…</p>';
  try{
    const r=await fetch(`/api/pbi-sync?articulosCliente=${encodeURIComponent(cli)}`);
    const j=await r.json();
    const baja=(j.articulos||[]).slice(0,6), sube=(j.suben||[]).slice(0,3);
    if(!baja.length&&!sube.length){ d.innerHTML=
      '<p class="sub" style="margin:8px 0 0">Sin desglose por producto.</p>'; return; }
    d.innerHTML=`
      ${baja.map(a=>{
        const ant=num(a.ventasAnt), act=num(a.ventasAct), dif=num(a.diferencia);
        const cod=String(a.articulo||"").replace(/'/g,"");
        return `<div class="art">
        <div style="min-width:0">
          <b>${a.descripcion||a.articulo}</b>
          <small>${ant?eur(ant)+" en "+(ANIO-1):"nuevo"} → ${
            act?eur(act)+" este año":"<b style='color:var(--mal)'>nada este año</b>"}
            ${a.variacionPct!=null?" · "+Math.round(a.variacionPct)+" %":""}</small>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <span class="imp dn">${dif?eur(dif):""}</span>
          <div style="display:flex;gap:5px;margin-top:5px">
            <button class="chip mini" onclick="pedir('${cli}','${cod}','oferta','${
              String(a.descripcion||a.articulo||"").replace(/'/g,"")}','${NOMBRES[cli]||""}')">Oferta</button>
            <button class="chip mini" onclick="pedir('${cli}','${cod}','estrategia','${
              String(a.descripcion||a.articulo||"").replace(/'/g,"")}','${NOMBRES[cli]||""}')">Estrategia</button>
          </div>
        </div>
      </div>`;}).join("")}
      ${sube.length?`<p class="sub" style="margin:7px 0 0">Sube en:
        ${sube.map(a=>a.descripcion||a.articulo).join(", ")}</p>`:""}`;
  }catch(e){ d.innerHTML='<p class="sub" style="margin:8px 0 0">No se ha podido consultar.</p>'; }
};
window.pedir=(cli,art,tipo,desc,nomCli)=>{
  // El CRM ya sabe precargar sus formularios: se le deja el prefill en
  // sessionStorage y se navega. Asi el comercial no reescribe lo que el
  // sistema ya sabe.
  const pre={ cliente:nomCli||"", clienteId:cli, clienteCodigo:cli,
    producto:desc||art, calibre:"", 
    objetivo: tipo==="oferta" ? "Oferta de "+(desc||art)
      : "Recuperar "+(desc||art)+" en "+(nomCli||cli) };
  try{
    sessionStorage.setItem(tipo==="oferta"?"ofertaPrefill":"estrategiaPrefill",
      JSON.stringify(pre));
    sessionStorage.setItem("volverASeccion","plan_semanal");
  }catch(e){}
  // Se anota tambien en el plan, por si vuelve sin llegar a crearla
  R[tipo+"Nueva:"+cli+"_"+art]={
    accion: tipo==="oferta"?"Preparar oferta":"Pedir estrategia",
    articulo:art, cliente:cli, texto:desc||"" };
  location.href = "/crm.html?ir="+(tipo==="oferta"?"ofertas":"estrategias");
};

window.marcar=(k,v,el)=>{
  R[k]=R[k]||{}; R[k].accion=v;
  R[k].cierra = CIERRA[v] || null;
  [...el.parentNode.children].forEach(x=>x.classList.remove("on"));
  el.classList.add("on"); refrescar();
};
window.texto=(k,el)=>{ R[k]=R[k]||{}; R[k].texto=el.value.trim(); refrescar(); };

function refrescar(){
  const faltan=PEND.filter(k=>{ const r=R[k]||{}; return !(r.accion||r.texto); });
  const b=document.getElementById("btn"); if(!b) return;
  b.disabled = !ELEGIDA || faltan.length>0;
  document.getElementById("cuenta").innerHTML = !ELEGIDA
    ? "Elige cómo trabajas"
    : faltan.length ? `Faltan <b style="color:#fff">${faltan.length}</b> de ${PEND.length}`
    : "Listo para empezar";
}

let DATOS={};
window.elegir=(r)=>{
  ELEGIDA=r;
  document.querySelectorAll(".op").forEach(x=>{
    if(x.dataset.r===String(r)){ x.classList.add("on"); x.style.display=""; }
    else x.style.display="none";
  });
  document.getElementById("cambiar").style.display="block";
  pintarAcciones(r);
  document.getElementById("acciones").scrollIntoView({behavior:"smooth",block:"start"});
};
window.volver=()=>{
  ELEGIDA=null; PEND=[];
  document.querySelectorAll(".op").forEach(x=>{x.style.display="";x.classList.remove("on");});
  document.getElementById("cambiar").style.display="none";
  document.getElementById("acciones").innerHTML=
    '<p class="sub" style="margin:0">Elige arriba cómo vas a trabajar y aquí saldrá tu plan.</p>';
  refrescar();
};

function pintarAcciones(r){
  PEND=[];
  const deRuta=new Set((DATOS.porRuta[r]||[]).map(c=>c.id));
  // Todo junto en una sola lista: lo urgente es urgente venga de donde venga.
  // Si toca ruta, lo suyo pesa mas porque ya va a estar por allí.
  const conPeso=DATOS.cand.map(x=>Object.assign({},x,{
    peso: x.tipo==="cliente" && deRuta.has(x.id) ? x.peso*2.5 : x.peso,
    enRuta: x.tipo==="cliente" && deRuta.has(x.id),
  })).sort((a,b)=>b.peso-a.peso);

  // Primero se reservan las plazas de clientes que bajan; el resto se reparte
  // por peso entre todo lo demas.
  const clientes=conPeso.filter(x=>x.tipo==="cliente");
  const resto   =conPeso.filter(x=>x.tipo!=="cliente");
  const fijos   =clientes.slice(0,MINIMO_CLIENTES);
  const libres  =[...clientes.slice(MINIMO_CLIENTES),...resto]
                   .sort((a,b)=>b.peso-a.peso)
                   .slice(0,Math.max(0,TOPE-fijos.length));
  const bolsa=[...fijos,...libres].sort((a,b)=>b.peso-a.peso);

  const cont=document.getElementById("acciones");
  if(!bolsa.length){ cont.innerHTML=
    '<p class="sub" style="margin:0">Nada urgente. Buena semana para prospección.</p>';
    PEND.push("prioridad"); refrescar(); return; }

  cont.innerHTML = bolsa.map((x,i)=>{
    const k=x.tipo+":"+x.id; PEND.push(k);
    return `<div class="item" style="display:block;padding:13px 0">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
        <div style="min-width:0">
          <b style="font-size:14.5px">${i+1}. ${x.nom}</b>
          ${x.enRuta?'<span class="tag">de tu ruta</span>':""}
          <small>${x.sub}</small>
        </div>
        <span class="imp ${x.rojo?"dn":"pd"}">${x.cifra}</span>
      </div>
      <p style="margin:7px 0 0;font-size:13.5px">${x.motivo}</p>
      ${x.tipo==="cliente"?`<p style="margin:5px 0 0">
        <a href="#" onclick="verArticulos('${x.id}','a${i}');return false"
           style="font-size:12.5px;color:var(--tenue)">▸ En qué productos cae</a></p>
        <div id="a${i}" class="arts"></div>`:""}
      <div class="acc">${x.opciones.map(o=>
        `<button class="chip${o===x.propone?" prop":""}"
          onclick="marcar('${k}','${o}',this)">${o}</button>`).join("")}</div>
      <textarea placeholder="${x.pide}" oninput="texto('${k}',this)"></textarea>
    </div>`;
  }).join("");
  PEND.push("prioridad");
  refrescar();
}

(async()=>{
  const sal=document.getElementById("salir");
  if(VUELVE) sal.href=VUELVE; else sal.style.display="none";
  if(!AGENTE||!SEMANA){ document.getElementById("app").innerHTML=
    '<p class="estado">Añade <b>?agente=DAVIDMAG&semana=32</b> a la dirección.</p>'; return; }
  try{
    const [cli,vis,mu,of,es,mesesRaw,perf,portal,usus,res,fichas]=await Promise.all([
      leer("pbi_ventas_cliente"), leer("visitas"), leer("muestras"), leer("ofertas"),
      leer("estrategias"), leer("pbi_meses_cliente"), leer("pbi_perfiles"),
      leer("portal_users"), leer("usuarios"), leer("pbi_resumen_agente"), leer("clientes"),
    ]);
    const yo=res.find(a=>ARR(a._id)===AGENTE)||{};

    const MIOS=new Set([AGENTE]);
    perf.forEach(x=>{ if(ARR(x.agente)===AGENTE) MIOS.add(ARR(x._id)); });
    [...portal,...usus].forEach(f=>{
      if(ARR(f.grupoAgente||f.catalogoVendedor)!==AGENTE) return;
      [f.crmId,f._id,f.id,f.username].forEach(c=>{ if(c) MIOS.add(ARR(c)); });
    });
    const esMio=(o)=>MIOS.has(ARR(o.agente||o.autor||o.comercial));

    const mes={};
    for(const d of mesesRaw){ try{ for(const f of JSON.parse(d.datos||"[]")) mes[f[0]]=f; }catch(e){} }
    const ultimo=new Date().getMonth();

    // Las visitas guardan el codigo ANTIGUO (U431880) y el documento de ventas
    // el recodificado (U4301880): 2.012 codigos cambiaron en 2026. Sin cruzar
    // por los alias, ninguna visita encontraba a su cliente.
    const alias={};
    for(const c of cli){
      const id=ARR(c._id);
      alias[id]=id;
      if(c.cliente) alias[ARR(c.cliente)]=id;
      if(c.canonico) alias[ARR(c.canonico)]=id;
      if(c.codigosFusionados) String(c.codigosFusionados).split(/[,;]/)
        .forEach(x=>{ const k=ARR(x); if(k) alias[k]=id; });
    }
    const ultVis={};
    for(const v of vis){
      const bruto=ARR(v.clienteId); if(!bruto) continue;
      const c=alias[bruto]||bruto;
      const f=fecha(v.fecha); if(!f) continue;
      if(!ultVis[c]||f>ultVis[c]) ultVis[c]=f;
    }

    // ── Candidatos: todo lo que merece una acción, con su peso en euros ──
    const cand=[];

    // Clientes en riesgo real
    for(const c of cli){
      const ok=c.cuenta!==undefined?c.cuenta:(!c.intercompany&&!c.fusionadoEn);
      if(!ok||ARR(c.agenteFinal||c.agente)!==AGENTE) continue;
      const id=ARR(c._id), v=num(c.ventasAct), a=num(c.ventasAntYTD);
      if(v<=0&&a<=0) continue;
      const vs = a ? (v-a)/a*100 : null;
      const f=mes[id]; let seco=0;
      if(f){ const m=[]; for(let i=1;i<=ultimo;i++) m.push(num(f[i]));
        for(let i=m.length-1;i>=0&&m[i]===0;i--) seco++; }
      const uv=ultVis[id]?dias(ultVis[id]):null;
      const cae=vs!=null&&vs<-10, parado=seco>=2, frio=(uv==null||uv>120)&&vs!=null&&vs<0;
      if(!cae&&!parado&&!frio) continue;      // sano: no molesta
      let peso=0, motivo="", prop="Le visito";
      if(parado){ peso=Math.max(v,a)*0.4;
        motivo=`Lleva ${seco} meses sin comprar. Venía de ${eur(a||v)} al año.`;
        prop="Le llamo"; }
      else if(cae){ peso=(a-v);
        motivo=`Cae un ${Math.round(-vs)} % contra ${ANIO-1}: ${eur(a-v)} menos.`; }
      else { peso=v*0.15;
        motivo=uv==null?"No hay ninguna visita suya registrada y va por debajo."
          :`Hace ${uv} días que nadie le visita y va por debajo.`; }
      const vTxt = uv==null ? "sin visita registrada"
        : uv===0 ? "visitado hoy" : `última visita hace ${uv} días`;
      NOMBRES[id]=String(c.nombre||id).replace(/'/g,"");
      cand.push({tipo:"cliente", id, nom:c.nombre||id,
        sub:(c.poblacion?c.poblacion+" · ":"")+vTxt,
        cifra:eur(v), rojo:cae||parado, motivo, peso,
        propone:prop, pide:"Cuándo y con qué argumento",
        opciones:["Le visito","Le llamo","Le mando oferta","Esta semana no"]});
    }

    // Ofertas, muestras y estrategias paradas
    const viejas=(l,tipo,d0,cerrados,nom,opciones,prop,pide)=>{
      for(const o of l){
        if(!esMio(o)) continue;
        // Las eliminadas no existen: se estaban mostrando igual porque solo
        // se miraba el estado.
        if(o.eliminada||o.eliminado||o.borrada) continue;
        const e=String(o.estado||"").toLowerCase();
        if(cerrados.includes(e)) continue;
        const d=dias(fecha(o.fecha||o.fechaCreacion));
        if(d==null||d<=d0) continue;
        const imp=num(o.importe||o.total);
        // Qué es exactamente: sin producto y precio, dos estrategias del mismo
        // cliente se ven idénticas y el comercial no sabe cuál está mirando.
        let prods=[];
        try{ const a = typeof o.productos==="string"?JSON.parse(o.productos):o.productos;
          if(Array.isArray(a)) prods=a; }catch(e){}
        // El texto util es "objetivo"; producto y calibre van aparte.
        const artic = [o.producto||o.articulo, o.calibre].filter(Boolean).join(" ");
        const desc = o.objetivo || o.estrategia || o.titulo || o.descripcion
          || (prods.length?prods.map(x=>x.nombre||x.producto||x.descripcion).filter(Boolean).join(", "):"")
          || artic || "";
        // Precio: el ofrecido frente al de tarifa, que es lo que se negocia
        const pr = prods.find(x=>x&&(x.precioObjetivo||x.precioActual||x.precio));
        const precio = pr
          ? (pr.precioObjetivo||pr.precio) && pr.precioActual
            ? `${pr.precioActual} → ${pr.precioObjetivo||pr.precio} €`
            : `${pr.precioObjetivo||pr.precio||pr.precioActual} €`
          : (o.precio?o.precio+" €":"");
        cand.push({tipo, id:o._id, nom:o.clienteNombre||o.cliente||"(sin cliente)",
          sub:`${nom}${artic?" · "+artic:""}`,
          cifra:imp?eur(imp):d+" d", rojo:d>60,
          motivo:`${desc?String(desc).slice(0,110):nom} · ${d} días sin respuesta`
            +`${precio?" · "+precio:""}`,
          // Una oferta de 8.000 € parada pesa como un cliente que cae 8.000
          peso: imp ? imp*0.5 : d*40,
          propone:prop, pide, opciones});
      }
    };
    viejas(of,"oferta",5,["pedido","perdida","aceptada","rechazada"],"Oferta",
      ["La reclamo","Bajo el precio","La doy por perdida","Esta semana no"],
      "La reclamo","Qué falta para cerrarla");
    viejas(mu,"muestra",30,["positivo","pedido","ko","negativo"],"Muestra",
      ["Le llamo","Le visito","La doy por perdida","Esta semana no"],
      "Le llamo","Qué vas a hacer");
    viejas(es,"estrategia",15,["completada","ko","cerrada"],"Estrategia",
      ["Doy un paso","La replanteo","La cierro","Esta semana no"],
      "Doy un paso","Cuál es el siguiente paso");

    // Rutas, de la colección clientes como hace Mi semana
    const porRuta={};
    for(const fc of fichas){
      const r=parseInt(fc.SEMANAVISITA||fc.semanaVisita||fc.ruta||fc.semana||0)||0;
      if(!r) continue;
      const id=ARR(fc.codigo||fc.CODIGO||fc._id);
      if(!MIOS.has(ARR(fc.agente||fc.AGENTE||fc.grupoAgente))
         && !cand.some(x=>x.id===id)) continue;
      (porRuta[r]=porRuta[r]||[]).push({id});
    }
    DATOS={cand,porRuta};

    // Lo que prometió al cerrar
    const inf=await leerDoc(`informes/informe_${AGENTE}_s${SEMANA-1}`)
      || await leerDoc(`informes/${AGENTE}_s${SEMANA-1}`);
    let comp=null;
    if(inf&&inf.respuestas){
      let X={}; try{ X=JSON.parse(inf.respuestas); }catch(e){}
      const l=[];
      for(const [k,v] of Object.entries(X)){
        if(!v||(!v.accion&&!v.texto)) continue;
        if(k==="prioridad"||k==="semana") continue;
        if(/Ya lo sé|por perdida|por cerrada/i.test(v.accion||"")) continue;
        l.push({accion:v.accion||"", texto:v.texto||""});
      }
      if(l.length||(X.prioridad||{}).texto) comp={lista:l,prio:(X.prioridad||{}).texto||""};
    }

    const rutas=Object.keys(porRuta).sort((a,b)=>a-b);
    const jugo={}; rutas.forEach(r=>{
      const ids=new Set(porRuta[r].map(c=>c.id));
      jugo[r]=cand.filter(x=>x.tipo==="cliente"&&ids.has(x.id))
                  .reduce((s,x)=>s+x.peso,0);
    });
    const mejor=rutas.slice().sort((a,b)=>jugo[b]-jugo[a])[0];

    document.getElementById("hs").textContent=
      `${yo.agente||AGENTE} · ${yo.equipo||""} · semana ${SEMANA}`;
    document.getElementById("app").innerHTML=`
      ${comp?`<div class="paso" style="background:#FFFBEB;border-color:#F59E0B">
        <p class="tit"><span class="num" style="background:#92400E">✓</span>Lo que dijiste la semana ${SEMANA-1}</p>
        <p class="sub">Antes de programar esta, mira si lo hiciste.</p>
        ${comp.prio?`<div class="dato"><b style="font-size:14px">${comp.prio}</b>
          <span style="font-size:11.5px;color:var(--tenue);display:block;margin-top:2px">era tu prioridad</span></div>`:""}
        ${comp.lista.slice(0,6).map(x=>`<div class="item">
          <div><b>${x.accion||"Pendiente"}</b>${x.texto?`<small>${x.texto}</small>`:""}</div>
        </div>`).join("")}
        ${comp.lista.length>6?`<p class="sub" style="margin:8px 0 0">Y ${comp.lista.length-6} más.</p>`:""}
      </div>`:""}

      <div class="paso">
        <p class="tit"><span class="num">1</span>Cómo vas a trabajar</p>
        <p class="sub">${mejor&&jugo[mejor]>3000
          ? `Si puedes elegir, la <b>ruta ${mejor}</b> es la que más urgencia acumula.`
          : "Elige tu ruta o trabaja en libre."}</p>
        ${rutas.map(r=>`<button class="op ruta" data-r="${r}" onclick="elegir('${r}')">
          <span class="n">${r}</span>
          <span class="t"><b>Ruta ${r}</b><small>${porRuta[r].length} clientes${
            jugo[r]>1000?" · "+eur(jugo[r])+" en juego":""}</small></span>
        </button>`).join("")}
        <button class="op ruta" data-r="libre" onclick="elegir('libre')">
          <span class="n" style="background:#7C3AED">L</span>
          <span class="t"><b>Semana libre</b><small>Prospección, sin ruta fija</small></span>
        </button>
        <p id="cambiar" style="display:none;margin:9px 0 0">
          <a href="#" onclick="volver();return false" style="font-size:12.5px;color:var(--tenue)">← Cambiar</a></p>
      </div>

      <div class="paso">
        <p class="tit"><span class="num">2</span>Tus ${TOPE} acciones de la semana</p>
        <p class="sub">Al menos ${MINIMO_CLIENTES} son clientes que bajan;
          el resto, lo que más pesa de todo lo que tienes abierto.
          La opción marcada es la que propone el sistema. <b>Lo que des por
          perdido o cerrado se cierra en el CRM.</b></p>
        <div id="acciones"><p class="sub" style="margin:0">Elige arriba cómo vas a
          trabajar y aquí saldrá tu plan.</p></div>
      </div>

      <div class="paso">
        <p class="tit"><span class="num">3</span>Tu prioridad</p>
        <p class="sub">Una sola cosa. La que de verdad va a mover el mes.</p>
        <textarea placeholder="Esta semana quiero conseguir…"
          oninput="texto('prioridad',this)"></textarea>
      </div>`;

    document.getElementById("pie").innerHTML=`
      <div class="barra"><p id="cuenta">Elige cómo trabajas</p>
        <button class="env" id="btn" disabled onclick="abrir()">Abrir semana</button></div>
      <p class="nota">Máximo ${TOPE} acciones: las más urgentes de todo lo que tiene
        abierto —clientes que caen, ofertas paradas, muestras sin cerrar—, no una
        lista de todo. El viernes el cierre le preguntará por cada una.</p>`;
    refrescar();
  }catch(e){
    document.getElementById("app").innerHTML=`<p class="estado">No se ha podido montar: ${e.message}</p>`;
  }
})();

async function abrir(){
  const b=document.getElementById("btn"); b.disabled=true; b.textContent="Guardando…";
  const doc={ id:`plan_${AGENTE}_${ANIO}_s${SEMANA}`, agente:AGENTE, semana:SEMANA,
    anio:ANIO, modo:ELEGIDA==="libre"?"libre":"ruta",
    rutaNum:ELEGIDA==="libre"?"":String(ELEGIDA), estado:"activo",
    acciones:JSON.stringify(R), origen:"apertura_v2" };
  // Cerrar lo marcado como perdido antes de guardar el plan. Si algo falla no
  // se abre la semana: mejor repetir que dar por cerrado lo que sigue abierto.
  const cerrar=[];
  for(const [k,v] of Object.entries(R)){
    if(!v.cierra) continue;
    const [t,id]=k.split(/:(.+)/);
    const col={oferta:"ofertas",muestra:"muestras",estrategia:"estrategias"}[t];
    if(col&&id) cerrar.push({col,id,estado:v.cierra});
  }
  let fallos=0;
  for(const c of cerrar){
    try{
      const r=await fetch(`${FB}/${c.col}/${encodeURIComponent(c.id)}`
        +`?updateMask.fieldPaths=estado&updateMask.fieldPaths=cerradoEn`
        +`&updateMask.fieldPaths=cerradoPor`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          estado:{stringValue:c.estado},
          cerradoEn:{stringValue:new Date().toISOString()},
          cerradoPor:{stringValue:"apertura_s"+SEMANA}}})});
      if(!r.ok) throw new Error("HTTP "+r.status);
    }catch(e){ fallos++; }
  }
  if(fallos){
    b.disabled=false; b.textContent="Reintentar";
    alert(fallos+" no se han podido cerrar. No se ha abierto la semana.");
    return;
  }
  doc.cerrados=cerrar.length;

  const f={};
  for(const [k,v] of Object.entries(doc))
    f[k]= typeof v==="number" ? {doubleValue:v} : {stringValue:String(v)};
  try{
    const r=await fetch(`${FB}/planes_semanales/${encodeURIComponent(doc.id)}`,{
      method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    document.getElementById("app").innerHTML=
      `<div class="listo"><b>Semana ${SEMANA} abierta</b>
       ${PEND.length-1} acciones anotadas${cerrar.length?" · "+cerrar.length+" cerradas":""}.
       El viernes te preguntaré por ellas.</div>
       ${VUELVE?`<div style="padding:0 16px"><button class="env"
         style="width:100%;background:var(--tinta);color:#fff"
         onclick="location.href='${VUELVE}'">Volver al CRM</button></div>`:""}`;
    document.getElementById("pie").innerHTML="";
  }catch(e){ b.disabled=false; b.textContent="Reintentar"; alert("No se ha guardado: "+e.message); }
}
</script></body></html>
