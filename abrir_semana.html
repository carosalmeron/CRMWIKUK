<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abrir la semana</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--papel:#F2F4F7;--tinta:#14181F;--tenue:#6B7684;--linea:#DCE1E7;
        --hueco:#fff;--ok:#0E7C5A;--mal:#C2263D;--med:#B07908;--ambar:#FFFBEB}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);max-width:620px;
    margin-inline:auto;padding:0 0 40px;
    font:400 16px/1.5 "Instrument Sans",-apple-system,system-ui,sans-serif}
  .m{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  header{background:var(--tinta);color:#fff;padding:18px 16px}
  h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em}
  .hs{margin:3px 0 0;font-size:12.5px;color:#A7B2BE}
  main{padding:16px}
  .rot{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;
    letter-spacing:.13em;text-transform:uppercase;color:var(--tenue);margin:20px 0 9px}
  .comp{background:var(--ambar);border:1.5px solid #F59E0B;border-radius:6px;
    padding:15px;margin-bottom:18px}
  .comp h2{margin:0 0 2px;font-size:14.5px;font-weight:800;color:#92400E}
  .comp .p{margin:0 0 11px;font-size:11.5px;color:#92400E;opacity:.85}
  .prio{background:#fff;border-radius:5px;padding:10px 12px;font-size:13.5px;
    margin-bottom:11px}
  .ct{padding:9px 0;border-top:1px solid #FDE68A}
  .ct:first-of-type{border-top:none}
  .ct b{font-size:13px}
  .ct small{display:block;font-size:12px;color:var(--tenue);margin-top:2px}
  .ct .tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    background:#FDE68A;color:#92400E;border-radius:99px;padding:2px 7px;margin-left:5px}
  .ruta{width:100%;display:flex;align-items:center;gap:13px;padding:15px;
    border:1.5px solid var(--linea);background:var(--hueco);border-radius:6px;
    cursor:pointer;text-align:left;margin-bottom:9px;font:inherit}
  .ruta.on{border-color:var(--tinta);border-width:2px}
  .ruta .n{width:42px;height:42px;border-radius:11px;background:var(--tinta);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .ruta .t{flex:1;min-width:0}
  .ruta .t b{display:block;font-size:15px}
  .ruta .t small{display:block;font-size:11.5px;color:var(--tenue);margin-top:2px}
  .ruta .av{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;
    white-space:nowrap}
  .cli{background:var(--hueco);border:1px solid var(--linea);border-radius:5px;
    padding:12px 13px;margin-bottom:7px}
  .cc{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .cn{font-size:14.5px;font-weight:700;min-width:0}
  .cn small{display:block;font-weight:400;font-size:11px;color:var(--tenue);margin-top:1px}
  .cv{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:700;white-space:nowrap}
  .sen{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .s{font-size:11px;font-weight:600;border-radius:99px;padding:3px 9px;
    background:#EDF0F3;color:var(--tenue)}
  .s.mal{background:#FEF2F4;color:var(--mal)} .s.med{background:#FFF8EC;color:var(--med)}
  .s.ok{background:#EDF7F3;color:var(--ok)}
  .barra{position:sticky;bottom:0;background:var(--tinta);color:#fff;padding:13px 16px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    border-radius:6px;margin:16px}
  .barra p{margin:0;font-size:12.5px;color:#A7B2BE}
  button.env{background:#fff;color:var(--tinta);border:none;border-radius:3px;
    padding:11px 20px;font:800 14.5px inherit;cursor:pointer}
  button.env:disabled{opacity:.35}
  .nota{font-size:11.5px;color:var(--tenue);line-height:1.55;
    border-left:2px solid var(--linea);padding-left:11px;margin:14px 16px 0}
  .estado{padding:40px 16px;color:var(--tenue)}
</style></head><body>

<header><h1>Abrir la semana</h1><p class="hs" id="hs">Leyendo…</p></header>
<main id="app"><p class="estado">Leyendo…</p></main>
<div id="pie"></div>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const P=new URLSearchParams(location.search);
const ARR=(s)=>String(s||"").toUpperCase().trim();
const num=(n)=>Number(n)||0;
const eur=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
const AGENTE=ARR(P.get("agente")||"");
const SEMANA=Number(P.get("semana")||0);
let ELEGIDA=null;

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  return null;
}
async function leer(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<40);
  return t;
}
async function leerDoc(ruta){
  const r=await fetch(`${FB}/${ruta}`); if(!r.ok) return null;
  const j=await r.json(); const o={};
  for(const [k,x] of Object.entries(j.fields||{})) o[k]=val(x);
  return o;
}
function fecha(v){
  if(!v) return null;
  const s=String(v), a=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(a) return new Date(+a[1],+a[2]-1,+a[3]);
  const b=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
  if(b){ const y=b[3].length===2?2000+ +b[3]:+b[3]; return new Date(y,+b[2]-1,+b[1]); }
  return null;
}
const dias=(d)=>d?Math.floor((Date.now()-d)/86400000):null;

window.volver=()=>{ ELEGIDA=null;
  document.querySelectorAll(".ruta").forEach(x=>{x.style.display="";x.classList.remove("on");});
  document.getElementById("cambiar").style.display="none";
  document.getElementById("clientes").innerHTML=""; PEND=[]; contar();
};
window.actuar=(k,v,el)=>{
  R[k]=R[k]||{}; R[k].accion=v;
  [...el.parentNode.children].forEach(x=>x.classList.remove("on"));
  el.classList.add("on"); contar();
};
window.nota=(k,el)=>{ R[k]=R[k]||{}; R[k].texto=el.value.trim(); contar(); };
let PEND=[];
function contar(){
  const f=PEND.filter(k=>{ const r=R[k]||{}; return !(r.accion||r.texto); });
  const b=document.getElementById("btn"); if(!b) return;
  b.disabled = !ELEGIDA || f.length>0;
  document.getElementById("cuenta").innerHTML = !ELEGIDA
    ? "Elige cómo trabajas"
    : f.length ? `Faltan <b style="color:#fff">${f.length}</b> de ${PEND.length}`
    : (ELEGIDA==="libre"?"Semana libre":"Ruta "+ELEGIDA)+" · listo";
}

window.elegir=(r)=>{ ELEGIDA=r;
  // Al elegir se esconden las demas: el comercial ya ha decidido y lo que
  // necesita ver ahora es el trabajo, no el menu.
  document.querySelectorAll(".ruta").forEach(x=>{
    if(x.id==="r"+String(r).replace(/\W/g,"")) x.classList.add("on");
    else x.style.display="none";
  });
  document.getElementById("cambiar").style.display="block";
  pintarClientes(r);
};

let DATOS={};
function pintarClientes(r){
  const cont=document.getElementById("clientes");
  PEND=[];
  const corte = r==="libre" ? CORTE.libre : CORTE.ruta;
  const todos = DATOS.todos||[];
  const deRuta = r==="libre" ? [] : (DATOS.porRuta[r]||[]);
  const idsRuta = new Set(deRuta.map(c=>c.id));
  // Fuera de la ruta solo entra lo que pasa el corte
  const fuera = todos.filter(c=>!idsRuta.has(c.id) && c.riesgo>=corte)
    .sort((a,b)=>b.riesgo-a.riesgo).slice(0, r==="libre"?12:5);

  // El motivo en una frase y la accion que se propone: si el comercial tiene
  // que deducirlo de las etiquetas, no lo lee.
  const porQue=(c)=>{
    if(c.seco>=2) return {t:`Lleva ${c.seco} meses sin comprar. Antes te compraba `
      +`${eur(c.v)} al año.`, p:"Le llamo"};
    if(c.vs!=null&&c.vs<-25) return {t:`Cae un ${Math.round(-c.vs)} % contra `
      +`${ANIO-1}: ${eur(c.caida)} menos.`, p:"Le visito"};
    if(c.of) return {t:`Tiene ${c.of} oferta${c.of>1?"s":""} sin respuesta.`,
      p:"Le llamo"};
    if(c.mu) return {t:`Tiene ${c.mu} muestra${c.mu>1?"s":""} sin cerrar.`,
      p:"Le llamo"};
    if(c.ultVis==null) return {t:"No hay ninguna visita suya registrada.", p:"Le visito"};
    if(c.ultVis>90) return {t:`Hace ${c.ultVis} días que nadie le visita.`, p:"Le visito"};
    if(c.vs!=null&&c.vs<-8) return {t:`Va un ${Math.round(-c.vs)} % por debajo `
      +`de ${ANIO-1}.`, p:"Le visito"};
    return {t:"Toca visita de mantenimiento.", p:"Le visito"};
  };
  const tarjeta=(c,pref)=>{
    const k=pref+":"+c.id; PEND.push(k);
    const q=porQue(c);
    return `<div class="cli">
      <div class="cc">
        <div class="cn">${c.nom}<small>${c.pob||""}</small></div>
        <div class="cv">${eur(c.v)}</div>
      </div>
      <p style="margin:7px 0 0;font-size:13px">${q.t}</p>
      <div class="sen">
        ${c.of?`<span class="s med">${c.of} ofertas</span>`:""}
        ${c.mu?`<span class="s">${c.mu} muestras</span>`:""}
        ${c.ultVis!=null?`<span class="s">visita hace ${c.ultVis} d</span>`:""}
        ${c.vs!=null?`<span class="s ${c.vs<-8?"mal":c.vs>8?"ok":""}">${
          c.vs>=0?"+":""}${Math.round(c.vs)} % año</span>`:""}
      </div>
      <div class="acc">${["Le visito","Le llamo","Le mando oferta","Esta semana no"]
        .map(x=>`<button class="chip${x===q.p?" prop":""}"
          onclick="actuar('${k}','${x}',this)">${x}</button>`).join("")}</div>
      <textarea placeholder="Cuándo y con qué argumento" oninput="nota('${k}',this)"></textarea>
    </div>`;
  };

  const pend=(l,tipo,tit,sub,opciones)=>{
    if(!l.length) return "";
    return `<p class="rot">${tit} · ${l.length}</p>
      <p style="font-size:12px;color:var(--tenue);margin:-4px 0 10px">${sub}</p>
      ${l.map(o=>{
        const k=tipo+":"+o.id; PEND.push(k);
        return `<div class="cli">
          <div class="cc">
            <div class="cn">${o.cli}<small>${o.tit||""}${o.tit?" · ":""}${o.d} días abierta</small></div>
            <div class="cv ${o.d>60?"dn":""}">${o.imp?eur(o.imp):o.d+" d"}</div>
          </div>
          <div class="acc">${opciones.map(x=>
            `<button class="chip" onclick="actuar('${k}','${x}',this)">${x}</button>`).join("")}</div>
          <textarea placeholder="¿Qué vas a hacer?" oninput="nota('${k}',this)"></textarea>
        </div>`;
      }).join("")}`;
  };

  cont.innerHTML=`
    ${r!=="libre"&&deRuta.length?`<p class="rot">Te toca la ruta ${r} · ${deRuta.length} clientes</p>
      <p style="font-size:12px;color:var(--tenue);margin:-4px 0 10px">
        Ordenados por lo que hay en juego. La opción marcada es la que
        propone el sistema; cámbiala si no encaja.</p>
      ${deRuta.sort((a,b)=>b.riesgo-a.riesgo).map(c=>tarjeta(c,"ruta")).join("")}`:""}

    ${fuera.length?`<p class="rot">${r==="libre"
        ? "Clientes en riesgo" : "Y esto no puede esperar"}</p>
      <p style="font-size:12px;color:var(--tenue);margin:-4px 0 10px">
        ${r==="libre" ? "Los que caen, los que han dejado de comprar y los que se enfrían."
          : "Solo lo muy urgente: el resto puede esperar a su semana."}</p>
      ${fuera.map(c=>tarjeta(c,"extra")).join("")}`:""}

    ${pend(DATOS.of||[],"oferta","Ofertas sin respuesta",
      "Llevan tiempo paradas y nadie ha vuelto sobre ellas.",
      ["La reclamo","Bajo el precio","La doy por perdida","Esta semana no"])}

    ${pend(DATOS.mu||[],"muestra","Muestras sin cerrar",
      "Enviadas hace tiempo y sin resultado.",
      ["Le llamo","Le visito","La doy por perdida","Esta semana no"])}

    ${pend(DATOS.es||[],"estrategia","Estrategias abiertas",
      "Proyectos que no avanzan.",
      ["Doy un paso esta semana","La replanteo","La cierro","Esta semana no"])}

    ${!deRuta.length&&!fuera.length&&!(DATOS.of||[]).length&&!(DATOS.mu||[]).length
      ?`<p style="font-size:13px;color:var(--tenue);margin:0">
        Nada urgente esta semana. Buen momento para prospección.</p>`:""}

    <p class="rot">Tu prioridad</p>
    <textarea placeholder="Lo que de verdad quieres conseguir esta semana"
      oninput="nota('prioridad',this)"></textarea>`;
  PEND.push("prioridad");
  contar();
}

const ANIO=new Date().getFullYear();
// Con ruta el comercial ya tiene el dia lleno, asi que solo se le mete lo MUY
// urgente. En semana libre se le puede proponer mas.
const CORTE={ ruta:8000, libre:2500 };
const R={};                      // sus respuestas

(async()=>{
  if(!AGENTE||!SEMANA){ document.getElementById("app").innerHTML=
    '<p class="estado">Añade <b>?agente=RICARDO&semana=32</b> a la dirección.</p>'; return; }
  try{
    const [cli,vis,mu,of,mesesRaw,perf,portal,usus,res,fichas,es]=await Promise.all([
      leer("pbi_ventas_cliente"), leer("visitas"), leer("muestras"), leer("ofertas"),
      leer("pbi_meses_cliente"), leer("pbi_perfiles"), leer("portal_users"),
      leer("usuarios"), leer("pbi_resumen_agente"), leer("clientes"),
      leer("estrategias"),
    ]);
    const yo=res.find(a=>ARR(a._id)===AGENTE)||{};

    // El perfil con el que guarda su actividad
    const MIOS=new Set([AGENTE]);
    perf.forEach(x=>{ if(ARR(x.agente)===AGENTE) MIOS.add(ARR(x._id)); });
    [...portal,...usus].forEach(f=>{
      if(ARR(f.grupoAgente||f.catalogoVendedor)!==AGENTE) return;
      [f.crmId,f._id,f.id,f.username].forEach(c=>{ if(c) MIOS.add(ARR(c)); });
    });
    const esMio=(o)=>MIOS.has(ARR(o.agente||o.autor||o.comercial));

    // Meses por cliente
    const mes={};
    for(const d of mesesRaw){ try{ for(const f of JSON.parse(d.datos||"[]")) mes[f[0]]=f; }catch(e){} }
    const ultimo=new Date().getMonth();

    // Ultima visita de cada cliente
    const ultVis={};
    for(const v of vis){
      const c=ARR(v.clienteId); if(!c) continue;
      const f=fecha(v.fecha); if(!f) continue;
      if(!ultVis[c]||f>ultVis[c]) ultVis[c]=f;
    }
    // Muestras y ofertas abiertas por cliente
    const abiertas=(l,cerrados)=>{
      const m={};
      for(const o of l){
        if(!esMio(o)) continue;
        const e=String(o.estado||"").toLowerCase();
        if(cerrados.includes(e)) continue;
        const c=ARR(o.clienteId||o.cliente); if(!c) continue;
        m[c]=(m[c]||0)+1;
      }
      return m;
    };
    const nMu=abiertas(mu,["positivo","pedido","ko","negativo"]);
    const nOf=abiertas(of,["pedido","perdida","aceptada","rechazada"]);

    // Sus clientes, agrupados por ruta
    // Las rutas salen de la coleccion "clientes" del CRM, campo SEMANAVISITA,
    // que es lo que usa Mi semana. Las ventas vienen de pbi_ventas_cliente.
    const ventasDe={};
    for(const c of cli){
      const ok=c.cuenta!==undefined?c.cuenta:(!c.intercompany&&!c.fusionadoEn);
      if(ok) ventasDe[ARR(c._id)]=c;
    }
    const porRuta={};
    for(const fc of fichas){
      const r=parseInt(fc.SEMANAVISITA||fc.semanaVisita||fc.ruta||fc.semana||0)||0;
      if(!r) continue;
      const id=ARR(fc.codigo||fc.CODIGO||fc._id);
      const c=ventasDe[id]||{};
      // Solo los suyos: por la ficha o por el cliente de ventas
      const suyo = ARR(c.agenteFinal||c.agente)===AGENTE
        || MIOS.has(ARR(fc.agente||fc.AGENTE||fc.grupoAgente));
      if(!suyo) continue;
      const f=mes[id];
      let seco=0, vs=null;
      if(f){ const m=[]; for(let i=1;i<=ultimo;i++) m.push(num(f[i]));
        for(let i=m.length-1;i>=0&&m[i]===0;i--) seco++; }
      const a=num(c.ventasAntYTD);
      if(a) vs=(num(c.ventasAct)-a)/a*100;
      const uv=ultVis[id]?dias(ultVis[id]):null;
      // Lo que hay en juego: se ordena por esto, no por el nombre
      const riesgo=(vs!=null&&vs<0?-vs*num(c.ventasAct)/100:0)
        + (seco>=2?num(c.ventasAct)*0.3:0) + (uv==null||uv>90?num(c.ventasAct)*0.1:0);
      (porRuta[r]=porRuta[r]||[]).push({
        caida:Math.max(0,num(c.ventasAntYTD)-num(c.ventasAct)),
        id, nom:c.nombre||fc.nombre||fc.NOMBRE||id,
        pob:c.poblacion||fc.poblacion||fc.POBLACION||"", v:num(c.ventasAct),
        vs, seco, ultVis:uv, mu:nMu[id]||0, of:nOf[id]||0, riesgo });
    }
    // Todos sus clientes con riesgo, tengan ruta o no: son los que se
    // pueden proponer cuando algo no puede esperar a su semana.
    const todos=[];
    for(const [id,c] of Object.entries(ventasDe)){
      if(ARR(c.agenteFinal||c.agente)!==AGENTE) continue;
      const f=mes[id]; let seco=0, vs=null;
      if(f){ const m=[]; for(let i=1;i<=ultimo;i++) m.push(num(f[i]));
        for(let i=m.length-1;i>=0&&m[i]===0;i--) seco++; }
      const a=num(c.ventasAntYTD); if(a) vs=(num(c.ventasAct)-a)/a*100;
      const uv=ultVis[id]?dias(ultVis[id]):null;
      const v=num(c.ventasAct);
      // Lo que de verdad esta en riesgo. Quien crece y factura bien NO entra
      // aunque no tenga visita registrada: eso es un hueco de datos, no un
      // problema comercial, y llenaba la lista de falsos positivos.
      const cae   = vs!=null && vs<-10;
      const parado= seco>=2;
      const frio  = (uv==null||uv>120) && vs!=null && vs<0;
      let riesgo=0;
      if(cae)    riesgo += -vs*v/100;
      if(parado) riesgo += v*0.4;
      if(frio)   riesgo += v*0.15;
      if(!cae&&!parado&&!frio) riesgo=0;   // sano: fuera de la lista
      if(v>0) todos.push({id, nom:c.nombre||id, pob:c.poblacion||"", v, vs, seco,
        caida:Math.max(0,a-v), ultVis:uv, mu:nMu[id]||0, of:nOf[id]||0, riesgo});
    }
    // Lo que lleva demasiado tiempo abierto, con los mismos umbrales del cierre
    const REG={oferta:{d:5,n:6}, muestra:{d:30,n:6}, estrategia:{d:15,n:5}};
    const viejas=(lista,tipo,cerrados)=>{
      const g=REG[tipo];
      return lista.filter(o=>{
        if(!esMio(o)) return false;
        const e=String(o.estado||"").toLowerCase();
        if(cerrados.includes(e)) return false;
        const d=dias(fecha(o.fecha||o.fechaCreacion));
        return d!=null && d>g.d;
      }).map(o=>({id:o._id, cli:o.clienteNombre||o.cliente||"(sin cliente)",
        d:dias(fecha(o.fecha||o.fechaCreacion)), imp:num(o.importe||o.total),
        tit:o.titulo||o.producto||""}))
       .sort((a,b)=> tipo==="oferta" ? b.imp-a.imp : b.d-a.d).slice(0,g.n);
    };
    DATOS={porRuta, todos,
      of:viejas(of,"oferta",["pedido","perdida","aceptada","rechazada"]),
      mu:viejas(mu,"muestra",["positivo","pedido","ko","negativo"]),
      es:viejas(es,"estrategia",["completada","ko","cerrada"])};

    // Lo que prometió al cerrar la anterior
    const inf=await leerDoc(`informes/${AGENTE}_s${SEMANA-1}`)
      || await leerDoc(`informes/informe_${AGENTE}_s${SEMANA-1}`);
    let comp=null;
    if(inf&&inf.respuestas){
      let R={}; try{ R=JSON.parse(inf.respuestas); }catch(e){}
      const l=[];
      for(const [k,v] of Object.entries(R)){
        if(!v||(!v.accion&&!v.texto)) continue;
        if(/Ya lo sé|por perdida|por cerrada/i.test(v.accion||"")) continue;
        if(k==="prioridad"||k==="semana") continue;
        const p=k.split(/:(.+)/);
        l.push({tipo:p[0], accion:v.accion||"", texto:v.texto||""});
      }
      if(l.length||R.prioridad) comp={lista:l, prio:(R.prioridad||{}).texto||""};
    }

    const rutas=Object.keys(porRuta).sort();
    document.getElementById("hs").textContent=
      `${yo.agente||AGENTE} · ${yo.equipo||""} · semana ${SEMANA}`;
    document.getElementById("app").innerHTML=`
      ${comp?`<div class="comp">
        <h2>Lo que dijiste al cerrar la semana ${SEMANA-1}</h2>
        <p class="p">Tenlo delante al programar esta.</p>
        ${comp.prio?`<p class="prio"><b>Tu prioridad:</b> ${comp.prio}</p>`:""}
        ${comp.lista.slice(0,8).map(x=>`<div class="ct">
          <b>${x.accion||"Pendiente"}</b><span class="tag">${x.tipo}</span>
          ${x.texto?`<small>${x.texto}</small>`:""}</div>`).join("")}
        ${comp.lista.length>8?`<p class="p" style="margin:9px 0 0">Y ${comp.lista.length-8} más.</p>`:""}
      </div>`:""}

      <p class="rot">Cómo vas a trabajar esta semana</p>
      ${!rutas.length?`<p style="font-size:12.5px;color:var(--tenue);margin:-4px 0 10px">
        No tiene clientes con semana de visita asignada, así que solo puede
        trabajar en libre.</p>`:""}
      ${(()=>{ const j={}; rutas.forEach(r=>j[r]=porRuta[r].reduce((s,c)=>s+c.riesgo,0));
        const mejor=rutas.slice().sort((a,b)=>j[b]-j[a])[0];
        return mejor&&j[mejor]>3000?`<p style="font-size:12.5px;color:var(--tenue);
          margin:-4px 0 10px">Si puedes elegir, <b style="color:var(--tinta)">la ruta
          ${mejor}</b> es la que más urgencia acumula.</p>`:""; })()}
      ${rutas.map(r=>{
        const l=porRuta[r], enJuego=l.reduce((s,c)=>s+c.riesgo,0);
        return `<button class="ruta" id="r${String(r).replace(/\W/g,"")}"
          onclick="elegir('${r}')">
          <span class="n">${r}</span>
          <span class="t"><b>Ruta ${r}</b>
            <small>${l.length} clientes · ${eur(l.reduce((s,c)=>s+c.v,0))} al año</small></span>
          ${enJuego>1000?`<span class="av" style="color:var(--mal)">${eur(enJuego)}<br>
            <span style="font-weight:400;color:var(--tenue)">en juego</span></span>`:""}
        </button>`;
      }).join("")}
      <button class="ruta" id="rlibre" onclick="elegir('libre')">
        <span class="n" style="background:#7C3AED">L</span>
        <span class="t"><b>Semana libre</b><small>Prospección, sin ruta fija</small></span>
      </button>

      <p id="cambiar" style="display:none;margin:-2px 0 4px">
        <a href="#" onclick="volver();return false"
           style="font-size:12.5px;color:var(--tenue)">← Cambiar de semana</a></p>
      <div id="clientes"></div>`;

    document.getElementById("pie").innerHTML=`
      <div class="barra"><p id="cuenta">Elige cómo trabajas</p>
        <button class="env" id="btn" disabled onclick="alert('Boceto: aquí se guardaría el plan con tus respuestas.')">
          Abrir semana</button></div>
      <p class="nota">Boceto. <b>Con ruta</b> salen sus clientes más lo muy urgente
        de fuera; <b>en libre</b>, los que más en juego tienen. Cada uno pide una
        acción, como en el cierre, y eso es lo que se le recordará el viernes.</p>`;
  }catch(e){
    document.getElementById("app").innerHTML=`<p class="estado">No se ha podido montar: ${e.message}</p>`;
  }
})();
</script></body></html>
