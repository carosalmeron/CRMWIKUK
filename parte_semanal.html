<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parte semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#14181F; --papel:#FAFBFC; --hueco:#FFFFFF; --linea:#DCE1E7;
    --tenue:#6B7684; --sube:#0E7C5A; --cae:#D4232E; --pendiente:#B07908;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--papel);color:var(--tinta);
    font:400 15px/1.5 "Instrument Sans",-apple-system,system-ui,sans-serif;
    max-width:430px;margin-inline:auto;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  .m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

  .filtros{background:var(--hueco);border-bottom:1px solid var(--linea);padding:12px 20px}
  .periodo{display:flex;gap:6px;margin-bottom:10px}
  .pb{flex:1;border:1px solid var(--linea);background:var(--hueco);color:var(--tenue);
    border-radius:3px;padding:9px 0;font:600 13px inherit;cursor:pointer}
  .pb.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .navsem{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--hueco);border:1px solid var(--linea);border-radius:3px;padding:4px}
  .navsem span{font-size:13.5px;font-weight:600}
  .fl{border:none;background:transparent;color:var(--tinta);font-size:22px;
    line-height:1;padding:6px 16px;cursor:pointer}
  .fl:disabled{opacity:.25}
  .chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:2px;margin-bottom:9px}
  .chip{flex:0 0 auto;border:1px solid var(--linea);background:var(--hueco);
    color:var(--tenue);border-radius:99px;padding:7px 14px;font:600 12.5px inherit;
    cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .selagente{width:100%;padding:9px 11px;border:1px solid var(--linea);
    border-radius:3px;font:400 13.5px inherit;color:var(--tinta);background:var(--hueco)}

  header{background:var(--tinta);color:#fff;padding:22px 20px 20px}
  .volver{display:inline-block;color:#A7B2BE;text-decoration:none;font-size:13px;margin-bottom:14px}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:#8E9AA8;margin:0 0 8px}
  h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
  .equipo{margin:5px 0 0;font-size:13px;color:#A7B2BE}
  .rango{margin:14px 0 0;padding-top:13px;border-top:1px solid #2A3038;
    font-family:"IBM Plex Mono",monospace;font-size:12px;color:#8E9AA8;
    display:flex;justify-content:space-between}

  section{padding:24px 20px 4px}
  section + section{border-top:8px solid #EDF0F3}
  .rot{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
    letter-spacing:.13em;text-transform:uppercase;color:var(--tenue);margin:0 0 12px}
  .cifra{font-size:40px;font-weight:600;letter-spacing:-.04em;margin:0;line-height:1}
  .cifra small{font-size:22px;font-weight:500;margin-left:2px}
  .pie{margin:9px 0 0;font-size:13px;color:var(--tenue)}

  /* Barra de desviacion: el centro es la referencia, no el cero. */
  .desv{margin:16px 0 0}
  .pista{position:relative;height:30px;background:#EDF0F3;border-radius:2px;overflow:hidden}
  .centro{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--tinta);z-index:2}
  .barra{position:absolute;top:0;bottom:0;animation:crece .7s cubic-bezier(.2,.8,.3,1) both}
  .barra.mas{left:50%;background:var(--sube);transform-origin:left}
  .barra.menos{right:50%;background:var(--cae);transform-origin:right}
  @keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .marcas{display:flex;justify-content:space-between;margin-top:7px;
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--tenue)}
  .delta{font-weight:700}
  .delta.mas{color:var(--sube)} .delta.menos{color:var(--cae)}

  /* Barra del año: el ancho total es el objetivo anual. */
  .anual{margin-top:6px}
  .apista{position:relative;height:34px;background:#EDF0F3;border-radius:2px;overflow:hidden}
  .apista > i{display:block;height:100%;background:var(--tinta);
    animation:llenar .8s cubic-bezier(.2,.8,.3,1) both;transform-origin:left}
  .amarca{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--pendiente);z-index:2}
  .amarca::after{content:"hoy tocaría";position:absolute;left:7px;top:8px;white-space:nowrap;
    font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;
    letter-spacing:.05em;color:var(--pendiente)}
  .aleyenda{display:flex;justify-content:space-between;gap:12px;margin-top:9px;
    font-size:12px;color:var(--tenue)}
  .aleyenda b{display:block;font-size:14px;font-weight:700;color:var(--tinta)}
  .ader{text-align:right}
  @keyframes llenar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .dfila{border:1px solid var(--linea);border-radius:3px;background:var(--hueco);
    padding:10px 12px;margin-bottom:6px}
  .dfila.n1{cursor:pointer}
  .dfila.n2{margin-left:14px;cursor:pointer;background:#FBFCFD}
  .dfila.n3{margin-left:28px;background:#F7F9FB;border-style:dashed}
  .dcab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .dnom{font-size:14px;font-weight:700;min-width:0}
  .dnom small{display:block;font-weight:400;font-size:10.5px;color:var(--tenue);margin-top:1px}
  .dchv{color:var(--tenue);font-weight:400}
  .dval{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:700;white-space:nowrap}
  .dbar{display:flex;gap:2px;height:5px;margin-top:8px}
  .dbar i{display:block;border-radius:99px}
  .dpie{margin:6px 0 0;font-size:11px;color:var(--tenue)}
  .dley{margin:0 0 9px;font-size:11px;color:var(--tenue);display:flex;
    align-items:center;gap:5px}
  .dley i{display:inline-block;width:13px;height:5px;border-radius:99px}
  .dley .lg{background:#D3D9E0} .dley .lc{background:var(--tinta);margin-left:7px}

  .danio{margin:3px 0 0;font-size:10.5px;color:var(--tenue);
    padding-top:4px;border-top:1px dotted var(--linea)}
  .danio b{font-weight:700}

  .dmas{margin:2px 0 8px 28px;font-size:11px;color:var(--tenue)}

  .obj{margin:22px 0 0;padding-top:20px;border-top:1px solid var(--linea)}
  .objfila{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .objfila span:first-child{font-size:13.5px;font-weight:600}
  .objpct{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:700}
  .llena{height:9px;background:#EDF0F3;border-radius:99px;overflow:hidden}
  .llena i{display:block;height:100%;background:var(--pendiente);border-radius:99px;
    animation:llenar .8s cubic-bezier(.2,.8,.3,1) both;transform-origin:left}

  /* Marcador de actividad: mismo formato para todo lo comparable. */
  .marca{margin-bottom:26px}
  .marca:last-of-type{margin-bottom:0}
  .mcab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .mtit{font-size:15px;font-weight:600}
  .mpct{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:700}
  .mflujo{margin:0 0 9px;font-size:12.5px;color:var(--tenue)}
  .mbar{display:flex;gap:2px;height:8px;margin-bottom:8px}
  .mbar i{border-radius:99px;animation:llenar .7s cubic-bezier(.2,.8,.3,1) both;transform-origin:left}
  .mpie{display:flex;gap:16px;font-size:12.5px;color:var(--tenue);
    font-family:"IBM Plex Mono",monospace}
  .mpie b{font-size:14px;font-weight:700}

  .mpend{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    margin-top:10px;padding:8px 11px;background:#FFF8E8;
    border-left:2px solid var(--pendiente);border-radius:0 2px 2px 0}
  .mpend span:first-child{font-size:12.5px;color:#7A5A08}
  .mpend b{font-size:15px;font-weight:700;color:var(--pendiente)}
  .mdias{font-size:11px;color:#9C7A2E;white-space:nowrap}

  .tabla{overflow-x:auto;-webkit-overflow-scrolling:touch;
    border:1px solid var(--linea);border-radius:3px;background:var(--hueco)}
  table.rank{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap}
  table.rank th{position:sticky;top:0;background:#EDF0F3;font-weight:700;
    font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--tenue);
    padding:8px 7px;text-align:right;border-bottom:1px solid var(--linea)}
  table.rank td{padding:8px 7px;border-bottom:1px solid var(--linea);text-align:right}
  table.rank .fijo{position:sticky;left:0;background:var(--hueco);text-align:left;
    font-weight:700;min-width:118px;box-shadow:1px 0 0 var(--linea)}
  table.rank th.fijo{background:#EDF0F3;z-index:2}
  table.rank .fijo small{display:block;font-weight:400;font-size:10px;color:var(--tenue)}
  table.rank .n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  table.rank .sep{border-left:1px solid var(--linea)}
  table.rank .tri{letter-spacing:.5px;color:var(--linea)}
  table.rank .env{color:var(--tinta)}
  table.rank .tri b{font-weight:700}
  table.rank .ok{color:var(--sube)} table.rank .ko{color:var(--cae)}
  table.rank .pd{color:var(--pendiente)}
  table.rank tr:last-child td{border-bottom:none}

  table{width:100%;border-collapse:collapse;margin-top:2px}
  td{padding:10px 0;border-bottom:1px solid var(--linea);font-size:14px;vertical-align:baseline}
  td:last-child{text-align:right;white-space:nowrap;padding-left:14px}
  tr:last-child td{border-bottom:none}
  .cli{font-weight:600}
  .cli small{display:block;font-weight:400;font-size:11.5px;color:var(--tenue);margin-top:2px}
  .imp{font-family:"IBM Plex Mono",monospace;font-weight:600}
  .var{font-family:"IBM Plex Mono",monospace;font-size:11.5px;display:block;
    margin-top:3px;color:var(--tenue)}

  .falta{background:var(--hueco);border:1px dashed var(--linea);border-radius:3px;
    padding:14px 15px;font-size:12.5px;line-height:1.55;color:var(--tenue)}
  .falta b{color:var(--tinta);font-weight:600}
  .estado{padding:40px 20px;font-size:14.5px;color:var(--tenue)}
  @media (prefers-reduced-motion:reduce){.barra,.apista>i,.llena i,.mbar i{animation:none}}
</style>
</head>
<body>
<div id="app"><p class="estado">Leyendo… <span id="ver">v1.1</span></p></div>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const $=(id)=>document.getElementById(id);
const eur=(n)=>Math.round(n||0).toLocaleString("es-ES")+" €";
const num=(n)=>Number(n)||0;
const arriba=(s)=>String(s||"").toUpperCase().trim();
const ANIO=new Date().getFullYear();
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio",
             "agosto","septiembre","octubre","noviembre","diciembre"];

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined)  return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined)  return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.arrayValue!==undefined)   return (f.arrayValue.values||[]).map(val);
  if(f.nullValue!==undefined)    return null;
  return null;
}
function plano(doc){
  const o={_id:decodeURIComponent(doc.name.split("/").pop())};
  // Firestore sella cada documento al crearlo. Es la unica fecha que tienen
  // los 770 registros sin campo de fecha, y la que usa la pantalla del CRM.
  if(doc.createTime) o._creado=String(doc.createTime).slice(0,10);
  for(const [k,v] of Object.entries(doc.fields||{})) o[k]=val(v);
  return o;
}
const FALLOS=[], PAGINAS={}; let HECHAS=0, TOTAL=0;
// Con tiempo limite: una peticion que no vuelve dejaba la pagina en "Leyendo…"
// para siempre, sin decir cual era. Ahora aborta a los 12 s y lo cuenta.
async function leerCol(col){
  // El try iba fuera del bucle: si fallaba la segunda pagina, el catch la
  // silenciaba y devolvia los primeros 300 como si fueran todos.
  const todo=[]; let tok=null, pag=0;
  do{
    let j=null;
    try{
      const r=await fetch(`${FB}/${col}?pageSize=300`
        +(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
      if(!r.ok){ FALLOS.push(`${col} pag.${pag+1} HTTP ${r.status}`); break; }
      j=await r.json();
    }catch(e){ FALLOS.push(`${col} pag.${pag+1}: ${e.message}`); break; }
    const docs=(j.documents||[]).map(plano);
    todo.push(...docs);
    pag++;
    tok=j.nextPageToken||null;
    if(!docs.length) break;                 // pagina vacia: no seguir
  }while(tok&&pag<30);
  PAGINAS[col]=pag;
  return todo;
}

async function leerDoc(ruta){
  try{
    const r=await fetch(`${FB}/${ruta}`);
    return r.ok ? plano(await r.json()) : null;
  }catch(e){ return null; }
}

// La identidad viaja en el hash, como en pedidos.html: localStorage se pierde
// y no sobrevive a entrar desde un enlace.
function sesion(){
  try{
    const h=decodeURIComponent((location.hash||"").replace(/^#/,""));
    if(h){ const u=JSON.parse(h); if(u&&(u.username||u.crmId||u.nombre)) return u; }
  }catch(e){}
  try{ return JSON.parse(localStorage.getItem("gc_portal_user")||"{}"); }catch(e){ return {}; }
}

const iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${
  String(d.getDate()).padStart(2,"0")}`;

// Suma un conjunto de comerciales. Los porcentajes se recalculan sobre las
// bases, nunca se promedian: promediar margenes da un numero que no existe.
function agregar(lista){
  const t={ventasSem:0,ventasSemAnt:0,ventasMes:0,ventasMesAnt:0,ventasAct:0,
           ventasAntYTD:0,margenMes:0,baseMes:0,margenAct:0,baseAct:0,
           clientes:0,clientesConVentaMes:0,objetivoMargen:0,pesoObj:0};
  for(const a of lista){
    t.ventasSem+=num(a.ventasSem); t.ventasSemAnt+=num(a.ventasSemAnt);
    t.ventasMes+=num(a.ventasMes); t.ventasMesAnt+=num(a.ventasMesAnt);
    t.ventasAct+=num(a.ventasAct); t.ventasAntYTD+=num(a.ventasAntYTD);
    t.margenMes+=num(a.margenMes); t.baseMes+=num(a.baseMes);
    t.margenAct+=num(a.margenAct); t.baseAct+=num(a.baseAct);
    t.clientes+=num(a.clientes);   t.clientesConVentaMes+=num(a.clientesConVentaMes);
    if(a.objetivoMargen){ t.objetivoMargen+=num(a.objetivoMargen)*num(a.ventasAct); t.pesoObj+=num(a.ventasAct); }
  }
  t.margenPctMes = t.baseMes ? t.margenMes/t.baseMes*100 : null;
  t.margenPctAct = t.baseAct ? t.margenAct/t.baseAct*100 : null;
  t.objetivoMargen = t.pesoObj ? t.objetivoMargen/t.pesoObj : null;
  return t;
}

// Estados sacados de crm.html. Todo lo que no sea un cierre explicito cuenta
// como abierto: es la lectura dura, y es la que hace visible el atasco.
const CIERRES={
  // "positivo" es como el CRM marca una muestra que ha ido bien; contarla
  // como abierta hundia la conversion y engordaba la cartera.
  muestras:    {ok:["pedido","positivo","positiva","ok","aceptada"],
                ko:["ko","negativo","negativa","rechazada","cerrada"]},
  ofertas:     {ok:["pedido","aceptada","ok"],   ko:["rechazada","perdida","ko"]},
  estrategias: {ok:["completada","ok"],          ko:["ko","cancelada","perdida"]},
  incidencias: {ok:["cerrada","resuelta","ok"],  ko:[]},
};
const AGENTES_C=["agente","comercial","vendedor","autor","grupoAgente"];
function agenteDe(o){
  const t=window.__TRAD__||{};
  for(const c of AGENTES_C){
    if(!o[c]) continue;
    const v=arriba(o[c]);
    return t[v]||v;      // si es un perfil del CRM se traduce; si no, tal cual
  }
  return "";
}
const FECHAS=["fecha","fechaCreacion","fechaCreacionStr","creadoEl","fechaEnvio","fechaAlta","fechaSolicitud","createdAt"];
function fechaDe(o){
  for(const c of FECHAS){
    if(!o[c]) continue;
    const v=String(o[c]);
    // Puede venir como 2026-07-31, 31/07/2026 o un sello con hora
    let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return `${m[1]}-${m[2]}-${m[3]}`;
    // Dia y mes pueden venir con una sola cifra: 21/4/2026 tambien es valido
    m=v.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
    if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  }
  return o._creado||null;     // ultimo recurso: cuando se creo el documento
}
function clasificar(col,lista,clave,desde,sel,hasta){
  // sel acota por equipo o vendedor cuando quien mira es un mando
  const r={nuevas:0, ok:0, ko:0, abiertas:0, masVieja:null, fuera:0,
           conFecha:0, min:null, max:null};
  const reglas=CIERRES[col];
  for(const o of lista){
    if(clave && agenteDe(o)!==clave) continue;
    // Mirando "Todos" no se descarta nada: lo que no se sabe atribuir
    // se cuenta igual y se avisa de cuanto es.
    if(!clave && sel && sel.size && !sel.has(agenteDe(o))){
      if(!sel.todos) continue;
      r.fuera++;
    }
    const est=String(o.estado||"").toLowerCase();
    const res=String(o.resultado||"").toLowerCase();
    const esOk=reglas.ok.includes(est)||reglas.ok.includes(res);
    const esKo=!esOk&&(reglas.ko.includes(est)||reglas.ko.includes(res));
    const f=fechaDe(o);
    if(f){ r.conFecha++; if(!r.min||f<r.min) r.min=f; if(!r.max||f>r.max) r.max=f; }
    if(f&&f>=desde&&f<=(hasta||"9999-12-31")) r.nuevas++;
    if(esOk) r.ok++;
    else if(esKo) r.ko++;
    else {
      r.abiertas++;
      if(f&&(!r.masVieja||f<r.masVieja)) r.masVieja=f;
    }
  }
  return r;
}
let VENTANA="esta semana";
const COL_ACT={Muestras:"muestras",Ofertas:"ofertas",Estrategias:"estrategias",Incidencias:"incidencias"};
let DESDE="",HASTA="";
function marcadorHTML(tit,r,etqOk,etqKo){
  const desde=DESDE,hasta=HASTA;
  const cerradas=r.ok+r.ko;
  const total=cerradas+r.abiertas;
  if(!total) return "";
  const pct=total?r.ok/total*100:0;
  let dias=null;
  if(r.masVieja){
    const d=new Date(r.masVieja+"T12:00:00");
    if(!isNaN(d)) dias=Math.round((Date.now()-d)/86400000);
  }
  const w=(n)=>total?(n/total*100).toFixed(1):0;
  return `<div class="marca">
    <div class="mcab"><span class="mtit">${tit}</span>
      <span class="mpct m" style="color:var(--${pct>=40?"sube":pct>=15?"pendiente":"cae"})">${
        Math.round(pct)} %</span></div>
    <p class="mflujo m">${r.nuevas} nueva${r.nuevas===1?"":"s"} ${VENTANA} · ${total} en total${
      r.fuera?` · ${r.fuera} sin atribuir`:""}<br><span style="font-size:11px">con fecha ${r.conFecha} de ${r.ok+r.ko+r.abiertas}${r.min?` · de ${r.min} a ${r.max}`:""} · ventana ${desde} a ${hasta}</span></p>
    <div class="mbar">
      <i style="width:${w(r.ok)}%;background:var(--sube)"></i>
      <i style="width:${w(r.ko)}%;background:var(--cae)"></i>
      <i style="width:${w(r.abiertas)}%;background:var(--pendiente)"></i>
    </div>
    <div class="mpie">
      <span><b style="color:var(--sube)">${r.ok}</b> ${etqOk}</span>
      ${etqKo?`<span><b style="color:var(--cae)">${r.ko}</b> ${etqKo}</span>`:""}
      <span><b style="color:var(--pendiente)">${r.abiertas}</b> abiertas</span>
    </div>
    ${r.abiertas?`<div class="mpend">
      <span class="m"><b>${r.abiertas}</b> sin resolver</span>
      ${dias!==null?`<span class="mdias m">la más antigua, ${dias} días</span>`:""}
    </div>`:""}
  </div>`;
}

// Barra de desviacion. El ancho se satura al 50% para que un +900% no rompa
// la escala; el numero de al lado sigue siendo el real.
function desvHTML(pct, etqMenos, etqMas){
  if(pct===null||!isFinite(pct)) return "";
  const ancho=Math.min(Math.abs(pct)/100*50, 50);
  const lado=pct>=0?"mas":"menos";
  return `<div class="desv">
    <div class="pista"><div class="centro"></div>
      <div class="barra ${lado}" style="width:${ancho.toFixed(1)}%"></div></div>
    <div class="marcas"><span>${etqMenos}</span>
      <span class="delta ${lado}">${pct>=0?"+":""}${pct.toFixed(1)} %</span>
      <span>${etqMas}</span></div></div>`;
}

        ${periodo!=="ano"?anual(aa):""}
      </div>`;

    const ley=`<p class="dley"><i class="lg"></i> ${ANIO-1}
      <i class="lc"></i> ${ANIO} · comparado con el mismo periodo</p>`;
    return ley + lista.map(r=>{
      const ab=abierto.rama===r.k;
      let html=fila(r.k, `${r.ag.length} comerciales`, r.act, r.ant, "n1",
        `abrirRama('${r.k.replace(/'/g,"")}')`, ab, {act:r.aAct,ant:r.aAnt});
      if(!ab) return html;
      const ags=r.ag.slice().sort((a,b)=>(a.act-a.ant)-(b.act-b.ant));
      html+=ags.map(a=>{
        const abv=abierto.vend===a._id;
        let h=fila(a.agente||a._id, a.equipo, a.act, a.ant, "n2",
          `abrirVend('${String(a._id).replace(/'/g,"")}')`, abv, a._an);
        if(!abv) return h;
        // Clientes: del mes si hay desglose, del año si no
        // Por cliente solo hay dato mensual y anual. En Semana no se enseña
        // nada antes que enseñar el acumulado del año haciendolo pasar por
        // la semana.
        if(periodo==="sem")
          return h+'<p class="dmas">Sin desglose por cliente: la venta por '
            +'cliente no se guarda por semanas.</p>';
        const mm=periodo==="mes"&&Object.keys(porMesCli).length?(fMes||hoy.getMonth()+1):0;
        if(periodo==="mes"&&!mm)
          return h+'<p class="dmas">Falta el desglose mensual por cliente. '
            +'Se genera con <b>?mesescliente=1</b>.</p>';
        const cs=clientesFB.filter(c=>{
            const ok=c.cuenta!==undefined?c.cuenta:(!c.intercompany&&!c.fusionadoEn);
            if(!ok) return false;
            if(mm&&!porMesCli[arriba(c._id)]) return false;
            return arriba(c.agenteFinal||c.agente)===arriba(a._id);
          })
          .map(c=>{ const f=porMesCli[arriba(c._id)];
            const an={act:num(c.ventasAct), ant:num(c.ventasAntYTD)};
            return (mm&&f) ? {n:c.nombre||c._id, act:num(f[mm]), ant:num(f[12+mm]), _an:an}
                           : {n:c.nombre||c._id, ...an, _an:null}; })
          .map(c=>({...c,dif:c.act-c.ant}))
          .filter(c=>Math.abs(c.dif)>(mm?150:500))
          .sort((x,y)=>x.dif-y.dif);
        h += cs.length
          ? cs.slice(0,10).map(c=>fila(c.n,"",c.act,c.ant,"n3",null,null,c._an)).join("")
            + (cs.length>10?`<p class="dmas">y ${cs.length-10} clientes más</p>`:"")

          : '<p class="dmas">Sin movimientos relevantes</p>';
        return h;
      }).join("");
      return html;
    }).join("");
  })()}
</section>

<section>

  ${objAnual ? `

    </div>

  <table style="margin-top:20px">

    <br><span style="font-size:12px">Ritmo calculado con

    ${conEstacion} estacionalidad${conEstacion===1?"":"es"} de 2025${

  <div class="desv" style="margin-top:24px;padding-top:20px;border-top:1px solid var(--linea)">

<section>

  <p class="pie">${t.objetivoMargen
    ? `El objetivo es ${t.objetivoMargen.toFixed(1)} %.`:"Sin objetivo de margen."}

  ${t.objetivoMargen&&t.margenPctMes!==null
    ? desvHTML(t.margenPctMes-t.objetivoMargen,"bajo objetivo","sobre objetivo"):""}
  <p class="pie" style="margin-top:16px">
    ${t.clientesConVentaMes} de tus ${t.clientes} clientes han comprado este mes.</p>
</section>

<section>
  <p class="rot">Aviso temprano · antes de que se note en el año</p>
  ${(()=>{
    if(!Object.keys(porMesCli).length)
      return `<div class="falta">Hace falta el desglose mensual por cliente.
        Se genera con <b>?mesescliente=1</b>.</div>`;
    const ultimo=hoy.getMonth();            // ultimo mes cerrado (1-12)
    if(ultimo<4) return '<div class="falta">Hacen falta al menos cuatro meses cerrados.</div>';

    const sel=new Set(mios.map(a=>arriba(a._id)));
    const avisos=[];
    for(const c of clientesFB){
      const ok=c.cuenta!==undefined?c.cuenta:(!c.intercompany&&!c.fusionadoEn);
      if(!ok||!sel.has(arriba(c.agenteFinal||c.agente))) continue;
      const f=porMesCli[arriba(c._id)];
      if(!f) continue;

      const act=num(c.ventasAct), ant=num(c.ventasAntYTD);
      if(act<3000) continue;                       // cliente pequeño, no procede
      // Los que ya caen en el año salen en el informe mensual: aqui sobran.
      if(ant&&act < ant*0.92) continue;

      const m=[]; for(let i=1;i<=ultimo;i++) m.push(num(f[i]));
      const recientes=m.slice(-2);                 // dos ultimos cerrados
      const previos=m.slice(0,-2).filter(x=>x>0);
      if(previos.length<2) continue;
      const ritmo=previos.reduce((a,b)=>a+b,0)/previos.length;
      if(ritmo<400) continue;

      const ahora=recientes.reduce((a,b)=>a+b,0)/2;
      const caida=ritmo?(ahora-ritmo)/ritmo*100:0;
      // Meses seguidos sin comprar al final, teniendo costumbre de comprar
      let seco=0; for(let i=m.length-1;i>=0&&m[i]===0;i--) seco++;
      const regular=previos.length/(ultimo-2);

      let motivo=null, grav=0;
      if(seco>=2&&regular>=0.7){
        motivo=`lleva ${seco} meses sin comprar · venía de ${eur(ritmo)} al mes`;
        grav=ritmo*seco;
      }else if(caida<=-45){
        motivo=`viene comprando ${eur(ritmo)} al mes y estos dos últimos `
          +`${eur(ahora)}, un ${Math.round(-caida)} % menos`;
        grav=ritmo*2-ahora*2;
      }
      if(!motivo) continue;

      // Estacionalidad: si el año pasado tambien bajaba en estos mismos meses,
      // no es un cambio de comportamiento sino su temporada. Solo descarta si
      // HAY dato del año anterior: sin venta en 2025 significa que empezo
      // despues, y entonces la caida si es real.
      const mAnt=[]; for(let i=1;i<=ultimo;i++) mAnt.push(num(f[12+i]));
      const recAnt=mAnt.slice(-2).reduce((a,b)=>a+b,0)/2;
      const preAnt=mAnt.slice(0,-2).filter(x=>x>0);
      if(preAnt.length>=2&&recAnt>0){
        const ritmoAnt=preAnt.reduce((a,b)=>a+b,0)/preAnt.length;
        const caidaAnt=ritmoAnt?(recAnt-ritmoAnt)/ritmoAnt*100:0;
        // Si el año pasado cayo parecido en el mismo tramo, es temporada
        if(caidaAnt<=-30&&Math.abs(caidaAnt-caida)<25) continue;
      }

      avisos.push({ nombre:c.nombre||c._id, agente:c.agenteFinal||c.agente,
        act, ant, ritmo, ahora, motivo, grav, seco });
    }
    avisos.sort((a,b)=>b.grav-a.grav);
    if(!avisos.length)
      return '<div class="falta">Ningún cliente da señales de bajada por ahora.</div>';

    return `
      <p class="mflujo m" style="margin-bottom:9px">${avisos.length} clientes ·
        en riesgo unos ${eur(avisos.reduce((s,a)=>s+a.grav,0))}</p>
      <table>${avisos.slice(0,12).map(a=>`<tr>
        <td class="cli">${a.nombre}<small>${a.agente} · ${a.motivo}</small></td>
        <td><span class="imp" style="color:var(--pendiente)">${eur(a.grav)}</span>
          <span class="var">en juego</span></td>
      </tr>`).join("")}</table>
      <div class="falta" style="margin-top:14px">
        Solo clientes que <b>todavía no caen en el año</b> —los que ya caen salen
        en el desglose de arriba— pero cuyos dos últimos meses se han apartado de
        su propio ritmo, o que llevan meses sin comprar teniendo costumbre de
        hacerlo. El importe es lo que está en juego si no se corrige.
      </div>`;
  })()}
</section>

<section>
  <p class="rot">Actividad</p>

<section>

    <div class="mpie">

      <span><b style="color:var(--cae)">${retrasos.length}</b> se retrasaron</span>

  ${topRetrasos.length?`<p class="rot">Se han retrasado · ${eur(suma(retrasos))}</p>
  <table>${topRetrasos.map(r=>`<tr>
    <td class="cli">${r.nombre||"—"}<small>del ${fCorta(r.fechaAntes)} al ${fCorta(r.fechaNueva)}${
      r.lineas>1?` · ${r.lineas} líneas`:""}</small></td>
    <td><span class="imp">${eur(r.importe)}</span>${
      r.dias?`<span class="var" style="color:var(--cae)">+${r.dias} d</span>`:""}</td>
  </tr>`).join("")}</table>`:""}

  <div class="obj">
    <div class="objfila"><span>También se movió</span><span></span></div>
    <table style="margin-top:0">
      <tr><td>Se adelantaron<small>${adelantos.length} líneas</small></td>
          <td><span class="imp" style="color:var(--sube)">${eur(suma(adelantos))}</span></td></tr>
      <tr><td>Entraron nuevos<small>${nuevos.length} líneas</small></td>
          <td><span class="imp" style="color:var(--sube)">${eur(suma(nuevos))}</span></td></tr>
      <tr><td>Anulados o modificados<small>${anulados.length} líneas</small></td>
          <td><span class="imp" style="color:var(--tenue)">${eur(suma(anulados))}</span></td></tr>
    </table>
  </div>` : `<div class="falta">Todavía no hay días de diario guardados en
    <b>pbi_pedidos_cambios</b>. El primero completo será el de mañana.</div>`}
</section>

<section>
  <p class="rot">Clasificación de comerciales</p>
  <p class="mflujo m" style="margin-bottom:4px">
    Por ventas ${P.rot} · en cada actividad:
    <b>enviadas ${rotAct}</b> │
    <b style="color:var(--sube)">ok</b> ·
    <b style="color:var(--cae)">ko</b> ·
    <b style="color:var(--pendiente)">pendientes</b></p>
  <div class="tabla">
    <table class="rank">
      <thead><tr>
        <th class="fijo">Comercial</th>
        <th>Ventas</th><th>vs 25</th>
        <th class="sep">Muestras</th><th>Ofertas</th><th>Estrateg.</th><th>Incid.</th>
      </tr></thead>
      <tbody>${
        mios.map(a=>{
          const ag=arriba(a._id);
          const vAct = periodo==="sem" ? num(a.ventasSem)
                     : periodo==="ano" ? num(a.ventasAct)
                     : (fMes ? num((porEstacion[ag]||{})["act_"+fMes]) : num(a.ventasMes));
          const vAnt = periodo==="sem" ? num(a.ventasSemAnt)
                     : periodo==="ano" ? num(a.ventasAntYTD)
                     : (fMes ? num((porEstacion[ag]||{})["mes_"+fMes]) : num(a.ventasMesAnt));
          const pc=(x,y)=>y?((x/y-1)*100).toFixed(0):null;
          const cel=(v)=>v===null?'<td class="n">·</td>'
            :`<td class="n" style="color:var(--${Number(v)>=0?"sube":"cae"})">${v}%</td>`;
          // Tres cifras en una celda: cerrado bien, perdido y lo que sigue vivo
          // Cuatro cifras: lo enviado en el periodo y como esta la cartera
          const tri=(r)=>!(r.env+r.ok+r.ko+r.pend)?'<td class="n tri">·</td>'
            :`<td class="n tri"><b class="env">${r.env}</b> │ `
             +`<b class="ok">${r.ok}</b>·<b class="ko">${r.ko}</b>·<b class="pd">${r.pend}</b></td>`;
          return `<tr>
            <td class="fijo">${a.agente||a._id}<small>${a.equipo||""}</small></td>
            <td class="n">${eur(vAct)}</td>${cel(pc(vAct,vAnt))}
            ${tri(actDe("muestras",muestras,ag))}
            ${tri(actDe("ofertas",ofertas,ag))}
            ${tri(actDe("estrategias",estrategias,ag))}
            ${tri(actDe("incidencias",incidencias,ag))}
          </tr>`;
        }).join("")}</tbody>
    </table>
  </div>
</section>

<p class="falta" style="margin:26px 20px 0">
  ${FALLOS.length?`<b style="color:var(--cae)">No se han podido leer:</b>
  ${FALLOS.join(" · ")}.<br>`:""}
  <span style="font-size:11px">Páginas leídas: ${
    Object.entries(PAGINAS).map(([k,v])=>k+" "+v).join(" · ")}</span><br>
  Lee Firestore en directo y no escribe nada.
  El «hoy tocaría» sale de <b>pbi_objetivos</b>, que
  suma los meses ya cerrados, no un prorrateo. No se puede retroceder de semana
  porque <b>pbi_resumen_agente</b> solo guarda la semana en curso.
</p>`;
    }
    pintar();
  }catch(e){
    app.innerHTML=`<p class="estado">No se ha podido montar el parte: ${e.message}</p>`;
  }
})();
</script>
