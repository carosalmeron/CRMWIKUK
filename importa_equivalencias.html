$("muestra").innerHTML=claves.slice(0,8).map(k=>
  `<tr><td class="fl">${k}</td><td>${MAPA[k]}</td></tr>`).join("")
  +`<tr><td class="fl">y ${claves.length-8} más…</td><td></td></tr>`;

async function cargar(){
  const b=$("btn"); b.disabled=true;
  $("estado").textContent="Guardando…";
  try{
    const r=await fetch(`${BASE}/pbi_config/equiv_articulos`,{
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:{
        mapa:{stringValue:JSON.stringify(MAPA)},
        total:{integerValue:String(claves.length)},
        actualizado:{stringValue:new Date().toISOString()},
      }}),
    });
    if(!r.ok) throw new Error(`HTTP ${r.status} — ${(await r.text()).slice(0,160)}`);

    // Comprobar que ha quedado guardado
    const v=await fetch(`${BASE}/pbi_config/equiv_articulos`);
    const j=await v.json();
    const guardadas=Object.keys(JSON.parse(j.fields.mapa.stringValue)).length;

    $("estado").innerHTML=`<span class="ok">Guardadas ${guardadas} equivalencias.</span>
      Ya se aplican en el análisis. Si tenías consultas hechas hoy, añade
      <b>&amp;recargar=1</b> una vez para refrescarlas.`;
    $("log").style.display="block";
    $("log").textContent="pbi_config/equiv_articulos\n"
      +"total: "+guardadas+"\n"
      +"actualizado: "+new Date().toLocaleString("es-ES");
  }catch(e){
    $("estado").innerHTML=`<span class="err">No se ha podido guardar: ${e.message}</span>`;
    b.disabled=false;
  }
}
