<div class="top">

<script>
/* ═══════════════════════════════════════════════════════════════
   MIS COBROS — pantalla del comercial
   Lee los cobros publicados por Administración y permite abrir una
   incidencia sobre cualquier factura, dirigida al departamento que
   corresponda.
   Parámetros: ?agente=CODIGO&nombre=...&rol=...&uid=...&equipo=...&vista=vencidos
   ═══════════════════════════════════════════════════════════════ */

const FB_PROJECT = "grupo-consolidado-crm";
const FB_BASE    = `https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents`;
const COL_COBROS = "cobros_comercial";
const COL_META   = "cobros_meta";

const INC_TIPOS = {
  administracion: {label:"📄 Administración", color:"#8B5CF6", resp:"resp_adm"},
  logistica:      {label:"🚚 Logística",      color:"#0EA5E9", resp:"resp_log"},
  calidad:        {label:"⚠️ Calidad",         color:"#F59E0B", resp:"resp_cal"},
  coordinacion:   {label:"🧭 Coordinación",   color:"#0F766E", resp:"resp_coord"},
  it:             {label:"💻 IT",              color:"#7C3AED", resp:"resp_it"},
};
const INC_SUBTIPOS = {
  administracion: ["Error facturación","Impago","Reclamación precio","Documentación",
                   "Cobro ya pagado","Vencimiento incorrecto","Abono pendiente de aplicar"],
  logistica:      ["Retraso entrega","Envío incorrecto","Daño en transporte","Falta documentación","Devolución"],
  calidad:        ["Reclamación cliente","Defecto producto","Etiquetado incorrecto","Caducidad"],
  coordinacion:   ["Reasignación cliente","Coordinación entre departamentos","Consulta interna","Otro"],
  it:             ["Dato incorrecto en el sistema","Error de sincronización","Otro"],
};

// ── Parámetros ──────────────────────────────────────────────────
const Q = new URLSearchParams(location.search);
const P = {
  agente : (Q.get("agente")||"").trim(),
  nombre : (Q.get("nombre")||"").trim(),
  rol    : (Q.get("rol")||"agente").trim().toLowerCase(),
  uid    : (Q.get("uid")||"").trim(),
  equipo : (Q.get("equipo")||"").trim(),
};
// Un jefe de equipo llega con la lista de códigos de sus comerciales, para
// que no vea la cartera de toda la compañía.
const CODIGOS = (Q.get("codigos")||"").split(",").map(x=>x.trim().toUpperCase()).filter(Boolean);
const VE_TODO = ["ceo","director","jefe","admin","tipologia"].includes(P.rol) || P.agente==="__ALL__";

// ── Estado ──────────────────────────────────────────────────────
let ST = {
  vista   : (Q.get("vista")==="vencidos") ? "vencidos" : "todos",
  buscar  : Q.get("cliente")||"",   // (oct 2026) ?cliente= abre directamente ese cliente
  empresa : "",
  comercial: "",
  interco : "no",          // no | si | solo
  compensar: false,        // solo clientes con abonos que cuadran con facturas
  orden   : (Q.get("vista")==="vencidos") ? "antiguedad" : "importe",
  abiertos: {},
  docs    : [],
  meta    : null,
  incid   : {},   // clave factura → nº de incidencias abiertas
  modal   : null,
};

// ── Utilidades ──────────────────────────────────────────────────
const HOY = new Date().toISOString().slice(0,10);
// (sep 2026) El vencido se mide a la FECHA DEL EXCEL de Administración, igual que
// en su análisis: con datos de hace días, lo que venció después puede estar ya
// cobrado. Fuera de plazo = vencimiento anterior a esa fecha. Se fija al cargar.
let CORTE = HOY;
function eur(n){ return new Intl.NumberFormat("es-ES",{maximumFractionDigits:0}).format(Math.round(n||0))+" €"; }
function fecha(s){ return s ? s.split("-").reverse().join("/") : "—"; }
function dias(fv){
  if(!fv) return 0;
  return Math.round((new Date(CORTE) - new Date(fv))/86400000);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function normCom(s){
  return String(s==null?"":s).toUpperCase().trim().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
}
// Se reconoce por el nombre del comercial, no solo por el identificador del
// documento: así el filtro funciona también con cargas antiguas, publicadas
// antes de que el importador separase el bloque de grupo.
const CODIGOS_GRUPO = ["INTERCOMPANY","INTERCNACIONAL","INTERCINTERN","INTERCINTERNACIONAL",
                       "GRUPO","TIENDA","INTERCOMPANIA"];
function esIntercompania(d){
  if(!d) return false;
  if(d.esGrupo===true) return true;
  const c=normCom(d.comercial||""), n=normCom(d.comercialNombre||"");
  return CODIGOS_GRUPO.indexOf(c)>=0 || CODIGOS_GRUPO.indexOf(n)>=0;
}
// Busca abonos que cuadran, importe a importe, con una factura pendiente del
// mismo cliente. Son compensaciones que alguien tiene que aplicar a mano: el
// dinero no se debe, pero sigue contando como vencido y ensuciando la cartera.
// Emparejamiento uno a uno: cada documento se usa una sola vez.
function paresCompensables(facs){
  const pos=facs.filter(f=>f.im>0).slice().sort((a,b)=>b.im-a.im);
  const neg=facs.filter(f=>f.im<0).slice().sort((a,b)=>a.im-b.im);
  const usados=new Set(), pares=[];
  for(const n of neg){
    const objetivo=Math.abs(n.im);
    const i=pos.findIndex((f,idx)=>!usados.has(idx) && Math.abs(f.im-objetivo)<0.01);
    if(i>=0){ usados.add(i); pares.push({abono:n, factura:pos[i], importe:objetivo}); }
  }
  return pares;
}
function claveDoc(f){ return String(f.g||"")+"|"+String(f.t||"")+"|"+String(f.n||"")+"|"+String(f.fv||""); }

function esApunte(f){ return String(f.t||"").toUpperCase()==="AS"; }
function claveFac(cliente, f){ return normCom(cliente)+"|"+String(f.n||"")+"|"+(f.fv||""); }
function semanaISO(){
  const d=new Date(), s=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-s)/86400000+s.getDay()+1)/7);
}
function volver(){
  if(document.referrer && document.referrer.indexOf(location.host)>=0) history.back();
  else location.href="/crm.html";
}

// ── Firestore ───────────────────────────────────────────────────
function parseVal(v){
  if(!v) return null;
  if("stringValue"  in v) return v.stringValue;
  if("doubleValue"  in v) return Number(v.doubleValue);
  if("integerValue" in v) return Number(v.integerValue);
  if("booleanValue" in v) return v.booleanValue;
  if("nullValue"    in v) return null;
  if("arrayValue"   in v) return (v.arrayValue.values||[]).map(parseVal);
  if("mapValue"     in v) return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,parseVal(x)]));
  return null;
}
function fromDoc(d){
  const o={id:(d.name||"").split("/").pop()};
  Object.entries(d.fields||{}).forEach(([k,v])=>{ o[k]=parseVal(v); });
  return o;
}
function serializar(datos){
  const s=(v)=>{
    if(v===null||v===undefined) return {nullValue:null};
    if(typeof v==="boolean")    return {booleanValue:v};
    if(typeof v==="number")     return {doubleValue:v};
    if(typeof v==="string")     return {stringValue:v};
    if(Array.isArray(v))        return {arrayValue:{values:v.map(s)}};
    if(typeof v==="object")     return {mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,s(x)]))}};
    return {stringValue:String(v)};
  };
  return {fields:Object.fromEntries(Object.entries(datos).map(([k,v])=>[k,s(v)]))};
}

async function cargarDocs(){
  if(VE_TODO){
    let out=[], token=null, i=0;
    do{
      const r=await fetch(`${FB_BASE}/${COL_COBROS}?pageSize=300${token?"&pageToken="+token:""}`,{cache:"no-store"});
      if(!r.ok) break;
      const d=await r.json();
      (d.documents||[]).forEach(x=>out.push(fromDoc(x)));
      token=d.nextPageToken||null; i++;
    }while(token && i<20);
    return out;
  }
  const cod = normCom(P.agente);
  if(!cod) return [];
  const r=await fetch(`${FB_BASE}/${COL_COBROS}/${cod}`,{cache:"no-store"});
  if(!r.ok) return [];
  return [fromDoc(await r.json())];
}
async function cargarMeta(){
  try{
    const r=await fetch(`${FB_BASE}/${COL_META}/actual`,{cache:"no-store"});
    return r.ok ? fromDoc(await r.json()) : null;
  }catch(e){ return null; }
}
async function cargarIncidencias(){
  try{
    const r=await fetch(`https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents:runQuery`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({structuredQuery:{
        from:[{collectionId:"incidencias"}],
        where:{fieldFilter:{field:{fieldPath:"origen"},op:"EQUAL",value:{stringValue:"cobros"}}},
        limit:800
      }})
    });
    if(!r.ok) return {};
    const arr=await r.json();
    const map={};
    (arr||[]).forEach(x=>{
      if(!x.document) return;
      const d=fromDoc(x.document);
      if(d.eliminada || d.estado==="resuelta" || d.estado==="cerrada") return;
      if(d.claveFactura) map[d.claveFactura]=(map[d.claveFactura]||0)+1;
    });
    return map;
  }catch(e){ return {}; }
}

// ── Aplanar a lista de clientes ─────────────────────────────────
function clientes(){
  const out=[];
  for(const d of ST.docs){
    if(!d || !d.datos) continue;
    if(CODIGOS.length && CODIGOS.indexOf(String(d.comercial||"").toUpperCase())<0) continue;
    if(ST.comercial && d.comercial!==ST.comercial) continue;
    // Intercompañía y sociedades del grupo: casi la mitad del saldo y no lo
    // cobra ningún vendedor, así que por defecto queda fuera.
    const esG = esIntercompania(d);
    if(ST.interco==="no"   &&  esG) continue;
    if(ST.interco==="solo" && !esG) continue;
    let arr=[];
    try{ arr=JSON.parse(d.datos); }catch(e){ continue; }
    for(const c of arr) out.push(Object.assign({},c,{_com:d.comercialNombre||d.comercial||"",_cod:d.comercial||"",_of:d.fuente==="TODOS"}));
  }
  return out;
}

function preparados(){
  const q = ST.buscar.trim().toUpperCase();
  const lista=[];
  for(const c of clientes()){
    let facs=lineasDe(c);
    if(ST.empresa) facs=facs.filter(f=>f.g===ST.empresa);
    if(ST.vista==="vencidos") facs=facs.filter(f=>f._saldo ? Math.abs(f.ven)>=1 : (f.fv && f.fv<CORTE));
    // (sep 2026) Importes oficiales (pestaña TODOS), por empresa si hay filtro
    const O = oficial(c);
    if(!facs.length && !(O && Math.abs(ST.vista==="vencidos"?O.ven:O.p)>=1)) continue;
    if(q && !String(c.c||"").toUpperCase().includes(q)) continue;
    let p   = facs.reduce((s,f)=>s+(f.im||0),0);
    let v   = facs.filter(f=>f.fv&&f.fv<CORTE).reduce((s,f)=>s+(f.im||0),0);
    if(O){ v=O.ven; p=(ST.vista==="vencidos")?O.ven:O.p; }
    // Modo compensación: solo los clientes donde hay algo que cuadrar.
    let pares=[];
    if(ST.compensar){
      pares=paresCompensables(facs);
      if(!pares.length) continue;
    }
    // Un cliente cuyo saldo neto se queda en cero (o a su favor) no es deuda
    // que reclamar: solo son apuntes que se compensan entre sí. En el modo
    // compensación sí interesan: son justo los que hay que limpiar.
    if(!ST.compensar){
      if(Math.abs(p) < 1) continue;
      if(ST.vista==="vencidos" && p <= 0) continue;
    }
    // La antigüedad se mide sobre facturas de verdad. Los apuntes contables
    // (tipo AS) llevan la fecha del asiento de migración y falseaban el
    // retraso con cifras de 900 y 1.500 días.
    const venc = facs.filter(f=>f.fv&&f.fv<CORTE);
    const reales = venc.filter(f=>!esApunte(f));
    const masAntigua = (reales.length?reales:venc).map(f=>f.fv).sort()[0] || "9999-12-31";
    const marcados=new Set();
    pares.forEach(x=>{ marcados.add(claveDoc(x.abono)); marcados.add(claveDoc(x.factura)); });
    lista.push(Object.assign({},c,{_f:facs,_p:p,_v:v,_ant:masAntigua,
      _apunte:reales.length===0&&venc.length>0,
      _pares:pares, _comp:pares.reduce((s,x)=>s+x.importe,0), _marcados:marcados}));
  }
  if(ST.compensar)              lista.sort((a,b)=> b._comp-a._comp);
  else if(ST.orden==="antiguedad" && soloSaldos()) lista.sort((a,b)=>{ const A=oficial(a)||{}, B=oficial(b)||{};
      return (B.v70||0)-(A.v70||0) || (B.v20||0)-(A.v20||0) || b._v-a._v; });
  else if(ST.orden==="antiguedad") lista.sort((a,b)=> a._ant.localeCompare(b._ant) || b._v-a._v);
  else if(ST.orden==="nombre")  lista.sort((a,b)=> String(a.c).localeCompare(String(b.c),"es"));
  else                          lista.sort((a,b)=> (ST.vista==="vencidos"? b._v-a._v : b._p-a._p));
  return lista;
}

// ── Antigüedad de la cartera ────────────────────────────────────
// Aquí solo van datos medidos sobre las facturas vivas, sin medias que
// puedan disimular la realidad. El "días medios de cobro" se retiró: el
// DÍAS PAGO REAL solo existe en WIKUK (en UC viene "Sin Datos"), así que
// describía media cartera aparentando describirla entera, y el retraso
// medio lo movía un solo deudor de más de un millón.
function difDias(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function metricas(base){
  let sp=0, Wp=0, pend=0;
  const tramos={"En plazo":0,"0-30":0,"31-60":0,"61-90":0,"91-180":0,"181-365":0,"+365":0};
  for(const c of base){
    let facs=(c.f||[]);
    if(ST.empresa) facs=facs.filter(f=>f.g===ST.empresa);
    for(const f of facs){
      if(esApunte(f) || !(f.im>0) || !f.ff || !f.fv) continue;
      sp += difDias(f.ff,f.fv)*f.im; Wp += f.im; pend += f.im;
      if(f.fv<CORTE){
        const d=dias(f.fv);
        tramos[d<=30?"0-30":d<=60?"31-60":d<=90?"61-90":d<=180?"91-180":d<=365?"181-365":"+365"]+=f.im;
      } else tramos["En plazo"]+=f.im;
    }
  }
  const plazo = Wp>0 ? sp/Wp : null;
  const grave = tramos["91-180"]+tramos["181-365"]+tramos["+365"];
  return {plazo, tramos, pend, grave};
}

function panelSaldos(base){
  let p=0,v=0,v20=0,v70=0;
  base.forEach(c=>{ const O=oficial(c); if(!O) return; p+=O.p; v+=O.ven; v20+=O.v20; v70+=O.v70; });
  if(!p&&!v) return "";
  const pc=(x)=>p>0?Math.round(x/p*100)+" %":"—";
  const caja=(l,x,col,sub)=>`<div style="flex:1;min-width:0"><b style="display:block;font-size:17px;font-weight:900;color:${col}">${eur(x)}</b>
      <span style="display:block;font-size:10px;color:#94A3B8;line-height:1.3">${l}${sub?"<br>"+sub:""}</span></div>`;
  return `<div class="dias">
    <p class="dl">⏱ Antigüedad de lo fuera de plazo</p>
    <div style="display:flex;gap:12px;margin-top:8px;text-align:left">
      ${caja("Fuera de plazo",v,"#DC2626",pc(v)+" del pendiente")}
      ${caja("+20 días",v20,"#C2410C",pc(v20))}
      ${caja("Más de 70 días",v70,"#7F1D1D",pc(v70))}
    </div>
    <p class="ds" style="margin-top:8px">Cifras de la pestaña TODOS de Administración.</p>
  </div>`;
}
function panelDias(base){
  if(soloSaldos()) return panelSaldos(base);
  const m = metricas(base);
  if(!m.pend) return "";
  const T=m.tramos, tot=m.pend;
  const COLS={"En plazo":"#CBD5E1","0-30":"#22C55E","31-60":"#84CC16","61-90":"#F59E0B",
              "91-180":"#F97316","181-365":"#EF4444","+365":"#7F1D1D"};
  const keys=Object.keys(T).filter(k=>T[k]>0);
  const pctG = Math.round(m.grave/tot*100);
  return `
  <div class="dias">
    <div class="dias-top">
      <div>
        <p class="dl">⏱ Plazo medio concedido</p>
        <p class="dv">${m.plazo==null?"—":Math.round(m.plazo)+" días"}</p>
        <p class="ds">de emisión a vencimiento, sobre las facturas vivas</p>
      </div>
      <div class="dias-lados">
        <div><b style="color:${pctG>25?"#DC2626":pctG>10?"#F59E0B":"#16A34A"}">${pctG}%</b>
             <span>vencido a más de 90 días</span></div>
      </div>
    </div>
    <div class="aging">${keys.map(k=>
      `<div title="${k} · ${eur(T[k])}" style="width:${(T[k]/tot*100).toFixed(2)}%;background:${COLS[k]}"></div>`).join("")}</div>
    <div class="aging-l">${keys.map(k=>
      `<span><i style="background:${COLS[k]}"></i>${k==="En plazo"?k:k+"d"} · ${eur(T[k])}</span>`).join("")}</div>
  </div>`;
}

function tarjeta(c,ci){
  const k = normCom(c.c);
  const ab = ST.compensar ? (ST.abiertos[k]!==false) : !!ST.abiertos[k];
  const saldo = c._f.length && c._f[0]._saldo;
  const vencidas = c._f.filter(f=>f.fv&&f.fv<CORTE);
  const antig = vencidas.length ? dias(c._ant) : 0;
  return `
  <div class="cli">
    <div class="cli-h" onclick="toggle('${k}')">
      <div class="cli-n">
        <b>${esc(c.c)}</b>
        <span>${saldo ? esc(c.c70||c.cat||"") : `${c._f.length} ${c._f.length===1?"factura":"facturas"}`}
          ${vencidas.length?` · <b style="color:#DC2626">${vencidas.length} vencida${vencidas.length>1?"s":""}</b>`:""}
          ${antig>0?` · ${c._apunte?"apuntes de "+fecha(c._ant):antig+" días de retraso"}`:""}
          ${VE_TODO&&c._com?` · ${esc(c._com)}`:""}
          ${c.r?` · ${esc(c.r)}`:""}</span>
        ${(()=>{ const O=oficial(c); return O&&(Math.abs(O.v20)>=1||Math.abs(O.v70)>=1)
          ? `<div style="font-size:11px;color:#B91C1C;margin-top:2px">+20 días <strong style="font-weight:800">${eur(O.v20)}</strong> · más de 70 días <strong style="font-weight:800">${eur(O.v70)}</strong></div>` : ""; })()}
        ${compDe(c).map(i=>`<div style="font-size:11.5px;margin-top:3px;color:${(RC.ESTADO_COBRO[i.estadoCobro]||[])[1]||"#475569"}">📅 <strong style="font-weight:800">${esc(i.accionCobro)}</strong> · para el ${esc(RC.fechaES(i.fechaCompromiso))} · ${esc((RC.ESTADO_COBRO[i.estadoCobro]||[""])[0])}</div>`).join("")}
        ${(()=>{ const E=porEmpresa(c._f,c); return E.length>1
          ? `<div class="emps">${E.map(e=>`<span class="tag t-emp">${esc(e.g)} ${eur(ST.vista==="vencidos"?e.v:e.p)}</span>`).join("")}</div>`

      </div>

    </div>
    ${ab&&window.RC&&RC.crearCompromiso?`<div style="padding:8px 14px 0"><button class="binc" style="width:100%;padding:9px;font-size:12.5px;font-weight:800" onclick="abrirCompromiso(${ci})">📅 Tu acción con este cliente</button></div>`:""}
    ${ab&&saldo?`<div class="det">${c._f.map((f,fi)=>filaSaldo(c,f,ci,fi)).join("")}</div>`:""}
    ${ab&&!saldo?`<div class="det">${(()=>{ const E=porEmpresa(c._f,c);
        if(E.length<2) return c._f.map((f,fi)=>fila(c,f,ci,fi)).join("");
        return E.map(e=>`<div class="emp-h"><b>🏢 ${esc(e.g)}</b>
            <span>${eur(e.p)} pendiente${e.v?` · <b style="color:#DC2626">${eur(e.v)} vencido</b>`:""}</span></div>`
          +e.idx.map(fi=>fila(c,c._f[fi],ci,fi)).join("")).join(""); })()}</div>`:""}
  </div>`;
}

// (sep 2026) Con la carga de la pestaña TODOS no hay facturas: cada cliente
// trae su saldo por empresa. Se representa como una línea por empresa.
function lineasDe(c){
  if(c&&c._of&&!(c.f||[]).length&&c.emp)
    return Object.entries(c.emp).map(([g,e])=>({_saldo:true,g,t:"Saldo",n:g,fv:"",ff:"",
      im:e.p||0,ven:e.ven||0,v20:e.v20||0,v70:e.v70||0}))
      .filter(f=>Math.abs(f.im)>=0.01||Math.abs(f.ven)>=0.01).sort((a,b)=>a.g.localeCompare(b.g));
  return c.f||[];
}
function soloSaldos(){ return ST.docs.some(d=>d.fuente==="TODOS"); }
// Importes oficiales del cliente (pestaña TODOS del Excel de
// Administración). Con filtro de empresa, los de esa empresa. null si la carga
// es antigua y no los trae: entonces se suman las facturas.
function oficial(c){
  if(!c||!c._of) return null;
  if(ST.empresa){ const e=(c.emp||{})[ST.empresa]; return e?{p:e.p||0,ven:e.ven||0,v20:e.v20||0,v70:e.v70||0}:{p:0,ven:0,v20:0,v70:0}; }
  return {p:c.p||0,ven:c.ven||0,v20:c.v20||0,v70:c.v70||0};
}
// Importe por empresa (WIKUK / UC) de un cliente
function porEmpresa(facs,c){
  const E={};
  facs.forEach((f,fi)=>{ const g=f.g||"Sin empresa"; const e=(E[g]=E[g]||{g,p:0,v:0,idx:[]});
    e.p+=(f.im||0); if(f.fv&&f.fv<CORTE) e.v+=(f.im||0); e.idx.push(fi); });
  if(c&&c._of&&c.emp) Object.entries(c.emp).forEach(([g,o])=>{
    if(ST.empresa&&g!==ST.empresa) return;
    const e=(E[g]=E[g]||{g,p:0,v:0,idx:[]}); e.p=o.p||0; e.v=o.ven||0; });
  return Object.values(E).filter(e=>e.idx.length||Math.abs(e.p)>=1).sort((a,b)=>String(a.g).localeCompare(String(b.g)));
}

async function guardarCompromiso(){
  const M=ST.modal; if(!M||!M.comp) return;
  if(!M.fecha){ alert("Pon el día"); return; }
  M.enviando=true; pintarCompromiso();
  try{
    const doc=await RC.crearCompromiso({cliente:M.c.c,codigo:M.c.cod||"",empresa:M.empresa,importe:Number(M.importe)||0,
      accion:M.accion,fecha:M.fecha,nota:(M.nota||"").trim(),agente:M.c._cod||normCom(P.agente)||P.uid,equipo:P.equipo||""},
      {id:P.uid||normCom(P.agente),nombre:P.nombre||P.agente||"Comercial"});
    ST.comp=(ST.comp||[]).concat([doc]);
    cerrarModal(); render();
    alert("Acción apuntada: Administración lo comprueba el "+RC.fechaES(M.fecha)+".");
  }catch(e){ M.enviando=false; pintarCompromiso(); alert("No se ha guardado: "+e.message); }
}

// ── Modal de incidencia ─────────────────────────────────────────
// (oct 2026) Departamentos y SUBDEPARTAMENTOS, los mismos que en Recuperación y en el comité
// (colección departamentos). Antes eran cinco fijos y no salían los subdepartamentos.
function arbolDeps(){
  const deps=(window.RC&&RC._deptos)||null; if(!deps||!deps.length) return null;
  return deps.filter(d=>!d.nivel).map(r=>{ const hijos=[]; let i=deps.indexOf(r)+1; while(i<deps.length&&deps[i].nivel>0){ hijos.push(deps[i]); i++; } return {r,hijos}; });
}
function depsIncH(M){
  const A=arbolDeps();
  if(!A) return `<div class="chips">${Object.entries(INC_TIPOS).map(([k,t])=>`
         <button class="chip ${M.tipo===k?"on":""}" onclick="ST.modal.tipo='${k}';ST.modal.subtipo='';pintarModal()">${t.label}</button>`).join("")}</div>`;
  const nom=(d)=>(window.RC&&RC.nombreTipoInc?RC.nombreTipoInc(d.tipo):d.nombre);
  const sel=A.find(g=>g.r.tipo===M.tipo||g.hijos.some(h=>h.tipo===M.tipo));
  const b=(d,sub)=>`<button class="chip ${M.tipo===d.tipo?"on":""}" style="${sub?"font-size:12px;":""}" onclick="ST.modal.tipo='${esc(d.tipo)}';ST.modal.subtipo='';pintarModal()">${sub?"↳ "+(d.nivel>1?"· ".repeat(d.nivel-1):""):""}${esc(sub?d.nombre:nom(d))}</button>`;
  return `<div class="chips">${A.map(g=>b(g.r,false)).join("")}</div>
    ${sel&&sel.hijos.length?`<span class="lab" style="margin-top:6px">Subdepartamento de ${esc(sel.r.nombre)} (opcional)</span><div class="chips">${sel.hijos.map(h=>b(h,true)).join("")}</div>`:""}`;
}
function subtiposInc(tipo){
  if(INC_SUBTIPOS[tipo]) return INC_SUBTIPOS[tipo];
  const A=arbolDeps(); const g=A&&A.find(x=>x.hijos.some(h=>h.tipo===tipo));
  return (g&&INC_SUBTIPOS[g.r.tipo])||["Consulta","Error","Reclamación","Otro"];
}
function abrirModal(ci, fi){
  const c = (ST._lista||[])[ci]; if(!c) return;
  const f = (c._f||[])[fi];      if(!f) return;
  ST.modal={cliente:c.c, f, tipo:"administracion", subtipo:"", prioridad:"media", texto:"", enviando:false};
  if(window.RC&&RC.cargarDeptos&&!RC._deptos) RC.cargarDeptos().then(()=>{ if(ST.modal&&!ST.modal.comp) pintarModal(); }).catch(()=>{});
  pintarModal();
}
function cerrarModal(){ ST.modal=null; const m=document.getElementById("mask"); if(m) m.remove(); }

function pintarModal(){
  const M=ST.modal; if(!M) return;
  let el=document.getElementById("mask");
  if(!el){ el=document.createElement("div"); el.id="mask"; el.className="mask";
    el.onclick=e=>{ if(e.target===el) cerrarModal(); }; document.body.appendChild(el); }
  const f=M.f, venc=f.fv&&f.fv<CORTE;
  el.innerHTML = `
   <div class="modal">
     <h3>⚑ Abrir incidencia</h3>
     ${f._saldo?`<p class="msub">${esc(M.cliente)} · saldo ${esc(f.g)}: <b>${eur(f.im)}</b> pendiente · <b style="color:#DC2626">${eur(f.ven)}</b> fuera de plazo</p>`:`
     <p class="msub">${esc(M.cliente)} · ${esc(f.t||"")} ${esc(f.n||"")} ·
        <b>${eur(f.im)}</b> · vence ${fecha(f.fv)}${venc?` · <b style="color:#DC2626">${dias(f.fv)} días</b>`:""}</p>`}

     <span class="lab">¿A qué departamento va?</span>
     ${depsIncH(M)}

     <span class="lab">Motivo</span>
     <select class="full" onchange="ST.modal.subtipo=this.value">
       <option value="">— Seleccionar —</option>
       ${subtiposInc(M.tipo).map(s=>`<option value="${esc(s)}" ${M.subtipo===s?"selected":""}>${esc(s)}</option>`).join("")}
     </select>

     <span class="lab">Prioridad</span>
     <div class="chips">
       ${["baja","media","alta"].map(p=>`
         <button class="chip ${M.prioridad===p?"on":""}" onclick="ST.modal.prioridad='${p}';pintarModal()">${p[0].toUpperCase()+p.slice(1)}</button>`).join("")}
     </div>

     <span class="lab">¿Qué ocurre con este cobro?</span>
     <textarea id="txt" placeholder="Ej.: el cliente dice que esta factura la pagó por transferencia el 12/07 y no consta aplicada."
       oninput="ST.modal.texto=this.value">${esc(M.texto)}</textarea>

     <button class="bprim" id="bok" onclick="enviarIncidencia()" ${M.enviando?"disabled":""}>
       ${M.enviando?"Enviando…":"Enviar al departamento"}</button>
     <button class="bsec" onclick="cerrarModal()">Cancelar</button>
   </div>`;
}

async function enviarIncidencia(){
  const M=ST.modal; if(!M) return;
  if(!M.texto.trim()){ alert("Escribe qué ocurre con el cobro."); return; }
  M.enviando=true; pintarModal();
  const f=M.f, venc=f.fv&&f.fv<CORTE;
  const id="inc"+Date.now();
  const autor = P.uid || normCom(P.agente) || "cobros";
  const desc = f._saldo
    ? `[COBROS] ${M.cliente} · saldo ${f.g}: ${eur(f.im)} pendiente · ${eur(f.ven)} fuera de plazo`+
      ` (+20 días ${eur(f.v20)} · más de 70 días ${eur(f.v70)})\n\n${M.texto.trim()}`
    : `[COBROS] ${M.cliente} · ${f.t||""} ${f.n||""} · ${eur(f.im)} · vence ${fecha(f.fv)}`+
    (venc?` (${dias(f.fv)} días vencida)`:"")+` · ${f.g||""}\n\n${M.texto.trim()}`;

  const inc={
    id, tipo:M.tipo, subtipo:M.subtipo||"", prioridad:M.prioridad,
    clienteNombre:String(M.cliente).toUpperCase(), clienteId:"",
    productoNombre:"", productoCodigo:"", lote:"",
    descripcion:desc, fotos:[],
    autor, agente:autor, equipo:P.equipo||"",
    fecha:new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"}),
    semana:semanaISO(), estado:"abierta",
    historialEscalado:[], escaladoA:null, informadoA:[],
    // Datos propios del cobro
    origen:"cobros", claveFactura:claveFac(M.cliente,f),
    facturaNum:String(f.n||""), facturaTipo:String(f.t||""),
    facturaImporte:Number(f.im||0), facturaVto:String(f.fv||""),
    facturaEmision:String(f.ff||""), facturaEmpresa:String(f.g||""),
    facturaVencida:!!venc, facturaDiasVencida: venc?dias(f.fv):0,
  };

  try{
    const r=await fetch(`${FB_BASE}/incidencias/${id}`,{
      method:"PATCH", headers:{"Content-Type":"application/json"},
      body:JSON.stringify(serializar(inc))
    });
    if(!r.ok) throw new Error("Error "+r.status);

    // Aviso por correo al responsable del departamento. Se usa el mismo
    // endpoint que el CRM: recibe solo el id y resuelve el destinatario en
    // servidor, así que no hay que duplicar aquí la tabla de usuarios.
    // Va sin await a propósito: si el correo falla, la incidencia ya está
    // guardada y el comercial no debe quedarse esperando.
    fetch("/api/notificar-incidencia",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({incidenciaId:id})
    }).then(function(x){
      console.log("[COBROS] Aviso al departamento:", x.ok?"enviado":"falló ("+x.status+")");
    }).catch(function(){ console.log("[COBROS] Aviso al departamento: sin respuesta"); });

    ST.incid[inc.claveFactura]=(ST.incid[inc.claveFactura]||0)+1;
    cerrarModal(); render(); toast("✅ Incidencia enviada a "+INC_TIPOS[M.tipo].label.replace(/^\S+\s/,""));
  }catch(e){
    M.enviando=false; pintarModal();
    alert("No se ha podido enviar la incidencia. Comprueba la conexión y vuelve a intentarlo.");
  }
}

function toast(t){
  const d=document.createElement("div"); d.className="toast"; d.textContent=t;
  document.body.appendChild(d); setTimeout(()=>d.remove(),3200);
}

// ── Exportar ────────────────────────────────────────────────────
function exportar(){
  if(typeof XLSX==="undefined"){ alert("Aún se está cargando el exportador. Espera un segundo."); return; }
  const filas=[];
  for(const c of preparados()){
    if(c._f.length&&c._f[0]._saldo){
      for(const f of c._f) filas.push({ Cliente:c.c, Vendedor:c._com||P.nombre||P.agente, Empresa:f.g,
        "Total pendiente":f.im, "Fuera de plazo":f.ven, "Fuera de plazo +20":f.v20, "Más de 70 días":f.v70,
        Categoría:c.c70||c.cat||"", Región:c.r||"" });
      continue;
    }
    for(const f of c._f){
      const venc=f.fv&&f.fv<CORTE;
      filas.push({
        Cliente:c.c, Vendedor:c._com||P.nombre||P.agente, Empresa:f.g, Sociedad:f.em||"",
        Compensable: (ST.compensar&&c._marcados&&c._marcados.has(claveDoc(f)))
          ? (f.im<0?"ABONO":"FACTURA") : "",
        Documento:(f.t?f.t+" ":"")+(f.n||""),
        "Fecha emisión":fecha(f.ff), "Fecha vencimiento":fecha(f.fv),
        "Importe pendiente":f.im, Estado:venc?"Vencida":"En plazo",
        "Días vencida":venc?dias(f.fv):0, Región:c.r||"",
      });
    }
  }
  const ws=XLSX.utils.json_to_sheet(filas), wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Cobros");
  XLSX.writeFile(wb,`cobros_${ST.compensar?"compensables":ST.vista}_${HOY}.xlsx`);
}

// ── Arranque ────────────────────────────────────────────────────
(async function(){
  try{
    const [docs, meta, incid, comp] = await Promise.all([cargarDocs(), cargarMeta(), cargarIncidencias(),
      (window.RC&&RC.leerCompromisos?RC.leerCompromisos().catch(()=>[]):Promise.resolve([]))]);
    ST.docs=docs.filter(Boolean); ST.meta=meta; ST.incid=incid; ST.comp=comp||[];
    { const fs=[meta&&meta.fechaDatos, ...ST.docs.map(d=>d.fechaDatos)].map(x=>String(x||"").slice(0,10)).filter(x=>/^\d{4}-\d\d-\d\d$/.test(x)).sort();
      if(fs.length) CORTE=fs[fs.length-1]; }
    if(ST.docs.length===0){
      document.getElementById("app").innerHTML = `
        <div class="vacio">
          <p style="font-size:34px;margin:0 0 8px">📭</p>
          <p><b>No hay cobros publicados para ${esc(P.nombre||P.agente||"este usuario")}.</b></p>
          <p style="font-size:12.5px;line-height:1.6">
            O bien no tienes cobros pendientes, o el código de vendedor
            <b>${esc(normCom(P.agente)||"—")}</b> no coincide con el del fichero de Administración.<br>
            Coméntalo con Administración para que revisen la carga.</p>
        </div>`;
      return;
    }
    // Abierto desde el comité con ?cliente=: si queda uno solo, se despliega ya
    if(Q.get("cliente")){ render(); const l=ST._lista||[]; if(l.length===1){ ST.abiertos[normCom(l[0].c)]=true; } }
    render();
  }catch(e){
    console.error(e);
    document.getElementById("app").innerHTML =
      `<div class="vacio">No se han podido cargar los cobros.<br><small>${esc(e.message||e)}</small></div>`;
  }
})();
</script>
