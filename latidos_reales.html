<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latidos reales</title>
<style>
 body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#F2F4F7;margin:0;padding:20px 14px;color:#14181F;
      max-width:680px;margin-inline:auto}
 h1{font-size:20px;margin:0 0 4px}
 p.sub{font-size:13px;color:#6B7684;margin:0 0 16px}
 .card{background:#fff;border:1px solid #DCE1E7;border-radius:6px;padding:13px;
       margin-bottom:9px;font-size:13.5px}
 .ok{border-color:#0E7C5A;background:#EDF7F3}
 .mal{border-color:#C2263D;background:#FEF2F4}
 code{background:#F1F5F9;padding:1px 6px;border-radius:4px;font-size:12px}
 pre{background:#F1F5F9;padding:11px;border-radius:6px;font-size:11.5px;overflow-x:auto}
 h2{font-size:15px;margin:22px 0 8px}
 .meta{color:#6B7684;font-size:12px}
</style></head><body>
<h1>🔬 Latidos reales</h1>
<p class="sub">Qué hay de verdad en pbi_latidos, frente a lo que busca el panel.</p>
<div id="app">Leyendo…</div>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
// Los ids que el panel de salud espera encontrar
const ESPERA=["full","resumen","pedidos","mesescliente","estacionalidad","maestro","cierre"];
// Colecciones que alimenta cada proceso, para ver si el dato llega aunque
// no se escriba el latido
const FUENTE={full:"pbi_ventas_cliente", resumen:"pbi_resumen_agente",
  pedidos:"pbi_pedidos", mesescliente:"pbi_meses_cliente",
  estacionalidad:"pbi_estacionalidad", maestro:"clientes", cierre:"informes"};

function val(f){
  if(!f) return null;
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.booleanValue!==undefined) return f.booleanValue;
  return null;
}
(async()=>{
  const app=document.getElementById("app");
  try{
    const r=await fetch(FB+"/pbi_latidos?pageSize=100");
    const j=r.ok?await r.json():{documents:[]};
    const docs=(j.documents||[]).map(d=>{
      const o={_id:d.name.split("/").pop()};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      return o;
    });

    let h='<h2>1 · Documentos que existen en pbi_latidos ('+docs.length+')</h2>';
    h+= docs.length
      ? '<pre>'+docs.map(d=>JSON.stringify(d)).join("\n")+'</pre>'
      : '<div class="card mal">La colección está vacía: ningún proceso escribe latido.</div>';

    h+='<h2>2 · Lo que busca el panel</h2>';
    const ids=docs.map(d=>d._id);
    h+=ESPERA.map(k=>{
      const hay=ids.includes(k);
      return '<div class="card '+(hay?"ok":"mal")+'">'
        +'<b>'+k+'</b> '+(hay?"✅ existe":"❌ no existe")
        +'</div>';
    }).join("");

    const sobran=ids.filter(x=>!ESPERA.includes(x));
    if(sobran.length){
      h+='<h2>3 · Latidos con nombre distinto al esperado</h2>'
        +'<div class="card">Existen pero el panel no los busca: '
        +sobran.map(x=>'<code>'+x+'</code>').join(" ")
        +'<p class="meta">Si alguno corresponde a un proceso de la lista, '
        +'basta con renombrar la clave en el panel.</p></div>';
    }

    // ¿Llega el dato aunque no haya latido?
    h+='<h2>'+(sobran.length?4:3)+' · ¿Llegan los datos igualmente?</h2>';
    for(const k of ESPERA){
      const col=FUENTE[k];
      let info="no comprobable";
      try{
        const rr=await fetch(FB+"/"+col+"?pageSize=1");
        if(rr.ok){
          const jj=await rr.json();
          const d=(jj.documents||[])[0];
          if(d){
            const o={};
            for(const [kk,x] of Object.entries(d.fields||{})) o[kk]=val(x);
            const cuando=o.actualizado||o.fechaCreacion||o.fecha||"";
            info=cuando?("último dato: "+cuando):"tiene documentos";
          } else info="colección vacía";
        } else info="no accesible";
      }catch(e){ info="error"; }
      h+='<div class="card"><b>'+k+'</b> → <code>'+col+'</code>'
        +'<p class="meta">'+info+'</p></div>';
    }

    app.innerHTML=h;
  }catch(e){ app.innerHTML='<div class="card mal">Error: '+e.message+'</div>'; }
})();
</script></body></html>
