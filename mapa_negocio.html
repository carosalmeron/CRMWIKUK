<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de negocio</title>
<style>
 :root{--navy:#0F172A;--muted:#64748B;--border:#E2E8F0;--red:#DC2626;--green:#16A34A;--blue:#2563EB;
       --est:#B91C1C;--gan:#B45309;--fue:#64748B;--sin:#94A3B8;--ok:#0F766E}
 *{box-sizing:border-box}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F8FAFC;color:var(--navy)}
 header{background:#fff;border-bottom:1px solid var(--border);padding:14px 16px}
 header .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
 header h1{margin:0;font-size:19px;font-weight:800}
 header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
 main{padding:14px 16px 120px;max-width:900px;margin:0 auto}
 .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:12px}
 .card h2{margin:0 0 2px;font-size:15px;font-weight:800}
 .muted{color:var(--muted);font-size:12px}
 .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
 .btn{border:none;border-radius:9px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
 .gris{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
 .ok{background:var(--green);color:#fff}
 .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
 .tabs button{border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
 .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
 .cajas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
 .caja{border:1px solid var(--border);border-top:3px solid var(--c);border-radius:11px;padding:9px 11px;cursor:pointer;background:#fff}
 .caja:hover{background:#F8FAFC}
 .caja .t{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
 .caja .v{font-size:19px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
 .caja .s{font-size:11.5px;color:var(--muted);margin-top:1px}
 .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#F1F5F9;margin:8px 0 2px}
 .bar i{display:block;height:10px}
 .chip{border:1.5px solid var(--c,#CBD5E1);background:#fff;color:var(--c,#334155);border-radius:99px;padding:6px 11px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}
 .chip.on{background:var(--c,#334155);color:#fff}
 .fil{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
 input,select,textarea{font:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:9px;padding:8px 10px;background:#fff}
 .item{display:flex;gap:9px;align-items:flex-start;border-top:1px solid #F1F5F9;padding:9px 2px}
 .item:first-child{border-top:none}
 .item.sel{background:#EFF6FF;border-radius:9px}
 .item input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:#2563EB}
 .num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
 .tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff)}
 .barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #2563EB;box-shadow:0 -6px 18px rgba(15,23,42,.1);padding:10px 16px;z-index:5}
 .barra .in{max-width:900px;margin:0 auto}
 table.x{width:100%;border-collapse:collapse;font-size:13px}
 table.x th{font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px;font-weight:800}
 table.x th:first-child,table.x td:first-child{text-align:left}
 table.x td{padding:8px 6px;border-top:1px solid #F1F5F9;text-align:right;font-variant-numeric:tabular-nums}
 .estado{padding:40px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="in">
  <button class="btn gris" id="volver" onclick="volver()">←</button>
  <div style="flex:1;min-width:0"><h1>🧭 Mapa de negocio</h1><p id="hs">Leyendo…</p></div>
  <button class="btn gris" onclick="recargarArts()" title="Volver a calcular las ventas por artículo">🔄</button>
</div></header>
<main id="app"><p class="estado">Leyendo clientes y ventas…</p></main>
<div class="barra" id="barra" style="display:none"></div>

<script src="/recuperacion_comun.js?v=20261005h"></script>
<script src="/mapa_comun.js?v=20261005a"></script>
<script>
const P=new URLSearchParams(location.search);
const ARR=RC.ARR, num=RC.num, eur=RC.eur, esc=RC.esc||((s)=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])));
const AGENTE=ARR(P.get("agente")||""), ROL=(P.get("rol")||"").toLowerCase(), EQUIPO=ARR(P.get("equipo")||"");
const NOMBRE=P.get("nombre")||AGENTE||ROL.toUpperCase();
const ES_CEO=ROL==="ceo"||ROL==="admin", ES_DIR=ES_CEO||ROL==="director"||ROL==="crm_director", ES_JEFE=ES_DIR||ROL==="jefe"||ROL==="crm_jefe";
// Clientes: los clasifica el jefe. Artículos: valen para toda la empresa, los clasifica el jefe comercial o el CEO.
const PUEDE_CLI=ES_JEFE, PUEDE_ART=ES_DIR;
const QUIEN=ES_CEO?"CEO":ES_DIR?"Jefe comercial ("+NOMBRE+")":"Jefe ("+NOMBRE+")";
const SEM=RC.semanaISO(new Date());
const pct=(a,b)=>b?Math.round(a/b*100):0;
const varTxt=(act,ant)=>ant?((act>=ant?"+":"")+Math.round((act-ant)/Math.abs(ant)*100)+" %"):"nuevo";
const fch=(s)=>s?String(s).slice(0,10).split("-").reverse().join("/"):"";

const CC={est:["🎯","Estratégico","var(--est)","Estratégicos"],no:["🚫","No estratégico","var(--fue)","No estratégicos"],sin:["⏳","Sin clasificar","var(--sin)","Sin clasificar"]};
const CA={estrategica:["🎯","Venta estratégica","var(--est)"],gancho:["🪝","Gancho","var(--gan)"],fuera:["🚫","Fuera de estrategia","var(--fue)"],sin:["⏳","Sin clasificar","var(--sin)"]};

let CLI=[], AG={}, CASO={}, CASOS=[], SUG={}, ARTS=null, ARTS_ERR="", ARTS_INFO={};
let TAB=P.get("tab")||"resumen", GF={eq:"",ag:""};
const FC={clase:"",q:"",orden:"act",n:150}, FA={clase:"",q:"",fam:"",orden:"act",n:150};
let SELC=new Set(), SELA=new Set(), FORM_NO=false, APLICAR=null;

function volver(){ if(history.length>1) history.back(); else location.href="/recuperacion.html"+location.search; }
function enAmbito(c){
  if(RC.esFrancia(c.eq)) return false;
  if(ES_DIR) return true;
  if(ES_JEFE) return !EQUIPO||ARR(c.eq)===EQUIPO||ARR(c.eq).includes(EQUIPO)||(c.eq&&EQUIPO.includes(ARR(c.eq)));
  return c.ag===AGENTE;
}
const nomAg=(a)=>(AG[a]||{}).agente||a||"(sin comercial)";

// ── Carga ──────────────────────────────────────────────────────────────
async function cargar(){
  const [cli,res,casos]=await Promise.all([RC.leer("pbi_ventas_cliente"),RC.leer("pbi_resumen_agente"),RC.leerCasos().catch(()=>[]),MAPA.clis(true),MAPA.arts(true)]);
  AG={}; res.forEach(a=>AG[ARR(a._id)]=a);
  CASOS=casos; CASO={}; casos.forEach(c=>{ if(c.cliente) CASO[ARR(c.cliente)]=c; });
  CLI=cli.filter(d=>!d.intercompany&&!d.fusionadoEn&&!d.obsoleto).map(d=>{
    const ag=ARR(d.agenteFinal||d.agente), cod=ARR(d._id);
    return {cod,nombre:d.nombre||cod,pob:d.poblacion||"",ag,eq:(AG[ag]||{}).equipo||"",act:Math.round(num(d.ventasAct)),ant:Math.round(num(d.ventasAntYTD)),
      mg:num(d.margenAct),base:num(d.baseAct)||num(d.ventasAct)};
  }).filter(c=>(c.act||c.ant)&&enAmbito(c));
  // Lo que ya se ha marcado a mano en recuperación, cliente a cliente: pista para clasificar el artículo
  SUG={};
  casos.forEach(c=>RC.spotDe(c).forEach(x=>{ if(x.global) return; const k=ARR(x.art); if(!k) return;
    const s=SUG[k]=SUG[k]||{gancho:0,fuera:0,cli:new Set()}; if(!s.cli.has(c.cliente)){ s.cli.add(c.cliente); s[RC.tipoClasif(x)]++; } }));
}
async function cargarArts(forzar){
  ARTS=null; ARTS_ERR=""; pintar();
  try{
    const r=await fetch("/api/pbi-sync?mapaNegocio=1"+(forzar?"&recargar=1":""));
    const j=await r.json(); if(j.ok===false) throw new Error(j.error||"sin respuesta");
    ARTS=(j.filas||[]).map(f=>({cod:ARR(f[0]),desc:f[1]||f[0],cal:f[2]||"",met:f[3]||"",calidad:f[4]||"",act:num(f[5]),ant:num(f[6]),cli:num(f[7]),ne:num(f[8])}));
    ARTS_INFO={periodo:j.periodo,basadoEn:j.basadoEn,noEst:j.noEstrategicos,deCache:j.deCache};
  }catch(e){ ARTS_ERR=e.message||String(e); }
  pintar();
}
window.recargarArts=()=>cargarArts(true);

// ── Clases ─────────────────────────────────────────────────────────────
function claseCli(c){
  const t=MAPA.tipoCli(c.cod);
  if(t==="no_estrategico") return "no";
  if(t==="estrategico") return "est";
  const k=CASO[c.cod]; if(k&&k.estado==="fuera_estrategia") return "no";
  return "sin";
}
const claseArt=(cod)=>MAPA.tipoArt(cod)||"sin";

// ── Pintar ─────────────────────────────────────────────────────────────
function cli2(){ return CLI.filter(c=>!GF.ag?(!GF.eq||ARR(c.eq||"SIN EQUIPO")===GF.eq):c.ag===GF.ag); }
function pintar(){
  const L=cli2(), tot=L.reduce((t,c)=>t+c.act,0), totAnt=L.reduce((t,c)=>t+c.ant,0);
  document.getElementById("hs").textContent=`Ventas de este año (1 de enero a hoy) frente al mismo periodo del año pasado · ${L.length} clientes${GF.eq||GF.ag?" · "+(GF.ag?nomAg(GF.ag):GF.eq):""}`;
  const tabs=[["resumen","📊 Resumen"],["clientes","👥 Clientes"],["articulos","📦 Artículos"]];
  const v=TAB==="clientes"?vistaClientes():TAB==="articulos"?vistaArticulos():vistaResumen(L,tot,totAnt);
  document.getElementById("app").innerHTML=`
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <div class="tabs" style="margin:0;flex:1">${tabs.map(([k,t])=>`<button class="${TAB===k?"on":""}" onclick="irTab('${k}')">${t}</button>`).join("")}</div>
      ${TAB!=="articulos"?filtroArbol():""}</div>
    ${v}`;
  pintarBarra();
}
window.irTab=(k,clase)=>{ TAB=k; if(k==="clientes"&&clase!==undefined) FC.clase=clase; if(k==="articulos"&&clase!==undefined) FA.clase=clase; FORM_NO=false; pintar(); window.scrollTo(0,0); };
function filtroArbol(){
  if(!ES_JEFE) return "";
  const g={}; CLI.forEach(c=>{ const e=ARR(c.eq)||"SIN EQUIPO"; (g[e]=g[e]||{})[c.ag]=(g[e][c.ag]||0)+1; });
  const eqs=Object.keys(g).sort(); if(new Set(CLI.map(c=>c.ag)).size<2) return "";
  const v=GF.ag?"ag:"+GF.ag:GF.eq?"eq:"+GF.eq:"", sp="    ";
  const opt=(val,txt)=>`<option value="${esc(val)}"${v===val?" selected":""}>${esc(txt)}</option>`;
  return `<select onchange="setGF(this.value)" style="max-width:100%;font-weight:700;border-color:${v?"#0F172A":"#CBD5E1"}">
    ${opt("",eqs.length>1?"Todos los equipos":"Todo el equipo")}
    ${eqs.map(e=>(eqs.length>1?opt("eq:"+e,"▾ "+e):"")+Object.keys(g[e]).sort((a,b)=>nomAg(a).localeCompare(nomAg(b))).map(a=>opt("ag:"+a,(eqs.length>1?sp:"")+"└ "+nomAg(a)+" · "+g[e][a])).join("")).join("")}</select>`;
}
window.setGF=(v)=>{ GF={eq:v.startsWith("eq:")?v.slice(3):"",ag:v.startsWith("ag:")?v.slice(3):""}; SELC=new Set(); pintar(); };

function caja(col,ic,tx,v,sub,onc){ return `<div class="caja" style="--c:${col}" onclick="${onc}"><div class="t">${ic} ${tx}</div><div class="v">${eur(v)}</div><div class="s">${sub}</div></div>`; }
function vistaResumen(L,tot,totAnt){
  // Por cliente
  const g={est:{v:0,a:0,n:0,mg:0,b:0},no:{v:0,a:0,n:0,mg:0,b:0},sin:{v:0,a:0,n:0,mg:0,b:0}};
  L.forEach(c=>{ const x=g[claseCli(c)]; x.v+=c.act; x.a+=c.ant; x.n++; x.mg+=c.mg; x.b+=c.base; });
  const mgTxt=(x)=>x.b?` · margen ${Math.round(x.mg/x.b*100)} %`:"";
  const barC=["est","no","sin"].map(k=>`<i style="width:${pct(Math.max(0,g[k].v),Math.max(1,tot))}%;background:${CC[k][2]}"></i>`).join("");
  let h=`<div class="card">
    <div class="row"><h2>Tus ventas este año</h2><b style="font-size:20px">${eur(tot)}</b></div>
    <div class="muted">Año pasado, mismo periodo: ${eur(totAnt)} (${varTxt(tot,totAnt)})</div></div>
  <div class="card"><h2>👥 Por tipo de cliente</h2><div class="muted">Lo decide el jefe en la pestaña Clientes. Sin clasificar se trabaja como estratégico hasta que se decida.</div>
    <div class="bar">${barC}</div>
    <div class="cajas">${["est","no","sin"].map(k=>caja(CC[k][2],CC[k][0],CC[k][3],g[k].v,g[k].n?`${pct(g[k].v,tot)} % · ${g[k].n} cliente${g[k].n===1?"":"s"} · ${varTxt(g[k].v,g[k].a)}${mgTxt(g[k])}`:"ninguno todavía",`irTab('clientes','${k}')`)).join("")}</div></div>`;
  // Por artículo y cruce (toda la empresa)
  if(!ARTS){
    h+=`<div class="card"><h2>📦 Por tipo de artículo</h2>${ARTS_ERR?`<p class="muted">No se han podido calcular las ventas por artículo (${esc(ARTS_ERR)}). <a href="#" onclick="cargarArts(true);return false">Reintentar</a></p>`
      :`<p class="muted">Calculando ventas por artículo en Power BI… la primera vez del día puede tardar un minuto.</p>`}</div>`;
    return h+progreso(L);
  }
  const a={estrategica:{v:0,a:0,n:0,ne:0},gancho:{v:0,a:0,n:0,ne:0},fuera:{v:0,a:0,n:0,ne:0},sin:{v:0,a:0,n:0,ne:0}};
  ARTS.forEach(r=>{ const x=a[claseArt(r.cod)]; x.v+=r.act; x.a+=r.ant; x.ne+=r.ne; if(r.act>0) x.n++; });
  const totA=Object.values(a).reduce((t,x)=>t+x.v,0);
  const barA=["estrategica","gancho","fuera","sin"].map(k=>`<i style="width:${pct(Math.max(0,a[k].v),Math.max(1,totA))}%;background:${CA[k][2]}"></i>`).join("");
  h+=`<div class="card"><h2>📦 Por tipo de artículo <span class="muted" style="font-weight:600">· toda la empresa</span></h2>
    <div class="muted">Un artículo gancho o fuera de estrategia lo es para todos los clientes (salvo excepción en la ficha del cliente).</div>
    <div class="bar">${barA}</div>
    <div class="cajas">${["estrategica","gancho","fuera","sin"].map(k=>caja(CA[k][2],CA[k][0],CA[k][1],a[k].v,a[k].n?`${pct(a[k].v,totA)} % · ${a[k].n} artículo${a[k].n===1?"":"s"} · ${varTxt(a[k].v,a[k].a)}`:"ninguno todavía",`irTab('articulos','${k}')`)).join("")}</div></div>`;
  // Cruce: qué es negocio estratégico de verdad
  const fila=(k,txt)=>{ const x=k==="estrategica"?{v:a.estrategica.v+a.sin.v,ne:a.estrategica.ne+a.sin.ne}:a[k];
    return `<tr><td>${txt}</td><td${k==="estrategica"?' style="background:#FEF2F2;font-weight:800;color:var(--est)"':""}>${eur(x.v-x.ne)}</td><td>${eur(x.ne)}</td><td><b>${eur(x.v)}</b></td></tr>`; };
  const nucleo=(a.estrategica.v+a.sin.v)-(a.estrategica.ne+a.sin.ne), resto=totA-nucleo;
  h+=`<div class="card"><h2>🧭 ¿Cuál es mi negocio estratégico?</h2>
    <div class="muted">Toda la empresa, sin intercompañía. Clientes no estratégicos: ${num(ARTS_INFO.noEst)} (los marcados aquí y los que recuperación ha dejado fuera de estrategia).</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
      <div style="flex:1;min-width:180px;background:#FEF2F2;border-radius:12px;padding:10px 12px"><div class="muted" style="font-weight:800;color:var(--est)">🎯 NEGOCIO ESTRATÉGICO</div>
        <div style="font-size:22px;font-weight:800;color:var(--est)">${eur(nucleo)}</div><div class="muted">${pct(nucleo,totA)} % · artículos estratégicos a clientes estratégicos${a.sin.v?` <br>(incluye ${eur(a.sin.v-a.sin.ne)} de artículos aún sin clasificar)`:""}</div></div>
      <div style="flex:1;min-width:180px;background:#F1F5F9;border-radius:12px;padding:10px 12px"><div class="muted" style="font-weight:800">NO ESTRATÉGICO</div>
        <div style="font-size:22px;font-weight:800;color:#334155">${eur(resto)}</div><div class="muted">${pct(resto,totA)} % · 🪝 gancho ${eur(a.gancho.v)} · 🚫 artículos fuera ${eur(a.fuera.v)} · 🚫 clientes no estratégicos ${eur(a.estrategica.ne+a.sin.ne)}</div></div></div>
    <div style="overflow-x:auto"><table class="x"><tr><th>Artículo \\ cliente</th><th>🎯 Estratégicos</th><th>🚫 No estratégicos</th><th>Total</th></tr>
      ${fila("estrategica","🎯 Venta estratégica"+(a.sin.v?' <span class="muted">(+ sin clasificar)</span>':""))}${fila("gancho","🪝 Gancho")}${fila("fuera","🚫 Fuera de estrategia")}
      <tr><td><b>Total</b></td><td><b>${eur(totA-Object.values(a).reduce((t,x)=>t+x.ne,0))}</b></td><td><b>${eur(Object.values(a).reduce((t,x)=>t+x.ne,0))}</b></td><td><b>${eur(totA)}</b></td></tr></table></div>
    <div class="muted" style="margin-top:6px">Datos de Power BI${ARTS_INFO.periodo?` del ${fch(ARTS_INFO.periodo.desde)} al ${fch(ARTS_INFO.periodo.hasta)}`:""}. Al clasificar clientes, pulsa 🔄 arriba para recalcular el cruce.</div></div>`;
  return h+progreso(L);
}
function progreso(L){
  const tot=L.reduce((t,c)=>t+Math.max(0,c.act),0), cl=L.filter(c=>claseCli(c)!=="sin"), vcl=cl.reduce((t,c)=>t+Math.max(0,c.act),0);
  let h=`<div class="card"><h2>✅ Cuánto llevas clasificado</h2>
    <div style="margin-top:6px">👥 Clientes: <b>${cl.length}</b> de ${L.length} · <b>${pct(vcl,tot)} %</b> de las ventas</div>`;
  if(ARTS){ const ta=ARTS.reduce((t,r)=>t+Math.max(0,r.act),0), ac=ARTS.filter(r=>claseArt(r.cod)!=="sin"), vac=ac.reduce((t,r)=>t+Math.max(0,r.act),0);
    h+=`<div>📦 Artículos: <b>${ac.length}</b> de ${ARTS.filter(r=>r.act>0).length} con venta · <b>${pct(vac,ta)} %</b> de las ventas</div>`;
    const ns=Object.keys(SUG).filter(k=>claseArt(k)==="sin").length;
    if(ns) h+=`<div style="margin-top:6px"><a href="#" onclick="irTab('articulos','sug');return false">💡 ${ns} artículos marcados como gancho o fuera en algún cliente de recuperación, pendientes de decidir para toda la empresa</a></div>`; }
  return h+`<div class="muted" style="margin-top:6px">Consejo: empieza por los clientes y artículos que más venden; con los 50 primeros suele quedar clasificado más del 70 % del negocio.</div></div>`;
}

// ── Clientes ───────────────────────────────────────────────────────────
function listaClientes(){
  const q=FC.q.trim().toUpperCase();
  let L=cli2().filter(c=>!FC.clase||claseCli(c)===FC.clase).filter(c=>!q||(c.nombre+" "+c.cod+" "+c.pob+" "+nomAg(c.ag)).toUpperCase().includes(q));
  L.sort(FC.orden==="caida"?(a,b)=>(a.act-a.ant)-(b.act-b.ant):FC.orden==="nombre"?(a,b)=>a.nombre.localeCompare(b.nombre):(a,b)=>b.act-a.act);
  return L;
}
function vistaClientes(){
  const B=cli2(), n=(k)=>B.filter(c=>claseCli(c)===k).length;
  const ch=(k,txt,col)=>`<button class="chip${FC.clase===k?" on":""}" style="--c:${col}" onclick="FC.clase='${k}';FC.n=150;SELC=new Set();pintar()">${txt}</button>`;
  return `<div class="card">
    <div class="fil">${ch("","Todos · "+B.length,"#334155")}${ch("sin","⏳ Sin clasificar · "+n("sin"),"#64748B")}${ch("est","🎯 Estratégicos · "+n("est"),"#B91C1C")}${ch("no","🚫 No estratégicos · "+n("no"),"#475569")}</div>
    <div class="fil"><input id="qc" placeholder="Buscar cliente, código, población o comercial" value="${esc(FC.q)}" oninput="FC.q=this.value;FC.n=150;pintarLista()" style="flex:1;min-width:200px">
      <select onchange="FC.orden=this.value;pintarLista()"><option value="act"${FC.orden==="act"?" selected":""}>Más venta</option><option value="caida"${FC.orden==="caida"?" selected":""}>Más caída</option><option value="nombre"${FC.orden==="nombre"?" selected":""}>Nombre</option></select>
      <button class="btn gris" onclick="csvClientes()">⬇️ Listado</button></div>
    ${PUEDE_CLI?`<div class="muted" style="margin-bottom:4px">Marca uno o varios clientes y elige abajo si son estratégicos o no.</div>`:`<div class="muted" style="margin-bottom:4px">Solo el jefe puede clasificar clientes.</div>`}
    <div id="lista">${htmlListaC()}</div></div>`;
}
function htmlListaC(){
  const L=listaClientes(), tot=L.reduce((t,c)=>t+c.act,0);
  if(!L.length) return `<p class="muted">Ningún cliente con este filtro.</p>`;
  return `<div class="row" style="padding:2px 2px 6px"><span class="muted">${L.length} clientes · ${eur(tot)} este año</span>
      ${PUEDE_CLI?`<a href="#" style="font-size:12.5px;font-weight:700" onclick="selTodosC();return false">${L.slice(0,FC.n).every(c=>SELC.has(c.cod))?"Quitar marcas":"Marcar los visibles"}</a>`:""}</div>`
    +L.slice(0,FC.n).map(c=>{ const k=claseCli(c), d=docCliente(c.cod), caso=CASO[c.cod], s=SELC.has(c.cod);
      const orig=d&&d.tipo?`${d.motivo?esc(d.motivo)+" · ":""}${esc(d.por||"")}${d.fecha?" · "+fch(d.fecha):""}`
        :(k==="no"&&caso)?`desde recuperación${caso.fueraMotivo?" · "+esc(caso.fueraMotivo):""}`:"";
      return `<div class="item${s?" sel":""}">${PUEDE_CLI?`<input type="checkbox" ${s?"checked":""} onclick="selC('${esc(c.cod)}')">`:""}
        <div style="flex:1;min-width:0"><b style="font-size:13.5px">${esc(c.nombre)}</b>
          <div class="muted">${esc(c.cod)} · ${esc(nomAg(c.ag))}${c.pob?" · "+esc(c.pob):""}</div>
          <div style="margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span class="tag" style="--c:${CC[k][2]}">${CC[k][0]} ${CC[k][1]}</span>
            ${orig?`<span class="muted" style="font-size:11.5px">${orig}</span>`:""}
            ${caso&&RC.abierto(caso)?`<span class="tag" style="--c:#DC2626">🚨 en recuperación</span>`:""}</div></div>
        <div class="num"><b>${eur(c.act)}</b><div class="muted" style="color:${c.act<c.ant?"var(--red)":"var(--green)"}">${varTxt(c.act,c.ant)}</div>
          ${c.base?`<div class="muted">margen ${Math.round(c.mg/c.base*100)} %</div>`:""}</div></div>`; }).join("")
    +(L.length>FC.n?`<button class="btn gris" style="width:100%;margin-top:8px" onclick="FC.n+=150;pintarLista()">Ver ${Math.min(150,L.length-FC.n)} más</button>`:"");
}
function docCliente(cod){ return _CCD[ARR(cod)]||null; }
function pintarLista(){ const el=document.getElementById("lista"); if(!el) return; el.innerHTML=TAB==="clientes"?htmlListaC():htmlListaA(); pintarBarra(); }
window.selC=(k)=>{ SELC.has(k)?SELC.delete(k):SELC.add(k); pintarLista(); };
window.selTodosC=()=>{ const L=listaClientes().slice(0,FC.n); const todos=L.every(c=>SELC.has(c.cod)); L.forEach(c=>todos?SELC.delete(c.cod):SELC.add(c.cod)); pintarLista(); };

// ── Artículos ──────────────────────────────────────────────────────────
const famDe=(r)=>String(r.desc||r.cod||"").trim().split(/\s+/)[0]||"Otros";
function listaArts(){
  if(!ARTS) return [];
  const q=FA.q.trim().toUpperCase();
  let L=ARTS.filter(r=>FA.clase==="sug"?(SUG[r.cod]&&claseArt(r.cod)==="sin"):(!FA.clase||claseArt(r.cod)===FA.clase))
    .filter(r=>!FA.fam||famDe(r)===FA.fam).filter(r=>!q||(r.desc+" "+r.cod+" "+r.cal).toUpperCase().includes(q));
  L.sort(FA.orden==="ne"?(a,b)=>b.ne-a.ne:FA.orden==="caida"?(a,b)=>(a.act-a.ant)-(b.act-b.ant):(a,b)=>b.act-a.act);
  return L;
}
function vistaArticulos(){
  if(!ARTS) return `<div class="card">${ARTS_ERR?`<p class="muted">No se han podido calcular (${esc(ARTS_ERR)}). <a href="#" onclick="cargarArts(true);return false">Reintentar</a></p>`:`<p class="muted">Calculando ventas por artículo en Power BI… la primera vez del día puede tardar un minuto.</p>`}</div>`;
  const n=(k)=>ARTS.filter(r=>claseArt(r.cod)===k).length, ns=ARTS.filter(r=>SUG[r.cod]&&claseArt(r.cod)==="sin").length;
  const ch=(k,txt,col)=>`<button class="chip${FA.clase===k?" on":""}" style="--c:${col}" onclick="FA.clase='${k}';FA.n=150;SELA=new Set();pintar()">${txt}</button>`;
  const fams=[...new Set(ARTS.map(famDe))].sort();
  return `<div class="card">
    <div class="fil">${ch("","Todos · "+ARTS.length,"#334155")}${ch("sin","⏳ Sin clasificar · "+n("sin"),"#64748B")}${ch("estrategica","🎯 Estratégica · "+n("estrategica"),"#B91C1C")}${ch("gancho","🪝 Gancho · "+n("gancho"),"#B45309")}${ch("fuera","🚫 Fuera · "+n("fuera"),"#475569")}${ns?ch("sug","💡 Marcados en recuperación · "+ns,"#0369A1"):""}</div>
    <div class="fil"><input placeholder="Buscar artículo, código o calibre" value="${esc(FA.q)}" oninput="FA.q=this.value;FA.n=150;pintarLista()" style="flex:1;min-width:200px">
      <select onchange="FA.fam=this.value;FA.n=150;pintarLista()"><option value="">Todas las familias</option>${fams.map(f=>`<option${FA.fam===f?" selected":""}>${esc(f)}</option>`).join("")}</select>
      <select onchange="FA.orden=this.value;pintarLista()"><option value="act"${FA.orden==="act"?" selected":""}>Más venta</option><option value="ne"${FA.orden==="ne"?" selected":""}>Más venta a no estratégicos</option><option value="caida"${FA.orden==="caida"?" selected":""}>Más caída</option></select>
      <button class="btn gris" onclick="csvArts()">⬇️ Listado</button></div>
    <div class="muted" style="margin-bottom:4px">${PUEDE_ART?"Lo que marques vale para todos los clientes. En la ficha de recuperación se puede hacer una excepción para un cliente concreto."
      :"Los artículos los clasifica el jefe comercial o el CEO (valen para toda la empresa)."} Toda la empresa, sin intercompañía.</div>
    ${PUEDE_ART||ES_JEFE?`<div style="margin:6px 0 8px"><button class="btn gris" onclick="aplicarRecuperacion(this)">🚨 Aplicar a los clientes en recuperación</button>
      <span class="muted"> Pasa los artículos gancho / fuera a sus casos abiertos${ES_DIR?"":" de tu equipo"}.</span>${APLICAR?`<div class="muted" style="margin-top:4px">${esc(APLICAR)}</div>`:""}</div>`:""}
    <div id="lista">${htmlListaA()}</div></div>`;
}
function htmlListaA(){
  const L=listaArts(), tot=L.reduce((t,r)=>t+r.act,0);
  if(!L.length) return `<p class="muted">Ningún artículo con este filtro.</p>`;
  return `<div class="row" style="padding:2px 2px 6px"><span class="muted">${L.length} artículos · ${eur(tot)} este año</span>
      ${PUEDE_ART?`<a href="#" style="font-size:12.5px;font-weight:700" onclick="selTodosA();return false">${L.slice(0,FA.n).every(r=>SELA.has(r.cod))?"Quitar marcas":"Marcar los visibles"}</a>`:""}</div>`
    +L.slice(0,FA.n).map(r=>{ const k=claseArt(r.cod), d=MAPA.tipoArt(r.cod)?docArt(r.cod):null, s=SELA.has(r.cod), sg=SUG[r.cod];
      return `<div class="item${s?" sel":""}">${PUEDE_ART?`<input type="checkbox" ${s?"checked":""} onclick="selA('${esc(r.cod)}')">`:""}
        <div style="flex:1;min-width:0"><b style="font-size:13.5px">${esc(r.desc)}</b>
          <div class="muted">${esc(r.cod)}${r.cal?" · calibre <b>"+esc(r.cal)+"</b>":""}${r.met?" · <b>"+esc(String(r.met).replace(/\s*m$/i,""))+" m</b>":""}${r.calidad?" · "+esc(r.calidad):""} · ${r.cli} cliente${r.cli===1?"":"s"}</div>
          <div style="margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span class="tag" style="--c:${CA[k][2]}">${CA[k][0]} ${CA[k][1]}</span>
            ${d&&d.por?`<span class="muted" style="font-size:11.5px">${esc(d.por)}${d.fecha?" · "+fch(d.fecha):""}</span>`:""}
            ${sg&&k==="sin"?`<span class="tag" style="--c:#0369A1">💡 ${sg.gancho?"🪝 gancho en "+sg.gancho:""}${sg.gancho&&sg.fuera?" · ":""}${sg.fuera?"🚫 fuera en "+sg.fuera:""} cliente${sg.gancho+sg.fuera===1?"":"s"}</span>`:""}
            ${r.ne?`<span class="muted" style="font-size:11.5px">🚫 a no estratégicos: <b>${eur(r.ne)}</b> (${pct(r.ne,r.act)} %)</span>`:""}</div></div>
        <div class="num"><b>${eur(r.act)}</b><div class="muted" style="color:${r.act<r.ant?"var(--red)":"var(--green)"}">${varTxt(r.act,r.ant)}</div></div></div>`; }).join("")
    +(L.length>FA.n?`<button class="btn gris" style="width:100%;margin-top:8px" onclick="FA.n+=150;pintarLista()">Ver ${Math.min(150,L.length-FA.n)} más</button>`:"");
}
let _DA={}; function docArt(cod){ return _DA[ARR(cod)]||null; }
window.selA=(k)=>{ SELA.has(k)?SELA.delete(k):SELA.add(k); pintarLista(); };
window.selTodosA=()=>{ const L=listaArts().slice(0,FA.n); const todos=L.every(r=>SELA.has(r.cod)); L.forEach(r=>todos?SELA.delete(r.cod):SELA.add(r.cod)); pintarLista(); };

// ── Barra de acciones (abajo) ──────────────────────────────────────────
function pintarBarra(){
  const el=document.getElementById("barra");
  if(TAB==="clientes"&&PUEDE_CLI&&SELC.size){
    const L=CLI.filter(c=>SELC.has(c.cod)), v=L.reduce((t,c)=>t+c.act,0);
    el.style.display="";
    el.innerHTML=`<div class="in"><div class="row"><b>${SELC.size} cliente${SELC.size===1?"":"s"} marcado${SELC.size===1?"":"s"} · ${eur(v)}</b><a href="#" onclick="SELC=new Set();FORM_NO=false;pintarLista();return false" style="font-size:12.5px">Quitar marcas</a></div>
      ${FORM_NO?`<div style="display:grid;gap:6px;margin-top:8px">
          <select id="mn_mot">${RC.MOT_FUERA_CLI.map(m=>`<option>${esc(m)}</option>`).join("")}</select>
          <input id="mn_nota" placeholder="Por qué (opcional, queda en la ficha)">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn" style="background:#475569;color:#fff" onclick="clasificarClis('no_estrategico')">🚫 Guardar como no estratégicos</button><button class="btn gris" onclick="FORM_NO=false;pintarBarra()">Cancelar</button></div></div>`
      :`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
          <button class="chip" style="--c:#B91C1C" onclick="clasificarClis('estrategico')">🎯 Estratégico</button>
          <button class="chip" style="--c:#475569" onclick="FORM_NO=true;pintarBarra()">🚫 No estratégico…</button></div>`}</div>`;
    return;
  }
  if(TAB==="articulos"&&PUEDE_ART&&SELA.size&&ARTS){
    const L=ARTS.filter(r=>SELA.has(r.cod)), v=L.reduce((t,r)=>t+r.act,0);
    el.style.display="";
    el.innerHTML=`<div class="in"><div class="row"><b>${SELA.size} artículo${SELA.size===1?"":"s"} marcado${SELA.size===1?"":"s"} · ${eur(v)}</b><a href="#" onclick="SELA=new Set();pintarLista();return false" style="font-size:12.5px">Quitar marcas</a></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <button class="chip" style="--c:#B91C1C" onclick="clasificarArts('estrategica')">🎯 Venta estratégica</button>
        <button class="chip" style="--c:#B45309" onclick="clasificarArts('gancho')">🪝 Gancho</button>
        <button class="chip" style="--c:#475569" onclick="clasificarArts('fuera')">🚫 Fuera de estrategia</button>
        <button class="chip" style="--c:#94A3B8" onclick="clasificarArts('')">⏳ Quitar clasificación</button></div></div>`;
    return;
  }
  el.style.display="none"; el.innerHTML="";
}

// En paralelo, de pocos en pocos
async function enLotes(lista,fn,n,prog){ let i=0, hechos=0; const err=[];
  await Promise.all(Array.from({length:Math.min(n,lista.length)},async()=>{ while(i<lista.length){ const x=lista[i++];
    try{ await fn(x); }catch(e){ err.push(e.message||String(e)); } hechos++; if(prog) prog(hechos,lista.length); } }));
  return err; }

window.clasificarClis=async(tipo)=>{
  const L=CLI.filter(c=>SELC.has(c.cod)); if(!L.length) return;
  const mot=tipo==="no_estrategico"?(document.getElementById("mn_mot")?.value||""):"", nota=tipo==="no_estrategico"?(document.getElementById("mn_nota")?.value||"").trim():"";
  const enRec=L.filter(c=>CASO[c.cod]&&(tipo==="no_estrategico"?RC.abierto(CASO[c.cod]):CASO[c.cod].estado==="fuera_estrategia")).length;
  if(!confirm(`${tipo==="estrategico"?"🎯 Estratégicos":"🚫 No estratégicos"}: ${L.length} cliente${L.length===1?"":"s"}.${enRec?`\n\n${enRec} ${enRec===1?"está":"están"} en el plan de recuperación: ${tipo==="estrategico"?"vuelven al trabajo diario (parte y comité)":"salen del trabajo diario y su pérdida pasa a «fuera de estrategia»"}.`:""}`)) return;
  const ahora=new Date().toISOString();
  const err=await enLotes(L,async(c)=>{
    await MAPA.guardarCli(c.cod,tipo,{motivo:mot,nota,nombre:c.nombre,agente:c.ag,equipo:c.eq},QUIEN);
    const k=CASO[c.cod]; if(!k) return;
    if(tipo==="no_estrategico"&&RC.abierto(k)){
      const campos={estado:"fuera_estrategia",fueraMotivo:mot,fueraNota:nota,fueraPor:QUIEN,fueraEn:ahora,
        historial:(k.historial||[]).concat([{sem:SEM,fecha:ahora,por:QUIEN,sistema:`🚫 Cliente no estratégico (mapa de negocio · ${mot})${nota?": "+nota:""}`}])};
      await RC.guardar(k._id,campos); Object.assign(k,campos);
    }else if(tipo==="estrategico"&&k.estado==="fuera_estrategia"){
      const campos={estado:"abierto",fueraMotivo:"",fueraNota:"",ultimaAccion:ahora,
        historial:(k.historial||[]).concat([{sem:SEM,fecha:ahora,por:QUIEN,sistema:"↩️ Vuelve a ser cliente estratégico (mapa de negocio)"}])};
      await RC.guardar(k._id,campos); Object.assign(k,campos);
    }
  },4,(h,t)=>{ const el=document.getElementById("barra"); if(el) el.querySelector(".in").firstElementChild.innerHTML=`<b>Guardando ${h} de ${t}…</b>`; });
  SELC=new Set(); FORM_NO=false; pintar();
  if(err.length) alert(`No se han podido guardar ${err.length}: ${err[0]}. Vuelve a intentarlo.`);
};
window.clasificarArts=async(tipo)=>{
  const L=ARTS.filter(r=>SELA.has(r.cod)); if(!L.length) return;
  const txt=tipo?CA[tipo][0]+" "+CA[tipo][1]:"⏳ Sin clasificar";
  if(!confirm(`${txt} para TODA la empresa:\n\n${L.slice(0,12).map(r=>"· "+r.desc+(r.cal?" "+r.cal:"")).join("\n")}${L.length>12?"\n… y "+(L.length-12)+" más":""}\n\nEn recuperación se aplica al abrir la ficha de cada cliente, o ahora con «Aplicar a los clientes en recuperación».`)) return;
  const err=await enLotes(L,async(r)=>{ const d=await MAPA.guardarArt(r.cod,tipo,{descripcion:r.desc,calibre:r.cal},QUIEN); _DA[r.cod]=d; },5);
  SELA=new Set(); pintar();
  if(err.length) alert(`No se han podido guardar ${err.length}: ${err[0]}. Vuelve a intentarlo.`);
};
window.aplicarRecuperacion=async(btn)=>{
  const L=CASOS.filter(c=>RC.abierto(c)&&enAmbito({eq:c.equipo||(AG[ARR(c.agente)]||{}).equipo||"",ag:ARR(c.agente)}));
  if(!L.length){ alert("No hay clientes abiertos en recuperación."); return; }
  if(!confirm(`Se revisan los artículos de ${L.length} clientes abiertos en recuperación y se les aplica la clasificación (gancho / fuera de estrategia). Puede tardar unos minutos: no cierres la pantalla.`)) return;
  btn.disabled=true; await MAPA.arts(true); let cambiados=0;
  const err=await enLotes(L,async(c)=>{ const A=await MAPA.articulosDe(c.cliente); const r=await MAPA.aplicar(c,A,SEM); if(r) cambiados++; },3,
    (h,t)=>{ btn.textContent=`Revisando ${h} de ${t}… (${cambiados} con cambios)`; });
  APLICAR=`Hecho el ${new Date().toLocaleString("es-ES")}: ${cambiados} clientes con cambios de ${L.length} revisados${err.length?` · ${err.length} no se han podido consultar (se aplicarán al abrir su ficha)`:""}.`;
  btn.disabled=false; pintar();
};

// ── Listados para Excel ────────────────────────────────────────────────
function descargar(nombre,filas){
  const t="﻿"+filas.map(f=>f.map(v=>{ const s=String(v??""); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"})); a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
}
window.csvClientes=()=>{ const L=listaClientes();
  descargar(`clientes_mapa_negocio_${new Date().toISOString().slice(0,10)}.csv`,[["Código","Cliente","Población","Comercial","Equipo","Ventas este año","Mismo periodo año pasado","Variación %","Margen %","Clase","Motivo","Clasificado por","Fecha"]]
    .concat(L.map(c=>{ const k=claseCli(c), d=MAPA.tipoCli(c.cod)?(docCliente(c.cod)||{}):{}, caso=CASO[c.cod];
      return [c.cod,c.nombre,c.pob,nomAg(c.ag),c.eq,c.act,c.ant,c.ant?Math.round((c.act-c.ant)/Math.abs(c.ant)*100):"",c.base?Math.round(c.mg/c.base*100):"",CC[k][1],
        d.motivo||(k==="no"&&caso?caso.fueraMotivo||"":""),d.por||(k==="no"&&caso?"recuperación":""),fch(d.fecha)]; }))); };
window.csvArts=()=>{ const L=listaArts();
  descargar(`articulos_mapa_negocio_${new Date().toISOString().slice(0,10)}.csv`,[["Código","Artículo","Calibre","Metros","Calidad","Ventas este año","Mismo periodo año pasado","Variación %","Clientes","Venta a no estratégicos","Clase","Clasificado por"]]
    .concat(L.map(r=>{ const k=claseArt(r.cod), d=docArt(r.cod)||{};
      return [r.cod,r.desc,r.cal,r.met,r.calidad,r.act,r.ant,r.ant?Math.round((r.act-r.ant)/Math.abs(r.ant)*100):"",r.cli,r.ne,CA[k][1],d.por||""]; }))); };

// Documentos completos de la clasificación (quién y cuándo)
let _CCD={};
async function leerDocs(){ try{ const [a,c]=await Promise.all([RC.leer("clasif_articulos"),RC.leer("clasif_clientes")]);
  _DA={}; a.forEach(d=>{ if(d.tipo) _DA[ARR(d.codigo||d._id)]=d; }); _CCD={}; c.forEach(d=>{ if(d.tipo) _CCD[ARR(d.codigo||d._id)]=d; }); }catch(e){} }
const _guardarCli=MAPA.guardarCli; MAPA.guardarCli=async(...a)=>{ const d=await _guardarCli(...a); _CCD[ARR(a[0])]=d; return d; };

(async()=>{
  if(!ES_JEFE&&!AGENTE){ document.getElementById("app").innerHTML=`<p class="estado">Abre el mapa desde el CRM o desde el plan de recuperación.</p>`; return; }
  try{ await cargar(); await leerDocs(); pintar(); cargarArts(false); }
  catch(e){ document.getElementById("app").innerHTML=`<p class="estado">No se ha podido leer: ${esc(e.message)}</p>`; }
})();
