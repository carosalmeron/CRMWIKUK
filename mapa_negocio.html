<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de negocio</title>
<style>
 :root{--navy:#0F172A;--muted:#64748B;--border:#E2E8F0;--red:#DC2626;--green:#16A34A;--blue:#2563EB;
       --est:#B91C1C;--gan:#B45309;--fue:#64748B;--sin:#94A3B8;--ok:#0F766E}
 *{box-sizing:border-box}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F8FAFC;color:var(--navy)}
 header{background:#fff;border-bottom:1px solid var(--border);padding:14px 16px}
 header .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:center}
 header h1{margin:0;font-size:19px;font-weight:800}
 header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
 main{padding:14px 16px 120px;max-width:900px;margin:0 auto}
 .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:12px}
 .card h2{margin:0 0 2px;font-size:15px;font-weight:800}
 .muted{color:var(--muted);font-size:12px}
 .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
 .btn{border:none;border-radius:9px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
 .gris{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
 .ok{background:var(--green);color:#fff}
 .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
 .tabs button{border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
 .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
 .cajas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
 .caja{border:1px solid var(--border);border-top:3px solid var(--c);border-radius:11px;padding:9px 11px;cursor:pointer;background:#fff}
 .caja:hover{background:#F8FAFC}
 .caja .t{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
 .caja .v{font-size:19px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
 .caja .s{font-size:11.5px;color:var(--muted);margin-top:1px}
 .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#F1F5F9;margin:8px 0 2px}
 .bar i{display:block;height:10px}
 .chip{border:1.5px solid var(--c,#CBD5E1);background:#fff;color:var(--c,#334155);border-radius:99px;padding:6px 11px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}
 .chip.on{background:var(--c,#334155);color:#fff}
 .fil{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
 input,select,textarea{font:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:9px;padding:8px 10px;background:#fff}
 .item{display:flex;gap:9px;align-items:flex-start;border-top:1px solid #F1F5F9;padding:9px 2px}
 .item:first-child{border-top:none}
 .item.sel{background:#EFF6FF;border-radius:9px}
 .item input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:#2563EB}
 .num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
 .tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff)}
 .barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #2563EB;box-shadow:0 -6px 18px rgba(15,23,42,.1);padding:10px 16px;z-index:5}
 .barra .in{max-width:900px;margin:0 auto}
 table.x{width:100%;border-collapse:collapse;font-size:13px}
 table.x th{font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px;font-weight:800}
 table.x th:first-child,table.x td:first-child{text-align:left}
 table.x td{padding:8px 6px;border-top:1px solid #F1F5F9;text-align:right;font-variant-numeric:tabular-nums}
 .estado{padding:40px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="in">
  <button class="btn gris" id="volver" onclick="volver()">←</button>
  <div style="flex:1;min-width:0"><h1>🧭 Mapa de negocio</h1><p id="hs">Leyendo…</p></div>
  <button class="btn gris" onclick="recargarArts()" title="Volver a calcular las ventas por artículo">🔄</button>
</div></header>
<main id="app"><p class="estado">Leyendo clientes y ventas…</p></main>
<div class="barra" id="barra" style="display:none"></div>

<script src="/recuperacion_comun.js?v=20261005h"></script>
<script src="/mapa_comun.js?v=20261005b"></script>
<script>
const P=new URLSearchParams(location.search);
const ARR=RC.ARR, num=RC.num, eur=RC.eur, esc=RC.esc||((s)=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])));
const AGENTE=ARR(P.get("agente")||""), ROL=(P.get("rol")||"").toLowerCase(), EQUIPO=ARR(P.get("equipo")||"");
const NOMBRE=P.get("nombre")||AGENTE||ROL.toUpperCase();
const ES_CEO=ROL==="ceo"||ROL==="admin", ES_DIR=ES_CEO||ROL==="director"||ROL==="crm_director", ES_JEFE=ES_DIR||ROL==="jefe"||ROL==="crm_jefe";
// Clientes: los clasifica el jefe. Artículos: valen para toda la empresa, los clasifica el jefe comercial o el CEO.
const PUEDE_CLI=ES_JEFE, PUEDE_ART=ES_DIR;
const QUIEN=ES_CEO?"CEO":ES_DIR?"Jefe comercial ("+NOMBRE+")":"Jefe ("+NOMBRE+")";
const SEM=RC.semanaISO(new Date());
const pct=(a,b)=>b?Math.round(a/b*100):0;
const varTxt=(act,ant)=>ant?((act>=ant?"+":"")+Math.round((act-ant)/Math.abs(ant)*100)+" %"):"nuevo";
const fch=(s)=>s?String(s).slice(0,10).split("-").reverse().join("/"):"";

const CC={est:["🎯","Estratégico","var(--est)","Estratégicos"],no:["🚫","No estratégico","var(--fue)","No estratégicos"],sin:["⏳","Sin clasificar","var(--sin)","Sin clasificar"]};
const CA={estrategica:["🎯","Venta estratégica","var(--est)"],gancho:["🪝","Gancho","var(--gan)"],fuera:["🚫","Fuera de estrategia","var(--fue)"],sin:["⏳","Sin clasificar","var(--sin)"]};

let CLI=[], AG={}, CASO={}, CASOS=[], SUG={}, ARTS=null, ARTS_ERR="", ARTS_INFO={};
let TAB=P.get("tab")||"resumen", GF={eq:"",ag:""};
const FC={clase:"",q:"",orden:"act",n:150}, FA={clase:"",q:"",fam:"",orden:"act",n:150,cli:""};
let SELC=new Set(), SELA=new Set(), FORM_NO=false, APLICAR=null;

function volver(){ if(history.length>1) history.back(); else location.href="/recuperacion.html"+location.search; }
function enAmbito(c){
  // El mapa de negocio incluye Francia (recuperación no)
  if(ES_DIR) return true;
  if(ES_JEFE) return !EQUIPO||ARR(c.eq)===EQUIPO||ARR(c.eq).includes(EQUIPO)||(c.eq&&EQUIPO.includes(ARR(c.eq)));
  return c.ag===AGENTE;
}
const nomAg=(a)=>(AG[a]||{}).agente||a||"(sin comercial)";

// ── Carga ──────────────────────────────────────────────────────────────
async function cargar(){
  const [cli,res,casos]=await Promise.all([RC.leer("pbi_ventas_cliente"),RC.leer("pbi_resumen_agente"),RC.leerCasos().catch(()=>[]),MAPA.clis(true),MAPA.arts(true)]);
  AG={}; res.forEach(a=>AG[ARR(a._id)]=a);
  CASOS=casos; CASO={}; casos.forEach(c=>{ if(c.cliente) CASO[ARR(c.cliente)]=c; });
  CLI=cli.filter(d=>!d.intercompany&&!d.fusionadoEn&&!d.obsoleto).map(d=>{
    const ag=ARR(d.agenteFinal||d.agente), cod=ARR(d._id);
    return {cod,nombre:d.nombre||cod,pob:d.poblacion||"",ag,eq:(AG[ag]||{}).equipo||"",act:Math.round(num(d.ventasAct)),ant:Math.round(num(d.ventasAntYTD)),
      mg:num(d.margenAct),base:num(d.baseAct)||num(d.ventasAct)};
  }).filter(c=>(c.act||c.ant)&&enAmbito(c));
  // Lo que ya se ha marcado a mano en recuperación, cliente a cliente: pista para clasificar el artículo
  // Lo marcado en recuperación: 🪝 gancho cuenta para toda la empresa; 🚫 fuera queda como pista
  SUG=Object.fromEntries(MAPA.setRec(casos));
}
async function cargarArts(forzar){
  ARTS=null; ARTS_ERR=""; pintar();
  try{
    // Mismo ámbito que la parte de clientes, para que las dos sumas cuadren
    const amb=GF.ag?"&agente="+encodeURIComponent(GF.ag):GF.eq?"&equipo="+encodeURIComponent(GF.eq)
      :!ES_JEFE?"&agente="+encodeURIComponent(AGENTE):(!ES_DIR&&EQUIPO)?"&equipo="+encodeURIComponent(EQUIPO):"";
    const ctl=new AbortController(), t0=Date.now(); const tope=setTimeout(()=>ctl.abort(),150000);
    const reloj=setInterval(()=>{ const el=document.getElementById("relojArts"); if(el) el.textContent=Math.round((Date.now()-t0)/1000)+" s"; },1000);
    let r; try{ r=await fetch("/api/pbi-sync?mapaNegocio=1"+amb+(forzar?"&recargar=1":""),{signal:ctl.signal}); }
    catch(e){ throw new Error(e.name==="AbortError"?"Power BI tarda más de 2 minutos. Pulsa 🔄 dentro de un rato: el cálculo sigue y se guarda":e.message); }
    finally{ clearTimeout(tope); clearInterval(reloj); }
    const txt=await r.text(); let j=null; try{ j=JSON.parse(txt); }catch(e){ throw new Error("el servidor no ha respondido a tiempo ("+r.status+"). Pulsa 🔄 en un minuto"); }
    if(j.ok===false) throw new Error(j.error||"sin respuesta");
    if(!Array.isArray(j.filas)) throw new Error("en el servidor no está la versión nueva de api/pbi-sync.js"+(j.error?" (responde «"+j.error+"»)":"")+". Súbela a la carpeta api/ y espera a que Vercel termine");
    ARTS=(j.filas||[]).map(f=>({cod:ARR(f[0]),desc:f[1]||f[0],cal:f[2]||"",met:f[3]||"",calidad:f[4]||"",act:num(f[5]),ant:num(f[6]),cli:num(f[7]),ne:num(f[8])}));
    await ponerFamilias();
    ARTS_INFO={periodo:j.periodo,basadoEn:j.basadoEn,noEst:j.noEstrategicos,deCache:j.deCache,ambito:j.ambito||"",clientes:j.clientesEnAmbito};
  }catch(e){ ARTS_ERR=e.message||String(e); }
  pintar();
}
window.recargarArts=()=>cargarArts(true);

// ── Clases ─────────────────────────────────────────────────────────────
function claseCli(c){
  const t=MAPA.tipoCli(c.cod);
  if(t==="no_estrategico") return "no";
  if(t==="estrategico") return "est";
  const k=CASO[c.cod]; if(k&&k.estado==="fuera_estrategia") return "no";
  return "sin";
}
const claseArt=(cod)=>MAPA.tipoArt(cod)||"sin";

// ── Pintar ─────────────────────────────────────────────────────────────
function cli2(){ return CLI.filter(c=>!GF.ag?(!GF.eq||ARR(c.eq||"SIN EQUIPO")===GF.eq):c.ag===GF.ag); }
function pintar(){
  const L=cli2(), tot=L.reduce((t,c)=>t+c.act,0), totAnt=L.reduce((t,c)=>t+c.ant,0);
  document.getElementById("hs").textContent=`Ventas de este año (1 de enero a hoy) frente al mismo periodo del año pasado · ${L.length} clientes${GF.eq||GF.ag?" · "+(GF.ag?nomAg(GF.ag):GF.eq):""}`;
  const tabs=[["resumen","📊 Resumen"],["clientes","👥 Clientes"],["articulos","📦 Artículos"],["estudio","🔍 Estudio"]];
  const v=TAB==="clientes"?vistaClientes():TAB==="articulos"?vistaArticulos():TAB==="estudio"?vistaEstudio():vistaResumen(L,tot,totAnt);
  document.getElementById("app").innerHTML=`
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <div class="tabs" style="margin:0;flex:1">${tabs.map(([k,t])=>`<button class="${TAB===k?"on":""}" onclick="irTab('${k}')">${t}</button>`).join("")}</div>
      ${TAB!=="articulos"?filtroArbol():""}</div>
    ${v}`;
  pintarBarra();
}
window.irTab=(k,clase)=>{ TAB=k; if(k==="clientes"&&clase!==undefined) FC.clase=clase; if(k==="articulos"&&clase!==undefined) FA.clase=clase; FORM_NO=false; pintar(); window.scrollTo(0,0); };
function filtroArbol(){
  if(!ES_JEFE) return "";
  const g={}; CLI.forEach(c=>{ const e=ARR(c.eq)||"SIN EQUIPO"; (g[e]=g[e]||{})[c.ag]=(g[e][c.ag]||0)+1; });
  const eqs=Object.keys(g).sort(); if(new Set(CLI.map(c=>c.ag)).size<2) return "";
  const v=GF.ag?"ag:"+GF.ag:GF.eq?"eq:"+GF.eq:"", sp="    ";
  const opt=(val,txt)=>`<option value="${esc(val)}"${v===val?" selected":""}>${esc(txt)}</option>`;
  return `<select onchange="setGF(this.value)" style="max-width:100%;font-weight:700;border-color:${v?"#0F172A":"#CBD5E1"}">
    ${opt("",eqs.length>1?"Todos los equipos":"Todo el equipo")}
    ${eqs.map(e=>(eqs.length>1?opt("eq:"+e,"▾ "+e):"")+Object.keys(g[e]).sort((a,b)=>nomAg(a).localeCompare(nomAg(b))).map(a=>opt("ag:"+a,(eqs.length>1?sp:"")+"└ "+nomAg(a)+" · "+g[e][a])).join("")).join("")}</select>`;
}
window.setGF=(v)=>{ GF={eq:v.startsWith("eq:")?v.slice(3):"",ag:v.startsWith("ag:")?v.slice(3):""}; SELC=new Set(); SELA=new Set(); EST=null; EST_ERR=""; cargarArts(false); };

function caja(col,ic,tx,v,sub,onc,perd){ return `<div class="caja" style="--c:${col}" onclick="${onc}"><div class="t">${ic} ${tx}</div><div class="v">${eur(v)}</div>
  ${perd!=null?(perd>0?`<div style="font-size:12px;font-weight:800;color:var(--red);margin-top:1px">Perdido −${eur(perd)}</div>`:`<div style="font-size:12px;font-weight:700;color:var(--green);margin-top:1px">Sin pérdida</div>`):""}<div class="s">${sub}</div></div>`; }
// Fila de total debajo de las etiquetas
function filaTotal(v,a,perd){ return `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1.5px solid var(--border);margin-top:10px;padding-top:8px;font-size:13px">
  <b>Total</b><span><b>${eur(v)}</b> <span class="muted">· año pasado ${eur(a)} (${varTxt(v,a)})</span> · <b style="color:var(--red)">perdido −${eur(perd)}</b></span></div>`; }
function vistaResumen(L,tot,totAnt){
  // Por cliente
  // Perdido = lo que han dejado de comprar los clientes que caen (sin compensar con los que crecen)
  const g={est:{v:0,a:0,n:0,mg:0,b:0,p:0},no:{v:0,a:0,n:0,mg:0,b:0,p:0},sin:{v:0,a:0,n:0,mg:0,b:0,p:0}};
  L.forEach(c=>{ const x=g[claseCli(c)]; x.v+=c.act; x.a+=c.ant; x.n++; x.mg+=c.mg; x.b+=c.base; x.p+=Math.max(0,c.ant-c.act); });
  const perdTot=g.est.p+g.no.p+g.sin.p;
  const mgTxt=(x)=>x.b?` · margen ${Math.round(x.mg/x.b*100)} %`:"";
  const barC=["est","no","sin"].map(k=>`<i style="width:${pct(Math.max(0,g[k].v),Math.max(1,tot))}%;background:${CC[k][2]}"></i>`).join("");
  let h=`<div class="card">
    <div class="row"><h2>Tus ventas este año</h2><b style="font-size:20px">${eur(tot)}</b></div>
    <div class="muted">Año pasado, mismo periodo: ${eur(totAnt)} (${varTxt(tot,totAnt)})</div>
    <div style="font-size:13px;margin-top:4px"><b style="color:var(--red)">Perdido −${eur(perdTot)}</b> <span class="muted">en los clientes que caen · ganado +${eur(Math.max(0,perdTot+(tot-totAnt)))} en los que crecen</span></div></div>
  <div class="card"><h2>👥 Por tipo de cliente</h2><div class="muted">Lo decide el jefe en la pestaña Clientes. Sin clasificar se trabaja como estratégico hasta que se decida.</div>
    <div class="bar">${barC}</div>
    <div class="cajas">${["est","no","sin"].map(k=>caja(CC[k][2],CC[k][0],CC[k][3],g[k].v,g[k].n?`${pct(g[k].v,tot)} % · ${g[k].n} cliente${g[k].n===1?"":"s"} · ${varTxt(g[k].v,g[k].a)}${mgTxt(g[k])}`:"ninguno todavía",`irTab('clientes','${k}')`,g[k].n?g[k].p:null)).join("")}</div>${filaTotal(tot,totAnt,perdTot)}</div>`;
  // Por artículo y cruce (toda la empresa)
  if(!ARTS){
    h+=`<div class="card"><h2>📦 Por tipo de artículo</h2>${ARTS_ERR?`<p class="muted">No se han podido calcular las ventas por artículo (${esc(ARTS_ERR)}). <a href="#" onclick="cargarArts(true);return false">Reintentar</a></p>`
      :`<p class="muted">Calculando ventas por artículo en Power BI… <b id="relojArts"></b> (la primera vez del día puede tardar un par de minutos).</p>`}</div>`;
    return h+progreso(L);
  }
  const a={estrategica:{v:0,a:0,n:0,ne:0,p:0},gancho:{v:0,a:0,n:0,ne:0,p:0},fuera:{v:0,a:0,n:0,ne:0,p:0},sin:{v:0,a:0,n:0,ne:0,p:0}};
  ARTS.forEach(r=>{ const x=a[claseArt(r.cod)]; x.v+=r.act; x.a+=r.ant; x.ne+=r.ne; if(r.act>0) x.n++; x.p+=Math.max(0,r.ant-r.act); });
  const totA=Object.values(a).reduce((t,x)=>t+x.v,0);
  const barA=["estrategica","gancho","fuera","sin"].map(k=>`<i style="width:${pct(Math.max(0,a[k].v),Math.max(1,totA))}%;background:${CA[k][2]}"></i>`).join("");
  h+=`<div class="card"><h2>📦 Por tipo de artículo</h2>
    <div class="muted">Un artículo gancho o fuera de estrategia lo es para todos los clientes (salvo excepción en la ficha del cliente).</div>
    <div class="bar">${barA}</div>${Math.abs(totA-tot)>Math.max(1000,Math.abs(tot)*0.01)?`<div class="muted" style="color:#B45309">Por artículo suma ${eur(totA)} y por cliente ${eur(tot)}: la diferencia son ventas de clientes que no están en la cartera del CRM.</div>`:""}
    <div class="cajas">${["estrategica","gancho","fuera","sin"].map(k=>caja(CA[k][2],CA[k][0],CA[k][1],a[k].v,a[k].n?`${pct(a[k].v,totA)} % · ${a[k].n} artículo${a[k].n===1?"":"s"} · ${varTxt(a[k].v,a[k].a)}`:"ninguno todavía",`irTab('articulos','${k}')`,a[k].n?a[k].p:null)).join("")}</div>
    ${filaTotal(totA,Object.values(a).reduce((t,x)=>t+x.a,0),Object.values(a).reduce((t,x)=>t+x.p,0))}
    <div class="muted" style="margin-top:4px">Perdido por artículo: lo que han dejado de vender los artículos que caen. No coincide con el perdido por cliente porque cada uno compensa cosas distintas (un cliente que cambia un artículo por otro no pierde, pero el artículo sí).</div></div>`;
  // Los artículos gancho, con lo que venden a todos los clientes
  const G=ARTS.filter(r=>claseArt(r.cod)==="gancho").sort((x,y)=>y.act-x.act);
  if(G.length) h+=`<div class="card"><div class="row"><h2>🪝 Artículos gancho · ${G.length}</h2><b style="color:var(--gan)">${eur(a.gancho.v)}</b></div>
    <div class="muted">Lo que venden este año a todos los clientes. ${pct(a.gancho.v,totA)} % de las ventas de la empresa.</div>
    ${G.slice(0,8).map(r=>`<div class="item"><div style="flex:1;min-width:0"><b style="font-size:13px">${esc(r.desc)}</b><div class="muted">${esc(r.cod)}${r.cal?" · "+esc(r.cal):""} · ${r.cli} clientes${MAPA.origenArt(r.cod)==="recuperacion"?" · desde recuperación":""}</div></div>
      <div class="num"><b>${eur(r.act)}</b><div class="muted" style="color:${r.act<r.ant?"var(--red)":"var(--green)"}">${varTxt(r.act,r.ant)}</div></div></div>`).join("")}
    ${G.length>8?`<a href="#" onclick="irTab('articulos','gancho');return false" style="font-size:12.5px;font-weight:700">Ver los ${G.length} ›</a>`:""}</div>`;
  // Cruce: qué es negocio estratégico de verdad
  const fila=(k,txt)=>{ const x=k==="estrategica"?{v:a.estrategica.v+a.sin.v,ne:a.estrategica.ne+a.sin.ne}:a[k];
    return `<tr><td>${txt}</td><td${k==="estrategica"?' style="background:#FEF2F2;font-weight:800;color:var(--est)"':""}>${eur(x.v-x.ne)}</td><td>${eur(x.ne)}</td><td><b>${eur(x.v)}</b></td></tr>`; };
  const nucleo=(a.estrategica.v+a.sin.v)-(a.estrategica.ne+a.sin.ne), resto=totA-nucleo;
  h+=`<div class="card"><h2>🧭 ¿Cuál es mi negocio estratégico?</h2>
    <div class="muted">Mismos clientes que arriba. Clientes no estratégicos: ${num(ARTS_INFO.noEst)} (los marcados aquí y los que recuperación ha dejado fuera de estrategia).</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">

function progreso(L){

  return h+`<div class="muted" style="margin-top:6px">Consejo: empieza por los clientes y artículos que más venden; con los 50 primeros suele quedar clasificado más del 70 % del negocio.</div></div>`;

// En paralelo, de pocos en pocos
async function enLotes(lista,fn,n,prog){ let i=0, hechos=0; const err=[];
  await Promise.all(Array.from({length:Math.min(n,lista.length)},async()=>{ while(i<lista.length){ const x=lista[i++];
    try{ await fn(x); }catch(e){ err.push(e.message||String(e)); } hechos++; if(prog) prog(hechos,lista.length); } }));
  return err; }

window.clasificarClis=async(tipo)=>{
  const L=CLI.filter(c=>SELC.has(c.cod)); if(!L.length) return;
  const mot=tipo==="no_estrategico"?(document.getElementById("mn_mot")?.value||""):"", nota=tipo==="no_estrategico"?(document.getElementById("mn_nota")?.value||"").trim():"";
  const enRec=L.filter(c=>CASO[c.cod]&&(tipo==="no_estrategico"?RC.abierto(CASO[c.cod]):CASO[c.cod].estado==="fuera_estrategia")).length;
  if(!confirm(`${tipo==="estrategico"?"🎯 Estratégicos":"🚫 No estratégicos"}: ${L.length} cliente${L.length===1?"":"s"}.${enRec?`\n\n${enRec} ${enRec===1?"está":"están"} en el plan de recuperación: ${tipo==="estrategico"?"vuelven al trabajo diario (parte y comité)":"salen del trabajo diario y su pérdida pasa a «fuera de estrategia»"}.`:""}`)) return;
  const ahora=new Date().toISOString();
  const err=await enLotes(L,async(c)=>{
    await MAPA.guardarCli(c.cod,tipo,{motivo:mot,nota,nombre:c.nombre,agente:c.ag,equipo:c.eq},QUIEN);
    const k=CASO[c.cod]; if(!k) return;

      <div class="muted">Todo lo que se vende (no solo lo estratégico). Perdido = lo que han dejado de vender los artículos de cada comercial que caen.</div>
      <div class="bar">${TIPOS_P.map(([k,,c])=>`<i style="width:${pct(PT[k],PT.tot||1)}%;background:${c}"></i>`).join("")}</div>
      <div class="cajas">${TIPOS_P.map(([k,t,c])=>`<div class="caja" style="--c:${c}${act(EST_TIPO===k)}" onclick="EST_TIPO=EST_TIPO==='${k}'?'':'${k}';pintar()"><div class="t">${t} ›</div>${PT[k]?`<div class="v" style="color:var(--red)">−${eur(PT[k])}</div>`:`<div class="v" style="color:var(--green);font-size:15px">Sin pérdida</div>`}<div class="s">${pct(PT[k],PT.tot||1)} % de lo perdido</div></div>`).join("")}</div>
      <div class="row" style="border-top:1.5px solid var(--border);margin-top:10px;padding-top:8px"><b>Total perdido</b><b style="color:var(--red)">−${eur(PT.tot)}</b></div></div>
    <div class="card"><h2>👤 Perdido por comercial y tipo de venta</h2><div class="muted">De quien más pierde a quien menos. 2026 y variación de todo lo que vende.</div>
      ${tablaE(["Comercial","2026","Variación","Perdido total",...TIPOS_P.map(x=>x[1])],grupo(R,r=>r.ag).map(g=>Object.assign(g,{p:perdT(g.items)})).filter(g=>g.p.tot>0).sort((a,b)=>b.p.tot-a.p.tot).map(g=>
        `<tr><td><b>${lnk("ag",g.k,esc(nomA(g.k)))}</b><div class="muted">${esc(eqA(g.k))} · ${esc(tipoA(g.k))}</div></td><td>${eur(g.act)}</td><td>${fmtVar(g.act,g.ant)}</td><td style="color:var(--red);font-weight:800">−${eur(g.p.tot)}</td>${TIPOS_P.map(([k])=>`<td style="color:${g.p[k]?"var(--red)":"#CBD5E1"}">${g.p[k]?"−"+eur(g.p[k]):"—"}</td>`).join("")}</tr>`))}</div>
    <div class="card"><h2>📦 Perdido por familia y tipo de venta</h2>
      ${tablaE(["Familia","2026","Variación","Perdido total",...TIPOS_P.map(x=>x[1])],grupo(R,r=>r.fam).map(g=>Object.assign(g,{p:perdT(g.items)})).filter(g=>g.p.tot>0).sort((a,b)=>b.p.tot-a.p.tot).map(g=>
        `<tr><td><b>${lnk("fam",g.k,esc(g.k))}</b></td><td>${eur(g.act)}</td><td>${fmtVar(g.act,g.ant)}</td><td style="color:var(--red);font-weight:800">−${eur(g.p.tot)}</td>${TIPOS_P.map(([k])=>`<td style="color:${g.p[k]?"var(--red)":"#CBD5E1"}">${g.p[k]?"−"+eur(g.p[k]):"—"}</td>`).join("")}</tr>`))}</div>
    <div class="card"><h2>🧩 Qué está pasando <span class="muted" style="font-weight:600">· ${TL}</span></h2>
      ${P.length?`<ul style="margin:6px 0 0;padding-left:18px;line-height:1.55;font-size:13.5px">${P.map(p=>`<li style="margin-bottom:6px">${p}</li>`).join("")}</ul>`:`<p class="muted">No se ve ningún patrón claro con estos datos.</p>`}
      <div class="muted" style="margin-top:6px">Reglas: patrón de producto = la familia cae (más de un 10 %) en al menos el 60 % de los comerciales que la vendían; patrón de comercial = el 70 % de lo que pierde la familia está en uno o dos comerciales; patrón de cartera = el comercial cae en el 60 % de sus familias.</div></div>
    <div class="card"><h2>📦 Por familia · ${TL}</h2><div class="muted">De la que más cae a la que más crece. Pulsa una familia para ver solo esa familia en todo el estudio.</div>
      ${tablaE(["Familia","2026","Variación","Perdido","Comerciales que caen"],fams.map(f=>`${filaG(Object.assign(f,{lbl:lnk("fam",f.k,esc(f.k))}),`<td>${f.vend?f.caen+" de "+f.vend:"—"}</td>`)}${EST_FAM===f.k?`<tr><td colspan="5" style="background:#F8FAFC;text-align:left">${grupo(f.items,r=>r.cod).sort((a,b)=>(a.act-a.ant)-(b.act-b.ant)).slice(0,12).map(x=>`<div class="row" style="padding:3px 0;font-size:12.5px"><span>${esc(artInfo(x.k).desc)} <span class="muted">${esc(x.k)}</span></span><span>${eur(x.act)} · ${fmtVar(x.act,x.ant)}</span></div>`).join("")}</td></tr>`:""}`))}</div>
    <div class="card"><h2>👤 Por comercial · ${TL}</h2><div class="muted">Venta de cada comercial (por quién la factura) y sus clientes (por quién los tiene asignados).</div>
      ${tablaE(["Comercial","2026","Variación","Perdido","Familias que caen","Clientes que caen · perdidos"],ags.map(a=>{ const c=cliPorAg[a.k]||{n:0,caen:0,perd:0};
        return filaG(Object.assign(a,{lbl:`<b>${lnk("ag",a.k,esc(nomA(a.k)))}</b><div class="muted">${esc(eqA(a.k))} · ${esc(tipoA(a.k))}</div>`}),`<td>${a.fams?a.famsCaen+" de "+a.fams:"—"}</td><td>${c.n?`${c.caen} de ${c.n} · ${c.perd}`:"—"}</td>`); }))}</div>
    <div class="card"><h2>🏷️ Por tipo de comercial y por equipo · ${TL}</h2>
      ${tablaE(["Tipo de comercial","2026","Variación","Perdido","Comerciales"],tipos.map(t=>filaG(t,`<td>${new Set(t.items.map(r=>r.ag)).size}</td>`)))}
      <div style="height:8px"></div>
      ${tablaE(["Equipo","2026","Variación","Perdido","Comerciales"],eqs.map(t=>filaG(t,`<td>${new Set(t.items.map(r=>r.ag)).size}</td>`)))}</div>
    <div class="card"><h2>🏷️ Artículos · ${TL}</h2><div class="muted">${EST_F.modo==="gan"?"Los que más crecen":"Los que más caen"} con los filtros puestos. Pulsa uno para ver todo lo relacionado con él.</div>
      ${tablaE(["Artículo","2026","Variación","Comerciales"],artsL.slice(0,EST_F.art?1:20).map(x=>{ const ai=artInfo(x.k);
        return `<tr><td>${lnk("art",x.k,esc(ai.desc))}<div class="muted">${esc(x.k)} · ${lnk("fam",famDe(ai),esc(famDe(ai)))} · ${CA[claseArt(x.k)][0]}</div></td><td>${eur(x.act)}</td><td>${fmtVar(x.act,x.ant)}</td><td>${new Set(x.items.map(r=>r.ag)).size}</td></tr>`; }))}
      ${EST_F.art?`<div style="margin-top:8px"><b style="font-size:13px">Quién lo vende</b>${tablaE(["Comercial","2026","Variación"],grupo(F,r=>r.ag).sort((a,b)=>(a.act-a.ant)-(b.act-b.ant)).map(g=>`<tr><td>${lnk("ag",g.k,esc(nomA(g.k)))}<div class="muted">${esc(eqA(g.k))}</div></td><td>${eur(g.act)}</td><td>${fmtVar(g.act,g.ant)}</td></tr>`))}</div>`:""}</div>
    ${famTop.length&&agTop.length?`<div class="card"><h2>🔥 Comercial × familia · ${TL}</h2><div class="muted">Variación en miles de € de las familias que más caen. Rojo intenso = donde más se pierde. Si una columna está roja entera es la familia (patrón de producto); si una fila está roja entera es el comercial (patrón de cartera).</div>
      <div style="overflow-x:auto"><table class="x"><tr><th>Comercial</th>${famTop.map(f=>`<th style="min-width:64px;white-space:normal">${lnk("fam",f,esc(f))}</th>`).join("")}</tr>
        ${agTop.map(a=>`<tr><td style="white-space:nowrap">${lnk("ag",a.k,esc(nomA(a.k)))}</td>${famTop.map(f=>celda(a,f)).join("")}</tr>`).join("")}</table></div></div>`:""}
    <div class="card"><h2>🚪 Clientes que más caen · ${EST_TIPO==="n"?"no estratégicos":EST_TIPO?"estratégicos":"todos"}</h2>
      ${tablaE(["Cliente","2026","Variación","Comercial"],top10.map(c=>`<tr><td>${esc(c.nombre)}<div class="muted">${esc(c.cod)}${c.act<=0?" · <b style='color:var(--red)'>ha dejado de comprar</b>":""}</div></td><td>${eur(c.act)}</td><td>${fmtVar(c.act,c.ant)}</td><td>${lnk("ag",c.ag,esc(nomAg(c.ag)))}</td></tr>`))}${EST_F.fam||EST_F.art?`<div class="muted" style="margin-top:4px">Los clientes no se pueden filtrar por familia o artículo: esta lista es del comercial y del tipo elegidos.</div>`:""}</div>
    ${causas.length?`<div class="card"><h2>🩺 Causas declaradas en recuperación</h2><div class="muted">Clientes estratégicos abiertos en el plan de recuperación, por la causa que ha puesto el comercial. Pérdida en venta estratégica.</div>
      ${tablaE(["Causa","Clientes","Pérdida"],causas.map(c=>`<tr><td>${esc(c.k)}</td><td>${c.n}</td><td style="color:var(--red)">−${eur(c.ant)}</td></tr>`))}</div>`:""}
    <div style="text-align:center;margin:8px 0"><button class="btn gris" onclick="csvEstudio()">⬇️ Descargar los datos del estudio</button> <button class="btn gris" onclick="cargarEstudio(true)">🔄 Recalcular</button></div>`;
}
window.csvEstudio=()=>{ if(!EST) return;
  descargar(`estudio_estrategico_${new Date().toISOString().slice(0,10)}.csv`,[["Código","Artículo","Familia","Clase del artículo","Comercial","Equipo","Tipo de comercial","Ventas este año","Mismo periodo año pasado","Variación","De ellas a clientes no estratégicos (este año)","A clientes no estratégicos (año pasado)"]]
    .concat(EST.filas.map(r=>{ const a=artInfo(r.cod), i=EST.agentes[r.ag]||{};
      return [r.cod,a.desc,famDe(a),CA[claseArt(r.cod)][1],nomAg(r.ag),i.equipo||"",i.tipo||"",r.act,r.ant,r.act-r.ant,r.ane,r.bne]; }))); };

// ── Listados para Excel ────────────────────────────────────────────────
function descargar(nombre,filas){
  const t="﻿"+filas.map(f=>f.map(v=>{ const s=String(v??""); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"})); a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
}
window.csvClientes=()=>{ const L=listaClientes();
  descargar(`clientes_mapa_negocio_${new Date().toISOString().slice(0,10)}.csv`,[["Código","Cliente","Población","Comercial","Equipo","Ventas este año","Mismo periodo año pasado","Variación %","Margen %","Clase","Motivo","Clasificado por","Fecha"]]
    .concat(L.map(c=>{ const k=claseCli(c), d=MAPA.tipoCli(c.cod)?(docCliente(c.cod)||{}):{}, caso=CASO[c.cod];
      return [c.cod,c.nombre,c.pob,nomAg(c.ag),c.eq,c.act,c.ant,c.ant?Math.round((c.act-c.ant)/Math.abs(c.ant)*100):"",c.base?Math.round(c.mg/c.base*100):"",CC[k][1],
        d.motivo||(k==="no"&&caso?caso.fueraMotivo||"":""),d.por||(k==="no"&&caso?"recuperación":""),fch(d.fecha)]; }))); };
window.csvArts=()=>{ const L=listaArts();
  descargar(`articulos_mapa_negocio_${new Date().toISOString().slice(0,10)}.csv`,[["Código","Artículo","Familia","Calibre","Metros","Calidad","Ventas este año","Mismo periodo año pasado","Variación %","Clientes","Venta a no estratégicos","Clase","Clasificado por"]]
    .concat(L.map(r=>{ const k=claseArt(r.cod), d=docArt(r.cod)||{};
      return [r.cod,r.desc,famDe(r),r.cal,r.met,r.calidad,r.act,r.ant,r.ant?Math.round((r.act-r.ant)/Math.abs(r.ant)*100):"",r.cli,r.ne,CA[k][1],d.por||""]; }))); };

// Documentos completos de la clasificación (quién y cuándo)
let _CCD={};
async function leerDocs(){ try{ const [a,c]=await Promise.all([RC.leer("clasif_articulos"),RC.leer("clasif_clientes")]);
  _DA={}; a.forEach(d=>{ if(d.tipo) _DA[ARR(d.codigo||d._id)]=d; }); _CCD={}; c.forEach(d=>{ if(d.tipo) _CCD[ARR(d.codigo||d._id)]=d; }); }catch(e){} }
const _guardarCli=MAPA.guardarCli; MAPA.guardarCli=async(...a)=>{ const d=await _guardarCli(...a); _CCD[ARR(a[0])]=d; return d; };

(async()=>{
  if(!ES_JEFE&&!AGENTE){ document.getElementById("app").innerHTML=`<p class="estado">Abre el mapa desde el CRM o desde el plan de recuperación.</p>`; return; }
  try{ await cargar(); await leerDocs(); pintar(); cargarArts(false); }
  catch(e){ document.getElementById("app").innerHTML=`<p class="estado">No se ha podido leer: ${esc(e.message)}</p>`; }
})();
</script>
