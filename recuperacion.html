<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de recuperación</title>
<style>
 :root{--navy:#0F172A;--muted:#64748B;--border:#E2E8F0;--white:#fff;
       --green:#16A34A;--greenL:#F0FDF4;--red:#DC2626;--redL:#FEF2F2;
       --amber:#D97706;--amberL:#FFFBEB;--blue:#2563EB;--blueL:#EFF6FF}
 *{box-sizing:border-box}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#F8FAFC;color:var(--navy)}
 header{background:var(--navy);color:#fff;padding:16px 18px}
 header h1{margin:0 0 3px;font-size:19px;font-weight:800}
 header p{margin:0;font-size:12px;opacity:.75}
 main{padding:14px 16px 90px;max-width:860px;margin:0 auto}
 .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
 .tile{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px}
 .tile span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
 .tile b{display:block;font-size:18px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
 @media(max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
 .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
 .tabs button{flex:none;border:1.5px solid var(--border);background:#fff;border-radius:99px;
   padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
 .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
 .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px}
 .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
 .muted{color:var(--muted);font-size:12px}
 .neg{color:var(--red);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
 .pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;color:#fff}
 .caso{border-top:1px solid #F1F5F9;padding:10px 0}
 .caso:first-of-type{border-top:none}
 .q{font-size:12.5px;margin-top:3px;line-height:1.45}
 .q b{color:var(--navy)}
 .falta{color:var(--red);font-weight:700}
 .btn{border:none;border-radius:9px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer}
 .ok{background:var(--green);color:#fff}.no{background:#fff;color:var(--red);border:1.5px solid #FCA5A5}
 .gris{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
 textarea,input,select{font:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;width:100%}
 textarea{min-height:54px;resize:vertical}
 .estado{padding:40px 16px;text-align:center;color:var(--muted)}
 .barra{height:7px;background:#EEF1F5;border-radius:99px;overflow:hidden;margin-top:4px}
 .barra i{display:block;height:7px;background:var(--red);border-radius:99px}
 details summary{cursor:pointer}
 .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
 .filtros select{width:auto;padding:7px 9px;font-size:13px}
 .chipA{border:1.5px solid var(--c);background:#fff;color:var(--c);border-radius:99px;padding:7px 12px;font-weight:800;font-size:12.5px;cursor:pointer}
 .chipA.on{background:var(--c);color:#fff}
 .embed header{display:none}
</style>
</head>
<body>
<header>
  <h1>🚨 Plan de recuperación</h1>
  <p id="hs">Leyendo…</p>
</header>
<main id="app"><p class="estado">Leyendo casos…</p></main>

<script src="/recuperacion_comun.js?v=20261004b"></script>
<script>
const P=new URLSearchParams(location.search);
const EMBED=P.get("embed")==="1", FICHA_URL=P.get("ficha")||"", ART_URL=P.get("art")||"";
if(EMBED) document.documentElement.classList.add("embed");
const ARR=RC.ARR, num=RC.num, eur=RC.eur;
const AGENTE=ARR(P.get("agente")||"");
const ROL=(P.get("rol")||"").toLowerCase();          // ceo | director | jefe | comercial
const EQUIPO=ARR(P.get("equipo")||"");
const NOMBRE=P.get("nombre")||AGENTE||ROL.toUpperCase();
const ES_CEO=ROL==="ceo"||ROL==="admin";
const ES_DIR=ES_CEO||ROL==="director"||ROL==="crm_director";
const ES_JEFE=ES_DIR||ROL==="jefe"||ROL==="crm_jefe";
const SEM=RC.semanaISO(new Date());
const esc=(s)=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fch=(s)=>s?String(s).slice(0,10).split("-").reverse().join("/"):"";

let CASOS=[], AG={}, TAB=ES_CEO?"comite":ES_JEFE?"comite":"casos", FIL={estado:"abiertos",nivel:"",agente:"",equipo:""};

// Qué casos ve cada uno
function enAmbito(c){
  if(RC.esFrancia(c.equipo)) return false;
  if(ES_DIR) return true;
  if(ES_JEFE) return !EQUIPO || ARR(c.equipo)===EQUIPO || ARR(c.equipo).includes(EQUIPO) || EQUIPO.includes(ARR(c.equipo));
  return ARR(c.agente)===AGENTE;
}
const nomAg=(a)=>AG[ARR(a)]?.agente||a||"(sin comercial)";

let ESTS=[];
const NIVEL=ES_CEO?"ceo":ES_DIR?"director":ES_JEFE?"jefe":"comercial";
if(window.RC) RC.NIVEL_UI=NIVEL;
const YO_EST={id:ES_CEO?"ceo":AGENTE,nombre:ES_CEO?"CEO":(NOMBRE||AGENTE),nivel:NIVEL};
function estEnAmbito(e){
  if(RC.esFrancia(e.equipo)) return false;
  if(ES_DIR) return true;
  if(ES_JEFE) return !EQUIPO||ARR(e.equipo)===EQUIPO||ARR(e.equipo).includes(EQUIPO)||CASOS.some(c=>ARR(c.cliente)===ARR(e.clienteId));
  return CASOS.some(c=>ARR(c.cliente)===ARR(e.clienteId));
}
const estPendMias=()=>ESTS.filter(e=>estEnAmbito(e)&&(RC.meTocaEst(e,NIVEL,YO_EST.id)||RC.meTocaEst(e,NIVEL,AGENTE)));
const estDeOtros=()=>ESTS.filter(e=>e.estado==="pendiente_aprobacion"&&estEnAmbito(e)&&!RC.meTocaEst(e,NIVEL,YO_EST.id)&&!RC.meTocaEst(e,NIVEL,AGENTE));
async function cargar(){
  const [casos,res,ests,us]=await Promise.all([RC.leerCasos(), RC.leer("pbi_resumen_agente"), RC.leerProfundo("estrategias").catch(()=>[]), RC.leer("usuarios",10).catch(()=>[])]);
  RC._us=us;
  if(RC.VERSION!=="20261004b"){
    // Se vuelve a pedir sin caché antes de rendirse
    await new Promise(ok=>{ const sc=document.createElement("script"); sc.src="/recuperacion_comun.js?t="+Date.now(); sc.onload=sc.onerror=ok; document.head.appendChild(sc); });
    if(RC.VERSION!=="20261004b") throw new Error("en el servidor está la versión «"+(RC.VERSION||"antigua, sin número")+"» de recuperacion_comun.js y hace falta la 20261004b. "
      +"Sube recuperacion_comun.js a la MISMA carpeta que recuperacion.html (la raíz, no api/), espera a que Vercel termine y recarga.");
  }
  await RC.prepararEsts(ests.filter(e=>!e.eliminada&&!RC.esFrancia(e.equipo)));
  ESTS=ests.filter(e=>!e.eliminada);
  AG={}; res.forEach(a=>AG[ARR(a._id)]=a);
  CASOS=casos.filter(enAmbito);
}

// ── Detectar en toda la cartera (sin esperar a que cada comercial abra su parte)
async function detectarTodo(btn){
  if(!confirm("Revisar la cartera de todos los comerciales de tu ámbito y abrir los casos que falten?")) return;
  btn.disabled=true; btn.textContent="Leyendo cartera…";
  try{
    const [cli,mesRaw,res,previos]=await Promise.all([RC.leer("pbi_ventas_cliente"),RC.leer("pbi_meses_cliente"),
      RC.leer("pbi_resumen_agente"),RC.leerCasos()]);
    const mes={}; mesRaw.forEach(d=>{ try{ for(const f of JSON.parse(d.datos||"[]")) mes[ARR(f[0])]=f; }catch(e){} });
    const eq={}; res.forEach(a=>eq[ARR(a._id)]=a.equipo||"");
    const porAg={};
    cli.forEach(c=>{ const a=ARR(c.agenteFinal||c.agente); if(!a||/^SIN/.test(a)) return;
      if(RC.esFrancia(eq[a])) return;
      if(!ES_DIR&&ES_JEFE&&EQUIPO&&ARR(eq[a])!==EQUIPO&&!ARR(eq[a]).includes(EQUIPO)) return;
      if(!ES_JEFE&&a!==AGENTE) return;
      (porAg[a]=porAg[a]||[]).push(c); });
    const pid={}; previos.forEach(c=>pid[c._id]=c);
    let escritos=0, n=0; const ags=Object.keys(porAg);
    for(const a of ags){
      n++; btn.textContent=`Revisando ${n}/${ags.length} · ${a}`;
      const suyos=porAg[a];
      const prev=suyos.map(c=>pid[RC.idDe(c._id)]).filter(Boolean);
      const r=await RC.sincronizar(a,eq[a]||"",suyos,mes,prev,{por:AGENTE||ROL});
      escritos+=r.escritos||0;
    }
    alert(`Hecho: ${escritos} casos abiertos o actualizados en ${ags.length} comerciales.`);
    await cargar(); pintar();
  }catch(e){ alert("No se ha podido: "+e.message); }
  btn.disabled=false; btn.textContent="🔎 Detectar ahora";
}

// ── Pintar ────────────────────────────────────────────────────────────
function pill(n){ return `<span class="pill" style="background:${RC.NIVEL_COL[n]}">${RC.NIVEL_TXT[n]}</span>`; }
function ultimaDeSemana(c){ return (c.historial||[]).filter(x=>x.sem===SEM&&!x.sistema).slice(-1)[0]||null; }
// Diagnosticado esta misma semana cuenta como avance: no se le pide más hasta la siguiente
function diagEstaSemana(c){ return (c.historial||[]).some(x=>x.sem===SEM&&/^Diagn/.test(x.sistema||"")); }
function lineaCaso(c,conAcciones,opts){
  opts=opts||{};
  const nv=RC.nivelDe(c);
  const u=ultimaDeSemana(c);
  const dAcc=RC.dias(c.ultimaAccion||c.abierto);
  const sinPlan=!RC.tienePlan(c);
  let h=`<div class="caso"${opts.sinCabecera?' style="border:none;padding:4px 0 8px"':""}>
    ${opts.sinCabecera?`<div class="muted">${esc(c.motivo||"")}</div>`:`<div class="row"><div><b style="font-size:14px">${esc(c.nombre)}</b>
      <div class="muted">${esc(nomAg(c.agente))} · ${esc(c.motivo||"")}</div></div>
      <div class="neg">−${eur(c.perdido)}</div></div>`}
    <div style="margin:5px 0 2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${pill(nv.nivel)}
      <span class="muted">${c.estado==="recuperado"?"✅ recuperado el "+fch(c.recuperadoEn)
        :c.estado==="archivado"?"🗄 archivado · "+esc(c.archivoMotivo||"")
        :(c.estado==="aplazado"||c.estado==="bloqueado")?esc(RC.txtEstadoCerrado(c))
        :c.estado==="propuesta_archivo"?"⏳ pide archivarlo"
        :dAcc!=null?`${dAcc} días desde la última acción`:""}${nv.motivo&&nv.nivel>RC.nivelBase(c.perdido)?" · ⬆ "+esc(nv.motivo):""}</span></div>`;
  if(!opts.sinProductos&&(RC.abierto(c)||c.productos)){
    const tiene=c.productos&&!c.productos.error&&c.productos.v===2;
    h+=`<div id="arts_${c._id}" style="background:#F8FAFC;border-radius:8px;padding:5px 9px;margin:6px 0">${
      tiene?RC.htmlProductos(c.productos,{max:8,perdido:c.perdido})
      :c.productos&&c.productos.error?RC.htmlProductos(c.productos,{reintentar:`verProductos('${c._id}')`})
      :`<a href="#" onclick="verProductos('${c._id}');return false" style="font-size:12.5px;font-weight:700;color:#2563EB">📦 Ver qué ha dejado de comprar</a>`}</div>`;
  }
  if(RC.abierto(c)){
    h+= sinPlan ? (c.estado==="propuesta_archivo"
        ? `<div class="q"><b>Pide archivarlo:</b> ${esc(c.archivoMotivo||"")} — ${esc(c.archivoNota||"")}</div>`
        : `<div class="q falta">Sin diagnosticar todavía${c.diagnosticoLimite?` · pedido por ${esc(c.diagnosticoPedidoPor||"")} para el ${fch(c.diagnosticoLimite)}${c.diagnosticoLimite<new Date().toISOString()?" · ⏰ fuera de plazo":""}`:""}</div>
          ${formDiagnostico(c)}
          ${ES_JEFE&&conAcciones?`<button class="btn gris" style="margin-top:6px" onclick="pedirDiag(['${c._id}'])">📨 Pedir diagnóstico en 48 h</button>`:""}`)
      : `<div class="q"><b>Causa:</b> ${esc(c.causa)}${c.causaNota?" — "+esc(c.causaNota):""}</div>
         <div class="q"><b>Plan:</b> ${esc(c.accion)}${c.margenOferta!=null&&c.margenOferta!==""?" ("+esc(c.margenOferta)+" % margen)":""}${c.accionNota?" — "+esc(c.accionNota):""}
           · <b>${eur(c.eurosObjetivo)}</b> antes del ${fch(c.fechaObjetivo)}${
           c.fechaObjetivo&&c.fechaObjetivo<new Date().toISOString().slice(0,10)?' <span class="falta">· plazo vencido</span>':""}</div>`;
    if(RC.tienePlan(c)){
      h+= u ? `<div class="q"><b>¿Qué hiciste?</b> ${esc(u.hecho)}</div>
               <div class="q"><b>¿Qué dijo el cliente?</b> ${esc(u.respuesta)}</div>
               <div class="q"><b>¿Qué harás?</b> ${esc(u.siguiente)}</div>`
            : diagEstaSemana(c)?`<div class="q" style="color:var(--green)">Diagnosticado esta semana</div>`
            : `<div class="q falta">Sin avance esta semana</div>`;
    }
  }
  if(c.instruccion&&RC.abierto(c)) h+=`<div class="q" style="background:var(--blueL);border-radius:8px;padding:6px 9px;margin-top:5px">📌 <b>Instrucción</b> de ${esc(c.instruccionPor||"")} (${fch(c.instruccionEn)}): ${esc(c.instruccion)}
    <span class="muted">${c.instruccionLeida===true?"· ✓ recibida":"· sin confirmar"}</span></div>`;
  if(c.historial&&c.historial.length) h+=`<details style="margin-top:5px"><summary class="muted">Historial (${c.historial.length})</summary>
    ${c.historial.slice().reverse().map(x=>`<div class="q muted">S${x.sem} · ${esc(x.por||"")}: ${esc(x.sistema||[x.hecho,x.respuesta,x.siguiente&&("→ "+x.siguiente)].filter(Boolean).join(" · "))}</div>`).join("")}</details>`;
  if(conAcciones&&ES_JEFE&&RC.abierto(c)){
    h+=`<div style="display:flex;gap:6px;margin-top:7px"><input id="nt_${c._id}" placeholder="Instrucción para el comercial (le llega por correo ahora)">
      <button class="btn gris" onclick="anotar('${c._id}')">Enviar</button></div>`;
    if(c.estado!=="propuesta_archivo"){
      // (oct 2026) Tres salidas claras: dormir 60 días, bloquear (no vuelve) o archivar por otro motivo
      const mots=RC.motivosPara(ES_CEO,ES_JEFE,c), otros=RC.MOTIVOS_ARCHIVO.filter(m=>!RC.esPausa(m)&&!RC.esBloqueo(m));
      const md=(SAL_MODO[c._id]||""), q="'"+c._id+"'";
      const bt=(k,t,col)=>`<button type="button" class="btn gris" style="border:1.5px solid ${col};${md===k?`background:${col};color:#fff`:`color:${col}`}" onclick="salModo(${q},'${k}')">${t}</button>`;
      h+=`<div style="margin-top:8px;background:#F8FAFC;border-radius:10px;padding:9px 10px">
        <div class="muted" style="font-weight:700;margin-bottom:6px">¿Qué hacemos con este cliente?</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${bt("dormir","😴 Dormir 60 días","#7C3AED")}${bt("bloquear","⛔ Bloquear","#DC2626")}${bt("archivar","🗄 Dejar de insistir","#64748B")}</div>
        ${md?`<div style="display:grid;gap:6px;margin-top:8px">
          ${md==="dormir"?`<input type="hidden" id="am_${c._id}" value="${esc(RC.MOT_PAUSA)}"><div class="muted">Desaparece del parte, el comité y los informes y <b>vuelve solo dentro de ${RC.DIAS_PAUSA} días</b> (está enfadado, temporada baja, cambio de compras…).</div>`
          :md==="bloquear"?`<select id="am_${c._id}"><option value="${esc(RC.MOT_BLOQ_CIERRE)}">⛔ Ha cerrado</option><option value="${esc(RC.MOT_BLOQ_IMPAGO)}">⛔ No paga</option></select><div class="muted"><b>No vuelve a aparecer</b> en recuperación.</div>`
          :`<select id="am_${c._id}">${otros.map(m=>`<option value="${esc(m)}">${esc(m)}${mots.includes(m)?"":" · lo decide el CEO"}</option>`).join("")}</select>
            <div class="muted">${ES_CEO?"Se archiva y deja de salir en el parte, el comité y los informes.":"Es de "+(RC.num(c.perdido)<RC.UMBRAL.nivel2?"menos de "+eur(RC.UMBRAL.nivel2)+": lo puedes archivar tú.":eur(RC.UMBRAL.nivel2)+" o más: lo archiva el CEO, salvo que el dato esté mal.")}</div>`}
          <textarea id="an_${c._id}" placeholder="Por qué (obligatorio)"></textarea>
          <button class="btn" onclick="archivarDirecto('${c._id}')">${md==="dormir"?"😴 Dormir 60 días":md==="bloquear"?"⛔ Bloquear cliente":"Archivar o enviar al CEO"}</button></div>`:""}
      </div>`;
    }
  }
  return h+"</div>";
}
function tiles(l){
  const r=RC.resumen(l);
  return `<div class="tiles">
    <div class="tile"><span>En riesgo</span><b style="color:var(--red)">${eur(r.enRiesgo)}</b></div>
    <div class="tile"><span>Casos abiertos</span><b>${r.abiertos}</b></div>
    <div class="tile"><span>Sin plan</span><b style="color:${r.sinPlan?"var(--red)":"var(--green)"}">${r.sinPlan}</b></div>
    <div class="tile"><span>Parados +14 días</span><b style="color:${r.parados?"var(--red)":"var(--green)"}">${r.parados}</b></div>
    <div class="tile"><span>Recuperados</span><b style="color:var(--green)">${r.recuperados} · ${eur(r.recuperadosEur)}</b></div>
    <div class="tile"><span>${ES_JEFE?"Te toca decidir":"Esperan decisión"}</span><b style="color:${(ES_JEFE?porDecidir():r.propuestas)?"var(--amber)":"var(--navy)"}">${ES_JEFE?porDecidir():r.propuestas}</b></div>
  </div>`;
}
// ── Diagnóstico desde el panel (sin esperar al parte) ──
function formDiagnostico(c,abierto,titulo){
  const id=c._id;
  const sel=(k,ops,ph)=>`<select id="dg_${k}_${id}"><option value="">${ph}</option>${ops.map(o=>`<option${c[k]===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
  const v=(k)=>esc(c[k]??"");
  return `<details style="margin-top:6px"${(abierto||!ES_JEFE)?" open":""}><summary style="font-weight:700;color:var(--blue);cursor:pointer">${titulo||"✍️ Diagnosticar ahora"}</summary>
    <div style="display:grid;gap:6px;margin-top:6px">
      ${sel("causa",RC.CAUSAS,"¿Por qué cae?")}
      <textarea id="dg_causaNota_${id}" placeholder="Qué te ha dicho, a quién compra ahora…">${v("causaNota")}</textarea>
      ${sel("accion",RC.ACCIONES,"¿Qué vas a hacer?")}
      <input id="dg_margenOferta_${id}" type="number" step="0.5" value="${v("margenOferta")}" placeholder="Margen de la oferta % (solo si es oferta de vuelta)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <label class="muted">Fecha objetivo<input id="dg_fechaObjetivo_${id}" type="date" value="${v("fechaObjetivo")}"></label>
        <label class="muted">€ a recuperar<input id="dg_eurosObjetivo_${id}" type="number" min="0" step="100" value="${num(c.eurosObjetivo)||""}" placeholder="${Math.round(num(c.perdido)/2)}"></label>
      </div>
      <button class="btn ok" onclick="guardarDiag('${id}')">Guardar diagnóstico</button>
    </div></details>`;
}
async function guardarDiag(id){
  const c=CASOS.find(x=>x._id===id); if(!c) return;
  const v=(k)=>(document.getElementById(`dg_${k}_${id}`)?.value||"").trim();
  const r={causa:v("causa"),causaNota:v("causaNota"),accion:v("accion"),margenOferta:v("margenOferta"),
    fechaObjetivo:v("fechaObjetivo"),eurosObjetivo:v("eurosObjetivo")};
  if(!r.causa||!r.accion||!r.fechaObjetivo||!(Number(r.eurosObjetivo)>0)){ alert("Falta la causa, la acción, la fecha o los euros a recuperar."); return; }
  if(r.accion==="Oferta de vuelta"&&r.margenOferta===""){ alert("Pon el margen de la oferta."); return; }
  try{ await RC.guardarDiagnostico(c,r,ES_JEFE?QUIEN:(NOMBRE||AGENTE)); pintar(); }
  catch(e){ alert("No se ha guardado: "+e.message); }
}
async function pedirDiag(ids){
  const casos=ids.map(id=>CASOS.find(x=>x._id===id)).filter(Boolean);
  if(!casos.length) return;
  const g={}; casos.forEach(c=>(g[ARR(c.agente)]=g[ARR(c.agente)]||[]).push(c));
  const avisos=[];
  for(const [a,l] of Object.entries(g)){
    const d=await RC.pedirDiagnosticos(a,l,QUIEN,ES_CEO?"ceo":AGENTE,48);
    avisos.push(`${nomAg(a)}: ${l.length} caso${l.length===1?"":"s"} · ${RC.textoAviso(d)}`);
  }
  pintar(); alert(avisos.join("\n"));
}

// ══ Ficha del cliente: pantalla solo para él ══════════════════════════
let FICHA=null, _scrollLista=0;
const FICHA_ART={tab:"caen",abierto:null};
let INCS=null, FORM_INC=null;
async function cargarIncs(){ if(INCS) return; INCS=[]; try{ const [l]=await Promise.all([RC.leerProfundo("incidencias"),RC.cargarDeptos?RC.cargarDeptos():null]); INCS=l; }catch(e){} if(FICHA||TAB==="acciones") pintar(); }
async function cargarOfs(){ if(OFS) return; OFS=[]; try{ OFS=await RC.leerProfundo("ofertas"); }catch(e){} if(FICHA||TAB==="acciones") pintar(); }
function abrirFicha(id){ cargarOfs(); cargarIncs(); FORM_INC=null; _scrollLista=window.scrollY||0; FICHA=id; FICHA_ART.tab="caen"; FICHA_ART.abierto=null; FICHA_ART.acc=null; FICHA_ART.fams=null; pintar(); window.scrollTo(0,0);
  const c=CASOS.find(x=>x._id===id); if(c){ cargarTodosArt(c); cargarProg(c); } }
function cerrarFicha(){
  if(EMBED&&FICHA_URL){ try{ parent.postMessage({type:"RC_CERRAR"},"*"); }catch(e){} return; }
  FICHA=null; pintar(); window.scrollTo(0,_scrollLista); }
async function cargarTodosArt(c,forzar){
  if(c._arts&&!forzar) return;
  c._arts="cargando"; if(FICHA===c._id) pintar();
  try{
    const r=await fetch(`/api/pbi-sync?articulosCliente=${encodeURIComponent(c.cliente)}&top=30`);
    const j=await r.json();
    if(j.ok===false) throw new Error(j.error||"sin respuesta");
    const m=(a)=>({art:a.articulo,desc:a.descripcion||a.articulo,cal:a.calibre||"",metros:a.metros||"",
      act:Math.round(num(a.ventasAct)),ant:Math.round(num(a.ventasAnt)),dif:Math.round(num(a.diferencia)),
      uni:num(a.unidades),uniAnt:num(a.unidadesAnt),ult:a.ultimaCompra||null});
    c._arts={caen:(j.articulos||[]).map(m),suben:(j.suben||[]).map(m)};
    // Para que los formularios de precio enseñen lo último que pagó
    RC._ult=RC._ult||{}; [...c._arts.caen,...c._arts.suben].forEach(a=>{ if(a.ult) RC._ult[ARR(c.cliente)+"|"+ARR(a.art)]=a.ult; });
  }catch(e){ c._arts={error:e.message}; }
  if(FICHA===c._id) pintar();
}
async function cargarProg(c){
  if(c._prog) return;
  c._prog="cargando";
  try{ const r=await fetch(`/api/pbi-sync?progresionCliente=${encodeURIComponent(c.cliente)}`); const j=await r.json();
    c._prog=j.ok?j:{error:j.error||"sin respuesta"}; }catch(e){ c._prog={error:e.message}; }
  if(FICHA===c._id) pintar();
}
function vistaFicha(c){
  const nv=RC.nivelDe(c); const [et,ec]=estadoCorto(c);
  const ant=num(c.ventasAnt), act=num(c.ventasAct);
  const pct=ant?Math.round((act-ant)/ant*100):null;
  const tile=(t,v,col,sub)=>`<div class="tile"><span>${t}</span><b style="color:${col||"var(--navy)"}">${v}</b>${sub?`<div class="muted" style="font-size:11px">${sub}</div>`:""}</div>`;
  // Mes a mes
  let meses="";
  const P=c._prog;
  if(P==="cargando"||!P) meses=`<p class="muted">Cargando mes a mes…</p>`;
  else if(P.error) meses=`<p class="muted">No se ha podido cargar el mes a mes (${esc(P.error)}).</p>`;
  else{
    const ms=(P.meses||[]).filter(m=>!m.futuro);
    if(!ms.length){ meses=`<p class="muted">Sin datos mensuales de este cliente.</p>`; }
    else {
    const mx=Math.max(1,...ms.map(m=>Math.max(num(m.actual),num(m.anterior))));
    meses=`<div style="display:flex;gap:4px;align-items:flex-end;height:120px;padding-top:6px;overflow-x:auto">
      ${ms.map(m=>`<div style="flex:1;min-width:24px;display:flex;flex-direction:column;align-items:center;gap:3px">
        <div style="display:flex;gap:2px;align-items:flex-end;height:90px">
          <div title="${P.anoAnterior}: ${eur(m.anterior)}" style="width:9px;height:${Math.max(1,Math.round(num(m.anterior)/mx*90))}px;background:#CBD5E1;border-radius:2px"></div>
          <div title="${P.anoActual}: ${eur(m.actual)}" style="width:9px;height:${Math.max(1,Math.round(Math.max(0,num(m.actual))/mx*90))}px;background:${num(m.actual)<num(m.anterior)*0.7?"var(--red)":"var(--green)"};border-radius:2px;${m.enCurso?"opacity:.5":""}"></div>
        </div>
        <div style="font-size:10px;color:var(--muted)">${esc(String(m.mes).slice(0,3))}${m.enCurso?"*":""}</div></div>`).join("")}
    </div>
    <div class="muted" style="font-size:11px;margin-top:4px">Gris: ${P.anoAnterior||"año pasado"}. Color: ${P.anoActual||"este año"} (rojo si cae más del 30 %). * mes en curso.${P.caeDesde?` <b style="color:var(--red)">Cae desde ${esc(P.caeDesde)}.</b>`:""}</div>`;
    }
  }
  // Artículos
  const A=c._arts;
  let arts="";
  if(A==="cargando"||!A) arts=`<p class="muted">Buscando todos los artículos… (la primera vez tarda unos segundos)</p>`;
  else if(A.error) arts=`<p class="muted">No se han podido consultar (${esc(A.error)}). <a href="#" onclick="cargarTodosArt(CASOS.find(x=>x._id==='${c._id}'),true);return false">Reintentar</a></p>`;
  else{
    const l=FICHA_ART.tab==="caen"?A.caen:A.suben;
    const sumC=A.caen.reduce((t,a)=>t-a.dif,0), sumS=A.suben.reduce((t,a)=>t+a.dif,0);
    // Familias: lo que va antes del primer espacio (MAD.CERDO, MAD.BUEY…)
    const fam=(a)=>String(a.desc||a.art||"").trim().split(/\s+/)[0]||"Otros";
    const grupos={}; l.forEach((a,i)=>{ const k=fam(a); (grupos[k]=grupos[k]||[]).push(Object.assign({_i:i},a)); });
    const orden=Object.entries(grupos).sort((x,y)=>Math.abs(y[1].reduce((t,a)=>t+a.dif,0))-Math.abs(x[1].reduce((t,a)=>t+a.dif,0)));
    if(!FICHA_ART.fams) FICHA_ART.fams=new Set(orden.length?[orden[0][0]]:[]);
    // (oct 2026) Abierto desde el parte o el comité con &art=: directo a ese artículo
    if(ART_URL&&!FICHA_ART._foco){ const ix=l.findIndex(a=>ARR(a.art)===ARR(ART_URL)||ARR(a.desc)===ARR(ART_URL));
      if(ix>=0){ FICHA_ART._foco=true; FICHA_ART.fams.add(fam(l[ix])); FICHA_ART._focoI=ix; setTimeout(()=>{ const el=document.getElementById("art_"+ix); if(el) el.scrollIntoView({block:"center"}); },120); } }
    const estsC=RC.estrategiasDeCaso(ESTS,c), ofsC=(OFS||[]).filter(o=>o.casoId===c._id||ARR(o.clienteId)===ARR(c.cliente));
    const marcas=(a)=>{
      const k=ARR(a.art), n=ARR(a.desc);
      // Primero por código; por nombre solo si la línea no trae código
      const casa=(cod,nom)=>cod?ARR(cod)===k:(k&&ARR(nom).split(/[\s—·]+/).includes(k))||(!k&&ARR(nom)===n);
      const es=estsC.filter(e=>(e.ofertas||[]).some(o=>casa(o.codigo,o.nombre)));
      const alts=ofsC.filter(o=>o.alternativaDe&&casa(o.alternativaDe.codigo,o.alternativaDe.nombre));
      const of=ofsC.filter(o=>!o.alternativaDe&&(o.lineas||[]).some(x=>casa(x.codigo,x.producto)));
      return es.map(e=>{ const [t,co,bg]=RC.ESTADO_EST[e.estado]||["📋","#475569","#F1F5F9"];
          return `<span class="pill" style="background:${bg};color:${co};border:1px solid ${co}33">💶 ${t}</span>`; }).join(" ")
        +(of.length?` <span class="pill" style="background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE">📨 ${of.length} oferta${of.length===1?"":"s"}</span>`:"")
        +alts.map(o=>{ const l=(o.lineas||[])[0]||{}; return ` <span class="pill" style="background:#FFF7ED;color:#C2410C;border:1px solid #FED7AA">🔄 ${esc(l.producto||"")} ${esc(l.precio)} ${esc(l.unidad||"")}</span>`; }).join("");
    };
    const filaArt=(a)=>{
      const i=a._i, w=a.ant?Math.max(0,Math.min(100,Math.round(a.act/a.ant*100))):100;
      const acc=FICHA_ART.acc&&FICHA_ART.acc.i===i?FICHA_ART.acc.tipo:null;
      const m=marcas(a);
      return `<div id="art_${i}" style="border-top:1px solid #F1F5F9;padding:9px 0${FICHA_ART._focoI===i?";background:#FFFBEB;outline:2px solid #F59E0B;border-radius:8px;padding:9px 8px":""}">
        <div class="row"><div style="min-width:0"><b style="font-size:13px">${esc(a.desc)}</b>
          <div class="muted" style="font-size:11.5px">${esc(a.art)}${a.cal?" · calibre "+esc(a.cal):""}${a.metros?" · "+esc(a.metros)+" m":""}</div></div>
          <div style="text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12.5px">
            ${eur(a.ant)} → <b style="color:${a.act<0||a.dif<0?"var(--red)":"var(--green)"}">${eur(a.act)}</b>${a.act<0?' <span class="muted">(abono)</span>':""}
            <div style="font-weight:800;color:${a.dif<0?"var(--red)":"var(--green)"}">${a.dif>0?"+":""}${eur(a.dif)}</div></div></div>
        ${a.ult&&a.ult.fecha?`<div style="font-size:12px;color:#334155;margin-top:3px">🧾 Última compra <b>${fch(a.ult.fecha)}</b>${(()=>{ const d=Math.floor((Date.now()-Date.parse(a.ult.fecha))/86400000); return d>=0?` <span class="muted">(hace ${d>60?Math.round(d/30)+" meses":d+" días"})</span>`:""; })()}
          · <b>${num(a.ult.unidades).toLocaleString("es-ES")} ud</b>${a.ult.precio?` a <b>${num(a.ult.precio).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})} €/ud</b>`:""}
          ${a.uniAnt||a.uni?`<span class="muted"> · unidades ${num(a.uniAnt).toLocaleString("es-ES")} → ${num(a.uni).toLocaleString("es-ES")}</span>`:""}</div>`
          :(a.uni||a.uniAnt?`<div class="muted" style="font-size:12px;margin-top:3px">Unidades ${num(a.uniAnt).toLocaleString("es-ES")} → ${num(a.uni).toLocaleString("es-ES")}</div>`:"")}
        ${FICHA_ART.tab==="caen"?`<div class="barra" style="background:#E2E8F0"><i style="width:${w}%;background:var(--red)"></i></div>`:""}
        ${m?`<div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">${m}</div>`:""}
        ${RC.abierto(c)&&FICHA_ART.tab==="caen"?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">
          <button class="chipA${acc==="est"?" on":""}" style="--c:#6D28D9" onclick="accArt(${i},'est')">💶 ${NIVEL==="comercial"?"Pedir estrategia":"Estrategia"}</button>
          <button class="chipA${acc==="of"?" on":""}" style="--c:#1D4ED8" onclick="accArt(${i},'of')">📨 Oferta</button>
          <button class="chipA${acc==="alt"?" on":""}" style="--c:#C2410C" onclick="accArt(${i},'alt')">🔄 Alternativa</button>
          <button class="chipA${acc==="inc"?" on":""}" style="--c:#0369A1" onclick="accArt(${i},'inc')">🧩 Otro depto</button>
          ${ES_JEFE?`<button class="chipA${acc==="plan"?" on":""}" style="--c:#0F766E" onclick="accArt(${i},'plan')">📌 Pedir plan</button>`:""}
        </div>`:""}
        ${acc?formArt(c,a,acc):""}
      </div>`;
    };
    arts=`<div class="tabs" style="margin-bottom:6px">
        <button class="${FICHA_ART.tab==="caen"?"on":""}" onclick="FICHA_ART.tab='caen';FICHA_ART.acc=null;FICHA_ART.fams=null;pintar()">Caen (${A.caen.length}) · −${eur(sumC)}</button>
        <button class="${FICHA_ART.tab==="suben"?"on":""}" onclick="FICHA_ART.tab='suben';FICHA_ART.acc=null;FICHA_ART.fams=null;pintar()">Crecen (${A.suben.length}) · +${eur(sumS)}</button></div>
      ${!l.length?`<p class="muted">Ninguno.</p>`:orden.map(([k,g])=>{
        const ab=FICHA_ART.fams.has(k), tot=g.reduce((t,a)=>t+a.dif,0);
        return `<div style="border:1px solid var(--border);border-radius:12px;margin:8px 0;overflow:hidden">
          <div onclick="togFam('${esc(k)}')" style="display:flex;gap:8px;align-items:center;padding:10px 12px;cursor:pointer;background:#F8FAFC">
            <b style="flex:1;font-size:14px">${esc(k)}</b><span class="muted">${g.length} artículo${g.length===1?"":"s"}</span>
            <b style="color:${tot<0?"var(--red)":"var(--green)"};white-space:nowrap">${tot>0?"+":""}${eur(tot)}</b>
            <span class="muted" style="width:14px;text-align:center">${ab?"▾":"›"}</span></div>
          ${ab?`<div style="padding:0 12px 4px">${g.map(filaArt).join("")}</div>`:""}
        </div>`; }).join("")}`;
  }
  return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <button class="btn gris" onclick="cerrarFicha()">${EMBED&&FICHA_URL?"✕ Cerrar":"← Volver a la lista"}</button></div>
    <div class="card">
      <div class="row"><div style="min-width:0"><div style="font-size:19px;font-weight:800;line-height:1.2">${esc(c.nombre)}</div>
        <div class="muted">${esc(nomAg(c.agente))}${c.equipo?" · "+esc(c.equipo):""}${c.poblacion?" · "+esc(c.poblacion):""} · código ${esc(c.cliente)}</div></div>
        <div class="neg" style="font-size:18px">−${eur(c.perdido)}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${pill(nv.nivel)}
        <span class="pill" style="background:${ec}">${et}</span>
        ${nv.motivo&&nv.nivel>RC.nivelBase(c.perdido)?`<span class="muted">⬆ ${esc(nv.motivo)}</span>`:""}</div>
      <div class="muted" style="margin-top:6px">${esc(c.motivo||"")}</div>
    </div>
    <div class="tiles">
      ${tile("Este año",eur(act),act<ant?"var(--red)":"var(--green)")}
      ${tile("Año pasado",eur(ant),null,"mismo periodo")}
      ${tile("Variación",pct!=null?pct+" %":"—","var(--red)")}
    </div>
    <div class="card"><b>Mes a mes</b>${meses}</div>
    <div class="card"><b>Artículos</b><div class="muted" style="font-size:12px;margin-bottom:6px">Todos los que se mueven frente al año pasado, de mayor a menor.</div>${arts}</div>
    <div class="card"><b>📨 Ofertas y 💶 estrategias de precio</b>${bloqueEstrategias(c)}</div>
    <div class="card"><b>🧩 Otros departamentos</b>${bloqueInc(c)}</div>
    <div class="card"><b>Diagnóstico y plan</b>
      ${RC.tienePlan(c)&&RC.abierto(c)?formDiagnostico(c,false,"✏️ Cambiar el diagnóstico"):""}
      ${lineaCaso(c,true,{sinCabecera:true,sinProductos:true})}</div>`;
}
// ── Acciones sobre un artículo, justo debajo de él ──
function togFam(k){ if(!FICHA_ART.fams) FICHA_ART.fams=new Set(); FICHA_ART.fams.has(k)?FICHA_ART.fams.delete(k):FICHA_ART.fams.add(k); pintar(); }
function accArt(i,tipo){ FICHA_ART.acc=(FICHA_ART.acc&&FICHA_ART.acc.i===i&&FICHA_ART.acc.tipo===tipo)?null:{i,tipo}; pintar(); }
function formArt(c,a,tipo){
  if(tipo==="plan") return `<div style="display:grid;gap:6px;margin-top:8px;background:#F0FDFA;border:1px solid #99F6E4;border-radius:12px;padding:10px">
      <textarea id="pa_txt">${esc(`Plan para recuperar ${a.desc}${a.cal?" (calibre "+a.cal+")":""}: venía de ${eur(a.ant)} y este año lleva ${eur(a.act)}. Dime qué ha pasado y qué vas a hacer.`)}</textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn ok" onclick="pedirPlanArt('${c._id}')">Enviar al comercial</button>
      <button class="btn gris" onclick="FICHA_ART.acc=null;pintar()">Cancelar</button></div></div>`;
  if(tipo==="inc") return `<div>${RC.formIncidencia("fn",c,a,artsDe(c))}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
      <button class="btn ok" style="background:#0284C7" onclick="enviarInc('${c._id}','fn',${a._i})">Enviar al departamento</button>
      <button class="btn gris" onclick="FICHA_ART.acc=null;pintar()">Cancelar</button></div></div>`;
  if(tipo==="alt") return `<div>${RC.formAlternativa("fx",a,c)}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
      <button class="btn ok" style="background:#EA580C" onclick="enviarAlt('${c._id}',${a._i})">${NIVEL==="comercial"?"Registrar alternativa":"Proponer y avisar"}</button>
      <button class="btn gris" onclick="FICHA_ART.acc=null;pintar()">Cancelar</button></div></div>`;
  const pref="fa";
  const color=tipo==="of"?"#2563EB":"#7C3AED";
  const tit=tipo==="of"?"📨 Oferta al cliente":(NIVEL==="comercial"?"💶 Pedir estrategia de precio a tu jefe":"💶 Estrategia de precio para "+nomAg(c.agente));
  return `<div>${RC.formEstrategia(pref,[a],tit,tipo==="of"?{fondo:"#EFF6FF",borde:"#BFDBFE",fuerte:"#2563EB",titulo:"#1D4ED8"}:null,c)}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
      <button class="btn ok" style="background:${color}" onclick="enviarArt('${c._id}',${a._i},'${tipo}')">${tipo==="of"?"Registrar oferta":NIVEL==="comercial"?"Enviar a mi jefe":"Crear y avisar"}</button>
      <button class="btn gris" onclick="FICHA_ART.acc=null;pintar()">Cancelar</button></div></div>`;
}
async function enviarAlt(id,i){
  const c=CASOS.find(x=>x._id===id); if(!c||!c._arts) return;
  const a=(FICHA_ART.tab==="caen"?c._arts.caen:c._arts.suben)[i];
  const alt=RC.leerAlternativa("fx");
  if(!alt.desc){ alert("Busca y elige el producto alternativo en el catálogo."); return; }
  if(!(alt.precioActual>0)){ alert("Falta la tarifa: este artículo no tiene precio en el catálogo, ponla a mano."); return; }
  if(!(alt.precio>0)){ alert("Pon el precio."); return; }
  try{
    const o=await RC.crearAlternativa(c,{art:a.art,desc:a.desc},alt,YO_EST);
    FICHA_ART.acc=null; RC.olvidarForm("fx");
    if(o._esEstrategia){ o._id=o.id; ESTS.push(o); pintar();
      alert(`Un ${o.dto} % de descuento sobre tarifa supera tu límite del ${o.tope} %: la alternativa se ha creado como estrategia para aprobar.`); return; }
    (OFS=OFS||[]).push(o); pintar();
    alert(NIVEL==="comercial"?"Alternativa registrada como oferta en el CRM.":"Alternativa registrada y avisado el comercial.");
  }catch(x){ alert("No se ha podido guardar: "+x.message); }
}
async function enviarArt(id,i,tipo){
  const c=CASOS.find(x=>x._id===id); if(!c||!c._arts) return;
  const lista=FICHA_ART.tab==="caen"?c._arts.caen:c._arts.suben;
  const a=lista[i];
  const l=RC.leerFormEstrategia("fa",[a]);
  if(!(l.precioActual>0)){ alert("Falta la tarifa: este artículo no tiene precio en el catálogo, ponla a mano."); return; }
  if(!(l.precioOferta>0)){ alert("Pon el precio."); return; }
  try{
    if(tipo==="of"){
      const r=await RC.crearOferta(c,l,l.nota,YO_EST);
      if(r.tipo==="oferta"){ (OFS=OFS||[]).push(r.doc); alert("Oferta registrada en el CRM."); }
      else { r.doc._id=r.doc.id; ESTS.push(r.doc); alert(`Un ${r.dto} % de descuento supera el límite del ${r.tope} %: se ha creado como estrategia para aprobar.`); }
    } else {
      const e=await RC.crearEstrategia(c,l,l.nota,YO_EST); e._id=e.id; ESTS.push(e);
      alert(e.estado==="aprobada"?"Estrategia creada y aprobada. Se le ha avisado al comercial."
        :"Estrategia enviada. La tiene que aprobar "+(e.pendienteDeNombre||"su responsable")+".");
    }
    FICHA_ART.acc=null; RC.olvidarForm("fa"); pintar();
  }catch(x){ alert("No se ha podido guardar: "+x.message); }
}

// ── Estrategias en la ficha ──
let FORM_EST=null;   // {id, idx}
function artsDe(c){ return (c._arts&&c._arts.caen)||(c.productos&&c.productos.caen)||[]; }
function abrirFormEst(id,idx){ FORM_EST={id,idx}; pintar();
  setTimeout(()=>{ const c=CASOS.find(x=>x._id===id), a=idx!=null&&c?artsDe(c)[idx]:null;
    if(a) RC.elegirPorCodigo("fe",a.art,a.desc);
    const f=document.getElementById("fe_box"); if(f) f.scrollIntoView({behavior:"smooth",block:"center"}); },30); }
function botonesEst(e){
  if(!RC.meTocaEst(e,NIVEL,AGENTE)&&!RC.meTocaEst(e,NIVEL,YO_EST.id)) return "";
  const puede=RC.puedeResolverEst(e,NIVEL,AGENTE);
  return (puede?"":`<div class="muted" style="margin-top:6px">Pide un ${RC.dtoEf(e)} % sobre su tarifa: supera tu límite del ${RC.LIM_DTO[NIVEL]} %. Elévala o recházala.</div>`)

let KPIS_SEM=null;
async function cargarKpisSem(){
  if(KPIS_SEM) return; KPIS_SEM={cargando:true};
  try{
    const inf=(await RC.leer("informes",20)).filter(i=>i.kpis&&i.estado!=="borrador"&&i.estado!=="ausente");
    const anio=new Date().getFullYear();
    const deSem=(s)=>inf.filter(i=>Number(i.semana)===s&&(!(i.anio||i.ano)||Number(i.anio||i.ano)===anio));
    let sem=SEM, l=deSem(sem); if(!l.length){ sem=SEM-1; l=deSem(sem); }
    const filas=[], vistos=new Set();
    l.forEach(i=>{ const ag=ARR(i.agente); if(vistos.has(ag)) return; vistos.add(ag);
      const eq=ARR((AG[ag]&&AG[ag].equipo)||i.equipo||"");
      if(RC.esFrancia(eq)) return;
      if(!ES_DIR&&ES_JEFE&&EQUIPO&&!(eq.includes(EQUIPO)||EQUIPO.includes(eq))) return;
      if(!ES_JEFE&&ag!==AGENTE) return;
      filas.push({nombre:nomAg(ag),equipo:ES_DIR?eq:"",k:RC.parseKpis(i)}); });
    KPIS_SEM={sem,filas};
  }catch(e){ KPIS_SEM={sem:SEM,filas:[]}; }
  if(TAB==="comite") pintar();
}

const _colaProd=[]; let _activos=0;
function verProductos(id){

  const el=document.getElementById("arts_"+id);
  if(el) el.innerHTML=RC.htmlProductos(null,{cargando:true});

function _siguienteProd(){
  while(_activos<3&&_colaProd.length){
    const id=_colaProd.shift(); const c=CASOS.find(x=>x._id===id); if(!c) continue;
    _activos++; c._cargando=true;

    }).finally(()=>{ c._cargando=false; _activos--; _siguienteProd(); });
  }
}

async function archivarDirecto(id){
  const c=CASOS.find(x=>x._id===id); if(!c) return;
  const m=document.getElementById("am_"+id)?.value||"";
  const t=(document.getElementById("an_"+id)?.value||"").trim();
  if(t.length<5){ alert("Escribe por qué se deja de insistir: queda en el historial del cliente."); return; }
  const ahora=new Date().toISOString();
  const directo=RC.puedeArchivar(ES_CEO,ES_JEFE,c,m);
  const campos=directo
    ? {...RC.camposAprobar(m,ahora),archivoMotivo:m,archivoNota:t,archivoDecision:"aprobado",archivadoPor:QUIEN,archivadoEn:ahora}
    : {estado:"propuesta_archivo",archivoMotivo:m,archivoNota:t,archivoPropuestoPor:QUIEN,archivoPropuestoEn:ahora,
       archivoDecision:"",archivoRespuesta:""};
  campos.historial=(c.historial||[]).concat([{sem:SEM,fecha:ahora,por:QUIEN,
    sistema:directo?`${QUIEN} ${RC.esPausa(m)?"lo duerme "+RC.DIAS_PAUSA+" días":RC.esBloqueo(m)?"lo bloquea":"lo archiva"}: ${m} · ${t}`:`${QUIEN} pide al CEO archivarlo: ${m} · ${t}`}]);
  try{ await RC.guardar(id,campos); Object.assign(c,campos); pintar(); }
  catch(e){ alert("No se ha guardado: "+e.message); }
}
async function decidirArchivo(id,ok){
  const c=CASOS.find(x=>x._id===id); if(!c) return;
  const t=(document.getElementById("rs_"+id)?.value||"").trim();
  if(!ok&&t.length<5){ alert("Escribe por qué hay que seguir insistiendo: el comercial lo verá en su parte."); return; }
  const ahora=new Date().toISOString();
  const campos=ok
    ? {...RC.camposAprobar(c.archivoMotivo,ahora),archivoDecision:"aprobado",archivoRespuesta:t,archivadoPor:QUIEN,archivadoEn:ahora}
    : {estado:RC.tienePlan(c)?"diagnosticado":"abierto",archivoDecision:"rechazado",archivoRespuesta:t,
       ultimaAccion:c.ultimaAccion||""};
  if(!RC.puedeArchivar(ES_CEO,ES_JEFE,c,c.archivoMotivo)){ alert("Este lo decide el CEO."); return; }
  campos.historial=(c.historial||[]).concat([{sem:SEM,fecha:ahora,por:QUIEN,
    sistema:ok?`${QUIEN} aprueba archivarlo${t?": "+t:""}`:`${QUIEN} no aprueba archivarlo: ${t}`}]);
  try{ await RC.guardar(id,campos); Object.assign(c,campos); pintar(); }
  catch(e){ alert("No se ha guardado: "+e.message); }
}
async function decidirMargen(id,ok){
  const c=CASOS.find(x=>x._id===id); if(!c) return;
  const t=(document.getElementById("rm_"+id)?.value||"").trim();
  const ahora=new Date().toISOString();
  const campos={necesitaAprobacion:"",margenAprobado:ok?"si":"no",margenRespuesta:t,margenDecididoPor:NOMBRE,
    historial:(c.historial||[]).concat([{sem:SEM,fecha:ahora,por:NOMBRE,
      sistema:(ok?"CEO aprueba ":"CEO no aprueba ")+`margen del ${c.margenOferta} %${t?": "+t:""}`}])};
  try{ await RC.guardar(id,campos); Object.assign(c,campos); pintar(); }
  catch(e){ alert("No se ha guardado: "+e.message); }
}
