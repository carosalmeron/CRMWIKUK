<div class="w"><div id="alcance"></div><div id="filtro"></div><input class="bus" id="bus" placeholder="🔎 Buscar cliente, nº de pedido, ref. cliente o artículo" oninput="pintar()"><div id="lista"><div class="carg">Cargando pedidos de SAP…</div></div></div>
<script>/* pase SAP: lo da el portal al entrar */
(function(){
  // Pase de SAP: lo da el portal al entrar (usuario y contraseña del portal, una vez cada 30 días).
  // Aquí no se pide ninguna contraseña: si falta el pase, se explica y se ofrece salir y volver a entrar.
  var K='sap_pedido_key';
  function galleta(){ var m=/(?:^|;\s*)sap_pase=([^;]+)/.exec(document.cookie||'')||/(?:^|;\s*)cs_pase=([^;]+)/.exec(document.cookie||''); return m?decodeURIComponent(m[1]):''; }
  function get(){ var t=''; try{ t=localStorage.getItem(K)||''; }catch(e){} return exp(t)>Date.now()?t:galleta(); }
  function exp(t){ var m=/^crm\.([A-Za-z0-9_-]+)\./.exec(t||''); if(!m) return 0; try{ return JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))).exp||0; }catch(e){ return 0; } }
  var abierto=false;
  function ventana(motivo){
    if(abierto) return; abierto=true;
    var d=document.createElement('div');
    d.setAttribute('style','position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif');
    d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:380px;width:100%;padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.3)">'
      +'<div style="font-weight:800;font-size:18px">🔐 Falta el permiso de SAP</div>'
      +'<div style="font-size:14px;color:#334155;margin:8px 0 14px;line-height:1.45">'+(motivo||'Este aparato todavía no tiene permiso para SAP.')+'<br><br>Sal del portal y vuelve a entrar con tu usuario: el permiso se activa solo y dura 30 días.'+(function(){ var e=''; try{ e=localStorage.getItem('sap_pase_error')||''; }catch(x){} return e?'<div style="margin-top:10px;background:#FEE2E2;color:#991B1B;border-radius:8px;padding:8px;font-weight:700">Último intento: '+String(e).replace(/[<>&]/g,'')+'</div>':''; })()+'</div>'
      +'<button id="sp_out" style="width:100%;font-size:17px;font-weight:800;padding:12px;border:0;border-radius:10px;background:#0F172A;color:#fff">Salir y volver a entrar</button>'
      +'<button id="sp_x" style="width:100%;font-size:15px;font-weight:700;padding:10px;border:0;background:transparent;color:#64748B;margin-top:6px">Ahora no</button></div>';
    document.body.appendChild(d);
    document.getElementById('sp_x').onclick=function(){ d.remove(); abierto=false; };
    document.getElementById('sp_out').onclick=function(){
      try{ localStorage.removeItem(K); localStorage.removeItem('gc_portal_user'); }catch(e){}
      try{ if(window.top&&window.top.doLogout){ window.top.doLogout(); return; } }catch(e){}
      try{ window.top.location.href='/'; }catch(e){ location.href='/'; }
    };
  }
  // Intento automático: con la sesión del portal abierta en ESTE navegador (gc_portal_user), se lee la ficha del usuario
  // y se pide el pase sin preguntar nada. Así funciona en Safari, Chrome o cualquier navegador donde se haya entrado al portal.
  async function auto(){
    var pu=null; try{ pu=JSON.parse(localStorage.getItem('gc_portal_user')||'null'); if(!pu||!pu.id){ var sid=localStorage.getItem('sap_portal_id')||decodeURIComponent((/(?:^|;\s*)sap_portal_id=([^;]+)/.exec(document.cookie)||[])[1]||''); if(sid) pu={id:sid}; } }catch(e){}
    if(!pu||!pu.id) return 'no hay sesión del portal en este navegador';
    var h=pu.passHash||'';
    if(!h){ try{ var FB='https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents';
      for(var col of ['portal_users','usuarios']){ var r=await fetch(FB+'/'+col+'/'+encodeURIComponent(pu.id)); if(!r.ok) continue; var j=await r.json(); var f=(j.fields||{}).passHash; if(f&&f.stringValue){ h=f.stringValue; break; } } }catch(e){} }
    if(!h) return 'no encuentro la ficha del usuario '+pu.id;
    try{ var r2=await fetch('/api/sap-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:pu.id,passHash:h})});
      var j2=await r2.json().catch(function(){ return {ok:false,error:'HTTP '+r2.status}; });
      if(j2&&j2.ok&&j2.token){ try{ localStorage.setItem(K,j2.token); localStorage.removeItem('sap_pase_error'); }catch(e){} return ''; }
      return (j2&&j2.error)||'sin respuesta'; }catch(e){ return 'no se llega al servidor: '+e.message; } }
  var intentado=false;
  async function resolver(motivo){
    if(!intentado){ intentado=true; var err=await auto(); if(!err){ location.reload(); return; } try{ localStorage.setItem('sap_pase_error',err); }catch(e){} }
    ventana(motivo);
  }
  window.pedirPaseSap=resolver;
  var f0=window.fetch;
  window.fetch=function(u,o){ return f0.apply(this,arguments).then(function(r){ try{ if(r.status===401&&/\/api\/sap-(pedido|factura|produccion|traslado|planificacion|cs)/.test(String(u&&u.url||u))) setTimeout(function(){ resolver(exp(get())?'El permiso guardado ya no vale.':''); },0); }catch(e){} return r; }); };
  if(!(exp(get())>Date.now())){ if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ resolver(); }); else resolver(); }
})();
</script>
<script>
const API="/api/sap-cs";
const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
let DB=LS("cs_db_real")||"U_CARO_00", TAB=LS("cs_tab")||"nuevo", PED=[], TIPOS={}, ABIERTO={}, DIA="hoy", FDIA="", VER="", BQ="", PUEDE=null, SDIA="hoy", SFDIA="";
const AYER=new Date(Date.now()-864e5).toISOString().slice(0,10), HACE7=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
const esc=(t)=>String(t??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fx=(d)=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7)+"/"+String(d).slice(0,4):"—";
const n=(v)=>(Math.round((Number(v)||0)*100)/100).toLocaleString("es-ES");
const eur=(v)=>(Number(v)||0).toLocaleString("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const HOY=new Date().toISOString().slice(0,10);
const dias=(d)=>d?Math.round((new Date(HOY)-new Date(String(d).slice(0,10)))/864e5):0;
const hace=(d)=>{ const x=dias(d); return x<=0?"hoy":x===1?"ayer":"hace "+x+" días"; };
const ET={nuevo:["🆕","Nuevos","Para validar"],bloqueado:["🛑","Invalidados","Riesgo / precio"],esperando:["⏳","Esperando","Producción / compras"],reconfirmar:["🔁","Reconfirmar","Ya contestaron"],validado:["📦","Almacén","Confirmados"],avisos:["⚠️","Avisos","Pueden llegar tarde"],servido:["🚚","Servidos","Ya salieron"],anulado:["❌","Cerrados","Sin entrega"],todos:["📊","Todos","Control"]};
// Fecha de servicio del pedido: la más temprana de sus líneas abiertas (o la del pedido)
const fserv=(p)=>{ const f=p.lineas.map(l=>l.entrega).filter(Boolean).sort()[0]; return f||p.entrega||""; };
const MAN=new Date(Date.now()+864e5).toISOString().slice(0,10);
const ETQ={nuevo:'<span class="ch cg">🆕 Nuevo · por validar</span>',esperando:'<span class="ch ca">⏳ Esperando</span>',reconfirmar:'<span class="ch cz">🔁 Por reconfirmar</span>',validado:'<span class="ch cv">📦 En almacén</span>',servido:'<span class="ch cg">🚚 Servido</span>',anulado:'',bloqueado:''};
function pill(){ const p=document.getElementById("dbPill"); p.textContent=DB==="U_CARO_00"?"SAP REAL":"SAP PRUEBAS"; p.className="pill "+(DB==="U_CARO_00"?"pv":"pp");  let a=document.getElementById("avReal"); if(!a){ a=document.createElement("div"); a.id="avReal"; a.setAttribute("style","margin-top:10px;background:#FEE2E2;color:#991B1B;font-weight:800;font-size:16px;border-radius:12px;padding:8px 12px"); document.querySelector(".top").appendChild(a); } if(typeof PUEDE!=="undefined"&&PUEDE===false){ a.hidden=false; a.style.background="#DBEAFE"; a.style.color="#1E40AF"; a.textContent="👀 Solo consulta: ves el estado de todos los pedidos en SAP. Los cambios los hace Customer Service."; } else { a.style.background="#FEE2E2"; a.style.color="#991B1B"; a.hidden=DB!=="U_CARO_00"; a.textContent="⚠️ Estás en el SAP REAL: lo que valides, mandes o cambies de fecha se guarda de verdad en los pedidos."; } }
window.cambiarDb=()=>PUEDE===false?null:dialogo('<h2>¿Qué SAP?</h2><p>Ahora: <b>'+(DB==="U_CARO_00"?"REAL (U_CARO_00)":"PRUEBAS (U_CARO_99)")+'</b></p><button class="bt a op" onclick="ponDb(\'U_CARO_99\')">🧪 Pruebas · U_CARO_99</button><button class="bt op" style="background:#B91C1C" onclick="ponDb(\'U_CARO_00\')">⚠️ Real · U_CARO_00</button><button class="bt g op" onclick="cerrar()">Cancelar</button>');
window.ponDb=(d)=>{ DB=d; LS("cs_db_real",d); PED=[]; cerrar(); pill(); cargar(); };
async function api(url,opts){ const r=await fetch(url+(url.includes("?")?"&":"?")+"db="+encodeURIComponent(DB),Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json","x-crm-key":LS("sap_pedido_key")||""}},opts||{})); return r.json().catch(()=>({ok:false,error:"sin respuesta del servidor (HTTP "+r.status+")"})); }
function aviso(t,ok){ const d=document.createElement("div"); d.className="msg"; d.style.background=ok?"#16A34A":"#B91C1C"; d.style.color="#fff"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ok?3500:8000); }
// Copia de la última carga en esta pestaña (sessionStorage): se enseña al momento mientras llega lo nuevo de SAP
function marcaCarga(t){ let m=document.getElementById("cargando"); if(!m){ m=document.createElement("div"); m.id="cargando"; m.setAttribute("style","margin-top:8px;font-size:15px;font-weight:700;color:#1D4ED8"); document.querySelector(".top").appendChild(m); } m.textContent=t||""; m.hidden=!t; }
async function cargar(){
  let usoCopia=false; if(!PED.length){ try{ const c=JSON.parse(sessionStorage.getItem("cs_cache_"+DB)||"null"); if(c&&c.pedidos){ aplicar(c); usoCopia=true; } }catch(e){} }
  if(!usoCopia&&!PED.length) document.getElementById("lista").innerHTML='<div class="carg">Cargando pedidos de SAP…<br><span id="seg" style="font-size:17px"></span></div>';
  const t0=Date.now(), reloj=setInterval(()=>{ const s=Math.round((Date.now()-t0)/1000); const e=document.getElementById("seg"); if(e) e.textContent=s+" s"; marcaCarga("🔄 Actualizando desde SAP… "+s+" s"); },1000);
  marcaCarga("🔄 Actualizando desde SAP…");
  const j=await api(API+"?pedidos=1"); clearInterval(reloj);
  if(!j.ok){ marcaCarga(""); if(PED.length) return aviso("No se ha podido actualizar: "+(j.error||""),false); document.getElementById("lista").innerHTML='<div class="nada" style="color:#B91C1C">No se han podido leer los pedidos:<br><b>'+esc(j.error)+'</b></div>'; return; }
  try{ sessionStorage.setItem("cs_cache_"+DB,JSON.stringify(j)); }catch(e){}
  marcaCarga("✓ Actualizado a las "+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}));
  aplicar(j); }
// ===== Quién ve qué: cada Customer Service sus vendedores; el jefe los suyos o todo el equipo; CEO y dirección, todo =====
// La asignación vendedor → Customer Service está en SAP (ficha del vendedor · Grupo Seguimiento); las personas, en el organigrama del portal.
let TODOS=[], YO={tipo:"todos", nombre:"", equipo:[]}, ALC=LS("cs_alcance")||"mios", FCS="", FVEN="";
const nrm=(s)=>String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
async function quienSoy(){ const T=window.top; let u=null; try{ u=T&&T!==window?T.currentUser:null; }catch(e){} if(!u){ try{ u=JSON.parse(localStorage.getItem("gc_portal_user")||"null"); }catch(e){} }
  if(!u) return {tipo:"todos",nombre:"",equipo:[]};
  const rol=String(u.rol||"").toLowerCase(), ceo=u.id==="ceo"||["ceo","crm_director","director","admin"].includes(rol);
  let equipo=[], jefes=[], p=null;
  try{ if(T&&T!==window&&typeof T.loadOrgData==="function"){ if(typeof T.loadUsersFB==="function"&&!(T.adminUsers||[]).length){ T.adminUsers=await T.loadUsersFB(); } await T.loadOrgData();
      const dep=(T.DEPTOS||[]).find(d=>d.id==="customer")||(T.DEPTOS||[]).find(d=>/customer/i.test(d.nombre||""));
      if(dep){ jefes=T.orgRespsDe(dep.id); equipo=jefes.concat(T.orgMiembrosDe(dep.id)); }
      p=T.orgPersona(typeof T.idPortal==="function"?T.idPortal(u):u.id)||T.orgPersona(u.nombre); } }catch(e){}
  const nombre=(p&&p.nombre)||u.nombre||u.id, claves=[nrm(nombre),nrm(u.nombre),nrm(u.id)].filter(Boolean);
  const esJefe=jefes.some(x=>claves.includes(nrm(x.nombre))||(p&&x.orgId===p.orgId)), esCS=esJefe||equipo.some(x=>claves.includes(nrm(x.nombre))||(p&&x.orgId===p.orgId));
  return {tipo:ceo?"todos":esJefe?"jefe":esCS?"cs":"todos", nombre, claves, equipo:equipo.map(x=>x.nombre), ceo};
}
const esMio=(p)=>YO.claves&&YO.claves.includes(nrm(p.cs));
const delEquipo=(p)=>YO.equipo.some(n=>nrm(n)===nrm(p.cs));
function filtrar(){ PED=TODOS.filter(p=>{
    if(YO.tipo==="cs"&&!esMio(p)) return false;
    if(YO.tipo==="jefe"&&ALC==="mios"&&!esMio(p)) return false;
    if(YO.tipo==="jefe"&&ALC==="equipo"&&!(esMio(p)||delEquipo(p))) return false;
    if(FCS&&(FCS==="__sin"?p.cs:nrm(p.cs)!==nrm(FCS))) return false;
    if(FVEN&&String(p.vendedorCod)!==FVEN) return false;
    return true; });
  pintaAlcance(); pintar(); }
function pintaAlcance(){ const el=document.getElementById("alcance"); if(!el) return; let h="";
  const base=TODOS.filter(p=>YO.tipo==="cs"?esMio(p):YO.tipo==="jefe"?(ALC==="mios"?esMio(p):(esMio(p)||delEquipo(p))):true);
  if(YO.tipo==="jefe") h+='<div class="dias">'+[["mios","👤 Mis vendedores"],["equipo","👥 Todo mi equipo"]].map(o=>'<button class="dia'+(ALC===o[0]?' on':'')+'" onclick="ponAlc(\''+o[0]+'\')">'+o[1]+'</button>').join("")+'</div>';
  if(YO.tipo==="cs") h+='<div class="sub" style="margin-bottom:8px;font-weight:700">👤 Pedidos de tus vendedores ('+esc(YO.nombre)+')</div>';

   +'<p>¿Lo has confirmado con el cliente? Producción/compras lo reciben como <b>definitivo</b> y el pedido <b>pasa al almacén</b> con la fecha propuesta.</p><p style="color:#64748B">Si luego hay retraso, cambia la fecha desde la pestaña Almacén.</p>'
   +'<button class="bt v op" onclick="escribir({accion:\'confirmar_fecha_prod\',entry:'+p.entry+(l?',linea:'+l.linea:'')+'},this)">Sí, confirmar la fecha</button><button class="bt g op" onclick="cerrar()">Volver</button>'); };
window.dlgCom=(e)=>{ const p=PED.find(x=>x.entry===e);
  dialogo('<h2>✏️ Comentarios del pedido '+p.num+'</h2><p><b>'+esc(p.nombre)+'</b>'+(p.ref?' · Ref. '+esc(p.ref):'')+'</p>'
   +'<textarea id="ct" rows="7" maxlength="254" oninput="document.getElementById(\'cc\').textContent=this.value.length+\' / 254\'">'+esc(p.comentario||"")+'</textarea>'
   +'<div class="fila" style="justify-content:space-between;margin-top:6px"><span class="sub" id="cc">'+(p.comentario||"").length+' / 254</span><button class="bt g" style="padding:8px 12px;font-size:15px" onclick="anadirCom()">➕ Añadir línea con fecha</button></div>'
   +'<p class="sub">Se guarda en SAP y sustituye a lo que había. SAP admite hasta 254 caracteres.</p>'
   +'<button class="bt v op" onclick="guardarCom('+e+',this)">Guardar en SAP</button><button class="bt g op" onclick="cerrar()">Cancelar</button>');
  const t=document.getElementById("ct"); t.focus(); t.setSelectionRange(t.value.length,t.value.length); };
window.anadirCom=()=>{ const t=document.getElementById("ct"), d=new Date(); const pre=(t.value?(t.value.endsWith("\n")?"":"\n"):"")+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+": "; t.value=(t.value+pre).slice(0,254); t.dispatchEvent(new Event("input")); t.focus(); t.setSelectionRange(t.value.length,t.value.length); };
window.guardarCom=(e,b)=>{ const t=document.getElementById("ct").value; if(t.length>254) return aviso("Máximo 254 caracteres",false); escribir({accion:"comentario",entry:e,texto:t},b); };
window.dlgValidar=(e)=>{ const p=PED.find(x=>x.entry===e); const b=bloqueos(p), falta=p.lineas.filter(l=>!l.hay&&!l.sol).length;
  dialogo((DB==="U_CARO_00"?'<p style="background:#FEE2E2;color:#991B1B;font-weight:800;border-radius:10px;padding:8px">⚠️ SAP REAL</p>':'')+'<h2>✅ Validar pedido '+p.num+'</h2><p><b>'+esc(p.nombre)+'</b></p><p>El pedido pasa al <b>almacén</b> para prepararlo.</p>'
   +(falta?'<p style="color:#B91C1C;font-weight:800">⚠️ '+falta+' artículo(s) no tienen stock suficiente.</p>':'')+(b.length?'<p style="color:#B91C1C;font-weight:800">⚠️ '+b.join(" · ")+'</p>':'')
   +'<button class="bt v op" onclick="escribir({accion:\'validar\',entry:'+e+'},this)">Sí, validar</button><button class="bt g op" onclick="cerrar()">No, volver</button>'); };
let SOL=null;
window.dlgSol=(k,que)=>{ const {p,l}=buscar(k); SOL={k,tipo:que==="comp"?"5":""};
  const prods=["1","2","3","6","7"].filter(t=>TIPOS[t]);
  dialogo('<h2>'+(que==="comp"?'🛒 Mandar a compras':'🏭 Mandar a producción')+'</h2><p><b>'+esc(l.articulo)+'</b> · pide '+n(l.pide)+' · hay '+n(Math.max(0,l.libre))+'</p>'
   +(que==="comp"?'':'<p><b>1. ¿A qué producción?</b></p>'+prods.map(t=>'<button class="bt g op" id="op'+t+'" onclick="elegir(\''+t+'\')">'+esc(TIPOS[t])+'</button>').join(""))
   +'<p><b>'+(que==="comp"?'':'2. ')+'¿Qué pasa?</b> (obligatorio)</p><textarea id="det" rows="3" placeholder="Ej.: faltan 300 madejas, el cliente lo necesita el viernes">Faltan '+n(l.pide-Math.max(0,l.libre))+' '+esc(l.ud)+'. </textarea>'
   +'<button class="bt '+(que==="comp"?'z':'a')+' op" onclick="enviarSol(this)">Mandar</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.elegir=(t)=>{ SOL.tipo=t; document.querySelectorAll(".op[id^=op]").forEach(b=>b.classList.toggle("on",b.id==="op"+t)); };
window.enviarSol=(b)=>{ const det=document.getElementById("det").value.trim(); if(!SOL.tipo) return aviso("Elige a qué producción",false); if(det.length<3) return aviso("Escribe qué pasa",false);
  const {p,l}=buscar(SOL.k); escribir({accion:"solicitud",entry:p.entry,linea:l.linea,tipo:SOL.tipo,detalle:det},b); };
window.quitarSol=(k)=>{ const {p,l}=buscar(k); dialogo('<h2>↩️ Quitar la petición</h2><p><b>'+esc(l.articulo)+'</b> deja de esperar a '+esc(l.sol.quien)+' y vuelve a Customer Service.</p><button class="bt op" onclick="escribir({accion:\'anular_solicitud\',entry:'+p.entry+',linea:'+l.linea+'},this)">Sí, quitarla</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.dlgFecha=(k)=>{ const {p,l}=buscar(k); const ll=l?(l.llegadas||[])[0]:null, ini=(l&&l.entrega)||p.entrega||HOY;
  let sug=ll&&ll.fecha?ll.fecha:null; if(!l){ const fs=p.lineas.filter(x=>!x.hay&&!x.sol).map(x=>(x.llegadas||[])[0]).filter(x=>x&&x.fecha).map(x=>x.fecha).sort(); sug=fs.length?fs[fs.length-1]:null; }
  if(sug&&sug<HOY) sug=null;
  dialogo('<h2>📅 Cambiar fecha de servicio</h2><p><b>'+esc(p.nombre)+'</b> · pedido '+p.num+'</p><p>'+(l?'Artículo <b>'+esc(l.articulo)+'</b>':'<b>Todo el pedido</b>')+' · ahora: <b>'+fx(ini)+'</b></p>'
   +(sug?'<button class="bt z op" onclick="document.getElementById(\'nf\').value=\''+sug+'\'">🚚 Usar fecha de la próxima entrada: '+fx(sug)+'</button>':'')
   +'<p><b>Nueva fecha</b></p><input type="date" id="nf" min="'+HOY+'" value="'+(ini>=HOY?ini:HOY)+'">'
   +(p.confirmado?'<p><b>¿Por qué cambia? (obligatorio)</b></p><select id="nm" class="sel" style="width:100%;font-size:20px;padding:10px"><option value="">— Elige el motivo —</option><option>Proveedor</option><option>Producción</option><option>Cliente</option><option>Transporte</option><option>Otro</option></select><input id="nn" placeholder="Nota (opcional)" style="width:100%;font-size:18px;padding:10px;margin-top:8px;box-sizing:border-box">':'')
   +'<p style="font-size:16px;color:#64748B">Recuerda avisar al cliente de la nueva fecha.</p>'
   +'<button class="bt v op" onclick="enviarFecha(\''+k+'\',this)">Guardar en SAP</button><button class="bt g op" onclick="cerrar()">Cancelar</button>'); };
window.enviarFecha=(k,b)=>{ const {p,l}=buscar(k); const f=document.getElementById("nf").value; if(!f) return aviso("Elige la fecha",false); if(f<HOY) return aviso("La fecha no puede ser anterior a hoy",false);
  let motivo=null; if(p.confirmado){ const m=document.getElementById("nm").value, nt=document.getElementById("nn").value.trim(); if(!m) return aviso("Elige el motivo del cambio",false); motivo=m+(nt?": "+nt:""); }
  escribir({accion:"fecha",entry:p.entry,linea:l?l.linea:null,fecha:f,motivo},b); };
pill(); cargar();
</script>
