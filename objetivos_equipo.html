<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cierres del equipo</title>
<style>
 :root{--navy:#0F172A;--muted:#64748B;--border:#E2E8F0;--white:#fff;
       --green:#22C55E;--greenL:#F0FDF4;--red:#EF4444;--redL:#FEF2F2;
       --amber:#F59E0B;--amberL:#FFFBEB;--purple:#8B5CF6;--purpleL:#F5F3FF;
       --blue:#2563EB;--blueL:#EFF6FF}
 *{box-sizing:border-box}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#F8FAFC;color:var(--navy)}
 header{background:var(--navy);color:#fff;padding:16px 18px}
 header h1{margin:0 0 3px;font-size:19px;font-weight:800}
 header p{margin:0;font-size:12px;opacity:.75}
 header a{color:#fff;font-size:14px;font-weight:700;text-decoration:none;
          display:inline-block;margin-top:12px;cursor:pointer;
          background:rgba(255,255,255,.14);padding:9px 18px;border-radius:10px;
          border:1px solid rgba(255,255,255,.25)}
 header a:active{background:rgba(255,255,255,.28)}
 main{padding:16px;max-width:820px;margin:0 auto;padding-bottom:90px}
 .card{background:var(--white);border:1px solid var(--border);border-radius:14px;
       padding:14px 16px;margin-bottom:11px;box-shadow:0 1px 3px #0000000d}
 .sem{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px}
 .sem button{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer}
 .sem button:disabled{color:var(--border);cursor:default}
 .sem .t{text-align:center}.sem .t b{display:block;font-size:16px}
 .sem .t span{font-size:11px}
 .fila{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
 .fila b{font-size:14px}
 .fila small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
 .pill{flex-shrink:0;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:99px}
 .pill.ok{background:var(--greenL);color:var(--green)}
 .pill.no{background:var(--amberL);color:var(--amber)}
 .cerr{border-left:4px solid var(--green)}
 .abierto{border-left:4px solid var(--amber)}
 h3{font-size:12.5px;margin:18px 0 7px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted)}
 .item{padding:10px 0;border-top:1px solid var(--border)}
 .item:first-of-type{border-top:none}
 .item p{margin:0;font-size:12.5px}
 .item small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
 .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;
      border-radius:99px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
 .t-cliente{background:var(--blueL);color:var(--blue)}
 .t-ofertas{background:var(--amberL);color:var(--amber)}
 .t-muestras{background:var(--purpleL);color:var(--purple)}
 .t-estrategias{background:var(--greenL);color:var(--green)}
 .t-promesa,.t-otro,.t-semana,.t-prioridad,.t-dup{background:#F1F5F9;color:var(--muted)}
 .obviado{background:var(--amberL);border-radius:9px;padding:10px 12px;margin-bottom:7px}
 .obviado p{font-size:12.5px;margin:0}
 label{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
 select,textarea,input[type=text]{width:100%;padding:9px 11px;border-radius:9px;
   border:1.5px solid var(--border);font-size:13px;font-family:inherit;outline:none;
   background:#fff}
 textarea{resize:vertical}
 .btn{width:100%;padding:11px;border-radius:10px;border:none;background:var(--navy);
      color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-top:9px}
 .btn:disabled{background:#CBD5E1;cursor:default}
 .mini{padding:4px 11px;border-radius:99px;border:1.5px solid var(--border);
       background:#fff;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
 .mini.on{border-color:var(--green);background:var(--greenL);color:var(--green)}
 .mini:disabled{opacity:.4;cursor:default}
 .cont{display:flex;justify-content:space-between;padding:10px 14px;border-radius:11px;
       margin-bottom:14px;background:#F1F5F9;border:1px solid var(--border);
       font-size:12px;font-weight:700}
 .cont.lleno{background:var(--amberL);border-color:var(--amber)}
 .estado{text-align:center;color:var(--muted);font-size:13.5px;padding:30px}
 .err{padding:14px;background:var(--redL);color:var(--red);border-radius:10px;font-size:13px}
 .vacio{color:var(--muted);font-size:12.5px;margin:0;padding:6px 0}
 .buscador{position:relative}
 .lupa{position:absolute;left:11px;top:50%;transform:translateY(-50%);
       font-size:14px;opacity:.5;pointer-events:none}
 input.conlupa{padding-left:34px}
 .sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;
      border:1.5px solid var(--border);border-radius:10px;margin-top:3px;
      max-height:230px;overflow-y:auto;box-shadow:0 6px 18px #0000001f}
 .sug div{padding:9px 12px;font-size:12.5px;cursor:pointer;border-top:1px solid #F1F5F9}
 .sug div:first-child{border-top:none}
 .sug div:hover,.sug div.act{background:var(--blueL)}
 .sug small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
 .elegido{display:flex;justify-content:space-between;align-items:center;gap:8px;
          padding:9px 12px;border-radius:9px;background:var(--greenL);
          border:1.5px solid var(--green);font-size:12.5px;font-weight:700}
 .elegido button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
 /* Ficha de la oferta/muestra elegida: que se vea que lleva sin salir de aquí */
 .docficha{margin-top:7px;padding:11px 13px;background:#F8FAFC;
   border:1px solid var(--border);border-radius:10px}
 .docdatos{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
 .docdatos div{display:flex;justify-content:space-between;gap:8px;font-size:12px}
 .docdatos span{color:var(--muted)}
 .docdatos b{font-weight:700;text-align:right}
 .doclineas{margin-top:9px;border-top:1px solid var(--border);padding-top:8px}
 .doclineas div{display:flex;justify-content:space-between;gap:10px;
   font-size:12px;padding:2px 0}
 .doclineas span{color:var(--muted);min-width:0;overflow:hidden;
   text-overflow:ellipsis;white-space:nowrap}
 .doclineas b{font-weight:700;white-space:nowrap}
 .docnota{margin:8px 0 0;font-size:12px;color:var(--muted);font-style:italic;
   border-top:1px solid var(--border);padding-top:7px}
</style>
</head>
<body>
<header>
  <h1>📋 Cierres del equipo</h1>
  <p id="sub">Qué ha cerrado cada comercial y qué falta</p>
  <a id="volver">← Volver</a>
</header>
<main><div class="estado" id="app">Cargando…</div></main>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const P=new URLSearchParams(location.search);
const UID=(P.get("uid")||"").trim();
const AGENTE=(P.get("agente")||"").toUpperCase().trim();
const ROL=(P.get("rol")||"").toLowerCase();
const EQUIPO=(P.get("equipo")||"").toUpperCase();
const VUELVE=P.get("vuelve")||"/";
// Cuando se muestra dentro del CRM (iframe) no hace falta botón de volver:
// la navegación del propio CRM sigue visible debajo.
const EMBED=P.get("embed")==="1";

const U=(s)=>String(s||"").toUpperCase().trim();
const esc2=(s)=>String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
const MAX=10, ANIO=new Date().getFullYear();
const esJefe=ROL==="jefe"||ROL==="crm_jefe";
const esDir =ROL==="director"||ROL==="crm_director";
const esCeo =ROL==="ceo";
const ESCALA_A=esJefe?"director":esDir?"ceo":null;
const MI_NIVEL=esCeo?"ceo":esDir?"director":null;

// Tipologías disponibles al crear un objetivo a mano
const TIPOS=[
  {k:"cliente",    lbl:"Cliente / visita"},
  {k:"ofertas",    lbl:"Oferta"},
  {k:"muestras",   lbl:"Muestra"},
  {k:"estrategias",lbl:"Estrategia"},
  {k:"otro",       lbl:"Otro"},
];
const LBL={cliente:"Cliente",ofertas:"Oferta",muestras:"Muestra",
           estrategias:"Estrategia",promesa:"Promesa",otro:"Otro",
           semana:"La semana",prioridad:"Prioridad",dup:"Duplicado"};

function semanaISO(d){
  d=d||new Date();
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  const a=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t-a)/86400000)+1)/7);
}
const SEM_ACTUAL=semanaISO();
let SEMANA=Number(P.get("semana"))||SEM_ACTUAL;
if(SEMANA<1||SEMANA>SEM_ACTUAL) SEMANA=SEM_ACTUAL;

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.arrayValue!==undefined) return (f.arrayValue.values||[]).map(val);
  return null;
}
function toFields(o){
  const f={};
  for(const [k,v] of Object.entries(o)){
    if(v===null||v===undefined) continue;
    f[k]= typeof v==="number"?{doubleValue:v}
        : typeof v==="boolean"?{booleanValue:v}:{stringValue:String(v)};
  }
  return f;
}
async function leer(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<40);
  return t;
}
async function escribir(col,id,doc){
  const r=await fetch(`${FB}/${col}/${encodeURIComponent(id)}`,{
    method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({fields:toFields(doc)})});
  if(!r.ok) throw new Error("HTTP "+r.status);
}

let USUARIOS=[], OBJETIVOS=[], CIERRES={}, VISTA="lista", SEL=null, CERRADA=false;
let FILTRO="";   // buscador de vendedores de la lista
// Catálogos para los buscadores. Se cargan una vez y se reutilizan.
let CLIENTES=[], PRODUCTOS=[];
// Cliente y producto son independientes: un objetivo puede llevar los dos
// ("a este cliente, ofrécele este producto"), solo uno, o ninguno.
let SEL_CLI=null, SEL_PROD=null;
// Objetivo que se está editando (null = alta nueva) y vendedor destino
let EDITANDO=null, SEL_VEND=null;

// Comprueba si un objetivo ya se ha cumplido, con el mismo criterio que usa
// el cierre del viernes: para clientes, si hay visita esa semana; para el
// resto, si el documento ya está en un estado cerrado.
let VISITAS_SEM={}, ESTADOS_DOC={};
// Ofertas, muestras y estrategias que siguen abiertas, para poder apuntar un
// objetivo a una en concreto en vez de describirla a mano.
let ABIERTOS={ofertas:[],muestras:[],estrategias:[]};
let SEL_DOC=null, VER_TODAS_DOC=false;

async function cargarSeguimiento(){
  VISITAS_SEM={}; ESTADOS_DOC={};
  // Solo las visitas de ESTA semana. Leer la colección entera son miles de
  // documentos por cada carga y dispara la factura de Firestore.
  try{
    const body={structuredQuery:{from:[{collectionId:"visitas"}],
      where:{fieldFilter:{field:{fieldPath:"semana"},op:"EQUAL",
             value:{doubleValue:SEMANA}}},limit:3000}};
    const r=await fetch(FB+":runQuery",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.ok){
      const j=await r.json();
      (Array.isArray(j)?j:[]).forEach(x=>{
        if(!x.document) return;
        const v={};
        for(const [k,f] of Object.entries(x.document.fields||{})) v[k]=val(f);
        const cid=U(v.clienteId||v.clienteCodigo); if(!cid) return;
        (VISITAS_SEM[cid]=VISITAS_SEM[cid]||[]).push(v);
      });
    }
  }catch(e){}
  try{
    const [of,mu,es]=await Promise.all([leer("ofertas"),leer("muestras"),leer("estrategias")]);
    [...of,...mu,...es].forEach(d=>{
      const id=U(d.id||d._id); if(!id) return;
      ESTADOS_DOC[id]=String(d.estado||"").toLowerCase();
    });
    // Los que siguen abiertos, para poder referenciarlos en un objetivo:
    // "cierra esta oferta", "haz seguimiento de esta muestra"...
    const abierto=(d)=>!CERRADO_RE.test(String(d.estado||"").toLowerCase());
    ABIERTOS.ofertas    = of.filter(abierto);
    ABIERTOS.muestras   = mu.filter(abierto);
    ABIERTOS.estrategias= es.filter(abierto);
  }catch(e){}
}

const CERRADO_RE=/pedido|perdida|aceptada|rechazada|completada|ko|cerrada|positivo/;

// Variantes del código: el CRM y SAP no siempre coinciden (un 0 de más)
function variantesCod(c){
  c=U(c); if(!c) return [];
  const out=[c];
  for(let i=0;i<c.length;i++){ if(c.charAt(i)==="0") out.push(c.slice(0,i)+c.slice(i+1)); }
  const m=c.match(/^([A-Z]*)(\d+)$/);
  if(m){ out.push(m[1]+"0"+m[2]); out.push(m[2]); out.push("U"+m[2]); }
  return out.filter((v,i,a)=>v&&a.indexOf(v)===i);
}

function estadoObjetivo(o){
  // Si apunta a un documento concreto, ese manda: es lo mas fiable
  if(o.docId){
    const est=ESTADOS_DOC[U(o.docId)];
    if(est===undefined) return {hecho:true,detalle:"Ya no está abierta"};
    return CERRADO_RE.test(est)
      ? {hecho:true,detalle:"Cerrada como "+est}
      : {hecho:false,detalle:est?"Sigue en "+est:"Sigue abierta"};
  }
  const cod=o.refCodigo||o.id;
  if(o.tipo==="cliente"){
    const vs=variantesCod(o.refCodigo);
    for(const v of vs){
      const vis=VISITAS_SEM[v];
      if(vis&&vis.length){
        const ped=vis.some(x=>/pedido/i.test(x.resultado||""));
        return {hecho:true,txt:ped?"Visitado y con pedido"
          :vis.length+" contacto"+(vis.length>1?"s":"")+" registrado"+(vis.length>1?"s":"")};
      }
    }
    return {hecho:false,txt:"Sin rastro de contacto esta semana"};
  }
  const est=ESTADOS_DOC[U(o.refCodigo)];
  if(est===undefined) return null;      // no se puede comprobar
  if(!est) return {hecho:false,txt:"Sigue abierta"};
  return CERRADO_RE.test(est)
    ? {hecho:true,txt:"Cerrada como "+est}
    : {hecho:false,txt:"Sigue en "+est};
}

function pintaSemaforo(o){
  const e=estadoObjetivo(o);
  if(!e) return "";
  return '<small style="color:'+(e.hecho?"var(--green)":"var(--amber)")
    +';font-weight:600">'+(e.hecho?"✓ ":"○ ")+e.txt+'</small>';
}

async function cargarCatalogos(){
  try{
    const cli=await leer("clientes");
    CLIENTES=cli.map(c=>({
      // El código real del cliente, que es lo que hay que guardar para
      // poder relacionarlo después con visitas, ofertas y pedidos.
      cod:String(c.id||c._id||c.CODIGO||c.codigo||"").trim(),
      nom:String(c.nombre||c.NOMBRE||"").trim(),
      pob:String(c.poblacion||c.POBLACION||"").trim()
    })).filter(c=>c.cod&&c.nom);
  }catch(e){ CLIENTES=[]; }
  try{
    const pr=await leer("productos");
    PRODUCTOS=pr.map(p=>({
      cod:String(p.codigo||p._id||"").trim(),
      nom:String(p.nombre||"").trim(),
      det:[p.calibre,p.medida||p.metros,p.formato].filter(Boolean).join(" · ")
    })).filter(p=>p.cod);
  }catch(e){ PRODUCTOS=[]; }
}

window.cambiarTipo=()=>{ SEL_DOC=null; VER_TODAS_DOC=false; pintar(); };

// Busca en el catálogo que toque y pinta las sugerencias sin repintar la
// pantalla entera (repintar perdería el foco y lo escrito en el otro campo).
window.buscarEn=(campo,txt)=>{
  const cont=document.getElementById("sug-"+campo);
  if(!cont) return;
  const q=U(txt).trim();
  if(q.length<2){ cont.innerHTML=""; cont.style.display="none"; return; }
  const cat = campo==="prod" ? PRODUCTOS : CLIENTES;
  if(!cat.length){
    cont.innerHTML='<div style="color:var(--muted)">Cargando catálogo…</div>';
    cont.style.display="block"; return;
  }
  // Primero los que empiezan por lo tecleado, luego los que lo contienen
  const empieza=[], contiene=[];
  for(const x of cat){
    const n=U(x.nom), c=U(x.cod);
    if(n.indexOf(q)===0||c.indexOf(q)===0) empieza.push(x);
    else if(n.indexOf(q)>=0||c.indexOf(q)>=0) contiene.push(x);
    if(empieza.length>=30) break;
  }
  const lista=empieza.concat(contiene).slice(0,30);
  if(!lista.length){
    cont.innerHTML='<div style="color:var(--muted)">Sin resultados para "'+txt+'"</div>';
    cont.style.display="block"; return;
  }
  cont.innerHTML=lista.map(x=>
    '<div onclick="elegir(\''+campo+'\',\''+esc2(x.cod)+'\',\''+esc2(x.nom)+'\')">'
    +'<b>'+x.nom+'</b><small>'+x.cod
    +(x.pob?" · "+x.pob:"")+(x.det?" · "+x.det:"")+'</small></div>'
  ).join("");
  cont.style.display="block";
};

window.elegir=(campo,cod,nom)=>{
  if(campo==="prod") SEL_PROD={cod:cod,nom:nom};
  else SEL_CLI={cod:cod,nom:nom};
  pintar();
};
window.quitar=(campo)=>{
  if(campo==="prod") SEL_PROD=null; else SEL_CLI=null;
  pintar();
};

async function cargarUsuarios(){
  const [us,pu]=await Promise.all([leer("usuarios"),leer("portal_users")]);
  // La misma persona sale en las dos colecciones con ids distintos (wk4 en
  // usuarios, agustin en portal_users), asi que indexar por id la duplicaba.
  // Se agrupa por nombre normalizado y gana la ficha de "usuarios", que es
  // la que lleva el id canonico con el que se guardan los informes.
  const clave=(n)=>U(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Z0-9]/g,"");
  const map={};
  const meter=(u,prioritario)=>{
    const rol=String(u.rol||"").toLowerCase();
    if(rol!=="agente"&&rol!=="crm_agente"&&rol!=="comercial") return;
    const id=u.id||u._id||u.username; if(!id) return;
    const nom=u.nombre||u.username||id;
    const k=clave(nom); if(!k) return;
    const ficha={id:id,nombre:nom,equipo:U(u.equipo||""),
      cod:U(u.grupoAgente||u.catalogoVendedor||id)};
    if(!map[k]) map[k]=ficha;
    else if(prioritario) map[k]=Object.assign({},map[k],ficha);
  };
  us.forEach(u=>meter(u,true));      // usuarios manda
  pu.forEach(u=>meter(u,false));     // portal_users solo rellena huecos
  let l=Object.values(map);
  if(esJefe&&EQUIPO) l=l.filter(u=>u.equipo===EQUIPO);
  l.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return l;
}

// Informe de cierre de cada comercial para la semana elegida
async function cargarCierres(){
  const res={};
  await Promise.all(USUARIOS.map(async a=>{
    try{
      const r=await fetch(`${FB}/informes/informe_${encodeURIComponent(a.cod)}_s${SEMANA}`);
      if(!r.ok){ res[a.id]=null; return; }
      const j=await r.json();
      const o={};
      for(const [k,x] of Object.entries(j.fields||{})) o[k]=val(x);
      let R={},PL=[];
      try{ R=JSON.parse(o.respuestas||"{}"); }catch(e){}
      try{ PL=JSON.parse(o.planteados||"[]"); }catch(e){}
      // Lo propuesto: lo que sí contestó
      const propuesto=[];
      for(const k in R){
        const v=R[k]||{};
        if(!v.accion&&!v.texto) continue;
        const p=k.split(/:(.+)/);
        propuesto.push({clave:k,tipo:p[0],id:p[1]||"",accion:v.accion||"",
          texto:v.texto||"",nom:v.nom||""});
      }
      // Lo obviado: el sistema se lo planteó y no dijo nada
      const obviado=PL.filter(x=>{
        const v=R[x.k];
        return !v||(!v.accion&&!v.texto);
      });
      res[a.id]={info:o,propuesto,obviado,fecha:o.fechaEnvio||"",
        sinPlanteados:!o.planteados};
    }catch(e){ res[a.id]=null; }
  }));
  return res;
}

function escalados(){ return OBJETIVOS.filter(o=>o.escaladoA===ESCALA_A); }

window.irLista=()=>{ VISTA="lista"; SEL=null; pintar(); };
window.filtrar=(t)=>{
  FILTRO=t;
  // Se repinta solo la lista para no perder el foco del campo mientras escribe
  const cont=document.getElementById("lista-vend");
  if(cont) cont.innerHTML=filasVendedores();
  const c=document.getElementById("cuenta-cierres");
  if(c) c.textContent=textoCuenta();
};
window.abrir=(id)=>{ VISTA="detalle"; SEL=id; pintar(); };

window.nuevoObjetivo=async(agId)=>{
  const txt=(document.getElementById("ob-txt").value||"").trim();
  const tipo=document.getElementById("ob-tipo").value;
  if(!txt){ alert("Escribe el objetivo."); return; }
  if(!SEL_CLI&&!SEL_PROD&&!SEL_DOC&&tipo!=="otro"){
    alert("Elige un cliente, un producto o una "+(LBL[tipo]||tipo).toLowerCase()
      +" concreta.");
    return;
  }
  const destino = SEL_VEND || agId;   // se puede reasignar a otro vendedor
  const btn=document.getElementById("ob-btn");
  btn.disabled=true; btn.textContent="Guardando…";
  // Al editar se conserva el id para no duplicar el documento
  const id = EDITANDO ? EDITANDO.id
    : "obj_"+destino+"_"+ANIO+"_s"+SEMANA+"_"+Date.now();
  const base = EDITANDO || {};
  const doc=Object.assign({},base,{id,agente:destino,semana:SEMANA,anio:ANIO,
    texto:txt,tipo:tipo,
    // refCodigo es la clave que permite relacionarlo luego (el cliente manda,
    // porque es lo que llevan visitas y ofertas); el resto se guarda aparte.
    refCodigo:SEL_CLI?SEL_CLI.cod:"", refNombre:SEL_CLI?SEL_CLI.nom:"",
    prodCodigo:SEL_PROD?SEL_PROD.cod:"", prodNombre:SEL_PROD?SEL_PROD.nom:"",
    // Documento concreto (oferta/muestra/estrategia) al que apunta el objetivo
    docId:SEL_DOC?SEL_DOC.cod:"", docNombre:SEL_DOC?SEL_DOC.nom:"",
    origen:"jefe",creadoPor:base.creadoPor||UID,
    creadoPorNombre:base.creadoPorNombre||AGENTE,
    equipo:EQUIPO,
    fechaCreacion:base.fechaCreacion||new Date().toISOString()});
  if(EDITANDO) doc.editadoEl=new Date().toISOString();
  try{
    await escribir("objetivos_semana",id,doc);
    if(EDITANDO) OBJETIVOS=OBJETIVOS.map(x=>x.id===id?doc:x);
    else OBJETIVOS.push(doc);
    EDITANDO=null; SEL_CLI=null; SEL_PROD=null; SEL_VEND=null; SEL_DOC=null; pintar();
  }catch(e){
    btn.disabled=false; btn.textContent=EDITANDO?"Guardar cambios":"Añadir objetivo";
    alert("No se ha podido guardar: "+e.message);
  }
};

window.toggleEscalar=async(id)=>{
  const o=OBJETIVOS.find(x=>x.id===id); if(!o) return;
  const ya=o.escaladoA===ESCALA_A;
  if(!ya&&escalados().length>=MAX){ alert("Máximo "+MAX+"."); return; }
  const upd=Object.assign({},o,{escaladoA:ya?"":ESCALA_A,
    escaladoPor:ya?"":UID,fechaEscalado:ya?"":new Date().toISOString()});
  Object.assign(o,upd); pintar();
  try{ await escribir("objetivos_semana",o.id,upd); }catch(e){ alert("Error: "+e.message); }
};

// Sube al siguiente nivel algo que ya estaba en el cierre del comercial
window.escalarItem=async(agId,clave,texto,tipo,nom)=>{
  const ya=OBJETIVOS.find(o=>o.claveOrigen===clave&&U(o.agente)===U(agId));
  if(ya) return window.toggleEscalar(ya.id);
  if(escalados().length>=MAX){ alert("Máximo "+MAX+"."); return; }
  let h=0; for(let i=0;i<clave.length;i++){ h=((h<<5)-h)+clave.charCodeAt(i); h|=0; }
  const id="obj_"+agId+"_"+ANIO+"_s"+SEMANA+"_"+Math.abs(h);
  const doc={id,agente:agId,semana:SEMANA,anio:ANIO,
    texto:(nom?nom+" — ":"")+texto,tipo:tipo||"otro",origen:"comercial",
    claveOrigen:clave,equipo:EQUIPO,escaladoA:ESCALA_A,escaladoPor:UID,
    fechaEscalado:new Date().toISOString(),fechaCreacion:new Date().toISOString()};
  OBJETIVOS.push(doc); pintar();
  try{ await escribir("objetivos_semana",id,doc); }catch(e){ alert("Error: "+e.message); }
};

window.editar=(id)=>{
  const o=OBJETIVOS.find(x=>x.id===id); if(!o) return;
  EDITANDO=o;
  SEL_CLI = o.refCodigo ? {cod:o.refCodigo,nom:o.refNombre||o.refCodigo} : null;
  SEL_PROD= o.prodCodigo? {cod:o.prodCodigo,nom:o.prodNombre||o.prodCodigo} : null;

    const dd=(ABIERTOS[o.tipo]||[]).find(x=>String(x.id||x._id)===String(o.docId));

// Buscador de ofertas/muestras/estrategias abiertas del vendedor elegido
// Todas las formas en que puede venir identificado el vendedor en un documento
function clavesVendedor(agId){
  const ag=USUARIOS.find(u=>U(u.id)===U(agId));
  if(!ag) return [];
  const c=[ag.id,ag.cod,ag.nombre].filter(Boolean).map(U);
  return c.filter((v,i,a)=>a.indexOf(v)===i);
}
function esDelVendedor(d,claves){
  if(!claves.length) return true;
  const campos=[d.agente,d.agenteId,d.agenteNombre,d.responsableComercial,
    d.creadoPor,d.vendedor].filter(Boolean).map(U);
  return campos.some(x=>claves.indexOf(x)>=0);
}

window.buscarDoc=(txt)=>{
  const cont=document.getElementById("sug-doc");
  if(!cont) return;
  const tipo=(document.getElementById("ob-tipo")||{}).value||"";
  const lista=ABIERTOS[tipo]||[];
  const q=U(txt).trim();
  const agId=SEL_VEND||SEL||"";
  const claves=clavesVendedor(agId);
  const ag=USUARIOS.find(u=>U(u.id)===U(agId));

  // Solo las del vendedor al que se le pone el objetivo: las de otros no
  // le sirven de nada y ensucian la busqueda.
  const suyas=lista.filter(d=>esDelVendedor(d,claves));
  const base=VER_TODAS_DOC?lista:suyas;
  const res=base.filter(d=>{
    if(!q) return true;
    const txtD=U([d.cliente,d.clienteNombre,d.nombre,d.titulo,d.prod,
      d.prodNombre,d.id].filter(Boolean).join(" "));
    return txtD.indexOf(q)>=0;
  }).slice(0,25);

  const verTodas='<div onclick="verTodasDoc()" style="color:var(--blue);'
    +'font-weight:700;border-top:1px solid var(--border)">'
    +(VER_TODAS_DOC?"↩ Solo las de "+(ag?ag.nombre:"este vendedor")
                   :"Ver las de todos los vendedores ("+lista.length+")")+'</div>';

  if(!res.length){
    cont.innerHTML='<div style="color:var(--muted)">'
      +(lista.length===0
         ? 'No hay '+(LBL[tipo]||tipo).toLowerCase()+' abiertas'
         : (suyas.length===0&&!VER_TODAS_DOC
             ? (ag?ag.nombre:"Este vendedor")+' no tiene '
               +(LBL[tipo]||tipo).toLowerCase()+' abiertas'
             : 'Sin resultados'))
      +'</div>'+(lista.length?verTodas:"");
    cont.style.display="block"; return;
  }
  cont.innerHTML=res.map(d=>{
    const nom=d.cliente||d.clienteNombre||d.nombre||d.titulo||d.prod||d.id;
    // Qué es y de cuándo: sin esto todas las ofertas del mismo cliente
    // parecen la misma en la lista
    const ls=Array.isArray(d.lineas)?d.lineas:[];
    const prods=ls.map(l=>l.producto||l.prod||l.nombre).filter(Boolean);
    const que=d.prod||d.prodNombre||d.titulo
      ||(prods.length?prods.slice(0,2).join(", ")+(prods.length>2?" +"+(prods.length-2):""):"");
    const fecha=d.fecha||d.fechaCreacionStr||(d.fechaCreacion||"").slice(0,10);
    const imp=(d.importe!=null&&d.importe!=="")
      ? Number(d.importe).toLocaleString("es-ES")+" €" : "";
    const det=[que,d.estado,fecha,imp].filter(Boolean).join(" · ");
    return '<div onclick="elegirDoc(\''+esc2(d.id||d._id)+'\',\''+esc2(nom)+'\')">'
      +'<b>'+nom+'</b><small>'+det+'</small></div>';
  }).join("")+verTodas;
  cont.style.display="block";
};
window.verTodasDoc=()=>{
  VER_TODAS_DOC=!VER_TODAS_DOC;
  const inp=document.querySelector('input[oninput*="buscarDoc"]');
  window.buscarDoc(inp?inp.value:"");

window.elegirDoc=(id,nom)=>{

// Ficha con lo que se ofertó, cuándo y a qué precio: sin esto el responsable
// tiene que salirse a mirarlo a otro sitio para saber de qué está hablando.
function fichaDoc(sel){
  const d=sel&&sel.doc;
  // Si al editar no se pudo recuperar el documento (ya cerrado, por ejemplo)
  // se avisa en vez de dejar el hueco sin explicacion
  if(!d) return sel&&sel.cod
    ? '<div class="docficha"><p class="docnota" style="border:none;padding:0;'
      +'margin:0">Sin detalle disponible: puede que ya no esté abierta.</p></div>'
    : "";
  const f=[];
  const fecha=d.fecha||d.fechaCreacionStr||(d.fechaCreacion||"").slice(0,10);
  if(fecha) f.push(["Fecha",fecha]);
  if(d.estado) f.push(["Estado",d.estado]);
  if(d.prod||d.prodNombre) f.push(["Producto",d.prod||d.prodNombre]);
  if(d.calibre) f.push(["Calibre",d.calibre]);
  if(d.metros) f.push(["Metros",d.metros]);
  if(d.cantidad) f.push(["Cantidad",d.cantidad]);
  if(d.titulo) f.push(["Título",d.titulo]);
  if(d.tipo&&sel.tipo==="estrategias") f.push(["Tipo",d.tipo]);
  if(d.importe!=null&&d.importe!=="")
    f.push(["Importe",Number(d.importe).toLocaleString("es-ES")+" €"]);

  // Las ofertas llevan sus líneas con producto, precio y cantidad
  let lineas="";
  const ls=Array.isArray(d.lineas)?d.lineas:[];
  if(ls.length){
    lineas='<div class="doclineas">'+ls.slice(0,8).map(l=>{
      const nom=l.producto||l.prod||l.nombre||l.descripcion||"—";
      const cant=l.cantidad!=null?l.cantidad:(l.unidades!=null?l.unidades:null);
      const pre=l.precio!=null?Number(l.precio).toLocaleString("es-ES",
        {minimumFractionDigits:2,maximumFractionDigits:2})+" €":"";
      return '<div><span>'+nom+'</span><b>'
        +(cant!=null?cant+" × ":"")+pre+'</b></div>';
    }).join("")
    +(ls.length>8?'<div style="color:var(--muted)">y '+(ls.length-8)+' más</div>':"")
    +'</div>';
  }
  const nota=d.nota||d.notaInicial||d.obs||d.observaciones||d.descripcion||"";
  return '<div class="docficha">'
    +(f.length?'<div class="docdatos">'+f.map(x=>
       '<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("")+'</div>':"")
    +lineas
    +(nota?'<p class="docnota">“'+String(nota).slice(0,300)+'”</p>':"")
    +'</div>';
}

// Cuántos objetivos de este comercial ya están cumplidos
function hechosDe(agId){
  const l=OBJETIVOS.filter(o=>U(o.agente)===U(agId)&&o.refCodigo);
  if(!l.length) return null;
  return l.filter(o=>{ const e=estadoObjetivo(o); return e&&e.hecho; }).length;
}

function vendedoresFiltrados(){
  const q=U(FILTRO).trim();
  if(!q) return USUARIOS;
  return USUARIOS.filter(u=>U(u.nombre).indexOf(q)>=0||U(u.id).indexOf(q)>=0);
}
function textoCuenta(){
  const l=vendedoresFiltrados();
  const cerrados=l.filter(a=>CIERRES[a.id]).length;
  return "Cierres recibidos ("+cerrados+" de "+l.length+")"
    +(FILTRO?" · filtrando":"");
}
function filasVendedores(){
  const l=vendedoresFiltrados();
  if(!l.length) return '<p class="vacio">Ningún vendedor coincide.</p>';
  return l.map(a=>{
    const c=CIERRES[a.id];
    const nObj=OBJETIVOS.filter(o=>U(o.agente)===U(a.id)).length;
    return '<div class="card '+(c?"cerr":"abierto")+'" onclick="abrir(\''+esc2(a.id)+'\')">'
      +'<div class="fila"><div style="min-width:0"><b>'+a.nombre+'</b><small>'
      +(c ? c.propuesto.length+" propuesto(s)"
            +(c.obviado.length?" · "+c.obviado.length+" sin contestar":"")
            +(nObj?" · "+nObj+" tuyo(s)":"")
            +(hechosDe(a.id)!==null?" · "+hechosDe(a.id)+" cumplido(s)":"")
          : "Todavía no ha cerrado")
      +'</small></div>'
      +'<span class="pill '+(c?"ok":"no")+'">'+(c?"Cerrado":"Pendiente")+'</span>'
      +'</div></div>';
  }).join("");
}

    h+='<h3>Lo que ha propuesto ('+c.propuesto.length+')</h3><div class="card">';
    h+= c.propuesto.length ? c.propuesto.map(x=>{
      const ya=OBJETIVOS.find(o=>o.claveOrigen===x.clave&&U(o.agente)===U(a.id));
      const sube=ya&&ya.escaladoA===ESCALA_A;
      const txt=(x.accion||"")+(x.texto?": "+x.texto:"");
      return '<div class="item">'
        +'<span class="tag t-'+x.tipo+'">'+(LBL[x.tipo]||x.tipo)+'</span>'
        +'<div style="display:flex;gap:9px;align-items:flex-start">'
        +'<div style="flex:1;min-width:0"><p>'
        +(x.nom?"<b>"+x.nom+"</b> — ":"")+x.accion+'</p>'
        +(x.texto?'<small>'+x.texto+'</small>':"")+'</div>'
        +(ESCALA_A?'<button class="mini '+(sube?"on":"")+'" '
          +(!sube&&es.length>=MAX?"disabled":"")
          +' onclick="escalarItem(\''+esc2(a.id)+'\',\''+esc2(x.clave)+'\',\''
          +esc2(txt)+'\',\''+esc2(x.tipo)+'\',\''+esc2(x.nom)+'\')">'
          +(sube?"✓ Sube":"Subir")+'</button>':"")
        +'</div></div>';
    }).join("") : '<p class="vacio">No ha propuesto nada.</p>';
    h+='</div>';

    // 2 · Lo que el sistema le pidió y él obvió
    h+='<h3>Se lo pidió el sistema y no contestó ('+c.obviado.length+')</h3><div class="card">';
    if(c.sinPlanteados){
      h+='<p class="vacio">Este cierre es anterior a que se guardara lo planteado, '
        +'así que no se puede saber qué obvió.</p>';
    } else {
      h+= c.obviado.length ? c.obviado.map(x=>
        '<div class="obviado">'
        +'<span class="tag t-'+(x.tipo||"otro")+'">'+(LBL[x.tipo]||x.tipo||"Otro")+'</span>'
        +'<p><b>'+(x.nom||"(sin nombre)")+'</b></p>'
        +(x.desc?'<small style="color:var(--muted)">'+x.desc+'</small>':"")
        +'</div>').join("")
        : '<p class="vacio">Contestó a todo lo que se le planteó.</p>';
    }
    h+='</div>';
  }

  // 3 · Objetivos que le has puesto tú
  h+='<h3>Objetivos que le has puesto ('+mios.length+')</h3><div class="card">';
  h+= mios.length ? mios.map(o=>{
    const sube=o.escaladoA===ESCALA_A;
    return '<div class="item">'
      +'<span class="tag t-'+(o.tipo||"otro")+'">'+(LBL[o.tipo]||"Otro")+'</span>'
      +'<div style="display:flex;gap:9px;align-items:flex-start">'
      +'<div style="flex:1;min-width:0"><p>'+(o.origen==="jefe"?"⭐ ":"")+o.texto+'</p>'
      +(o.refNombre?'<small>'+o.refNombre+' · '+(o.refCodigo||"")+'</small>'
        :(o.referencia?'<small>Ref: '+o.referencia+'</small>':""))
      +pintaSemaforo(o)+'</div>'
      +(ESCALA_A?'<button class="mini '+(sube?"on":"")+'" '
        +(!sube&&es.length>=MAX?"disabled":"")
        +' onclick="toggleEscalar(\''+esc2(o.id)+'\')">'+(sube?"✓ Sube":"Subir")+'</button>':"")
      +(U(o.creadoPor)===U(UID)
        ?'<button class="mini" onclick="editar(\''+esc2(o.id)+'\')" title="Editar">✏️</button>'
         +'<button class="mini" onclick="borrar(\''+esc2(o.id)+'\')" title="Eliminar">🗑️</button>'
        :"")
      +'</div></div>';
  }).join("") : '<p class="vacio">Todavía no le has puesto ninguno.</p>';
  h+='</div>';

  // 4 · Alta de objetivo con tipología
  const tipoAct=(document.getElementById("ob-tipo")||{}).value||"cliente";
  // Un campo de búsqueda con lupa. Si ya hay algo elegido, se muestra fijado.
  const campoBusca=(campo,lbl,sel,ph)=>{
    if(sel){
      return '<label>'+lbl+'</label>'
        +'<div class="elegido"><span>'+sel.nom
        +'<small style="display:block;font-weight:400;color:var(--muted)">'
        +sel.cod+'</small></span>'
        +'<button onclick="quitar(\''+campo+'\')" title="Quitar">✕</button></div>';
    }
    const n=campo==="prod"?PRODUCTOS.length:CLIENTES.length;
    return '<label>'+lbl+(n?' <span style="font-weight:400">('+n+')</span>':'')+'</label>'
      +'<div class="buscador">'
      +'<span class="lupa">🔍</span>'
      +'<input type="text" id="in-'+campo+'" class="conlupa" autocomplete="off"'
      +' placeholder="'+ph+'" oninput="buscarEn(\''+campo+'\',this.value)">'
      +'<div class="sug" id="sug-'+campo+'" style="display:none"></div></div>';
  };

  // Vendedor destino: por defecto el de la ficha, pero se puede cambiar
  const vendId=SEL_VEND||a.id;
  const vend=USUARIOS.find(u=>U(u.id)===U(vendId))||a;
  const campoVend=
    '<label>Vendedor</label>'
    +'<div class="elegido" style="background:var(--blueL);border-color:var(--blue)">'
    +'<span>'+vend.nombre+'<small style="display:block;font-weight:400;'
    +'color:var(--muted)">'+vend.id+(vend.equipo?" · "+vend.equipo:"")+'</small></span>'
    +'<button onclick="elegirVend(\'\')" title="Cambiar">✎</button></div>'
    +(SEL_VEND===""
      ?'<div class="buscador" style="margin-top:6px">'
       +'<span class="lupa">🔍</span>'
       +'<input type="text" class="conlupa" autocomplete="off" autofocus'
       +' placeholder="Busca un vendedor…" oninput="buscarVend(this.value)">'
       +'<div class="sug" id="sug-vend" style="display:none"></div></div>'
      :"");

  h+='<h3 id="form-obj">'+(EDITANDO?"Editar objetivo":"Añadir objetivo")+'</h3>'
    +'<div class="card"'+(EDITANDO?' style="border-color:var(--blue)"':'')+'>'
    +campoVend
    +'<label>Tipología</label><select id="ob-tipo" onchange="cambiarTipo()">'
    +TIPOS.map(t=>'<option value="'+t.k+'"'+(t.k===tipoAct?" selected":"")+'>'
      +t.lbl+'</option>').join("")
    +'</select>'
    // Si el objetivo va sobre una oferta/muestra/estrategia que ya existe,
    // se referencia la abierta en concreto en vez de describirla a mano.
    +(ABIERTOS[tipoAct]
      ? (SEL_DOC
          ? '<label>'+(LBL[tipoAct]||tipoAct)+' concreta</label>'
            +'<div class="elegido"><span>'+SEL_DOC.nom
            +'<small style="display:block;font-weight:400;color:var(--muted)">'
            +SEL_DOC.cod+'</small></span>'
            +'<button onclick="quitarDoc()" title="Quitar">✕</button></div>'
            +fichaDoc(SEL_DOC)
          : '<label>'+(LBL[tipoAct]||tipoAct)+' abierta '
            +'<span style="font-weight:400">('+(ABIERTOS[tipoAct]||[]).length
            +') — opcional</span></label>'
            +'<div class="buscador"><span class="lupa">🔍</span>'
            +'<input type="text" class="conlupa" autocomplete="off"'
            +' placeholder="Busca una '+(LBL[tipoAct]||tipoAct).toLowerCase()
            +' abierta…" oninput="buscarDoc(this.value)" onfocus="buscarDoc(this.value)">'
            +'<div class="sug" id="sug-doc" style="display:none"></div></div>')
      : "")
    // Cliente y producto son independientes: se puede indicar uno, otro o ambos
    +campoBusca("cli","Cliente",SEL_CLI,"Busca por nombre o código…")
    +campoBusca("prod","Producto",SEL_PROD,"Busca por nombre o código…")
    +'<label>Qué tiene que hacer</label>'
    +'<textarea id="ob-txt" rows="3" placeholder="Describe el objetivo para '
    +vend.nombre+'"></textarea>'
    +'<button class="btn" id="ob-btn" onclick="nuevoObjetivo(\''+esc2(a.id)
    +'\')">'+(EDITANDO?"Guardar cambios":"Añadir objetivo")+'</button>'
    +(EDITANDO?'<button class="btn" onclick="cancelarEdicion()" '
      +'style="background:#fff;border:1.5px solid var(--border);color:var(--muted)">'
      +'Cancelar</button>':"")
    +'</div>';
  return h;
}

function pintar(){
  document.getElementById("app").innerHTML =
    VISTA==="detalle" ? pintarDetalle() : pintarLista();
}

async function recargar(){
  const objs=await leer("objetivos_semana");
  OBJETIVOS=objs.filter(o=>!o.eliminado&&Number(o.semana)===SEMANA&&Number(o.anio)===ANIO);
  CIERRES=await cargarCierres();
  await comprobarCerrada();
  pintar();                       // ya se ve algo aquí
  // El seguimiento y los catálogos son pesados: se cargan detrás y se
  // repinta cuando llegan, para que la pantalla no se quede en blanco.
  cargarSeguimiento().then(pintar).catch(()=>{});
}

// Volver con el historial del navegador en vez de recargar el CRM entero:
// la app pesa varios MB y volver a montarla tarda segundos. Con history.back()
// el navegador la recupera de su caché y es casi instantáneo. Si no hay
// historial (se abrió el enlace directo), se navega a la URL como antes.
window.volverCRM=(ev)=>{
  if(ev) ev.preventDefault();
  if(window.history.length>1){ window.history.back(); }
  else { window.location.href=VUELVE; }
};

(async()=>{
  const _v=document.getElementById("volver");
  if(EMBED){ _v.style.display="none"; }
  else { _v.href=VUELVE; _v.addEventListener("click",window.volverCRM); }
  try{
    if(!UID){ document.getElementById("app").innerHTML=
      '<div class="err">Falta identificar al usuario. Entra desde el CRM.</div>'; return; }
    document.getElementById("sub").textContent =
      esJefe?("Equipo "+(EQUIPO||"")):esDir?"Todos los equipos":"Vista de dirección";
    USUARIOS=await cargarUsuarios();
    await recargar();
    cargarCatalogos().catch(()=>{});   // para los buscadores, sin bloquear
  }catch(e){
    document.getElementById("app").innerHTML=
      '<div class="err"><b>No se ha podido cargar</b><br>'+e.message
      +'<br><small>Recarga la página; si sigue, avisa.</small></div>';
    console.error("[objetivos_equipo]",e);
  }
})();

// Si algo revienta de forma inesperada, que se vea en pantalla en vez de
// dejar un "Cargando…" eterno.
window.addEventListener("error",function(ev){
  var app=document.getElementById("app");
  if(app&&/Cargando/.test(app.textContent||"")){
    app.innerHTML='<div class="err"><b>Error al cargar</b><br>'
      +(ev.message||"")+'</div>';
  }
});
</script>
