/* (sep 2026) -------------------------------------------------------------
   El consolidado del jefe subia solo palabras: cuantos compromisos habia
   cumplido cada uno. Faltaba lo unico con lo que se decide -- cifra de
   negocio, cobros, muestras y actividad contra objetivo -- y todo eso ya
   estaba en Firebase: esta pagina simplemente no lo leia nunca. Se lee una
   vez para todo el equipo y se reparte por persona.
   ------------------------------------------------------------------------ */
function lunesDeSem(anio,sem){
  const e=new Date(anio,0,4);
  const l=new Date(e); l.setDate(e.getDate()-((e.getDay()||7)-1));
  l.setDate(l.getDate()+(sem-1)*7); l.setHours(0,0,0,0);
  return l;
}
// Las fechas llegan como 2026-09-24, 24/09/2026 o un sello con hora, segun
// quien haya escrito el documento. Sin esto la mitad de la semana se pierde.
function fechaTxt(v){
  if(!v) return null;
  const s=String(v);
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let a=+m[3]; if(a<100) a+=2000; return new Date(a,+m[2]-1,+m[1]); }
  const d=new Date(s);
  return isNaN(d.getTime())?null:d;
}
function fechaDoc(o){
  for(const c of ["fecha","fechaCreacion","creadoEl","fechaAlta",
                  "fechaSolicitud","createdAt","fechaEnvio"]){
    const d=fechaTxt(o[c]); if(d) return d;
  }
  return null;
}
const esLlamada=(r)=>/llamada|no_contesta/i.test(String(r||""));

async function datosDelEquipo(){
  const lunes=lunesDeSem(ANIO,SEMANA);
  const domingo=new Date(lunes); domingo.setDate(lunes.getDate()+6);
  domingo.setHours(23,59,59,999);
  // El mes es el de la semana que se cierra, no el de hoy: la 31 acabo el 2
  // de agosto pero es de julio. Manda el jueves, que es el criterio ISO.
  const jueves=new Date(lunes); jueves.setDate(lunes.getDate()+3);
  const mNum=jueves.getMonth()+1;
  // Ventana de comparacion de la conversion: los 30 dias previos a la semana
  const hace30=new Date(lunes); hace30.setDate(lunes.getDate()-30);

  const [res,ent,cob,estac,objs,objEq,mues,vis,sems]=await Promise.all([
    leer("pbi_resumen_agente"), leer("pbi_entrada_agente"), leer("cobros_comercial"),
    leer("pbi_estacionalidad"), leer("pbi_objetivos"), leer("objetivos_equipo"),
    leer("muestras"), leer("visitas"),
    // Foto de cada semana cerrada: para saber si alguien lleva varias
    // semanas seguidas hundido o es un bache puntual.
    leer("pbi_semanas").catch(()=>[]),
  ]);
  // La foto se guarda como "2026-W40": se saca año y numero de semana
  const semDe=(x)=>{ const t=String(x.semana||x._id||""); const m=t.match(/(\d{4})-W(\d{1,2})/);
    return m?{a:+m[1],s:+m[2]}:{a:ANIO,s:Number(t)||0}; };
  const idxS=(x)=>{ const d=semDe(x); return d.a*100+d.s; };
  const semsPrev=sems.filter(x=>idxS(x)<ANIO*100+SEMANA)
    .sort((a,b)=>idxS(b)-idxS(a)).slice(0,4)
    .map(x=>{ let ag=[]; try{ ag=JSON.parse(x.agentes||"[]"); }catch(e){} return ag; });

  const num=(x)=>Number(x||0)||0;
  const enSem=(d)=>d&&d>=lunes&&d<=domingo;
  // Un documento por comercial: se busca por cualquiera de sus identidades,
  // que es justo lo que resuelve agentes_alias.
  // Todos sus codigos, tambien los de fichas unidas por nombre
  const codsDe=(u)=>[...new Set([u.cod,u.id,...(u.alias||[])].map(U).filter(Boolean))];
  const casa=(v,u)=>!!v&&codsDe(u).some(c=>Agentes.mismo(v,c));
  const suyo=(lista,u)=>lista.find(x=>
    casa(x._id,u)||casa(x.id,u)||casa(x.agente,u)||casa(x.comercial,u)||
    Agentes.mismo(x.comercialNombre,u.nombre))||{};
  // (sep 2026) pbi_resumen_agente solo tiene la semana EN CURSO: el lunes ya
  // es la siguiente y las cifras de la que se cierra salian a 0. Para una
  // semana pasada se usa la foto que se congela al cerrarla (pbi_semanas);
  // si no la hay y es la anterior, ventasSemAnt.
  const semHoy=semanaISO(new Date());
  const esPasada=SEMANA<semHoy;
  const fotoSem=(()=>{ const d=sems.find(x=>idxS(x)===ANIO*100+SEMANA);
    try{ return d?JSON.parse(d.agentes||"[]"):null; }catch(e){ return null; } })();
  const deQuien=(doc,u)=>Agentes.esDe(doc,u.cod)||Agentes.esDe(doc,u.id);

  // Objetivos de actividad: se fijan por equipo y por mes en la Sala de
  // Mandos. Aqui se reparten a la semana que se cierra.
  const oe=objEq.find(o=>U(o.equipo)===EQUIPO)
        ||objEq.find(o=>U(o.equipo)==="TODOS")||{};
  const objSem=(k)=>Math.max(0,Math.round(num(oe[k])*7/30));
  const OBJ_ACT={visitas:objSem("visitas"), llamadas:objSem("llamadas"),
    muestras:objSem("muestras"), muestrasOk:objSem("muestrasOk"),
    ofertas:objSem("ofertas"), clientesNuevos:objSem("clientesNuevos")};

  const hoyISO=new Date().toISOString().slice(0,10);
  const T={vSem:0,objSemE:0,mAct:0,mObj:0,cobros:0,nFacV:0,
    t30:0,t60:0,t90:0,t90mas:0,peor:{cli:"",imp:0,dias:0},
    vis:0,lla:0,nuevos:0,
    mEnv:0,mOk:0,mKo:0,mPend:0,mOkAnt:0,mResAnt:0,
    rechazos:[],sinRespuesta:[]};
  const PP={};   // por persona, indexado por u.id

  for(const u of USUARIOS){
    const p={vSem:0,objSem:0,mAct:0,mObj:0,cobros:0,nFacV:0,
      vis:0,lla:0,mEnv:0,mOk:0};

    // --- Cifra de negocio -------------------------------------------------
    const r=suyo(res,u), e2=suyo(estac,u), o2=suyo(objs,u);
    p.vSem=num(r.ventasSem);
    let fSem=null;
    if(esPasada){
      fSem=fotoSem?fotoSem.find(x=>casa(x.id,u)||casa(x.agente,u)):null;
      p.vSem=fSem?num(fSem.ventasSem):(SEMANA===semHoy-1?num(r.ventasSemAnt):0);
    }
    p.mAct=num(e2["act_"+mNum]);
    p.mObj=num(o2["mes_"+mNum]);
    if(!p.mObj){
      // Sin objetivo del mes se reparte el anual con el peso que tuvo ese mes
      // el año pasado; si tampoco hay peso, a doceavas partes.
      const anual=num(o2.objAnual);
      p.mObj=anual*(num(e2["peso_"+mNum])||1/12);
    }
    p.objSem=p.mObj?p.mObj/4.33:0;
    // Margen de la semana contra su objetivo de margen (lo publica pbi-sync)
    p.mg=(r.margenPctSem!=null&&r.margenPctSem!=="")?num(r.margenPctSem):null;
    if(esPasada) p.mg=(fSem&&num(fSem.baseSem))?num(fSem.margenSem)/num(fSem.baseSem)*100:null;
    p.mgObj=num(r.objetivoMargen)||num(fSem&&fSem.objetivoMargen)||null;
    p.vMes=num(r.ventasMes)||p.mAct;
    // Politica de cobro: vencido <= 5 % de la venta de los dos ultimos meses cerrados
    p.v2m=[mNum-1,mNum-2].reduce((t,k)=>t+(k>=1?num(e2["act_"+k]):num(e2["mes_"+(k+12)])),0);
    p.limite=p.v2m*0.05;
    // Semanas previas: cuantas seguidas por debajo del 50 % de su objetivo
    p.semMal=0;
    for(const ag of semsPrev){
      const f=ag.find(x=>casa(x.id,u)||casa(x.agente,u));
      if(f&&p.objSem&&num(f.ventasSem)<p.objSem*0.5) p.semMal++; else break;
    }

    // --- Cobros: se recalculan contra hoy, no se fia del total publicado ---
    const c=suyo(cob,u);
    try{
      for(const cli of JSON.parse(c.datos||"[]")){
        for(const f of (cli.f||[])){
          if(!f.fv||f.fv>hoyISO) continue;
          const imp=num(f.im); p.cobros+=imp; p.nFacV++;
          const dias=Math.round((Date.now()-new Date(f.fv).getTime())/86400000);
          if(dias<=30) T.t30+=imp; else if(dias<=60) T.t60+=imp;
          else if(dias<=90) T.t90+=imp; else T.t90mas+=imp;
          if(imp>T.peor.imp) T.peor={cli:cli.c||"",imp:imp,dias:dias};
        }
      }
    }catch(err){ p.cobros=num(c.totalVencido); p.nFacV=num(c.nFacturas); }
    // (sep 2026) Carga de la pestaña TODOS: saldos por cliente, sin facturas
    if(c.fuente==="TODOS"){
      p.cobros=num(c.totalVencido); p.nFacV=0; T.todos=true;
      try{ for(const cli of JSON.parse(c.datos||"[]")){
        const v=num(cli.ven); if(v<1) continue; p.nFacV++;
        T.tV=(T.tV||0)+v; T.t20=(T.t20||0)+num(cli.v20); T.t70=(T.t70||0)+num(cli.v70);
        if(v>T.peor.imp) T.peor={cli:cli.c||"",imp:v,tramo:num(cli.v70)>=1?"más de 70 días":num(cli.v20)>=1?"+20 días":"menos de 20 días"};
      } }catch(e){}
    }

    // --- Actividad ---------------------------------------------------------
    for(const v of vis){
      if(v.eliminada||!deQuien(v,u)||!enSem(fechaDoc(v))) continue;
      if(esLlamada(v.resultado||v.tipo)) p.lla++; else p.vis++;
    }

    // --- Muestras ----------------------------------------------------------
    for(const m of mues){
      if(m.eliminada||!deQuien(m,u)) continue;
      const est=String(m.estado||"").toLowerCase();
      const fFb=fechaTxt(m.fechaFeedback);
      if(enSem(fechaDoc(m))){ p.mEnv++; T.mEnv++; }
      if(enSem(fFb)){
        if(/pedido|positiv|aceptada|proyecto/.test(est)){ p.mOk++; T.mOk++; }
        else if(/ko|negativ|rechazada/.test(est)){
          T.mKo++;
          T.rechazos.push({cli:m.cliente||m.clienteNombre||"(sin cliente)",
            prod:m.prod||m.prodNombre||"", motivo:m.motivo||m.nota||"Sin motivo",
            quien:u.nombre});
        }
      } else if(fFb&&fFb>=hace30&&fFb<lunes){
        // Mes anterior, solo para saber si la conversion sube o baja
        if(/pedido|positiv|aceptada|proyecto/.test(est)){ T.mOkAnt++; T.mResAnt++; }
        else if(/ko|negativ|rechazada/.test(est)) T.mResAnt++;
      }
      if(!fFb&&!/proyecto|rechazada/.test(est)){
        T.mPend++;
        const fe=fechaDoc(m);
        if(fe&&(lunes-fe)/86400000>21)
          T.sinRespuesta.push(m.cliente||m.clienteNombre||"(sin cliente)");
      }
    }

    T.vSem+=p.vSem; T.objSemE+=p.objSem; T.mAct+=p.mAct; T.mObj+=p.mObj;
    T.cobros+=p.cobros; T.nFacV+=p.nFacV; T.vis+=p.vis; T.lla+=p.lla;
    PP[u.id]=p;
  }
  T.sinRespuesta=[...new Set(T.sinRespuesta)].slice(0,6);
  T.rechazos=T.rechazos.slice(0,6);
  return {T,PP,OBJ_ACT,objEq};
}

async function enviarConsolidado(es){
  const _v=(f)=>f==null?null:(f.stringValue!==undefined?f.stringValue:
    f.doubleValue!==undefined?Number(f.doubleValue):null);
  const leerFichas=async(col)=>{
    const r=await fetch(FB+"/"+col+"?pageSize=300"); if(!r.ok) return [];
    const j=await r.json();
    return (j.documents||[]).map(d=>{
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,v] of Object.entries(d.fields||{})) o[k]=_v(v);
      return o; });
  };
  const [us,pu]=await Promise.all([leerFichas("usuarios"),leerFichas("portal_users")]);
  const yo=us.find(u=>U(u._id)===U(UID))||{};
  const miNombre=yo.nombre||AGENTE;

  // Destinatarios: su superior directo (a quien reporte, o el director) y,
  // mientras dure la prueba, tambien el CEO.
  const CEO_RECIBE_CONSOLIDADOS=true;
  const dest=new Set();
  if(yo.reportaA) dest.add(yo.reportaA);
  if(!dest.size) us.forEach(u=>{ const r=String(u.rol||"").toLowerCase();
    if(r==="director"||r==="crm_director") dest.add(u._id); });
  if(!dest.size||CEO_RECIBE_CONSOLIDADOS) us.forEach(u=>{
    if(String(u.rol||"").toLowerCase()==="ceo") dest.add(u._id); });
  dest.delete(yo._id);

  const escH=(t)=>String(t||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

  // Si algo falla leyendo las cifras el cierre no se bloquea: sale el correo
  // de siempre, sin los bloques nuevos.
  let D=null;
  try{ D=await datosDelEquipo(); }catch(err){ console.warn("[consolidado] sin cifras:",err); }
  const T=D&&D.T, PP=(D&&D.PP)||{}, OBJ_ACT=(D&&D.OBJ_ACT)||{};
  // (sep 2026) Plan de recuperación del equipo, para el comité del viernes
  let CR=[];
  try{ if(window.RC) CR=(await RC.leerCasos()).filter(c=>!RC.esFrancia(c.equipo)
    &&(esDir||!EQUIPO||U(c.equipo)===EQUIPO||U(c.equipo).includes(EQUIPO))); }catch(e){}
  // toLocaleString("es-ES") no separa los miles con 4 cifras ("4100 €")
  const eur=(n)=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €";
  const pcT=(a,b)=>b?Math.round(a/b*100):null;
  const colT=(p)=>p==null?"#6B7684":(p>=100?"#0E7C5A":p>=80?"#B07908":"#C2263D");

  const blqCifras=()=>{
    if(!T||(!T.vSem&&!T.mAct&&!T.cobros)) return "";
    const tar=(tit,v,s,c)=>`<td style="padding:0 4px;width:33.3%;vertical-align:top">
      <div style="background:#F7F9FB;border-radius:10px;padding:11px 12px">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8A94A0;font-weight:700">${tit}</div>
        <div style="font-size:18px;font-weight:800;margin-top:2px;color:${c}">${v}</div>
        <div style="font-size:10.5px;color:#6B7684">${s}</div></div></td>`;
    const pS=pcT(T.vSem,T.objSemE), pM=pcT(T.mAct,T.mObj);
    return `<table style="width:100%;border-collapse:separate;border-spacing:0;margin:0 -4px 4px"><tr>
      ${tar("Semana",eur(T.vSem),pS!=null?pS+" % del objetivo":"sin objetivo",colT(pS))}
      ${tar("Mes",eur(T.mAct),pM!=null?pM+" % del objetivo":"sin objetivo",colT(pM))}
      ${tar("Fuera de plazo",eur(T.cobros),T.nFacV+(T.todos?" clientes":" facturas"),"#C2263D")}
    </tr></table>`;
  };

  const barra=(real,obj,col)=>{
    const w=Math.min(100,obj?Math.round(real/obj*100):0);
    return `<div style="background:#EEF1F5;border-radius:99px;height:7px;overflow:hidden">
      <div style="background:${col};width:${w}%;height:7px;border-radius:99px"></div></div>`;
  };

  const blqActividad=()=>{
    if(!T) return "";
    const fs=[
      {ic:"👋",l:"Visitas",real:T.vis,obj:objEquipo("visitas")},
      {ic:"📞",l:"Llamadas",real:T.lla,obj:objEquipo("llamadas")},
      {ic:"📦",l:"Muestras env.",real:T.mEnv,obj:objEquipo("muestras")},
      {ic:"✅",l:"Muestras ok",real:T.mOk,obj:objEquipo("muestrasOk")},
    ].filter(f=>f.obj||f.real);
    if(!fs.length) return "";
    const sinObj=fs.some(f=>!f.obj);
    return `<h3 style="margin:22px 0 6px;font-size:14px">Actividad comercial</h3>
      <table style="width:100%;border-collapse:collapse">
        ${fs.map(f=>{ const p=pcT(f.real,f.obj), c=colT(p);
          return `<tr>
            <td style="padding:7px 0;font-size:12.5px;white-space:nowrap">${f.ic} ${f.l}</td>
            <td style="padding:7px 8px;width:60%">${barra(f.real,f.obj,c)}</td>
            <td style="padding:7px 0;text-align:right;white-space:nowrap">
              <span style="font-size:13px;font-weight:800">${f.real}</span>
              ${f.obj?`<span style="font-size:11.5px;color:#8A94A0">/${f.obj}</span>
                <span style="font-size:11.5px;font-weight:700;color:${c}"> ${p} %</span>`:""}
            </td></tr>`;}).join("")}
      </table>
      <div style="font-size:11.5px;color:#8A94A0;margin-top:5px">
        ${sinObj?"Falta fijar el objetivo en Administración → 🎯 Objetivos."
                :"Objetivo de cada comercial (Administración → 🎯 Objetivos) llevado a la semana."}</div>`;
  };

  const blqMuestras=()=>{
    if(!T||(!T.mEnv&&!T.mOk&&!T.mKo&&!T.mPend)) return "";
    const res=T.mOk+T.mKo;
    const conv=res?Math.round(T.mOk/res*100):null;
    const convAnt=T.mResAnt?Math.round(T.mOkAnt/T.mResAnt*100):null;
    const dif=(conv!=null&&convAnt!=null)?conv-convAnt:null;
    const cj=(n,l,c,bg)=>`<td style="padding:0 4px;width:25%;vertical-align:top">
      <div style="background:${bg};border-radius:9px;padding:9px 10px;text-align:center">
        <div style="font-size:20px;font-weight:800;color:${c};line-height:1.1">${n}</div>
        <div style="font-size:10.5px;color:#6B7684">${l}</div></div></td>`;
    return `<h3 style="margin:22px 0 6px;font-size:14px">Muestras</h3>
      <table style="width:100%;border-collapse:separate;border-spacing:0;margin:0 -4px"><tr>
        ${cj(T.mEnv,"enviadas","#14181F","#F7F9FB")}
        ${cj(T.mOk,"aceptadas","#0E7C5A","#F0FDF4")}
        ${cj(T.mKo,"rechazadas","#C2263D","#FEF2F2")}
        ${cj(T.mPend,"sin respuesta","#B07908","#FFFBEB")}
      </tr></table>
      ${conv!=null?`<div style="margin-top:9px;padding:9px 12px;background:#F7F9FB;border-radius:9px">
        <table style="width:100%"><tr>
          <td style="font-size:12.5px;color:#3A424E">Conversión de las resueltas</td>
          <td style="text-align:right;font-size:14px;font-weight:800">${conv} %
            ${dif!=null?(dif===0?`<span style="font-size:11.5px;color:#8A94A0">igual que el mes pasado</span>`
              :`<span style="font-size:11.5px;font-weight:700;color:${dif>0?"#0E7C5A":"#C2263D"}">
              ${dif>0?"▲":"▼"} ${Math.abs(dif)} pts vs mes pasado</span>`):""}</td>
        </tr></table></div>`:""}
      ${T.rechazos.length?`<div style="margin-top:10px">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#8A94A0;
          font-weight:700;margin-bottom:5px">Por qué nos han dicho que no</div>
        ${T.rechazos.map(r=>`<div style="border-left:3px solid #C2263D;padding:5px 0 5px 11px;margin-bottom:7px">
          <div style="font-size:12.5px;font-weight:700">${escH(r.cli)}
            ${r.prod?`<span style="font-weight:400;color:#8A94A0"> · ${escH(r.prod)}</span>`:""}</div>
          <div style="font-size:12px;color:#3A424E;font-style:italic">“${escH(r.motivo)}”</div>
          <div style="font-size:11px;color:#8A94A0">${escH(r.quien)}</div>
        </div>`).join("")}</div>`:""}
      ${T.sinRespuesta.length?`<div style="margin-top:6px;font-size:12px;color:#B07908">
        ⏳ Sin respuesta hace más de 3 semanas: ${T.sinRespuesta.map(escH).join(" · ")}</div>`:""}`;
  };

  const blqCobros=()=>{
    if(!T||!T.cobros) return "";
    const tot=T.todos?(T.tV||0):T.t30+T.t60+T.t90+T.t90mas;
    if(!tot) return "";
    const tr=(l,v,c)=>`<tr>
      <td style="padding:6px 0;font-size:12.5px;white-space:nowrap">${l}</td>
      <td style="padding:6px 8px;width:70%">${barra(v,tot,c)}</td>
      <td style="padding:6px 0;text-align:right;font-size:12.5px;font-weight:800;white-space:nowrap">${eur(v)}</td>
    </tr>`;
    const lim=Object.values(PP).reduce((t,p)=>t+(p.limite||0),0);
    const fuera=USUARIOS.map(a=>({a,p:PP[a.id]})).filter(x=>x.p&&x.p.limite&&x.p.cobros>x.p.limite)
      .sort((x,y)=>y.p.cobros/y.p.limite-x.p.cobros/x.p.limite);
    const pol=lim?`<div style="margin:8px 0 10px;padding:9px 12px;border-radius:9px;
        background:${T.cobros<=lim?"#F0FDF4":"#FEF2F2"};color:${T.cobros<=lim?"#0E7C5A":"#C2263D"};font-size:12.5px">
        <b>${T.cobros<=lim?"✅ Equipo dentro de política":"⚠️ Equipo fuera de política"}</b> ·
        ${Math.round(T.cobros/lim*100)} % de lo permitido (${eur(lim)}, 5 % de la venta de dos meses)
        ${fuera.length?`<div style="margin-top:4px;color:#334155">Fuera: ${fuera.map(x=>escH(x.a.nombre)+" "+Math.round(x.p.cobros/x.p.limite*100)+" %").join(" · ")}</div>`:""}
      </div>`:"";
    return `<h3 style="margin:22px 0 4px;font-size:14px">Cobros pendientes</h3>${pol}
      <div style="font-size:11.5px;color:#8A94A0;margin-bottom:6px">${eur(tot)} fuera de plazo ·
        ${T.nFacV} ${T.todos?"clientes":"facturas"}${T.peor.imp?` · la mayor: ${escH(T.peor.cli)} ${eur(T.peor.imp)} (${T.peor.tramo||T.peor.dias+" días"})`:""}</div>
      <table style="width:100%;border-collapse:collapse">
        ${T.todos?tr("Fuera de plazo",T.tV||0,"#B07908")+tr("+20 días",T.t20||0,"#E0803C")+tr("Más de 70 días",T.t70||0,"#8B1230")
          :tr("1–30 d",T.t30,"#B07908")+tr("31–60 d",T.t60,"#E0803C")+tr("61–90 d",T.t90,"#C2263D")+tr("+90 d",T.t90mas,"#8B1230")}
      </table>`;
  };

  // Objetivo de actividad por cabeza: el del equipo entre los que trabajan
  // esta semana. Si no, quien esta de vacaciones hunde la media de todos.
  const activos=USUARIOS.filter(a=>{
    const i=(CIERRES[a.id]||{}).info||{};
    return !(i.estado==="ausente"||(CIERRES[a.id]||{}).ausente);
  }).length||1;
  // (sep 2026) El objetivo se fija ahora por comercial y mes en la zona admin
  // (🎯 Objetivos), con un perfil para WIKUK, otro para Key Account y otro
  // para telefonicos. Si un equipo aun tiene el objetivo antiguo, del equipo
  // entero, se sigue repartiendo entre los que trabajan.
  const OBJEQ=(D&&D.objEq)||[];
  const docPerfil=(clave)=>OBJEQ.find(o=>U(o.equipo)===clave&&(o.porPersona===true||o.porPersona==="true"))||null;
  function objPersonaDe(a,k){
    const d=(a&&a.perfil==="telefonico"&&docPerfil("TELEFONICO"))||docPerfil(U(a&&a.equipo)||EQUIPO)||docPerfil(EQUIPO);
    if(d){ const m=Number(d[k]||0); return m?Math.max(1,Math.round(m*7/30)):0; }
    return Math.max(0,Math.round((OBJ_ACT[k]||0)/activos));
  }
  // Objetivo del equipo esta semana: la suma de los de quienes trabajan
  function objEquipo(k){
    return USUARIOS.filter(a=>{ const i=(CIERRES[a.id]||{}).info||{};
      return !(i.estado==="ausente"||(CIERRES[a.id]||{}).ausente); })
      .reduce((t,a)=>t+objPersonaDe(a,k),0);
  }

  // Nota de cada uno, ponderada como la mira un controller: lo que vende
  // pesa mas que lo que se mueve, y lo que no se cobra no es venta.
  //   venta 40 · margen 20 · actividad 25 · cobro 15
  // Si falta un componente (sin objetivo de margen, p.ej.) se reparte su
  // peso entre los demas en vez de contarlo como cero.
  const tope=(x)=>Math.max(0,Math.min(150,x));
  function componentes(a){
    const p=PP[a.id]; if(!p) return null;
    const c={};
    if(p.objSem) c.venta=tope(p.vSem/p.objSem*100);
    if(p.mg!=null&&p.mgObj) c.margen=tope(p.mg/p.mgObj*100);
    const act=[];
    if(objPersonaDe(a,"visitas")) act.push(tope(p.vis/objPersonaDe(a,"visitas")*100));
    if(objPersonaDe(a,"llamadas")) act.push(tope(p.lla/objPersonaDe(a,"llamadas")*100));
    if(act.length) c.actividad=act.reduce((x,y)=>x+y,0)/act.length;
    // Cobro: 100 si no debe nada; resta lo que pesa el vencido sobre su venta del mes
    // Cobro: 100 si esta dentro de politica; si no, lo que le cabe entre lo que debe
    if(p.limite) c.cobro=p.cobros<=p.limite?100:tope(p.limite/p.cobros*100);
    else if(p.vMes||p.cobros) c.cobro=tope(100-(p.vMes?p.cobros/p.vMes*100:100));
    return c;
  }
  const PESOS={venta:40,margen:20,actividad:25,cobro:15};
  function notaDe(a){
    const c=componentes(a); if(!c) return null;
    let sum=0,pes=0;
    for(const k in PESOS) if(c[k]!=null){ sum+=c[k]*PESOS[k]; pes+=PESOS[k]; }
    return pes?Math.round(sum/pes):null;
  }
  // Lo que el numero solo no dice: el mismo 80 % puede ser cuatro problemas
  // distintos, y cada uno pide una conversacion distinta.
  function senalesDe(a){
    const p=PP[a.id], c=componentes(a)||{}, out=[];
    if(!p) return out;
    if(p.semMal>=2) out.push("🔻 "+(p.semMal+1)+"ª semana seguida por debajo del 50 %");
    if(c.venta>=95&&c.actividad!=null&&c.actividad<75)
      out.push("🏛 vende sin moverse: "+Math.round(c.venta)+" % venta con "+Math.round(c.actividad)
        +" % actividad. Cartera heredada, no prospecta");
    if(c.actividad>=90&&c.venta!=null&&c.venta<70)
      out.push("🔁 mucha actividad, poca venta: "+Math.round(c.actividad)+" % actividad y "
        +Math.round(c.venta)+" % venta. Eficacia, no esfuerzo");
    if(p.limite&&p.cobros>p.limite)
      out.push("💸 fuera de política de cobro: "+eur(p.cobros)+" vencidos, "+Math.round(p.cobros/p.limite*100)
        +" % de lo permitido ("+eur(p.limite)+")");
    else if(!p.limite&&p.cobros>=5000&&p.vMes&&p.cobros/p.vMes>0.2)
      out.push("💸 cobra tarde: "+eur(p.cobros)+" fuera de plazo, "+p.nFacV+(T.todos?" clientes":" facturas"));
    if(p.mg!=null&&p.mgObj&&p.mg<p.mgObj-3)
      out.push("📉 vende barato: margen "+p.mg.toFixed(1).replace(".",",")+" % con objetivo "
        +p.mgObj.toFixed(1).replace(".",",")+" %");
    return out;
  }

  let nCerr=0,nAus=0,totProm=0,totCumpl=0,totRiesgo=0;
  const notas=[];
  const filas=USUARIOS.map(a=>{
    const c=CIERRES[a.id]||{};
    const info=c.info||{};
    if(info.estado==="ausente"||c.ausente){
      nAus++;
      return `<div style="border-left:3px solid #94A3B8;padding:8px 0 8px 12px;margin-bottom:8px">
        <div style="font-size:13.5px;font-weight:800">${escH(a.nombre)}</div>
        <div style="font-size:12px;color:#64748B">🌴 ${escH(info.ausenteMotivo||"Ausente")}</div></div>`;
    }
    nCerr++;
    let R={}; try{ R=JSON.parse(info.respuestas||"{}"); }catch(e){}
    const prom=Object.entries(R).filter(([k,v])=>k.startsWith("promesa:")&&(v.accion||v.texto));
    const cumpl=prom.filter(([k,v])=>/fue bien|lo hice/i.test(v.accion||"")).length;
    const riesgo=Object.entries(R).filter(([k,v])=>k.startsWith("cliente:")&&(v.accion||v.texto)).length;
    const cerr=Object.values(R).filter(v=>v&&v.cierra).length;
    totProm+=prom.length; totCumpl+=cumpl; totRiesgo+=riesgo;
    const como=(R.semana||{}).texto||"", prio=(R.prioridad||{}).texto||"";
    const p=PP[a.id], nota=notaDe(a);
    if(nota!=null) notas.push({nombre:a.nombre,nota:nota,p:p,
      act:(componentes(a)||{}).actividad,sig:senalesDe(a)});
    const pV=p&&p.objSem?pcT(p.vSem,p.objSem):null;
    const col=nota!=null?colT(nota)
      :(prom.length&&cumpl<prom.length/2?"#C2263D":(riesgo?"#B07908":"#0E7C5A"));
    return `<div style="border-left:3px solid ${col};padding:8px 0 8px 12px;margin-bottom:11px">
      <table style="width:100%;border-collapse:collapse"><tr>
        <td style="vertical-align:top">
          <div style="font-size:13.5px;font-weight:800">${escH(a.nombre)}</div>
          <div style="font-size:12px;color:#64748B">${prom.length?cumpl+" de "+prom.length+" compromisos":"sin compromisos"}${riesgo?" · "+riesgo+" en riesgo":""}${cerr?" · "+cerr+" cerradas":""}</div>
        </td>
        ${p?`<td style="text-align:right;vertical-align:top;white-space:nowrap">
          <div style="font-size:14px;font-weight:800">${eur(p.vSem)}</div>
          ${pV!=null?`<div style="font-size:11px;font-weight:700;color:${colT(pV)}">${pV} % semana</div>`:""}
          ${p.mAct||p.mObj?`<div style="font-size:11px;color:#64748B;margin-top:2px">mes ${eur(p.mAct)}${p.mObj?` · <b style="color:${colT(pcT(p.mAct,p.mObj))}">${pcT(p.mAct,p.mObj)} %</b>`:""}</div>`:""}
        </td>`:""}
      </tr></table>
      ${p?`<div style="font-size:11.5px;color:#64748B;margin-top:4px">
        👋 ${p.vis}${objPersonaDe(a,"visitas")?"/"+objPersonaDe(a,"visitas"):""} visitas ·
        📞 ${p.lla}${objPersonaDe(a,"llamadas")?"/"+objPersonaDe(a,"llamadas"):""} llamadas ·
        📦 ${p.mEnv} muestras${p.mOk?" ("+p.mOk+" ok)":""}
        ${p.cobros?` · <span style="color:${p.limite&&p.cobros<=p.limite?"#0E7C5A":"#C2263D"}">${eur(p.cobros)} vencido${p.limite?" ("+Math.round(p.cobros/p.limite*100)+" % del permitido)":""}</span>`:""}</div>`:""}
      ${como?`<div style="font-size:12.5px;color:#334155;margin-top:4px">${escH(como)}</div>`:""}
      ${prio?`<div style="font-size:12px;color:#92400E;margin-top:3px">📌 ${escH(prio)}</div>`:""}
    </div>`;
  }).join("");

  // Quien tira y quien falla: mismo formato que el informe de direccion,
  // para que jefe y CEO miren el mismo numero de la misma persona.
  const blqRanking=()=>{
    if(!notas.length) return "";
    const orden=notas.slice().sort((x,y)=>y.nota-x.nota);
    const flojos=orden.filter(x=>x.nota<80);
    const media=Math.round(orden.reduce((t,x)=>t+x.nota,0)/orden.length);
    const mgs=orden.filter(x=>x.p&&x.p.mg!=null);
    const mgEq=mgs.length?(mgs.reduce((t,x)=>t+x.p.mg*(x.p.vSem||1),0)
      /mgs.reduce((t,x)=>t+(x.p.vSem||1),0)):null;
    const fila=(x,i)=>`<tr>
      <td style="padding:6px 0;border-top:1px solid #EEF1F5;width:22px;font-size:12px;color:#8A94A0;vertical-align:top">${i===0?"🥇":i+1}</td>
      <td style="padding:6px 0;border-top:1px solid #EEF1F5;vertical-align:top">
        <div style="font-size:12.5px;font-weight:${i===0?800:600}">${escH(x.nombre)}</div>
        <div style="font-size:10.5px;color:#8A94A0">${eur(x.p.vSem)}${x.p.mg!=null?" · mg "+x.p.mg.toFixed(1).replace(".",",")+" %":""}${x.act!=null?" · act. "+Math.round(x.act)+" %":""}</div>
        ${x.sig.map(t=>`<div style="font-size:11px;color:#7A4E06;margin-top:2px">${escH(t)}</div>`).join("")}</td>
      <td style="padding:6px 0 6px 10px;border-top:1px solid #EEF1F5;text-align:right;
        font-size:13px;font-weight:800;color:${colT(x.nota)};white-space:nowrap;vertical-align:top">${x.nota} %</td>
    </tr>`;
    return `<h3 style="margin:22px 0 2px;font-size:14px">Quién tira y quién falla</h3>
      <div style="font-size:11.5px;color:#8A94A0;margin-bottom:8px">Nota = venta 40 · margen 20 · actividad 25 · cobro 15. Y lo que el número solo no dice.</div>
      <div style="border:1px solid #DCE1E7;border-radius:11px;padding:12px 14px">
        <table style="width:100%;border-collapse:collapse;margin-bottom:2px"><tr>
          <td><div style="font-size:13.5px;font-weight:800">${escH(EQUIPO)}</div>
            <div style="font-size:11px;color:#8A94A0">${escH(miNombre)}${mgEq!=null?" · margen "+mgEq.toFixed(1).replace(".",",")+" %":""}</div></td>
          <td style="text-align:right;white-space:nowrap">
            <div style="font-size:15px;font-weight:800;color:${colT(media)}">${media} %</div>
            <div style="font-size:10.5px;color:#8A94A0">media del equipo</div></td></tr></table>
        <table style="width:100%;border-collapse:collapse">${orden.map(fila).join("")}</table>
        <div style="margin-top:8px;font-size:12px;padding:6px 10px;border-radius:8px;
          background:${flojos.length?"#FEF2F2":"#F0FDF4"};color:${flojos.length?"#C2263D":"#0E7C5A"}">
          ${flojos.length?"⚠️ Por debajo del 80 %: <b>"+flojos.map(x=>escH(x.nombre)+" ("+x.nota+" %)").join(", ")+"</b>":"✅ Nadie por debajo del 80 %"}</div>
      </div>`;
  };

  const blqRecup=()=>{
    if(!window.RC||!CR.length) return "";
    const r=RC.resumen(CR), ab=CR.filter(RC.abierto);
    const semR=RC.semanaISO(new Date());
    const conAvance=(c)=>(c.historial||[]).some(x=>x.sem===semR&&!x.sistema);
    const g={}; ab.forEach(c=>(g[U(c.agente)]=g[U(c.agente)]||[]).push(c));
    const filasR=Object.entries(g).sort((a,b)=>b[1].reduce((t,c)=>t+(+c.perdido||0),0)-a[1].reduce((t,c)=>t+(+c.perdido||0),0))
      .map(([a,l])=>{
        const sinP=l.filter(c=>!RC.tienePlan(c)&&c.estado!=="propuesta_archivo").length;
        const sinA=l.filter(c=>RC.tienePlan(c)&&!conAvance(c)).length;
        const ag=(typeof USUARIOS!=="undefined"?USUARIOS:[]).find(u=>U(u.id)===a||U(u.grupoAgente)===a);
        return `<tr><td style="padding:6px 0;border-top:1px solid #EEF1F5;font-size:12.5px;font-weight:700">${escH(ag?ag.nombre:a)}
          <div style="font-size:10.5px;color:#8A94A0;font-weight:400">${l.length} casos${sinP?` · <span style="color:#C2263D">${sinP} sin plan</span>`:""}${sinA?` · <span style="color:#C2263D">${sinA} sin avance</span>`:""}</div></td>
          <td style="padding:6px 0;border-top:1px solid #EEF1F5;text-align:right;font-size:13px;font-weight:800;color:#C2263D;white-space:nowrap">−${eur(l.reduce((t,c)=>t+(+c.perdido||0),0))}</td></tr>`;
      }).join("");
    const top=ab.slice().sort((a,b)=>(+b.perdido||0)-(+a.perdido||0)).slice(0,5);
    const colN={1:"#16A34A",2:"#D97706",3:"#DC2626"};
    return `<h3 style="margin:22px 0 2px;font-size:14px">🚨 Plan de recuperación</h3>
      <div style="font-size:11.5px;color:#8A94A0;margin-bottom:8px">Clientes en caída del equipo, para el comité del viernes.</div>
      <table style="width:100%;border-collapse:separate;border-spacing:0;margin:0 -4px 6px"><tr>
        ${[["En riesgo",eur(r.enRiesgo),"#C2263D"],["Sin plan",r.sinPlan,r.sinPlan?"#C2263D":"#0E7C5A"],
           ["Parados +14 d",r.parados,r.parados?"#C2263D":"#0E7C5A"],["Recuperados",r.recuperados,"#0E7C5A"]]
          .map(([t,v,c])=>`<td style="padding:0 4px;width:25%;vertical-align:top"><div style="background:#F7F9FB;border-radius:10px;padding:9px 10px">
            <div style="font-size:9.5px;text-transform:uppercase;color:#8A94A0;font-weight:700">${t}</div>
            <div style="font-size:15px;font-weight:800;color:${c}">${v}</div></div></td>`).join("")}
      </tr></table>
      <table style="width:100%;border-collapse:collapse">${filasR}</table>
      ${top.length?`<div style="font-size:12px;font-weight:800;margin:12px 0 4px">Los 5 más grandes</div>
      ${top.map(c=>{ const u=(c.historial||[]).filter(x=>x.sem===semR&&!x.sistema).slice(-1)[0];
        const nv=RC.nivelDe(c).nivel;
        return `<div style="border:1px solid #EEF1F5;border-left:3px solid ${colN[nv]};border-radius:6px;padding:8px 10px;margin:5px 0;font-size:12px">
          <b>${escH(c.nombre)}</b> · <span style="color:#C2263D;font-weight:800">−${eur(c.perdido)}</span> · ${escH(c.agente)}
          ${RC.htmlProductos(c.productos,{max:3,sinSuben:true,perdido:c.perdido})}
          <div style="color:#3A424E">${RC.tienePlan(c)?`${escH(c.causa)} → ${escH(c.accion)} · ${eur(c.eurosObjetivo)}`:`<span style="color:#C2263D">Sin diagnosticar</span>`}</div>
          ${u?`<div style="color:#3A424E">Esta semana: ${escH(u.hecho)} — ${escH(u.respuesta)}</div>`:RC.tienePlan(c)?`<div style="color:#C2263D">Sin avance esta semana</div>`:""}
        </div>`;}).join("")}`:""}
      ${r.propuestas+r.margenPend?`<div style="margin-top:8px;font-size:12px;padding:6px 10px;border-radius:8px;background:#FFFBEB;color:#92400E">
        ⏳ ${r.propuestas} peticiones de archivo y ${r.margenPend} márgenes esperando al CEO</div>`:""}`;
  };

  const sube=es.map(o=>{
    const ag=USUARIOS.find(u=>U(u.id)===U(o.agente));
    return `<li style="margin-bottom:5px;font-size:13px">${escH(o.texto)}
      <span style="color:#64748B"> · ${escH(ag?ag.nombre:o.agente)}</span></li>`;
  }).join("");

  const html=`<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    max-width:620px;margin:0 auto;color:#14181F;line-height:1.5">
    <div style="background:#14181F;color:#fff;padding:18px 20px;border-radius:12px 12px 0 0">
      <div style="font-size:11px;letter-spacing:.08em;opacity:.7;text-transform:uppercase">
        Cierre de equipo · semana ${SEMANA}</div>
      <div style="font-size:20px;font-weight:800;margin-top:3px">${escH(miNombre)}</div>
      <div style="font-size:12px;opacity:.75">${escH(EQUIPO)} · ${nCerr} cerrados${nAus?" · "+nAus+(nAus>1?" ausentes":" ausente"):""}</div>
    </div>
    <div style="border:1px solid #DCE1E7;border-top:none;border-radius:0 0 12px 12px;padding:20px">
      ${blqCifras()}
      <div style="background:#F7F9FB;border-radius:10px;padding:12px 14px;margin-top:4px">
        <div style="font-size:22px;font-weight:800;line-height:1">${totCumpl}
          <span style="font-size:14px;font-weight:400;color:#6B7684">de ${totProm}</span></div>
        <div style="font-size:12px;color:#6B7684">compromisos del equipo cumplidos
          ${totRiesgo?" · "+totRiesgo+" clientes en riesgo":""}</div>
      </div>
      ${blqActividad()}
      ${blqRanking()}
      ${blqRecup()}
      ${blqMuestras()}
      ${blqCobros()}
      ${sube?`<h3 style="margin:22px 0 8px;font-size:14px">Lo que sube (${es.length})</h3>
        <ul style="margin:0;padding-left:18px">${sube}</ul>`:""}
      <h3 style="margin:22px 0 8px;font-size:14px">El equipo, uno a uno</h3>
      ${filas}
      <div style="margin-top:20px;text-align:center">
        <a href="https://crmwikuk.vercel.app/objetivos_equipo.html" style="display:inline-block;
          background:#14181F;color:#fff;text-decoration:none;padding:11px 26px;border-radius:9px;
          font-size:13.5px;font-weight:700">Ver el detalle</a></div>
    </div></div>`;

  const sinEmail=[];
  for(const id of dest){
    const d=us.find(u=>u._id===id)||{};
    let em=d.email||"";
    if(!em){ const p=pu.find(x=>[x._id,x.id,x.crmId,x.username].filter(Boolean)
      .some(k=>U(k)===U(id))); em=(p&&p.email)||""; }
    if(!em){ sinEmail.push(d.nombre||id); continue; }
    try{
      await fetch("/api/send-email",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({to:em,
          subject:"📋 Cierre de equipo "+EQUIPO+" · semana "+SEMANA+" — "+miNombre,html})});
    }catch(e){}
    // Y el aviso en la campanita del CRM
    const nid="notif_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
    try{ await escribir("notificaciones_email",nid,{id:nid,tipo:"cierre_equipo",
      titulo:"📋 "+miNombre+" ha cerrado el equipo "+EQUIPO+" · S"+SEMANA,
      mensaje:nCerr+" comerciales cerrados"+(nAus?", "+nAus+" ausentes":"")+". "
        +totCumpl+" de "+totProm+" compromisos cumplidos.",
      destinatarioId:id,destinatarioEmail:em,prioridad:"normal",creadoPor:UID,
      creadoPorNombre:miNombre,fecha:new Date().toISOString(),leido:false,
      emailEnviado:true}); }catch(e){}
  }
  if(sinEmail.length) alert("Cierre enviado. Ojo: "+sinEmail.join(", ")
    +" no tiene email en su ficha y solo lo verá en el CRM.");
}

window.cerrarSemana=async()=>{
  const es=escalados();
  // (sep 2026) Las estrategias que dependen de mí se deciden antes de cerrar
  if(window.RC){
    if(ESTS===null){ await cargarEsts(); let w=0; while(ESTS===null&&w<40){ await new Promise(r=>setTimeout(r,300)); w++; } }
    const pe=estPendientesMias();
    if(pe.length){
      alert("Antes de cerrar decide "+pe.length+" estrategia"+(pe.length===1?"":"s")+" de precio:\n\n"
        +pe.slice(0,10).map(({e,a})=>"· "+(e.cliente||"")+" ("+(a.nombre||"")+") · "+RC.num(e.maxDescuento)+" %").join("\n")
        +"\n\nApruébalas, elévalas o recházalas arriba del todo.");
      window.scrollTo({top:0,behavior:"smooth"});
      return;
    }
  }
  if(esJefe){
    const pend=pendientesEquipo();
    if(pend.length){
      alert("Antes tiene que cerrar tu equipo la semana "+SEMANA+".\n\nFaltan: "
        +pend.map(a=>a.nombre).join(", ")
        +"\n\nSi alguien está de vacaciones o de baja, márcalo como ausente.");
      return;
    }
  }
  // (sep 2026) El director tampoco cierra hasta que han cerrado sus jefes
  if(esDir){
    try{
      const [us,inf]=await Promise.all([leer("usuarios"),leer("informes")]);
      const jefes=us.filter(u=>{ const r=String(u.rol||"").toLowerCase();
        return (r==="jefe"||r==="crm_jefe")&&!u.tipologia&&u.activo!==false&&!/FRANC|DISTRIB/i.test(u.equipo||"")
        &&!(u.duplicadaDe&&u.duplicadaDe!==u._id&&us.some(x=>x._id===u.duplicadaDe&&!x.duplicadaDe)); });
      const deSem=inf.filter(i=>Number(i.semana)===SEMANA&&i.estado!=="borrador"
        &&(!(i.anio||i.ano)||Number(i.anio||i.ano)===ANIO));
      const falta=jefes.filter(j=>!deSem.some(i=>U(i.uid)===U(j._id)
        ||[j.grupoAgente,j.catalogoVendedor,j._id,j.username].filter(Boolean).map(U).includes(U(i.agente))));
      if(falta.length){
        alert("Antes tienen que cerrar tus jefes de equipo la semana "+SEMANA+".\n\nFaltan: "
          +falta.map(j=>j.nombre||j._id).join(", "));
        return;
      }
    }catch(e){}
  }
  // (sep 2026) Se puede cerrar sin subir nada: con el candado del portal,
  // exigir al menos una cosa dejaba encerrado a quien no tenia nada que subir.
  if(esCeo){
    if(!confirm("¿Cerrar tu semana "+SEMANA+"?")) return;
  } else if(!es.length){
    if(!confirm("No has marcado nada para subir. ¿Cerrar la semana "+SEMANA+" igualmente?")) return;
  } else if(!confirm("Cerrar la semana "+SEMANA+" con "+es.length+" objetivo(s) para "
    +(ESCALA_A==="director"?"el Jefe de Ventas":"el CEO")+"?")) return;
  const btn=document.getElementById("btnCerrar");
  btn.disabled=true; btn.textContent="Cerrando…";
  try{
    const doc={id:"informe_"+AGENTE+"_s"+SEMANA,agente:AGENTE,uid:UID,
      semana:SEMANA,anio:ANIO,equipo:EQUIPO,rol:ROL,estado:"enviado",
      tipo:"responsable",fechaEnvio:new Date().toISOString(),escalados:es.length,
      respuestas:JSON.stringify(es.reduce((a,o)=>{
        a["equipo:"+o.id]={accion:LBL[o.tipo]||"Seguimiento",texto:o.texto,
          nom:(USUARIOS.find(u=>U(u.id)===U(o.agente))||{}).nombre||""};
        return a;},{}))};
    await escribir("informes",doc.id,doc);
    try{
      await fetch(FB+"/planes_semanales/plan_"+UID+"_"+ANIO+"_s"+SEMANA
        +"?updateMask.fieldPaths=estado&updateMask.fieldPaths=fechaCierre",{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{estado:{stringValue:"cerrado"},
          fechaCierre:{stringValue:new Date().toISOString()}}})});
    }catch(e){}
    if(esJefe){ try{ await enviarConsolidado(es); }catch(e){} }
    CERRADA=true; pintar();
  }catch(e){
    btn.disabled=false; btn.textContent="Cerrar la semana";
    alert("No se ha podido cerrar: "+e.message);
  }
};

let PASOS_DATA=null;   // {jefes:{total,faltan:[]}, recup:{n,eur}}
async function cargarPasos(){
  if(PASOS_DATA) return; PASOS_DATA={cargando:true};
  const out={};
  try{
    if(esDir||esCeo){
      const [us,inf]=await Promise.all([leer("usuarios"),leer("informes")]);
      const rolU=(u)=>String(u.rol||"").toLowerCase();
      const cuenta=(u)=>!u.tipologia&&u.activo!==false&&!(u.duplicadaDe&&u.duplicadaDe!==u._id&&us.some(x=>x._id===u.duplicadaDe&&!x.duplicadaDe));
      const quienes=us.filter(u=>cuenta(u)&&!/FRANC|DISTRIB/i.test(u.equipo||"")&&(["jefe","crm_jefe"].includes(rolU(u))||(esCeo&&["director","crm_director"].includes(rolU(u))&&!/^ceo$/i.test(u._id||u.id))));
      const deSem=inf.filter(i=>Number(i.semana)===SEMANA&&i.estado!=="borrador"&&(!(i.anio||i.ano)||Number(i.anio||i.ano)===ANIO));
      const cerro=(j)=>deSem.some(i=>U(i.uid)===U(j._id)||[j.grupoAgente,j.catalogoVendedor,j._id,j.username].filter(Boolean).map(U).includes(U(i.agente)));
      out.jefes={total:quienes.length,faltan:quienes.filter(j=>!cerro(j)).map(j=>j.nombre||j._id)};
    }
    if(window.RC){
      const todos=(await RC.leerCasos()).filter(c=>!RC.esFrancia(c.equipo)&&!/DISTRIB/i.test(c.equipo||"")
        &&(esCeo||esDir||!EQUIPO||U(c.equipo).includes(EQUIPO)||EQUIPO.includes(U(c.equipo))));
      out.casos=todos.filter(c=>RC.abierto(c)&&c.estado!=="propuesta_archivo");
      // Acumulado del año: recuperados y archivados
      const delAnio=(f)=>String(f||"").slice(0,4)===String(ANIO);
      out.recAnio=todos.filter(c=>c.estado==="recuperado"&&delAnio(c.recuperadoEn||c.actualizado));
      out.archAnio=todos.filter(c=>/archiv/.test(c.estado||"")&&c.estado!=="propuesta_archivo"&&delAnio(c.archivadoEn||c.archivoDecididoEn||c.actualizado));
      try{ if(RC.cargarDeptos) await RC.cargarDeptos(); if(!RC._us) RC._us=await RC.leer("usuarios",10); }catch(e){}
      try{ out.proyectos=(await RC.leerProfundo("proyectos")).filter(p=>!p.eliminada&&!/cerrad|finaliz|complet|cancel/i.test(p.estado||"")); }catch(e){ out.proyectos=[]; }
      const casos=todos.filter(c=>c.estado==="propuesta_archivo"&&!RC.esFrancia(c.equipo)
        &&(esCeo||esDir||!EQUIPO||U(c.equipo).includes(EQUIPO)||EQUIPO.includes(U(c.equipo)))
        &&RC.puedeArchivar(esCeo,true,c,c.archivoMotivo));
      out.recup={n:casos.length,eur:casos.reduce((t,c)=>t+RC.num(c.perdido),0),
        casos:casos.sort((a,b)=>RC.num(b.perdido)-RC.num(a.perdido)).map(c=>({nombre:c.nombre,agente:c.agente,perdido:RC.num(c.perdido),motivo:c.archivoMotivo||"",nota:c.archivoNota||""}))};
    }
  }catch(e){ console.warn("pasos",e); }
  PASOS_DATA=out; if(VISTA==="lista") pintar();
}

// Cabecera: CONSOLIDADO arriba; debajo la lista de equipos (o comerciales) limpia.
// Al tocar un equipo se abre su propia tarjeta aparte, con sus comerciales.
function cabeceraConsolidada(){
  if(!(esJefe||esDir||esCeo)) return "";
  if(PANEL===null) setTimeout(cargarPanel,0);
  if(!PANEL||PANEL.cargando) return '<div class="card"><p class="vacio" style="margin:0">Calculando ventas y actividad…</p></div>';
  if(PANEL.error) return '<div class="card"><p class="vacio" style="margin:0">No se han podido leer las cifras ('+escT(PANEL.error)+').</p></div>';
  // Jefe de ventas y CEO: TODAS las ventas. El jefe de equipo, las de su equipo.
  const eqsV=(esDir||esCeo)?PANEL.equipos:panelEquipos();
  const act=(E)=>E.gente.filter(p=>!p.ausente);
  const g=eqsV.flatMap(E=>act(E).map(p=>Object.assign({eqNom:E.eq},p)));
  const mesP=(l)=>{ const a=l.reduce((t,p)=>t+(Number(p.mAct)||0),0), o=l.reduce((t,p)=>t+(Number(p.mObj)||0),0); return pcT(a,o); };
  const semP=(l)=>{ const a=l.reduce((t,p)=>t+(Number(p.vSem)||0),0), o=l.reduce((t,p)=>t+(Number(p.objSem)||0),0); return pcT(a,o); };
  const filaComL=(p)=>{ const ab=COM_VISTA===(p.cod||p.id);
    return filaLimpia("verCom('"+esc2(p.cod||p.id)+"')",escT(p.nombre),"Semana "+(semP([p])==null?"—":semP([p])+" %")+" · "+euT(p.mAct)+" en el mes",mesP([p]),ab)
      +(ab?'<div style="margin:4px 0 10px;padding:10px;border:1.5px solid #CBD5E1;border-radius:12px;background:#fff">'
        +'<div style="font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;margin-bottom:6px">👤 Individual · '+escT(p.nombre)+'</div>'+tarjetaCifras([p],true)+'</div>':''); };
  let h='<div class="card" style="border:1.5px solid #0F172A">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:12px;letter-spacing:.06em;text-transform:uppercase">📊 Consolidado</b>'
    +'<span style="font-size:12px;color:#64748B">'+(esJefe?escT(EQUIPO||"tu equipo"):"todos los equipos")+' · '+g.length+' comerciales</span></div>'
    +tarjetaCifras(g,false)+'</div>';
  if(esJefe){
    h+='<div class="card"><b style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#475569">👤 Por comercial</b>'
      +g.slice().sort((a,b)=>(mesP([a])||0)-(mesP([b])||0)).map(filaComL).join("")+'</div>';
    return h;
  }
  // Cada equipo se abre justo debajo de su línea, igual que los comerciales
  const tarjetaEq=(E)=>{ const l=act(E).map(p=>Object.assign({eqNom:E.eq},p));
    return '<div id="vista-eq" style="margin:4px 0 10px;padding:10px;border:1.5px solid #1D4ED8;border-radius:12px;background:#F8FBFF">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#1D4ED8">👥 Equipo '+escT(E.eq)+'</b>'
      +'<button class="mini" onclick="verEq(null)">✕ Cerrar</button></div>'
      +tarjetaCifras(l,false)
      +'<div style="font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;margin:12px 0 0">👤 Sus comerciales</div>'
      +l.slice().sort((a,b)=>(mesP([a])||0)-(mesP([b])||0)).map(filaComL).join("")+'</div>'; };
  h+='<div class="card"><b style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#475569">👥 Por equipo</b>'
    +'<div style="font-size:12px;color:#64748B">Toca un equipo para abrirlo.</div>'
    +eqsV.filter(E=>act(E).length).map(E=>filaLimpia("verEq('"+esc2(E.eq)+"')",'👥 '+escT(E.eq),act(E).length+" comerciales · semana "+(semP(act(E))==null?"—":semP(act(E))+" %"),mesP(act(E)),EQ_VISTA===E.eq)
      +(EQ_VISTA===E.eq?tarjetaEq(E):"")).join("")
    +'</div>';

// Facturas vencidas de un comercial (del panel), de la más antigua a la más nueva
// Una factura y su abono del mismo importe (mismo cliente) se anulan: no se muestran
function facturasDe(p){
  // (sep 2026) Carga de TODOS: ya viene una línea por cliente y empresa
  if((p.facV||[]).length&&(p.facV||[]).every(f=>f.saldo)) return (p.facV||[]).slice().sort((a,b)=>(b.v70||0)-(a.v70||0)||(b.im||0)-(a.im||0));
  // La misma factura puede venir repetida (exacta) o partida en varios plazos:
  // se deja una sola línea por cliente + nº de factura, con el importe sumado
  // y el plazo más antiguo.
  // (sep 2026) La empresa (WIKUK / UC) forma parte de la clave: el mismo nº en dos
  // empresas son dos facturas distintas, y un abono de una no anula una factura de la otra.
  const K=(f)=>String(f.cli||"").trim().toUpperCase()+"|"+String(f.g||"")+"|"+String(f.n||"").trim().toUpperCase();
  const vistos=new Set(), una={};
  (p.facV||[]).forEach(f=>{
    const exacta=K(f)+"|"+f.fv+"|"+Math.round((Number(f.im)||0)*100);
    if(vistos.has(exacta)) return; vistos.add(exacta);
    if(!f.n){ una[exacta]=Object.assign({},f); return; }
    const k=K(f)+"|"+(Number(f.im)<0?"-":"+");
    if(!una[k]) una[k]=Object.assign({},f,{plazos:1,tot:f.tot!=null?f.tot:f.im});
    else { const u=una[k]; u.im=(Number(u.im)||0)+(Number(f.im)||0); u.plazos++;
      if(String(f.fv)<String(u.fv)){ u.fv=f.fv; u.dias=f.dias; } }
  });
  const l=Object.values(una), fuera=new Set();
  const cent=(x)=>Math.round(Math.abs(Number(x)||0)*100);
  l.forEach((neg,i)=>{ if(!(Number(neg.im)<0)||fuera.has(i)) return;
    const j=l.findIndex((pos,k)=>k!==i&&!fuera.has(k)&&Number(pos.im)>0&&Math.abs(cent(pos.im)-cent(neg.im))<=1&&String(pos.cli).trim().toUpperCase()===String(neg.cli).trim().toUpperCase()&&String(pos.g||"")===String(neg.g||""));
    if(j>=0){ fuera.add(i); fuera.add(j); } });
  return l.filter((_,i)=>!fuera.has(i)).sort((a,b)=>b.dias-a.dias);
}

}

};

window.enviarInstr=async(agId,clave,tipo,nom)=>{
  const t=(document.getElementById("instr_txt")||{}).value||"";
  if(t.trim().length<4){ alert("Escribe la instrucción o elige una."); return; }
  const sem=SEMANA+1;
  let hsh=0; for(let i=0;i<clave.length;i++){ hsh=((hsh<<5)-hsh)+clave.charCodeAt(i); hsh|=0; }
  const id="obj_"+agId+"_"+ANIO+"_s"+sem+"_i"+Math.abs(hsh)+"_"+Date.now();
  const docRef=String(clave).split(/:(.+)/)[1]||"";
  const doc={id,agente:agId,semana:sem,anio:ANIO,texto:(nom?nom+" — ":"")+t.trim(),tipo:(tipo==="ofertas"||tipo==="muestras"||tipo==="estrategias")?tipo.slice(0,-1)||tipo:tipo,
    origen:"jefe",claveOrigen:clave+"|instr",refNombre:nom||"",docId:tipo==="cliente"?"":docRef,
    creadoPor:UID,creadoPorNombre:AGENTE,equipo:EQUIPO,fechaCreacion:new Date().toISOString()};
  // Precio especial opcional: crea la estrategia en el CRM (aprobada si está en su límite)
  let estHecha=null;
  try{
    if(window.RC&&document.getElementById("ke_po")&&Number((document.getElementById("ke_po").value||"").replace(",","."))>0){
      const l=RC.leerFormEstrategia("ke",[]);
      if(!l.desc&&!l.art) throw new Error("elige el artículo en el catálogo");
      if(!(l.precioActual>0)) throw new Error("falta la tarifa del artículo");
      const a=USUARIOS.find(u=>U(u.id)===U(agId))||{};
      estHecha=await RC.crearEstrategia({_id:"",nombre:nom,cliente:tipo==="cliente"?(String(clave).split(/:(.+)/)[1]||""):"",
        agente:a.cod||agId,equipo:a.equipo||EQUIPO,perdido:0,historial:[]},l,l.nota,
        {id:UID,nombre:window._MI_NOMBRE_JEFE||AGENTE,nivel:NIVEL_EST});
      if(ESTS) ESTS.push(Object.assign(estHecha,{_id:estHecha.id}));
    }
  }catch(x){ alert("El objetivo se guarda, pero la estrategia no: "+x.message); }
  try{
    await escribir("objetivos_semana",id,doc);
    INSTRUCCIONES.push(doc); INSTR_ABIERTA=null; FORM_PRECIO=false; if(window.RC) RC.olvidarForm("ke"); pintar();
    if(window.RC&&RC.avisarGenerico){
      let quien=window._MI_NOMBRE_JEFE||"";
      if(!quien){
        for(const col of ["usuarios","portal_users"]){
          try{ const r=await fetch(`${FB}/${col}/${encodeURIComponent(UID)}`); if(!r.ok) continue;
            const j=await r.json(); const n=j.fields&&j.fields.nombre&&j.fields.nombre.stringValue;
            if(n){ quien=n; break; } }catch(e){}
        }
        window._MI_NOMBRE_JEFE=quien=quien||AGENTE||"Tu jefe";
      }
      const d=await RC.avisarGenerico({agente:agId,quienId:UID,quien,titulo:nom||"Instrucción",
        etiqueta:"Objetivo · semana "+sem,texto:t.trim(),
        detalle:"Sobre lo que dejaste en tu cierre de la semana "+SEMANA+"."});
      alert(RC.textoAviso(d)+(estHecha?"\n💶 Estrategia "+(estHecha.estado==="aprobada"?"creada y aprobada.":"creada; la tiene que aprobar "+(estHecha.pendienteDeNombre||"dirección")+"."):""));
    }
  }catch(e){ alert("No se ha podido guardar: "+e.message); }
};

// El correo del cierre: el guardado al cerrar o, si es antiguo, se rehace
// abriendo cierre_semanal en modo «solo ver» (igual que hace el CRM).
window._CORREOS=window._CORREOS||{};
function correoDelCierre(a,c){
  const cod=U(c.info.agente||a.cod||a.id), k=cod+"_"+SEMANA;
  const guardado=c.info.htmlEmailOrigen==="cierre"?c.info.htmlEmail:null;
  const st=window._CORREOS[k];
  const real=guardado||(st&&st!=="cargando"&&!String(st).startsWith("error:")?st:null);
  if(!real&&!st) setTimeout(()=>pedirCorreoCierre(cod,k),0);
  const aviso=real?"":(st&&String(st).startsWith("error:")
    ?'<p style="font-size:11.5px;color:var(--muted);margin:0 0 6px">No se han podido rehacer las cifras de esa semana ('+String(st).slice(6)+').</p>'
    :'<p style="font-size:11.5px;color:var(--muted);margin:0 0 6px">⏳ Preparando su parte con las cifras de la semana…</p>');
  return '<div style="margin:0 0 14px">'+aviso+(real?'<div style="background:#fff;border-radius:12px">'+real+'</div>':"")+'</div>'
    +'<h3 style="margin-top:6px">Qué hacer con lo que dejó pendiente</h3>';
}
function pedirCorreoCierre(cod,k){
  if(window._CORREOS[k]) return;
  window._CORREOS[k]="cargando";
  const fr=document.createElement("iframe");
  fr.style.cssText="position:fixed;left:-9999px;top:0;width:600px;height:800px;border:0;visibility:hidden";
  let hecho=false;
  const fin=(v)=>{ if(hecho) return; hecho=true; window.removeEventListener("message",oir);
    try{ fr.remove(); }catch(e){} window._CORREOS[k]=v; if(VISTA==="detalle"||SEL) pintar(); };
  const oir=(e)=>{ const d=e.data||{};
    if(d.type!=="CIERRE_HTML"||U(d.agente)!==U(cod)||Number(d.semana)!==Number(SEMANA)) return;
    fin(d.html||("error:"+(d.error||"sin respuesta"))); };
  window.addEventListener("message",oir);
  setTimeout(()=>fin("error:tiempo agotado"),45000);
  fr.src="/cierre_semanal.html?agente="+encodeURIComponent(cod)+"&semana="+SEMANA+"&solover=1";
  document.body.appendChild(fr);
}

function pintarDetalle(){
  const a=USUARIOS.find(u=>U(u.id)===U(SEL));
  if(!a) return '<p class="vacio">No encontrado.</p>';
  const c=CIERRES[a.id];
  const mios=OBJETIVOS.filter(o=>U(o.agente)===U(a.id));

    +'<small style="display:block;color:var(--muted);font-size:11.5px;margin-top:3px">'
    +'Semana '+SEMANA+' · '
    +(c?("cerrada"+(c.fecha?" el "+new Date(c.fecha).toLocaleString("es-ES"):"")):"sin cerrar")

  // (sep 2026) Lo primero, su parte tal como llega por correo: ventas contra
  // objetivo, actividad, muestras, cobros, plan de recuperación… Así se ve

  } else {
    // 1 · Lo que él propuso

    // (sep 2026) Segunda parte, en tarjetas grandes: qué prometió, si lo ha
    // hecho y dos botones. Sin listas apretadas ni etiquetas técnicas.
    h+=bloqueEstJefe(a);
    h+='<div class="kid-cab">'
      +'<div class="kid-t">Lo que prometió para la semana '+(SEMANA+1)+'</div>'
      +'<div class="kid-kpis"><span class="kid-k ok">✅ '+hechos.length+' hecho'+(hechos.length===1?"":"s")+'</span>'
      +'<span class="kid-k pd">⏳ '+pend.length+' pendiente'+(pend.length===1?"":"s")+'</span></div>'

    if(hechos.length) h+='<h3 class="kid-h ok">✅ Ya lo ha hecho</h3>'+hechos.map(o=>tarjetaItem(o.x,a,es,o.e)).join("");
    if(zanjado.length) h+='<details class="kid-zan"><summary>Lo que dio por cerrado ('+zanjado.length+')</summary>'
      +zanjado.map(o=>tarjetaItem(o.x,a,es,o.e)).join("")+'</details>';

    if(!c.propuesto.length){
      h+='<div class="card"><p class="vacio">No ha propuesto nada.</p></div>';
    }
    h+='</div>';

    // 2 · Lo que el sistema le pidió y él obvió

  // 3 · Objetivos que le has puesto tú

    +'<p style="font-size:11.5px;color:var(--muted);margin:-4px 0 8px">'
    +'Para la semana '+SEMANA+'</p><div class="card">';
  h+= mios.length ? mios.map(o=>{
    const sube=o.escaladoA===ESCALA_A;
    return '<div class="item">'

        +' onclick="toggleEscalar(\''+esc2(o.id)+'\')">'+(sube?"✓ Sube":"Subir")+'</button>':"")
      +(U(o.creadoPor)===U(UID)
        ?'<button class="mini" onclick="editar(\''+esc2(o.id)+'\')" title="Editar">✏️</button>'

  h+='</div>';

  // 4 · Alta de objetivo con tipología

    if(sel){
      return '<label>'+lbl+'</label>'
        +'<div class="elegido"><span>'+sel.nom

  // Vendedor destino: por defecto el de la ficha, pero se puede cambiar
  const vendId=SEL_VEND||a.id;
  const vend=USUARIOS.find(u=>U(u.id)===U(vendId))||a;
  const campoVend=
    '<label>Vendedor</label>'
    +'<div class="elegido" style="background:var(--blueL);border-color:var(--blue)">'
    +'<span>'+vend.nombre+'<small style="display:block;font-weight:400;'
    +'color:var(--muted)">'+vend.id+(vend.equipo?" · "+vend.equipo:"")+'</small></span>'
    +'<button onclick="elegirVend(\'\')" title="Cambiar">✎</button></div>'
    +(SEL_VEND===""
      ?'<div class="buscador" style="margin-top:6px">'
       +'<span class="lupa">🔍</span>'
       +'<input type="text" class="conlupa" autocomplete="off" autofocus'
       +' placeholder="Busca un vendedor…" oninput="buscarVend(this.value)">'
       +'<div class="sug" id="sug-vend" style="display:none"></div></div>'
      :"");

  h+='<h3 id="form-obj">'+(EDITANDO?"Editar objetivo":"Añadir objetivo")+'</h3>'
    +'<div class="card"'+(EDITANDO?' style="border-color:var(--blue)"':'')+'>'
    +campoVend
    +'<label>Tipología</label><select id="ob-tipo" onchange="cambiarTipo()">'
    +TIPOS.map(t=>'<option value="'+t.k+'"'+(t.k===tipoAct?" selected":"")+'>'
      +t.lbl+'</option>').join("")
    +'</select>'
    // Si el objetivo va sobre una oferta/muestra/estrategia que ya existe,
    // se referencia la abierta en concreto en vez de describirla a mano.
    +(ABIERTOS[tipoAct]
      ? (SEL_DOC
          ? '<label>'+(LBL[tipoAct]||tipoAct)+' concreta</label>'
            +'<div class="elegido"><span>'+SEL_DOC.nom
            +'<small style="display:block;font-weight:400;color:var(--muted)">'
            +SEL_DOC.cod+'</small></span>'
            +'<button onclick="quitarDoc()" title="Quitar">✕</button></div>'
            +fichaDoc(SEL_DOC)
          : '<label>'+(LBL[tipoAct]||tipoAct)+' abierta '
            +'<span style="font-weight:400">('+(ABIERTOS[tipoAct]||[]).length
            +') — opcional</span></label>'
            +'<div class="buscador"><span class="lupa">🔍</span>'
            +'<input type="text" class="conlupa" autocomplete="off"'
            +' placeholder="Busca una '+(LBL[tipoAct]||tipoAct).toLowerCase()
            +' abierta…" oninput="buscarDoc(this.value)" onfocus="buscarDoc(this.value)">'
            +'<div class="sug" id="sug-doc" style="display:none"></div></div>')
      : "")
    // Cliente y producto son independientes: se puede indicar uno, otro o ambos
    +campoBusca("cli","Cliente",SEL_CLI,"Busca por nombre o código…")
    +campoBusca("prod","Producto",SEL_PROD,"Busca por nombre o código…")
    +'<label>Qué tiene que hacer</label>'
    +'<textarea id="ob-txt" rows="3" placeholder="Describe el objetivo para '
    +vend.nombre+'"></textarea>'
    +'<button class="btn" id="ob-btn" onclick="nuevoObjetivo(\''+esc2(a.id)
    +'\')">'+(EDITANDO?"Guardar cambios":"Añadir objetivo")+'</button>'
    +(EDITANDO?'<button class="btn" onclick="cancelarEdicion()" '
      +'style="background:#fff;border:1.5px solid var(--border);color:var(--muted)">'
      +'Cancelar</button>':"")
    +'</div>';
  return h;
}

function pintar(){
  const app=document.getElementById("app");
  // El contenedor nace con la clase «estado» (texto centrado) para el
  // «Cargando…»; si se queda, toda la pantalla sale centrada.
  app.className="";
  try{
    app.innerHTML = VISTA==="detalle" ? pintarDetalle() : pintarLista();
    if(window.RC&&RC.activarForms) RC.activarForms();
  }catch(e){
    // Antes un fallo aqui dejaba la pantalla congelada sin decir nada
    console.error("[objetivos_equipo] pintar:",e);
    app.innerHTML='<div class="err"><b>Error al mostrar</b><br>'+(e.message||e)
      +'</div><p style="margin-top:10px"><a onclick="irLista()" '
      +'style="color:var(--blue);cursor:pointer">← Volver a la lista</a></p>';
  }
}

async function recargar(){
  const objs=await leer("objetivos_semana");
  OBJETIVOS=objs.filter(o=>!o.eliminado&&Number(o.semana)===SEMANA&&Number(o.anio)===ANIO
    &&!String(o.claveOrigen||"").endsWith("|instr"));
  INSTRUCCIONES=objs.filter(o=>!o.eliminado&&String(o.claveOrigen||"").endsWith("|instr")
    &&Number(o.anio)===ANIO&&Number(o.semana)===SEMANA+1);
  // Lo que se dijo la semana pasada para esta semana
  SEGUIM=objs.filter(o=>!o.eliminado&&Number(o.semana)===SEMANA&&Number(o.anio)===ANIO
    &&(o.origen==="jefe"||String(o.claveOrigen||"").endsWith("|instr")));
  CIERRES=await cargarCierres();
  await comprobarCerrada();
  pintar();                       // ya se ve algo aquí
  // El seguimiento y los catálogos son pesados: se cargan detrás y se
  // repinta cuando llegan, para que la pantalla no se quede en blanco.
  cargarSeguimiento().then(pintar).catch(()=>{});
}

// Volver con el historial del navegador en vez de recargar el CRM entero:
// la app pesa varios MB y volver a montarla tarda segundos. Con history.back()
// el navegador la recupera de su caché y es casi instantáneo. Si no hay
// historial (se abrió el enlace directo), se navega a la URL como antes.
window.volverCRM=(ev)=>{
  if(ev) ev.preventDefault();
  if(window.history.length>1){ window.history.back(); }
  else { window.location.href=VUELVE; }
};

(async()=>{
  const _v=document.getElementById("volver");
  if(EMBED){ _v.style.display="none"; }
  else { _v.href=VUELVE; _v.addEventListener("click",window.volverCRM); }
  try{
    if(!UID){ document.getElementById("app").innerHTML=
      '<div class="err">Falta identificar al usuario. Entra desde el CRM.</div>'; return; }
    document.getElementById("sub").textContent =
      esJefe?("Equipo "+(EQUIPO||"")):esDir?"Todos los equipos":"Vista de dirección";
    USUARIOS=await cargarUsuarios();
    await recargar();
    cargarCatalogos().catch(()=>{});   // para los buscadores, sin bloquear
  }catch(e){
    document.getElementById("app").innerHTML=
      '<div class="err"><b>No se ha podido cargar</b><br>'+e.message
      +'<br><small>Recarga la página; si sigue, avisa.</small></div>';
    console.error("[objetivos_equipo]",e);
  }
})();

// Si algo revienta de forma inesperada, que se vea en pantalla en vez de
// dejar un "Cargando…" eterno.
window.addEventListener("error",function(ev){
  var app=document.getElementById("app");
  if(app&&/Cargando/.test(app.textContent||"")){
    app.innerHTML='<div class="err"><b>Error al cargar</b><br>'
      +(ev.message||"")+'</div>';
  }
});
</script>
