<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cierres del equipo</title>
<style>
 :root{--navy:#0F172A;--muted:#64748B;--border:#E2E8F0;--white:#fff;
       --green:#22C55E;--greenL:#F0FDF4;--red:#EF4444;--redL:#FEF2F2;
       --amber:#F59E0B;--amberL:#FFFBEB;--purple:#8B5CF6;--purpleL:#F5F3FF;
       --blue:#2563EB;--blueL:#EFF6FF}
 *{box-sizing:border-box}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#F8FAFC;color:var(--navy)}
 header{background:var(--navy);color:#fff;padding:16px 18px}
 header h1{margin:0 0 3px;font-size:19px;font-weight:800}
 header p{margin:0;font-size:12px;opacity:.75}
 header a{color:#fff;font-size:14px;font-weight:700;text-decoration:none;
          display:inline-block;margin-top:12px;cursor:pointer;
          background:rgba(255,255,255,.14);padding:9px 18px;border-radius:10px;
          border:1px solid rgba(255,255,255,.25)}
 header a:active{background:rgba(255,255,255,.28)}
 main{padding:16px;max-width:820px;margin:0 auto;padding-bottom:90px}
 .card{background:var(--white);border:1px solid var(--border);border-radius:14px;
       padding:14px 16px;margin-bottom:11px;box-shadow:0 1px 3px #0000000d}
 .sem{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px}
 .sem button{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer}
 .sem button:disabled{color:var(--border);cursor:default}
 .sem .t{text-align:center}.sem .t b{display:block;font-size:16px}
 .sem .t span{font-size:11px}
 .fila{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
 .fila b{font-size:14px}
 .fila small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
 .pill{flex-shrink:0;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:99px}
 .pill.ok{background:var(--greenL);color:var(--green)}
 .pill.no{background:var(--amberL);color:var(--amber)}
 .cerr{border-left:4px solid var(--green)}
 .abierto{border-left:4px solid var(--amber)}
 h3{font-size:12.5px;margin:18px 0 7px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted)}
 .item{padding:10px 0;border-top:1px solid var(--border)}
 .item:first-of-type{border-top:none}
 .item p{margin:0;font-size:12.5px}
 .item small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
 .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;
      border-radius:99px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
 .acc{font-size:11px;font-weight:700;color:var(--muted);margin-left:7px;
      text-transform:uppercase;letter-spacing:.3px}
 .punto{width:9px;height:9px;border-radius:99px;flex-shrink:0;margin-top:6px}
 .dicho{font-style:italic;margin-top:3px!important}
 .t-cliente{background:var(--blueL);color:var(--blue)}
 .t-ofertas{background:var(--amberL);color:var(--amber)}
 .t-muestras{background:var(--purpleL);color:var(--purple)}
 .t-estrategias{background:var(--greenL);color:var(--green)}
 .t-promesa,.t-otro,.t-semana,.t-prioridad,.t-dup{background:#F1F5F9;color:var(--muted)}
 .obviado{background:var(--amberL);border-radius:9px;padding:10px 12px;margin-bottom:7px}
 .obviado p{font-size:12.5px;margin:0}
 label{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
 select,textarea,input[type=text]{width:100%;padding:9px 11px;border-radius:9px;
   border:1.5px solid var(--border);font-size:13px;font-family:inherit;outline:none;
   background:#fff}
 textarea{resize:vertical}
 .btn{width:100%;padding:11px;border-radius:10px;border:none;background:var(--navy);
      color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-top:9px}
 .btn:disabled{background:#CBD5E1;cursor:default}
 .mini{padding:4px 11px;border-radius:99px;border:1.5px solid var(--border);
       background:#fff;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
 .mini.on{border-color:var(--green);background:var(--greenL);color:var(--green)}
 .mini:disabled{opacity:.4;cursor:default}
 .cont{display:flex;justify-content:space-between;padding:10px 14px;border-radius:11px;
       margin-bottom:14px;background:#F1F5F9;border:1px solid var(--border);
       font-size:12px;font-weight:700}
 .cont.lleno{background:var(--amberL);border-color:var(--amber)}
 /* Resumen grafico del cierre: el titular antes que el detalle */
 .resumen{background:#fff;border:1px solid var(--border);border-radius:14px;
   padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0000000d}
 .rbarra{height:10px;border-radius:99px;background:#F1F5F9;overflow:hidden}
 .rfill{height:100%;background:var(--green);border-radius:99px;transition:width .4s}
 .rpct{margin:7px 0 0;font-size:12px;color:var(--muted);text-align:center}
 .rkpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}
 .rk{text-align:center;padding:11px 6px;border-radius:11px;border:1px solid var(--border)}
 .rk b{display:block;font-size:22px;font-weight:900;line-height:1}
 .rk span{display:block;font-size:10.5px;font-weight:700;color:var(--muted);
   margin-top:4px;text-transform:uppercase;letter-spacing:.3px}
 .rk.ok{background:var(--greenL);border-color:#86EFAC}
 .rk.ok b{color:var(--green)}
 .rk.pend{background:var(--amberL);border-color:#FDE68A}
 .rk.pend b{color:var(--amber)}
 .rk.zan{background:#F8FAFC}
 .rk.zan b{color:var(--muted)}
 .rdesglose{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
 .rlinea{display:grid;grid-template-columns:88px 1fr 42px;gap:9px;
   align-items:center;padding:4px 0}
 .rnom{font-size:11.5px;color:var(--muted);font-weight:600}
 .rmini{height:7px;border-radius:99px;background:#F1F5F9;overflow:hidden}
 .rmfill{height:100%;background:var(--green);border-radius:99px}
 .rcnt{font-size:11.5px;font-weight:700;text-align:right;
   font-variant-numeric:tabular-nums}
 .estado{text-align:center;color:var(--muted);font-size:13.5px;padding:30px}
 .err{padding:14px;background:var(--redL);color:var(--red);border-radius:10px;font-size:13px}
 .vacio{color:var(--muted);font-size:12.5px;margin:0;padding:6px 0}
 .buscador{position:relative}
 .lupa{position:absolute;left:11px;top:50%;transform:translateY(-50%);
       font-size:14px;opacity:.5;pointer-events:none}
 input.conlupa{padding-left:34px}
 .sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;
      border:1.5px solid var(--border);border-radius:10px;margin-top:3px;
      max-height:230px;overflow-y:auto;box-shadow:0 6px 18px #0000001f}
 .sug div{padding:9px 12px;font-size:12.5px;cursor:pointer;border-top:1px solid #F1F5F9}
 .sug div:first-child{border-top:none}
 .sug div:hover,.sug div.act{background:var(--blueL)}
 .sug small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
 .elegido{display:flex;justify-content:space-between;align-items:center;gap:8px;
          padding:9px 12px;border-radius:9px;background:var(--greenL);
          border:1.5px solid var(--green);font-size:12.5px;font-weight:700}
 .elegido button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
 /* Ficha de la oferta/muestra elegida: que se vea que lleva sin salir de aquí */
 .docficha{margin-top:7px;padding:11px 13px;background:#F8FAFC;
   border:1px solid var(--border);border-radius:10px}
 .doctit{margin:0 0 9px;font-size:12.5px;font-weight:700;line-height:1.35;
   padding-bottom:8px;border-bottom:1px solid var(--border)}
 .docdatos{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
 .docdatos div{display:flex;justify-content:space-between;gap:8px;font-size:12px}
 .docdatos span{color:var(--muted)}
 .docdatos b{font-weight:700;text-align:right}
 .doclineas{margin-top:9px;border-top:1px solid var(--border);padding-top:8px}
 .doclineas div{display:flex;justify-content:space-between;gap:10px;
   font-size:12px;padding:2px 0}
 .doclineas span{color:var(--muted);min-width:0;overflow:hidden;
   text-overflow:ellipsis;white-space:nowrap}
 .doclineas b{font-weight:700;white-space:nowrap}
 .docnota{margin:8px 0 0;font-size:12px;color:var(--muted);font-style:italic;
   border-top:1px solid var(--border);padding-top:7px}
 .kid-cab{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin:4px 0 12px}
 .kid-t{font-size:17px;font-weight:800}
 .kid-kpis{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px}
 .kid-k{font-size:15px;font-weight:800;padding:8px 14px;border-radius:99px}
 .kid-k.ok{background:var(--greenL);color:#15803D}.kid-k.pd{background:var(--amberL);color:#B45309}
 .kid-ayuda{font-size:12.5px;color:var(--muted)}
 .kid-h{font-size:15px;margin:18px 0 8px;text-transform:none;letter-spacing:0}
 .kid-h.pd{color:#B45309}.kid-h.ok{color:#15803D}
 .kid-card{background:#fff;border:1px solid var(--border);border-left:6px solid var(--border);border-radius:16px;padding:14px 15px;margin-bottom:12px;box-shadow:0 1px 3px #0000000d}
 .kid-top{display:flex;gap:12px;align-items:center}
 .kid-ico{font-size:30px;line-height:1}
 .kid-que{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
 .kid-nom{font-size:17px;font-weight:800;line-height:1.25}
 .kid-dijo{font-size:14px;margin:10px 0 6px}
 .kid-cita{font-style:italic;color:#475569;margin-top:3px}
 .kid-est{font-size:13.5px;font-weight:700;border-radius:10px;padding:8px 11px;margin:6px 0}
 .kid-obj{font-size:13px;font-weight:700;background:#EFF6FF;color:#1D4ED8;border-radius:10px;padding:8px 11px;margin:6px 0}
 .kid-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
 .kid-b{border:2px solid var(--border);background:#fff;border-radius:12px;padding:12px 8px;font-size:14px;font-weight:800;cursor:pointer;color:var(--navy)}
 .kid-b.azul{border-color:#2563EB;color:#1D4ED8}.kid-b.azul.on{background:#2563EB;color:#fff}
 .kid-b.on{background:var(--navy);color:#fff;border-color:var(--navy)}
 .kid-b.verde{background:#16A34A;border-color:#16A34A;color:#fff}
 .kid-b:disabled{opacity:.4}
 .kid-form{margin-top:10px;background:#F8FAFC;border-radius:12px;padding:12px}
 .kid-form-t{font-size:14px;font-weight:800;margin-bottom:8px}
 .kid-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
 .kid-chip{border:1.5px solid #93C5FD;background:#fff;color:#1D4ED8;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
 .kid-form textarea{width:100%;min-height:64px;padding:10px;border:1.5px solid var(--border);border-radius:10px;font:inherit;font-size:14px}
 .kid-zan{margin:14px 0}.kid-zan summary{cursor:pointer;font-weight:700;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<header>
  <h1>📋 Cierres del equipo</h1>
  <p id="sub">Qué ha cerrado cada comercial y qué falta</p>
  <a id="volver">← Volver</a>
</header>
<main><div class="estado" id="app">Cargando…</div></main>

<script src="agentes.js"></script>
<script src="/recuperacion_comun.js?v=20261004b"></script>
<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const P=new URLSearchParams(location.search);
const UID=(P.get("uid")||"").trim();
const AGENTE=(P.get("agente")||"").toUpperCase().trim();
const ROL=(P.get("rol")||"").toLowerCase();
const EQUIPO=(P.get("equipo")||"").toUpperCase();
const VUELVE=P.get("vuelve")||"/";
// Cuando se muestra dentro del CRM (iframe) no hace falta botón de volver:
// la navegación del propio CRM sigue visible debajo.
const EMBED=P.get("embed")==="1";

const U=(s)=>String(s||"").toUpperCase().trim();
const esc2=(s)=>String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
const MAX=10, ANIO=new Date().getFullYear();
const esJefe=ROL==="jefe"||ROL==="crm_jefe";
const esDir =ROL==="director"||ROL==="crm_director";
const esCeo =ROL==="ceo";
const ESCALA_A=esJefe?"director":esDir?"ceo":null;
const MI_NIVEL=esCeo?"ceo":esDir?"director":null;

// Tipologías disponibles al crear un objetivo a mano
const TIPOS=[
  {k:"cliente",    lbl:"Cliente / visita"},
  {k:"ofertas",    lbl:"Oferta"},
  {k:"muestras",   lbl:"Muestra"},
  {k:"estrategias",lbl:"Estrategia"},
  {k:"otro",       lbl:"Otro"},
];
const LBL={cliente:"Cliente",ofertas:"Oferta",muestras:"Muestra",
           estrategias:"Estrategia",promesa:"Promesa",otro:"Otro",
           semana:"La semana",prioridad:"Prioridad",dup:"Duplicado",recup:"Recuperación"};

function semanaISO(d){
  d=d||new Date();
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  const a=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t-a)/86400000)+1)/7);
}
const SEM_ACTUAL=semanaISO();
let SEMANA=Number(P.get("semana"))||SEM_ACTUAL;
if(SEMANA<1||SEMANA>SEM_ACTUAL) SEMANA=SEM_ACTUAL;

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.arrayValue!==undefined) return (f.arrayValue.values||[]).map(val);
  return null;
}
function toFields(o){
  const f={};
  for(const [k,v] of Object.entries(o)){
    if(v===null||v===undefined) continue;
    f[k]= typeof v==="number"?{doubleValue:v}
        : typeof v==="boolean"?{booleanValue:v}:{stringValue:String(v)};
  }
  return f;
}
async function leer(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<40);
  return t;
}
async function escribir(col,id,doc){
  const r=await fetch(`${FB}/${col}/${encodeURIComponent(id)}`,{
    method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({fields:toFields(doc)})});
  if(!r.ok) throw new Error("HTTP "+r.status);
}

let USUARIOS=[], OBJETIVOS=[], CIERRES={}, VISTA="lista", SEL=null, CERRADA=false;
let INSTRUCCIONES=[];   // instrucciones del jefe sobre lineas del cierre (semana siguiente)
let ESTS=null;          // estrategias (colección del CRM), se cargan al abrir un comercial
const NIVEL_EST=(ROL==="ceo"||ROL==="admin")?"ceo":(ROL==="director"||ROL==="crm_director")?"director":"jefe";
if(window.RC) RC.NIVEL_UI=NIVEL_EST;
let ESTS_CARGANDO=false;
async function cargarEsts(){ if(ESTS||ESTS_CARGANDO||!window.RC) return; ESTS_CARGANDO=true;
  let l=[];
  try{ const [ll,us]=await Promise.all([RC.leerProfundo("estrategias"),RC._us?Promise.resolve(RC._us):RC.leer("usuarios",10)]);
    RC._us=us; l=ll.filter(e=>!e.eliminada);
    // La tarifa del cliente se calcula como mucho 8 s; si tarda, se sigue sin ella
    if(RC.prepararEsts) await Promise.race([RC.prepararEsts(l),new Promise(r=>setTimeout(r,8000))]); }catch(e){ console.warn("estrategias",e); }
  ESTS=l; ESTS_CARGANDO=false; pintar(); }
// Todas las estrategias de mi gente que esperan MI decisión (aprobar, elevar o rechazar)
function estPendientesMias(){
  if(!ESTS||!window.RC) return [];
  const vistas=new Set(), out=[];
  USUARIOS.forEach(a=>estsDe(a).forEach(e=>{
    if(vistas.has(e._id)||!RC.meTocaEst(e,NIVEL_EST,UID)) return;
    vistas.add(e._id); out.push({e,a}); }));
  return out.sort((x,y)=>RC.fechaEst(x.e)-RC.fechaEst(y.e));
}
function estDeOtrosMias(){
  if(!ESTS||!window.RC) return [];
  const vistas=new Set(), out=[];
  USUARIOS.forEach(a=>estsDe(a).forEach(e=>{
    if(vistas.has(e._id)||e.estado!=="pendiente_aprobacion"||RC.meTocaEst(e,NIVEL_EST,UID)) return;
    vistas.add(e._id); out.push(e); }));
  return out;
}
function botEstJ(e){
  const puede=RC.puedeResolverEst(e,NIVEL_EST,UID);
  return (puede?"":'<div style="font-size:12.5px;color:var(--muted);margin-top:6px">Pide un '+RC.dtoEf(e)+' % sobre su tarifa: supera tu límite del '+RC.LIM_DTO[NIVEL_EST]+' %. Elévala o recházala.</div>')
    +'<textarea id="ej_'+e._id+'" placeholder="Comentario (opcional)" style="width:100%;margin-top:6px;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;font:inherit;font-size:13.5px"></textarea>'
    +'<div class="kid-btns" style="grid-template-columns:1fr 1fr 1fr">'
    +(puede?'<button class="kid-b verde" onclick="resolverEstJ(\''+e._id+'\',\'aprobar\')">✅ Aprobar</button>':'<span></span>')
    +(NIVEL_EST!=="ceo"?'<button class="kid-b" onclick="resolverEstJ(\''+e._id+'\',\'elevar\')">⬆️ Elevar</button>':'<span></span>')
    +'<button class="kid-b" style="border-color:#FCA5A5;color:#B91C1C" onclick="resolverEstJ(\''+e._id+'\',\'rechazar\')">✖ Rechazar</button></div>'
    +RC.htmlExtrasEst(e);
}
// Otro precio o alternativa al decidir una estrategia
window.extraEstEnviar=async(id,tipo)=>{
  const e=(ESTS||[]).find(x=>x._id===id); if(!e) return;
  const pref=RC.prefExtra(id);
  const nota=((document.getElementById("ej_"+id)||{}).value||"").trim();
  try{
    if(tipo==="precio"){
      const p=Number(((document.getElementById(pref+"_po")||{}).value||"").replace(",","."));
      if(!(p>0)){ alert("Pon el precio que le das."); return; }
      await RC.contraofertaEst(e,p,{id:UID,nombre:window._MI_NOMBRE_JEFE||AGENTE,nivel:NIVEL_EST},nota);
      RC._extraEst=null; pintar();
      alert(e.estado==="aprobada"?"Aprobada a "+p+" €. Se le ha avisado al comercial.":"Ese precio pasa tu límite: sube a "+(e.pendienteDeNombre||"tu superior")+" con el precio nuevo.");
    } else {
      const alt=RC.leerAlternativa(pref);
      if(!alt.desc){ alert("Busca y elige el artículo alternativo en el catálogo."); return; }
      if(!(alt.precioActual>0)){ alert("Falta la tarifa: pon el precio de tarifa a mano."); return; }
      if(!(alt.precio>0)){ alert("Pon el precio."); return; }
      const r=await RC.alternativaEst(e,alt,{id:UID,nombre:window._MI_NOMBRE_JEFE||AGENTE,nivel:NIVEL_EST},nota);
      if(r._esEstrategia) ESTS.push(Object.assign(r,{_id:r.id}));
      RC._extraEst=null; RC.olvidarForm(pref); pintar();
      alert(r._esEstrategia?"La alternativa pasa tu límite ("+r.dto+" %): va a aprobación de tu superior.":"Alternativa enviada al comercial como oferta.");
    }
  }catch(x){ alert("No se ha guardado: "+x.message); }
};

// Bandeja en la lista: se resuelven antes de cerrar la semana
function bandejaEst(){
  if(!window.RC) return "";
  if(ESTS===null){ setTimeout(cargarEsts,0); return ""; }
  const l=estPendientesMias(), otros=RC.htmlDeOtros(estDeOtrosMias(),NIVEL_EST);
  if(!l.length) return '<div class="card" style="border-color:#DDD6FE;background:#F5F3FF"><b style="font-size:13.5px;color:#6D28D9">💶 Estrategias: no tienes ninguna esperando tu decisión</b>'+otros+'</div>';
  return '<div class="card" style="border-color:#7C3AED;border-width:1.5px;background:#FAF5FF">'
    +'<b style="font-size:15px;color:#6D28D9">💶 '+l.length+(l.length===1?' estrategia espera':' estrategias esperan')+' tu decisión</b>'
    +'<p style="margin:4px 0 6px;font-size:12.5px;color:var(--muted)">Aprueba las que entran en tu límite ('+(NIVEL_EST==="ceo"?"sin límite":RC.LIM_DTO[NIVEL_EST]+" %")+'), '
    +(NIVEL_EST==="ceo"?'o recházalas':'eleva las que no, o recházalas')+'. No puedes cerrar la semana con alguna sin decidir. Al comercial y a su jefe les llega la respuesta por correo.</p>'

let FILTRO="";   // buscador de vendedores de la lista
// Catálogos para los buscadores. Se cargan una vez y se reutilizan.
let CLIENTES=[], PRODUCTOS=[];
// Cliente y producto son independientes: un objetivo puede llevar los dos
// ("a este cliente, ofrécele este producto"), solo uno, o ninguno.
let SEL_CLI=null, SEL_PROD=null;
// Objetivo que se está editando (null = alta nueva) y vendedor destino
let EDITANDO=null, SEL_VEND=null;

// Comprueba si un objetivo ya se ha cumplido, con el mismo criterio que usa
// el cierre del viernes: para clientes, si hay visita esa semana; para el
// resto, si el documento ya está en un estado cerrado.
let VISITAS_SEM={}, VISITAS_NOM={}, ESTADOS_DOC={};
// Nombre de empresa normalizado: sin tildes, sin S.L./S.A. y sin puntuacion,
// para poder cruzar "DOHR GMBH & CO.KG" con "DOHR GMBH CO KG"
function normNom(n){
  return U(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\b(S\.?L\.?U?|S\.?A\.?U?|SCL|LDA|SARL|SAS|GMBH|SRL|CB|SAT|COOP|SOC|CO|KG|DOO|SPA)\b/g,"")
    .replace(/[^A-Z0-9]/g,"");
}
// Ofertas, muestras y estrategias que siguen abiertas, para poder apuntar un
// objetivo a una en concreto en vez de describirla a mano.
let ABIERTOS={ofertas:[],muestras:[],estrategias:[]};
let DOCS={};   // id -> documento, de cualquier coleccion y estado
let SEL_DOC=null, VER_TODAS_DOC=false;

async function cargarSeguimiento(){
  VISITAS_SEM={}; VISITAS_NOM={}; ESTADOS_DOC={};
  // Solo las visitas de ESTA semana. Leer la colección entera son miles de
  // documentos por cada carga y dispara la factura de Firestore.
  // Se piden la semana del cierre y la siguiente: lo que el comercial promete
  // al cerrar la semana 31 lo ejecuta en la 32, asi que mirar solo la 31
  // marcaba como "sin contacto" cosas que si se habian hecho.
  // El campo "semana" puede estar guardado como numero o como texto segun
  // quien creara la visita, asi que se prueban los dos tipos. Buscar solo
  // uno devolvia cero resultados y todo salia como "sin contacto".
  const meterVisita=(v,sem)=>{
    if(v.semana==null) v.semana=sem;
    const cid=U(v.clienteId||v.clienteCodigo);
    if(cid) (VISITAS_SEM[cid]=VISITAS_SEM[cid]||[]).push(v);
    // Tambien por nombre: los codigos de SAP y del CRM no siempre casan,
    // pero el nombre del cliente si esta en los dos sitios.
    const nom=normNom(v.clienteNombre||v.cliente);
    if(nom) (VISITAS_NOM[nom]=VISITAS_NOM[nom]||[]).push(v);
  };
  const pedirVisitas=async(sem,comoTexto)=>{
    try{
      const body={structuredQuery:{from:[{collectionId:"visitas"}],
        where:{fieldFilter:{field:{fieldPath:"semana"},op:"EQUAL",
               value:comoTexto?{stringValue:String(sem)}:{doubleValue:sem}}},
        limit:3000}};
      const r=await fetch(FB+":runQuery",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!r.ok) return 0;
      const j=await r.json();
      let n=0;
      (Array.isArray(j)?j:[]).forEach(x=>{
        if(!x.document) return;
        const v={};
        for(const [k,f] of Object.entries(x.document.fields||{})) v[k]=val(f);
        meterVisita(v,sem); n++;
      });
      return n;
    }catch(e){ return 0; }
  };
  const res=await Promise.all([
    pedirVisitas(SEMANA,false), pedirVisitas(SEMANA+1,false),
    pedirVisitas(SEMANA,true),  pedirVisitas(SEMANA+1,true)
  ]);
  // Si por lo que sea no vino nada, se cae a leer y filtrar por fecha
  if(res.reduce((a,b)=>a+b,0)===0){
    try{
      const todas=await leer("visitas");
      todas.forEach(v=>{
        const sm=Number(v.semana);
        if(sm===SEMANA||sm===SEMANA+1) meterVisita(v,sm);
      });
    }catch(e){}
  }
  try{
    const [of,mu,es]=await Promise.all([leer("ofertas"),leer("muestras"),leer("estrategias")]);
    [...of,...mu,...es].forEach(d=>{
      const id=U(d.id||d._id); if(!id) return;
      ESTADOS_DOC[id]=String(d.estado||"").toLowerCase();
      DOCS[id]=d;
    });
    // Los que siguen abiertos, para poder referenciarlos en un objetivo:
    // "cierra esta oferta", "haz seguimiento de esta muestra"...
    const abierto=(d)=>!CERRADO_RE.test(String(d.estado||"").toLowerCase());
    ABIERTOS.ofertas    = of.filter(abierto);
    ABIERTOS.muestras   = mu.filter(abierto);
    ABIERTOS.estrategias= es.filter(abierto);
  }catch(e){}
}

const CERRADO_RE=/pedido|perdida|aceptada|rechazada|completada|ko|cerrada|positivo/;

// Variantes del código: el CRM y SAP no siempre coinciden (un 0 de más)
// Los codigos de CLIENTE siguen necesitando variantes (el 0 de mas de SAP);
// los de agente los resuelve Agentes con la tabla.
function variantesCod(c){ return Agentes.variantes(c); }

function estadoObjetivo(o){
  // Si apunta a un documento concreto, ese manda: es lo mas fiable
  if(o.docId){
    const est=ESTADOS_DOC[U(o.docId)];
    if(est===undefined) return {hecho:true,detalle:"Ya no está abierta"};
    return CERRADO_RE.test(est)
      ? {hecho:true,detalle:"Cerrada como "+est}
      : {hecho:false,detalle:est?"Sigue en "+est:"Sigue abierta"};
  }
  const cod=o.refCodigo||o.id;
  if(o.tipo==="cliente"){
    const vs=variantesCod(o.refCodigo);
    for(const v of vs){
      const vis=VISITAS_SEM[v];
      if(vis&&vis.length){
        const ped=vis.some(x=>/pedido/i.test(x.resultado||""));
        return {hecho:true,txt:ped?"Visitado y con pedido"
          :vis.length+" contacto"+(vis.length>1?"s":"")+" registrado"+(vis.length>1?"s":"")};
      }
    }
    return {hecho:false,txt:"Sin rastro de contacto esta semana"};
  }
  const est=ESTADOS_DOC[U(o.refCodigo)];
  if(est===undefined) return null;      // no se puede comprobar
  if(!est) return {hecho:false,txt:"Sigue abierta"};
  return CERRADO_RE.test(est)
    ? {hecho:true,txt:"Cerrada como "+est}
    : {hecho:false,txt:"Sigue en "+est};
}

function pintaSemaforo(o){
  const e=estadoObjetivo(o);
  if(!e) return "";
  return '<small style="color:'+(e.hecho?"var(--green)":"var(--amber)")
    +';font-weight:600">'+(e.hecho?"✓ ":"○ ")+e.txt+'</small>';
}

// Busca en el catálogo que toque y pinta las sugerencias sin repintar la
// pantalla entera (repintar perdería el foco y lo escrito en el otro campo).
window.buscarEn=(campo,txt)=>{
  const cont=document.getElementById("sug-"+campo);
  if(!cont) return;
  const q=U(txt).trim();
  if(q.length<2){ cont.innerHTML=""; cont.style.display="none"; return; }
  const cat = campo==="prod" ? PRODUCTOS : CLIENTES;
  if(!cat.length){
    cont.innerHTML='<div style="color:var(--muted)">Cargando catálogo…</div>';
    cont.style.display="block"; return;
  }
  // Primero los que empiezan por lo tecleado, luego los que lo contienen
  const empieza=[], contiene=[];
  for(const x of cat){
    const n=U(x.nom), c=U(x.cod);
    if(n.indexOf(q)===0||c.indexOf(q)===0) empieza.push(x);
    else if(n.indexOf(q)>=0||c.indexOf(q)>=0) contiene.push(x);
    if(empieza.length>=30) break;
  }
  const lista=empieza.concat(contiene).slice(0,30);
  if(!lista.length){
    cont.innerHTML='<div style="color:var(--muted)">Sin resultados para "'+txt+'"</div>';
    cont.style.display="block"; return;
  }
  cont.innerHTML=lista.map(x=>
    '<div onclick="elegir(\''+campo+'\',\''+esc2(x.cod)+'\',\''+esc2(x.nom)+'\')">'
    +'<b>'+x.nom+'</b><small>'+x.cod
    +(x.pob?" · "+x.pob:"")+(x.det?" · "+x.det:"")+'</small></div>'
  ).join("");
  cont.style.display="block";
};

async function cargarUsuarios(){
  // La identidad la resuelve agentes_alias. Antes se buscaba el canonico solo
  // por u.id: si ese id concreto no estaba en la tabla, la persona salia sin
  // fusionar y con su id crudo por nombre (u_1776324530809), y la misma
  // persona aparecia dos veces ("Antonio" y "ANTONIO ZARCO").
  await Agentes.cargar();
  const [us,pu]=await Promise.all([leer("usuarios"),leer("portal_users")]);

  // Ni intercompañia ni canales de venta son comerciales
  const NO_PERSONA=/^(interc|clientsdirect|cataluna|cataluña|tienda|telefono|sinagente|_?total|campofrio|wikuk|interkey|francia|distribuidor)/i;
  const esCanal=(x)=>NO_PERSONA.test(String(x||"").replace(/[.\s_-]/g,""));

  const NO_COM=new Set(), NO_IDS=new Set();
  const A_conoce=(l)=>l.some(k=>Agentes.conocido(k));
  const map={};
  const PU_IDS=new Set(pu.map(p=>p._id));
  const PORTAL_FIJOS=new Set(["wk1","wk2","wk3","ik1","ik2"]);
  // Nombre de persona de verdad: ni un id (u_177...) ni un codigo en minusculas (acruz)
  const pareceCodigo=(n)=>!n||/^u_\d+$/i.test(n)||/^[a-z0-9_.]+$/.test(n);
  [...us,...pu].forEach(u=>{
    const rol=String(u.rol||"").toLowerCase();
    if(rol!=="agente"&&rol!=="crm_agente"&&rol!=="comercial"&&rol!=="vendedor") return;
    if(u.activo===false) return;
    // (oct 2026) Quien es de otro departamento (Customer, Administración…) no es comercial aunque su rol lo diga
    if(u.tipologia||(u.departamentoId&&!/^(eq_|ventas$|comercial)/i.test(u.departamentoId))){
      NO_COM.add(String(u.nombre||"").toUpperCase().trim()); [u._id,u.crmId,u.id,u.grupoAgente].map(U).filter(Boolean).forEach(x=>NO_IDS.add(x)); }
    // (sep 2026) Los comerciales que vienen de fábrica en el portal (wk1..wk3,
    // ik1, ik2: David Mag, Verónica, Silvia, Carlos G., Ricardo) tienen el
    // mismo id en el portal y en el CRM. La regla anterior exigía que fueran
    // distintos y los daba por «sin usuario»: Carlos G. no salía como pendiente.
    const esCuenta=PU_IDS.has(u._id)||PORTAL_FIJOS.has(String(u._id||"").toLowerCase())
      ||PORTAL_FIJOS.has(String(u.crmId||"").toLowerCase());

    // Se prueba con TODOS sus identificadores hasta dar con uno que la tabla
    // conozca: basta que uno cruce para reunir a la persona.
    const posibles=[u.id,u._id,u.crmId,u.grupoAgente,u.catalogoVendedor,
      u.username,u.nombre].filter(Boolean);
    let canon=null, ficha=null;
    for(const k of posibles){
      if(Agentes.conocido(k)){ canon=Agentes.id(k); ficha=k; break; }
    }
    if(!canon){ canon=u.id||u._id||u.username; ficha=canon; }
    if(!canon) return;

    const cands=[u.nombre,Agentes.nombre(ficha),u.username,canon].map(x=>String(x||"").trim()).filter(Boolean);
    const nombre=cands.find(n=>!pareceCodigo(n))||cands[0]||canon;
    if(esCanal(nombre)||esCanal(canon)||esCanal(u.catalogoVendedor)) return;

    if(!map[canon]) map[canon]={
      id:canon, nombre:nombre,
      equipo:U(Agentes.equipo(ficha)||u.equipo||""),
      cod:U(u.grupoAgente||u.catalogoVendedor||canon),
      alias:Agentes.alias(ficha),
      // Telefonico o de campo: cambia el objetivo de actividad (zona admin)
      perfil:String(u.perfilComercial||"").toLowerCase(),
      entrega:String(u.entregaParte||"").toLowerCase(),
      // Sin cuenta en el portal no puede cerrar: no se le espera
      cuenta:esCuenta,codigo:!!(u.grupoAgente||u.catalogoVendedor)||A_conoce(posibles)
    };
    else{
      // Si otra ficha de la misma persona trae mejor nombre o equipo, se usa
      const m=map[canon];
      if(pareceCodigo(m.nombre)&&!pareceCodigo(nombre)) m.nombre=nombre;
      else if(nombre.length>m.nombre.length&&!pareceCodigo(nombre)) m.nombre=nombre;
      if(esCuenta) m.cuenta=true;
      if(u.grupoAgente||u.catalogoVendedor||A_conoce(posibles)) m.codigo=true;
      if(!m.equipo&&u.equipo) m.equipo=U(u.equipo);
      if(!m.perfil&&u.perfilComercial) m.perfil=String(u.perfilComercial).toLowerCase();
      if(!m.entrega&&u.entregaParte) m.entrega=String(u.entregaParte).toLowerCase();
    }
  });
  // Misma persona con dos fichas que la tabla de codigos no ha unido (Esther y
  // ESTHER): se juntan por nombre, quedandose con la que tiene usuario.
  const nomN=(x)=>String(x||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
  const porNom={};
  Object.values(map).forEach(u=>{
    const k=nomN(u.nombre); if(!k) return;
    const m=porNom[k];
    if(!m){ porNom[k]=u; return; }
    const [base,otro]=(u.cuenta&&!m.cuenta)?[u,m]:[m,u];
    base.alias=[...new Set([...(base.alias||[]),...(otro.alias||[]),U(otro.id),U(otro.cod)])];
    base.cuenta=base.cuenta||otro.cuenta; base.codigo=base.codigo||otro.codigo;
    base.entrega=base.entrega||otro.entrega; base.perfil=base.perfil||otro.perfil;
    base.equipo=base.equipo||otro.equipo;
    if(pareceCodigo(base.nombre)&&!pareceCodigo(otro.nombre)) base.nombre=otro.nombre;
    porNom[k]=base;
  });
  let l=Object.values(porNom).filter(u=>!/^u_\d+$/i.test(u.nombre));
  // (sep 2026) Equipo de Power BI para quien no lo tenga en su ficha
  try{
    const res=await leer("pbi_resumen_agente"), eqDe={};
    res.forEach(r=>{ if(r.equipo) eqDe[U(r.agente||r._id)]=U(r.equipo); });
    l.forEach(u=>{ if(!u.equipo){ const k=[u.cod,u.id,...(u.alias||[])].map(U).find(x=>eqDe[x]); if(k) u.equipo=eqDe[k]; } });
  }catch(e){}
  // (sep 2026) Fuera Francia y Distribuidores (no entran en el cierre) y quien no tiene que
  // entregar parte (marcado «no entrega» o sin usuario en el portal)
  l=l.filter(u=>!/FRANC|DISTRIB/.test(U(u.equipo))&&!(u.entrega==="no"||(u.entrega!=="si"&&!u.cuenta)));
  // (oct 2026) Sin equipo y sin código de vendedor no vende: es una cuenta del portal con el
  // rol «comercial» por defecto (p. ej. yhosselin). Salvo que esté marcado «sí entrega».
  l=l.filter(u=>u.entrega==="si"||u.equipo||u.codigo);
  l=l.filter(u=>!NO_IDS.has(U(u.id))&&!(u.alias||[]).some(x=>NO_IDS.has(U(x)))&&!NO_COM.has(String(u.nombre||"").toUpperCase().trim()));
  if(esJefe&&EQUIPO) l=l.filter(u=>u.equipo===EQUIPO);
  l.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return l;
}



// Informe de cierre de cada comercial para la semana elegida
async function cargarCierres(){
  const res={};
  await Promise.all(USUARIOS.map(async a=>{
    try{
      // El informe puede estar bajo cualquiera de sus alias conocidos
      let r=null;
      // Tambien los codigos de las fichas que se han unido por nombre
      for(const c of [...new Set([...Agentes.alias(a.id),...(a.alias||[]),U(a.cod),U(a.id)])]){
        if(!c) continue;
        const t=await fetch(`${FB}/informes/informe_${encodeURIComponent(c)}_s${SEMANA}`);
        if(t.ok){ r=t; break; }
      }
      if(!r){ res[a.id]=null; return; }
      const j=await r.json();
      const o={};
      for(const [k,x] of Object.entries(j.fields||{})) o[k]=val(x);
      let R={},PL=[];
      try{ R=JSON.parse(o.respuestas||"{}"); }catch(e){}
      try{ PL=JSON.parse(o.planteados||"[]"); }catch(e){}
      // Lo propuesto: lo que sí contestó
      const propuesto=[];
      for(const k in R){
        const v=R[k]||{};
        if(!v.accion&&!v.texto) continue;
        const p=k.split(/:(.+)/);
        propuesto.push({clave:k,tipo:p[0],id:p[1]||"",accion:v.accion||"",
          texto:v.texto||"",nom:v.nom||""});
      }
      // Lo obviado: el sistema se lo planteó y no dijo nada
      const obviado=PL.filter(x=>{
        const v=R[x.k];
        return !v||(!v.accion&&!v.texto);
      });
      res[a.id]={info:o,propuesto,obviado,fecha:o.fechaEnvio||"",
        sinPlanteados:!o.planteados};
    }catch(e){ res[a.id]=null; }
  }));
  return res;
}

// Nombre legible de una linea del cierre: sin esto solo se ve "Cliente ·
// Le visito" y no hay forma de saber de quien habla.
function nombreItem(x){
  try{
    if(x.nom) return x.nom;                     // lo guardo el propio cierre
    const id=U(x.id);
    if(!id) return "";
    if(x.tipo==="cliente"){
      for(const v of variantesCod(x.id)){
        const c=(CLIENTES||[]).find(c=>U(c.cod)===v);
        if(c) return c.nom;
      }
      return "";
    }
    const d=DOCS[id];
    if(!d) return "";
    return d.cliente||d.clienteNombre||d.nombre||d.titulo||d.prod||d.prodNombre||"";
  }catch(e){ return ""; }
}
// Que mas se sabe de esa linea: producto, importe, fecha
function detalleItem(x){
  try{
  const d=DOCS[U(x.id)];
  if(!d) return "";
  const ls=Array.isArray(d.lineas)?d.lineas:(Array.isArray(d.productos)?d.productos:[]);
  const prods=ls.map(l=>l.producto||l.prod||l.nombre).filter(Boolean);
  const que=d.prod||d.prodNombre||d.estrategia||d.titulo
    ||(prods.length?prods.slice(0,2).join(", ")+(prods.length>2?" +"+(prods.length-2):""):"");
  const imp=(d.importe!=null&&d.importe!=="")
    ? Number(d.importe).toLocaleString("es-ES")+" €" : "";
  const fecha=d.fecha||d.fechaCreacionStr||(d.fechaCreacion||"").slice(0,10);
  return [que,imp,_fecha(fecha)].filter(Boolean).join(" · ");
  }catch(e){ return ""; }
}
// Semaforo de la linea, con el mismo criterio que el resto de la app
// Respuestas que zanjan el asunto: el comercial dice que ahi no hay nada que
// hacer. Marcarlas como "pendiente" es enganoso, no son un compromiso.
const NO_ACCION=/ya lo s|es normal|por cerrad|por perdid|es el mismo|no procede|descart/i;

function estadoItem(x){
  try{
  if(NO_ACCION.test(x.accion||"")) return {hecho:null,txt:"No requiere acción"};
  if(x.tipo==="cliente"){
    // Vale cualquier contacto de la semana del cierre o de la siguiente:
    // la accion puede hacerse antes de cerrar y registrarse despues.
    const enSemana=(l)=>(l||[]).filter(z=>{
      const sm=Number(z.semana);
      return sm===SEMANA||sm===SEMANA+1;
    });
    const resultado=(vis,via)=>{
      const ult=vis.slice().sort((a,b)=>
        String(b.fecha||"").localeCompare(String(a.fecha||"")))[0];
      const que=ult.resultado||ult.tipo||"";
      return {hecho:true,txt:vis.length+" contacto"+(vis.length>1?"s":"")
        +(ult.fecha?" · "+_fecha(ult.fecha):"")+(que?" · "+que:"")+via};
    };
    // 1) Por codigo, probando las variantes SAP/CRM
    for(const v of variantesCod(x.id)){
      const vis=enSemana(VISITAS_SEM[v]);
      if(vis.length) return resultado(vis,"");
    }
    // 2) Por nombre del cliente: los codigos de SAP y del CRM no siempre
    //    casan, pero el nombre esta guardado en el propio compromiso.
    const nom=normNom(x.nom||nombreItem(x));
    if(nom){
      const vis=enSemana(VISITAS_NOM[nom]);
      if(vis.length) return resultado(vis," · por nombre");
    }
    return {hecho:false,txt:"Sin contacto registrado"};
  }
  if(["ofertas","muestras","estrategias"].indexOf(x.tipo)<0) return null;
  const est=ESTADOS_DOC[U(x.id)];
  if(est===undefined) return null;
  return CERRADO_RE.test(est)
    ? {hecho:true,txt:"Cerrada como "+est}
    : {hecho:false,txt:est?"Sigue en "+est:"Sigue abierta"};
  }catch(e){ return null; }
}

// Ficha con lo que se ofertó, cuándo y a qué precio: sin esto el responsable
// tiene que salirse a mirarlo a otro sitio para saber de qué está hablando.
function _fecha(v){
  if(!v) return "";
  const s=String(v);
  return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0,10).split("-").reverse().join("/") : s;
}
function fichaDoc(sel){
  const d=sel&&sel.doc;
  // Si al editar no se pudo recuperar el documento (ya cerrado, por ejemplo)
  // se avisa en vez de dejar el hueco sin explicacion
  if(!d) return sel&&sel.cod
    ? '<div class="docficha"><p class="docnota" style="border:none;padding:0;'
      +'margin:0">Sin detalle disponible: puede que ya no esté abierta.</p></div>'
    : "";
  const f=[];
  const fecha=d.fecha||d.fechaCreacionStr||(d.fechaCreacion||"").slice(0,10);
  if(fecha) f.push(["Fecha",fecha]);
  if(d.estado) f.push(["Estado",d.estado]);
  if(d.prod||d.prodNombre) f.push(["Producto",d.prod||d.prodNombre]);
  if(d.calibre) f.push(["Calibre",d.calibre]);
  if(d.metros) f.push(["Metros",d.metros]);
  // Muestras: unidades entregadas y de que tipo era la muestra
  if(d.uds!=null&&d.uds!=="") f.push(["Unidades",d.uds]);
  if(d.cantidad) f.push(["Cantidad",d.cantidad]);
  if(d.tipo&&sel.tipo==="muestras") f.push(["Tipo",d.tipo]);
  if(d.fechaFeedback) f.push(["Feedback",d.fechaFeedback]);
  if(d.revisarEl) f.push(["Revisar el",_fecha(d.revisarEl)]);
  if(d.motivo) f.push(["Motivo",d.motivo]);
  // Ofertas: cuando vence el plazo dado al cliente
  if(d.fechaPlazo) f.push(["Plazo",_fecha(String(d.fechaPlazo).slice(0,10))]);
  if(d.titulo) f.push(["Título",d.titulo]);
  // Las estrategias tienen sus propios campos: descuento maximo, a quien
  // esta pendiente de aprobar y de que oferta salio.
  if(d.maxDescuento!=null&&d.maxDescuento!=="")
    f.push(["Dto. máximo",d.maxDescuento+" %"]);
  if(d.prioridad) f.push(["Prioridad",d.prioridad]);
  if(d.pendienteDeNombre) f.push(["Pendiente de",d.pendienteDeNombre]);
  if(d.tipo&&sel.tipo==="estrategias") f.push(["Tipo",d.tipo]);
  if(d.importe!=null&&d.importe!=="")
    f.push(["Importe",Number(d.importe).toLocaleString("es-ES")+" €"]);

  // Titular de la estrategia (que se propone hacer)
  const titular=(sel.tipo==="estrategias")?(d.estrategia||"")
    :(sel.tipo==="muestras")?(d.prod||d.prodNombre||"")
    :"";

  // Ofertas: lineas. Estrategias: productos, con precio actual y propuesto.
  let lineas="";
  const ls=Array.isArray(d.lineas)?d.lineas
          :(Array.isArray(d.productos)?d.productos:[]);
  if(ls.length){
    lineas='<div class="doclineas">'+ls.slice(0,8).map(l=>{
      const nom=l.producto||l.prod||l.nombre||l.descripcion||"—";
      const cant=l.cantidad!=null?l.cantidad:(l.unidades!=null?l.unidades:l.uds);
      const eu=(v)=>Number(v).toLocaleString("es-ES",
        {minimumFractionDigits:2,maximumFractionDigits:2})+" €";
      // Estrategia: salto de precio. Oferta: precio con su unidad (€/kg…)
      const pAct=l.precioActual!=null?l.precioActual
                :(l.precioBase!=null&&l.precio!=null&&String(l.precioBase)!==String(l.precio)
                   ?l.precioBase:(l.precio!=null?l.precio:null));
      const pNue=l.precioPropuesto!=null?l.precioPropuesto
                :(l.precioNuevo!=null?l.precioNuevo
                :(l.precioBase!=null&&l.precio!=null&&String(l.precioBase)!==String(l.precio)
                   ?l.precio:null));
      const uni=l.unidad?" "+String(l.unidad).replace(/^€/,""):"";
      let der="";
      if(pAct!=null&&pNue!=null&&String(pAct)!==String(pNue))
        der=eu(pAct)+" → "+eu(pNue)+uni;
      else if(pAct!=null) der=(cant!=null&&cant!==""?cant+" × ":"")+eu(pAct)+uni;
      else if(cant!=null&&cant!=="") der=cant+" uds";
      const dto=l.dto!=null&&l.dto!==""?l.dto:(l.descuento!=null?l.descuento:null);
      if(dto!=null&&dto!==""&&Number(dto)>0) der+=(der?" · ":"")+"-"+dto+"%";
      // Composicion o notas de la linea: dicen que se le ofrecio exactamente
      const sub=[l.calibre,l.metros,l.composicion,l.extras,l.notas]
        .filter(Boolean).join(" · ");
      return '<div><span>'+nom+(sub?'<em style="font-style:normal;opacity:.65"> · '
        +sub+'</em>':"")+'</span><b>'+der+'</b></div>';
    }).join("")
    +(ls.length>8?'<div style="color:var(--muted)">y '+(ls.length-8)+' más</div>':"")
    +'</div>';
  }
  const nota=d.notaJefe||d.notas||d.nota||d.notaInicial||d.obs
    ||d.observaciones||d.descripcion||"";
  return '<div class="docficha">'
    +(titular?'<p class="doctit">'+titular+'</p>':"")
    +(f.length?'<div class="docdatos">'+f.map(x=>
       '<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("")+'</div>':"")
    +lineas
    +(nota?'<p class="docnota">“'+String(nota).slice(0,300)+'”</p>':"")
    +'</div>';
}
