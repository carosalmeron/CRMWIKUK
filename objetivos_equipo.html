<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objetivos del equipo</title>
<style>
 :root{--navy:#0F172A;--muted:#64748B;--border:#E2E8F0;--white:#fff;
       --green:#22C55E;--greenL:#F0FDF4;--red:#EF4444;--redL:#FEF2F2;
       --amber:#F59E0B;--amberL:#FFFBEB;--purple:#8B5CF6;--purpleL:#F5F3FF;
       --blue:#2563EB;--blueL:#EFF6FF}
 *{box-sizing:border-box}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#F8FAFC;color:var(--navy)}
 header{background:var(--navy);color:#fff;padding:16px 18px}
 header h1{margin:0 0 3px;font-size:19px;font-weight:800}
 header p{margin:0;font-size:12px;opacity:.75}
 header a{color:#fff;font-size:12.5px;text-decoration:underline;
          display:inline-block;margin-top:10px}
 main{padding:16px;max-width:820px;margin:0 auto;padding-bottom:80px}
 .card{background:var(--white);border:1px solid var(--border);border-radius:14px;
       padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px #0000000d}
 .sem{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px}
 .sem button{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;
             padding:0 6px}
 .sem button:disabled{color:var(--border);cursor:default}
 .sem .t{text-align:center}
 .sem .t b{display:block;font-size:16px}
 .sem .t span{font-size:11px}
 .cont{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
       border-radius:11px;margin-bottom:16px;background:#F1F5F9;border:1px solid var(--border);
       font-size:12px;font-weight:700}
 .cont.lleno{background:var(--amberL);border-color:var(--amber)}
 .ag{border-left:4px solid var(--green)}
 .ag.vacio{border-left-color:var(--amber)}
 .agh{display:flex;justify-content:space-between;align-items:center;gap:10px}
 .agh b{font-size:14px}
 .agh .est{font-size:11px;color:var(--muted);display:block;margin-top:2px}
 .agh .est.alerta{color:var(--amber);font-weight:700}
 .item{padding:9px 0;border-top:1px solid var(--border);display:flex;gap:9px;
       align-items:flex-start}
 .item p{margin:0;font-size:12.5px}
 .item small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
 button.mini{flex-shrink:0;padding:4px 11px;border-radius:99px;border:1.5px solid var(--border);
             background:#fff;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
 button.mini.on{border-color:var(--green);background:var(--greenL);color:var(--green)}
 button.mini:disabled{opacity:.4;cursor:default}
 button.add{flex-shrink:0;padding:6px 12px;border-radius:9px;border:1.5px solid var(--navy);
            background:#fff;color:var(--navy);font-size:11.5px;font-weight:700;cursor:pointer}
 button.add.on{background:var(--navy);color:#fff}
 .form{margin-top:10px;padding:10px;background:#F8FAFC;border-radius:10px}
 textarea{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--border);
          font-size:13px;font-family:inherit;resize:vertical;outline:none}
 .guardar{margin-top:8px;width:100%;padding:9px;border-radius:9px;border:none;
          background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer}
 .guardar:disabled{background:#CBD5E1;cursor:default}
 .recib{border:1.5px solid #8B5CF644;background:var(--purpleL)}
 .recib h3{margin:0 0 8px;font-size:13px;color:var(--purple)}
 .vacia{text-align:center;padding:26px;color:var(--muted);font-size:13px}
 .estado{text-align:center;color:var(--muted);font-size:13.5px;padding:30px}
 .err{padding:14px;background:var(--redL);color:var(--red);border-radius:10px;font-size:13px}
 .del{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<header>
  <h1>🎯 Objetivos del equipo</h1>
  <p id="sub">Qué se ha propuesto cada comercial y qué priorizas tú</p>
  <a id="volver" href="#">← Volver al CRM</a>
</header>
<main><div class="estado" id="app">Cargando…</div></main>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const P=new URLSearchParams(location.search);
const UID=(P.get("uid")||"").trim();
const AGENTE=(P.get("agente")||"").toUpperCase().trim();
const ROL=(P.get("rol")||"").toLowerCase();
const EQUIPO=(P.get("equipo")||"").toUpperCase();
const VUELVE=P.get("vuelve")||"/";
document.getElementById("volver").href=VUELVE;

const U=(s)=>String(s||"").toUpperCase().trim();
const MAX=10;
const ANIO=new Date().getFullYear();

// Quién escala a quién
const esJefe   = ROL==="jefe"||ROL==="crm_jefe";
const esDir    = ROL==="director"||ROL==="crm_director";
const esCeo    = ROL==="ceo";
const ESCALA_A = esJefe ? "director" : esDir ? "ceo" : null;
const MI_NIVEL = esCeo ? "ceo" : esDir ? "director" : null;

function semanaISO(d){
  d=d||new Date();
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  const a=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t-a)/86400000)+1)/7);
}
const SEM_ACTUAL=semanaISO();
// El CRM puede pedir una semana concreta (al pulsar "Cerrar la semana")
let SEMANA=Number(P.get("semana"))||SEM_ACTUAL;
if(SEMANA<1||SEMANA>SEM_ACTUAL) SEMANA=SEM_ACTUAL;

function val(f){
  if(!f) return null;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.arrayValue!==undefined) return (f.arrayValue.values||[]).map(val);
  return null;
}
function toFields(o){
  const f={};
  for(const [k,v] of Object.entries(o)){
    if(v===null||v===undefined) continue;
    f[k]= typeof v==="number" ? {doubleValue:v}
        : typeof v==="boolean" ? {booleanValue:v}
        : {stringValue:String(v)};
  }
  return f;
}
async function leer(col){
  const t=[]; let tok=null,v=0;
  do{
    const r=await fetch(`${FB}/${col}?pageSize=300`+(tok?`&pageToken=${encodeURIComponent(tok)}`:""));
    if(!r.ok) break;
    const j=await r.json();
    for(const d of j.documents||[]){
      const o={_id:decodeURIComponent(d.name.split("/").pop())};
      for(const [k,x] of Object.entries(d.fields||{})) o[k]=val(x);
      t.push(o);
    }
    tok=j.nextPageToken||null; v++;
  }while(tok&&v<40);
  return t;
}
async function guardar(id,doc){
  const r=await fetch(`${FB}/objetivos_semana/${encodeURIComponent(id)}`,{
    method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({fields:toFields(doc)})});
  if(!r.ok) throw new Error("HTTP "+r.status);
}

let USUARIOS=[], OBJETIVOS=[], COMPROMISOS={}, ABIERTO=null;

async function cargarUsuarios(){
  const [us,pu]=await Promise.all([leer("usuarios"),leer("portal_users")]);
  const map={};
  [...us,...pu].forEach(u=>{
    const rol=String(u.rol||"").toLowerCase();
    if(rol!=="agente"&&rol!=="crm_agente"&&rol!=="comercial") return;
    const id=u.id||u._id||u.username;
    if(!id) return;
    if(!map[U(id)]) map[U(id)]={id:id,nombre:u.nombre||u.username||id,
      equipo:U(u.equipo||""),grupoAgente:u.grupoAgente||u.catalogoVendedor||""};
  });
  let lista=Object.values(map);
  // Un jefe solo ve su equipo; director y CEO ven todos
  if(esJefe&&EQUIPO) lista=lista.filter(u=>u.equipo===EQUIPO);
  lista.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return lista;
}

// Lo que cada comercial se propuso al cerrar la semana anterior
async function cargarCompromisos(){
  const res={};
  await Promise.all(USUARIOS.map(async a=>{
    const cod=U(a.grupoAgente||a.id);
    try{
      const r=await fetch(`${FB}/informes/informe_${encodeURIComponent(cod)}_s${SEMANA-1}`);
      if(!r.ok){ res[a.id]=[]; return; }
      const j=await r.json();
      let R={}; try{ R=JSON.parse(j.fields.respuestas.stringValue||"{}"); }catch(e){}
      const l=[];
      for(const k in R){
        const v=R[k]||{};
        if(!v.accion&&!v.texto) continue;
        if(/Ya lo sé|por perdida|por cerrada/i.test(v.accion||"")) continue;
        const p=k.split(/:(.+)/);
        l.push({clave:k,tipo:p[0],id:p[1]||"",accion:v.accion||"",
                texto:v.texto||"",nom:v.nom||""});
      }
      res[a.id]=l;
    }catch(e){ res[a.id]=[]; }
  }));
  return res;
}

function escalados(){ return OBJETIVOS.filter(o=>o.escaladoA===ESCALA_A); }

window.cambiarSemana=async(d)=>{
  const n=SEMANA+d;
  if(n<1||n>SEM_ACTUAL) return;
  SEMANA=n; ABIERTO=null;
  document.getElementById("app").innerHTML='<div class="estado">Cargando…</div>';
  await recargar();
};

window.toggleForm=(id)=>{ ABIERTO = ABIERTO===id ? null : id; pintar(); };

window.nuevoObjetivo=async(agId)=>{
  const ta=document.getElementById("ta-"+agId);
  const txt=(ta&&ta.value||"").trim();
  if(!txt) return;
  const btn=document.getElementById("bt-"+agId);
  btn.disabled=true; btn.textContent="Guardando…";
  const id="obj_"+agId+"_"+ANIO+"_s"+SEMANA+"_"+Date.now();
  const doc={id,agente:agId,semana:SEMANA,anio:ANIO,texto:txt,origen:"jefe",
    creadoPor:UID,creadoPorNombre:AGENTE,equipo:EQUIPO,
    fechaCreacion:new Date().toISOString()};
  try{
    await guardar(id,doc);
    OBJETIVOS.push(doc); ABIERTO=null; pintar();
  }catch(e){
    btn.disabled=false; btn.textContent="Asignar objetivo";
    alert("No se ha podido guardar: "+e.message);
  }
};

window.toggleEscalar=async(id)=>{
  const o=OBJETIVOS.find(x=>x.id===id); if(!o) return;
  const ya=o.escaladoA===ESCALA_A;
  if(!ya&&escalados().length>=MAX){ alert("Ya has subido el máximo de "+MAX+"."); return; }
  const upd=Object.assign({},o,{escaladoA:ya?"":ESCALA_A,
    escaladoPor:ya?"":UID,fechaEscalado:ya?"":new Date().toISOString()});
  Object.assign(o,upd); pintar();
  try{ await guardar(o.id,upd); }catch(e){ alert("Error al guardar: "+e.message); }
};

// Convierte un compromiso del cierre en objetivo escalable
window.escalarComp=async(agId,clave)=>{
  if(escalados().length>=MAX){ alert("Ya has subido el máximo de "+MAX+"."); return; }
  const comp=(COMPROMISOS[agId]||[]).find(c=>c.clave===clave); if(!comp) return;
  const ya=OBJETIVOS.find(o=>o.claveOrigen===clave&&o.agente===agId);
  if(ya){ return window.toggleEscalar(ya.id); }
  let h=0; for(let i=0;i<clave.length;i++){ h=((h<<5)-h)+clave.charCodeAt(i); h|=0; }
  const id="obj_"+agId+"_"+ANIO+"_s"+SEMANA+"_"+Math.abs(h);
  const doc={id,agente:agId,semana:SEMANA,anio:ANIO,
    texto:(comp.nom?comp.nom+" — ":"")+(comp.accion||"")+(comp.texto?": "+comp.texto:""),
    origen:"comercial",claveOrigen:clave,equipo:EQUIPO,
    escaladoA:ESCALA_A,escaladoPor:UID,fechaEscalado:new Date().toISOString(),
    fechaCreacion:new Date().toISOString()};
  OBJETIVOS.push(doc); pintar();
  try{ await guardar(id,doc); }catch(e){ alert("Error: "+e.message); }
};

window.borrar=async(id)=>{
  if(!confirm("¿Eliminar este objetivo?")) return;
  const o=OBJETIVOS.find(x=>x.id===id); if(!o) return;
  OBJETIVOS=OBJETIVOS.filter(x=>x.id!==id); pintar();
  try{ await guardar(id,Object.assign({},o,{eliminado:true})); }catch(e){}
};

// ── Cerrar la semana ────────────────────────────────────────────────────
// Un responsable no tiene clientes propios, así que su cierre consiste en
// dejar seleccionadas las 10 cosas más importantes de su equipo. Se guarda
// como informe (igual que el del comercial) y se marca su plan como cerrado,
// que es lo que desbloquea la semana siguiente en el CRM.
let CERRADA=false;

window.cerrarSemana=async()=>{
  const esc=escalados();
  if(!esc.length){ alert("Selecciona al menos una cosa antes de cerrar."); return; }
  if(!confirm(`Vas a cerrar la semana ${SEMANA} con ${esc.length} `
    +`objetivo(s) para ${ESCALA_A==="director"?"el Jefe de Ventas":"el CEO"}.\n\n`
    +`Después no se podrán cambiar. ¿Seguimos?`)) return;
  const btn=document.getElementById("btnCerrar");
  btn.disabled=true; btn.textContent="Cerrando…";
  try{
    const doc={
      id:`informe_${AGENTE}_s${SEMANA}`, agente:AGENTE, uid:UID,
      semana:SEMANA, anio:ANIO, equipo:EQUIPO, rol:ROL,
      estado:"enviado", tipo:"responsable",
      fechaEnvio:new Date().toISOString(),
      escalados:esc.length,
      // Lo prometido queda en el mismo formato que el del comercial, para que
      // "Mis objetivos" de la semana siguiente lo sepa leer sin cambios.
      respuestas: JSON.stringify(esc.reduce((acc,o,i)=>{
        acc["equipo:"+o.id]={accion:"Seguimiento",texto:o.texto,
          nom:(USUARIOS.find(u=>U(u.id)===U(o.agente))||{}).nombre||""};
        return acc;
      },{}))
    };
    const r=await fetch(`${FB}/informes/${encodeURIComponent(doc.id)}`,{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:toFields(doc)})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    // Marcar su plan como cerrado (mismo documento que comprueba el CRM)
    try{
      await fetch(`${FB}/planes_semanales/plan_${UID}_${ANIO}_s${SEMANA}`
        +`?updateMask.fieldPaths=estado&updateMask.fieldPaths=fechaCierre`,{
        method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{
          estado:{stringValue:"cerrado"},
          fechaCierre:{stringValue:new Date().toISOString()}}})});
    }catch(e){}
    CERRADA=true; pintar();
  }catch(e){
    btn.disabled=false; btn.textContent="Cerrar la semana";
    alert("No se ha podido cerrar: "+e.message);
  }
};

async function comprobarCerrada(){
  try{
    const r=await fetch(`${FB}/informes/informe_${encodeURIComponent(AGENTE)}_s${SEMANA}`);
    CERRADA = r.ok;
  }catch(e){ CERRADA=false; }
}

function pintar(){
  const app=document.getElementById("app");
  const esCerrada=SEMANA<SEM_ACTUAL;
  const esc=escalados();
  let h="";

  h+=`<div class="sem">
    <button onclick="cambiarSemana(-1)" ${SEMANA<=1?"disabled":""}>‹</button>
    <div class="t"><b>Semana ${SEMANA}</b>
      <span style="color:${esCerrada?"var(--muted)":"var(--green)"}">
        ${esCerrada?"Cerrada":"En curso"}</span></div>
    <button onclick="cambiarSemana(1)" ${SEMANA>=SEM_ACTUAL?"disabled":""}>›</button>
  </div>`;

  // Lo que le ha llegado desde abajo (director / CEO)
  if(MI_NIVEL){
    const recib=OBJETIVOS.filter(o=>o.escaladoA===MI_NIVEL);
    h+=`<div class="card recib">
      <h3>⬆️ Escalado hasta ti (${recib.length})</h3>`;
    h+= recib.length ? recib.map(o=>{
      const ag=USUARIOS.find(u=>U(u.id)===U(o.agente));
      return `<div class="item">
        <div style="flex:1;min-width:0">
          <p>${o.texto}</p>
          <small>${ag?ag.nombre:o.agente}${o.equipo?" · "+o.equipo:""}
            ${o.origen==="jefe"?" · ⭐ puesto por su responsable":""}</small>
        </div>
        ${ESCALA_A?`<button class="mini ${o.escaladoA===ESCALA_A?"on":""}"
          onclick="toggleEscalar('${o.id}')">
          ${o.escaladoA===ESCALA_A?"✓ Sube":"Subir"}</button>`:""}
      </div>`;
    }).join("") : `<p style="margin:0;font-size:12.5px;color:var(--muted)">
      Todavía no te ha subido nada nadie.</p>`;
    h+=`</div>`;
  }

  if(ESCALA_A){
    h+=`<div class="cont ${esc.length>=MAX?"lleno":""}">
      <span>Subes a ${ESCALA_A==="director"?"Jefe de Ventas":"CEO"}</span>
      <span>${esc.length} / ${MAX}</span></div>`;
    if(CERRADA){
      h+=`<div class="card" style="border-color:var(--green);background:var(--greenL)">
        <b style="font-size:13.5px;color:var(--green)">✅ Semana ${SEMANA} cerrada</b>
        <p style="margin:4px 0 0;font-size:12px;color:var(--muted)">
          Subiste ${esc.length} objetivo(s) a
          ${ESCALA_A==="director"?"el Jefe de Ventas":"el CEO"}.</p>
      </div>`;
    }
  }

  if(!USUARIOS.length){
    h+=`<div class="card vacia">No hay comerciales que mostrar.</div>`;
  }

  USUARIOS.forEach(ag=>{
    const suyos=OBJETIVOS.filter(o=>U(o.agente)===U(ag.id));
    const comps=COMPROMISOS[ag.id]||[];
    const total=suyos.length+comps.length;
    const vacio=total===0;
    h+=`<div class="card ag ${vacio?"vacio":""}">
      <div class="agh">
        <div style="min-width:0">
          <b>${ag.nombre}</b>
          <span class="est ${vacio?"alerta":""}">
            ${vacio?"⚠️ No se ha puesto ningún objetivo"
                   :total+" objetivo"+(total===1?"":"s")}</span>
        </div>
        <button class="add ${ABIERTO===ag.id?"on":""}" onclick="toggleForm('${ag.id}')">
          ${ABIERTO===ag.id?"Cancelar":"+ Objetivo"}</button>
      </div>`;

    if(ABIERTO===ag.id){
      h+=`<div class="form">
        <textarea id="ta-${ag.id}" rows="2"
          placeholder="Qué quieres que haga ${ag.nombre} esta semana"></textarea>
        <button class="guardar" id="bt-${ag.id}" onclick="nuevoObjetivo('${ag.id}')">
          Asignar objetivo</button>
      </div>`;
    }

    suyos.forEach(o=>{
      const sube=o.escaladoA===ESCALA_A;
      h+=`<div class="item">
        <div style="flex:1;min-width:0">
          <p>${o.origen==="jefe"?'<span style="color:var(--purple);font-weight:700">⭐ </span>':""}${o.texto}</p>
          ${o.origen==="jefe"?`<small>Puesto por ${o.creadoPorNombre||"el responsable"}</small>`:""}
        </div>
        ${ESCALA_A?`<button class="mini ${sube?"on":""}"
          ${!sube&&esc.length>=MAX?"disabled":""}
          onclick="toggleEscalar('${o.id}')">${sube?"✓ Sube":"Subir"}</button>`:""}
        ${o.origen==="jefe"&&U(o.creadoPor)===U(UID)
          ?`<button class="del" onclick="borrar('${o.id}')">🗑️</button>`:""}
      </div>`;
    });

    comps.forEach(c=>{
      const ex=OBJETIVOS.find(o=>o.claveOrigen===c.clave&&U(o.agente)===U(ag.id));
      const sube=ex&&ex.escaladoA===ESCALA_A;
      h+=`<div class="item">
        <div style="flex:1;min-width:0">
          <p>${c.nom?"<b>"+c.nom+"</b> — ":""}${c.accion}</p>
          ${c.texto?`<small>${c.texto}</small>`:""}
        </div>
        ${ESCALA_A?`<button class="mini ${sube?"on":""}"
          ${!sube&&esc.length>=MAX?"disabled":""}
          onclick="escalarComp('${ag.id}','${c.clave.replace(/'/g,"\\'")}')">
          ${sube?"✓ Sube":"Subir"}</button>`:""}
      </div>`;
    });

    h+=`</div>`;
  });

  // Cerrar la semana: solo si escala a alguien, la semana no está ya cerrada
  // y hay algo seleccionado.
  if(ESCALA_A&&!CERRADA){
    h+=`<div style="position:sticky;bottom:0;padding:12px 0 4px;
      background:linear-gradient(transparent,#F8FAFC 30%)">
      <button class="guardar" id="btnCerrar" onclick="cerrarSemana()"
        style="padding:14px;font-size:14px" ${esc.length?"":"disabled"}>
        ${esc.length?`Cerrar la semana ${SEMANA} con ${esc.length} objetivo(s)`
                    :"Selecciona lo que sube antes de cerrar"}</button>
      <p style="margin:7px 0 0;font-size:11px;color:var(--muted);text-align:center">
        Se enviarán a ${ESCALA_A==="director"?"el Jefe de Ventas":"el CEO"}
        y se dará por cerrada tu semana.</p>
    </div>`;
  }

  app.innerHTML=h;
}

async function recargar(){
  const objs=await leer("objetivos_semana");
  OBJETIVOS=objs.filter(o=>!o.eliminado&&Number(o.semana)===SEMANA&&Number(o.anio)===ANIO);
  COMPROMISOS=await cargarCompromisos();
  await comprobarCerrada();
  pintar();
}

(async()=>{
  try{
    if(!UID){ document.getElementById("app").innerHTML=
      `<div class="err">Falta identificar al usuario. Entra desde el CRM.</div>`; return; }
    document.getElementById("sub").textContent =
      esJefe ? "Tu equipo "+(EQUIPO||"") : esDir ? "Todos los equipos" : "Vista de dirección";
    USUARIOS=await cargarUsuarios();
    await recargar();
  }catch(e){
    document.getElementById("app").innerHTML=`<div class="err">No se ha podido cargar: ${e.message}</div>`;
  }
})();
</script>
