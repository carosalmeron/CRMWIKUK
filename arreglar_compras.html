<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arreglar Compras</title>
<style>
 :root{--papel:#F2F4F7;--tinta:#14181F;--tenue:#6B7684;--linea:#DCE1E7;
       --ok:#0E7C5A;--mal:#C2263D;--med:#B07908;--okL:#EDF7F3;--malL:#FEF2F4;--medL:#FFFBEB}
 *{box-sizing:border-box}
 body{margin:0;background:var(--papel);color:var(--tinta);max-width:760px;
   margin-inline:auto;padding:20px 14px 60px;
   font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 h1{margin:0 0 3px;font-size:21px;font-weight:800}
 .sub{margin:0 0 16px;font-size:13px;color:var(--tenue)}
 h2{font-size:15px;margin:22px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--linea)}
 .card{background:#fff;border:1px solid var(--linea);border-radius:8px;
   padding:13px 14px;margin-bottom:9px;font-size:13.5px}
 .card.ok{border-color:var(--ok);background:var(--okL)}
 .card.mal{border-color:var(--mal);background:var(--malL)}
 .card.med{border-color:var(--med);background:var(--medL)}
 code{background:#F1F5F9;padding:1px 6px;border-radius:4px;font-size:12px;
   font-family:ui-monospace,monospace}
 label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
 input{width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid var(--linea);
   font-size:15px;font-family:inherit}
 button{padding:12px 22px;border-radius:9px;border:none;background:var(--tinta);
   color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:14px}
 button:disabled{background:#94A3B8;cursor:default}
 .arbol{font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.9;
   background:#fff;border:1px solid var(--linea);border-radius:8px;padding:13px}
 .estado{padding:26px 4px;color:var(--tenue);text-align:center}
</style></head><body>
<h1>🛒 Arreglar Compras</h1>
<p class="sub">El departamento de Compras solo existe en el organigrama base del código,
  con un responsable de plantilla (<code>compras</code>) que no corresponde a ninguna persona.
  Por eso los partes de su equipo no llegan a nadie.</p>
<div id="app"><p class="estado">Comprobando…</p></div>

<script>
const FB="https://firestore.googleapis.com/v1/projects/grupo-consolidado-crm/databases/(default)/documents";
const NUEVO_RESP="resp_stk";   // Resp. Stock, la misma persona que lleva Compras

function val(f){
  if(!f) return null;
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.booleanValue!==undefined) return f.booleanValue;
  if(f.doubleValue!==undefined) return Number(f.doubleValue);
  if(f.integerValue!==undefined) return Number(f.integerValue);
  if(f.arrayValue!==undefined) return (f.arrayValue.values||[]).map(val);
  return null;
}
async function leerDoc(ruta){
  const r=await fetch(`${FB}/${ruta}`,{cache:"no-store"});
  if(!r.ok) return null;
  const j=await r.json(), o={_id:decodeURIComponent(j.name.split("/").pop())};
  for(const [k,v] of Object.entries(j.fields||{})) o[k]=val(v);
  return o;
}
async function leerCol(col){
  const r=await fetch(`${FB}/${col}?pageSize=300`);
  if(!r.ok) return [];
  const j=await r.json();
  return (j.documents||[]).map(d=>{
    const o={_id:decodeURIComponent(d.name.split("/").pop())};
    for(const [k,v] of Object.entries(d.fields||{})) o[k]=val(v);
    return o;
  });
}

let RESP=null, PORTAL=null, LOG=null;

(async()=>{
  const app=document.getElementById("app");
  try{
    const [dep,resp,portal,deps]=await Promise.all([
      leerDoc("departamentos/compras"), leerDoc("usuarios/"+NUEVO_RESP),
      leerDoc("portal_users/"+NUEVO_RESP), leerCol("departamentos")]);
    RESP=resp; PORTAL=portal;
    LOG=deps.find(d=>d._id==="logistica")||null;
    const email=(resp&&resp.email)||(portal&&portal.email)||"";
    const nombre=(resp&&resp.nombre)||(portal&&portal.nombre)||"Resp. Stock";

    let h=`<h2>Cómo está ahora</h2><div class="arbol">
      <span style="color:var(--mal)">✗ El departamento <code>compras</code> no está en la base de datos.</span><br>
      &nbsp;&nbsp;Responsable en el organigrama base: <code>compras</code>
      <span style="color:var(--mal)">· esa cuenta no existe</span><br>
      ${LOG?`&nbsp;&nbsp;└─ Logística <code>logistica</code> → resp. <code>${(LOG.responsableIds||[]).join(", ")||"—"}</code>`:""}
    </div>`;
    if(dep){
      h+=`<div class="card med">Ya existe un departamento <code>compras</code> en la base de datos
        (responsable: <code>${(dep.responsableIds||[]).join(", ")||"ninguno"}</code>).
        Se actualizará su responsable.</div>`;
    }
    h+=`<h2>Cómo quedaría</h2><div class="arbol">
      <b>Compras</b> <code>compras</code> → resp. <code>${NUEVO_RESP}</code>
      (${nombre})<br>
      ${LOG?`&nbsp;&nbsp;└─ Logística, como está`:""}
    </div>
    <div class="card med" style="margin-top:12px">Los partes y avisos del equipo de Compras
      pasarán a ${nombre}, que es quien lo lleva de verdad.</div>

    <h2>Su email</h2>
    ${email?`<div class="card ok">Ya tiene email: <b>${email}</b>. Si quieres cambiarlo, escríbelo abajo.</div>`
      :`<div class="card mal">No tiene email en ninguna de sus fichas: sin él, los avisos solo los verá dentro del CRM.</div>`}
    <label for="mail">Email de ${nombre}</label>
    <input id="mail" type="email" value="${email||""}" placeholder="nombre@unitedcaro.com">
    <button id="ok">Aplicar</button>`;
    app.innerHTML=h;
    document.getElementById("ok").onclick=aplicar;
  }catch(e){
    app.innerHTML='<div class="card mal">Error: '+e.message+'</div>';
  }
})();

async function aplicar(){
  const btn=document.getElementById("ok");
  const mail=document.getElementById("mail").value.trim();
  if(!confirm("Se pondrá a Resp. Stock como responsable del departamento de Compras"
    +(mail?", y se guardará su email":"")+".\n\nNo se borra nada. ¿Seguimos?")) return;
  btn.disabled=true; btn.textContent="Aplicando…";
  const errs=[], esc=(v)=>({stringValue:String(v||"")});
  try{
    const r=await fetch(`${FB}/departamentos/compras`,{method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:{
        id:esc("compras"), nombre:esc("Compras"), icon:esc("🛒"), color:esc("#0EA5E9"),
        padre:esc("direccion"),
        responsableIds:{arrayValue:{values:[esc(NUEVO_RESP)]}},
        tipologias:{arrayValue:{values:[esc("stock")]}},
        orden:{doubleValue:4}, activo:{booleanValue:true},
      }})});
    if(!r.ok) errs.push("departamento: HTTP "+r.status);

    if(mail){
      // El email se guarda en las dos fichas, para que lo encuentre en cualquiera
      for(const [col,existe] of [["usuarios",!!RESP],["portal_users",!!PORTAL]]){
        if(!existe) continue;
        const rr=await fetch(`${FB}/${col}/${NUEVO_RESP}?updateMask.fieldPaths=email`,{
          method:"PATCH",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({fields:{email:esc(mail)}})});
        if(!rr.ok) errs.push(col+": HTTP "+rr.status);
      }
    }
    btn.textContent = errs.length ? "Hecho con "+errs.length+" errores" : "✓ Aplicado";
    if(errs.length){ btn.disabled=false; alert(errs.join("\n")); }
    else document.getElementById("app").insertAdjacentHTML("beforeend",
      '<div class="card ok" style="margin-top:12px"><b>Listo.</b> Recarga el CRM: '
      +'los partes y avisos de Compras ya llegan a Resp. Stock'+(mail?', también por correo':'')+'.</div>');
  }catch(e){
    btn.disabled=false; btn.textContent="Aplicar";
    alert("Error: "+e.message);
  }
}
</script></body></html>
